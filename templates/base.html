{# The site's document.

   Overrides the kernel's templates/base.html by winning the TEMPLATES_DIR name
   collision, for one reason: the kernel's carries a ~350-line inline <style>
   block built on a blue palette and a neutral gray ramp. Extending it would put
   the site's terracotta on top of somebody else's blue, and every element the
   site had not thought to restyle would flash white under a dark system setting.
   There is no block to override it from — it is not in a block — so the document
   is replaced.

   What is kept, deliberately and verbatim in behaviour: the head metadata the
   route builds (<head> is not reachable from a plugin, so page_meta is the only
   way any of it gets there), hreflang alternates, feed autodiscovery, the
   favicon set, the skip link, the landmarks, the polite live region, and
   trovato.js. Dropping any of those would break something the kernel does for
   every site.

   No inline <style>. Every rule is in static/css/. #}
<!DOCTYPE html>
<html lang="{{ active_language | default(value='en') }}" dir="{{ text_direction | default(value='ltr') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if csrf_token is defined %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
    {% if hreflang_links is defined %}{% for alt in hreflang_links %}
    <link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.href }}">
    {% endfor %}{% endif %}
    <title>{% block title %}{{ title | default(value="Trovato") }}{% endblock %}</title>

    {# Head metadata for search engines and link unfurlers, built by the route in
       crates/kernel/src/content/page_meta.rs. Every absolute URL here resolves
       against SITE_URL, which the compose file sets to https://trovato.rs. #}
    {% if page_meta is defined %}
    {% if page_meta.description %}<meta name="description" content="{{ page_meta.description }}">{% endif %}
    {# SAFE: page_meta URLs are resolved and percent-encoded by url::Url, which
       cannot leave a quote or an angle bracket in the value. Emitted raw because
       Tera's escaper renders every `/` as `&#x2F;`, which naive unfurlers misread. #}
    {% if page_meta.canonical %}<link rel="canonical" href="{{ page_meta.canonical | safe }}">{% endif %}
    {% if page_meta.og_title %}<meta property="og:title" content="{{ page_meta.og_title }}">{% endif %}
    {% if page_meta.og_type %}<meta property="og:type" content="{{ page_meta.og_type }}">{% endif %}
    {# SAFE: as the canonical link above. #}
    {% if page_meta.og_url %}<meta property="og:url" content="{{ page_meta.og_url | safe }}">{% endif %}
    {% if page_meta.og_site_name %}<meta property="og:site_name" content="{{ page_meta.og_site_name }}">{% endif %}
    {% if page_meta.description %}<meta property="og:description" content="{{ page_meta.description }}">{% endif %}
    {# SAFE: as the canonical link above. #}
    {% if page_meta.og_image %}<meta property="og:image" content="{{ page_meta.og_image | safe }}">{% endif %}
    {% if page_meta.published_time %}<meta property="article:published_time" content="{{ page_meta.published_time }}">{% endif %}
    {% if page_meta.modified_time %}<meta property="article:modified_time" content="{{ page_meta.modified_time }}">{% endif %}
    <meta name="twitter:card" content="{% if page_meta.og_image %}summary_large_image{% else %}summary{% endif %}">
    {% endif %}

    {# RSS autodiscovery: one link per gather query that declares a feed.

       SAFE: a feed path is site config, and the kernel rejects one that is not
       absolute or that contains a route pattern before it registers the route
       (`routes::feed::is_valid_feed_path`). Emitted raw for the same reason the
       canonical link above is: Tera's escaper writes every `/` as `&#x2F;`, and
       while an HTML parser decodes that correctly, the readers and validators
       that scrape the tag with a regex do not. The kernel's own base.html
       escapes it, which is why every feed link in a stock Trovato head reads
       `&#x2F;rss&#x2F;blog.xml`. #}
    {% if feeds is defined %}{% for feed in feeds %}
    <link rel="alternate" type="application/rss+xml" title="{{ feed.title }}" href="{{ feed.path | safe }}">
    {% endfor %}{% endif %}

    {# The favicon is the tiled mark, not the bare glyph: at 16px a bare glyph
       turns to mush and the tile survives. See assets/brand/BRAND.md. #}
    <link rel="icon" type="image/svg+xml" href="/static/brand/trovato-favicon.svg">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/brand/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/brand/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/brand/trovato-appicon-180.png">

    {# The two faces are the first thing a reader waits on, so they are asked for
       before the stylesheet that references them. Both are same-origin. #}
    <link rel="preload" href="/static/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/site.css">
    <link rel="stylesheet" href="/static/css/code.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% block body %}
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="header">
        {% block header %}{% endblock %}
    </header>

    <main id="main-content" class="main">
        <div class="container">
            {% block messages %}
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="message message--{{ message.type | default(value='info') }}" role="status">
                    {{ message.text }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endblock %}

            {% block content %}
            {{ content | safe }} {# SAFE: kernel render pipeline output — sanitized via SAFE_TAGS and Tera autoescape #}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        {% block footer %}{% endblock %}
    </footer>
    {% endblock %}

    <div aria-live="polite" id="trovato-announcements" class="visually-hidden"></div>

    {% block scripts %}{% endblock %}
    <script src="/static/js/trovato.js"></script>
</body>
</html>
