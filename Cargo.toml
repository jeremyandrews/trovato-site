[workspace]
resolver = "2"
members = ["plugins/trovato_site", "checks", "tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The SDK comes from the public kernel repository, pinned by revision. Building
# this repository therefore needs no Trovato checkout and no credentials, only
# network access to github.com.
#
# The `rev` below is a literal because cargo cannot read a git dependency's
# revision out of another file. It is not authored here: `kernel-release.toml`
# holds the pinned release, `scripts/sync-kernel-release.sh` writes it onto this
# line and into every other file that names it, and the `kernel_release` test in
# the `checks` crate fails by name if any of those copies disagree. Move the pin
# with `scripts/sync-kernel-release.sh --set-version X.Y.Z`, never by hand here.
#
# After moving it, rebuild the overlay and bring the stack up from destroyed
# volumes rather than restarting it: a plugin is read at load.
trovato-sdk = { git = "https://github.com/jeremyandrews/trovato", rev = "20baa121810b5c656b3f80028335770069fab5e0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ureq = "3"
uuid = { version = "1", features = ["v5", "serde"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
