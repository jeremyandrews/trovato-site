[workspace]
resolver = "2"
members = ["plugins/trovato_site", "checks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The SDK comes from the public kernel repository, pinned by revision to the
# v0.101.0 tag. Building this repository therefore needs no Trovato checkout and
# no credentials — only network access to github.com.
trovato-sdk = { git = "https://github.com/jeremyandrews/trovato", rev = "5304a687192e49743daa0b63666e4d1afabc43eb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true
