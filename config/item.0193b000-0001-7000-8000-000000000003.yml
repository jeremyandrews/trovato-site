fields:
  body:
    value: |
      <p>trovato.rs is built as an external application on a published release image. It adds a plugin, some templates, a config set and its own static files, and it patches nothing in the kernel. Whatever it needed that the kernel did not have is written down rather than worked around.</p>
      <p>The site's own repository is <a href="https://github.com/jeremyandrews/trovato-site">jeremyandrews/trovato-site</a>.</p>
    format: filtered_html
  summary:
    value: The website is an external application on a released kernel, not a fork of it.
    format: plain_text
