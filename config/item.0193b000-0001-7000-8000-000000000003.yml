fields:
  body:
    value: |
      <p>This website runs on Trovato (a content management system written in Rust) exactly as released, so moving it to a new release took a change to one pinned version and a run of the site&#8217;s checks.</p>

      <p>A Trovato site lives in its own repository and runs beside the kernel, Trovato&#8217;s core. The kernel ships as a published release image, and this site is a separate repository that runs on that image without altering it, so building a site never involves cloning the kernel, adding your own code to it and running the result. Three environment variables are the whole integration. <code>PLUGINS_DIR</code>, <code>TEMPLATES_DIR</code> and <code>STATIC_DIR</code> are each a search path: a list of directories separated by colons and searched in order. This site sets each to the kernel&#8217;s own directory followed by its own, and a file in a later directory replaces a file of the same name in an earlier one.</p>

      <p>Four things get layered on that way.</p>

      <h2>A plugin</h2>

      <p>A plugin is how a site adds behaviour of its own, such as a new kind of content, a listing or a scheduled job. It is a WebAssembly module that implements named extension points, which Trovato calls taps. A plugin&#8217;s code runs only when the kernel calls one of its taps.</p>

      <p>This site&#8217;s plugin is <code>trovato_site</code>, about 1,400 lines of Rust. Through <code>tap_item_info</code> it declares <code>news</code> as a content type (one of the kinds of content the site holds), which is why this post is stored as a news item. The plugin also renders the listing of recent posts on the front page. It builds the sitemap, because the kernel&#8217;s own emits relative URLs and the protocol requires absolute ones. And each time the kernel runs its scheduled jobs, <code>tap_cron</code> brings the database&#8217;s copy of the site&#8217;s Italian translations into line with the configuration, for reasons explained in &#8220;What it cost&#8221;, below.</p>

      <p>Its manifest is the file listing what the plugin is allowed to use. It runs to 42 lines, about half of them comments explaining each choice. It names three host interfaces (groups of kernel functions, here database access, logging and site settings), three database tables, and the raw-SQL flag, which lets the plugin run SQL the kernel does not check against those tables. <a href="/blog/what-a-plugin-may-reach">What a plugin may reach</a> goes through what each of those means and why this one declares what it does.</p>

      <h2>Some templates</h2>

      <p>A template is an HTML file that turns content into a page. To change one, the site ships its own file with the same name in a directory later in the search path, and the kernel never knows the difference.</p>

      <p><code>base.html</code> and <code>page.html</code> replace the kernel&#8217;s own, which is where the site gets its head metadata, its navigation and its footer. The four files under <code>gather/</code> render the site&#8217;s lists of content, one per query in Gather, Trovato&#8217;s query engine. And <code>elements/item--docs.html</code>, which renders every documentation page on this site, ignores the kernel&#8217;s rendered <code>children</code> entirely and reads <code>item.fields.html</code> directly, because the documentation pages are rendered to finished HTML when they are copied in from Trovato&#8217;s repository. Running that HTML through the field pipeline would print the whole document twice, once escaped.</p>

      <h2>A config set</h2>

      <p>The <code>config/</code> directory holds the site&#8217;s content and settings as text, one YAML file per entity: 19 URL aliases, 17 menu links, 13 content items, 7 variables (stored site settings), 4 Gather queries, 2 languages and a role. Its <code>docs/</code> subdirectory holds 72 more: the 36 documentation pages copied in from Trovato&#8217;s repository, and their 36 URL aliases. Each entity has a stable ID, and the content items, menu links, aliases and role use UUIDs.</p>

      <p>So the configuration can be exported, reviewed in a pull request like anything else, and imported into the next environment unchanged. <code>./scripts/check-roundtrip.sh</code> checks that, and it is one of the site&#8217;s gates, the checks a change has to pass before it goes in: it exports the running site&#8217;s configuration and checks that every key this repository declares comes back with the same value. The front page says listings are configuration, and the round-trip check, which CI runs on every change, tests that claim.</p>

      <h2>Its own static files</h2>

      <p>The kernel ships a <code>static/</code> of its own, so the site&#8217;s entry in <code>STATIC_DIR</code> comes second and its files win by name: <code>tokens.css</code> and <code>site.css</code> for the theme, <code>code.css</code> for the syntax colours, Inter and JetBrains Mono, the brand SVGs, the generated illustrations, and <code>passkey-login.js</code>.</p>

      <p>The fonts live here, in the repository, instead of being fetched from anybody&#8217;s content delivery network. On every page that the gate below checks, nothing else is fetched from another origin either. <code>npm run shoot</code> is that gate: it loads one page of each kind, records every request, and fails the build if one of them leaves this site.</p>

      <h2>What it cost</h2>

      <p>Building this site found twenty-two things wrong with or missing from the kernel. They are listed in <code>docs/REPORT.md</code> in the site&#8217;s repository, each with its status re-derived against the release the site now runs: three fixed at 0.102.0, eighteen still open, and one that could not be reproduced and is recorded as such.</p>

      <p>Where the site could work around one, it did so in its own layer, with no patch to the kernel, and every one is written down.</p>

      <p>One finding is that static assets are rate-limited as though they were API calls, at 100 requests per minute per address, with no configuration to change it. The 101st request for a stylesheet returns 429. A page here pulls about ten subresources, so a reader gets roughly ten pages in before their fonts stop loading. The site&#8217;s answer is that the front proxy serves the site&#8217;s own files under <code>/static</code>, so the kernel sees only the few static requests for files it ships itself. The site&#8217;s accessibility pass and its crawl both hit the limit while checking this release.</p>

      <p>Another is that nothing in the kernel can write a content translation. Configuration import, the obvious candidate, stores the translations as one map keyed by language inside the item&#8217;s own fields. The renderer looks there for a value, finds a language code instead, and renders nothing in any language. The two administrative routes that would do it are registered only for <code>GET</code> and their templates are not in the image, and there is no API endpoint for it. So the site keeps its translations in configuration and its plugin&#8217;s <code>tap_cron</code> writes them into the <code>item_translation</code> table itself. That is why a table called <code>item_translation</code> appears in the manifest of a plugin that otherwise only reads.</p>

      <h2>What that buys</h2>

      <p>Because the kernel image is the published one, unchanged, and everything this site does is a file in a search path or a row in a config set, moving this site from 0.101.0 to 0.102.0 was a change to a pinned version and a run of the gates. The plugin compiled against the new kernel without a line changing, and three of the twenty-two findings were fixed, which meant three workarounds came out: a hardcoded Italian link in the footer of every page became a real per-page switcher, a paragraph of hand-written cross-language links came off the bottom of four Italian pages, and the Italian front page, written three weeks earlier and deliberately not committed because nothing would have read it, went in.</p>

      <p>The move to 0.102.0 also turned up seven things that were not on the original list at all, most of them places where the new release works something out, such as a page&#8217;s language or its translations, but does not pass it all the way to the theme that has to use it. Some of those needed answers of their own. Neither building the site on 0.101.0 nor moving it to 0.102.0 required touching the kernel, so there was no patch to unpick.</p>

      <p>The site&#8217;s own repository is <a href="https://github.com/jeremyandrews/trovato-site">jeremyandrews/trovato-site</a>, including the report and the build log.</p>
