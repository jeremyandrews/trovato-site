    <h2>4. The Tap System</h2>
    <h3>How Drupal 6 Taps Worked</h3>
    <p>In Drupal 6, taps were "magic functions." If you named a function <code>blog_node_view()</code> in your <code>blog.plugin</code> file, Drupal would call it when any item was viewed. The discovery mechanism was literally <code>function_exists()</code> at runtime.</p>
    <p>We can't do that in Rust/WASM. Instead, plugins declare their taps in <code>.info.toml</code>, and the Kernel builds a registry at startup.</p>
