    <h2>5. Inter-Plugin Communication</h2>
    <h3>The Mechanism</h3>
    <p>Plugins can invoke functions in other plugins directly via the <code>invoke_plugin</code> host function. This enables edge cases where synchronous plugin-to-plugin calls are necessary.</p>
    <h3>WIT Interface</h3>
    <figure class="code"><figcaption class="code__lang">wit</figcaption><pre class="code__body" tabindex="0" aria-label="wit code"><code class="language-wit">interface plugin-api {
        invoke: func(plugin-name: string, function-name: string, payload: string)
            -&gt; result&lt;string, string&gt;;
        plugin-exists: func(plugin-name: string) -&gt; bool;
    }
    </code></pre></figure><p><strong><code>invoke(plugin_name, function_name, payload) -&gt; Result&lt;String, String&gt;</code></strong></p>
    <p>Invokes an exported function in another plugin within the same request context. The payload is an arbitrary JSON string passed to the called plugin's function. Returns the function result as a JSON string, or an error.</p>
    <p><strong><code>plugin_exists(plugin_name) -&gt; bool</code></strong></p>
    <p>Checks if a plugin is installed and enabled. Useful for graceful degradation when an optional plugin is not available.</p>
    <h3>Implementation Details</h3>
    <ul>
    <li><strong>Routing:</strong> The Kernel's <code>invoke_plugin</code> host function retrieves the target plugin from the plugin registry. If a Store for that plugin is not yet instantiated in the per-request pool, it instantiates one. The target function is then called with the provided payload.</li>
    <li><strong>Context Sharing:</strong> Both caller and callee execute within the same <code>RequestState</code>, ensuring shared access to the database, Redis, user context, and request-scoped storage.</li>
    <li><strong>Error Handling:</strong> If the plugin does not exist or does not export the requested function, an error is returned. Plugin errors are also propagated back to the caller.</li>
    </ul>
    <h3>Guidelines for Use</h3>
    <p>Most inter-plugin communication happens through taps and shared database state, both of which are already supported:</p>
    <ul>
    <li>Use <strong>taps</strong> for event-driven hooks (item creation, rendering, menu customization).</li>
    <li>Use <strong>shared database state</strong> for inter-plugin data exchange and coordination.</li>
    <li>Use <strong>invoke_plugin</strong> only for exceptional cases where direct synchronous calls are necessary and cannot be expressed via existing mechanisms.</li>
    </ul>
    <h3>Phase Implementation</h3>
    <p><code>invoke_plugin</code> is implemented in Phase 4 alongside the Gather Query Engine and Categories module.</p>
