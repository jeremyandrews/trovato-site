    </span></code></pre></figure><h3>WASM Toolchain</h3>
    <p><strong>Decision: Core modules + wit-bindgen.</strong> Plugins compile to <code>wasm32-wasip1</code> (core modules, WASI Preview 1). The WIT file defines the interface contract. <code>wit-bindgen</code> generates Rust bindings on both sides:</p>
    <ul>
    <li><strong>Plugin side:</strong> <code>wit-bindgen</code> generates import stubs for host functions (item-api, db, cache, etc.) and export stubs that the <code>#[plugin_tap]</code> macro wraps around the developer's code.</li>
    <li><strong>Kernel side:</strong> <code>wit-bindgen</code> generates host function bindings that the Kernel implements, plus call stubs for invoking plugin exports.</li>
    </ul>
    <p>Memory management (alloc/dealloc, pointer/length passing) is handled by <code>wit-bindgen</code>'s generated code. Plugin authors never touch raw pointers. Kernel authors don't write <code>write_to_wasm</code>/<code>read_from_wasm</code> manually — <code>wit-bindgen</code> generates type-safe wrappers.</p>
    <p><strong>Why not the full Component Model?</strong> WASI Preview 2 and the component model canonical ABI are newer, and wasmtime's async support (critical for our SQLx bridge) is better tested with core modules. We use WIT as the interface definition regardless — migration to the component model in year two only changes the compilation target and runtime config, not the WIT file or plugin source code.</p>
    <p><strong>Fallback:</strong> If Phase 0 reveals that raw wasmtime + wit-bindgen is too much plumbing, Extism (a higher-level WASM host SDK) can be adopted mid-Phase-2 without changing the WIT file or plugin source code. Extism wraps wasmtime and handles memory/pooling automatically.</p>
