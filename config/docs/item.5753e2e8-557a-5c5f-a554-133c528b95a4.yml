    <h1>Trovato Design: Plugin &amp; Tap System</h1>
    <p><em>Sections 3-4 of the v2.1 Design Document</em></p>
    <hr />
    <h2>3. The Plugin System (WASM)</h2>
    <p>This is the hardest part of the whole project and the core of the architecture.</p>
    <h3>Why WASM</h3>
    <p>The requirement is that you can enable/disable plugins without recompiling the Kernel. In Rust, the options are:</p>
    <ol>
    <li><strong>Dynamic linking (dylib)</strong> — Rust has no stable ABI. A plugin compiled with one Rust version may not work with another. Not viable.</li>
    <li><strong>Scripting language (Lua, Rhai)</strong> — Works, but plugins would need to be written in a different language. Loses Rust's type system.</li>
    <li><strong>WebAssembly</strong> — Plugins are compiled to <code>.wasm</code>, loaded at runtime, executed in a sandbox. Can be written in Rust or any language that compiles to WASM. Interface is well-defined via WIT.</li>
    </ol>
    <p>WASM is the only option that gives us runtime loading, language flexibility, a security sandbox, and near-native performance.</p>
    <h3>The Concurrency Problem &amp; Solution</h3>
    <p>Wasmtime's <code>Store</code> is <code>!Send</code> and <code>!Sync</code>. We cannot share a Store across threads. A naive design that holds mutable <code>Store&lt;PluginState&gt;</code> per plugin in the <code>PluginRegistry</code> means only one request can invoke taps at a time. For a web server handling concurrent requests, this is a showstopper.</p>
    <p><strong>The Solution: Pooled Instantiation Model.</strong> We compile plugins once (the <code>Plugin</code> struct is <code>Send+Sync</code>). For <em>each HTTP request</em>, we grab a fresh <code>Store</code> from a pool, instantiate the plugin, run the taps, and drop the Store at the end of the request. The pooling allocator makes instantiation cheap (~5µs).</p>
    <h3>The Request State</h3>
    <p>This struct is passed to every tap invocation, ensuring isolation. It lazily instantiates only the plugins needed for that request.</p>
