    </span></code></pre></figure><h3>The WASM Proof-of-Concept (Phase 0)</h3>
    <p>The entire architecture depends on WASM working at acceptable latency. This is the single highest-risk component. Before writing any other code, spend the first two weeks proving or disproving this.</p>
    <p>Phase 0 has three critical objectives:</p>
    <ol>
    <li><p><strong>Benchmark handle-based vs. full-serialization data access.</strong> Under identical conditions (500 calls, 3 fields read + 1 field written per call), measure wall-clock time and p50/p95/p99 latency for both modes. If handle-based achieves &gt;5x speedup (expected), it becomes the default WIT pattern. If full-serialization is acceptable (&lt;1ms p95 for a 4KB payload), the simpler API may be preferred.</p>
    </li>
    <li><p><strong>Benchmark Store pooling under concurrency.</strong> 100 parallel requests, each instantiating a plugin, calling a tap, and returning. Measure p50/p95/p99 instantiation and execution latency per request. This validates that the pooled Store model scales.</p>
    </li>
    <li><p><strong>Validate async host functions.</strong> WASM → host function → SQLx query → return. Confirm no deadlocks under the Tokio runtime and measure latency.</p>
    </li>
    </ol>
    <h4>What to Build</h4>
    <p>A standalone Rust binary (not the full Kernel) that loads WASM plugins and exercises both data access modes under identical conditions. No database, no HTTP, no Redis. Just the WASM runtime, the RequestState, and the pooling allocator.</p>
    <h4>The Host Binary</h4>
    <ol>
    <li>Initialize Wasmtime with the pooling allocator enabled. Use the same <code>Engine</code> configuration planned for production.</li>
    <li>Load a test plugin compiled from a separate Rust crate targeting <code>wasm32-wasip1</code>.</li>
    <li>Register four host functions: <code>db_query</code> (returns canned JSON), <code>user_has_permission</code> (returns bool), <code>log_message</code> (prints to stderr), and <code>get_variable</code> (returns a string from a HashMap).</li>
    <li>Call the plugin's <code>tap_item_view</code> export with a realistic Item payload: a JSON object with 15 fields, including nested arrays and record references, totaling roughly 4KB serialized.</li>
    <li>Read back the modified payload and verify the plugin changed a specific field value.</li>
    <li>Repeat 500 times in a loop and measure wall-clock time. This simulates a Gather page rendering 50 items with 10 plugins each.</li>
    <li><strong>Benchmark <code>Store</code> pooling with high concurrency</strong> (100 parallel requests).</li>
    <li><strong>Validate async host functions</strong> (WASM → Rust → SQLx bridge).</li>
    <li><strong>Measure serialization overhead</strong> (passing 50KB JSON objects back and forth).</li>
    </ol>
    <h4>The Test Plugins</h4>
    <p>Two test plugins (or one plugin with two modes):</p>
    <p><strong>Handle-based test:</strong> Receives an item handle, calls <code>get-title</code> and <code>get-field-string("field_body")</code>, calls <code>user_has_permission</code> with a hardcoded permission string, if granted calls <code>set-field-string</code> to add a computed display title, and returns a JSON Render Element.</p>
    <p><strong>Full-serialization test:</strong> Receives the full Item JSON payload (same 4KB item, 15 fields), parses it with <code>serde_json</code>, calls <code>user_has_permission</code>, if granted adds a computed field, and returns the modified JSON.</p>
    <h4>Success Criteria</h4>
    <p>The spike produces a written recommendation on data access mode with benchmark numbers:</p>
    <ul>
    <li><strong>Handle-based:</strong> 500 calls measuring read (3 fields) + write (1 field) + return render element latency.</li>
    <li><strong>Full-serialization:</strong> 500 calls with identical 4KB payloads.</li>
    <li><strong>Hybrid:</strong> 500 calls where the plugin receives a handle, reads fields, but returns full JSON render output (bridges both modes).</li>
    </ul>
    <p>If handle-based achieves &gt;5x speedup or full-serialization remains &lt;1ms p95, the spike passes. This recommendation rewrites the data access section of the design if needed.</p>
    <p>Store pooling and async host functions should complete their 100-parallel and SQLx bridge benchmarks without deadlock and with latency &lt;10ms p95 per request.</p>
    <p>If all three objectives pass, no code is written yet. If any fails, evaluate Extism's higher-level abstractions. If that fails, fall back to an embedded scripting language (Rhai or Lua via mlua).</p>
    <h3>The Boundary Problem and Solution</h3>
    <p>Every call across the WASM boundary requires serialization. When the Kernel naively passes an Item to a plugin's <code>tap_item_view</code>, it must serialize the Item to bytes, write those bytes into the WASM plugin's linear memory, call the plugin's exported function with a pointer and length, read the response back out, and deserialize it.</p>
    <p>For a single call, this is fast (microseconds). For <code>tap_item_view</code> called on 50 items by 10 plugins, that's 500 serialize/deserialize cycles. At 0.5ms per cycle, that's 250ms of latency per page load.</p>
    <p><strong>The Solution: Handle-Based Access (Primary).</strong> Instead of serializing the entire Item, the Kernel passes an opaque handle (an integer). The plugin calls host functions like <code>get-field-string(handle, "title")</code> to read fields on demand. The Kernel looks up the handle in the per-request <code>RequestState</code>, fetches the field value from memory (no serialization), and returns it. Only the specific field value crosses the boundary, and only if the plugin asks for it.</p>
    <p>This is the default pattern, declared in <code>.info.toml</code> as <code>data_mode = "handle"</code>. For the common case — read a few fields, maybe modify one, return a render element — this eliminates serialization entirely.</p>
    <p><strong>Full Serialization (Fallback).</strong> For plugins that genuinely need bulk mutation or restructuring, the old pattern remains: pass the full JSON, get the full JSON back. These plugins declare <code>data_mode = "full"</code> and accept the cost.</p>
    <p><strong>Other Mitigation Strategies.</strong> Batch taps (<code>tap_item_view_multiple</code> with the full list) are also possible but less fine-grained. Selective host functions (e.g., <code>user_has_permission(uid, permission) -&gt; bool</code>) remain useful for any repeated operation that would otherwise cross the boundary multiple times.</p>
    <h3>Host Functions: Async/Sync Bridge</h3>
    <p>WASM is synchronous; <code>sqlx</code> is async. Calling <code>tile_on</code> inside a Tokio runtime to bridge sync WASM calls to async DB calls will deadlock unless you use <code>spawn_blocking</code> or a separate thread pool. We bridge this using Wasmtime's async support: the WASM guest sees a blocking call; the host suspends the WASM stack and awaits the Future.</p>
    <h3>Plugin Structure</h3>
    <p>A plugin is a separate Rust crate compiled to <code>wasm32-wasip1</code>:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>plugins/
      blog/
        blog.info.toml      # metadata
        blog.wasm            # compiled plugin
    </code></pre></figure><p>The <code>info.toml</code> file (replaces Drupal's <code>.info</code> files):</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;blog&quot;
    description = &quot;Provides a blog content type&quot;
    version = &quot;1.0.0&quot;
    dependencies = [&quot;item&quot;]

    [taps]
    implements = [
        &quot;tap_item_info&quot;,
        &quot;tap_item_view&quot;,
        &quot;tap_menu&quot;,
        &quot;tap_perm&quot;,
    ]

    # Optional: Declare data access mode per tap (default is &quot;handle&quot;)
    [taps.options]
    tap_item_view = { data_mode = &quot;handle&quot; }  # or &quot;full&quot; for bulk mutation
    </code></pre></figure><p>The <code>data_mode</code> option controls how the plugin receives data:</p>
    <ul>
    <li><code>"handle"</code> (default): Plugin receives an integer handle, calls host functions to read/write fields.</li>
    <li><code>"full"</code>: Plugin receives the complete JSON payload, returns modified JSON.</li>
    </ul>
    <h3>The WIT Interface (v2): Handle-Based Data Access</h3>
    <p>WIT (WebAssembly Interface Types) defines the contract between the Kernel and plugins. The primary pattern is handle-based data access: the Kernel passes opaque handles (integer IDs) to the plugin, and the plugin calls host functions to read or write individual fields. This eliminates bulk serialization overhead for the common case.</p>
    <p><strong>Handle-Based Mode (default).</strong> When a plugin declares <code>data_mode = "handle"</code> in its <code>.info.toml</code>, the Kernel passes an item handle instead of full JSON:</p>
    <figure class="code"><figcaption class="code__lang">wit</figcaption><pre class="code__body" tabindex="0" aria-label="wit code"><code class="language-wit">interface item-api {
        // Read
        get-title: func(item-handle: s32) -&gt; string;
        get-field-string: func(item-handle: s32, field-name: string) -&gt; option&lt;string&gt;;
        get-field-int: func(item-handle: s32, field-name: string) -&gt; option&lt;s64&gt;;
        get-field-json: func(item-handle: s32, field-name: string) -&gt; option&lt;string&gt;;
        get-type: func(item-handle: s32) -&gt; string;
        get-author-id: func(item-handle: s32) -&gt; string;

        // Write
        set-field-string: func(item-handle: s32, field-name: string, value: string);
        set-field-int: func(item-handle: s32, field-name: string, value: s64);
        set-field-json: func(item-handle: s32, field-name: string, value-json: string);
    }
    </code></pre></figure><p>The Kernel holds the actual Item in the <code>RequestState</code>. The handle is an index into a per-request <code>Vec&lt;Item&gt;</code>. No serialization unless the plugin asks for a specific field value.</p>
    <p><strong>Full Serialization Mode (opt-in).</strong> For plugins that need to restructure the entire item (e.g., migration, bulk transform), the full JSON pattern remains available. Plugins declare this via:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[taps]
    implements = [&quot;tap_item_view&quot;]

    [taps.options]
    tap_item_view = { data_mode = &quot;full&quot; }
    </code></pre></figure><p><strong>Rationale.</strong> A Gather query rendering 50 items with 10 plugins implementing <code>tap_item_view</code> produces 500 calls. Under full serialization at 0.5ms per round-trip (optimistic for a 4KB item), that's 250ms of pure serialization latency per page load. Handle-based access eliminates this for the common case (read a few fields, possibly modify one, return render output). Plugins that genuinely need bulk mutations opt into full serialization and accept the cost.</p>
    <p>The authoritative WIT interface (with all host functions and both handle-based/full-serialization exports) is in the <a href="/learn/design-plugin-sdk">Plugin SDK Spec</a>, Section 6.</p>
    <h3>Export Routing: Handle-Based vs Full-Serialization</h3>
    <p>The WIT world defines separate exports for each mode:</p>
    <figure class="code"><figcaption class="code__lang">wit</figcaption><pre class="code__body" tabindex="0" aria-label="wit code"><code class="language-wit">// Handle-based (default)
    export tap-item-view: func(item-handle: s32) -&gt; string;

    // Full-serialization (opt-in)
    export tap-item-view-full: func(item-json: string) -&gt; string;
    </code></pre></figure><p>A plugin only exports ONE variant — whichever its code uses. The routing works as follows:</p>
    <ol>
    <li><strong>At load time:</strong> The Kernel reads <code>data_mode</code> from <code>.info.toml</code>'s <code>[taps.options]</code> section and records it per plugin per tap.</li>
    <li><strong>At compile time (plugin side):</strong> The <code>#[plugin_tap]</code> macro determines which export to generate based on the function's parameter type: <code>&amp;ItemHandle</code> → generates <code>tap-item-view</code> (handle-based); <code>&amp;Item</code> → generates <code>tap-item-view-full</code> (full-serialization).</li>
    <li><strong>At dispatch time:</strong> The Kernel checks the recorded <code>data_mode</code> and calls the corresponding export name.</li>
    <li><strong>On mismatch:</strong> If <code>.info.toml</code> says <code>"handle"</code> but the plugin doesn't export <code>tap-item-view</code>, wasmtime returns a <code>MissingExport</code> error at first invocation. This is caught as a <code>PluginError</code> and logged. The fix is to align <code>.info.toml</code> with the function signature.</li>
    </ol>
    <h3>Store Reuse Within a Request</h3>
    <p>The <code>RequestState</code> keys stores by plugin name (see <code>get_or_create_store</code> above). This means:</p>
    <ul>
    <li><strong>Within a single request</strong>, if the same plugin handles two different taps (e.g., <code>tap_item_view</code> and <code>tap_menu</code>), the same <code>Store</code> and <code>Instance</code> are reused. The plugin's WASM linear memory persists across tap calls within that request. Plugins can use global variables for per-request state — similar to Drupal's <code>static</code> function variables.</li>
    <li><strong>Between requests</strong>, Stores are dropped and returned to the pool. No state carries over. Every request starts clean.</li>
    <li><strong>Between plugins</strong>, Stores are separate. Plugin A cannot access Plugin B's WASM memory. Communication between plugins uses host functions (<code>invoke_plugin</code>) or shared database state.</li>
    </ul>
    <h3>Stage Context in Tap Invocations</h3>
    <p>Every tap invocation runs within a stage context. The <code>stage_id</code> in <code>RequestState</code> determines which version of content the tap sees. When a tap calls <code>item_load</code> via a host function, the Kernel automatically applies stage overrides — the plugin doesn't need to know about stages.</p>
    <p>This means plugins are stage-transparent by default. A <code>tap_item_view</code> implementation that reads fields from an <code>ItemHandle</code> sees the stage version of those fields automatically. Plugins only need explicit stage awareness if they bypass the standard loading functions (e.g., using raw SQL queries).</p>
