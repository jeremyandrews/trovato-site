    <h1>Trovato Design: Gather Query Engine</h1>
    <p><em>Section 9 of the v2.1 Design Document</em></p>
    <hr />
    <h2>9. The Query Builder (Gather Engine)</h2>
    <h3>What Gather Actually Does</h3>
    <p>In Drupal 6, Gather is a plugin that lets you build database queries through a UI. Under the hood, it's a SQL query builder that starts with a base table, adds SELECT columns, WHERE clauses, ORDER BY, JOINs, contextual filters from the URL, LIMIT/OFFSET, then passes results through a style plugin for rendering.</p>
    <p>We use SeaQuery because it builds SQL as an AST rather than string concatenation — safe and dialect-agnostic.</p>
