    <p><strong>Performance note:</strong> The CTE adds overhead per query. For the Live stage (the common case), no CTE is needed — the query runs directly against the <code>item</code> table with <code>WHERE stage_id = 'live'</code>. The CTE only activates when a user is previewing a non-live stage.</p>
    <p>fn is_base_column(name: &amp;str) -&gt; bool {
    matches!(
    name,
    "id" | "current_revision_id" | "type" | "title" | "author_id"
    | "status" | "created" | "changed"
    | "promote" | "sticky"
    )
    }</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>
    ### JSONB Query Performance and Expression Indexes

    GIN indexes on JSONB work well for containment queries (`@&gt;` operator) but not for arbitrary path queries with comparison operators. For `field_price &gt; 100`, the GIN index won&#39;t help.

    For high-traffic Gather with complex field filters, admins can define &quot;Expression Indexes&quot; in the item type configuration. The Kernel manages the creation of these physical Postgres indexes:

    ```sql
    CREATE INDEX idx_node_price ON item (
        (fields-&gt;&#39;field_price&#39;-&gt;&gt;&#39;value&#39;)::integer
    );
    </code></pre></figure><p>This is a real limitation of the JSONB approach. EAV tables were slow for JOINs but fast for indexed lookups. JSONB is the opposite tradeoff. For most sites (low tens of thousands of items), JSONB is fine. For millions of items with complex field filters, you'll need expression indexes.</p>
    <p><strong>Materialized cache:</strong> For expensive Gather, cache results in Redis and invalidate on item save using cache tags (see Section 14).</p>
