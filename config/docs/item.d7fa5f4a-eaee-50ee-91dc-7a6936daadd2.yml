    <h2>Host function lifecycle</h2>
    <p>Host functions and taps follow four states:</p>
    <ol>
    <li><strong>experimental</strong> — available but may change without notice</li>
    <li><strong>stable</strong> — committed contract; changes only via deprecation</li>
    <li><strong>deprecated</strong> — still works, logs a warning naming the replacement and the
    removal version</li>
    <li><strong>removed</strong> — gone in the next MAJOR</li>
    </ol>
    <p>Deprecation lasts at least one MINOR before removal.</p>
    <h2>Docker images</h2>
    <ul>
    <li><strong>Release tags</strong> (<code>v0.101.0</code>): multi-platform (amd64 + arm64), tagged with the
