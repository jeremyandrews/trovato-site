    <h1>Versioning</h1>
    <p>Trovato has <strong>one version number</strong>. The kernel, the SDK crates, every plugin,
    every plugin manifest, the plugin API tuple and the Docker tags all carry it,
    and they all move together.</p>
    <!-- version:begin -->
    <p>At 0.105.0 the plugin API is <code>(0, 105)</code> and every manifest declares
    <code>api_version = "0.105"</code>. At 1.0.0 the API becomes <code>(1, 0)</code> and every manifest
    declares <code>"1.0"</code>. There is no case where one of these numbers moves and the
    others do not.</p>
    <!-- version:end -->
    <p>This is a deliberate simplification. Earlier in development there were four
    independent tracks (a kernel version, a plugin API version, an SDK crate version
    and a plugin version) and keeping them straight cost more than the flexibility
    was worth. A reader who knows which Trovato a site runs now knows exactly which
    plugin API it serves and which SDK its plugins were built against.</p>
    <h2>Where the number lives</h2>
    <p>The single source is <code>[workspace.package]</code> in the root <code>Cargo.toml</code>:</p>
    <!-- version:begin -->
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[workspace.package]
    version = &quot;0.105.0&quot;
    </code></pre></figure><!-- version:end -->
    <p>Every in-tree crate inherits it with <code>version.workspace = true</code>. No crate in the
    workspace declares its own version. Everything else derives from it, and the
    full list of places that move together is in <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/version-map.md">version-map.md</a>.</p>
    <h2>Semantics</h2>
    <p>The project version follows <a href="https://semver.org/">Semantic Versioning 2.0.0</a>:</p>
    <ul>
    <li><strong>MAJOR</strong>: breaking changes to the plugin contract, user-facing behaviour, the
    database schema, or the configuration format</li>
    <li><strong>MINOR</strong>: new features, admin pages, config entities, new host functions and
    taps (backward compatible)</li>
    <li><strong>PATCH</strong>: bug fixes, security fixes, performance improvements</li>
    </ul>
    <p>The version in <code>Cargo.toml</code> is the next release, not a count of changes. A pull
    request raises it only when it still equals the newest <code>v*</code> tag, which makes
    that pull request the first change after a release; once raised it is never
    raised again before it is tagged. The classes above decide how far the first
    raise goes; a new host function or manifest key added after it belongs to the
    version <code>main</code> already heads for. A change that would need a MAJOR while <code>main</code>
    heads for a MINOR is a stop for the maintainer, not a second bump.
    <code>scripts/version-check.sh</code> enforces this in CI.</p>
    <p>The plugin API tuple is the same version with the patch component dropped,
    declared as <code>KERNEL_API_VERSION</code> in <code>crates/kernel/src/plugin/mod.rs</code>, where it
    is derived from the crate version rather than written out:</p>
    <!-- version:begin -->
    <p><code>0.105.0</code> gives <code>(0, 105)</code>.</p>
    <!-- version:end -->
    <p><code>crates/kernel/src/plugin/mod.rs</code>.</p>
    <h2>Compatibility rule</h2>
    <p>At plugin install and enable time the kernel enforces:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Plugin API MAJOR == Kernel API MAJOR
    Plugin API MINOR &lt;= Kernel API MINOR
    </code></pre></figure><!-- version:begin -->
    <p>With a kernel at API 0.105:</p>
    <table><thead><tr><th>Plugin API</th><th>Compatible?</th><th>Reason</th></tr></thead><tbody>
    <tr><th>0.105</th><th>Yes</th><th>Exact match</th></tr>
    <tr><th>0.42</th><th>Yes</th><th>Same major, older minor: the kernel provides everything it asks for</th></tr>
    <tr><th>0.106</th><th>No</th><th>Needs host functions this kernel may not export</th></tr>
    </tbody></table>
    <!-- version:end -->
    <p>| 1.0 | No | Major version mismatch |</p>
    <p>The check runs before any expensive work (WASM compilation, migrations) and
    produces an error naming both versions.</p>
    <p>This is a compatibility gate, not a provenance check. It answers "does this
    kernel provide everything the plugin declared it needs", and nothing more.</p>
    <h2>The contract is frozen; the number is pre-1.0</h2>
    <p>The plugin boundary (the WIT surface, the <code>trovato-sdk</code> crate, the manifest
    semantics, the error vocabularies) was frozen before the first public release
    and does not change before 1.0.</p>
    <p>Read that alongside how SemVer treats 0.x versions, because the two do not line
    up. Under the 0.x rules a breaking change is permitted by a MINOR bump, so
    <code>cargo-semver-checks</code> in the <code>SDK Semver Gate</code> CI job <strong>cannot</strong> fail a break
    that moves one MINOR to the next. Before 1.0 the freeze is therefore policy, held by
    review, not by the tool. At 1.0.0 the tooling and the policy agree again, and a
    break requires a MAJOR bump plus a written justification.</p>
    <p>The short version: do not break the plugin contract. That the version number
    starts with a zero does not make it negotiable.</p>
    <h2>Plugin manifests</h2>
    <p>Plugins declare both numbers in <code>.info.toml</code>:</p>
    <!-- version:begin -->
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;my_plugin&quot;
    description = &quot;Example plugin&quot;
    version = &quot;0.105.0&quot;
    api_version = &quot;0.105&quot;
    </code></pre></figure><!-- version:end -->
    <ul>
    <li><code>version</code> is the plugin's own version. In-tree plugins carry the project
    version, because they are released as part of Trovato. An out-of-tree plugin
    is free to version itself however it likes.</li>
    <li><code>api_version</code> is the kernel API it targets. Every plugin, in-tree or not,
    declares the API it was built against.</li>
    </ul>
    <p>If <code>api_version</code> is omitted it defaults to the current kernel API.</p>
    <h2>Host function lifecycle</h2>
    <p>Host functions and taps follow four states:</p>
    <ol>
    <li><strong>experimental</strong> — available but may change without notice</li>
    <li><strong>stable</strong> — committed contract; changes only via deprecation</li>
    <li><strong>deprecated</strong> — still works, logs a warning naming the replacement and the
    removal version</li>
    <li><strong>removed</strong> — gone in the next MAJOR</li>
    </ol>
    <p>Deprecation lasts at least one MINOR before removal.</p>
    <h2>Docker images</h2>
    <p>Every image is built for amd64 and arm64.</p>
    <ul>
    <li><strong>Release tags</strong> (<code>vX.Y.Z</code>): tagged with the full version, with major.minor,
    and with <code>latest</code></li>
    <li><strong>Nightly builds</strong> (every push to <code>main</code>): tagged <code>nightly</code>, <code>nightly-&lt;sha&gt;</code>,
    and a version derived from the newest release tag</li>
    </ul>
    <p>While no <code>vMAJOR.MINOR.*</code> tag exists, which is the case whenever <code>main</code> heads
    for a new minor or major, a nightly is a SemVer prerelease of <code>MAJOR.MINOR.0</code>,
    so it sorts below that release whichever is published first:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>version = MAJOR.MINOR.0-nightly.&lt;commits since the previous v* tag&gt;
    </code></pre></figure><p>Once a <code>vMAJOR.MINOR.*</code> tag exists, a nightly is numbered from it:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>version = MAJOR.MINOR.(PATCH + commits since that tag)
    </code></pre></figure><p>That second form carries no such guarantee. After <code>v0.105.0</code>, the first commit
    on <code>main</code> publishes <code>0.105.1</code> and the second <code>0.105.2</code>, so while <code>main</code> heads
    for a patch release a nightly can take that release's number, or pass it,
    before the tag is pushed. Heading for a new minor avoids it.</p>
    <p><code>MAJOR.MINOR</code> is read from <code>[workspace.package] version</code> in <code>Cargo.toml</code> by
    <code>.github/workflows/docker-publish.yml</code>; the workflow carries no copy of it. See
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/version-map.md">version-map.md</a>.</p>
    <h2>Support policy</h2>
    <p>At most two active MAJOR versions:</p>
    <ul>
    <li><strong>Current major</strong>: bug fixes, security fixes, new features</li>
    <li><strong>Previous major</strong>: security fixes (12 months), critical bug fixes (6 months)</li>
    </ul>
    <p>Before 1.0 there is one active line and no back-porting.</p>
  markdown: |
    # Versioning

    Trovato has **one version number**. The kernel, the SDK crates, every plugin,
    every plugin manifest, the plugin API tuple and the Docker tags all carry it,
    and they all move together.

    <!-- version:begin -->
    At 0.105.0 the plugin API is `(0, 105)` and every manifest declares
    `api_version = "0.105"`. At 1.0.0 the API becomes `(1, 0)` and every manifest
    declares `"1.0"`. There is no case where one of these numbers moves and the
    others do not.
    <!-- version:end -->

    This is a deliberate simplification. Earlier in development there were four
    independent tracks (a kernel version, a plugin API version, an SDK crate version
    and a plugin version) and keeping them straight cost more than the flexibility
    was worth. A reader who knows which Trovato a site runs now knows exactly which
    plugin API it serves and which SDK its plugins were built against.

    ## Where the number lives

    The single source is `[workspace.package]` in the root `Cargo.toml`:

    <!-- version:begin -->
    ```toml
    [workspace.package]
    version = "0.105.0"
    ```
    <!-- version:end -->

    Every in-tree crate inherits it with `version.workspace = true`. No crate in the
    workspace declares its own version. Everything else derives from it, and the
    full list of places that move together is in [version-map.md](version-map.md).

    ## Semantics

    The project version follows [Semantic Versioning 2.0.0](https://semver.org/):

    - **MAJOR**: breaking changes to the plugin contract, user-facing behaviour, the
      database schema, or the configuration format
    - **MINOR**: new features, admin pages, config entities, new host functions and
      taps (backward compatible)
    - **PATCH**: bug fixes, security fixes, performance improvements

    The version in `Cargo.toml` is the next release, not a count of changes. A pull
    request raises it only when it still equals the newest `v*` tag, which makes
    that pull request the first change after a release; once raised it is never
    raised again before it is tagged. The classes above decide how far the first
    raise goes; a new host function or manifest key added after it belongs to the
    version `main` already heads for. A change that would need a MAJOR while `main`
    heads for a MINOR is a stop for the maintainer, not a second bump.
    `scripts/version-check.sh` enforces this in CI.

    The plugin API tuple is the same version with the patch component dropped,
    declared as `KERNEL_API_VERSION` in `crates/kernel/src/plugin/mod.rs`, where it
    is derived from the crate version rather than written out:

    <!-- version:begin -->
    `0.105.0` gives `(0, 105)`.
    <!-- version:end -->
    `crates/kernel/src/plugin/mod.rs`.

    ## Compatibility rule

    At plugin install and enable time the kernel enforces:

    ```
    Plugin API MAJOR == Kernel API MAJOR
    Plugin API MINOR <= Kernel API MINOR
    ```

    <!-- version:begin -->
    With a kernel at API 0.105:

    | Plugin API | Compatible? | Reason |
    |------------|-------------|--------|
    | 0.105 | Yes | Exact match |
    | 0.42 | Yes | Same major, older minor: the kernel provides everything it asks for |
    | 0.106 | No | Needs host functions this kernel may not export |
    <!-- version:end -->
    | 1.0 | No | Major version mismatch |

    The check runs before any expensive work (WASM compilation, migrations) and
    produces an error naming both versions.

    This is a compatibility gate, not a provenance check. It answers "does this
    kernel provide everything the plugin declared it needs", and nothing more.

    ## The contract is frozen; the number is pre-1.0

    The plugin boundary (the WIT surface, the `trovato-sdk` crate, the manifest
    semantics, the error vocabularies) was frozen before the first public release
    and does not change before 1.0.

    Read that alongside how SemVer treats 0.x versions, because the two do not line
    up. Under the 0.x rules a breaking change is permitted by a MINOR bump, so
    `cargo-semver-checks` in the `SDK Semver Gate` CI job **cannot** fail a break
    that moves one MINOR to the next. Before 1.0 the freeze is therefore policy, held by
    review, not by the tool. At 1.0.0 the tooling and the policy agree again, and a
    break requires a MAJOR bump plus a written justification.

    The short version: do not break the plugin contract. That the version number
    starts with a zero does not make it negotiable.

    ## Plugin manifests

    Plugins declare both numbers in `.info.toml`:

    <!-- version:begin -->
    ```toml
    name = "my_plugin"
    description = "Example plugin"
    version = "0.105.0"
    api_version = "0.105"
    ```
    <!-- version:end -->

    - `version` is the plugin's own version. In-tree plugins carry the project
      version, because they are released as part of Trovato. An out-of-tree plugin
      is free to version itself however it likes.
    - `api_version` is the kernel API it targets. Every plugin, in-tree or not,
      declares the API it was built against.

    If `api_version` is omitted it defaults to the current kernel API.

    ## Host function lifecycle

    Host functions and taps follow four states:

    1. **experimental** — available but may change without notice
    2. **stable** — committed contract; changes only via deprecation
    3. **deprecated** — still works, logs a warning naming the replacement and the
       removal version
    4. **removed** — gone in the next MAJOR

    Deprecation lasts at least one MINOR before removal.

    ## Docker images

    Every image is built for amd64 and arm64.

    - **Release tags** (`vX.Y.Z`): tagged with the full version, with major.minor,
      and with `latest`
    - **Nightly builds** (every push to `main`): tagged `nightly`, `nightly-<sha>`,
      and a version derived from the newest release tag

    While no `vMAJOR.MINOR.*` tag exists, which is the case whenever `main` heads
    for a new minor or major, a nightly is a SemVer prerelease of `MAJOR.MINOR.0`,
    so it sorts below that release whichever is published first:

    ```
    version = MAJOR.MINOR.0-nightly.<commits since the previous v* tag>
    ```

    Once a `vMAJOR.MINOR.*` tag exists, a nightly is numbered from it:

    ```
    version = MAJOR.MINOR.(PATCH + commits since that tag)
    ```

    That second form carries no such guarantee. After `v0.105.0`, the first commit
    on `main` publishes `0.105.1` and the second `0.105.2`, so while `main` heads
    for a patch release a nightly can take that release's number, or pass it,
    before the tag is pushed. Heading for a new minor avoids it.

    `MAJOR.MINOR` is read from `[workspace.package] version` in `Cargo.toml` by
    `.github/workflows/docker-publish.yml`; the workflow carries no copy of it. See
    [version-map.md](version-map.md).

    ## Support policy

    At most two active MAJOR versions:

    - **Current major**: bug fixes, security fixes, new features
    - **Previous major**: security fixes (12 months), critical bug fixes (6 months)

    Before 1.0 there is one active line and no back-porting.
