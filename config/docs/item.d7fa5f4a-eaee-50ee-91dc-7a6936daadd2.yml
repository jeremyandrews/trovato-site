    <h1>Versioning</h1>
    <p>Trovato has <strong>one version number</strong>. The kernel, the SDK crates, every plugin,
    every plugin manifest, the plugin API tuple and the Docker tags all carry it,
    and they all move together.</p>
    <p>At 0.101.0 the plugin API is <code>(0, 101)</code> and every manifest declares
    <code>api_version = "0.101"</code>. At 1.0.0 the API becomes <code>(1, 0)</code> and every manifest
    declares <code>"1.0"</code>. There is no case where one of these numbers moves and the
    others do not.</p>
    <p>This is a deliberate simplification. Earlier in development there were four
    independent tracks (a kernel version, a plugin API version, an SDK crate version
    and a plugin version) and keeping them straight cost more than the flexibility
    was worth. A reader who knows a site runs Trovato 0.101.0 now knows exactly which
    plugin API it serves and which SDK its plugins were built against.</p>
    <h2>Where the number lives</h2>
    <p>The single source is <code>[workspace.package]</code> in the root <code>Cargo.toml</code>:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">[workspace.package]
    version = &quot;0.101.0&quot;
    </code></pre></figure><p>Every in-tree crate inherits it with <code>version.workspace = true</code>. No crate in the
    workspace declares its own version. Everything else derives from it, and the
    full list of places that move together is in <a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/version-map.md">version-map.md</a>.</p>
    <h2>Semantics</h2>
    <p>The project version follows <a href="https://semver.org/">Semantic Versioning 2.0.0</a>:</p>
    <ul>
    <li><strong>MAJOR</strong>: breaking changes to the plugin contract, user-facing behaviour, the
    database schema, or the configuration format</li>
    <li><strong>MINOR</strong>: new features, admin pages, config entities, new host functions and
    taps (backward compatible)</li>
    <li><strong>PATCH</strong>: bug fixes, security fixes, performance improvements</li>
    </ul>
    <p>The plugin API tuple is the same version with the patch component dropped:
    <code>0.101.0</code> gives <code>(0, 101)</code>, declared as <code>KERNEL_API_VERSION</code> in
    <code>crates/kernel/src/plugin/mod.rs</code>.</p>
    <h2>Compatibility rule</h2>
    <p>At plugin install and enable time the kernel enforces:</p>
    <figure class="code"><pre class="code__body"><code>Plugin API MAJOR == Kernel API MAJOR
    Plugin API MINOR &lt;= Kernel API MINOR
    </code></pre></figure><p>With a kernel at API 0.101:</p>
    <table><thead><tr><th>Plugin API</th><th>Compatible?</th><th>Reason</th></tr></thead><tbody>
    <tr><th>0.101</th><th>Yes</th><th>Exact match</th></tr>
    <tr><th>0.42</th><th>Yes</th><th>Same major, older minor: the kernel provides everything it asks for</th></tr>
    <tr><th>0.102</th><th>No</th><th>Needs host functions this kernel may not export</th></tr>
    <tr><th>1.0</th><th>No</th><th>Major version mismatch</th></tr>
    </tbody></table>
    <p>The check runs before any expensive work (WASM compilation, migrations) and
    produces an error naming both versions.</p>
    <p>This is a compatibility gate, not a provenance check. It answers "does this
    kernel provide everything the plugin declared it needs", and nothing more.</p>
    <h2>The contract is frozen; the number is pre-1.0</h2>
    <p>The plugin boundary (the WIT surface, the <code>trovato-sdk</code> crate, the manifest
    semantics, the error vocabularies) was frozen before the first public release
    and does not change before 1.0.</p>
    <p>Read that alongside how SemVer treats 0.x versions, because the two do not line
    up. Under the 0.x rules a breaking change is permitted by a MINOR bump, so
    <code>cargo-semver-checks</code> in the <code>SDK Semver Gate</code> CI job <strong>cannot</strong> fail a break
    that moves 0.101 to 0.102. Before 1.0 the freeze is therefore policy, held by
    review, not by the tool. At 1.0.0 the tooling and the policy agree again, and a
    break requires a MAJOR bump plus a written justification.</p>
    <p>The short version: do not break the plugin contract. That the version number
    starts with a zero does not make it negotiable.</p>
    <h2>Plugin manifests</h2>
    <p>Plugins declare both numbers in <code>.info.toml</code>:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">name = &quot;my_plugin&quot;
    description = &quot;Example plugin&quot;
    version = &quot;0.101.0&quot;
    api_version = &quot;0.101&quot;
    </code></pre></figure><ul>
    <li><code>version</code> is the plugin's own version. In-tree plugins carry the project
