    <h2>Support policy</h2>
    <p>At most two active MAJOR versions:</p>
    <ul>
    <li><strong>Current major</strong>: bug fixes, security fixes, new features</li>
    <li><strong>Previous major</strong>: security fixes (12 months), critical bug fixes (6 months)</li>
    </ul>
