    <h2>Step 6: Comment Notifications</h2>
    <p>The notification system extends to comments: when someone comments on a conference you are subscribed to, you receive a notification.</p>
    <h3>How It Works</h3>
    <p>The <code>ritrovo_notify</code> plugin's <code>tap_item_insert</code> handler checks:</p>
    <ol>
    <li>Is the new item a <code>comment</code>?</li>
    <li>What conference does it belong to? (read <code>field_conference</code>)</li>
    <li>Who is subscribed to that conference?</li>
    <li>Queue a notification for each subscriber</li>
    </ol>
    <h3>Self-Notification Suppression</h3>
    <p>If you post a comment on a conference you are subscribed to, you do not receive a notification about your own comment. The plugin compares the comment author's user ID against the subscriber list and skips matches.</p>
    <h3>Digest Aggregation</h3>
    <p>Multiple comments on the same conference are grouped in the daily digest:</p>
    <ul>
    <li>"3 new comments on RustConf 2026" (with a link to the conference page)</li>
    <li>Not "Comment by Alice", "Comment by Bob", "Comment by Carol" separately</li>
    </ul>
    <h3>Published Comments Only</h3>
    <p>Notifications are sent only for published comments (<code>status = 1</code>). If comment moderation requires approval, the notification fires when the moderator approves, not when the comment is first submitted.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Post a comment (via UI) on a conference that editor_alice is subscribed to</span><span class="tok-comment tok-line tok-number-sign tok-shell">
