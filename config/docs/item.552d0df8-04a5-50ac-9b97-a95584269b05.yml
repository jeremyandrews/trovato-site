    <summary>Under the Hood: The Queue System</summary>
    <p>Trovato's queue system is backed by both PostgreSQL and Redis:</p>
    <ul>
    <li><strong><code>plugin_queue</code> table</strong> -- Persistent storage for queue items with <code>queue_name</code>, <code>data</code> (JSONB), <code>status</code>, <code>attempts</code>, <code>created</code>, and <code>locked_until</code> columns.</li>
    <li><strong>Redis</strong> -- Used for queue signaling (notify workers that items are available).</li>
    </ul>
    <p>The <code>tap_queue_worker</code> dispatch cycle:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Cron runs → dispatch tap_queue_worker for each queue
      → Lock N items (SET locked_until = NOW() + timeout)
      → Pass items to the plugin worker
      → On success: delete the queue item
      → On failure: increment attempts, unlock
      → After max attempts: move to dead letter (status = &#39;dead&#39;)
    </code></pre></figure><p>Queue items are processed serially within a queue to prevent ordering issues. Failed items are retried up to N times (configurable per queue), then dead-lettered for manual inspection.</p>
    <p>The <code>queue_push()</code> WASM host function lets plugins write to any queue by name. The producing plugin does not need to know which plugin consumes from that queue -- the queue name is the only coupling point.</p>
    </details>
    <hr />
    <h2>Step 5: Plugin-to-Plugin Communication</h2>
    <p>Three plugins now form a collaboration chain. This step demonstrates the full event flow from CFP deadline detection to user notification delivery.</p>
    <h3>The Event Flow</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>ritrovo_cfp (Part 6)                    ritrovo_notify (Part 6)
    ┌──────────────────┐                    ┌──────────────────┐
    │ tap_cron         │                    │ tap_queue_worker  │
    │  detects CFP     │── queue_push() ──→ │  reads event      │
    │  entering 7-day  │   &quot;ritrovo_       │  finds subscribers│
    │  window          │   notifications&quot;  │  sends email/     │
    └──────────────────┘                    │  queues digest    │
                                            └──────────────────┘
    </code></pre></figure><h3>No Direct Dependency</h3>
    <p>The key architectural insight: <code>ritrovo_cfp</code> writes to the <code>ritrovo_notifications</code> queue by name. <code>ritrovo_notify</code> reads from it by name. Neither plugin imports, references, or even knows about the other.</p>
    <p>This means:</p>
    <ul>
    <li>You can install <code>ritrovo_cfp</code> without <code>ritrovo_notify</code> -- events accumulate in the queue but nobody processes them</li>
    <li>You can install <code>ritrovo_notify</code> without <code>ritrovo_cfp</code> -- the notification worker processes whatever events arrive</li>
    <li>You can replace either plugin with a different implementation that uses the same queue name</li>
    </ul>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-06/conference-with-cfp.png"><img src="images/part-06/conference-with-cfp.png" width="600" alt="A conference detail page showing the CFP closing soon badge with deadline date"></a></p>
    <h3>Queue Message Format</h3>
    <p>Events on the <code>ritrovo_notifications</code> queue follow a common JSON format:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>event_type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>cfp_closing_soon<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>item_id<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>conference-uuid<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>metadata<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>conference_name<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>RustConf 2026<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>cfp_end_date<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>2026-04-15<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>days_remaining<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">6</span>
      </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>The <code>event_type</code> field tells the consumer how to handle the event. Different event types produce different notification templates.</p>
    <h3>Error Handling</h3>
    <ul>
    <li><strong>Failed notifications</strong> -- logged and retried on the next queue processing cycle</li>
    <li><strong>Poison messages</strong> -- malformed JSON or unknown event types are dead-lettered after max retries</li>
    <li><strong>Dead letter inspection</strong> -- dead-lettered items remain in <code>plugin_queue</code> with <code>status = 'dead'</code> for manual review</li>
    </ul>
    <h3>Testing the Flow</h3>
