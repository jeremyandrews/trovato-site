    <h1>Part 6: Community &amp; Plugin Communication</h1>
    <p>Part 5 opened the front door to user input with forms, rich text editing, and two new plugins. Part 6 turns Ritrovo into a community platform.</p>
    <p>Users will post <strong>threaded comments</strong> on conferences, <strong>subscribe</strong> to events they care about, and receive <strong>notifications</strong> when things change. Behind the scenes, three plugins cooperate through shared queues -- demonstrating the most sophisticated pattern in the Trovato plugin ecosystem: plugin-to-plugin communication without direct dependencies.</p>
    <p><strong>Start state:</strong> Form API, two plugin designs (<code>ritrovo_cfp</code>, <code>ritrovo_access</code>), user profile editing, no discussion features.
    <strong>End state:</strong> Threaded comments with moderation, user subscriptions, notification delivery via <code>ritrovo_notify</code>, plugin-to-plugin collaboration through shared queues.</p>
    <blockquote>
    <p><strong>Implementation note:</strong> The kernel has a comment model (<code>models/comment.rs</code>, 293 lines) with a full REST API (<code>routes/comment.rs</code>, 745 lines) and a threaded display template (<code>templates/elements/comments.html</code>). The <code>user_subscriptions</code> table exists with subscribe/unsubscribe/list operations (<code>models/subscription.rs</code>). The <code>ritrovo_notify</code> plugin (132 lines) provides notification infrastructure with queue workers. The queue system is shared with <code>ritrovo_importer</code>. All features described in this part are implemented.</p>
    </blockquote>
    <hr />
    <h2>Step 1: Threaded Comments</h2>
    <p>Comments are a third content type built on the same Item model as conferences and speakers. But unlike those types, comments have a self-referencing RecordReference field that creates threaded hierarchies.</p>
    <h3>The Comment Model</h3>
    <p>Comments are stored as items with type <code>comment</code> and three key fields:</p>
    <table><thead><tr><th>Field</th><th>Type</th><th>Purpose</th></tr></thead><tbody>
    <tr><th><code>field_body</code></th><th>TextValue (<code>filtered_html</code>)</th><th>Comment text</th></tr>
    <tr><th><code>field_conference</code></th><th>RecordReference</th><th>Parent conference being discussed</th></tr>
    <tr><th><code>field_parent</code></th><th>RecordReference (self)</th><th>Parent comment for threading (null = top-level)</th></tr>
    </tbody></table>
    <p>The <code>field_parent</code> self-reference is what makes threading work. A reply to a reply is simply a comment whose <code>field_parent</code> points to another comment rather than being null.</p>
