    <h3>Comment Permissions</h3>
    <p>The <code>ritrovo_access</code> plugin (Part 5) declares comment-related permissions:</p>
    <table><thead><tr><th>Permission</th><th>Who</th><th>What</th></tr></thead><tbody>
    <tr><th><code>post comments</code></th><th>authenticated + editor + publisher</th><th>Submit new comments</th></tr>
    <tr><th><code>edit own comments</code></th><th>authenticated + editor + publisher</th><th>Edit/delete own comments</th></tr>
    <tr><th><code>edit any comments</code></th><th>editor + publisher</th><th>Edit/delete any comment (moderation)</th></tr>
    </tbody></table>
    <p>Anonymous users can read published comments but cannot post.</p>
    <h3>Comment Form</h3>
    <p>Below each conference detail page, authenticated users with <code>post comments</code> see a comment form:</p>
    <ul>
    <li>Body field with <code>filtered_html</code> format (basic formatting, no arbitrary HTML)</li>
    <li>Hidden field for <code>field_conference</code> (the current conference UUID)</li>
    <li>Hidden field for <code>field_parent</code> (null for top-level, comment UUID for replies)</li>
    <li>CSRF token</li>
    <li>Reply links on existing comments that pre-fill <code>field_parent</code></li>
    </ul>
    <h3>Access Control</h3>
    <p>Comments use the standard Item access control chain. The <code>check_access()</code> model from Part 4 applies:</p>
    <ol>
    <li>Admin bypass</li>
    <li>Published view (anyone with <code>access content</code> can read published comments)</li>
    <li>Plugin hooks (<code>tap_item_access</code> from <code>ritrovo_access</code>)</li>
    <li>Role-based fallback (checking <code>edit own comments</code>, <code>edit any comments</code>, etc.)</li>
    </ol>
