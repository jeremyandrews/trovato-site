    <summary>Under the Hood: Why Comments Are Items</summary>
    <p>Comments could have been a separate table with their own model. Making them items has three advantages:</p>
    <ol>
    <li><p><strong>Access control for free.</strong> The entire <code>check_access()</code> pipeline -- admin bypass, plugin hooks, role-based fallback -- works on comments without any comment-specific code.</p>
    </li>
    <li><p><strong>Revisions for free.</strong> Every comment edit creates a revision, giving moderators an audit trail.</p>
    </li>
    <li><p><strong>Render pipeline for free.</strong> Comments go through the same Build &gt; Alter &gt; Sanitize &gt; Render pipeline, so <code>filtered_html</code> sanitization, <code>tap_item_view</code> hooks, and template resolution all apply.</p>
    </li>
    </ol>
    <p>The cost is that comments share the <code>item</code> table with conferences and speakers. For a tutorial-sized site this is fine. At scale, a denormalized comment table might be more efficient, but the access control and revision benefits are significant.</p>
    </details>
    <hr />
    <h2>Step 2: Comment Moderation</h2>
    <p>Editors need tools to manage comments across the site. The comment moderation queue provides a filtered view of recent comments with approve/delete actions.</p>
    <h3>Moderation Queue</h3>
    <p>The moderation view (accessible to users with <code>edit any comments</code>) shows:</p>
    <table><thead><tr><th>Column</th><th>Content</th></tr></thead><tbody>
    <tr><th>Conference</th><th>Title of the parent conference (linked)</th></tr>
    <tr><th>Author</th><th>Username of the commenter</th></tr>
    <tr><th>Date</th><th>Comment creation timestamp</th></tr>
    <tr><th>Body</th><th>Truncated preview of the comment text</th></tr>
    <tr><th>Actions</th><th>Approve, Delete</th></tr>
    </tbody></table>
    <p>The queue is filterable by date range and conference. It shows both published and unpublished comments, with unpublished comments highlighted for review.</p>
    <h3>Moderation Actions</h3>
    <table><thead><tr><th>Action</th><th>Effect</th><th>Security</th></tr></thead><tbody>
    <tr><th>Approve</th><th>Sets <code>status = 1</code> (published)</th><th>CSRF-protected POST</th></tr>
    <tr><th>Delete</th><th>Removes the comment (cascades to replies or re-parents them)</th><th>CSRF-protected POST with confirmation</th></tr>
    </tbody></table>
    <p>When a comment is deleted, its replies can either be:</p>
    <ul>
    <li><strong>Cascaded</strong> -- deleted along with the parent (simpler)</li>
    <li><strong>Re-parented</strong> -- promoted to the parent's level (preserves discussion)</li>
    </ul>
    <p>The default behavior is cascade deletion, which is simpler to reason about and prevents orphaned threads.</p>
    <h3>Flash Messages</h3>
    <p>After moderation actions, a flash message confirms the result: "Comment approved." or "Comment and 2 replies deleted."</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Moderation requires edit any comments permission (editor or publisher)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Admin always has access via is_admin bypass</span><span class="tok-comment tok-line tok-number-sign tok-shell">
