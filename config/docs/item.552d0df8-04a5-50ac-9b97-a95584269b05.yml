    <h2>What You've Built</h2>
    <p>By the end of Part 6, you have:</p>
    <ul>
    <li><strong>Threaded comments</strong> on conferences using recursive CTE queries, with <code>filtered_html</code> body text and per-comment access control.</li>
    <li><strong>Comment moderation</strong> with approve/delete actions, filterable queue, and cascade deletion.</li>
    <li><strong>User subscriptions</strong> with AJAX toggle, private "My Subscriptions" page, and privacy enforcement.</li>
    <li><strong><code>ritrovo_notify</code> plugin</strong> implementing subscription management, notification queuing, email delivery (console for tutorial, SMTP for production), and daily digest aggregation.</li>
    <li><strong>Plugin-to-plugin communication</strong> through shared queues: <code>ritrovo_cfp</code> produces events, <code>ritrovo_notify</code> consumes them, with zero coupling.</li>
    <li><strong>Comment notifications</strong> with self-notification suppression, digest aggregation, and moderation-aware delivery.</li>
    </ul>
    <p>You also now understand:</p>
    <ul>
    <li>How a recursive CTE builds threaded comment trees from flat database rows.</li>
    <li>How per-item access control lets different users read, post, edit, and delete comments based on their permissions.</li>
    <li>How the queue system enables decoupled plugin collaboration without shared code or imports.</li>
    <li>How <code>tap_cron</code> and <code>tap_queue_worker</code> cooperate for scheduled processing and event delivery.</li>
    <li>How three plugins (<code>ritrovo_access</code>, <code>ritrovo_cfp</code>, <code>ritrovo_notify</code>) work together through taps and queues with zero coupling.</li>
    </ul>
    <p>The plugin architecture has proven itself. Each plugin is independently deployable, testable, and understandable. The kernel dispatches, the queue connects, and plugins never need to know each other exist.</p>
