    <h2>Step 4: The <code>ritrovo_notify</code> Plugin</h2>
    <p>The <code>ritrovo_notify</code> plugin is the fourth Ritrovo plugin. It implements subscriptions, notification delivery, and digest emails.</p>
    <blockquote>
    <p>The <code>ritrovo_notify</code> plugin lives at <code>plugins/ritrovo_notify/src/lib.rs</code> (132 lines). It implements <code>tap_perm</code>, <code>tap_menu</code>, <code>tap_item_view</code> (subscribe toggle), and <code>tap_queue_info</code> (notification queue declaration).</p>
    </blockquote>
    <h3>What It Does</h3>
    <table><thead><tr><th>Tap</th><th>Behavior</th></tr></thead><tbody>
    <tr><th><code>tap_menu</code></th><th>Registers the <code>/user/{uid}/subscriptions</code> route</th></tr>
    <tr><th><code>tap_item_view</code></th><th>Injects Subscribe/Unsubscribe toggle button on conference detail pages</th></tr>
    <tr><th><code>tap_item_insert</code></th><th>When a comment is posted on a subscribed conference, queues notifications for subscribers</th></tr>
    <tr><th><code>tap_item_update</code></th><th>When a subscribed conference changes, queues notifications for each subscriber</th></tr>
    <tr><th><code>tap_queue_info</code></th><th>Declares the <code>ritrovo_notifications</code> queue</th></tr>
    <tr><th><code>tap_queue_worker</code></th><th>Processes notification events: sends email or queues for digest</th></tr>
    <tr><th><code>tap_cron</code></th><th>Daily digest aggregation -- batches pending notifications per user</th></tr>
    </tbody></table>
    <h3>Notification Flow</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Conference updated (dates change, venue change, CFP status)
      → tap_item_update fires in ritrovo_notify
      → Plugin queries user_subscriptions for this item
      → For each subscriber, pushes notification to ritrovo_notifications queue
      → tap_queue_worker picks up notification events
      → Sends email (immediate) or stores for digest (daily)
      → tap_cron (daily) aggregates pending digests and sends batch emails
    </code></pre></figure><h3>Email Delivery</h3>
    <p>For the tutorial, email delivery is handled by the kernel's email service. If no SMTP server is configured, emails are logged but not sent. In production, configure SMTP via environment variables:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>SMTP_HOST=smtp.example.com
    SMTP_PORT=587
    SMTP_USERNAME=notifications@example.com
    SMTP_PASSWORD=...
    SMTP_ENCRYPTION=starttls
    SMTP_FROM_EMAIL=notifications@ritrovo.example.com
    </code></pre></figure><p>The email service (<code>services/email.rs</code>) supports both plain text and HTML email bodies.</p>
    <h3>Notification Preferences</h3>
    <p>Users can set their notification preference in their profile:</p>
    <ul>
    <li><strong>Immediate</strong> -- each notification triggers an email</li>
    <li><strong>Daily digest</strong> -- notifications are batched and sent once per day</li>
    </ul>
    <p>The preference is stored in the user's JSONB <code>data</code> field:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>notification_preference<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>digest<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><h3>Building the Plugin</h3>
