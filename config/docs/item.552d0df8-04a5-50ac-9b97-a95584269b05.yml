    <h2>Step 3: User Subscriptions</h2>
    <p>Authenticated users can subscribe to conferences to receive notifications about changes.</p>
    <h3>Subscription Storage</h3>
    <p>Subscriptions will be stored in a <code>user_subscriptions</code> join table:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">TABLE</span> <span class="tok-entity tok-name tok-function tok-sql">user_subscriptions</span></span> (
        user_id UUID <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">REFERENCES</span> users(id),
        item_id UUID <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">REFERENCES</span> item(id),
        created <span class="tok-storage tok-type tok-sql">BIGINT</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>,
        <span class="tok-storage tok-modifier tok-sql">PRIMARY KEY</span> (user_id, item_id)
    );
    </span></code></pre></figure><blockquote>
    <p>The <code>user_subscriptions</code> table is created by the migration <code>20260315000001_create_user_subscriptions.sql</code>. The <code>Subscription</code> model in <code>models/subscription.rs</code> provides <code>subscribe()</code>, <code>unsubscribe()</code>, <code>is_subscribed()</code>, and <code>list_subscribers()</code> operations.</p>
    </blockquote>
    <p>The composite primary key prevents duplicate subscriptions.</p>
    <h3>Subscribe/Unsubscribe Toggle</h3>
    <p>Conference detail pages show a toggle button for authenticated users:</p>
    <ul>
    <li><strong>Not subscribed:</strong> "Subscribe" button</li>
    <li><strong>Subscribed:</strong> "Subscribed" button (visually distinct, click to unsubscribe)</li>
    </ul>
    <p>The toggle works via AJAX (POST with CSRF token, returns updated button HTML) with a progressive enhancement fallback (full page reload).</p>
    <h3>My Subscriptions Page</h3>
    <p>Each user has a private subscriptions page at <code>/user/{uid}/subscriptions</code> showing:</p>
    <ul>
    <li>Conference title (linked to detail page)</li>
    <li>Event dates</li>
    <li>Current stage badge</li>
    <li>Unsubscribe button</li>
    </ul>
    <p>Subscription privacy: users can only view their own subscriptions. Attempting to view another user's subscriptions returns 403.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Subscription table exists</span><span class="tok-comment tok-line tok-number-sign tok-shell">
