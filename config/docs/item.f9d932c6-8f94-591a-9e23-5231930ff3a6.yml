    <h1>Docker Development Guide</h1>
    <p>Trovato supports three Docker workflows depending on your needs.</p>
    <h2>Quick Reference</h2>
    <table><thead><tr><th>I want to...</th><th>Command</th><th>Needs Rust?</th></tr></thead><tbody>
    <tr><th>Develop Trovato natively</th><th><code>docker compose up -d</code></th><th>Yes</th></tr>
    <tr><th>Develop without installing Rust</th><th><code>docker compose --profile dev up -d</code></th><th>No</th></tr>
    <tr><th>Run a pre-built Trovato</th><th><code>docker compose --profile full up -d</code></th><th>No</th></tr>
    </tbody></table>
    <hr />
    <h2>Option 1: Native Development (Recommended)</h2>
    <p>For contributors with Rust installed. Docker provides only Postgres and Redis.</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Start database services</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose up<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>d</span></span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Build and run Trovato natively (fast incremental builds)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Visit http://localhost:3000/install</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>This is the fastest workflow — native <code>cargo build</code> uses incremental compilation, so rebuilds after code changes take seconds.</p>
    <p><strong>Prerequisites:</strong> Rust 1.85+ (<code>rustup</code>), <code>wasm32-wasip1</code> target (<code>rustup target add wasm32-wasip1</code>)</p>
    <hr />
    <h2>Option 2: Dev Container (No Rust Required)</h2>
    <p>For contributors who don't have Rust installed, or who want a reproducible development environment. The dev container provides the full Rust toolchain, clippy, rustfmt, WASM target, and database clients.</p>
    <h3>Command Line</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Start Postgres, Redis, and the dev container</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>profile</span> dev up<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>d</span></span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Open a shell in the dev container</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose exec dev bash</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Inside the container — full Rust toolchain available:</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> test<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>all</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> clippy<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>workspace</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>all-targets</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> -D warnings</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Run the server (accessible at http://localhost:3000 from your host)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato</span>
    </span></code></pre></figure><p>Your source code is mounted from the host at <code>/workspace</code>. Edit files with any editor on your host machine — changes are visible inside the container immediately.</p>
    <p>Build artifacts are stored in Docker volumes (<code>cargo-registry</code>, <code>cargo-git</code>, <code>target-dir</code>) so they persist across container restarts and incremental builds stay fast.</p>
    <h3>VS Code Dev Containers</h3>
    <p>If you use VS Code with the <a href="https://marketplace.visualstudio.com/items?itemName=ms-vscode-remote.remote-containers">Dev Containers extension</a>:</p>
    <ol>
    <li>Open the Trovato repo in VS Code</li>
    <li>VS Code detects <code>.devcontainer/devcontainer.json</code> and prompts "Reopen in Container"</li>
    <li>Click it — VS Code builds the dev container and connects</li>
    <li>The integrated terminal is inside the container with the full Rust toolchain</li>
    <li>rust-analyzer, clippy, and formatting work automatically</li>
    </ol>
    <h3>JetBrains (RustRover / IntelliJ)</h3>
    <p>JetBrains IDEs support Docker-based interpreters. Configure a Remote Rust Toolchain pointing to the <code>dev</code> service.</p>
    <h3>First Build</h3>
    <p>The first <code>cargo build</code> inside the dev container downloads and compiles all dependencies. This takes several minutes. Subsequent builds use cached artifacts and are much faster.</p>
