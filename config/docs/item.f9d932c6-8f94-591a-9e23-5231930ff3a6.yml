    </span></span></code></pre></figure><p>This pulls the <code>ghcr.io/jeremyandrews/trovato:nightly</code> image, which is built automatically from <code>main</code> on every push. The image includes the compiled kernel, all WASM plugins, templates, and static assets.</p>
