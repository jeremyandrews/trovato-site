    <h2>How This Maps to Existing Trovato Concepts</h2>
    <table><thead><tr><th>Drupal AI Concept</th><th>Trovato Equivalent</th><th>Notes</th></tr></thead><tbody>
    <tr><th>AI Provider plugin</th><th>Provider config in site config</th><th>No separate module per provider. Config-driven.</th></tr>
    <tr><th>Key module</th><th>Secure key store (env vars / vault)</th><th>Built into core, not a dependency</th></tr>
    <tr><th>AI Automators</th><th>Field rules in <code>trovato_ai</code> plugin</th><th>Taps + config, not a separate entity type</th></tr>
    <tr><th>AI Automator Chains</th><th>Field rules with weights</th><th>Lower weight runs first, can reference prior fields</th></tr>
    <tr><th>AI Assistant API</th><th><code>/api/v1/chat</code> endpoint</th><th>One endpoint, not three abstraction layers</th></tr>
    <tr><th>AI Assistant Actions</th><th><code>invoke_plugin</code> calls from chat handler</th><th>Existing mechanism, not a separate plugin type</th></tr>
    <tr><th>AI Chatbot frontend</th><th>Chat Tile in a Slot</th><th>Standard Tile, standard Slot assignment</th></tr>
    <tr><th>AI Search (vector DB)</th><th>Pagefind + AI query expansion (default); pgvector + <code>SemanticSimilarity</code> Gather op (upgrade)</th><th>Client-side first. No vector DB for most sites.</th></tr>
    <tr><th>AI CKEditor</th><th><code>tap_form_alter</code> + AI Assist buttons</th><th>Same UI, integrated via existing form system</th></tr>
    <tr><th>AI Content (taxonomy suggest, etc.)</th><th>Field rules on <code>tap_item_presave</code></th><th>Same result, existing tap system</th></tr>
    <tr><th>AI Validations</th><th>Field rules with <code>behavior = "validate"</code></th><th>Reuses existing Form API validation</th></tr>
    <tr><th>AI External Moderation</th><th>Field rule with <code>operation = "moderation"</code></th><th>Just another operation type</th></tr>
    <tr><th>ECA workflows</th><th>Tap system</th><th>Taps ARE the event system</th></tr>
    <tr><th>AI Agents + Modeler</th><th>Not needed</th><th>The tap system + <code>invoke_plugin</code> + Gather already provide orchestration</th></tr>
    </tbody></table>
    <hr />
    <h2>Design Decisions</h2>
    <h3>D1: pgvector with pluggable vector backend abstraction</h3>
    <p>pgvector is the default and ships with core. It's the right call -- Trovato already depends on PostgreSQL, and pgvector avoids operational complexity for the vast majority of sites. But the vector storage interface is abstracted behind a trait so that plugins can register alternative backends (Qdrant, Milvus, Weaviate) for sites that outgrow pgvector:</p>
