    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>The kernel:</p>
    <ol>
    <li>Resolves the provider for the requested operation type</li>
    <li>Injects the API key from the secure key store</li>
    <li>Makes the HTTP request (plugins can't make arbitrary HTTP requests to AI providers -- they go through this function)</li>
    <li>Enforces rate limits (per-provider, per-role, per-plugin)</li>
    <li>Logs the request for observability (token count, latency, model, calling plugin)</li>
    <li>Returns a normalized response</li>
    </ol>
    <p>This is the equivalent of Drupal's <code>getDefaultProviderForOperationType()</code>, but as a host function that any WASM plugin can call.</p>
    <h4>1.4 AI-Aware Permissions</h4>
    <p>New permissions declared via <code>tap_perm</code>:</p>
    <ul>
    <li><code>use ai</code> -- Base permission to trigger any AI operation</li>
    <li><code>use ai chat</code> -- Use chat/completion operations</li>
    <li><code>use ai embeddings</code> -- Use embedding operations</li>
    <li><code>use ai image generation</code> -- Use image generation</li>
    <li><code>configure ai</code> -- Admin: manage providers, keys, defaults</li>
    <li><code>view ai usage</code> -- Admin: view token usage, logs, costs</li>
    </ul>
    <p>These compose with existing role-based access. An editor with <code>use ai chat</code> can use AI-assisted content editing. An anonymous user without <code>use ai</code> cannot. Rate limits can differ per role (authenticated: 20 req/hr, editor: 100 req/hr, admin: unlimited).</p>
    <h3>Layer 2: AI Plugin (WASM)</h3>
    <p>A <code>trovato_ai</code> plugin that uses the core AI subsystem to provide user-facing features. This is the equivalent of Drupal's AI Automators + AI Content + AI CKEditor + AI Assistants in one coherent plugin.</p>
    <h4>2.1 Content Enrichment via Taps</h4>
    <p>The plugin implements taps that fire on standard content lifecycle events:</p>
    <p><strong><code>tap_item_presave</code></strong> -- Before an Item is saved, optionally run configured AI operations:</p>
    <ul>
    <li><strong>Summarization:</strong> If the <code>description</code> field changed and a <code>summary</code> field exists, generate a summary.</li>
    <li><strong>Taxonomy suggestion:</strong> Analyze text content, suggest categories from the existing taxonomy. Present as suggestions (not auto-applied) unless configured otherwise.</li>
    <li><strong>Alt-text generation:</strong> If an image file was uploaded without alt text, generate it.</li>
    <li><strong>Translation:</strong> If content is in a non-default language, queue a translation (or translate inline if configured).</li>
    <li><strong>Moderation:</strong> Run content through a moderation endpoint. Flag or block content that violates site policy.</li>
    </ul>
    <p>Each of these is a <strong>configurable rule</strong> on a per-field or per-item-type basis. The admin configures which AI operations run on which fields, with what prompts, in what order. This is the "automator" concept, but expressed as tap configuration rather than a separate entity type.</p>
    <p>Configuration stored as site config:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">[[ai.field_rules]]
    item_type = &quot;conference&quot;
    field = &quot;description&quot;
    trigger = &quot;on_change&quot;      # only when field value changes
    operation = &quot;chat&quot;
    prompt = &quot;Summarize this conference description in 2-3 sentences for a listing card.&quot;
    target_field = &quot;summary&quot;
    behavior = &quot;fill_if_empty&quot;  # or &quot;always_update&quot;
    weight = 10                 # ordering when multiple rules exist

    [[ai.field_rules]]
    item_type = &quot;conference&quot;
    field = &quot;description&quot;
    trigger = &quot;on_change&quot;
    operation = &quot;chat&quot;
    prompt = &quot;Suggest up to 3 topic categories from this list: {categories}. Return only the category names, comma-separated.&quot;
    target_field = &quot;topics&quot;
    behavior = &quot;suggest&quot;        # presents suggestions in UI, doesn&#39;t auto-apply
    weight = 20
    </code></pre></figure><p><strong><code>tap_item_view</code></strong> -- Inject AI-powered elements into the render tree:</p>
    <ul>
    <li>"Ask AI about this conference" expandable section on detail pages</li>
    <li>AI-generated "related conferences" suggestions (via embeddings similarity)</li>
    <li>Smart content warnings (via moderation API)</li>
    </ul>
    <p><strong><code>tap_form_alter</code></strong> -- Add AI assistance to forms:</p>
    <ul>
    <li>"AI Assist" button next to WYSIWYG fields (rewrite, expand, shorten, translate, adjust tone)</li>
    <li>"Suggest categories" button on taxonomy fields</li>
    <li>"Generate alt text" button on image upload fields</li>
    </ul>
    <h4>2.2 AI-Powered Search</h4>
    <p>Trovato's search architecture uses progressive enhancement: instant client-side results via Pagefind, with AI query expansion and streaming summaries layered on top. See <a href="/learn/design-search">search-architecture.md</a> for the full four-stage design.</p>
    <p><strong>Default path: Pagefind + AI query expansion</strong></p>
    <ul>
    <li>Pagefind (Rust/WASM) runs entirely in the browser. The search index is pre-built on content save and served as static files. Zero server load for basic search.</li>
    <li>AI query expansion adds semantic understanding at read time: the LLM expands "performance issues" into related terms ("site speed", "optimization", "bottleneck"), which feed back into Pagefind on the client. Multiple fast keyword searches, merged and re-ranked.</li>
    <li>AI summary generation streams a synthesized answer via SSE, with conversational follow-up.</li>
    <li>tsvector remains the server-side search backbone for Gather queries, API consumers, and admin search.</li>
    </ul>
    <p>This requires no embedding pipeline, no vector database, no chunking strategy. Intelligence is added at read time, not index time. The <code>trovato_search</code> plugin provides all four stages; no kernel changes needed.</p>
    <p><strong>Advanced path: Embeddings + Gather (upgrade)</strong></p>
    <p>For sites that outgrow keyword + expansion (millions of documents, heavy jargon mismatch, recommendation systems, multi-modal search):</p>
    <ul>
    <li>Embedding generation on Item save via <code>ai_request(operation: Embedding)</code></li>
    <li>pgvector stores embeddings alongside the existing tsvector index</li>
    <li><code>SemanticSimilarity</code> Gather operator: works like any other filter, composes with existing filters (stage-aware, role-aware, exposed)</li>
    <li>The <code>VectorStore</code> trait (see <a href="#d1-pgvector-with-pluggable-vector-backend-abstraction">D1</a>) allows plugin backends (Qdrant, Milvus) for sites that outgrow pgvector</li>
    <li>The summarization and conversation layers from the default path transfer over -- you're just swapping how results are found</li>
    </ul>
    <p><strong>RAG context for chat:</strong></p>
    <ul>
    <li>The chatbot runs a search query (Pagefind-sourced results or semantic Gather, depending on what's configured) to find relevant content</li>
    <li>Those results become context for the chat prompt</li>
    <li>Access control is enforced on the Gather query, so the chatbot never leaks content the user can't see</li>
    </ul>
    <h4>2.3 Conversational Interface (Chatbot)</h4>
    <p>A chatbot Tile that can be placed in any Slot:</p>
    <p><strong>Frontend:</strong> A simple chat interface rendered as a Tile (assignable to Sidebar, or as a floating widget via a dedicated Slot). No external JS framework dependency -- Tera template + vanilla JS + SSE (Server-Sent Events) for streaming responses.</p>
    <p><strong>Backend:</strong> The plugin implements:</p>
    <ul>
    <li><code>tap_menu</code> -- Registers <code>/api/v1/chat</code> endpoint (POST, streaming SSE response)</li>
    <li>Messages go through <code>ai_request(operation: Chat)</code> with:<ul>
    <li>System prompt configured by admin (site personality, instructions, boundaries)</li>
    <li>RAG context injected from semantic Gather query on user's message</li>
    <li>Conversation history (stored in session, configurable depth)</li>
    </ul>
    </li>
    <li>Rate limited per-role via existing Tower middleware</li>
    <li>Requires <code>use ai chat</code> permission</li>
    </ul>
    <p><strong>Actions (Tool Calling):</strong></p>
    <p>The chatbot can be configured with "actions" -- things it can do beyond answering questions:</p>
    <ul>
    <li><strong>Search content:</strong> Runs a Gather query based on user's request. "Find me Rust conferences in Europe" triggers a Gather with appropriate filters.</li>
    <li><strong>Subscribe/unsubscribe:</strong> If <code>ritrovo_notify</code> is enabled, the chatbot can toggle subscriptions. "Subscribe me to RustConf" calls <code>invoke_plugin("ritrovo_notify", "subscribe", data)</code>.</li>
    <li><strong>Navigate:</strong> Returns links to relevant pages. "Where can I submit a conference?" returns the submission form URL.</li>
    </ul>
    <p>Actions are declared as an enum in the plugin and described to the LLM via function-calling / tool-use in the system prompt. The LLM decides which action to invoke; the plugin executes it with full access control checks. This is the equivalent of Drupal's AI Assistant Actions, but using the existing <code>invoke_plugin</code> mechanism rather than a separate action plugin system.</p>
    <h4>2.4 Admin UI</h4>
    <p>Under Configuration &gt; AI:</p>
    <ul>
    <li><strong>Providers:</strong> Add/edit/remove AI providers. Select API key from key store. Set default models per operation type. Test connection.</li>
    <li><strong>Field Rules:</strong> Configure per-field AI operations (the automator equivalent). Visual list showing item_type &gt; field &gt; operation &gt; prompt &gt; target. Drag to reorder.</li>
    <li><strong>Chat Settings:</strong> System prompt, RAG configuration (which Item types to include, which fields to embed), conversation depth, available actions.</li>
    <li><strong>Usage &amp; Logs:</strong> Token usage over time, per-provider costs, request log with latency/model/plugin/user. Gander integration for profiling.</li>
    <li><strong>Rate Limits:</strong> Per-role AI rate limits (separate from REST API rate limits, though using the same Tower middleware).</li>
    </ul>
    <h3>Layer 3: What Stays in Core vs. Plugin</h3>
    <table><thead><tr><th>Concern</th><th>Where</th><th>Why</th></tr></thead><tbody>
    <tr><th>Provider registry + config</th><th>Core</th><th>Security: API keys never touch WASM boundary</th></tr>
    <tr><th><code>ai_request()</code> host function</th><th>Core</th><th>Security + abstraction: plugins can't make direct AI API calls</th></tr>
