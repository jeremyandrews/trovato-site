    <h4>1.2 Secure Key Store</h4>
    <p>API keys stored outside the database, similar to Drupal's Key module:</p>
    <ul>
    <li><strong>Environment variables</strong> (recommended for production)</li>
    <li><strong>Config file</strong> (for development -- <code>trovato.toml</code> or similar, gitignored)</li>
    <li><strong>External vault</strong> (HashiCorp Vault, AWS Secrets Manager -- stretch goal)</li>
    </ul>
    <p>Keys referenced by name in all config. Never stored in plain text in the database. Never exposed in admin UI after initial entry (masked display). Never accessible to WASM plugins -- the kernel handles all authenticated API calls.</p>
    <h4>1.3 Host Function: <code>ai_request()</code></h4>
    <p>The single integration point for plugins:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Plugin calls:
