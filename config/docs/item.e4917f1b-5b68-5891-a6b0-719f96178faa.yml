    <tr><th>Form alterations (AI Assist)</th><th>Plugin (<code>trovato_ai</code>)</th><th>Optional: UI enhancements</th></tr>
    <tr><th>Field rules config</th><th>Plugin (<code>trovato_ai</code>)</th><th>Site-specific: prompts, field mappings</th></tr>
    <tr><th>Chatbot Tile</th><th>Plugin (<code>trovato_ai</code>)</th><th>Optional: deployable via Slots</th></tr>
    <tr><th>MCP server</th><th>Plugin (<code>trovato_mcp</code>)</th><th>Optional: exposes existing API to external LLM tools</th></tr>
    <tr><th>Alternative vector backends</th><th>Plugin (e.g., <code>trovato_qdrant</code>)</th><th>Optional: registers via <code>tap_vector_store</code></th></tr>
    </tbody></table>
