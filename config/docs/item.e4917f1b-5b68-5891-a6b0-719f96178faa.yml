    <tr><th><code>SemanticSimilarity</code> Gather op</th><th>Core</th><th>Consistency: embeddings are just another filter type (upgrade path)</th></tr>
    <tr><th>Embedding model tracking</th><th>Core</th><th>Migration: stale detection, re-indexing queue (upgrade path)</th></tr>
    <tr><th>Pagefind index + client-side search</th><th>Plugin (<code>trovato_search</code>)</th><th>Default search UX: instant, zero server load</th></tr>
    <tr><th>AI query expansion + summaries</th><th>Plugin (<code>trovato_search</code>)</th><th>Progressive enhancement on top of Pagefind</th></tr>
    <tr><th>Content enrichment taps</th><th>Plugin (<code>trovato_ai</code>)</th><th>Configurability: rules are site-specific</th></tr>
