    <h1>Trovato AI Integration</h1>
    <p><strong>Status:</strong> Design complete
    <strong>Date:</strong> 2026-02-22
    <strong>Context:</strong> Inspired by Drupal's AI module ecosystem, adapted to Trovato's WASM plugin architecture, tap system, and existing concepts.</p>
    <hr />
    <h2>What Drupal Does (and What We Can Learn)</h2>
    <p>Drupal's <a href="https://www.drupal.org/project/ai">AI module</a> (stable since October 2025, 3,200+ production sites) is built around a <strong>provider abstraction layer</strong> that normalizes access to 48+ AI services through a unified API. The key pieces:</p>
    <ol>
    <li><p><strong>AI Core</strong> -- Provider plugin system. Each provider (OpenAI, Anthropic, Ollama, etc.) implements a standard interface for one or more "operation types" (chat, embeddings, text-to-image, speech-to-text, text-to-speech, moderation). Site builders pick a default provider per operation type. Swapping providers doesn't break site logic.</p>
    </li>
    <li><p><strong>Key module</strong> -- Centralized, secure API key storage. Keys stored in files, env vars, or external vaults. Providers reference keys by name, never by value in config.</p>
    </li>
    <li><p><strong>AI Automators</strong> -- Field-level AI integration. An automator links a prompt + source field to a target field. On entity save, the automator runs the prompt through the configured provider and populates the target. Automators can be chained (output of one feeds the next). This is the workhorse -- content summarization, taxonomy suggestion, alt-text generation, translation, tone adjustment.</p>
    </li>
    <li><p><strong>AI Assistant API + Chatbot</strong> -- Conversational interface. An assistant has a system prompt and a set of "actions" (plugin-based). The LLM decides which actions to invoke based on user input. The chatbot is a thin frontend; the assistant API is the orchestration layer.</p>
    </li>
    <li><p><strong>AI Search</strong> -- Embeddings + vector database integration via Search API. Content chunked, embedded, stored in Milvus/Pinecone/Qdrant. Enables semantic search and RAG (Retrieval-Augmented Generation) for chatbot context.</p>
    </li>
    <li><p><strong>AI CKEditor</strong> -- Inline AI in the rich text editor. Rewrite, translate, summarize, expand, adjust tone -- all without leaving the editor.</p>
    </li>
    <li><p><strong>AI Content</strong> -- Assistive tools for content editing: taxonomy suggestions, moderation checks, automatic alt-text, tone adjustment.</p>
    </li>
    <li><p><strong>AI Validations</strong> -- LLM-powered field validation rules.</p>
    </li>
    </ol>
    <h3>What's Good</h3>
    <ul>
    <li>Provider abstraction is the right core idea. Nobody wants vendor lock-in.</li>
    <li>Automators on fields are clever. They make AI invisible -- content just gets better as you save it.</li>
    <li>Chaining automators creates complex workflows from simple pieces.</li>
    <li>Search API integration for embeddings/RAG is well-thought-out.</li>
    <li>Key module as a separate dependency is clean separation of concerns.</li>
    </ul>
    <h3>What's Overengineered (for Trovato's Purposes)</h3>
    <ul>
    <li>The sheer number of sub-modules (AI Automators, AI Search, AI Assistants API, AI Chatbot, AI CKEditor, AI Content, AI Validations, AI External Moderation, AI Agents, AI Agents Explorer, AI Agents Modeler API...) is classic Drupal module sprawl. Many do one small thing.</li>
    <li>The "AI Agents" layer on top of "AI Assistants" on top of "AI Core" is three levels of abstraction where Trovato can do it in one.</li>
    <li>ECA (Event-Condition-Action) as the workflow engine is a Drupal-specific concept with no Trovato equivalent, and honestly, the tap system is cleaner.</li>
    </ul>
    <h3>The Trovato Opportunity</h3>
    <p>Trovato's WASM plugin architecture, tap system, and host functions give us a natural integration surface that Drupal has to bolt on. A Trovato AI plugin can be simpler, more integrated, and more powerful because:</p>
    <ul>
    <li><strong>Taps are the automator system.</strong> <code>tap_item_presave</code> already fires before save. An AI-powered tap that enriches content before save IS the automator, without a separate "automator" abstraction.</li>
    <li><strong>Host functions are the provider interface.</strong> An <code>ai_request()</code> host function is the clean equivalent of Drupal's provider abstraction -- one function, multiple backends, the kernel routes to the right provider.</li>
    <li><strong>Gather is already the query engine.</strong> RAG context retrieval can integrate with Gather rather than requiring a parallel "AI Search" module.</li>
    <li><strong>The permission system already exists.</strong> <code>tap_item_access</code> and role-based permissions handle who can use AI features -- no separate "AI governance" layer needed.</li>
    <li><strong>Rate limiting already exists.</strong> Tower middleware for the REST API handles rate limiting. AI endpoints get the same treatment.</li>
    </ul>
    <hr />
    <h2>Proposed Architecture</h2>
    <h3>Layer 1: AI Core (Kernel-Level)</h3>
    <p>This is NOT a plugin. It's a core Trovato subsystem, like caching or file storage. It provides:</p>
    <h4>1.1 Provider Registry</h4>
