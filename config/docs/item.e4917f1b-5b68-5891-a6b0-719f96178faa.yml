    </span></code></pre></figure><p>Core provides <code>PgVectorStore</code>. A plugin like <code>trovato_qdrant</code> could register an alternative via a new tap (e.g., <code>tap_vector_store</code>). The <code>SemanticSimilarity</code> Gather operator dispatches to whichever backend is active.</p>
    <h3>D2: SSE for streaming, not WebSockets</h3>
    <p>SSE (Server-Sent Events) is the streaming transport for chat responses. It's one-directional (server to client), runs over plain HTTP (no proxy/CDN issues), auto-reconnects, and is what every major LLM API uses. A chatbot is inherently request-response: the user POSTs a message, the server streams back tokens. There's no need for bidirectional streaming.</p>
    <p>If a future feature genuinely needs bidirectional streaming (not chat), WebSocket support can be added alongside SSE without replacing it.</p>
    <h3>D3: Granular token budget system</h3>
    <p>Token budgets are a first-class concept in the kernel. Budgets are per-vendor (because tokens mean different things to different providers) with per-role defaults and per-user overrides:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">[ai.budgets]
    period = &quot;monthly&quot;       # or &quot;daily&quot;, &quot;weekly&quot;
    action_on_limit = &quot;deny&quot; # or &quot;warn&quot;, &quot;queue&quot;

    [ai.budgets.defaults]
    # Per-vendor, per-role defaults
    openai.authenticated = 10_000
    openai.editor = 50_000
    openai.admin = 0          # 0 = unlimited
    anthropic.authenticated = 10_000
    anthropic.editor = 50_000
    anthropic.admin = 0

    # Per-user overrides in admin UI, stored in user Record:
    # user.ai_budget_override = { &quot;openai&quot;: 100_000 }
    </code></pre></figure><p>The kernel tracks token usage per request (from the provider's response metadata). When a role/user hits their budget, the configured action fires. The admin UI shows a usage dashboard with burn-down by provider, role, and user.</p>
    <p>Key points:</p>
    <ul>
    <li>Budgets are per-vendor because OpenAI tokens != Anthropic tokens != local model tokens</li>
    <li>Per-role defaults keep config manageable; per-user overrides handle exceptions</li>
    <li><code>action_on_limit</code> gives flexibility: hard deny, soft warning, or queue for later</li>
    <li>The usage log (already part of <code>ai_request()</code> observability) feeds the budget tracker</li>
    </ul>
    <h3>D4: Local models supported by kernel, not shipped</h3>
    <p>The provider config with <code>base_url</code> already supports local models (Ollama, vLLM, llama.cpp server, etc.). The kernel doesn't need special handling -- a local model is just another provider with a <code>base_url</code> pointing to <code>localhost</code>. A distribution or plugin could bundle a local model setup, but the core Trovato demo doesn't ship one. That's the right boundary: kernel enables it, ecosystem builds on it.</p>
    <h3>D5: MCP as a plugin</h3>
    <p>Trovato exposes an MCP (Model Context Protocol) server via a <code>trovato_mcp</code> plugin. This plugin surfaces existing kernel capabilities (content CRUD, Gather queries, search, user management) as MCP tools and resources. External LLM tools (Claude Desktop, Cursor, VS Code, etc.) connect to the Trovato site as an MCP server and interact with content through the standard API.</p>
    <p>The plugin:</p>
    <ul>
    <li>Registers MCP endpoints via <code>tap_menu</code></li>
    <li>Declares available tools based on installed plugins and their permissions</li>
    <li>Enforces access control through the same permission system (the MCP client authenticates as a user; that user's role determines what tools are available)</li>
    <li>Uses the existing REST API endpoints where they exist, adds MCP-specific wrappers where needed</li>
    </ul>
    <p>This is a separate plugin from <code>trovato_ai</code> -- MCP is about exposing Trovato to external AI tools, while <code>trovato_ai</code> is about bringing AI capabilities into Trovato. They can work together but neither depends on the other.</p>
    <h3>D6: Embedding model tracking with automatic migration</h3>
    <p>Each embedding row stores the model identifier alongside the vector:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">TABLE</span> <span class="tok-entity tok-name tok-function tok-sql">item_embeddings</span></span> (
        item_id UUID <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">REFERENCES</span> item(id),
        field_name <span class="tok-storage tok-type tok-sql">TEXT</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>,
        model <span class="tok-storage tok-type tok-sql">TEXT</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>,          <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> e.g. &quot;openai/text-embedding-3-small&quot;
    </span>    dimensions <span class="tok-storage tok-type tok-sql">SMALLINT</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>, <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> e.g. 1536
    </span>    embedding vector,             <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> pgvector column, dimension from config
    </span>    created_at <span class="tok-storage tok-type tok-sql">TIMESTAMP</span><span class="tok-storage tok-type tok-sql">TZ</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">DEFAULT</span> now<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>,
        <span class="tok-storage tok-modifier tok-sql">PRIMARY KEY</span> (item_id, field_name)
    );
    </span></code></pre></figure><p>When the admin changes the embedding model in config, the kernel:</p>
    <ol>
    <li>Marks all embeddings with the old model as stale</li>
    <li>Queues re-embedding jobs (using the existing queue system)</li>
    <li><code>SemanticSimilarity</code> queries filter on <code>model = current_model</code>, so stale embeddings are excluded from results</li>
    <li>As re-embedding completes, new rows replace old ones</li>
    <li>A progress indicator shows re-indexing status in the admin UI</li>
    </ol>
    <p>The pgvector column uses <code>vector</code> without a fixed dimension (or the column is recreated if the new model has different dimensions -- this is a migration, not a hot swap). The queue handles the API cost gradually rather than all at once.</p>
    <h3>D7: AI modules as kernel building blocks</h3>
    <p>All AI-related functionality builds on the kernel's AI subsystem. The <code>ai_request()</code> host function, provider registry, key store, token budgets, and embedding storage are building blocks that any plugin can use. There is no separate "AI integration" path.</p>
    <p>Specifically for Ritrovo: <code>ritrovo_translate</code> calls <code>ai_request(operation: Chat)</code> with a translation prompt rather than implementing its own LLM integration. Any plugin that needs AI capabilities -- translation, content enrichment, moderation, summarization -- calls the same <code>ai_request()</code> function and benefits from the same provider abstraction, key management, rate limiting, and budget tracking.</p>
    <p>This means:</p>
    <ul>
    <li>No plugin needs to manage its own API keys or provider connections</li>
    <li>Swapping AI providers is a single config change that affects all plugins</li>
    <li>Token budgets and rate limits apply uniformly across all AI usage</li>
    <li>The kernel's observability (logging, usage tracking) captures all AI operations regardless of which plugin initiated them</li>
    </ul>
    <h3>D8: Stage-based human-in-the-middle for all AI mutations</h3>
    <p>AI can generate, enrich, and transform content freely -- but it never publishes. Every AI-initiated content mutation flows through Trovato's Stage system, ensuring human review before anything reaches site visitors. See the Stage Architecture for the full Stage design, including the <code>StageVisibility</code> enum (<code>Internal</code>, <code>Public</code>, <code>Accessible</code>).</p>
    <p><strong>The principle:</strong> AI writes to <code>Internal</code> stages only. Humans promote to the <code>Public</code> stage. No exceptions.</p>
    <p><strong>How it works:</strong></p>
    <ul>
    <li><strong>Field rules with <code>behavior = "always_update"</code> or <code>"fill_if_empty"</code>:</strong> When AI auto-populates a field (summary, alt-text, translation), the change is written to the Item's current revision. If the Item is already in the <code>Public</code> stage, the AI change creates a new revision in the highest-sort-order <code>Internal</code> stage (the <code>highest_internal</code> policy -- typically Curated). The <code>Public</code> version is untouched until a human promotes the new revision. This is the same "stage a new version" workflow from the revision system: the <code>Public</code> revision stays visible while the AI-modified draft sits in an <code>Internal</code> stage awaiting review.</li>
    <li><strong>Field rules with <code>behavior = "suggest"</code>:</strong> No Stage concern -- suggestions are presented in the editor UI, never written to content automatically.</li>
    <li><strong>Field rules with <code>behavior = "validate"</code>:</strong> No Stage concern -- validation blocks or allows a save, it doesn't create content.</li>
    <li><strong>Batch AI operations (bulk import enrichment, batch translation):</strong> Items enter at the <code>default</code> stage (Incoming) with AI-enriched fields. Editors review in <code>Internal</code> stages before promoting to the <code>Public</code> stage. The standard editorial pipeline applies.</li>
    <li><strong>Chatbot actions (subscribe, search, navigate):</strong> These are read operations or user-scoped mutations (subscriptions). They don't modify published content, so no Stage gating needed.</li>
    </ul>
    <p><strong>Configuration:</strong></p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">[ai.staging]
    # When AI modifies a Public-stage item, what happens?
    public_item_behavior = &quot;highest_internal&quot;  # default: create new revision in highest-sort-order Internal stage
    # Other options:
    # &quot;in_place&quot; -- modify Public revision directly (opt-in, for low-risk fields like alt-text)
    # &quot;specific_stage&quot; -- create revision in a named stage (see ai.staging.target_stage)
    # target_stage = &quot;incoming&quot;  # only used when public_item_behavior = &quot;specific_stage&quot;

    # Per-field override
    [[ai.staging.overrides]]
    field = &quot;alt_text&quot;
    behavior = &quot;in_place&quot;  # alt-text is low-risk, can update Public revision directly

    [[ai.staging.overrides]]
    field = &quot;summary&quot;
    behavior = &quot;highest_internal&quot;  # summaries need human review

    [[ai.staging.overrides]]
    field = &quot;body&quot;
    behavior = &quot;specific_stage&quot;
    target_stage = &quot;incoming&quot;  # body changes are high-risk, full editorial pass
    </code></pre></figure><p><strong>Audit trail:</strong> Every AI-initiated change records the originating field rule, the AI model used, and the input/output in the revision metadata. The revision log shows "AI: auto-summary via openai/gpt-4o" alongside human edits. This makes it trivial to diff what the AI changed vs. what a human wrote, and to revert AI-specific changes without losing human edits.</p>
    <p><strong>Preview in production:</strong> Because AI changes land in <code>Internal</code> stages (not the <code>Public</code> stage), editors can preview AI-modified content on the production site using stage-scoped URLs. The Stage system already handles this: editors see <code>Internal</code> + <code>Public</code> stage content, anonymous users see <code>Public</code> stage only. AI-generated content is visible for review without a separate staging environment.</p>
    <hr />
    <h2>Phasing</h2>
    <p><strong>Phase A: Core foundation</strong> (can ship with Trovato Phase 4-5)</p>
    <ul>
    <li><code>ai_request()</code> host function</li>
    <li>Provider registry + config (TOML-based, <code>base_url</code> for local models)</li>
