    </span></code></pre></figure><h3>Ad-Hoc Query</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/gather/query
    Content-Type: application/json

    {
      &quot;definition&quot;: { &quot;base_table&quot;: &quot;item&quot;, &quot;item_type&quot;: &quot;blog&quot;, ... },
      &quot;display&quot;: { &quot;format&quot;: &quot;list&quot;, &quot;items_per_page&quot;: 10, ... },
      &quot;page&quot;: 1,
      &quot;stage&quot;: &quot;live&quot;,
      &quot;filters&quot;: {}
    }
    </code></pre></figure><p>Returns the same response shape as Execute Query.</p>
    <p>Requires <code>administer site</code>. Any other caller, including an anonymous one, gets a
    403 with a JSON <code>error</code> body. The endpoint runs a definition the caller wrote, so
    it takes the permission that guards the gather builder screens whose preview
    calls it.</p>
    <p>What a definition may read is checked on every gather, not only this one: named
    gathers, plugin-seeded and config-imported gathers, and includes are held to the
    same rules, and a definition that breaks them is refused before any SQL runs.</p>
    <ul>
    <li><code>base_table</code> is <code>item</code>. A lightweight-record gather names its <code>record_type</code>
    instead, and reads that record's table.</li>
    <li>A relationship may join only <code>item</code>, <code>item_translation</code>, <code>category</code>,
    <code>category_tag</code>, <code>category_tag_hierarchy</code>, <code>url_alias</code> or <code>file_managed</code>.</li>
    <li>No definition may read account, credential, token, permission or secret
    tables (<code>users</code>, <code>roles</code>, <code>api_tokens</code>, <code>oauth_client</code>, <code>webhook</code> and the
    rest of the list in <code>gather_service.rs</code>), nor any <code>pg_</code> or <code>_sqlx</code> table,
    whatever it names them as.</li>
    <li>A field, filter or sort may not name a column called <code>pass</code>, <code>password</code>,
    <code>secret</code> or <code>token</code>, or one ending in <code>_hash</code>, <code>_secret</code> or <code>_token</code>.</li>
    </ul>
