    <h1>Trovato CMS — API Reference</h1>
    <p>Trovato exposes a JSON API suitable for headless CMS usage. All endpoints
    accept and return <code>application/json</code> unless otherwise noted.</p>
    <h2>Conventions</h2>
    <ul>
    <li><p><strong>One prefix.</strong> Every kernel JSON endpoint is under <code>/api/v1</code> and answers
    with the <code>x-api-version: 1</code> header. The paths served before 1.x without the
    version (<code>/api/items</code>, <code>/api/search</code>, <code>/api/tokens</code>, ...) still answer, as
    deprecated aliases of the same handlers: each carries a <code>Deprecation: true</code>
    header, is marked <code>deprecated</code> in the OpenAPI document, and is removed at
    2.0. Plugin routes keep the paths their plugins declare.</p>
    </li>
    <li><p><strong>One list shape.</strong> Every list is a page:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span><span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>data<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-array tok-json"><span class="tok-punctuation tok-section tok-array tok-begin tok-json">[</span><span class="tok-invalid tok-illegal tok-expected-array-separator tok-json">.</span><span class="tok-invalid tok-illegal tok-expected-array-separator tok-json">.</span><span class="tok-invalid tok-illegal tok-expected-array-separator tok-json">.</span><span class="tok-punctuation tok-section tok-array tok-end tok-json">]</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>total<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">42</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>page<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">1</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>per_page<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">20</span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>and takes <code>page</code> (from 1) and <code>per_page</code>; <code>limit</code> and <code>offset</code> are accepted
    as their aliases. <code>per_page</code> is clamped to each list's maximum. <code>total</code> is
    the size of the matching set; on a list an access check thins after the
    query, a page may hold fewer entries than <code>per_page</code>.</p>
    </li>
    <li><p><strong>One error shape.</strong> Every error is an <code>AppError</code> body (<code>message</code>, and
    <code>errors</code> for a validation failure).</p>
    </li>
    <li><p><strong>One document.</strong> <code>GET /api/v1/openapi.json</code> is the OpenAPI 3.0 document,
    generated from the router: every kernel route, every alias (deprecated) and
    every enabled plugin's <code>api</code> routes.</p>
    </li>
    </ul>
    <hr />
    <h2>Authentication</h2>
    <h3>Session Cookies</h3>
    <p>Login with username/password to receive a session cookie:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /user/login/json
    Content-Type: application/json

    {&quot;username&quot;: &quot;admin&quot;, &quot;password&quot;: &quot;secret&quot;}
    </code></pre></figure><p><strong>Response (200):</strong></p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span><span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>success<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-language tok-json">true</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>message<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Login successful<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>The <code>Set-Cookie</code> header contains the session ID. Include <code>credentials: "include"</code>
    in fetch requests to send it cross-origin (requires specific CORS origins).</p>
    <h3>Bearer Tokens</h3>
    <p>For external frontends, Bearer tokens avoid cookie/CORS complexity.</p>
    <p><strong>Create a token</strong> (requires session auth):</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/tokens
    Content-Type: application/json
    Cookie: &lt;session&gt;

    {&quot;name&quot;: &quot;My Frontend&quot;}
    </code></pre></figure><p><strong>Response (201):</strong></p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span><span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>id<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>&lt;uuid&gt;<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>name<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>My Frontend<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>token<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>&lt;raw-token&gt;<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Save the <code>token</code> value — it is shown only once.</p>
    <p><strong>Use the token</strong> on any request:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/items
    Authorization: Bearer &lt;raw-token&gt;
    </code></pre></figure><h3>Logout</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /user/logout
    </code></pre></figure><hr />
    <h2>Common Patterns</h2>
    <h3>Pagination</h3>
    <p>List endpoints accept:</p>
    <table><thead><tr><th>Parameter</th><th>Default</th><th>Range</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>page</code></th><th>1</th><th>1+</th><th>1-indexed page number</th></tr>
    <tr><th><code>per_page</code></th><th>20</th><th>1–100</th><th>Results per page</th></tr>
    </tbody></table>
    <p><strong>Note:</strong> The Search API uses <code>limit</code> instead of <code>per_page</code> (see Search section).</p>
    <p>Response includes a <code>pagination</code> object (or top-level fields):</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>total<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">42</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>page<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">1</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>per_page<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">20</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>total_pages<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">3</span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><h3>Including Related Data</h3>
    <p>Some endpoints support <code>?include=author</code> (comma-separated). When included,
    the response embeds related objects instead of just IDs.</p>
    <h3>Error Responses</h3>
    <p>Every error from a kernel route is one JSON shape:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>code<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>not_found<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>message<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Comment not found<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>request_id<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>01a1fe41-419c-7007-8397-218151015cdd<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p><code>code</code> is machine-readable (<code>bad_request</code>, <code>unauthorized</code>, <code>forbidden</code>,
    <code>not_found</code>, <code>conflict</code>, <code>validation_failed</code>, <code>rate_limited</code>,
    <code>internal_error</code>, ...), <code>message</code> is safe to show a person, and <code>request_id</code>
    appears in the server log beside the failure. A validation failure adds
    <code>details</code>, one <code>{field, code, message}</code> per field. A <code>429</code> carries
    <code>Retry-After</code>.</p>
    <p><code>401</code> means nobody is signed in (no session, or the account is blocked or
    gone); <code>403</code> means a signed-in caller may not do this.</p>
    <p>Errors from a plugin's own API routes add <code>error</code>, the same string as
    <code>message</code>, for clients written before the shapes were unified; it goes away in
    2.0. The block editor's image upload keeps the Editor.js protocol's
    <code>{"success": 0}</code>, which the editor reads.</p>
    <h3>Timestamps</h3>
    <p>All timestamps are <strong>Unix epoch seconds</strong> (i64).</p>
    <h3>IDs</h3>
    <p>Most resource IDs are UUIDv7. Categories and queries use string identifiers.</p>
    <hr />
    <h2>Items</h2>
    <p>The item reads require <code>access content</code> (401 anonymous, 403 signed in), as
    the MCP tools do. A caller who is not the site administrator lists published
    items only, whatever <code>status</code> they ask for; an unpublished item they may see is
    reached by its id. A title longer than 1000 bytes is refused on every write
    path, and so is a search or autocomplete <code>q</code> longer than 1000 bytes.</p>
    <h3>List Items</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/items?page=1&amp;per_page=20&amp;include=author
    </code></pre></figure><table><thead><tr><th>Query Param</th><th>Type</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>type</code></th><th>string</th><th>Filter by content type</th></tr>
    <tr><th><code>status</code></th><th>i16</th><th>Filter by status</th></tr>
    <tr><th><code>author_id</code></th><th>UUID</th><th>Filter by author</th></tr>
    <tr><th><code>page</code></th><th>int</th><th>Page number (default 1)</th></tr>
    <tr><th><code>per_page</code></th><th>int</th><th>Results per page (default 20)</th></tr>
    <tr><th><code>include</code></th><th>string</th><th>Comma-separated: <code>author</code></th></tr>
    </tbody></table>
    <p><strong>Response (200):</strong></p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
