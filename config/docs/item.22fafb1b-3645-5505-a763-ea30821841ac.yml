    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Returns 200 when both backends are reachable, 503 otherwise.</p>
    <hr />
    <h2>CORS</h2>
    <p>Cross-origin requests are supported. Configure allowed origins via the
    <code>CORS_ALLOWED_ORIGINS</code> environment variable (comma-separated). Default: <code>*</code>
    (any origin, no credentials).</p>
    <p>When specific origins are configured, <code>Access-Control-Allow-Credentials: true</code>
    is set, enabling cookie-based auth cross-origin. Bearer tokens work regardless
    of CORS origin configuration.</p>
    <p>The session cookie's <code>SameSite</code> attribute defaults to <code>Strict</code>. Set
    <code>COOKIE_SAME_SITE=lax</code> if you need cookie-based cross-origin authentication.
    Bearer tokens (the recommended approach for external frontends) bypass cookies
    entirely and work with any <code>SameSite</code> setting.</p>
