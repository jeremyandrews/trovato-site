    <h2>API Tokens</h2>
    <p>All token management endpoints require an authenticated session.</p>
    <p>A person manages their own tokens at <code>/user/tokens</code>, linked from their account
    page (<code>/user/profile</code>). The page lists each token's name, when it was created,
    last used and expires; creates one (a name, and an optional expiry in days) and
    shows the raw token once; and revokes one. It calls the endpoints below with the
    page's CSRF token, so it does nothing an API client cannot.</p>
    <p>A token request is counted against its user's rate limit, at the count of the
    user's role (see "Rate Limits" in <code>INSTALL.md</code>).</p>
    <h3>Create Token</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/tokens
    Content-Type: application/json

    {&quot;name&quot;: &quot;My Frontend&quot;, &quot;expires_in_days&quot;: 90}
    </code></pre></figure><table><thead><tr><th>Field</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>name</code></th><th>string</th><th>yes</th><th>Display name (1–255 chars)</th></tr>
    <tr><th><code>expires_in_days</code></th><th>int</th><th>no</th><th>Days until expiry. Omit for no expiration</th></tr>
    </tbody></table>
    <p><strong>Response (201):</strong></p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>id<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>&lt;uuid&gt;<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>name<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>My Frontend<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>token<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>abcdef0123456789...<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>expires_at<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">1715000000</span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>The <code>token</code> field is the raw Bearer token — store it securely, it cannot be
    retrieved again. A maximum of 25 tokens per user is enforced.</p>
    <h3>List Tokens</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/tokens
