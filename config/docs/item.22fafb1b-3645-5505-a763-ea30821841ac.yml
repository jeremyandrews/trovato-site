    <hr />
    <h2>AI Assistant</h2>
    <p>Configuring one thing by conversation. Every route belongs to the conversation's
    owner and answers 404 to anybody else, administrators included. All four require
    authentication and the assistant to be enabled at
    <code>/admin/system/ai-assistant</code>.</p>
    <h3>Get a conversation</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/assistant/{conversation_id}
    </code></pre></figure><p>Returns the transcript, the proposals, the conversation's limits, and whether it
    is read-only. 404 unless the caller owns it.</p>
    <h3>Send a message</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/assistant/{conversation_id}/message
    X-CSRF-Token: &lt;token&gt;
    Content-Type: application/json

    {&quot;message&quot;: &quot;which devices have no owner?&quot;}
    </code></pre></figure><p>Returns <code>text/event-stream</code>. Each event is a JSON object with a <code>type</code>:
    <code>turn_start</code>, <code>tool_call</code>, <code>tool_result</code>, <code>proposal</code>, <code>assistant</code>, <code>note</code>,
    <code>done</code>, <code>error</code>. The message is 1 to 4096 characters; the body is capped at
    16 KiB. 409 when the conversation is read-only, 429 for the per-person rate
    limit or an exhausted token budget (<code>"category": "token_budget"</code>).</p>
    <h3>Apply or discard a proposal</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/assistant/{conversation_id}/proposals/{proposal_id}/apply
    POST /api/v1/assistant/{conversation_id}/proposals/{proposal_id}/discard
    </code></pre></figure><p>Takes either an <code>X-CSRF-Token</code> header with an empty body, or a
    <code>application/x-www-form-urlencoded</code> body with a <code>_token</code> field — the second is
    the no-JavaScript path, and it answers 303 back to the conversation page rather
    than JSON. Applying is the only thing anywhere that executes a write tool.
    409 if the proposal was already resolved, 404 if it is somebody else's.</p>
    <h3>Start over</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/assistant/{conversation_id}/reset
    </code></pre></figure><p>Closes the conversation, discards its outstanding proposals, and opens a fresh
    one with a new snapshot. Same two token paths, same two response shapes.</p>
    <hr />
    <h2>Autocomplete and media</h2>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/items/autocomplete?type=article&amp;q=ru&amp;per_page=10
    </code></pre></figure><p>Suggestions for a reference field: a page (the first only; at most 50) of
    <code>{"id", "title"}</code>. <code>type=category_term</code> answers category terms for a term
    reference field and takes <code>item_type</code>, <code>field</code>, <code>item</code> and <code>owner</code>.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/media/browse?page=1&amp;per_page=24&amp;type=image&amp;q=logo&amp;sort=newest
    </code></pre></figure><p>A page of the media library: <code>id</code>, <code>filename</code>, <code>mime_type</code>, <code>size</code>, <code>url</code>,
    <code>thumbnail_url</code>, <code>created</code>. Requires a signed-in caller.</p>
    <hr />
    <h2>Content locking</h2>
    <p>Served while <code>trovato_content_locking</code> is enabled (it is by default). The item
    edit forms take the lock when they open, show another editor's lock, refuse a
    save under it (409), and release it after a save; these three endpoints are
    what the form's script calls.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/lock/heartbeat
    POST /api/v1/lock/break
    POST /api/v1/lock/release
    X-CSRF-Token: &lt;token&gt;
    Content-Type: application/json

    {&quot;entity_type&quot;: &quot;item&quot;, &quot;entity_id&quot;: &quot;&lt;uuid&gt;&quot;}
    </code></pre></figure><p>Heartbeat extends the caller's own lock by 3 minutes (409 if they do not hold
    it); break needs <code>break content lock</code>; release frees the caller's own lock at
    once and is a no-op, not an error, if they do not hold it (it is what the form
    beacons on <code>pagehide</code>, so it fires whether or not a save already released the
    lock). All three answer <code>{"lock": "extended" | "broken" | "released", "csrf_token": "&lt;next token&gt;"}</code>: CSRF tokens are single use, so the answer
    carries the token for the next request.</p>
    <p><code>release</code> alone also accepts a form-urlencoded body with a <code>_token</code> field
    instead of the header, because <code>navigator.sendBeacon</code> — which is how the form
    sends this one, on <code>pagehide</code> — cannot set a custom header.</p>
    <hr />
    <h2>Dead-letter queue</h2>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET  /api/v1/queue/dlq?page=1&amp;per_page=50
    POST /api/v1/queue/dlq/{id}/requeue
    POST /api/v1/queue/dlq/{id}/delete
    </code></pre></figure><p>Requires <code>administer site</code>; the two writes also <code>X-CSRF-Token</code>. See
    <a href="/learn/plugin-queue#dead-letter-queue-dlq-observability">plugin-queue.md</a>.</p>
    <hr />
    <h2>Health</h2>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /health
    GET /health/live
    GET /health/ready
    </code></pre></figure><p><strong>Response to an anonymous caller (200 or 503):</strong></p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>status<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>healthy<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><ul>
    <li><code>/health</code> answers 200 (<code>healthy</code>) when Postgres and Redis are reachable, 503
    (<code>unhealthy</code>) otherwise.</li>
    <li><code>/health/live</code> answers 200 (<code>alive</code>) whenever the process answers, and
    checks nothing else.</li>
    <li><code>/health/ready</code> answers 200 (<code>ready</code>) when Postgres and Redis are reachable,
    the schema is migrated, plugins are loaded and the server is not draining,
    503 (<code>not ready</code>) otherwise.</li>
    </ul>
    <p>A caller on loopback with no forwarding header, or one sending
    <code>Authorization: Bearer $HEALTH_TOKEN</code>, gets more: <code>/health</code> adds <code>postgres</code>,
    <code>redis</code>, the pool statistics and the services report; <code>/health/ready</code> adds
    <code>postgres</code>, <code>redis</code> and <code>draining</code>; <code>/health/live</code> adds nothing. See
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/deployment/upgrades.md">deployment/upgrades.md</a>.</p>
    <hr />
    <h2>CORS</h2>
    <p>Cross-origin requests are supported. Configure allowed origins via the
    <code>CORS_ALLOWED_ORIGINS</code> environment variable (comma-separated). Default: <code>*</code>
    (any origin, no credentials).</p>
    <p>When specific origins are configured, <code>Access-Control-Allow-Credentials: true</code>
    is set, enabling cookie-based auth cross-origin. Bearer tokens work regardless
    of CORS origin configuration.</p>
    <p>The session cookie's <code>SameSite</code> attribute defaults to <code>Strict</code>. Set
    <code>COOKIE_SAME_SITE=lax</code> if you need cookie-based cross-origin authentication.
    Bearer tokens (the recommended approach for external frontends) bypass cookies
    entirely and work with any <code>SameSite</code> setting.</p>
