    <p>Requires authentication. <code>subject</code> is optional plain text (never a text
    format), trimmed, capped at 255 characters, and absent when empty.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>POST /api/v1/item/{item_id}/comments
    Content-Type: application/json

    {&quot;subject&quot;: &quot;Re: the article&quot;, &quot;body&quot;: &quot;Nice article!&quot;, &quot;parent_id&quot;: null}
    </code></pre></figure><p><strong>Response (201):</strong> Comment object.</p>
    <h3>Get Comment</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/comment/{id}?include=author
    </code></pre></figure><h3>Update Comment</h3>
    <p>Requires authentication. Must be comment author or admin. <code>subject</code> absent
    leaves it unchanged; present (including <code>""</code>) replaces it, independently of
    <code>body</code> — a request can change one without the other.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>PUT /api/v1/comment/{id}
    Content-Type: application/json

    {&quot;body&quot;: &quot;Updated text&quot;}
    </code></pre></figure><h3>Delete Comment</h3>
    <p>Requires authentication. Must be comment author or admin.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>DELETE /api/v1/comment/{id}
    </code></pre></figure><p><strong>Response:</strong> <code>{"deleted": true}</code></p>
    <hr />
    <h2>Search</h2>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/search?q=hello&amp;page=1&amp;per_page=10
    </code></pre></figure><table><thead><tr><th>Query Param</th><th>Default</th><th>Range</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>q</code></th><th></th><th></th><th>Search query</th></tr>
    <tr><th><code>page</code></th><th>1</th><th>1+</th><th>Page number</th></tr>
