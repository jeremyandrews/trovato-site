    <h2>Gather (Queries)</h2>
    <p>A gather may declare the permission a viewer needs to run it, in its definition:
    <code>"access": { "permission": "..." }</code>. Every endpoint below checks it before the
    query runs: <code>/api/v1/queries</code> leaves out a gather the caller may not run, and the
    other two answer 403 with a JSON <code>error</code> body (<code>Permission required: ...</code>).
    Administrators pass. A lightweight-record gather (<code>record_type</code>) that declares
    none requires <code>access content</code>. <a href="/learn/plugin-development#gathers-that-require-a-permission">Gathers that require a
    permission</a> covers the
    HTML pages, route aliases, feeds and menu links.</p>
