    <h3>List Content Types</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/content-types
    </code></pre></figure><p>Returns a page of content type machine names.</p>
    <h3>List Items by Type</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>GET /api/v1/items/{type}
    </code></pre></figure><p>Returns a page of the items of the given content type (<code>id</code>, <code>title</code>,
    <code>item_type</code>, <code>status</code>).</p>
