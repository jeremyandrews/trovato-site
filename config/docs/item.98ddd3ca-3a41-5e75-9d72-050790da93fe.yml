    <h2>Step 2: File Uploads &amp; Media</h2>
    <p>Conferences need visual identity -- logos, venue photos, maybe a schedule PDF. Trovato's file system manages uploads with UUID-based storage, MIME validation, and a temp-to-permanent lifecycle.</p>
    <h3>Adding File Fields</h3>
    <p>The conference type's YAML config (<code>docs/tutorial/config/item_type.conference.yml</code>) already includes two File fields:</p>
    <ul>
    <li><code>field_logo</code> -- Conference logo image</li>
    <li><code>field_venue_photo</code> -- Venue or event photo</li>
    </ul>
    <p>If you are following from Part 2 and these fields don't exist yet, re-import the config:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><p>After the cache TTL expires (60 seconds), the content form at <code>/admin/content/add/conference</code> will show file upload widgets for these fields.</p>
    <h3>How File Upload Works</h3>
    <p>The file upload widget (<code>static/js/file-upload.js</code>) provides an AJAX upload experience:</p>
    <ol>
    <li>The user selects a file via the file input.</li>
    <li>JavaScript validates the file size (max 10 MB) on the client.</li>
    <li>The file is uploaded via <code>POST /file/upload</code> as a multipart form with an <code>X-CSRF-Token</code> header.</li>
    <li>The server validates the MIME type against an allowlist (<code>ALLOWED_MIME_TYPES</code>) and checks magic bytes against the declared content type. A <code>.exe</code> renamed to <code>.jpg</code> is rejected.</li>
    <li>On success, the file gets a UUID-based filename in temporary storage and a row in <code>file_managed</code> with <code>status = 0</code> (temporary).</li>
    <li>The widget shows a preview (thumbnails for images) with the filename and size.</li>
    <li>When the content form is saved, the kernel promotes referenced file IDs to permanent (<code>status = 1</code>).</li>
    </ol>
    <p>Unreferenced temporary files are cleaned up by cron after 6 hours.</p>
    <h3>Uploading a File</h3>
    <p>Edit an existing conference (e.g., RustConf 2026) at its edit URL. Find the <strong>Conference Logo</strong> field -- it shows a file input with "Choose file". Select a JPEG or PNG image and the widget will upload it immediately, showing a preview.</p>
    <p>Click <strong>Save</strong> to save the conference. The file is now permanent.</p>
    <h3>File Serving</h3>
    <p>Uploaded files are served at <code>/files/{path}</code> with security hardening:</p>
    <ul>
    <li><strong>Directory traversal prevention</strong> -- Paths containing <code>..</code>, null bytes, or backslashes are rejected.</li>
    <li><strong>Content-Disposition</strong> -- Images and PDFs are served inline (browser displays them). All other types use <code>attachment</code> (forces download) to prevent browsers from executing uploaded content.</li>
    <li><strong>X-Content-Type-Options: nosniff</strong> -- Prevents browsers from MIME-sniffing the response.</li>
    <li><strong>Cache-Control</strong> -- <code>public, max-age=604800</code> (one week) for performance.</li>
    </ul>
    <p>The path alias and redirect middleware skip <code>/files</code> and <code>/file</code> prefixes to avoid interfering with file serving.</p>
    <h3>Verify</h3>
    <p>After uploading a logo to a conference, check the file exists:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Find the file record</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>SELECT id, filename, filemime, status FROM file_managed ORDER BY created DESC LIMIT 3;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    </span></code></pre></figure><p>The <code>status</code> column should be <code>1</code> (permanent) for files referenced by saved items.</p>
    <h3>Allowed File Types</h3>
    <p>The kernel allows these MIME types:</p>
    <table><thead><tr><th>MIME Type</th><th>Extensions</th></tr></thead><tbody>
    <tr><th><code>image/jpeg</code></th><th>.jpg, .jpeg</th></tr>
    <tr><th><code>image/png</code></th><th>.png</th></tr>
    <tr><th><code>image/gif</code></th><th>.gif</th></tr>
    <tr><th><code>image/webp</code></th><th>.webp</th></tr>
    <tr><th><code>image/svg+xml</code></th><th>.svg</th></tr>
    <tr><th><code>application/pdf</code></th><th>.pdf</th></tr>
    <tr><th><code>application/msword</code></th><th>.doc</th></tr>
    <tr><th><code>application/vnd.openxmlformats-officedocument.wordprocessingml.document</code></th><th>.docx</th></tr>
    <tr><th><code>application/vnd.ms-excel</code></th><th>.xls</th></tr>
    <tr><th><code>application/vnd.openxmlformats-officedocument.spreadsheetml.sheet</code></th><th>.xlsx</th></tr>
    <tr><th><code>text/plain</code></th><th>.txt</th></tr>
    <tr><th><code>text/csv</code></th><th>.csv</th></tr>
    <tr><th><code>application/zip</code></th><th>.zip</th></tr>
    <tr><th><code>application/gzip</code></th><th>.gz</th></tr>
    </tbody></table>
    <hr />
    <h2>Step 3: The Speaker Content Type</h2>
    <p>Ritrovo tracks speakers alongside conferences. A speaker has a bio, company, photo, and -- critically -- references to the conferences they present at. This introduces Trovato's <strong>RecordReference</strong> field type.</p>
    <h3>Speaker Type Definition</h3>
    <p>The speaker config lives at <code>docs/tutorial/config/item_type.speaker.yml</code>. Import it if you haven't already:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><p>The speaker type has these fields:</p>
    <table><thead><tr><th>Label</th><th>Machine name</th><th>Type</th><th>Notes</th></tr></thead><tbody>
    <tr><th>Biography</th><th><code>field_bio</code></th><th>TextLong</th><th>Speaker's bio, supports filtered_html</th></tr>
    <tr><th>Company</th><th><code>field_company</code></th><th>Text</th><th>Current employer/organization</th></tr>
    <tr><th>Website</th><th><code>field_website</code></th><th>Text</th><th>Personal website URL</th></tr>
    <tr><th>Photo</th><th><code>field_photo</code></th><th>File</th><th>Headshot image</th></tr>
    <tr><th>Conferences</th><th><code>field_conferences</code></th><th>RecordReference</th><th>Links to conference items (multi-value)</th></tr>
    </tbody></table>
    <h3>RecordReference Fields</h3>
    <p>A RecordReference field stores the UUID of another item. The <code>field_conferences</code> field on speakers stores an array of conference UUIDs. In the database, this looks like:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_conferences<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-array tok-json"><span class="tok-punctuation tok-section tok-array tok-begin tok-json">[</span><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>uuid-of-rustconf<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-array tok-json">,</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>uuid-of-eurorust<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-section tok-array tok-end tok-json">]</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>When the speaker detail page renders, the kernel resolves these UUIDs into actual item data (id, title, type) and passes them to the template as <code>referenced_items.field_conferences</code>. The speaker template renders them as clickable links to the conference detail pages.</p>
    <h3>Creating Speakers</h3>
    <p>Navigate to <code>/admin/content/add/speaker</code> and create a few speakers. The <strong>Conferences</strong> field uses an autocomplete widget — start typing a conference name and select from the dropdown results. Under the hood, the autocomplete queries <code>GET /api/v1/items/autocomplete?type=conference&amp;q=...</code> and stores the selected item's UUID in a hidden field.</p>
    <blockquote>
    <p><strong>Tip:</strong> You can link multiple conferences by adding values to the multi-value field. Each autocomplete selection stores the conference UUID for that slot.</p>
    </blockquote>
    <h3>Pathauto for Speakers</h3>
    <p>The pathauto patterns config (<code>docs/tutorial/config/variable.pathauto_patterns.yml</code>) includes a pattern for speakers:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>speaker: speakers/[title]
    </code></pre></figure><p>After importing the config, regenerate aliases for speakers:</p>
    <ol>
    <li>Navigate to <code>/admin/config/pathauto</code>.</li>
    <li>Click <strong>Regenerate aliases</strong> next to Speaker.</li>
    </ol>
    <p>Speakers now have URLs like <code>/speakers/jane-doe</code>.</p>
    <h3>The Speaker Detail Template</h3>
    <p>Open <code>templates/elements/item--speaker.html</code>. The template shows:</p>
    <ul>
    <li>Name and company in the header</li>
    <li>Photo (if uploaded)</li>
    <li>Biography</li>
    <li>Website link (via <code>safe_urls.field_website</code>)</li>
    <li>A <strong>Conferences</strong> section listing linked conferences with links to their detail pages (forward references)</li>
    </ul>
    <h3>Reverse References on Conferences</h3>
    <p>Visit a conference detail page that has speakers linked to it. Below the conference description, you will see a <strong>Speakers</strong> section listing every speaker who references this conference. These reverse references are resolved automatically -- the conference item type does not need a <code>field_speakers</code> field.</p>
    <p>The kernel discovers these by scanning the <code>speaker</code> content type's RecordReference fields and finding matches. This is a powerful pattern: adding a new content type that references conferences (e.g., <code>workshop</code>, <code>sponsor</code>) would automatically show up in reverse reference sections without modifying the conference template.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Confirm speaker type exists</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> http://localhost:3000/api/content-types</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.[] | select(. == &quot;speaker&quot;)<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> &quot;speaker&quot;</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Check a speaker&#39;s detail page (after creating one)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>o</span> /dev/null<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>w</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>%{http_code}<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span> http://localhost:3000/speakers/YOUR-SPEAKER-SLUG</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 200</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><hr />
    <h2>Step 4: Page Layout -- Slots, Tiles &amp; Navigation</h2>
    <p>Until now, pages rendered their content but had no site chrome -- no header, no navigation, no sidebar, no footer. The base page template (<code>templates/page.html</code>) provides all of this through a five-region <strong>Slot</strong> system.</p>
    <h3>The Five Regions</h3>
    <table><thead><tr><th>Region</th><th>Purpose</th></tr></thead><tbody>
    <tr><th><strong>Header</strong></th><th>Site branding, search box</th></tr>
    <tr><th><strong>Navigation</strong></th><th>Main menu</th></tr>
    <tr><th><strong>Content</strong></th><th>Page content (items, gathers, forms)</th></tr>
    <tr><th><strong>Sidebar</strong></th><th>Contextual tiles (topic cloud, CFP list)</th></tr>
    <tr><th><strong>Footer</strong></th><th>Footer menu, site info</th></tr>
    </tbody></table>
    <p>Each region can hold <strong>Tiles</strong> -- content blocks assigned to a specific region with a weight (for ordering) and optional visibility rules.</p>
    <h3>How It Works</h3>
    <p>On every page request, the <code>inject_site_context</code> helper in <code>routes/helpers.rs</code> builds the page context:</p>
    <ol>
    <li><strong>Loads site config</strong> -- Site name and slogan from <code>site_config</code>.</li>
    <li><strong>Loads menus</strong> -- Main menu and footer menu items from the <code>menu_link</code> table, sorted by weight.</li>
    <li><strong>Loads tiles</strong> -- For each region, calls <code>state.tiles().render_region()</code> which filters tiles by visibility rules (path patterns, user roles) and renders their HTML.</li>
    <li><strong>Builds authentication context</strong> -- Current user, admin status, CSRF token for the logout form.</li>
    <li><strong>Passes current path</strong> -- Used for active menu highlighting and breadcrumbs.</li>
    </ol>
    <h3>Menus</h3>
    <p>The main navigation and footer menus are loaded from the <code>menu_link</code> database table. Each menu link has a title, path, weight (sort order), and menu name (<code>main</code> or <code>footer</code>).</p>
    <p>The page template renders the main menu in the Navigation region:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic">{% if main_menu is defined and main_menu %}
    <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">nav</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">site-nav</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
        {% for link in main_menu %}
        <span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>{{ link.path }}<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">site-nav__link{% if current_path == link.path %} site-nav__link--active{% endif %}</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
            {{ link.title }}
        <span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
        {% endfor %}
    <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">nav</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
    {% endif %}
    </span></code></pre></figure><p><strong>Active highlighting</strong> -- The template compares each menu link's path against <code>current_path</code>. The active link gets a <code>site-nav__link--active</code> CSS modifier class.</p>
    <p>If no database menu links exist, the template falls back to plugin-registered routes (the same menu items that appeared in Parts 1 and 2).</p>
    <h3>Tiles</h3>
    <p>Tiles are content blocks placed in page regions. Each tile has:</p>
    <ul>
    <li><strong>machine_name</strong> -- Unique identifier (e.g., <code>search_box</code>, <code>topic_cloud</code>)</li>
    <li><strong>region</strong> -- Which slot it appears in (header, navigation, sidebar, footer)</li>
    <li><strong>tile_type</strong> -- <code>custom_html</code>, <code>menu</code>, or <code>gather_query</code></li>
    <li><strong>config</strong> -- JSON configuration (HTML content, gather query ID, etc.)</li>
    <li><strong>visibility</strong> -- JSON rules for when the tile should appear (path patterns, role restrictions)</li>
    <li><strong>weight</strong> -- Sort order within the region</li>
    </ul>
    <p>The YAML config files in <code>docs/tutorial/config/</code> document the tile configurations for Ritrovo:</p>
    <table><thead><tr><th>Tile</th><th>Region</th><th>Purpose</th></tr></thead><tbody>
    <tr><th><code>search_box</code></th><th>Header</th><th>Search form posting to <code>/search</code></th></tr>
    <tr><th><code>topic_cloud</code></th><th>Sidebar</th><th>Topic tag links to <code>/topics/{slug}</code></th></tr>
    <tr><th><code>conferences_this_month</code></th><th>Sidebar</th><th>Condensed upcoming conferences</th></tr>
    <tr><th><code>open_cfps_sidebar</code></th><th>Sidebar</th><th>Open CFPs with deadlines</th></tr>
    <tr><th><code>footer_info</code></th><th>Footer</th><th>Site branding and info</th></tr>
    </tbody></table>
    <blockquote>
    <p><strong>Note:</strong> Tile and menu link configuration can be imported via <code>config import</code> using <code>tile.{uuid}.yml</code> and <code>menu_link.{uuid}.yml</code> files, or managed through the admin UI. The tutorial's set is in <code>docs/tutorial/config/</code>, indexed by machine name in that directory's <code>README.md</code>.</p>
    </blockquote>
    <h3>Tile Visibility Rules</h3>
    <p>Each tile can have path-based and role-based visibility rules. For example, the open CFPs sidebar tile might only appear on conference-related pages:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>paths<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-array tok-json"><span class="tok-punctuation tok-section tok-array tok-begin tok-json">[</span><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/conferences*<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-array tok-json">,</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/topics/*<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-array tok-json">,</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/cfps*<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-section tok-array tok-end tok-json">]</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Visiting <code>/speakers/jane-doe</code> would not show the CFP tile because the path doesn't match any pattern.</p>
    <h3>Breadcrumbs</h3>
    <p>The page template renders breadcrumbs above the content area:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic">{% if breadcrumbs %}
    <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">nav</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">breadcrumb</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">aria-label</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>Breadcrumb<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
        <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">ol</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">breadcrumb__list</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
            {% for crumb in breadcrumbs %}
            <span class="tok-meta tok-tag tok-inline tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-any tok-html">li</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">breadcrumb__item</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
                {% if crumb.path %}<span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>{{ crumb.path }}<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>{% endif %}
                {{ crumb.title }}
                {% if crumb.path %}<span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>{% endif %}
            <span class="tok-meta tok-tag tok-inline tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-inline tok-any tok-html">li</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
            {% endfor %}
        <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">ol</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
