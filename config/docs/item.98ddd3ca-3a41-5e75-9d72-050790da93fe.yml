    <h2>Step 5: Full-Text Search</h2>
    <p>With thousands of conferences in the database, visitors need a way to find specific events. Trovato provides full-text search built on PostgreSQL's <code>tsvector</code> engine with configurable field weights.</p>
    <h3>Search Field Configuration</h3>
    <p>Search field config files define which item fields are indexed and their relevance weights:</p>
    <table><thead><tr><th>Weight</th><th>Meaning</th><th>Fields</th></tr></thead><tbody>
    <tr><th><strong>A</strong> (highest)</th><th>Primary match</th><th>Title</th></tr>
    <tr><th><strong>B</strong></th><th>Secondary match</th><th>Description, speaker bio</th></tr>
    <tr><th><strong>C</strong></th><th>Supporting match</th><th>City, country</th></tr>
    <tr><th><strong>D</strong> (lowest)</th><th>Background match</th><th>(none configured)</th></tr>
    </tbody></table>
    <p>The config files live at <code>docs/tutorial/config/search_field_config.*.yml</code>. Import them:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><p>This imports six search field configuration entities:</p>
    <table><thead><tr><th>File</th><th>Content Type</th><th>Field</th><th>Weight</th></tr></thead><tbody>
    <tr><th><code>search_field_config.conference_title.yml</code></th><th>conference</th><th>title</th><th>A</th></tr>
    <tr><th><code>search_field_config.conference_description.yml</code></th><th>conference</th><th>field_description</th><th>B</th></tr>
    <tr><th><code>search_field_config.conference_city.yml</code></th><th>conference</th><th>field_city</th><th>C</th></tr>
    <tr><th><code>search_field_config.conference_country.yml</code></th><th>conference</th><th>field_country</th><th>C</th></tr>
    <tr><th><code>search_field_config.speaker_title.yml</code></th><th>speaker</th><th>title</th><th>A</th></tr>
    <tr><th><code>search_field_config.speaker_bio.yml</code></th><th>speaker</th><th>field_bio</th><th>B</th></tr>
    </tbody></table>
    <h3>Rebuilding the Search Index</h3>
    <p>After importing search field config, the search index needs to be rebuilt so that existing items get their <code>search_vector</code> column populated. Trigger this via the admin UI at <code>/admin/structure/types/{type}/search</code> — click the "Reindex" button for each content type that has search fields configured.</p>
    <h3>How Search Works</h3>
    <p>When a user searches for "rust":</p>
    <ol>
    <li>PostgreSQL parses the query into a <code>tsquery</code>: <code>'rust':*</code></li>
    <li>The query is matched against the <code>search_vector</code> tsvector column on the <code>item</code> table</li>
    <li>Results are ranked by <code>ts_rank_cd()</code>, which accounts for field weights -- a title match (weight A) ranks higher than a description match (weight B)</li>
    <li>Results are returned with relevance scores</li>
    </ol>
    <p>The search is <strong>stage-aware</strong>: anonymous users see only items on the Live stage. Authenticated users with appropriate permissions may see items on other stages.</p>
    <h3>Search Results</h3>
    <p>The search results page at <code>/search?q={query}</code> shows:</p>
    <ul>
    <li>Query echo ("Results for: rust")</li>
    <li>Total result count</li>
    <li>Each result with title (linked), content type badge, and a text snippet</li>
    <li>Pagination</li>
    <li>Empty state when no results match</li>
    </ul>
    <h3>Search API</h3>
    <p>The JSON search API is available at <code>/api/search?q={query}</code>:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>http://localhost:3000/api/search?q=rust<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>{total: .total, first_title: .items[0].title}<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    </span></code></pre></figure><h3>Verify Search Weighting</h3>
    <p>Search for "rust" -- RustConf (title match, weight A) should appear near the top. Search for "berlin" -- conferences in Berlin (city match, weight C) should appear, ranked lower than conferences with "Berlin" in the title.</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Title match should rank high</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>http://localhost:3000/api/search?q=rust<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.items[0].title<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Should be &quot;RustConf 2026&quot; or similar</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> City match</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>http://localhost:3000/api/search?q=berlin<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.items | length<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Should return &gt; 0</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><details>
    <summary>Under the Hood: tsvector and Weighted Fields</summary>
    <p>Each item's <code>search_vector</code> column is a PostgreSQL <code>tsvector</code> built from the configured fields with their weights:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> id, title, search_vector
    <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> item
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> search_vector <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">IS NOT NULL</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">LIMIT</span> <span class="tok-constant tok-numeric tok-sql">1</span>;
    </span></code></pre></figure><p>The vector looks like:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>&#39;2026&#39;:2B &#39;berlin&#39;:4C &#39;confer&#39;:3B &#39;develop&#39;:8B &#39;rust&#39;:1A &#39;rustconf&#39;:1A
    </code></pre></figure><p>The letter suffixes (A, B, C, D) correspond to the weight grades. PostgreSQL's <code>ts_rank_cd()</code> function uses these to score matches: a word with weight A contributes more to the relevance score than one with weight C.</p>
    <p>The index uses a GIN (Generalized Inverted Index) for fast lookups:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">INDEX</span> <span class="tok-entity tok-name tok-function tok-sql">idx_item_search_vector</span></span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> item USING gin(search_vector);
    </span></code></pre></figure><p>This gives you sub-millisecond search across thousands of items.</p>
    </details>
    <h3>Client-Side Search with Pagefind</h3>
    <p>The tsvector search above runs on the server. Trovato also supports <strong>Pagefind</strong> for instant client-side search — results appear as you type, with no server round-trip.</p>
    <p><strong>How it works:</strong></p>
    <ol>
    <li>A cron task (via the <code>trovato_search</code> plugin) detects content changes and rebuilds the Pagefind index at <code>static/pagefind/</code></li>
    <li>The search page loads <code>scolta.js</code>, which initializes Pagefind and provides client-side scoring</li>
    <li>Scoring includes recency decay, title/content match boost, content type filters, and deduplication</li>
    <li>If Pagefind isn't available (first install, index not yet built), the page falls back to tsvector server-side search</li>
    </ol>
    <p><strong>Trigger an index rebuild:</strong></p>
    <p>Pagefind indexes are built during cron runs. Trigger one manually:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>X</span> POST http://localhost:3000/cron/default-cron-key</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.status<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    </span></code></pre></figure><p>After the index builds, visit <code>/search</code> — you'll see the Scolta search UI with instant client-side results.</p>
    <blockquote>
    <p><strong>Note:</strong> Scolta also supports AI-powered search features (query expansion, streaming summaries, follow-up conversation) when the <code>trovato_ai</code> plugin is enabled. These are covered in the AI tutorial section (Epic 3: AI as a Building Block).</p>
    </blockquote>
    <hr />
    <h2>Step 6: Theme &amp; Visual Design</h2>
    <p>Steps 1-5 gave the site all its structural pieces -- templates, speakers, navigation, search. But the site still renders with the default base theme and has inline <code>&lt;style&gt;</code> blocks scattered across templates. This step consolidates all visual design into a single premium theme, adds a polished front page, creates content pages, and ensures visual consistency across the site.</p>
    <h3>The Design System</h3>
    <p>The theme file at <code>static/css/theme.css</code> defines a complete design system using CSS custom properties (design tokens):</p>
    <figure class="code"><figcaption class="code__lang">css</figcaption><pre class="code__body" tabindex="0" aria-label="css code"><code class="language-css"><span class="tok-source tok-css"><span class="tok-meta tok-selector tok-css"><span class="tok-entity tok-other tok-pseudo-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">:</span>root</span> </span><span class="tok-meta tok-property-list tok-css"><span class="tok-punctuation tok-section tok-property-list tok-css">{</span>
