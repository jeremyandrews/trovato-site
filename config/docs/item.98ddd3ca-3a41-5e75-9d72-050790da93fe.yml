    </span><span class="tok-punctuation tok-section tok-property-list tok-css">}</span>
    </span></code></pre></figure><p>Every component in the site references these tokens rather than hard-coding colors. Changing <code>--primary</code> rebrands the entire site.</p>
    <p>The naming convention follows BEM (Block-Element-Modifier): <code>.card__title</code>, <code>.speaker-card__photo--placeholder</code>, <code>.site-nav__link--active</code>. This makes CSS classes self-documenting and avoids specificity wars.</p>
    <h3>Consolidating Inline Styles</h3>
    <p>Trovato's default templates include inline <code>&lt;style&gt;</code> blocks for basic styling. The premium theme moves all public-facing styles into <code>theme.css</code>:</p>
    <ul>
    <li><code>gather/query.html</code>, <code>gather/row.html</code>, <code>gather/pager.html</code> -- Gather chrome</li>
    <li><code>gather/query--ritrovo.open_cfps.html</code> -- CFP card styles</li>
    <li><code>gather/query--ritrovo.upcoming_conferences.html</code> -- Conference card styles</li>
    <li><code>elements/comments.html</code> -- Comment thread styles</li>
    </ul>
    <p>The <code>base.html</code> template retains its inline <code>&lt;style&gt;</code> as a safety net -- if <code>theme.css</code> fails to load, the page is still usable. Since <code>theme.css</code> loads after the inline block of <code>base.html</code>, it wins in the CSS cascade.</p>
    <blockquote>
    <p><strong>Accessibility note:</strong> The base template provides several accessibility features by default. A <strong>skip link</strong> (<code>&lt;a href="#main-content"&gt;Skip to main content&lt;/a&gt;</code>) is the first focusable element on every page, letting keyboard users bypass navigation. The <code>&lt;main&gt;</code> element has <code>id="main-content"</code> as the skip link target. All item content renders inside <code>&lt;article&gt;</code> elements. The CSS uses <strong>logical properties</strong> (<code>margin-inline-start</code> instead of <code>margin-left</code>) so layouts work correctly for right-to-left languages. AJAX operations announce changes via an <code>aria-live="polite"</code> region so screen readers stay informed. These are infrastructure defaults -- you don't need to add them to your templates.</p>
    </blockquote>
    <h3>The Front Page</h3>
    <p>The front page template at <code>templates/page--front.html</code> extends <code>page.html</code> and overrides two blocks:</p>
    <ul>
    <li><strong><code>header</code></strong> -- Calls <code>{{ super() }}</code> to keep the site header, then adds a hero section with animated floating orbs, a grid overlay, stats bar, and two call-to-action buttons.</li>
    <li><strong><code>content</code></strong> -- Four colorful stat cards (Conferences, Open CFPs, Speakers, Topics) and a split panel highlighting the technology stack.</li>
    </ul>
    <p>The hero uses pure CSS animations (<code>@keyframes float</code>) and <code>backdrop-filter</code> for depth -- no JavaScript required.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-03/front-page.png"><img src="images/part-03/front-page.png" width="600" alt="Front page with animated hero section, stat cards, and technology showcase"></a></p>
    <h3>Shared Card Component</h3>
    <p>Conference listings, CFP listings, topic results, and speaker grids all render as card-based layouts. Without care, the card HTML and CSS would be duplicated across every gather query template.</p>
    <p>The theme uses a two-layer pattern to eliminate this duplication:</p>
    <p><strong>CSS base class (<code>theme.css</code>):</strong> A shared <code>.card</code> class provides the container, hover animation, shadow, and border-radius. Variant modifier classes add type-specific accents:</p>
    <ul>
    <li><code>.card--conf</code> -- Adds a gradient left border that fades in on hover</li>
    <li><code>.card--cfp</code> -- Adds a solid amber left border</li>
    <li><code>.card--speaker</code> -- Switches to flex layout for the photo + info pattern</li>
    </ul>
    <p>Shared sub-elements (<code>.card__title</code>, <code>.card__meta</code>, <code>.card__dates</code>, <code>.card__location</code>, <code>.card__desc</code>, <code>.card__actions</code>, <code>.card__more</code>, <code>.card__website</code>) are defined once and used by all card types.</p>
    <p><strong>Template include (<code>gather/includes/conf-card.html</code>):</strong> The conference card HTML lives in a single include file. Every gather query that shows conferences uses:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic">{% for row in rows %}
    {% include &quot;gather/includes/conf-card.html&quot; %}
    {% endfor %}
    </span></code></pre></figure><p>This means <code>query--ritrovo.upcoming_conferences.html</code>, <code>query--ritrovo.by_topic.html</code>, and any future conference listing query all share the same card markup. A change to the card layout is a single-file edit.</p>
    <h3>Site-Wide Page Context</h3>
    <p>Every page that renders through Tera templates needs site context -- the site name, slogan, navigation menus, footer menus, authentication state, and CSRF token. The <code>inject_site_context()</code> helper in <code>routes/helpers.rs</code> provides this. It must be called before rendering any page that extends <code>page.html</code>.</p>
    <p>The auth handlers (<code>login_form</code>, <code>render_login_error</code>, <code>render_register_form</code>, <code>render_profile</code>) all call <code>inject_site_context()</code> so that login, registration, and profile pages display the same site header, navigation, and footer as every other page. Without this, users navigating to <code>/user/login</code> would see a bare page with no navigation back to the site.</p>
    <h3>About and Contact Pages</h3>
    <p>The About and Contact pages need rich layout HTML (grids with icons, multi-column cards). But the render pipeline's <code>FilterPipeline::for_format_safe()</code> only allows <code>plain_text</code> and <code>filtered_html</code> formats. The <code>filtered_html</code> format uses ammonia sanitization which strips <code>&lt;div&gt;</code>, <code>&lt;svg&gt;</code>, <code>class</code> attributes, and <code>style</code> attributes -- exactly the elements needed for a rich layout.</p>
    <p>The solution uses the template resolution chain. Instead of storing layout HTML in the database body field, create UUID-specific templates:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>templates/elements/item--page--{uuid-of-about}.html
    templates/elements/item--page--{uuid-of-contact}.html
    </code></pre></figure><p>These templates contain the rich layout HTML directly, bypassing the filter pipeline. The database items exist as <code>page</code> type content (so they have URL aliases and appear in admin), but the template handles all rendering. This approach:</p>
    <ul>
    <li>Respects the security model -- no weakening of <code>for_format_safe()</code></li>
    <li>Keeps rich layouts in version-controlled template files</li>
    <li>Uses Trovato's existing template specificity chain</li>
    </ul>
    <h3>Topics: Alphabetical Sort</h3>
    <p>The topics browse page (<code>/topics</code>) originally displayed tags sorted by weight (their database ordering). For a directory site, alphabetical ordering is more intuitive. The <code>browse_topics</code> handler in <code>routes/category.rs</code> sorts tags after loading:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust">tags.<span class="tok-support tok-function tok-rust">sort_by</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">|</span></span></span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-variable tok-parameter tok-rust">a</span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-variable tok-parameter tok-rust">b</span><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">|</span></span> </span><span class="tok-meta tok-function tok-closure tok-rust">a.label.<span class="tok-support tok-function tok-rust">to_lowercase</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.<span class="tok-support tok-function tok-rust">cmp</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>b.label.<span class="tok-support tok-function tok-rust">to_lowercase</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><h3>Gather Route Inline Rendering</h3>
    <p>Gather route aliases (e.g., <code>/topics/{slug}</code>) originally redirected with HTTP 307 to <code>/gather/{query_id}?param={value}</code>. This exposed ugly UUID-based URLs in the browser address bar. The updated <code>gather_routes.rs</code> handler calls <code>execute_and_render()</code> directly, rendering the gather query inline at the pretty URL. Visitors who click ".NET" on the topics page stay at <code>/topics/dotnet</code> and see conference cards -- no redirect, no UUID in the URL.</p>
    <p>The by-topic query also gets its own template (<code>gather/query--ritrovo.by_topic.html</code>) that renders conference cards instead of a raw table, matching the visual style of the main conferences listing.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-03/topic-rust.png"><img src="images/part-03/topic-rust.png" width="600" alt="Topic page for Rust showing filtered conference cards at /topics/rust"></a></p>
    <h3>Hiding Duplicate Field Output</h3>
    <p>Item templates like <code>item--conference.html</code> explicitly render key fields (dates, location, links) in structured layouts. But the template also includes <code>{{ children | safe }}</code>, which renders <strong>all</strong> fields through the kernel's generic field renderer. This creates duplicate content -- dates appear in both the structured header and the raw field list.</p>
    <p>The theme hides these duplicates with CSS:</p>
    <figure class="code"><figcaption class="code__lang">css</figcaption><pre class="code__body" tabindex="0" aria-label="css code"><code class="language-css"><span class="tok-source tok-css"><span class="tok-meta tok-selector tok-css"><span class="tok-entity tok-other tok-attribute-name tok-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">.</span>item--conference</span> <span class="tok-entity tok-other tok-attribute-name tok-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">.</span>item__content</span> <span class="tok-entity tok-other tok-attribute-name tok-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">.</span>field</span>,
    <span class="tok-entity tok-other tok-attribute-name tok-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">.</span>item--speaker</span> <span class="tok-entity tok-other tok-attribute-name tok-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">.</span>item__content</span> <span class="tok-entity tok-other tok-attribute-name tok-class tok-css"><span class="tok-punctuation tok-definition tok-entity tok-css">.</span>field</span> </span><span class="tok-meta tok-property-list tok-css"><span class="tok-punctuation tok-section tok-property-list tok-css">{</span>
        <span class="tok-meta tok-property-name tok-css"><span class="tok-support tok-type tok-property-name tok-css">display</span></span><span class="tok-punctuation tok-separator tok-key-value tok-css">:</span><span class="tok-meta tok-property-value tok-css"> </span><span class="tok-meta tok-property-value tok-css"><span class="tok-support tok-constant tok-property-value tok-css">none</span></span><span class="tok-punctuation tok-terminator tok-rule tok-css">;</span>
    </span><span class="tok-punctuation tok-section tok-property-list tok-css">}</span>
    </span></code></pre></figure><p>This keeps the generic <code>children</code> output available (plugins can add fields that the template doesn't know about) while hiding the duplicate rendering of fields that the template already handles.</p>
