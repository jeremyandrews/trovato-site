    </span></span></code></pre></figure><details>
    <summary>Under the Hood: Referenced Items and Reverse References</summary>
    <p>The <code>view_item</code> handler in <code>routes/item.rs</code> resolves two kinds of relationships:</p>
    <p><strong>Forward references</strong> -- For each RecordReference field in the item, the handler reads the UUID(s) stored in the field value, loads those items from the database, and passes them to the template as <code>referenced_items.{field_name}</code>. For example, a speaker's <code>field_conferences</code> contains an array of conference UUIDs. The handler resolves them to <code>[{id, title, type}, ...]</code> and the speaker template renders them as links.</p>
    <p><strong>Reverse references</strong> -- The handler scans all content types that have RecordReference fields. For each type, it loads up to 50 items and checks whether any field value matches the current item's ID. Matches are passed to the template as <code>reverse_references.{type_name}</code>. For example, when viewing a conference, the handler finds speakers whose <code>field_conferences</code> contains this conference's UUID.</p>
    <p>This scan approach works at tutorial scale. At production scale, you would add a JSONB containment index (<code>CREATE INDEX ON item USING gin (fields jsonb_path_ops)</code>) and a targeted query instead of scanning.</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Reverse reference: find speakers referencing this conference
    </span><span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> id, title
    <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> item
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> type <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>speaker<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
      <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> fields @<span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>{&quot;field_conferences&quot;: [&quot;CONFERENCE-UUID&quot;]}<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
    </span></code></pre></figure></details>
