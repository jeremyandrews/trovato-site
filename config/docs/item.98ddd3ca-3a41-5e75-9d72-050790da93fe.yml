    <h1>Part 3: Look &amp; Feel</h1>
    <p>Part 2 ended with 5,000+ conferences flowing through five Gather queries, but the site still renders everything with default templates. Part 3 transforms Ritrovo from a data pipe into a real website.</p>
    <p>You will learn the <strong>Render Tree</strong> -- the structured pipeline that turns Items into safe HTML. You will tour the Tera templates that control conference detail pages, CFP listings, and the base page layout. You will wire up file uploads for logos and venue photos, create a second content type (Speaker) with RecordReference links to conferences, configure page regions with Tiles, set up navigation menus with breadcrumbs, and add full-text search with weighted fields.</p>
    <p><strong>Start state:</strong> Default HTML rendering, no site chrome, no files, one content type.
    <strong>End state:</strong> A navigable conference directory with styled detail pages, speaker profiles, sidebar tiles, proper navigation, full-text search, and file uploads.</p>
    <hr />
    <h2>Step 1: The Render Tree &amp; Tera Templates</h2>
    <p>Every piece of content in Trovato passes through the <strong>Render Tree</strong> before it reaches the browser. Understanding this pipeline is key to controlling how your site looks.</p>
    <h3>The Four Phases</h3>
    <p>When a visitor requests <code>/item/{id}</code>, the kernel:</p>
    <ol>
    <li><p><strong>Build</strong> -- Loads the item from the database and constructs a structured data tree. Fields are processed through format-specific filter pipelines (<code>FilterPipeline::for_format_safe()</code>). Compound fields are sorted by weight. All user-supplied content is HTML-escaped via <code>html_escape()</code>.</p>
    </li>
    <li><p><strong>Alter</strong> -- Plugins can mutate the tree through the <code>tap_item_view_alter</code> tap. A plugin might add a badge, reorder fields, or strip fields based on permissions (you will see this in Part 4's access control plugin).</p>
    </li>
    <li><p><strong>Sanitize</strong> -- Text format filters run on rich text fields. <code>filtered_html</code> strips dangerous tags; <code>full_html</code> is available to trusted editors. All HTML output is safe by construction.</p>
    </li>
    <li><p><strong>Render</strong> -- The Tera template engine converts the data tree into HTML. Template resolution follows a specificity chain, and the result is wrapped in the base page layout.</p>
    </li>
    </ol>
    <p>Plugins never produce raw HTML -- they produce structured data that the kernel renders safely. This is the same principle as React's virtual DOM or SwiftUI's view builders: the framework controls the final output.</p>
    <h3>Template Resolution Chain</h3>
    <p>Tera resolves templates by checking for the most specific file first:</p>
    <ol>
    <li><code>templates/elements/item--conference--{uuid}.html</code> -- Override for a single item</li>
    <li><code>templates/elements/item--conference.html</code> -- Override for all conferences</li>
    <li><code>templates/elements/item.html</code> -- Default fallback for all items</li>
    </ol>
    <p>The same pattern applies to Gather queries: <code>query--{query_id}.html</code> → <code>query.html</code>.</p>
    <p>When no template matches at all, the Rust-side render fallback produces semantic HTML: item-type elements render as <code>&lt;article&gt;</code>, containers with headings as <code>&lt;section&gt;</code>, navigation as <code>&lt;nav&gt;</code>. Images get <code>loading="lazy"</code> by default to improve page load performance. This means even without custom templates, the output is accessible and performant.</p>
    <p>Trovato ships with templates for the conference and speaker types. Let's tour them.</p>
    <h3>The Conference Detail Template</h3>
    <p>Open <code>templates/elements/item--conference.html</code>. This template controls how conference items render at <code>/item/{id}</code> (and at their pathauto aliases like <code>/conferences/rustconf-2026</code>).</p>
    <p>Key sections:</p>
    <ul>
    <li><strong>Header</strong> -- Title, date range, location (city/country), and an "Online" badge for virtual events.</li>
    <li><strong>Media</strong> -- Logo image (<code>field_logo</code>) and venue photo (<code>field_venue_photo</code>), rendered as <code>&lt;img&gt;</code> tags pointing to the file serving endpoint at <code>/files/{path}</code>.</li>
    <li><strong>Description</strong> -- The conference description rendered with <code>| safe</code> (marked with a <code>{# SAFE: #}</code> comment because the render pipeline already sanitized it).</li>
    <li><strong>External links</strong> -- Website and CFP submission links pulled from <code>safe_urls</code>, not from raw <code>item.fields</code>. This prevents <code>javascript:</code> URI injection -- more on this in a moment.</li>
    <li><strong>Speakers</strong> -- A reverse reference section that lists speakers who reference this conference. The kernel finds these automatically by scanning RecordReference fields across other content types.</li>
    <li><strong>Children</strong> -- Any child items rendered through the pipeline.</li>
    </ul>
    <h3>The safe_urls Pattern</h3>
    <p>Tera's autoescape prevents <code>&lt;script&gt;</code> injection by escaping <code>&lt;</code>, <code>&gt;</code>, <code>&amp;</code>, and <code>"</code>. But it does <strong>not</strong> prevent <code>javascript:</code> URI injection in <code>href</code> attributes -- <code>&lt;a href="javascript:alert(1)"&gt;</code> passes autoescape unchanged because it contains no HTML-special characters.</p>
    <p>The kernel solves this by building a <code>safe_urls</code> map in the view handler. For every string field in the item, if the value starts with <code>http://</code> or <code>https://</code>, it goes into <code>safe_urls</code>. The template uses <code>safe_urls.field_url</code> instead of <code>item.fields.field_url</code> for any value that appears in an <code>href</code>:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic">{% if safe_urls.field_url is defined and safe_urls.field_url %}
    <span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>{{ safe_urls.field_url }}<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">target</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>_blank<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">rel</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>noopener noreferrer<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
        Visit website
    <span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
    {% endif %}
    </span></code></pre></figure><p>This is defense-in-depth: even if an attacker manages to store <code>javascript:alert(1)</code> in a URL field, it will never appear in an <code>href</code> attribute.</p>
    <h3>The Open CFPs Template</h3>
    <p>Open <code>templates/gather/query--ritrovo.open_cfps.html</code>. This template extends the base <code>gather/query.html</code> layout and renders conferences with open Calls for Papers as a card grid. Each card shows:</p>
    <ul>
    <li>Conference title (linked to the detail page, not to the raw CFP URL)</li>
    <li>CFP deadline date</li>
    <li>Event dates and location</li>
    <li>"View details &amp; submit" action link</li>
    </ul>
    <p>Notice that the CFP template does <strong>not</strong> render external URLs directly. Instead, it links to the item detail page (<code>/item/{{ row.id }}</code>), where the full conference template shows the external links through the <code>safe_urls</code> pattern. This keeps all external URL rendering centralized in the detail template.</p>
    <h3>Verify</h3>
    <p>Visit any conference detail page. You should see a styled layout with header metadata, description, and external links (if present):</p>
