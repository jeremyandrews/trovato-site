    </span></code></pre></figure><h3>Best Practice</h3>
    <ul>
    <li>Always match specific error codes you can handle, then fall through to a generic log</li>
    <li>Never panic on host errors — panics crash the WASM instance and disable the plugin</li>
    <li>Use <code>log()</code> to send errors to the kernel's tracing system for debugging</li>
    <li>For database queries, always use LIMIT to stay within the 256KB buffer</li>
    </ul>
