    <h1>Plugin Error Codes Reference</h1>
    <p>When a host function call fails, it returns a negative <code>i32</code> error code. This document explains each code and how to handle it.</p>
    <p>The authoritative source is <code>crates/plugin-sdk/src/host_errors.rs</code>.</p>
    <h2>General Host Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-1</th><th><code>ERR_MEMORY_MISSING</code></th><th>WASM module does not export <code>"memory"</code></th><th>Plugin build issue — ensure the WASM target exports memory</th></tr>
    <tr><th>-2</th><th><code>ERR_PARAM1_READ</code></th><th>First parameter read failed (UTF-8 or out-of-bounds)</th><th>Plugin code bug — check string parameter encoding</th></tr>
    <tr><th>-3</th><th><code>ERR_PARAM2_OR_OUTPUT</code></th><th>Second parameter or output write failed</th><th>Buffer too small or out of bounds</th></tr>
    <tr><th>-4</th><th><code>ERR_PARAM3_READ</code></th><th>Third parameter read failed</th><th>Check extra parameters (DB params, etc.)</th></tr>
    <tr><th>-10</th><th><code>ERR_NO_SERVICES</code></th><th>Tap executed without request context</th><th>Only occurs in background taps without AppState</th></tr>
    </tbody></table>
    <h2>Database Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-11</th><th><code>ERR_DDL_REJECTED</code></th><th>SQL statement rejected (CREATE, DROP, ALTER, etc.)</th><th>Use <code>execute_raw()</code> for DML; <code>query_raw()</code> for SELECT only</th></tr>
    <tr><th>-12</th><th><code>ERR_SQL_FAILED</code></th><th>SQL execution failed (syntax, constraint, timeout)</th><th>Review query; check statement timeout (5s for plugins)</th></tr>
    <tr><th>-13</th><th><code>ERR_SERIALIZE_FAILED</code></th><th>Result serialization to JSON failed</th><th>Kernel bug — file issue</th></tr>
    <tr><th>-14</th><th><code>ERR_PARAM_DESERIALIZE</code></th><th>JSON parameter deserialization failed</th><th>Check parameter JSON format</th></tr>
    <tr><th>-15</th><th><code>ERR_INVALID_IDENTIFIER</code></th><th>Invalid table or column name</th><th>Names must match <code>[a-zA-Z_][a-zA-Z0-9_]*</code></th></tr>
    <tr><th>-82</th><th><code>ERR_DB_BATCH_TOO_LARGE</code></th><th><code>insert-many</code> was given more than 500 rows, or <code>search-index-enqueue</code> more than 10,000 ids; nothing was written (added by B80; B218)</th><th>Split the batch</th></tr>
    </tbody></table>
    <p>An array <code>where</code> on <code>update</code> or <code>delete</code> that is empty, names an unknown op, or has an empty <code>in</code> list is <code>-14</code>, as are <code>insert-many</code> rows that disagree on their columns, and a <code>search-index-enqueue</code> argument that is not a JSON array of UUIDs.</p>
    <h2>AI API Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-20</th><th><code>ERR_AI_NO_PROVIDER</code></th><th>No provider configured for this operation type</th><th>Admin must configure a provider in AI settings</th></tr>
    <tr><th>-21</th><th><code>ERR_AI_REQUEST_FAILED</code></th><th>HTTP request to AI provider failed</th><th>Check provider availability; retry later</th></tr>
    <tr><th>-22</th><th><code>ERR_AI_RATE_LIMITED</code></th><th>Rate limit exceeded (provider or local)</th><th>Wait and retry; check rate limit configuration</th></tr>
    <tr><th>-23</th><th><code>ERR_AI_INVALID_REQUEST</code></th><th>Malformed <code>AiRequest</code> JSON</th><th>Check AiRequest structure and message roles</th></tr>
    <tr><th>-24</th><th><code>ERR_AI_AUTH_FAILED</code></th><th>Provider returned 401/403</th><th>Check API key configuration</th></tr>
    <tr><th>-25</th><th><code>ERR_AI_PROVIDER_ERROR</code></th><th>Provider returned non-2xx error</th><th>Check provider status; review request parameters</th></tr>
    <tr><th>-26</th><th><code>ERR_AI_BUDGET_EXCEEDED</code></th><th>Token budget exceeded for current period</th><th>Wait for budget reset or increase limit in admin</th></tr>
    <tr><th>-27</th><th><code>ERR_AI_PERMISSION_DENIED</code></th><th>User lacks AI permission</th><th>Grant <code>use ai</code> or operation-specific permission</th></tr>
    </tbody></table>
    <h2>HTTP API Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-30</th><th><code>ERR_HTTP_REQUEST_FAILED</code></th><th>Network/DNS/connection error</th><th>Check endpoint availability</th></tr>
    <tr><th>-31</th><th><code>ERR_HTTP_TIMEOUT</code></th><th>Request timed out (30s default)</th><th>Reduce response time or increase timeout</th></tr>
    <tr><th>-32</th><th><code>ERR_HTTP_INVALID_URL</code></th><th>URL malformed or blocked (SSRF prevention)</th><th>Use public HTTPS URLs only</th></tr>
    <tr><th>-33</th><th><code>ERR_HTTP_RESPONSE_TOO_LARGE</code></th><th>Response body exceeded buffer</th><th>Reduce response size</th></tr>
    </tbody></table>
    <p>The one-shot <code>http.request</code> (byte-identical, unchanged) uses <code>-30</code>..<code>-33</code> above. The
    additive streaming trio <code>http.http-open</code> / <code>http.http-read</code> / <code>http.http-close</code>
    (P11e / D-49, D-50) — for bodies too large to buffer whole in WASM — shares
    <code>-30</code>..<code>-33</code> on open and adds:</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-37</th><th><code>ERR_HTTP_HANDLE_INVALID</code></th><th>Handle unknown, already closed, or from another tap call (handles are Store-scoped)</th><th>Only read/close a handle from the same call that opened it</th></tr>
    <tr><th>-38</th><th><code>ERR_HTTP_STREAM_READ_FAILED</code></th><th>Network error reading the next body chunk</th><th>Transient — reopen and retry</th></tr>
    <tr><th>-39</th><th><code>ERR_HTTP_TRANSFER_BUDGET</code></th><th>Fetch exceeded the manifest-declared, kernel-capped total-transfer ceiling (preflight or mid-stream)</th><th>Raise <code>http_max_transfer</code> (≤ 16 MB) or fetch less</th></tr>
    <tr><th>-40</th><th><code>ERR_HTTP_TOO_MANY_HANDLES</code></th><th>This call already holds the max concurrent open handles</th><th>Close a handle before opening another</th></tr>
    </tbody></table>
    <p>Streaming semantics (D-49/D-50): <code>http-open</code> returns an opaque Store-scoped handle;
    <code>http-read</code> returns ≤ 64 KB per call (the tap I/O buffer), <code>0</code> = EOF; <code>http-close</code>
    releases the connection. The same SSRF fence as <code>request</code> applies on open. Total
    bytes are bounded by the plugin's <code>http_max_transfer</code> capability (default 1 MB,
    kernel max 16 MB); the old 60 s ceiling becomes a total-transfer wall-clock budget
    plus a per-read timeout, and a background tap is additionally bounded by the 150 s
    epoch (the epoch cuts CPU, the transfer budget cuts the wire). Inherited, unchanged
    gaps: the SSRF fence is literal-string / IP-literal based — DNS-rebinding (TOCTOU)
    and redirect re-validation remain out of scope and are not widened by this surface.</p>
    <h2>Item API Errors</h2>
    <p><code>get-item</code>, <code>save-item</code>, <code>delete-item</code>, <code>query-items</code> and, since B80,
    <code>list-translations</code>, <code>save-translation</code> and <code>delete-translation</code> (SDK: <code>get_item</code>,
    <code>save_item</code>, <code>delete_item</code>, <code>query_items</code>, <code>list_translations</code>,
    <code>save_translation</code>, <code>delete_translation</code>). They also return the general codes
    above and <code>-12</code>, <code>-13</code>, <code>-14</code> from the database table. A translation write
    returns <code>-14</code> for a language the site does not have, or the item's own, and
    <code>-62</code> for an item id that names no item.</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-60</th><th><code>ERR_ITEM_ACCESS_DENIED</code></th><th>The user the plugin acts for may not make this write: no <code>edit</code> or <code>delete</code> access, no <code>create {type} content</code>, a field they may not edit, or a publish change without <code>publish content</code>. Also any call made while an access decision is in progress. Never returned by a read: a denied read is <code>null</code>, like a missing item</th><th>Do the work on behalf of a user who may, or from a background context with <code>item_background</code></th></tr>
    <tr><th>-61</th><th><code>ERR_ITEM_BACKGROUND_DENIED</code></th><th>Called from cron or a queue worker without the <code>item_background</code> capability</th><th>Declare <code>item_background = true</code> in <code>[capabilities]</code> if the plugin needs kernel authority there</th></tr>
    <tr><th>-62</th><th><code>ERR_ITEM_NOT_FOUND</code></th><th><code>delete-item</code> was given an id that names no item</th><th>Treat as already deleted if that is what you meant</th></tr>
    <tr><th>-63</th><th><code>ERR_ITEM_WRITE_DEPTH</code></th><th>A write made from inside item write taps nested 4 deep</th><th>A tap that writes items should not depend on a chain of other plugins' taps writing in turn</th></tr>
    <tr><th>-64</th><th><code>ERR_ITEM_SERVICE_UNAVAILABLE</code></th><th>The dispatch path carries no item service, so nothing was decided or written; the server log names the plugin and the call</th><th>A kernel wiring fault or a test harness that never bound one, not a plugin error: report it</th></tr>
    <tr><th>-65</th><th><code>ERR_ITEM_INVALID_FIELDS</code></th><th><code>save-item</code> was refused by the field value check every item write runs: a field holds more values than its <code>cardinality</code> allows, or a <code>CategoryReference</code> field holds something that is not a tag of its category. Nothing was written</th><th>Send no more values than the field's cardinality, and only tag ids of the field's category, as a list</th></tr>
    </tbody></table>
    <h2>Text Format Errors</h2>
    <p>Returned by <code>host::filter_text</code> (<code>trovato:kernel/text-format</code>, added by B71).</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-70</th><th><code>ERR_TEXT_FORMAT_NOT_PERMITTED</code></th><th>The user the plugin acts for may not use this format</th><th>Filter with a format they may use; <code>plain_text</code> always works</th></tr>
    <tr><th>-71</th><th><code>ERR_TEXT_FORMAT_UNKNOWN</code></th><th>No such format</th><th>Use a format listed at <code>/admin/config/formats</code>; <code>plain_text</code> always exists</th></tr>
    <tr><th>-72</th><th><code>ERR_TEXT_FORMAT_TOO_LARGE</code></th><th>The filtered text is larger than the output buffer</th><th>Filter smaller pieces</th></tr>
    </tbody></table>
    <h2>Query Errors</h2>
    <p><code>query.run</code> (added by B80). It also returns <code>-12</code> when a statement fails or runs
    past the 5 second timeout, <code>-14</code> for JSON that is not a definition or options
    object, <code>-16</code> for a table outside the plugin's allowlist, and <code>-61</code> for a content
    read from cron or the queue without <code>item_background</code>.</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-80</th><th><code>ERR_QUERY_INVALID</code></th><th>The definition is refused: <code>stage_aware = false</code> on content, an include, <code>semantic_similarity</code>, a plugin-table base joining content, a <code>url</code> filter other than <code>equals</code> or <code>in</code>, or anything the gather validator rejects</th><th>The host log names the reason; see <code>docs/design/plugin-query-surface.md</code></th></tr>
    <tr><th>-81</th><th><code>ERR_QUERY_BOUND</code></th><th>More than 100 rows per call, 32 filters (grouped ones and <code>having</code> included), 8 sorts, 3 relationships, filter groups nested past 3, or more than 8 <code>group_by</code> columns or aggregates</th><th>Page with <code>page</code>, or split the query</th></tr>
    </tbody></table>
    <h2>Vocabulary Errors</h2>
    <p>Returned by <code>host::create_owned_vocabulary</code> and <code>host::list_owned_vocabularies</code>
    (<code>trovato:kernel/vocabulary</code>, added by B108). They also return <code>-12</code> when the
    write or read fails and <code>-14</code> for a request that is not valid JSON.</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-90</th><th><code>ERR_VOCABULARY_OWNER_UNDECLARED</code></th><th>The owner type is not one this plugin declares under <code>[[vocabulary_owners]]</code></th><th>Declare it in the manifest</th></tr>
    <tr><th>-91</th><th><code>ERR_VOCABULARY_INVALID</code></th><th>The id is not a machine name of at most 32 characters, the label is empty, or the owner id is empty or longer than 255</th><th>Fix the request</th></tr>
    <tr><th>-92</th><th><code>ERR_VOCABULARY_EXISTS</code></th><th>A vocabulary with this id exists</th><th>Put the owner in the id, or list the owner's vocabularies first</th></tr>
    </tbody></table>
    <h2>User Directory Errors</h2>
    <p>Returned by <code>host::load_users</code>, <code>host::find_user_by_name</code> and
    <code>host::find_users_by_name_prefix</code> (<code>trovato:kernel/user-api</code> <code>load-users</code>,
    <code>find-user-by-name</code> and <code>find-users-by-name-prefix</code>; the first added by B73,
    the other two by B179).</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-73</th><th><code>ERR_USER_DIRECTORY_DENIED</code></th><th>The plugin does not declare <code>user_directory = true</code> under <code>[capabilities]</code></th><th>Declare it, if the plugin needs to read about users it is not serving</th></tr>
    <tr><th>-74</th><th><code>ERR_USER_IDS_INVALID</code></th><th>An id is not a user id (a UUID)</th><th>Pass user ids as the kernel gave them</th></tr>
    <tr><th>-75</th><th><code>ERR_USER_IDS_TOO_MANY</code></th><th>More than 100 ids in one call</th><th>Split the batch</th></tr>
    <tr><th>-76</th><th><code>ERR_USER_NAME_INVALID</code></th><th><code>find-user-by-name</code>'s name was empty or longer than 255 characters</th><th>Pass a name within that range</th></tr>
    <tr><th>-77</th><th><code>ERR_USER_NAME_PREFIX_INVALID</code></th><th><code>find-users-by-name-prefix</code>'s prefix was empty or longer than 255 characters</th><th>Pass a prefix within that range</th></tr>
    </tbody></table>
    <h2>Mail to Member Errors</h2>
    <p>Returned by <code>host::mail_send_to_user</code> (<code>trovato:kernel/mail</code> <code>send-to-user</code>,
    added by B73), besides the <code>ERR_MAIL_*</code> codes <code>mail_send_to_site_contacts</code>
    returns for a malformed message (-52), no SMTP host (-50), a failed delivery
    (-54) and a spent bucket (-55).</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-56</th><th><code>ERR_MAIL_USERS_DENIED</code></th><th>The plugin does not declare <code>mail_users = true</code> under <code>[capabilities]</code></th><th>Declare it, if the plugin needs to mail members</th></tr>
    <tr><th>-57</th><th><code>ERR_MAIL_RECIPIENT_UNAVAILABLE</code></th><th>No such user, the user is blocked, or the user has no address (one code for all three)</th><th>Do not retry</th></tr>
    <tr><th>-58</th><th><code>ERR_MAIL_OPTED_OUT</code></th><th>The member unsubscribed from this plugin's mail</th><th>Do not retry; the member can resubscribe from their account page</th></tr>
    </tbody></table>
    <h2>Queue API Errors</h2>
    <p><code>queue.push</code> (byte-identical, unchanged) returns <code>-1</code> memory missing, <code>-2</code>/<code>-3</code>
    parameter read, <code>-4</code> malformed payload JSON, <code>-5</code> DB insert failed. The additive
    <code>queue.enqueue</code> (P11d / D-48, carries <code>priority</code>/<code>delay</code>) adds:</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-34</th><th><code>ERR_QUEUE_INVALID_PAYLOAD</code></th><th><code>enqueue</code> payload was not valid JSON</th><th>Serialize a valid JSON value</th></tr>
    <tr><th>-35</th><th><code>ERR_QUEUE_INVALID_OPTS</code></th><th><code>enqueue</code> opts were not a valid <code>{priority?, delay?}</code> object</th><th>Build opts with <code>QueueOptions</code></th></tr>
    <tr><th>-36</th><th><code>ERR_QUEUE_INSERT_FAILED</code></th><th><code>enqueue</code> DB insert failed</th><th>Transient — the job was not enqueued; retry</th></tr>
    </tbody></table>
    <p>See <a href="/learn/plugin-queue"><code>plugin-queue.md</code></a> for queue semantics (at-least-once delivery, backoff, dead-lettering).</p>
    <h2>SDK-Side Errors</h2>
    <p>These are produced by SDK wrapper functions before/after the WASM boundary:</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-100</th><th><code>ERR_SDK_SERIALIZE</code></th><th>JSON serialization failed before calling host</th><th>Plugin code bug — check serde derives</th></tr>
    <tr><th>-101</th><th><code>ERR_SDK_UTF8</code></th><th>UTF-8 decoding of response buffer failed</th><th>Kernel bug — file issue</th></tr>
    <tr><th>-102</th><th><code>ERR_SDK_DESERIALIZE</code></th><th>Response JSON deserialization failed</th><th>SDK version mismatch or kernel bug</th></tr>
    <tr><th>-103</th><th><code>ERR_SDK_OUTPUT_BUFFER_EXCEEDED</code></th><th>Result exceeded 256KB buffer limit</th><th>Add LIMIT to queries or paginate</th></tr>
    </tbody></table>
