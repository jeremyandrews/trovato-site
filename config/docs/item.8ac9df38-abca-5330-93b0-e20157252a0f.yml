    <h1>Plugin Error Codes Reference</h1>
    <p>When a host function call fails, it returns a negative <code>i32</code> error code. This document explains each code and how to handle it.</p>
    <p>The authoritative source is <code>crates/plugin-sdk/src/host_errors.rs</code>.</p>
    <h2>General Host Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-1</th><th><code>ERR_MEMORY_MISSING</code></th><th>WASM module does not export <code>"memory"</code></th><th>Plugin build issue — ensure the WASM target exports memory</th></tr>
    <tr><th>-2</th><th><code>ERR_PARAM1_READ</code></th><th>First parameter read failed (UTF-8 or out-of-bounds)</th><th>Plugin code bug — check string parameter encoding</th></tr>
    <tr><th>-3</th><th><code>ERR_PARAM2_OR_OUTPUT</code></th><th>Second parameter or output write failed</th><th>Buffer too small or out of bounds</th></tr>
    <tr><th>-4</th><th><code>ERR_PARAM3_READ</code></th><th>Third parameter read failed</th><th>Check extra parameters (DB params, etc.)</th></tr>
    <tr><th>-10</th><th><code>ERR_NO_SERVICES</code></th><th>Tap executed without request context</th><th>Only occurs in background taps without AppState</th></tr>
    </tbody></table>
    <h2>Database Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-11</th><th><code>ERR_DDL_REJECTED</code></th><th>SQL statement rejected (CREATE, DROP, ALTER, etc.)</th><th>Use <code>execute_raw()</code> for DML; <code>query_raw()</code> for SELECT only</th></tr>
    <tr><th>-12</th><th><code>ERR_SQL_FAILED</code></th><th>SQL execution failed (syntax, constraint, timeout)</th><th>Review query; check statement timeout (5s for plugins)</th></tr>
    <tr><th>-13</th><th><code>ERR_SERIALIZE_FAILED</code></th><th>Result serialization to JSON failed</th><th>Kernel bug — file issue</th></tr>
    <tr><th>-14</th><th><code>ERR_PARAM_DESERIALIZE</code></th><th>JSON parameter deserialization failed</th><th>Check parameter JSON format</th></tr>
    <tr><th>-15</th><th><code>ERR_INVALID_IDENTIFIER</code></th><th>Invalid table or column name</th><th>Names must match <code>[a-zA-Z_][a-zA-Z0-9_]*</code></th></tr>
    </tbody></table>
    <h2>AI API Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-20</th><th><code>ERR_AI_NO_PROVIDER</code></th><th>No provider configured for this operation type</th><th>Admin must configure a provider in AI settings</th></tr>
    <tr><th>-21</th><th><code>ERR_AI_REQUEST_FAILED</code></th><th>HTTP request to AI provider failed</th><th>Check provider availability; retry later</th></tr>
    <tr><th>-22</th><th><code>ERR_AI_RATE_LIMITED</code></th><th>Rate limit exceeded (provider or local)</th><th>Wait and retry; check rate limit configuration</th></tr>
    <tr><th>-23</th><th><code>ERR_AI_INVALID_REQUEST</code></th><th>Malformed <code>AiRequest</code> JSON</th><th>Check AiRequest structure and message roles</th></tr>
    <tr><th>-24</th><th><code>ERR_AI_AUTH_FAILED</code></th><th>Provider returned 401/403</th><th>Check API key configuration</th></tr>
    <tr><th>-25</th><th><code>ERR_AI_PROVIDER_ERROR</code></th><th>Provider returned non-2xx error</th><th>Check provider status; review request parameters</th></tr>
    <tr><th>-26</th><th><code>ERR_AI_BUDGET_EXCEEDED</code></th><th>Token budget exceeded for current period</th><th>Wait for budget reset or increase limit in admin</th></tr>
    <tr><th>-27</th><th><code>ERR_AI_PERMISSION_DENIED</code></th><th>User lacks AI permission</th><th>Grant <code>use ai</code> or operation-specific permission</th></tr>
    </tbody></table>
    <h2>HTTP API Errors</h2>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-30</th><th><code>ERR_HTTP_REQUEST_FAILED</code></th><th>Network/DNS/connection error</th><th>Check endpoint availability</th></tr>
    <tr><th>-31</th><th><code>ERR_HTTP_TIMEOUT</code></th><th>Request timed out (30s default)</th><th>Reduce response time or increase timeout</th></tr>
    <tr><th>-32</th><th><code>ERR_HTTP_INVALID_URL</code></th><th>URL malformed or blocked (SSRF prevention)</th><th>Use public HTTPS URLs only</th></tr>
    <tr><th>-33</th><th><code>ERR_HTTP_RESPONSE_TOO_LARGE</code></th><th>Response body exceeded buffer</th><th>Reduce response size</th></tr>
    </tbody></table>
    <p>The one-shot <code>http.request</code> (byte-identical, unchanged) uses <code>-30</code>..<code>-33</code> above. The
    additive streaming trio <code>http.http-open</code> / <code>http.http-read</code> / <code>http.http-close</code>
    (P11e / D-49, D-50) — for bodies too large to buffer whole in WASM — shares
    <code>-30</code>..<code>-33</code> on open and adds:</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-37</th><th><code>ERR_HTTP_HANDLE_INVALID</code></th><th>Handle unknown, already closed, or from another tap call (handles are Store-scoped)</th><th>Only read/close a handle from the same call that opened it</th></tr>
    <tr><th>-38</th><th><code>ERR_HTTP_STREAM_READ_FAILED</code></th><th>Network error reading the next body chunk</th><th>Transient — reopen and retry</th></tr>
    <tr><th>-39</th><th><code>ERR_HTTP_TRANSFER_BUDGET</code></th><th>Fetch exceeded the manifest-declared, kernel-capped total-transfer ceiling (preflight or mid-stream)</th><th>Raise <code>http_max_transfer</code> (≤ 16 MB) or fetch less</th></tr>
    <tr><th>-40</th><th><code>ERR_HTTP_TOO_MANY_HANDLES</code></th><th>This call already holds the max concurrent open handles</th><th>Close a handle before opening another</th></tr>
    </tbody></table>
    <p>Streaming semantics (D-49/D-50): <code>http-open</code> returns an opaque Store-scoped handle;
    <code>http-read</code> returns ≤ 64 KB per call (the tap I/O buffer), <code>0</code> = EOF; <code>http-close</code>
    releases the connection. The same SSRF fence as <code>request</code> applies on open. Total
    bytes are bounded by the plugin's <code>http_max_transfer</code> capability (default 1 MB,
    kernel max 16 MB); the old 60 s ceiling becomes a total-transfer wall-clock budget
    plus a per-read timeout, and a background tap is additionally bounded by the 150 s
    epoch (the epoch cuts CPU, the transfer budget cuts the wire). Inherited, unchanged
    gaps: the SSRF fence is literal-string / IP-literal based — DNS-rebinding (TOCTOU)
    and redirect re-validation remain out of scope and are not widened by this surface.</p>
    <h2>Queue API Errors</h2>
    <p><code>queue.push</code> (byte-identical, unchanged) returns <code>-1</code> memory missing, <code>-2</code>/<code>-3</code>
    parameter read, <code>-4</code> malformed payload JSON, <code>-5</code> DB insert failed. The additive
    <code>queue.enqueue</code> (P11d / D-48, carries <code>priority</code>/<code>delay</code>) adds:</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-34</th><th><code>ERR_QUEUE_INVALID_PAYLOAD</code></th><th><code>enqueue</code> payload was not valid JSON</th><th>Serialize a valid JSON value</th></tr>
    <tr><th>-35</th><th><code>ERR_QUEUE_INVALID_OPTS</code></th><th><code>enqueue</code> opts were not a valid <code>{priority?, delay?}</code> object</th><th>Build opts with <code>QueueOptions</code></th></tr>
    <tr><th>-36</th><th><code>ERR_QUEUE_INSERT_FAILED</code></th><th><code>enqueue</code> DB insert failed</th><th>Transient — the job was not enqueued; retry</th></tr>
    </tbody></table>
    <p>See <a href="/learn/plugin-queue"><code>plugin-queue.md</code></a> for queue semantics (at-least-once delivery, backoff, dead-lettering).</p>
    <h2>SDK-Side Errors</h2>
    <p>These are produced by SDK wrapper functions before/after the WASM boundary:</p>
    <table><thead><tr><th>Code</th><th>Constant</th><th>Meaning</th><th>Recovery</th></tr></thead><tbody>
    <tr><th>-100</th><th><code>ERR_SDK_SERIALIZE</code></th><th>JSON serialization failed before calling host</th><th>Plugin code bug — check serde derives</th></tr>
    <tr><th>-101</th><th><code>ERR_SDK_UTF8</code></th><th>UTF-8 decoding of response buffer failed</th><th>Kernel bug — file issue</th></tr>
    <tr><th>-102</th><th><code>ERR_SDK_DESERIALIZE</code></th><th>Response JSON deserialization failed</th><th>SDK version mismatch or kernel bug</th></tr>
    <tr><th>-103</th><th><code>ERR_SDK_OUTPUT_BUFFER_EXCEEDED</code></th><th>Result exceeded 256KB buffer limit</th><th>Add LIMIT to queries or paginate</th></tr>
    </tbody></table>
    <h2>Handling Errors in Plugins</h2>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>query_raw<span class="tok-punctuation tok-separator tok-rust">,</span> log</span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
