    <h2>Letting an assistant configure your plugin</h2>
    <p>A person can configure your plugin by talking to it. You declare what is
    configurable, describe the thing being configured, and answer the model's tool
    calls; the kernel runs the conversation, and <strong>every change the model wants to
    make becomes a proposal a person has to apply</strong>.</p>
    <p>That last part is the whole design. A write tool is never executed because a
    model asked for it. The kernel calls it in <code>Describe</code> mode to find out what it
    would do, records a proposal, and only calls it in <code>Execute</code> mode when somebody
    clicks Apply on a card they have read. Your write tool has to honour that: in
    <code>Describe</code> mode it must change nothing.</p>
    <p>Three taps, all optional, all declared in your manifest:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[taps]
    implements = [&quot;tap_assistant_scopes&quot;, &quot;tap_assistant_context&quot;, &quot;tap_assistant_tool&quot;]

    [capabilities]
    # `user-api` so a tool can check the caller&#39;s permission at the moment of the
    # change, which is where the change happens.
    host_interfaces = [&quot;variables&quot;, &quot;user-api&quot;, &quot;logging&quot;]
    </code></pre></figure><p>A tap the manifest does not list is never dispatched, so an exported tap missing
    from <code>implements</code> is silently dead. The whole example below is
    <code>plugins/test_assistant_scope</code>.</p>
    <h3>1. Declare what can be configured</h3>
    <p><code>tap_assistant_scopes</code> runs once at startup, without services. Return a scope per
    configurable thing:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_assistant_scopes</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>AssistantScope<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-support tok-macro tok-rust">vec!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span>
            <span class="tok-meta tok-path tok-rust">AssistantScope<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>
                <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>test_widget<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>                 <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> machine name, [a-z0-9_]+, unique site-wide
    </span>            <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Test widget<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
                <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>configure test widget<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>       <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> the permission that opens it
    </span>            <span class="tok-meta tok-path tok-rust">AssistantIdKind<span class="tok-punctuation tok-accessor tok-rust">::</span></span>String<span class="tok-punctuation tok-separator tok-rust">,</span>       <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Item, String or None
    </span>        </span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
