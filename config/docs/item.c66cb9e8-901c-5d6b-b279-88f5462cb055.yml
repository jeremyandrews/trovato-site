    </span>        </span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
            .<span class="tok-support tok-function tok-rust">card</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Manage user groups.<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> optional: also show a dashboard card
    </span>    <span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p><code>permission</code> is display filtering only, exactly like every kernel sidebar
    link: a viewer who does not hold it does not see the link or the card, but
    the route itself still has to check the permission on every request — the
    sidebar never substitutes for that check. Gate the two on the same
    permission, as above, so they cannot disagree about who may reach the screen.</p>
    <p>A disabled plugin contributes no link and no card. The declaration is read
    when the server starts, from the plugins enabled then, so enabling or
    disabling a plugin (from <code>/admin/plugins</code> or <code>trovato plugin enable|disable</code>)
    changes its link and card at the next restart, the same moment its routes
    appear or go. The permission, by contrast, is checked against the viewer on
    every request, exactly as for the kernel's own links.</p>
    <p><code>href</code> must be the plugin's own path below <code>/admin/</code> (<code>/admin/groups</code>, not
    <code>/administrator</code> or <code>/admin/../groups</code>: no empty, <code>.</code> or <code>..</code> segments, encoded or
    not, and no backslash), and distinct from every kernel link, every prefix a
    kernel link already highlights for (Categories owns <code>/admin/structure/tags</code>),
    and every other plugin's declared href. A declaration that breaks any of these
    is dropped (logged, not fatal) rather than sending the viewer somewhere else or
    shadowing an existing screen.</p>
    <p>For the admin page itself to pick up the kernel's chrome, serve it from a
    <code>tap_api</code> route under <code>/admin</code> and answer with <code>ApiResponse::themed(title, body)</code>, the same way any themed plugin page does. Gate the route on the same
    permission the link declares:</p>
