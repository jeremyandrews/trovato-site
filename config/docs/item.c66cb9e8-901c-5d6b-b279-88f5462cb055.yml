    <h2>Plugin Structure</h2>
    <h3>Directory Layout</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>plugins/my_plugin/
    ├── Cargo.toml           # Rust package configuration
    ├── my_plugin.info.toml  # Plugin metadata and tap declarations
    ├── my_plugin.wasm       # Compiled WASM binary (generated)
    └── src/
        └── lib.rs           # Plugin source code
    </code></pre></figure><h3>Plugin Metadata (<code>.info.toml</code>)</h3>
    <p>Every plugin requires an info file declaring its metadata and capabilities:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;blog&quot;
    description = &quot;Provides a blog content type with tags&quot;
    version = &quot;1.0.0&quot;
    dependencies = [&quot;categories&quot;]  # Optional: plugins that must load first

    [taps]
    implements = [
        &quot;tap_item_info&quot;,
        &quot;tap_item_view&quot;,
        &quot;tap_item_access&quot;,
        &quot;tap_menu&quot;,
        &quot;tap_perm&quot;,
    ]
    weight = 0  # Lower weight = earlier execution
    </code></pre></figure><table><thead><tr><th>Field</th><th>Required</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>name</code></th><th>Yes</th><th>Machine name (lowercase, matches directory)</th></tr>
    <tr><th><code>description</code></th><th>Yes</th><th>Human-readable description</th></tr>
    <tr><th><code>version</code></th><th>Yes</th><th>Semantic version (e.g., "1.0.0")</th></tr>
    <tr><th><code>dependencies</code></th><th>No</th><th>Array of required plugin names</th></tr>
    <tr><th><code>[taps].implements</code></th><th>Yes</th><th>Array of tap function names</th></tr>
    <tr><th><code>[taps].weight</code></th><th>No</th><th>Execution order (default: 0)</th></tr>
    <tr><th><code>[migrations].files</code></th><th>No</th><th>Array of SQL migration file paths</th></tr>
    <tr><th><code>[migrations].depends_on</code></th><th>No</th><th>Plugin names whose migrations run first</th></tr>
    <tr><th><code>[capabilities]</code></th><th>No</th><th>What the plugin may reach: host interfaces, tables, <code>raw_sql</code> and the background grants. Absent means nothing. See <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/plugin-capabilities.md">plugin-capabilities.md</a></th></tr>
    <tr><th><code>[config].tables</code></th><th>No</th><th>The plugin's own tables that hold site configuration, carried by <code>config export</code> and <code>config import</code> (API 0.105). See <a href="#configuration-tables">Configuration Tables</a></th></tr>
    <tr><th><code>[config].secret_columns</code></th><th>No</th><th>Per config table, the columns that hold a secret, a password, a token, a key or a hash of one; never exported (API 0.105). See <a href="#secret-columns">Secret Columns</a></th></tr>
    </tbody></table>
    <h3>Configuration Tables</h3>
    <p>A table your migrations create that holds site configuration (a list of
    redirects, image styles, API clients) should travel with the site's other
    configuration. Name it under <code>[config]</code>:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[config]
    tables = [&quot;redirect&quot;]
    </code></pre></figure><p><code>trovato config export</code> then writes each row as <code>redirect.&lt;primary key&gt;.yml</code>,
    a map of column to value, after the kernel's own config entities, and
    <code>trovato config import</code> upserts the rows by primary key, in the order the
    plugins' migrations run. A row whose other unique key (a <code>name</code>, say) is held
    under a different primary key, as a row your migration seeded with a random id
    would be, takes that row over. Import refuses a row whose plugin would not be
    enabled, that names a column the table lacks, or whose value does not fit its
    column, before it writes anything.</p>
    <p>Name only configuration: not content, not a log, a queue, a cache or anything
    else that changes while the site runs. The table must be one your migrations
    create and the table needs a primary key. Whether the plugin is enabled travels
    too, as <code>plugin_status.&lt;name&gt;.yml</code>.</p>
    <h3>Secret Columns</h3>
    <p>A config set is meant to be committed to a repository, so it never carries a
    secret. Name every column of a config table that holds a secret, a password, a
    token, an API or signing key, or a hash of one:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[config]
    tables = [&quot;webhook&quot;]
    secret_columns = { webhook = [&quot;secret&quot;] }
    </code></pre></figure><p>Export writes such a column as <code>env:TROVATO_SECRET_&lt;TABLE&gt;_&lt;PK&gt;_&lt;COLUMN&gt;</code> (upper
    case, every other character <code>_</code>), or leaves it out when it is empty. Import
    keeps the value the target row already holds; failing that it reads the named
    variable from its environment; failing that it refuses the row and writes
    nothing. A file holding a value in the clear there is refused. A column whose
    name ends in <code>_hash</code> stores an Argon2id hash in PHC form: its variable holds
    the plaintext, which import hashes (verify it with <code>argon2</code>'s
    <code>PasswordVerifier</code>, as the OAuth token endpoint does). A secret column holds
    text.</p>
    <p>A column whose name says it is a credential (<code>secret</code>, <code>password</code>, <code>api_key</code>,
    <code>access_token</code>, ...) is treated as secret even if you forget to name it, and
    export warns. Name it anyway: the declaration is the contract, the name check
    is the backstop.</p>
    <h3>SQL Migrations</h3>
    <p>Plugins can include SQL migrations that run at startup. Add a <code>[migrations]</code> section:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[migrations]
    files = [
        &quot;migrations/001_gather_queries.sql&quot;,
        &quot;migrations/002_roles.sql&quot;,
    ]
    </code></pre></figure><p><strong>Execution ordering:</strong> Kernel tables are created first, then plugin migrations run in dependency order (topological sort). This means your migrations can safely reference kernel tables (<code>item</code>, <code>gather_query</code>, <code>url_alias</code>, <code>roles</code>, <code>role_permissions</code>).</p>
    <p><strong>Forward-only:</strong> Migrations have no rollback mechanism. Each file runs exactly once, tracked in the <code>plugin_migration</code> table. Use idempotent SQL patterns (<code>ON CONFLICT ... DO UPDATE/DO NOTHING</code>) so migrations are safe to re-run if the tracking state is lost.</p>
    <p><strong>Gather query field references:</strong> Filter and sort field paths (e.g., <code>"fields.display_name"</code>) are not validated against content type definitions at registration time. Double-check that field names in your gather query JSON match the <code>field_name</code> values in your <code>tap_item_info</code> definitions — a typo will silently produce NULL comparisons at query time.</p>
    <h3>Gathers that require a permission</h3>
    <p>A gather is public unless it says otherwise: its page, its route aliases, its
    feed and the JSON API serve its rows to whoever asks, filtered only by item
    access. A gather over your own tables, or one listing things only some roles
    should see, declares the permission a viewer needs in its definition:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>access<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>: <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>permission<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>view network devices<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span> </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Seeded from a migration, next to the definition it guards:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">INSERT INTO</span> gather_query (query_id, label, description, definition, display, plugin, created, changed)
    <span class="tok-keyword tok-other tok-DML tok-II tok-sql">VALUES</span> (
        <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>ng_device_list<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>,
        <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>Devices<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>,
        <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>Every device seen on the network<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>,
        <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>{
            &quot;record_type&quot;: &quot;ng_device_state&quot;,
            &quot;access&quot;: { &quot;permission&quot;: &quot;view network devices&quot; },
            &quot;sorts&quot;: [{&quot;field&quot;: &quot;last_seen&quot;, &quot;direction&quot;: &quot;desc&quot;, &quot;nulls&quot;: null}]
        }<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>::jsonb,
        <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>{&quot;format&quot;: &quot;table&quot;, &quot;items_per_page&quot;: 50, &quot;canonical_url&quot;: &quot;/devices&quot;}<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>::jsonb,
        <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>netgrasp<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>,
        EXTRACT(EPOCH <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> NOW<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>)::<span class="tok-storage tok-type tok-sql">bigint</span>,
        EXTRACT(EPOCH <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> NOW<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>)::<span class="tok-storage tok-type tok-sql">bigint</span>
    )
    <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> CONFLICT (query_id) DO <span class="tok-keyword tok-other tok-DML tok-sql">UPDATE</span> <span class="tok-keyword tok-other tok-DML tok-sql">SET</span>
        definition <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">definition</span>,
        display    <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">display</span>,
        changed    <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">changed</span>;
    </span></code></pre></figure><p>For a gather that already exists, add the key in a later migration rather than
    rewriting the whole definition:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">UPDATE</span> gather_query
    <span class="tok-keyword tok-other tok-DML tok-sql">SET</span> definition <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> jsonb_set(definition, <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>{access}<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>, <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>{&quot;permission&quot;: &quot;view network devices&quot;}<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>::jsonb)
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> query_id <span class="tok-keyword tok-other tok-data-integrity tok-sql">IN</span> (<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>ng_device_list<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>, <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>ng_device_online<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>);
    </span></code></pre></figure><p>Declare the permission itself in <code>tap_perm</code> (see
    <a href="#defining-permissions">Defining Permissions</a>) so an administrator can grant it.</p>
    <p>What the kernel then does for a viewer without it, before the query runs:</p>
    <table><thead><tr><th>Path</th><th>Anonymous visitor</th><th>Signed-in user without it</th></tr></thead><tbody>
    <tr><th><code>/gather/{query_id}</code>, its <code>canonical_url</code> or a URL alias to it, each <code>display.routes</code> path</th><th>redirect to <code>/user/login</code></th><th>403</th></tr>
    <tr><th><code>display.routes</code> path with <code>?format=json</code>, <code>/api/v1/query/{query_id}</code>, <code>/api/v1/query/{query_id}/execute</code></th><th>403, JSON <code>error</code></th><th>403, JSON <code>error</code></th></tr>
    <tr><th><code>display.feed</code> path</th><th>403</th><th>403</th></tr>
    <tr><th><code>/api/v1/queries</code></th><th>the gather is left out</th><th>the gather is left out</th></tr>
    <tr><th><code>menu_link</code> rows pointing at any of the addresses above</th><th>not drawn</th><th>not drawn</th></tr>
    </tbody></table>
    <p>Administrators pass, as they do everywhere, and an anonymous visitor passes if
    the anonymous role holds the permission. Rows are still filtered by item access
    for a viewer who passes: this is a gate in front of the query, not a
    replacement for it. Only the top-level definition's <code>access</code> counts; an
    include runs as part of its parent.</p>
    <p>A gather over a lightweight-record type (<code>record_type</code>) that declares no
    permission requires <code>access content</code>, the permission the published path of
    item access already asks for, so it is never public by accident. Declare a
    permission of your own for anything more specific.</p>
    <p>A <code>menu_link</code> row has no permission of its own. It is drawn for a viewer only
    when the address it points at is one they could open: not a gather they may not
    run, and not a plugin route whose <code>tap_menu</code> permission they lack. A link under
    one that is not drawn is not drawn either.</p>
    <h3>Gather feeds</h3>
    <p>A gather declares a feed in its display config and gets an RSS 2.0 document at
    the path it names and an Atom 1.0 document beside it:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>feed<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>: <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>path<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/blog/feed.xml<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>title<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Blog<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>description<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Recent blog posts<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>items<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">20</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>full_content<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-language tok-json">false</span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><table><thead><tr><th>Key</th><th>Default</th><th>Meaning</th></tr></thead><tbody>
    <tr><th><code>path</code></th><th>required</th><th>Where the RSS document is served. Absolute; may carry one argument (below).</th></tr>
    <tr><th><code>paths</code></th><th>none</th><th>More addresses for the same feed, under the same rules.</th></tr>
    <tr><th><code>title</code></th><th>the gather's <code>label</code></th><th>Channel and feed title.</th></tr>
    <tr><th><code>description</code></th><th>the gather's <code>description</code></th><th>Channel description and Atom subtitle.</th></tr>
    <tr><th><code>items</code></th><th>20</th><th>Entries carried, at most 200.</th></tr>
    <tr><th><code>full_content</code></th><th><code>false</code></th><th>Also carry the body as HTML (RSS <code>content:encoded</code>, Atom <code>&lt;content type="html"&gt;</code>).</th></tr>
    </tbody></table>
    <p>The Atom document is at the path's <code>.atom</code> sibling: the last segment's extension
    replaced, or <code>.atom</code> appended when it has none, so <code>/blog/feed.xml</code> is also
    <code>/blog/feed.atom</code> and <code>/blog/feed</code> is also <code>/blog/feed.atom</code>. It is derived
    rather than declared so every feed has Atom with no config change and there is
    no second path to keep unique. Both are advertised on every page with
    <code>&lt;link rel="alternate"&gt;</code> (the <code>feeds</code> template variable: <code>path</code>, <code>atom_path</code>,
    <code>title</code>).</p>
    <p><strong>The channel link.</strong> RSS <code>&lt;link&gt;</code> and Atom <code>&lt;link rel="alternate"&gt;</code> point at
    the page the feed is a feed of — the address a visitor actually uses, not the
    feed's own URL (that is <code>rel="self"</code>). It is chosen in this order:</p>
    <ol>
    <li>For a feed reached with an argument, the <code>display.routes</code> path taking that
    one argument, filled with its value — <code>/blog/author/{user}/feed.xml</code> links
    <code>/blog/author/jeremy</code>.</li>
    <li>The gather's <code>canonical_url</code>, if it has one.</li>
    <li>The outbound URL alias of <code>/gather/{query_id}</code>, if the <code>url_alias</code> table has
    one — so a gather reachable only through an alias (no <code>canonical_url</code>, the
    way <code>trovato_blog</code>'s <code>blog_listing</code> ships: <code>/blog</code> is a URL alias, not a
    <code>canonical_url</code>, to avoid a redirect from <code>/gather/blog_listing</code> back to an
    alias that already rewrites to it) still links the address visitors use.
    Resolved per request, cached, and cleared the moment an alias is written —
    no restart needed, unlike the first two tiers.</li>
    <li><code>/gather/{query_id}</code> itself, when none of the above apply.</li>
    </ol>
    <p>Every entry carries:</p>
    <ul>
    <li>an id that never changes, <code>urn:uuid:&lt;item id&gt;</code> (RSS
    <code>&lt;guid isPermaLink="false"&gt;</code>, Atom <code>&lt;id&gt;</code>), so moving an item to a new URL
    alias does not make every reader show it again as new;</li>
    <li>the absolute link to the item, its URL alias when it has one;</li>
    <li>the author's account name (<code>dc:creator</code>, Atom <code>&lt;author&gt;&lt;name&gt;</code>). An account
    name that is an email address is left out, never published;</li>
    <li>every taxonomy term on the item (<code>&lt;category&gt;</code>, Atom <code>&lt;category term&gt;</code>);</li>
    <li>a plain-text summary: the first of <code>summary</code>, <code>field_summary</code>, <code>field_teaser</code>
    or <code>field_description</code> the item has, otherwise its body (<code>field_body</code> or
    <code>body</code>) with the markup stripped and cut at a word boundary near 300
    characters;</li>
    <li>with <code>full_content</code>, the body rendered through its text format, as the item
    page renders it.</li>
    </ul>
    <p>Text is escaped exactly once, the rule the search snippet uses: extracted from
    the stored markup, then escaped for XML.</p>
    <p>Every absolute URL (links, the <code>rel="self"</code> links, the Atom feed id) is built
    from <code>SITE_URL</code>, never from the request's <code>Host</code> header. The kernel logs one
    warning at startup when <code>SITE_URL</code> is unset or names a loopback host.</p>
    <p><strong>Access.</strong> A feed is the requesting viewer's own execution of the gather, the
    same as its page: an anonymous aggregator gets what an anonymous visitor would
    see, and a gather that requires a permission answers 403 (see the table above).
    Nothing is cached on the server between viewers.</p>
    <p><strong>Polling.</strong> Each response carries an <code>ETag</code> and a <code>Last-Modified</code>. The <code>ETag</code>
    hashes the entries' ids, <code>changed</code> timestamps, links and author names, the
    terms each entry carries, the resolved channel link, and the feed's config, so
    it moves on any of those. <code>Last-Modified</code> is the latest of: the newest entry's
    <code>changed</code> (or <code>created</code>); the gather's own <code>changed</code>, so editing the feed's
    title, description or other config moves it too, not only the <code>ETag</code>; and,
    when the channel link resolves through a <code>url_alias</code> row rather than a fixed
    path (tier 3 above), that row's own <code>changed</code>, so repointing the link moves it
    as well. A request whose <code>If-None-Match</code> (or, without one, <code>If-Modified-Since</code>)
    still matches gets <code>304 Not Modified</code> before terms are loaded or anything is
    rendered. The query itself still runs, as the viewer, because that is what
    decides what the viewer may see. An anonymous response is
    <code>Cache-Control: public, max-age=300</code>; a response to a signed-in session is
    <code>private, no-cache</code>, since it ran with that viewer's access.</p>
    <p>An item's title, summary and body are not hashed directly — they can only
    change through an edit to the item, the same write that bumps <code>changed</code> — but
    an author's account name and a term's label are edited on a different row, so
    they are hashed explicitly: the account name actually fetched for the entry
    (already loaded for <code>dc:creator</code> / <code>&lt;author&gt;&lt;name&gt;</code>), and each term the entry
    prints, by id and label. The labels are read in one query for the whole
    response, before the <code>304</code> check, never one per entry or per term. So a
    renamed account or a relabelled term invalidates the <code>ETag</code> of exactly the
    feeds that print it, at once, rather than waiting for the entry's next edit.</p>
    <h4>A feed per author, per tag, per anything the gather takes</h4>
    <p>A feed path may carry one argument, as a whole segment before the last:
    <code>/blog/author/{user}/feed.xml</code>, <code>/tag/{term}/rss.xml</code>. The argument is bound
    exactly the way the gather's own page binds it: by the <code>display.routes</code>
    parameter mapping whose <code>segment</code> has the same name. There is no separate
    argument config for feeds, and the lookup is the same code, so <code>tag_category</code>
    resolves a tag slug, <code>user: true</code> resolves an account name, and anything else
    is passed through.</p>
    <p><code>paths</code> lists more addresses for the same feed, so one declaration serves the
    whole listing and each of its arguments. The stock blog gather
    (<code>trovato_blog</code>, migration <code>002_author_and_tag_feeds.sql</code>) is the worked
    example:</p>
