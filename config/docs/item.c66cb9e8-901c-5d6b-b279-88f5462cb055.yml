    </span></code></pre></figure><h3>Other Users</h3>
    <p><code>host::load_users</code> answers public facts about users the plugin is not serving,
    by id: name, status (<code>"active"</code> or <code>"blocked"</code>), timezone, language and when
    the account was created. Never an address, a password hash or the user's
    <code>data</code>; no capability grants an address. It needs <code>user-api</code> in
    <code>host_interfaces</code> <strong>and</strong> <code>user_directory = true</code> under <code>[capabilities]</code>:
    declaring <code>user-api</code> alone does not grant it, and the call is refused with
    <code>ERR_USER_DIRECTORY_DENIED</code>.</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[capabilities]
    host_interfaces = [&quot;user-api&quot;]
    user_directory = true
    </code></pre></figure><figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Up to 100 ids a call, one database query for the whole batch. Ids that
    </span><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> name no user are left out; a malformed id or more than 100 is refused.
    </span><span class="tok-storage tok-type tok-rust">let</span> users <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>load_users<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>0190...<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>0190...<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-keyword tok-control tok-rust">for</span> user <span class="tok-keyword tok-operator tok-rust">in</span> users.<span class="tok-support tok-function tok-rust">iter</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.<span class="tok-support tok-function tok-rust">filter</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">|</span></span></span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-variable tok-parameter tok-rust">u</span><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">|</span></span> </span><span class="tok-meta tok-function tok-closure tok-rust">u.status <span class="tok-keyword tok-operator tok-rust">=</span><span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>active<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> user.name, user.timezone, user.language, user.created
    </span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span></code></pre></figure><p>Look a digest's recipients up in batches of 100, not one at a time.</p>
    <p><code>host::find_user_by_name</code> and <code>host::find_users_by_name_prefix</code> answer the
    same shape, by name instead of by id, so a plugin can resolve a name a person
    typed to the account it names — the groups plugin's "add member by name"
    could not do this before B179: it could only match names it had already seen
    in its own tables, so an account created straight on the site answered "no
    such user". Both need the same capability as <code>load_users</code>; no new manifest key.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Exact match, case-insensitive the same way login matches a name.
    </span><span class="tok-keyword tok-control tok-rust">match</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>find_user_by_name<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>jsmith<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-support tok-type tok-rust">Ok</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-support tok-type tok-rust">Some</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>user</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=&gt;</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-comment tok-block tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">/*</span> user.id, user.name, ... <span class="tok-punctuation tok-definition tok-comment tok-rust">*/</span></span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        <span class="tok-support tok-type tok-rust">Ok</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-support tok-type tok-rust">None</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=&gt;</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-comment tok-block tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">/*</span> no such user <span class="tok-punctuation tok-definition tok-comment tok-rust">*/</span></span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        <span class="tok-support tok-type tok-rust">Err</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>code</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=&gt;</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-comment tok-block tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">/*</span> refused; see plugin-error-codes.md <span class="tok-punctuation tok-definition tok-comment tok-rust">*/</span></span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>

    <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> A short, sorted list for an autocomplete widget as the plugin&#39;s user
    </span><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> types; at most 10 results, not caller-configurable.
    </span><span class="tok-storage tok-type tok-rust">let</span> matches <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>find_users_by_name_prefix<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>js<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>Neither call filters a blocked account or the anonymous account out of its
    answer: the visibility rule is the one <code>load_users</code> already has — nothing
    beyond the <code>user_directory</code> capability gate itself, the same rule the
    kernel's own <code>/admin/people</code> listing uses for an administrator. A plugin that
    only wants to offer active accounts checks <code>user.status == "active"</code> itself,
    the same way the <code>load_users</code> example above does.</p>
    <p>ABI: <code>load-users</code> is in the existing <code>user-api</code> interface, with a new
    manifest capability, <code>user_directory</code> (B73, after 0.104.0). <code>find-user-by-name</code>
    and <code>find-users-by-name-prefix</code> are two more functions in the same interface,
    sharing that capability (B179, after 0.104.0). No existing signature changed.</p>
    <h3>Mailing a Member</h3>
    <p><code>host::mail_send_to_user</code> sends a plain text message to one of the site's
    members, by user id. The kernel looks the address up: the plugin never sees
    it, in a return value, an error or a log line. It needs <code>mail</code> in
    <code>host_interfaces</code> <strong>and</strong> <code>mail_users = true</code> under <code>[capabilities]</code>;
    declaring <code>mail</code> alone still means the site contact address only, and this
    call is refused with <code>ERR_MAIL_USERS_DENIED</code>.</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[capabilities]
    host_interfaces = [&quot;mail&quot;]
    mail_users = true
    </code></pre></figure><figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-control tok-rust">match</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>mail_send_to_user<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>user_id<span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Your weekly digest<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>body</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-support tok-type tok-rust">Ok</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=&gt;</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> The member unsubscribed from this plugin&#39;s mail: do not retry.
