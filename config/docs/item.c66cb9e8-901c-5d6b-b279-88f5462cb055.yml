    <table><thead><tr><th>Type</th><th>Rust Definition</th><th>Description</th></tr></thead><tbody>
    <tr><th>Text</th><th><code>FieldType::Text { max_length: Option&lt;usize&gt; }</code></th><th>Single-line text</th></tr>
    <tr><th>TextLong</th><th><code>FieldType::TextLong</code></th><th>Multi-line text with format</th></tr>
    <tr><th>Integer</th><th><code>FieldType::Integer</code></th><th>Whole numbers</th></tr>
    <tr><th>Float</th><th><code>FieldType::Float</code></th><th>Decimal numbers</th></tr>
    <tr><th>Boolean</th><th><code>FieldType::Boolean</code></th><th>True/false</th></tr>
    <tr><th>Date</th><th><code>FieldType::Date</code></th><th>Date value</th></tr>
    <tr><th>Email</th><th><code>FieldType::Email</code></th><th>Email address</th></tr>
    <tr><th>File</th><th><code>FieldType::File</code></th><th>File upload</th></tr>
    <tr><th>Reference</th><th><code>FieldType::RecordReference(target_type)</code></th><th>Reference to another item, of one content type</th></tr>
    <tr><th>Category reference</th><th><code>FieldType::CategoryReference(category_id)</code></th><th>Tags of one category: a JSON array of tag uuid strings, whatever the cardinality. Every write refuses a value that is not a tag of that category. Added in B72 (0.105.0). <code>FieldType</code> is <code>#[non_exhaustive]</code>, so a plugin that matches on it needs a <code>_</code> arm</th></tr>
    </tbody></table>
    <h3>Field Options</h3>
    <p>Every field definition, in Rust or in an <code>item_type.*.yml</code> config file, takes
    these options besides its name, type and label:</p>
    <table><thead><tr><th>Option</th><th>Default</th><th>Meaning</th></tr></thead><tbody>
    <tr><th><code>required</code></th><th><code>false</code></th><th>The form refuses a save without a value</th></tr>
    <tr><th><code>cardinality</code></th><th><code>1</code></th><th>How many values: <code>1</code> single, <code>-1</code> unlimited, <code>n</code> at most <code>n</code>. The form shows each stored value plus one empty slot and an "Add another" button. Every write path refuses more than <code>n</code> (the item form, the item API, <code>save-item</code>, config import): a JSON array counts its elements, any other value counts as one</th></tr>
    <tr><th><code>settings</code></th><th><code>{}</code></th><th>Type specific settings, and <code>visible_when</code> (below)</th></tr>
    <tr><th><code>personal_data</code></th><th><code>false</code></th><th>Included in data exports and anonymised on account deletion</th></tr>
    </tbody></table>
    <p><code>settings.visible_when: {field, equals}</code> shows the field only while <code>field</code>
    (in the same type) has the value <code>equals</code>. It lives in <code>settings</code> so that a
    definition without it, and a plugin built against an earlier SDK, are
    unaffected. It compares the controlling field's value as the form posts it:
    the option key of a select, the text of a text field, <code>"1"</code> for a checked
    Boolean and <code>""</code> for an unchecked one. While it is false the form hides the
    field, a save keeps the field's stored value whatever was posted for it, and
    <code>required</code> is not checked. The form shows and hides it as the editor types
    (<code>static/js/form-states.js</code>); without JavaScript every field starts as the
    stored values say and the server applies the rule on save.</p>
