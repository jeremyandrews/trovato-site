    </span></code></pre></figure><h3>The static search index: queue what you change</h3>
    <p>The site's static search index (Pagefind, under <code>/pagefind/</code>) is updated item by
    item. Each change to what an item's search page is built from queues that item,
    and the next cron run rewrites only the queued items' part of the index.
    Nothing polls for changes, so a change that queues nothing is never seen.</p>
    <p><strong>Writes to items, comments and URL aliases are queued by the database.</strong>
    Triggers on the <code>item</code>, <code>comment</code> and <code>url_alias</code> tables queue the item a write
    changes, in the write's own transaction. That holds for <code>host::save_item</code>, the
    kernel's services and a plugin's raw SQL alike. A write that commits is
    queued, and one that rolls back is not.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>execute_raw<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>UPDATE item SET fields = jsonb_set(fields, &#39;{field_rating}&#39;, $1) WHERE id = $2::uuid<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
        <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-support tok-macro tok-rust">json!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>rating</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-support tok-macro tok-rust">json!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>id</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
    </span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Queued already: nothing more to do.
    </span></span></code></pre></figure><p><strong>The rule:</strong> when your plugin changes something else that decides what an
    item's search page holds, call <code>host::search_index_enqueue</code> afterwards with the
    ids of the items it affects. The usual case is data of your own that your
    <code>tap_field_access</code> reads: the index is built as the anonymous visitor, so a
    change to which fields that visitor may see changes the page.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>execute_raw<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>UPDATE my_plugin_field_embargo SET lifted = true WHERE item_id = $1::uuid<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-support tok-macro tok-rust">json!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>id</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>search_index_enqueue<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span>id.<span class="tok-support tok-function tok-rust">as_str</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>   <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Ok(rows queued)
    </span></span></code></pre></figure><ul>
    <li>Queuing twice is harmless. Queuing an item that is not searchable (a draft, a
    workspace item, one anonymous visitors cannot see) is also harmless: the
    updater takes it out of the index or leaves it out.</li>
    <li>It needs the <code>db</code> host interface and takes up to 10,000 ids per call. An id
    that is not a UUID is <code>-14</code> (<code>ERR_PARAM_DESERIALIZE</code>), and more than 10,000
    ids is <code>-82</code> (<code>ERR_DB_BATCH_TOO_LARGE</code>).</li>
    <li>The queue row records the reason as <code>plugin:&lt;your plugin name&gt;</code>, so an
    operator can see who queued what.</li>
    </ul>
    <p>Without the call, such a change reaches search only at the next full rebuild.
    That happens after compaction or when an operator runs <code>trovato search rebuild</code>, which may be days away.</p>
    <hr />
