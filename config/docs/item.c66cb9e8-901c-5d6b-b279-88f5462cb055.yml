    <p>A plugin's own <code>/admin/...</code> page renders inside the kernel's <code>page--admin.html</code>,
    with the same sidebar and dashboard every kernel admin page gets — filtered to
    what the signed-in viewer may actually open. A plugin adds its own entry to
    that sidebar and to the <code>/admin</code> dashboard through <code>tap_admin_nav</code>, the same
    shape <code>tap_menu</code> and <code>tap_perm</code> already use: a declaration collected once at
    boot, not queried per request.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_admin_nav</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>AdminNavDefinition<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-support tok-macro tok-rust">vec!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span>
            <span class="tok-meta tok-path tok-rust">AdminNavDefinition<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>
