    </span></code></pre></figure><p>A condition's <code>op</code> is one of <code>=</code>, <code>!=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>, <code>in</code>, <code>not_in</code>,
    <code>is_null</code> or <code>is_not_null</code>. An empty <code>where</code>, an unknown op or an empty <code>in</code>
    list is refused with <code>-14</code>, so none of them can turn into "every row". Values
    bind as their JSON type, and a string binds as text. To compare a <code>uuid</code>
    column, store the key as text or filter on it in a <a href="#queries">query</a>.</p>
    <p>To count, sum or group your own rows, use <code>host::query</code> with <code>group_by</code> and
    <code>aggregates</code> (<a href="#queries">Queries</a>) rather than raw SQL.</p>
    <h3>Raw SQL (Requires <code>raw_sql</code>)</h3>
    <p><code>raw_sql = true</code> under <code>[capabilities]</code> lets a plugin read any table outside
    the protected floor, with no viewer, stage or language. Keep it for what the
    structured calls and <code>host::query</code> cannot express: recursive CTEs, window
    functions, extension operators, locking reads.</p>
    <p>The admin plugin listing marks every plugin holding it and boot logs one line
    naming them all; <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/plugin-capabilities.md">plugin-capabilities.md</a> is
    what to tell an administrator the grant means.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">let</span> rows <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>query_raw<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>SELECT * FROM my_table WHERE name = $1<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-support tok-macro tok-rust">json!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Example<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
