    </span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>The kernel decides what the query sees, and the plugin cannot change it: an
    item query reads only what the viewer may view, on the request's stages, in its
    language, with the fields they may not see removed, and <code>stage_aware = false</code>
    is refused. A query over one of the plugin's own tables (migration-owned or in
    <code>db_tables</code>) reads it as it is. An item query may join the kernel's join tables
    and the plugin's own tables; a query over the plugin's own table may not join
    <code>item</code>. A page holds at most 100 rows (<code>has_next</code> says whether there is more),
    and a definition carries at most 32 filters, 8 sorts and 3 relationships.
    From cron or a queue worker an item query needs <code>item_background</code>. Every error
    code is in <a href="/learn/plugin-error-codes#query-errors">plugin-error-codes.md</a>, and
    the design is <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/design/plugin-query-surface.md">plugin-query-surface.md</a>.</p>
    <p><code>filter_groups</code> add <code>or</code> (and nested <code>and</code>) to a definition, at most three deep.
    Every grouped filter counts toward the 32. Over the plugin's own table,
    <code>group_by</code>, <code>aggregates</code> (<code>count</code>, <code>sum</code>, <code>min</code>, <code>max</code>, <code>avg</code>), <code>having</code> and
    <code>distinct</code> summarise rows; they are refused on content (-80), where they would
    count rows the viewer may not see:</p>
