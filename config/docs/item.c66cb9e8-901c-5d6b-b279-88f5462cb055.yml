    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span></code></pre></figure><p>Every message goes from the site's <code>from</code> address and ends with a footer
    linking to <code>/user/mail/unsubscribe/{token}</code>; the same link is in its
    <code>List-Unsubscribe</code> header, with <code>List-Unsubscribe-Post: List-Unsubscribe=One-Click</code>, so a mail client's unsubscribe button works. The
    opt out is per member and per plugin. A member sees what they turned off on
    their account page and can resubscribe there; the plugin is only ever told
    <code>ERR_MAIL_OPTED_OUT</code>.</p>
    <p>Two buckets apply, and a refusal from either is <code>ERR_MAIL_RATE_LIMITED</code>:
    <code>mail_users</code>, 1000 messages an hour per plugin, and <code>mail_recipient</code>, 10 an
    hour per plugin and member.</p>
    <p><strong>Many recipients: enqueue one job per recipient.</strong> Do not loop over members
    inside <code>tap_cron</code>. Every plugin's <code>tap_cron</code> shares one dispatch that the
    kernel stops after 150 seconds, and each message is an SMTP round trip, so a
    long loop is cut off partway with no record of who was mailed. Instead,
    <code>host::queue_push</code> one job per recipient from <code>tap_cron</code> and send in
    <code>tap_queue_worker</code>. A failure retries that one recipient, not the whole
    list, and the work spreads over as many cron cycles as it needs. Make the
    worker idempotent, as every queue worker must be. Look recipients up with <code>host::load_users</code> in batches of
    100 first if the plugin needs their names or languages.</p>
    <p>ABI: a new function, <code>send-to-user</code>, in the existing <code>mail</code> interface and a
    new manifest capability, <code>mail_users</code> (B73, after 0.104.0). No existing
    signature changed.</p>
    <h3>Item Operations</h3>
    <p>Declare <code>item-api</code> in <code>host_interfaces</code>. Every call acts as the user the plugin
    is handling a request for, with that user's answer; from cron or a queue worker
    the plugin needs <code>item_background = true</code>, and then acts with kernel authority.</p>
