    <h2>Access Control</h2>
    <h3>Implementing Access Control</h3>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_item_access</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">input</span><span class="tok-punctuation tok-separator tok-rust">:</span> ItemAccessInput</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> AccessResult</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> ItemAccessInput provides lightweight access fields (not the full Item):
    </span>    <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span>   item_id, item_type, author_id, operation, user_id
    </span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Only handle our own content types
    </span>    <span class="tok-keyword tok-control tok-rust">if</span> input.item_type <span class="tok-keyword tok-operator tok-rust">!</span><span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>my_plugin_type<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-keyword tok-control tok-rust">return</span> <span class="tok-meta tok-path tok-rust">AccessResult<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Neutral<span class="tok-punctuation tok-terminator tok-rust">;</span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>

        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Example: author can always access their own items
    </span>    <span class="tok-keyword tok-control tok-rust">if</span> input.user_id <span class="tok-keyword tok-operator tok-rust">=</span><span class="tok-keyword tok-operator tok-rust">=</span> input.author_id <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-keyword tok-control tok-rust">return</span> <span class="tok-meta tok-path tok-rust">AccessResult<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Grant<span class="tok-punctuation tok-terminator tok-rust">;</span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>

        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Defer to kernel&#39;s permission fallback (&quot;{operation} {type} content&quot;)
    </span>    <span class="tok-meta tok-path tok-rust">AccessResult<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Neutral
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p><strong>Note:</strong> The kernel already handles published-item access (checking <code>"access content"</code> permission) and has a permission fallback that checks <code>"{operation} {type} content"</code>. Most plugins should return <code>Neutral</code> and rely on this built-in behavior. Only implement <code>tap_item_access</code> if you need custom logic beyond standard permission checks.</p>
    <h3>AccessResult Values</h3>
    <table><thead><tr><th>Value</th><th>Meaning</th></tr></thead><tbody>
    <tr><th><code>Grant</code></th><th>Explicitly allow access</th></tr>
    <tr><th><code>Deny</code></th><th>Explicitly deny (wins over Grant)</th></tr>
    <tr><th><code>Neutral</code></th><th>No opinion (let other plugins decide)</th></tr>
    </tbody></table>
    <p><strong>Aggregation rule:</strong> Deny &gt; Grant &gt; Neutral. If all plugins return Neutral, the kernel falls back to checking the <code>"{operation} {type} content"</code> permission.</p>
