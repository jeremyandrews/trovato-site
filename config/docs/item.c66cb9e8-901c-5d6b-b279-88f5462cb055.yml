    and is removed by the kernel's temporary-file cleanup — a plugin cannot leak
    storage by accepting an upload nobody attaches.</p>
    <hr />
    <h2>Database Operations</h2>
    <p>The <code>db</code> calls work on the plugin's own tables: the ones its migrations
    create, and any it lists in <code>db_tables</code>. Each call is checked against that
    allowlist, and the kernel's protected tables are refused whatever the
    manifest says (<code>-16</code>). Content does not go through <code>db</code>. Read it with
    <a href="#queries">Queries</a>, and write it with <code>host::save_item</code> and
    <code>host::save_translation</code>, which decide access, fire the item taps and keep the
    item cache right. A <code>db</code> write to <code>item</code> or <code>item_translation</code> would do none
    of that.</p>
