    ### Calling Another Plugin

    ```rust
    // Check if plugin exists
    if host::plugin::exists("other_plugin") {
        // Invoke a function
        let result = host::plugin::invoke(
            "other_plugin",
            "some_function",
            json!({"key": "value"})
        )?;
    }
    ```

