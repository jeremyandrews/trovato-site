    <h2>Quick Start</h2>
    <h3>Prerequisites</h3>
    <ul>
    <li>Rust toolchain with <code>wasm32-wasip1</code> target</li>
    <li>Running Trovato kernel with PostgreSQL and Redis</li>
    </ul>
    <p>Install the WASM target:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">rustup</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target add wasm32-wasip1</span>
    </span></code></pre></figure><h3>Create a New Plugin</h3>
    <ol>
    <li>Create the plugin directory:</li>
    </ol>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mkdir</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> plugins/my_plugin/src</span>
    </span></code></pre></figure><ol start="2">
    <li>Create <code>plugins/my_plugin/Cargo.toml</code>:</li>
    </ol>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[package]
    name = &quot;my_plugin&quot;
    version = &quot;0.1.0&quot;
    edition = &quot;2021&quot;

    [lib]
    crate-type = [&quot;cdylib&quot;]

    [dependencies]
    trovato-sdk = { path = &quot;../../crates/plugin-sdk&quot; }
    serde = { version = &quot;1.0&quot;, features = [&quot;derive&quot;] }
    serde_json = &quot;1.0&quot;
    </code></pre></figure><ol start="3">
    <li>Create <code>plugins/my_plugin/my_plugin.info.toml</code>:</li>
    </ol>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;my_plugin&quot;
    description = &quot;My first Trovato plugin&quot;
    version = &quot;0.1.0&quot;

    [taps]
    implements = [&quot;tap_item_info&quot;]
    weight = 0
    </code></pre></figure><ol start="4">
    <li>Create <code>plugins/my_plugin/src/lib.rs</code>:</li>
    </ol>
