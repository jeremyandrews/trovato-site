    </span></code></pre></figure><p><code>content</code> is what the model reads; <code>summary</code> is the one sentence a person reads
    in the transcript, and a <code>Describe</code> <strong>must</strong> set it. The kernel truncates
    <code>content</code> to the site's cap and appends <code>[result truncated]</code>.</p>
    <p>A tool the scope did not declare is never dispatched. Arguments are checked
    against your schema for required keys and declared scalar types before you see
    them; anything deeper is yours to validate. A trap, a timeout or an unreadable
    result becomes <code>ok: false</code> with a generic message to the model and the detail in
    the log, so one broken tool does not end a conversation.</p>
    <h3>Writing a good scope</h3>
    <ul>
    <li><strong>Name a permission that means something.</strong> It is the gate; an administrator
    passes it, and everybody else needs it plus <code>use ai</code> and <code>use ai assistant</code>.</li>
    <li><strong>Prefer reads that answer one question.</strong> A model given one broad tool will
    call it repeatedly; a model given <code>device_history(days)</code> will ask for what it
    needs.</li>
    <li><strong>Make every Describe string name the thing and the change</strong>, including the
    value it replaces: "Assign Amazon tablet (02:00:5e:00:00:04) to Jamie
    (currently Arlo)". That sentence is the entire basis on which a person decides.</li>
    <li><strong>Refuse in Execute, not only in Describe.</strong> Time passes between the two.</li>
    <li><strong>Put your launcher where the thing is.</strong> Include the kernel's partial with a
    literal scope from your own template:
    <code>{% include "assistant/launcher.html" %}</code> with <code>scope</code> (and <code>scope_id</code>) set.
    It renders nothing when the assistant is off.</li>
    </ul>
    <hr />
    <h2>Owned vocabularies</h2>
    <p>A vocabulary (a category) normally belongs to the site: one list of terms,
    administered under <code>/admin/structure/categories</code> by whoever holds <code>administer categories</code>. A site plugin that models groups, clubs or projects can give each
    of them <strong>their own vocabularies</strong>, administered by that owner's managers with
    the kernel's own term list and term form (B108). A vocabulary with no owner
    behaves exactly as before.</p>
    <p>A plugin does three things.</p>
    <h3>1. Declare the kind of owner</h3>
    <p>In the manifest:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[[vocabulary_owners]]
    owner_type = &quot;group&quot;                         # [a-z][a-z0-9_]*, at most 64
    label = &quot;Group&quot;                              # what the screens call one owner
    path = &quot;/group/{owner}/categories&quot;           # where the kernel serves them
    permission = &quot;administer group categories&quot;   # optional, see below
    </code></pre></figure><p><code>path</code> is three segments with <code>{owner}</code> in the middle. Its first segment may not
    be one the kernel serves (<code>admin</code>, <code>api</code>, <code>user</code>, <code>item</code>, <code>static</code>, …); the
    manifest is refused if it is. An owner type or path another enabled plugin
    already declared is skipped with a warning (the first plugin by name keeps it).
    Declare <code>permission</code> with <code>tap_perm</code> too if you name one.</p>
    <p>The kernel mounts, under <code>path</code>:</p>
    <table><thead><tr><th>Route</th><th></th></tr></thead><tbody>
    <tr><th><code>GET /group/{owner}/categories</code></th><th>the owner's vocabularies</th></tr>
    <tr><th><code>GET …/{vocabulary}</code></th><th>the term list</th></tr>
    <tr><th><code>GET</code>, <code>POST …/{vocabulary}/add</code></th><th>the add-term form</th></tr>
    <tr><th><code>GET</code>, <code>POST …/{vocabulary}/terms/{term}/edit</code></th><th>the edit-term form</th></tr>
    <tr><th><code>POST …/{vocabulary}/terms/{term}/delete</code></th><th>delete a term</th></tr>
    </tbody></table>
    <p>Link to them from your own pages; the kernel adds no menu entry.</p>
    <h3>2. Create the owner's vocabularies</h3>
    <p>With the <code>vocabulary</code> host interface (<code>host_interfaces = ["vocabulary", …]</code>),
    usually when the owner is created:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span>host<span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">types<span class="tok-punctuation tok-accessor tok-rust">::</span></span>OwnedVocabularyRequest<span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-storage tok-type tok-rust">let</span> request <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">OwnedVocabularyRequest<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>group<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>group_id<span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-support tok-macro tok-rust">format!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>group_<span class="tok-constant tok-other tok-placeholder tok-rust">{group_id}</span>_topics<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Topics<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">description</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>What this group writes about<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">hierarchy</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">1</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-storage tok-type tok-rust">let</span> vocabulary <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>create_owned_vocabulary<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>request</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-storage tok-type tok-rust">let</span> all <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>list_owned_vocabularies<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>group<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>group_id</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>The id is a site-wide machine name (lowercase letters, digits and underscores,
    at most 32), so put the owner in it. A plugin may only create and list
    vocabularies for owner types it declares (<code>-90</code>); a bad id or label is <code>-91</code>;
    an id in use is <code>-92</code>.</p>
    <h3>3. Decide who administers an owner's terms</h3>
    <p>Implement <code>tap_vocabulary_owner_access</code> (list it under <code>[taps] implements</code>). The
    kernel calls it, on the declaring plugin only, for every request to an owner
    route by a signed-in user:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">types<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>VocabularyOwnerAccess<span class="tok-punctuation tok-separator tok-rust">,</span> VocabularyOwnerAccessRequest</span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_vocabulary_owner_access</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">request</span><span class="tok-punctuation tok-separator tok-rust">:</span> VocabularyOwnerAccessRequest</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> VocabularyOwnerAccess</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> `owner_key` is the `{owner}` path segment: a slug, an id, whatever your links use.
    </span>    <span class="tok-storage tok-type tok-rust">let</span> <span class="tok-support tok-type tok-rust">Some</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>group</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-support tok-function tok-rust">find_group</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>request.owner_key</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-control tok-rust">else</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-keyword tok-control tok-rust">return</span> <span class="tok-meta tok-path tok-rust">VocabularyOwnerAccess<span class="tok-punctuation tok-accessor tok-rust">::</span></span>not_found<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        <span class="tok-keyword tok-control tok-rust">if</span> <span class="tok-support tok-function tok-rust">is_manager</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>group<span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>request.user_id</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-meta tok-path tok-rust">VocabularyOwnerAccess<span class="tok-punctuation tok-accessor tok-rust">::</span></span>grant<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>group.id</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span> <span class="tok-keyword tok-control tok-rust">else</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-meta tok-path tok-rust">VocabularyOwnerAccess<span class="tok-punctuation tok-accessor tok-rust">::</span></span>neutral<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>group.id</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>The kernel decides:</p>
    <ul>
    <li>an anonymous user is sent to sign in, whatever the tap says;</li>
    <li><code>not_found()</code> (no owner id) is a 404;</li>
    <li><code>deny</code> refuses everyone but a superuser;</li>
    <li><code>grant</code> admits;</li>
    <li><code>neutral</code> admits a superuser, or a holder of the declared <code>permission</code>, and
    refuses everyone else.</li>
    </ul>
    <p>A plugin that does not implement the tap treats the <code>{owner}</code> segment as the owner
    id, and only the declared permission (or a superuser) admits.</p>
    <p>A vocabulary, or a term, that belongs to another owner is a 404 under this
    owner's route.</p>
    <h3>Limiting a reference field to the item's owner</h3>
    <p>A term reference field (<code>FieldType::RecordReference("category_term")</code>) can be
    limited to the vocabularies the item's owner owns, through a field setting:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">let</span> <span class="tok-storage tok-modifier tok-rust">mut</span> field <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">FieldDefinition<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>field_topics<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-meta tok-path tok-rust">FieldType<span class="tok-punctuation tok-accessor tok-rust">::</span></span>RecordReference<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>category_term<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span>.<span class="tok-support tok-function tok-rust">into</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">cardinality</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">-</span><span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">1</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">label</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Topics<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    field.settings <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>json<span class="tok-keyword tok-operator tok-rust">!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>vocabulary_owner<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>owner_type<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>group<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>owner_field<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>field_group<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>The item's owner is the value of <code>owner_field</code> on the same item: an id, or a
    reference <code>{"target_id": …}</code>. Every save, whether from a form, the API or a
    plugin, then refuses a term from any other vocabulary, a site-wide one included,
    and any term at all on an item with no owner. A form shows the refusal at the
    field; the API answers 422. A value the save does not change is not checked
    again.</p>
    <p>The field's autocomplete offers the same terms the save accepts: only the
    vocabularies of the owner named in the form's <code>owner_field</code> (or stored on the
    item, when the editor may not change that field). An unlimited term field offers
    terms from site-wide vocabularies only. Either way, suggestions go only to a user
    who may edit the field.</p>
    <hr />
    <h2>Page builder components</h2>
    <p>A plugin can add components to the page builder (the <code>trovato_page_builder</code>
    editor and the <code>PageBuilder</code> field type) without touching the kernel. A
    component is three files in the plugin directory: a declaration, a Tera
    template, and optionally a stylesheet. No WebAssembly is involved; the kernel
    reads the files at boot.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>plugins/my_site/
    ├── my_site.info.toml
    ├── my_site.wasm
    ├── components/
    │   └── promo-cards.component.toml   # the declaration
    ├── templates/
    │   └── pb/
    │       └── promo-cards.html         # the template
    └── static/
        └── promo-cards.css              # the stylesheet
    </code></pre></figure><p>The kernel's own components (Hero, Columns, Card Grid and the rest) are
    declared the same way, in
    <code>crates/kernel/src/content/page_builder_components/standard/</code>. They are the
    best set of examples there is.</p>
    <h3>How the registry is built</h3>
    <p>At boot the kernel builds one component registry: the standard set, then every
    <code>components/*.component.toml</code> of every <strong>enabled</strong> plugin, plugins in name
    order and files in name order. Everything reads from it:</p>
    <ul>
    <li>the editor, which builds its component list and every field form from
    <code>GET /api/v1/page-builder/components</code>;</li>
    <li>validation, which checks a page builder field on every create and update
    that goes through the item service (the item forms, the JSON API, plugins);</li>
    <li>rendering, which hands each component's template the fields it declares.</li>
    </ul>
    <p>A file that does not parse, a field type the kernel does not know, a key a
    field type does not take, a missing template or stylesheet, or a type name two
    plugins both declare stops the server at boot, with an error naming the file
    (and, for a duplicate, both plugins). A plugin may not replace a standard
    component either: declare a new type instead.</p>
    <p>Like the rest of a plugin, components are restart bound: enabling, disabling or
    editing a plugin's components takes effect when the server restarts.</p>
    <h3>Why TOML</h3>
    <p>The declaration is TOML, the format of <code>.info.toml</code>, rather than JSON or a
    Rust tap: a plugin author already writes it, it allows comments (a component
    file explains its choices), the kernel already parses it, and it is read with
    unknown keys refused, so a misspelt <code>max_lenght</code> is an error at boot instead of
    a limit that silently never applies. A declaration rather than a tap also means
    the registry needs no plugin code to run before the first request, and the
    editor gets the same schema the server validates with.</p>
    <h3>The declaration</h3>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml"># components/promo-cards.component.toml
    type = &quot;PromoCards&quot;            # unique across the site; PascalCase
    label = &quot;Promo cards&quot;          # what the editor&#39;s component list shows
    category = &quot;marketing&quot;         # the list&#39;s group; new names make new groups
    description = &quot;A heading over two to six cards.&quot;
    template = &quot;pb/promo-cards.html&quot;     # optional; default pb/&lt;kebab-case type&gt;.html
    stylesheets = [&quot;promo-cards.css&quot;]    # optional; paths under the plugin&#39;s static/
    classes = [&quot;promo-cards--two&quot;, &quot;promo-cards--three&quot;]  # every class a select may add
    # zones = [&quot;main&quot;]             # optional: named areas other components drop into
    # in_editor = false            # optional: validate and render it, but do not offer it

    [[fields]]
    name = &quot;heading&quot;
    type = &quot;text&quot;
    label = &quot;Heading&quot;
    max_length = 80
    default = &quot;Why teams choose us&quot;
    </code></pre></figure><p>Every field takes <code>name</code> (letters, digits and underscores, starting with a
    letter; <code>id</code> is reserved), <code>type</code>, and optionally <code>label</code>, <code>help</code> (a line under
    the field in the editor), <code>required</code>, <code>default</code> (what a newly dropped component
    starts with; it is not applied at render time), <code>hidden</code> (kept and validated,
    not shown in the editor) and <code>deprecated</code> (a sentence saying what replaced it;
    implies the field is on its way out).</p>
    <h3>Field types</h3>
    <p>Every rule below is checked on the server when the page is saved. A page that
    breaks one is refused with an error naming the component and the field, for
    example <code>field_layout.content[2].cards[1].title: is required</code>; the item form
    shows it above the editor, and the JSON API returns it in a 422.</p>
    <table><thead><tr><th>Type</th><th>Stored as</th><th>Keys</th><th>Checked on save</th><th>The template receives</th></tr></thead><tbody>
    <tr><th><code>text</code></th><th>string</th><th><code>max_length</code>, <code>min_length</code>, <code>multiline</code> (a textarea in the editor)</th><th>length in characters</th><th>the string, autoescaped by Tera</th></tr>
    <tr><th><code>rich_text</code></th><th>Markdown string</th><th><code>max_length</code>, <code>min_heading</code> (default 2)</th><th>length of the Markdown</th><th>the string, and <code>&lt;name&gt;_html</code>: the kernel's sanitized rendering, headings shifted to start at <code>min_heading</code></th></tr>
    <tr><th><code>number</code></th><th>number</th><th><code>min</code>, <code>max</code>, <code>integer</code></th><th>range, whole number</th><th>the number</th></tr>
    <tr><th><code>heading_level</code></th><th>2 to 6</th><th>none</th><th>2 to 6 (the page title is the level 1 heading)</th><th>the number</th></tr>
    <tr><th><code>url</code></th><th>string</th><th>none</th><th>relative, or <code>http</code>, <code>https</code>, <code>mailto</code>, <code>tel</code>; no whitespace</th><th>the URL, or nothing if unsafe</th></tr>
    <tr><th><code>image</code></th><th><code>{ src, alt, decorative }</code></th><th><code>alt_max_length</code> (default 250)</th><th><code>src</code> is a safe URL; <code>alt</code> is required unless <code>decorative</code> is true (WCAG 1.1.1)</th><th><code>{ src, alt, decorative }</code>, with <code>alt</code> empty when decorative</th></tr>
    <tr><th><code>link</code></th><th><code>{ url, label, new_tab }</code></th><th><code>label_max_length</code> (default 120)</th><th><code>url</code> is safe; a link has a label a screen reader can announce</th><th><code>{ url, label, new_tab }</code></th></tr>
    <tr><th><code>select</code></th><th>string</th><th><code>options = [{ value, label, class }]</code></th><th>the value is one of the options</th><th>the value; its <code>class</code>, if any, goes into <code>variant_classes</code></th></tr>
    <tr><th><code>boolean</code></th><th><code>true</code> / <code>false</code></th><th>none</th><th>is a boolean</th><th>the boolean</th></tr>
    <tr><th><code>list</code></th><th>array of objects</th><th><code>fields</code> (the entry's own fields, any type but <code>list</code>), <code>min_items</code>, <code>max_items</code>, <code>default_item</code></th><th>count, and every entry's fields by their own rules</th><th>an array of entries, each normalized the same way</th></tr>
    <tr><th><code>reference</code></th><th>string id</th><th><code>target = "item"</code> or <code>"gather"</code>; <code>item_type</code> (item); <code>limit</code> (gather, default 10, at most 50)</th><th>an item UUID, or a gather query id</th><th>item: <code>{ id, title, type, url }</code>; gather: <code>{ id, label, url, total, rows }</code></th></tr>
    </tbody></table>
    <p>A reference is resolved when the page is viewed, as the viewer: an item the
    viewer may not see, an item of another type than <code>item_type</code>, a gather the
    viewer may not run, or one that no longer exists is simply absent, and the
    template renders without it.</p>
    <h3>Templates</h3>
    <p>A component's template is found on the kernel's template search path, the
    same one every page template uses. An enabled plugin's <code>templates/</code> directory
    is on it at the lowest precedence, below the kernel's <code>templates/</code> and any
    <code>TEMPLATES_DIR</code>, so a theme can restyle a plugin's component by shipping a
    template of the same name, and a plugin cannot replace a kernel template. Name
    yours after the component (<code>pb/promo-cards.html</code>), not after something generic.</p>
    <p>The template's context holds:</p>
    <ul>
    <li>the component's <strong>declared fields only</strong>, each normalized to its type: a
    select value outside its options, an unsafe URL or a value of the wrong type
    is left out, so the template's <code>default(...)</code> applies. Keys the page carries
    that the declaration does not name never reach the template.</li>
    <li><code>variant_classes</code>: the classes the chosen select options add, space
    separated. The kernel takes them from the option's <code>class</code>, and an option's
    <code>class</code> must be listed in the component's <code>classes</code>, or the server will not
    start.</li>
    <li><code>zones</code>, for a component that declares any: each zone's children, already
    rendered.</li>
    </ul>
    <p>Everything a template outputs goes through the page builder's HTML sanitizer.
    It has <strong>no <code>style</code> attribute</strong>: a component expresses a colour, a spacing or a
    layout as a declared class, never as inline CSS from a prop. <code>class</code>,
    <code>aria-label</code>, <code>role</code> and <code>lang</code> survive on any element, along with ammonia's
    default structural tags and attributes (<code>href</code>, <code>src</code>, <code>alt</code> and the like) and
    <code>section</code>, <code>article</code>, <code>aside</code>, <code>nav</code>, <code>figure</code>, <code>details</code> and <code>summary</code>;
    scripts, event handlers and <code>javascript:</code> URLs do not. <code>target="_blank"</code> is
    the one <code>target</code> kept, and such a link gets <code>rel="noopener noreferrer"</code>.</p>
    <figure class="code"><figcaption class="code__lang">html+jinja</figcaption><pre class="code__body" tabindex="0" aria-label="html+jinja code"><code class="language-html+jinja">{#- templates/pb/promo-cards.html -#}
    {% set hlevel = headingLevel | default(value=2) %}
    &lt;section class=&quot;promo-cards {{ variant_classes }}&quot;&gt;
      {% if heading %}&lt;h{{ hlevel }} class=&quot;promo-cards__heading&quot;&gt;{{ heading }}&lt;/h{{ hlevel }}&gt;{% endif %}
      {% for card in cards | default(value=[]) %}
      &lt;article class=&quot;promo-cards__card&quot;&gt;
        &lt;h{{ hlevel + 1 }}&gt;{{ card.title | default(value=&quot;&quot;) }}&lt;/h{{ hlevel + 1 }}&gt;
        {# SAFE: text_html is the kernel&#39;s sanitized Markdown rendering of a rich_text field. #}
        {% if card.text_html %}{{ card.text_html | safe }}{% endif %}
        {% if card.link %}&lt;a href=&quot;{{ card.link.url }}&quot;&gt;{{ card.link.label }}&lt;/a&gt;{% endif %}
      &lt;/article&gt;
      {% endfor %}
    &lt;/section&gt;
    </code></pre></figure><p>The kernel's accessibility checks apply to plugin components too: an <code>image</code>
    field without alt text that is not marked decorative is refused on save, and
    the component renders as an accessibility error rather than as an unlabelled
    image. A page whose headings skip a level is logged as a warning.</p>
    <h3>Stylesheets</h3>
    <p><code>stylesheets</code> lists CSS files under the plugin's <code>static/</code> directory. The
    kernel serves an enabled plugin's <code>static/</code> at <code>/static/plugins/&lt;plugin&gt;/</code>,
    and a page links each stylesheet in its <code>&lt;head&gt;</code> once, and only if a component
    that declares it is on the page. The standard components' styles,
    <code>/static/css/page-builder.css</code>, are linked the same way. The editor loads a
    component's stylesheets into the canvas too, so the preview matches the page.</p>
    <p>Write the CSS against your own classes, and set colours on the component's
    own elements: the theme colours headings and paragraphs, and a heading on a
    dark background will take the theme's dark colour unless your rule is at least
    as specific (<code>.promo-cards .promo-cards__title</code>).</p>
    <h3>In the editor</h3>
    <p>The editor needs no change for a new component. Each field type has its
    editor control (a textarea for <code>rich_text</code> with a server-rendered preview, a
    media library picker with an alt text box and a decorative checkbox for
    <code>image</code>, a search box for <code>reference</code>, a sortable list for <code>list</code>), and the
    canvas shows a plugin component by asking the kernel to render it
    (<code>POST /api/v1/page-builder/preview</code>) with the same template, sanitizer and
    checks as the page, so what the editor shows is what the page will show.</p>
    <h3>A complete example</h3>
    <p><code>plugins/test_page_builder_components</code> is a working plugin with two
    components: <code>PromoCards</code> (a heading over a list of cards, each with an
    eyebrow, a title, rich text and a link, and a select of how many cards to a
    row) and <code>FeatureBanner</code> (a select of tone and image position, an image, a
    title, rich text and a call to action). Its integration test,
    <code>crates/kernel/tests/page_builder_components_test.rs</code>, shows the registry
    listing them, a valid page saving and rendering, and an invalid one refused
    with an error at each field. The same plugin declares the two root fields
    above in <code>components/page.root.toml</code> and ships the footer call to action tile
    template, and the same test file renders a page in each footer mode.</p>
    <h3>Page root fields</h3>
    <p>A page builder page has one built in page level field, its <code>title</code>. A plugin
    can declare more, for settings that belong to the page rather than to any one
    component: whether the site's footer call to action shows on this page, a
    page's accent, a campaign code. They are declared in the same field format as
    component fields, edited in the editor's page settings form, checked on every
    save by the same rules, and handed to page, region and tile templates.</p>
    <h4>The file</h4>
    <p>Root fields live in <code>components/&lt;name&gt;.root.toml</code>, beside the components. A
    plugin may ship more than one such file; they are read in file name order
    after its components. The file holds only what a root field needs: a list of
    <code>[[fields]]</code> and, optionally, <code>classes</code>.</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml"># components/page.root.toml
    classes = [&quot;page--quiet&quot;]        # optional: every class a root select may add

    [[fields]]
    name = &quot;footer_cta_mode&quot;
    type = &quot;select&quot;
    label = &quot;Footer call to action&quot;
    help = &quot;Keep the site&#39;s call to action, hide it on this page, or replace it.&quot;
    default = &quot;default&quot;
    options = [
      { value = &quot;default&quot;, label = &quot;Site default&quot; },
      { value = &quot;hide&quot;, label = &quot;Hide&quot;, class = &quot;page--quiet&quot; },
      { value = &quot;custom&quot;, label = &quot;Custom&quot; },
    ]

    [[fields]]
    name = &quot;footer_cta_content&quot;
    type = &quot;rich_text&quot;
    label = &quot;Custom call to action&quot;
    max_length = 280
    </code></pre></figure><p>It is a file of its own, not a <code>[page_root]</code> table in a component file,
    because a root field belongs to no component: it has no type name, template,
    category or stylesheet, a component file must have most of those, and a page
    needs its root fields whether or not that component is on it. The file is the
    component format with everything but the fields taken away, so the parser,
    the field types and their keys, limits and checks are the ones above, and it
    is read with unknown keys refused in the same way.</p>
    <p>Every field type is allowed, with the same keys. Three names are reserved:
    <code>title</code> (built in), <code>props</code> (where current Puck versions nest root values) and
    <code>variant_classes</code> (see below). A root field name is unique across the site:
    two enabled plugins declaring the same one stop the server at boot, with an
    error naming both plugins and both files, as a duplicate component type does.
    A <code>default</code> the field's own rules refuse (a select default that is not one of
    its options) is an error at boot too.</p>
    <h4>Defaults</h4>
    <p>Unlike a component field's, a root field's <code>default</code> is applied when the page
    renders: a page with no value for the field (absent, <code>null</code> or empty text),
    and every page with no page builder content at all, gets the declared default.
    A theme or tile template can therefore rely on <code>page_root.footer_cta_mode</code>
    always having a value when the field declares a default. The editor also
    starts a new page's settings at the defaults.</p>
    <h4>Validation</h4>
    <p>On every create and update through the item service, a page builder field's
    root is checked like a component's props: each declared root field by its
    type and limits, <code>title</code> as text. An error is reported at
    <code>&lt;item field&gt;.root.&lt;field&gt;</code>, for example
    <code>field_layout.root.footer_cta_mode: 'blink' is not one of: default, hide, custom</code>,
    on the item form and as a 422 from the JSON API.</p>
    <p>A root key that no enabled plugin declares is refused on save, so a misspelt
    name, or a value meant for a plugin that is now disabled, is not stored
    silently. A stored page is never validated to render: such a key is simply
    not passed to templates, and the page renders as before. The editor drops
    undeclared root keys when it writes the page, since it offers no form in which
    one could be removed.</p>
    <p>Puck keeps the root's values under <code>root.props</code> in current versions and
    directly under <code>root</code> in older ones. The editor stores them flat,
    <code>{ "root": { "title": "…", "footer_cta_mode": "hide" } }</code>; the kernel reads
    either shape, and a key in both takes the value under <code>props</code>.</p>
    <h4>Templates: <code>page_root</code></h4>
    <p>Every page template (<code>page.html</code> and its suggestions), the item template, and
    every tile template rendered on the same request receive <code>page_root</code>:</p>
    <ul>
    <li><code>page_root.title</code>, the root title, when it is text;</li>
    <li>one key per declared root field: the page's value or the declared default,
    normalized as a component prop is (a value outside a select's options, an
    unsafe URL or a value of the wrong type is left out), and for a <code>rich_text</code>
    field <code>&lt;name&gt;_html</code>, the kernel's sanitized rendering;</li>
    <li><code>page_root.variant_classes</code>, the classes the chosen select options add,
    each one listed in a root file's <code>classes</code>. As for components, a root value
    never becomes inline CSS: a variant is a declared class.</li>
    </ul>
    <p>A page with no page builder field, or a request that is not an item at all,
    gets the defaults. Region templates are tiles: a <code>menu</code> or <code>gather_query</code>
    tile's template gets <code>page_root</code> beside its own variables, and a
    <code>custom_html</code> tile is rendered through <code>elements/tile--custom_html--&lt;machine name&gt;</code> or <code>elements/tile--custom_html</code> when either template exists, with
    <code>tile</code>, <code>body</code> (its filtered HTML) and <code>page_root</code>. A tile whose template
    renders nothing but whitespace is left off the page, wrapper and all.</p>
    <p>A sitewide footer call to action that a page can keep, hide or replace, as a
    custom HTML tile named <code>pb_footer_cta</code> in the <code>footer</code> region and this
    template in the plugin's <code>templates/elements/tile--custom_html--pb_footer_cta.html</code>:</p>
    <figure class="code"><figcaption class="code__lang">html+jinja</figcaption><pre class="code__body" tabindex="0" aria-label="html+jinja code"><code class="language-html+jinja">{%- set mode = &quot;default&quot; -%}
    {%- if page_root.footer_cta_mode is defined %}{% set mode = page_root.footer_cta_mode %}{% endif -%}
    {%- if mode == &quot;hide&quot; -%}
    {%- elif mode == &quot;custom&quot; and page_root.footer_cta_content_html is defined -%}
    {# SAFE: footer_cta_content_html is the kernel&#39;s sanitized Markdown rendering of a rich_text root field. #}
    &lt;div class=&quot;footer-cta footer-cta--custom&quot;&gt;{{ page_root.footer_cta_content_html | safe }}&lt;/div&gt;
    {%- else -%}
    {# SAFE: body is the tile&#39;s body, already through its text format&#39;s filter pipeline. #}
    &lt;div class=&quot;footer-cta footer-cta--default&quot;&gt;{{ body | safe }}&lt;/div&gt;
    {%- endif -%}
    </code></pre></figure><h4>In the editor</h4>
    <p><code>GET /api/v1/page-builder/components</code> serves the root fields beside the
    components, as <code>root_fields</code>: each in the component field format plus its
    <code>source</code>. The editor builds its page settings form (Puck's root fields, shown
    under "Page" when no component is selected) from them: the title first, then
    each declared root field in load order, with the same control per type as a
    component field.</p>
    <hr />
