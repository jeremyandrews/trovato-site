n tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>tag<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>param<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>tag<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>tag_category<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>tags<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span><span class="tok-punctuation tok-section tok-array tok-end tok-json">]</span></span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    <span class="tok-punctuation tok-section tok-array tok-end tok-json">]</span></span>,
    <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>feed<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>: <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>path<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/blog/feed.xml<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>paths<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-array tok-json"><span class="tok-punctuation tok-section tok-array tok-begin tok-json">[</span><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/blog/author/{user}/feed.xml<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-array tok-json">,</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/blog/tag/{tag}/feed.xml<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-section tok-array tok-end tok-json">]</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>with the definition filtering <code>author_id</code> on <code>{"url_arg": "author"}</code> and
    <code>fields.field_tags</code> (<code>has_tag</code>) on <code>{"url_arg": "tag"}</code>. That gives
    <code>/blog/feed.xml</code>, <code>/blog/author/jeremy/feed.xml</code> and <code>/blog/tag/rust/feed.xml</code>,
    each with its <code>.atom</code> sibling.</p>
    <p>An argument that names nothing answers 404, not an empty feed: an unknown tag
    slug or account name fails the lookup, and a passed-through value that matches
    no row the viewer can see is treated the same way. A feed with an argument is
    not in every page's head; the page reached with the same argument
    (<code>/blog/author/jeremy</code>) advertises its own (<code>/blog/author/jeremy/feed.xml</code>).
    A path with two arguments, an argument inside a segment (<code>/rss/{slug}.xml</code>),
    or an argument no route binds is skipped at startup with a warning.</p>
    <hr />
    <h2>The Tap System</h2>
    <p>Taps are the primary way plugins interact with the kernel. Each tap is a named hook that plugins can implement.</p>
    <h3>Implementing a Tap</h3>
    <p>Use the <code>#[plugin_tap]</code> macro to mark a function as a tap implementation:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">prelude<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-keyword tok-operator tok-rust">*</span><span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_item_info</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>ContentTypeDefinition<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Return content type definitions
    </span>    <span class="tok-support tok-macro tok-rust">vec!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>For taps that can fail, use <code>#[plugin_tap_result]</code>:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap_result</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_cron</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">_input</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Result<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span>, String<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> An `Err` is logged by the kernel with the plugin and tap named.
    </span>    <span class="tok-support tok-type tok-rust">Ok</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Tap and route size limit</h3>
    <p>A tap or a plugin-served route (<code>tap_api</code>) may send and receive up to
    <strong>8 MiB</strong> each way — the input the kernel hands it and the JSON (or, for
    <code>tap_api</code>, the body) it returns. Both directions share one ceiling,
    <code>trovato_sdk::abi::PLUGIN_IO_MAX_BYTES</code>. Send or return more than that and the
    kernel refuses the call with a documented error rather than truncating it
    silently.</p>
    <p>8 MiB is comfortably above any real page — the motivating case was a 54 KB
    field the kernel's old 64 KB cap already refused to render — and well inside
    the 64 MiB a plugin may use in total for its own code, data and working set in
    one call, so a call that uses the whole ceiling still leaves room to run.
    There is nothing to opt into: every tap and <code>tap_api</code> route gets the same
    limit, and a plugin built against the current SDK gets it automatically (see
    <code>crates/plugin-sdk/src/abi.rs</code> for plugins built before this limit existed,
    which keep working at the old 64 KB ceiling until rebuilt).</p>
    <p>If a tap legitimately needs to send more than 8 MiB — a large export, for
    instance — paginate it across multiple calls rather than asking for a larger
    limit; nothing in the protocol changes to accommodate one call that large.</p>
    <h3>Available Taps</h3>
    <h4>Content Type Definition</h4>
    <table><thead><tr><th>Tap</th><th>Input</th><th>Output</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>tap_item_info</code></th><th>None</th><th><code>Vec&lt;ContentTypeDefinition&gt;</code></th><th>Register content types and fields</th></tr>
    </tbody></table>
    <h4>Item Lifecycle</h4>
    <table><thead><tr><th>Tap</th><th>Input</th><th>Output</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>tap_item_view</code></th><th><code>ItemViewInput</code></th><th><code>RenderElement</code></th><th>Render item content</th></tr>
    <tr><th><code>tap_item_view_alter</code></th><th><code>ItemViewAlterInput</code></th><th><code>RenderElement</code></th><th>Modify rendered output</th></tr>
    <tr><th><code>tap_item_presave</code></th><th><code>{item_type, title, fields, status}</code></th><th><code>{"fields": {...}}</code> or <code>{}</code></th><th>Before a create or update is written: the one tap that can change a write. Returned fields are merged into the item, last plugin wins per field</th></tr>
    <tr><th><code>tap_item_insert</code></th><th>the created item</th><th>ignored</th><th>Notification after the row exists. It cannot refuse the write, and what it returns, an error included, is logged at most and never read</th></tr>
    <tr><th><code>tap_item_update</code></th><th>the updated item</th><th>ignored</th><th>Notification after the update, as <code>tap_item_insert</code></th></tr>
    <tr><th><code>tap_item_update_index</code></th><th>the saved item</th><th>ignored</th><th>Notification after a create or update, for a plugin that keeps its own index</th></tr>
    <tr><th><code>tap_item_delete</code></th><th>the item being deleted</th><th>ignored</th><th>Notification before the row is removed. It cannot abort the delete</th></tr>
    <tr><th><code>tap_item_access</code></th><th><code>ItemAccessInput</code></th><th><code>AccessResult</code></th><th>Control item visibility</th></tr>
    </tbody></table>
    <h4>Forms</h4>
    <table><thead><tr><th>Tap</th><th>Input</th><th>Output</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>tap_form_alter</code></th><th>the form as JSON</th><th>the form as JSON</th><th>Change a form before it is rendered</th></tr>
    <tr><th><code>tap_form_validate</code></th><th><code>{form_id, values}</code></th><th><code>{}</code> or <code>{"errors": [...]}</code></th><th>Refuse a submission, on a field or the whole form</th></tr>
    <tr><th><code>tap_form_submit</code></th><th><code>{form_id, values, item_id}</code></th><th>ignored</th><th>Notification after a successful save, once</th></tr>
    <tr><th><code>tap_form_ajax</code></th><th><code>{trigger, form_id, values}</code></th><th><code>{"commands": [...]}</code> or <code>{}</code></th><th>Answer an AJAX trigger the kernel does not handle itself</th></tr>
    </tbody></table>
    <p>Every content and profile form goes through these taps: <code>item_add_{type}</code> and
    <code>item_edit_{type}</code> (both on <code>/item/...</code> and on <code>/admin/content/...</code>), and
    <code>user_profile_form</code>.</p>
    <p><strong><code>tap_form_alter</code></strong> receives the whole form and returns it. Plugins run in
    weight order and each receives what the previous one returned, so alterations
    compose. The form is <code>{form_id, action, method, elements, libraries, ...}</code>;
    <code>elements</code> is an object keyed by input name, and each element has a <code>type</code>
    (<code>textfield</code>, <code>textarea</code>, <code>select</code>, <code>checkbox</code>, <code>hidden</code>, <code>markup</code>, <code>input</code>,
    <code>widget</code>, <code>container</code>, ...), <code>weight</code>, and optional <code>title</code>, <code>description</code>,
    <code>default_value</code>, <code>prefix</code>, <code>suffix</code>, <code>attributes</code>, <code>children</code>. To add a script
    or stylesheet, push the name of a kernel asset library into <code>libraries</code>
    (<code>ai_assist</code>, <code>block_editor</code>, <code>compound_field</code>, <code>file_upload</code>, <code>record_ref</code>);
    the renderer attaches it as a file, so no inline script is needed and the page's
    CSP does not change. <code>form_id</code>, <code>form_build_id</code> and the CSRF token are the
    kernel's and are kept whatever a plugin returns. An input a plugin adds is
    submitted and handed to <code>tap_form_validate</code>, but a content form only stores the
    item's own declared fields, so store anything else from <code>tap_form_submit</code>.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_form_alter</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-storage tok-modifier tok-rust">mut</span> <span class="tok-variable tok-parameter tok-rust">form</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-keyword tok-control tok-rust">if</span> form<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>form_id<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span> <span class="tok-keyword tok-operator tok-rust">!</span><span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>item_edit_article<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-keyword tok-control tok-rust">return</span> form<span class="tok-punctuation tok-terminator tok-rust">;</span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        form<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>elements<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>my_notice<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>json<span class="tok-keyword tok-operator tok-rust">!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>type<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>markup<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>value<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>&lt;p&gt;Reviewed weekly.&lt;/p&gt;<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>weight<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">990</span><span class="tok-punctuation tok-separator tok-rust">,</span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        form
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>Declare the form taps with <code>serde_json::Value</code> (or a typed struct) in and out,
    never <code>String</code>: <code>#[plugin_tap]</code> deserializes the input as the parameter's type
    and serializes the return value, so a <code>String</code> parameter expects a JSON string
    and refuses the object the kernel sends.</p>
    <p><strong><code>tap_form_validate</code></strong> receives <code>{form_id, values}</code>: the posted value of every
    input the form rendered (after alteration), a multi value field as an array.
    Form machinery, inputs the form did not render, and passwords are not passed.
    Return <code>{}</code> to accept, or <code>{"errors": [...]}</code> where each error is either a
    string (shown at the top of the form) or <code>{"field": "field_x", "message": "..."}</code> (shown beside that input). Any error refuses the save; nothing is
    written and the editor sees the form again with what they typed.</p>
    <p><strong><code>tap_form_ajax</code></strong> answers an element whose <code>ajax</code> callback names a trigger
    the kernel does not handle (the kernel's own is <code>add_{field}</code>, "Add another").
    <code>POST /system/ajax</code> checks the CSRF header, that the form was built for this
    user and that they may still open it (edit access to the item, or the type's
    create permission), then dispatches with the full host API, so a handler can
    read its tables. <code>values</code> are the form's current values. Return AJAX commands
    (<code>replace</code>, <code>append</code>, <code>remove</code>, <code>add_class</code>, ... each with a <code>selector</code>) or
    <code>{}</code>; every handler's commands are applied in order.</p>
    <p><strong><code>tap_form_submit</code></strong> receives <code>{form_id, values, item_id}</code> after the save
    succeeded, once per save. <code>item_id</code> is the item created or updated, or <code>null</code>
    for the profile form. Its return value is ignored. It cannot refuse the save;
    use <code>tap_form_validate</code> for that.</p>
    <h4>System</h4>
    <table><thead><tr><th>Tap</th><th>Input</th><th>Output</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>tap_menu</code></th><th>None</th><th><code>Vec&lt;MenuDefinition&gt;</code></th><th>Register routes</th></tr>
    <tr><th><code>tap_perm</code></th><th>None</th><th><code>Vec&lt;PermissionDefinition&gt;</code></th><th>Define permissions</th></tr>
    <tr><th><code>tap_admin_nav</code></th><th>None</th><th><code>Vec&lt;AdminNavDefinition&gt;</code></th><th>Admin sidebar links and dashboard cards (<a href="#admin-sidebar-links-and-dashboard-cards">below</a>)</th></tr>
