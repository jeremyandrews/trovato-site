    </ol>
    <hr />
    <h2>Plugin Structure</h2>
    <h3>Directory Layout</h3>
    <figure class="code"><pre class="code__body"><code>plugins/my_plugin/
    ├── Cargo.toml           # Rust package configuration
    ├── my_plugin.info.toml  # Plugin metadata and tap declarations
    ├── my_plugin.wasm       # Compiled WASM binary (generated)
    └── src/
        └── lib.rs           # Plugin source code
    </code></pre></figure><h3>Plugin Metadata (<code>.info.toml</code>)</h3>
    <p>Every plugin requires an info file declaring its metadata and capabilities:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">name = &quot;blog&quot;
    description = &quot;Provides a blog content type with tags&quot;
    version = &quot;1.0.0&quot;
    dependencies = [&quot;categories&quot;]  # Optional: plugins that must load first

    [taps]
    implements = [
        &quot;tap_item_info&quot;,
        &quot;tap_item_view&quot;,
        &quot;tap_item_access&quot;,
        &quot;tap_menu&quot;,
        &quot;tap_perm&quot;,
    ]
    weight = 0  # Lower weight = earlier execution
    </code></pre></figure><table><thead><tr><th>Field</th><th>Required</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>name</code></th><th>Yes</th><th>Machine name (lowercase, matches directory)</th></tr>
    <tr><th><code>description</code></th><th>Yes</th><th>Human-readable description</th></tr>
    <tr><th><code>version</code></th><th>Yes</th><th>Semantic version (e.g., "1.0.0")</th></tr>
    <tr><th><code>dependencies</code></th><th>No</th><th>Array of required plugin names</th></tr>
    <tr><th><code>[taps].implements</code></th><th>Yes</th><th>Array of tap function names</th></tr>
    <tr><th><code>[taps].weight</code></th><th>No</th><th>Execution order (default: 0)</th></tr>
    <tr><th><code>[migrations].files</code></th><th>No</th><th>Array of SQL migration file paths</th></tr>
    <tr><th><code>[migrations].depends_on</code></th><th>No</th><th>Plugin names whose migrations run first</th></tr>
    </tbody></table>
    <h3>SQL Migrations</h3>
    <p>Plugins can include SQL migrations that run at startup. Add a <code>[migrations]</code> section:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">[migrations]
    files = [
        &quot;migrations/001_gather_queries.sql&quot;,
        &quot;migrations/002_roles.sql&quot;,
    ]
    </code></pre></figure><p><strong>Execution ordering:</strong> Kernel tables are created first, then plugin migrations run in dependency order (topological sort). This means your migrations can safely reference kernel tables (<code>item</code>, <code>gather_query</code>, <code>url_alias</code>, <code>roles</code>, <code>role_permissions</code>).</p>
    <p><strong>Forward-only:</strong> Migrations have no rollback mechanism. Each file runs exactly once, tracked in the <code>plugin_migration</code> table. Use idempotent SQL patterns (<code>ON CONFLICT ... DO UPDATE/DO NOTHING</code>) so migrations are safe to re-run if the tracking state is lost.</p>
    <p><strong>Gather query field references:</strong> Filter and sort field paths (e.g., <code>"fields.display_name"</code>) are not validated against content type definitions at registration time. Double-check that field names in your gather query JSON match the <code>field_name</code> values in your <code>tap_item_info</code> definitions — a typo will silently produce NULL comparisons at query time.</p>
    <hr />
    <h2>The Tap System</h2>
    <p>Taps are the primary way plugins interact with the kernel. Each tap is a named hook that plugins can implement.</p>
    <h3>Implementing a Tap</h3>
    <p>Use the <code>#[plugin_tap]</code> macro to mark a function as a tap implementation:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">prelude<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-keyword tok-operator tok-rust">*</span><span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_item_info</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>ContentTypeDefinition<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Return content type definitions
    </span>    <span class="tok-support tok-macro tok-rust">vec!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>For taps that can fail, use <code>#[plugin_tap_result]</code>:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap_result</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_item_insert</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">input</span><span class="tok-punctuation tok-separator tok-rust">:</span> ItemInput</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Result<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span>, String<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-keyword tok-control tok-rust">if</span> input.item.title.<span class="tok-support tok-function tok-rust">is_empty</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-keyword tok-control tok-rust">return</span> <span class="tok-support tok-type tok-rust">Err</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Title is required<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span>.<span class="tok-support tok-function tok-rust">to_string</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        <span class="tok-support tok-type tok-rust">Ok</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Available Taps</h3>
    <h4>Content Type Definition</h4>
    <table><thead><tr><th>Tap</th><th>Input</th><th>Output</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>tap_item_info</code></th><th>None</th><th><code>Vec&lt;ContentTypeDefinition&gt;</code></th><th>Register content types and fields</th></tr>
    </tbody></table>
    <h4>Item Lifecycle</h4>
    <table><thead><tr><th>Tap</th><th>Input</th><th>Output</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>tap_item_view</code></th><th><code>ItemViewInput</code></th><th><code>RenderElement</code></th><th>Render item content</th></tr>
    <tr><th><code>tap_item_view_alter</code></th><th><code>ItemViewAlterInput</code></th><th><code>RenderElement</code></th><th>Modify rendered output</th></tr>
    <tr><th><code>tap_item_insert</code></th><th><code>ItemInput</code></th><th><code>Result&lt;(), String&gt;</code></th><th>Pre-insert validation</th></tr>
    <tr><th><code>tap_item_update</code></th><th><code>ItemInput</code></th><th><code>Result&lt;(), String&gt;</code></th><th>Pre-update validation</th></tr>
    <tr><th><code>tap_item_delete</code></th><th><code>ItemDeleteInput</code></th><th><code>Result&lt;(), String&gt;</code></th><th>Pre-delete hook</th></tr>
    <tr><th><code>tap_item_access</code></th><th><code>ItemAccessInput</code></th><th><code>AccessResult</code></th><th>Control item visibility</th></tr>
    </tbody></table>
    <h4>Forms</h4>
