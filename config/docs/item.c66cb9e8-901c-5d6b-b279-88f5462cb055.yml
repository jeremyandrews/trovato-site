    means. <code>Item</code> takes a Trovato item id and the kernel checks it exists and is one
    of the types in <code>item_types</code> — and puts a launcher link on that item's page for
    you. <code>String</code> takes any opaque string of at most 128 bytes. <code>None</code> is a site-wide
    scope with no id.</p>
    <p>The registry validates each scope and <strong>drops an invalid one with a warning
    rather than failing startup</strong>: names must match <code>[a-z0-9_]+</code>, a scope name must
    be unique across every plugin, <code>parameters</code> must be a JSON Schema object with
    <code>"type": "object"</code>, and there are caps (32 tools, 6 suggestions, an 8 KiB
    prompt). Dropped scopes are listed at <code>/admin/system/ai-assistant</code>, so check
    there first if a scope does not appear.</p>
    <h3>2. Describe what is being configured</h3>
    <p><code>tap_assistant_context</code> runs when a conversation opens or is reset, with services
    and the caller's real permissions. The <code>snapshot</code> is the model's whole view of
    your domain: write plain labelled lines, current and complete enough that most
    questions need no tool call at all.</p>
