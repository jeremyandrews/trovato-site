        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>CSRF is already enforced before your tap runs: a state-changing method needs
    an <code>X-CSRF-Token</code> header or a <code>_token</code> field (multipart or form-urlencoded),
    unless the caller authenticated with an <code>Authorization: Bearer</code> token. The
    body size cap (<code>MAX_REQUEST_BODY</code>, the 8 MiB plugin I/O ceiling) applies to
    this case exactly as it always has, because <code>request.body</code> still crosses the
    WASM boundary.</p>
    <p><strong>A file in the form is different.</strong> When the request's <code>Content-Type</code> is
    <code>multipart/form-data</code>, the kernel parses it itself before dispatch: every part
    carrying a filename is stored through the same <code>FileService</code> <code>/file/upload</code>
    uses — the same size limit, MIME allowlist and magic-byte check — and handed
    to you in <code>request.files: Vec&lt;UploadedFile&gt;</code> as an id and metadata, never raw
    bytes. The form's other fields arrive in <code>request.body</code>, re-encoded as a JSON
    object, so <code>request.json::&lt;T&gt;()</code> works the same whether the caller posted JSON
    or a multipart form.</p>
