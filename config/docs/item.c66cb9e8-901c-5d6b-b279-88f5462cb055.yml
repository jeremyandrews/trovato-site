    calls it:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[taps]
    implements = [&quot;tap_perm&quot;, &quot;tap_menu&quot;, &quot;tap_api&quot;, &quot;tap_admin_nav&quot;]
    </code></pre></figure><p>A page is an admin page when its path starts with <code>/admin</code>
    (<code>ThemeEngine::is_admin_path</code>, the rule the kernel already uses to pick
    <code>page--admin.html</code> and to theme an admin error page). Any such page, kernel or
    plugin, gets the sidebar; a plugin page elsewhere does not.</p>
    <hr />
    <h3>Serving a Request Directly (<code>tap_api</code>), and Accepting a File</h3>
    <p>A <code>MenuRoute</code> with <code>handler_type = "api"</code> and a <code>callback</code> is not a page the
    theme renders — it is a request the kernel dispatches straight to your
    plugin's <code>tap_api</code>, with the method, path, query, params, body and caller
    already resolved:</p>
