    </span></span></code></pre></figure><p>For a listing, use a query (below): <code>query_items</code> takes one type, one order and
    no joins, and returns whole items rather than the columns a list shows.</p>
    <p>A translation write is an edit of the item. It needs <code>edit</code> access, or
    <code>translate content</code> and <code>view</code>, as the admin translation screen does. The
    field write gate applies, <code>tap_item_update</code> fires on the other plugins, and
    the item cache drops the item. A language the site does not have, or the item's
    own language, is <code>ERR_PARAM_DESERIALIZE</code>. A plugin does not need
    <code>item_translation</code> in <code>db_tables</code>, and should not declare it: a <code>db</code> write
    there skips access, the taps, the cache and the menu label refresh.</p>
    <p>A write is the same write a person makes on the edit form. It goes through the
    kernel's item service, so the other plugins' <code>tap_item_presave</code>,
    <code>tap_item_insert</code> or <code>tap_item_update</code>, <code>tap_item_update_index</code> and
    <code>tap_item_delete</code> fire, the field and publish gates apply, a revision is
    recorded, and the item's page shows the change at once.</p>
    <p>A tap that handles one of those writes may write items too. The nested write
    fires its taps on every plugin except those whose write tap is already running
    around it, so a plugin never sees its own write come back into the handler that
    made it, and a write nested four write taps deep is refused with
    <code>ERR_ITEM_WRITE_DEPTH</code>. Every error code is listed in
    <a href="/learn/plugin-error-codes#item-api-errors">plugin-error-codes.md</a>.</p>
    <h3>Queries</h3>
    <p>Declare <code>query</code> in <code>host_interfaces</code>. <code>host::query</code> runs a Gather definition,
    the JSON a site's gather is stored as, through the same pipeline as a gather
    page, for the user the plugin is acting for:</p>
