    <h2>Deployment</h2>
    <h3>Building for Production</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Build optimized WASM</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> my_plugin<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Copy to plugins directory</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target/wasm32-wasip1/release/my_plugin.wasm plugins/my_plugin/</span>
    </span></code></pre></figure><h3>Plugin Loading</h3>
    <p>The kernel automatically loads plugins on startup:</p>
    <ol>
    <li>Reads all <code>*.info.toml</code> files in <code>/plugins/</code></li>
    <li>Validates tap declarations against known taps</li>
    <li>Resolves dependencies (topological sort)</li>
    <li>Compiles WASM modules</li>
    <li>Registers taps in the tap registry</li>
    </ol>
    <h3>Enabling/Disabling</h3>
    <p>Plugins can be enabled or disabled through the admin UI or database. Disabled plugins are not loaded.</p>
    <hr />
    <h2>Best Practices</h2>
    <h3>Do</h3>
    <ul>
    <li><strong>Use the SDK prelude</strong>: <code>use trovato_sdk::prelude::*;</code></li>
    <li><strong>Return meaningful errors</strong>: <code>Err("Specific error message".into())</code></li>
    <li><strong>Use structured queries</strong>: Prevents SQL injection</li>
    <li><strong>Cache expensive operations</strong>: Use host cache functions</li>
    <li><strong>Check permissions</strong>: Before sensitive operations</li>
    <li><strong>Handle missing data gracefully</strong>: Use <code>Option</code> and provide defaults</li>
    </ul>
    <h3>Don't</h3>
    <ul>
    <li><strong>Don't panic</strong>: Panics abort the tap; return errors instead</li>
    <li><strong>Don't use global mutable state</strong>: Each request gets a fresh instance</li>
    <li><strong>Don't make direct HTTP calls</strong>: Use host functions (when available)</li>
    <li><strong>Don't access the filesystem</strong>: Plugins run in a sandbox</li>
    <li><strong>Don't assume execution order</strong>: Use tap weights for ordering</li>
    <li><strong>Don't store secrets in code</strong>: Use persistent variables</li>
    </ul>
    <h3>Performance Tips</h3>
    <ol>
    <li><strong>Minimize cross-boundary calls</strong>: Batch data access when possible</li>
    <li><strong>Use caching</strong>: Especially for database queries</li>
    <li><strong>Keep payloads small</strong>: Large JSON payloads add serialization overhead</li>
    <li><strong>Avoid deep nesting</strong>: In RenderElement trees</li>
    <li><strong>Use weight ordering</strong>: Instead of nested conditionals</li>
    </ol>
    <h3>Security</h3>
    <ol>
    <li><strong>Always validate input</strong>: Don't trust data from users</li>
    <li><strong>Use structured queries</strong>: Never concatenate SQL</li>
    <li><strong>Check permissions</strong>: Before modifying data</li>
    <li><strong>Sanitize output</strong>: Use <code>filtered_markup</code> for user content</li>
    <li><strong>Don't expose sensitive data</strong>: In error messages</li>
    </ol>
