    <h1>Trovato Design: Web Layer &amp; Sessions</h1>
    <p><em>Sections 1-2 of the v2.1 Design Document</em></p>
    <hr />
    <h2>1. The Web Layer (Axum) &amp; Observability</h2>
    <h3>Why Axum</h3>
    <p>Axum is built on Tokio and Tower. Tower's middleware model maps well to Drupal's request lifecycle (bootstrap → init → route → handler → response). Axum's extractors give us type-safe access to request data. It's the most actively maintained async web framework in Rust.</p>
    <p>We wrap the entire application in a custom profiling middleware ("Gander") to catch bottlenecks early.</p>
    <h3>Application State</h3>
    <p>Every Axum handler gets access to shared state via an <code>Arc&lt;AppState&gt;</code>. Note that <code>PluginRegistry</code> holds <em>compiled</em> plugins (which are <code>Send + Sync</code>), not active instances. Per-request instances are managed by <code>RequestState</code> (see Section 3).</p>
