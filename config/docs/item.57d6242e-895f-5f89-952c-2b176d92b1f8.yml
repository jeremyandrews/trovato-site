    </span></code></pre></figure><h3>Breadcrumb Generation</h3>
    <p>The <code>MenuRegistry</code> supports breadcrumb generation by walking up the parent chain. A breadcrumb walks from the root of the menu hierarchy to the current page:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">let</span> breadcrumbs <span class="tok-keyword tok-operator tok-rust">=</span> menu_registry.<span class="tok-support tok-function tok-rust">breadcrumb</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>/blog/tech/rust<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Returns: [BreadcrumbItem(&quot;Home&quot;, &quot;/&quot;), BreadcrumbItem(&quot;Blog&quot;, &quot;/blog&quot;), BreadcrumbItem(&quot;Tech&quot;, &quot;/blog/tech&quot;), BreadcrumbItem(&quot;Rust&quot;, &quot;/blog/tech/rust&quot;)]
    </span></span></code></pre></figure><p>Note: Category-aware breadcrumbs (item → term → vocabulary) are content-aware logic and belong in the item plugin or a dedicated breadcrumb plugin, not in the framework. Such breadcrumbs query the item's category field, walk the term hierarchy, and prepend those items to the menu-based breadcrumbs.</p>
    <hr />
    <h2>2. Sessions and Authentication</h2>
    <h3>Session Architecture</h3>
    <p>Drupal 6 stored sessions in a database table. We use Redis instead — sessions are ephemeral and Redis handles TTL expiration natively.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">tower_sessions<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>SessionManagerLayer<span class="tok-punctuation tok-separator tok-rust">,</span> Expiry<span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-meta tok-path tok-rust">cookie<span class="tok-punctuation tok-accessor tok-rust">::</span></span>SameSite</span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">tower_sessions_redis_store<span class="tok-punctuation tok-accessor tok-rust">::</span></span>RedisStore<span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">time<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Duration<span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-storage tok-modifier tok-rust">pub</span> async <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">session_layer</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">redis_url</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">SessionManagerLayer<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>RedisStore<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-storage tok-type tok-rust">let</span> client <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">redis<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">Client<span class="tok-punctuation tok-accessor tok-rust">::</span></span>open<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>redis_url</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.<span class="tok-support tok-function tok-rust">unwrap</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        <span class="tok-storage tok-type tok-rust">let</span> conn <span class="tok-keyword tok-operator tok-rust">=</span> client.<span class="tok-support tok-function tok-rust">get_multiplexed_async_connection</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.await.<span class="tok-support tok-function tok-rust">unwrap</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        <span class="tok-storage tok-type tok-rust">let</span> store <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-path tok-rust">RedisStore<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>conn</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>

        <span class="tok-meta tok-path tok-rust">SessionManagerLayer<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>store</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
            .<span class="tok-support tok-function tok-rust">with_expiry</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-path tok-rust">Expiry<span class="tok-punctuation tok-accessor tok-rust">::</span></span>OnInactivity<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-path tok-rust">Duration<span class="tok-punctuation tok-accessor tok-rust">::</span></span>hours<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">24</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
            .<span class="tok-support tok-function tok-rust">with_secure</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-language tok-rust">true</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
            .<span class="tok-support tok-function tok-rust">with_http_only</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-language tok-rust">true</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
            .<span class="tok-support tok-function tok-rust">with_same_site</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-path tok-rust">SameSite<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Strict</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>The session cookie is HttpOnly (no JavaScript access), Secure (HTTPS only), and SameSite=Strict. This eliminates most session hijacking vectors that plagued Drupal 6.</p>
    <h3>Stage Awareness</h3>
    <p>The user's session also tracks their active <strong>Stage</strong>. If a user is in the "Spring Campaign" stage, all item loads must reflect that state.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> async <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">get_active_stage</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span>
        <span class="tok-variable tok-parameter tok-rust">session</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-path tok-rust">tower_sessions<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Session,
    </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Option<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>String<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        session.<span class="tok-meta tok-path tok-rust">get<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-generic tok-rust"><span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>String<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>active_stage<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.await.<span class="tok-support tok-function tok-rust">ok</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.<span class="tok-support tok-function tok-rust">flatten</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Stage Switching</h3>
    <p>Users switch stages via an admin toolbar or API endpoint. The switch updates the session:</p>
