    <h2>7. Stages &amp; Content Revisions</h2>
    <h3>Why Stages Instead of Simple Revisions</h3>
    <p>Revisions alone give you version history. Stages give you content staging — "Draft", "Live", "Spring Campaign" can all exist simultaneously with different versions of the same item. This is far more powerful than a boolean published/unpublished flag.</p>
    <p>More importantly, if you design the item table without stage support baked in, retrofitting it later means a data migration on your most critical table. Get the schema right from the start even if you defer the UI.</p>
    <h3>Schema</h3>
