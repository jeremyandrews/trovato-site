    <p>The following are explicitly deferred but the schema supports them: revision comparison (diff view), stage merge conflict resolution (MVP is "Last Publish Wins"), revision moderation (approval queues), revision pruning (should be configurable, not automatic — some sites need full audit trails).</p>
    <p><strong>Future stage-able entity types.</strong> The stage pattern (revisions + stage_association + stage_deletion) can be extended to other entity types as needed: menu items, URL aliases, categories terms, and plugin configuration (variables). The <code>stage_deletion</code> table is already entity-type-generic. Each new entity type would need its own revision table and stage_association table (for proper FK constraints). This is post-MVP work but the architecture supports it.</p>
    <hr />
