    <h1>Trovato Design: Content Model</h1>
    <p><em>Sections 6-8 of the v2.1 Design Document</em></p>
    <hr />
    <h2>6. Items and the Content Type System (CCK)</h2>
    <h3>The Core Problem</h3>
    <p>In Drupal 6, each CCK field created a separate database table, and loading an item meant joining all those tables together. An item type with 15 fields meant 15 JOINs. This was the single biggest performance bottleneck.</p>
    <h3>The Solution: JSONB</h3>
    <p>We store custom fields in a single JSONB column. This eliminates JOINs entirely for field loading. PostgreSQL's GIN indexing on JSONB provides reasonable query performance for Gather-style filtering.</p>
