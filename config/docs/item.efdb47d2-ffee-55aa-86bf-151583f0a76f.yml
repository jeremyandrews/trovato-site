    </span></code></pre></figure><h3>The Item Struct</h3>
    <p>This struct represents a <em>loaded</em> Item — the result of joining <code>item</code> with its current <code>item_revision</code>. It is not a 1:1 map of the <code>item</code> table; <code>revision_author_id</code>, <code>revision_log</code>, and <code>revision_created</code> come from the revision row. The <code>sqlx::FromRow</code> derive works because the load query always joins both tables.</p>
