        stage_id <span class="tok-storage tok-type tok-sql">VARCHAR</span>(<span class="tok-constant tok-numeric tok-sql">64</span>) <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">REFERENCES</span> stage(id),
