    <h3>Gather Integration</h3>
    <p>The Gather query builder needs specific support for categories: term filters (JSONB containment WHERE clauses), hierarchical term filters (recursive CTE or materialized descendants table), term name display (JOIN to <code>category_term</code>), term arguments (contextual filter from URL), and vocabulary filters.</p>
