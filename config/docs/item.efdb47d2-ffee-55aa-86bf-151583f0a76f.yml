    <h3>Hierarchical Queries</h3>
    <p>Drupal 6's categories hierarchy is a DAG because terms can have multiple parents. For "all items tagged with term X or any children," use a recursive CTE:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">WITH</span> RECURSIVE term_tree <span class="tok-keyword tok-other tok-alias tok-sql">AS</span> (
        <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> id <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> category_term <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> id <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> $<span class="tok-constant tok-numeric tok-sql">1</span>
        <span class="tok-keyword tok-other tok-DML tok-sql">UNION ALL</span>
