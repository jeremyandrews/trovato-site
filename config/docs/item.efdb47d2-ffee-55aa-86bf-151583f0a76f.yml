    </span></code></pre></figure><h3>How It Works</h3>
    <p>The stage system supports three operations: <strong>creating</strong> new content in a stage, <strong>modifying</strong> existing live content in a stage, and <strong>deleting</strong> live content in a stage. All three are reversible until publish.</p>
    <p><strong>Creating new content in a stage:</strong>
    The item is inserted into the <code>item</code> table with <code>stage_id</code> set to the active stage (e.g., <code>'spring_campaign'</code>). The item only appears when viewing in that stage. An initial revision is created in <code>item_revision</code>. No <code>stage_association</code> entry is needed — the <code>stage_id</code> column on the item itself tracks ownership.</p>
    <p><strong>Modifying existing live content in a stage:</strong>
    Insert a new row into <code>item_revision</code> with the modified field values. Create or update a <code>stage_association</code> entry mapping <code>(stage_id, item_id) → target_revision_id</code>. The live item table is not touched. When loading this item in the stage, the <code>stage_association</code> override takes precedence.</p>
    <p><strong>Deleting content in a stage:</strong>
    Insert a row into <code>stage_deletion</code> with <code>(stage_id, 'item', item_id)</code>. The item is not actually deleted. When querying in that stage, items in the deletion table are excluded. The deletion is reversible by removing the <code>stage_deletion</code> row.</p>
    <p><strong>On revert (single item):</strong> Copy the target revision's data back into the item table and update <code>current_revision_id</code>. Do not delete intermediate revisions.</p>
    <p><strong>On publish (stage → Live):</strong>
    Publishing is an atomic operation that applies all stage changes to Live in a single transaction:</p>
    <ol>
    <li><strong>Modified items:</strong> For each <code>stage_association</code> entry, copy the target revision's data into the <code>item</code> table (title, status, fields, etc.) and update <code>current_revision_id</code>. Delete the <code>stage_association</code> entry.</li>
    <li><strong>New items:</strong> For each item where <code>stage_id</code> = this stage, set <code>stage_id = 'live'</code>. The item is now visible to everyone.</li>
    <li><strong>Deleted items:</strong> For each <code>stage_deletion</code> entry where entity_type = 'item', actually delete the item (or mark it deleted, depending on policy). Delete the <code>stage_deletion</code> entry.</li>
    <li><strong>Cache invalidation:</strong> Invalidate all cache tags for affected items.</li>
    </ol>
    <p>The entire publish runs in a single Postgres transaction. If any step fails, the transaction rolls back and the stage is unchanged.</p>
    <h3>Stage-Aware Item Listing</h3>
    <p>When listing items (for Gather queries or admin pages), the query must account for three stage conditions: include items modified in the stage (use stage revision), exclude items deleted in the stage, and include items created in the stage.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> async <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">item_list_query_base</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span>
        <span class="tok-variable tok-parameter tok-rust">stage_id</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-meta tok-generic tok-rust">Option<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span><span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span>,
    </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> String</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-keyword tok-control tok-rust">if</span> <span class="tok-storage tok-type tok-rust">let</span> <span class="tok-support tok-type tok-rust">Some</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>st</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> stage_id <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> In a stage: include live items (not deleted in this stage)
    </span>        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> plus items created in this stage, using stage revision overrides
    </span>        <span class="tok-support tok-macro tok-rust">format!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust">
                <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>SELECT i.*, COALESCE(sa.target_revision_id, i.current_revision_id) as effective_revision_id
                 FROM item i
                 LEFT JOIN stage_association sa
                     ON sa.stage_id = &#39;<span class="tok-constant tok-other tok-placeholder tok-rust">{st}</span>&#39; AND sa.item_id = i.id
                 WHERE (i.stage_id = &#39;live&#39; OR i.stage_id = &#39;<span class="tok-constant tok-other tok-placeholder tok-rust">{st}</span>&#39;)
                   AND NOT EXISTS (
                       SELECT 1 FROM stage_deletion sd
                       WHERE sd.stage_id = &#39;<span class="tok-constant tok-other tok-placeholder tok-rust">{st}</span>&#39;
                         AND sd.entity_type = &#39;item&#39;
                         AND sd.entity_id = i.id
                   )<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span>
            </span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span> <span class="tok-keyword tok-control tok-rust">else</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Live: only show live items
    </span>        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>SELECT i.* FROM item i WHERE i.stage_id = &#39;live&#39;<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span>.<span class="tok-support tok-function tok-rust">to_string</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Stage-Aware Loading</h3>
    <p>When loading an item, we check if the active stage has an override for this specific item.</p>
