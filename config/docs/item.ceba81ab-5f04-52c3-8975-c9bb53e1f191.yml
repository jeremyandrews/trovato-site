    <h1>Trovato Design: Plugin SDK Specification</h1>
    <p><em>New document — fills the gap identified in Section 22 of the v2.1 design.</em></p>
    <p>This document specifies the <code>trovato_sdk</code> crate: the types, macros, host function bindings, and conventions that plugin authors use to build Trovato plugins. It is the authoritative reference for the plugin developer experience.</p>
    <p><strong>Design principle:</strong> Write the code you want developers to write, then build the Kernel to run it. If the SDK requires developers to understand WASM memory layout, JSON serialization, or handle indices, the design is wrong.</p>
    <hr />
    <h2>1. Plugin Structure</h2>
    <p>A plugin is a separate Rust crate compiled to <code>wasm32-wasip1</code>.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>plugins/
      blog/
        Cargo.toml
        blog.info.toml       # metadata + tap declarations
        src/
          lib.rs             # plugin source
        target/
          wasm32-wasip1/release/
            blog.wasm        # compiled artifact
    </code></pre></figure><h3>1.1 Cargo.toml</h3>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[package]
    name = &quot;blog&quot;
    version = &quot;1.0.0&quot;
    edition = &quot;2024&quot;

    [lib]
    crate-type = [&quot;cdylib&quot;]

    [dependencies]
    trovato_sdk = { path = &quot;../../crates/plugin-sdk&quot; }
    serde = { version = &quot;1&quot;, features = [&quot;derive&quot;] }
    serde_json = &quot;1&quot;
    </code></pre></figure><h3>1.2 Plugin Metadata (blog.info.toml)</h3>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;blog&quot;
    description = &quot;Provides a blog content type with tags&quot;
    version = &quot;1.0.0&quot;
    dependencies = [&quot;item&quot;, &quot;categories&quot;]

    [taps]
    implements = [
        &quot;tap_item_info&quot;,
        &quot;tap_item_view&quot;,
        &quot;tap_menu&quot;,
        &quot;tap_perm&quot;,
    ]
    weight = 0   # execution order; lower = earlier

    [taps.options]
    tap_item_view = { data_mode = &quot;handle&quot; }  # &quot;handle&quot; (default) or &quot;full&quot;
    </code></pre></figure><p><strong>Required fields:</strong> name, version, taps.implements
    <strong>Optional fields:</strong> description, dependencies, weight (default 0), taps.options</p>
    <h3>1.3 Data Access Modes</h3>
    <p>Declared per tap in <code>[taps.options]</code>. Default is <code>"handle"</code>.</p>
    <table><thead><tr><th>Mode</th><th>When to use</th><th>How it works</th></tr></thead><tbody>
    <tr><th><code>handle</code></th><th>Most taps (default)</th><th>Kernel passes an opaque <code>ItemHandle</code>. Plugin reads/writes fields via host functions. No bulk serialization.</th></tr>
    <tr><th><code>full</code></th><th>Complex mutations, bulk transforms</th><th>Kernel passes full Item JSON. Plugin returns modified JSON. Higher latency but full access.</th></tr>
    </tbody></table>
    <hr />
    <h2>2. The trovato_sdk Crate</h2>
    <h3>2.1 Prelude</h3>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">prelude<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-keyword tok-operator tok-rust">*</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>Exports: <code>ItemHandle</code>, <code>Item</code>, <code>TapContext</code>, <code>RenderElement</code>, <code>ContentTypeDefinition</code>, <code>FieldDefinition</code>, <code>FieldType</code>, <code>MenuDefinition</code>, <code>PermissionDefinition</code>, <code>RecordRef</code>, <code>TextValue</code>, <code>render</code>, <code>plugin_tap</code>, <code>plugin_info</code>.</p>
    <h3>2.2 Proc Macros</h3>
    <h4><code>#[plugin_info]</code></h4>
    <p>Placed on a module block. Declares plugin metadata that the SDK uses for compile-time validation against <code>.info.toml</code>.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_info</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-module tok-rust"><span class="tok-storage tok-type tok-module tok-rust">mod</span> <span class="tok-entity tok-name tok-module tok-rust">blog</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">NAME</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>blog<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        <span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">DESCRIPTION</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Provides a blog content type<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        <span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">VERSION</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>1.0.0<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
        <span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">DEPENDENCIES</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>item<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>categories<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p><strong>What it generates:</strong> A static metadata struct accessible to the Kernel at load time. Does not generate <code>.info.toml</code> (that file is hand-written and is the source of truth for the Kernel).</p>
    <h4><code>#[plugin_tap]</code></h4>
    <p>Placed on a function. Generates the WASM export boilerplate matching the WIT interface.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">item_view</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">item</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>ItemHandle, <span class="tok-variable tok-parameter tok-rust">ctx</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>TapContext</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> RenderElement</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> plugin logic
    </span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p><strong>What it generates:</strong></p>
    <ol>
    <li>A WASM export function named <code>tap-item-view</code> (matching WIT convention)</li>
    <li>For handle-based mode: receives <code>item-handle: s32</code>, wraps it in <code>ItemHandle</code></li>
    <li>For full-serialization mode: receives <code>item-json: string</code>, deserializes to <code>Item</code></li>
    <li>Creates a <code>TapContext</code> from the current request state</li>
    <li>Calls the developer's function</li>
    <li>Serializes the return value for the WASM boundary</li>
    <li>Handles panics: catches, logs via host <code>log</code> function, returns an error RenderElement</li>
    </ol>
    <p><strong>Function signature conventions by tap type:</strong></p>
    <table><thead><tr><th>Tap</th><th>Signature</th><th>Return</th></tr></thead><tbody>
    <tr><th><code>item_info</code></th><th><code>fn() -&gt; Vec&lt;ContentTypeDefinition&gt;</code></th><th>Serialized to JSON</th></tr>
    <tr><th><code>item_view</code></th><th><code>fn(item: &amp;ItemHandle, ctx: &amp;TapContext) -&gt; RenderElement</code></th><th>Serialized to JSON</th></tr>
    <tr><th><code>item_view_alter</code></th><th><code>fn(render: &amp;mut RenderElement, item: &amp;ItemHandle, ctx: &amp;TapContext)</code></th><th>Mutates in place</th></tr>
    <tr><th><code>item_insert</code></th><th><code>fn(item: &amp;ItemHandle, ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Error string on failure</th></tr>
    <tr><th><code>item_update</code></th><th><code>fn(item: &amp;ItemHandle, ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Error string on failure</th></tr>
    <tr><th><code>item_delete</code></th><th><code>fn(item_id: Uuid, ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Error string on failure</th></tr>
    <tr><th><code>item_access</code></th><th><code>fn(item: &amp;ItemHandle, op: &amp;str, ctx: &amp;TapContext) -&gt; AccessResult</code></th><th>Grant / Deny / Neutral</th></tr>
    <tr><th><code>menu</code></th><th><code>fn() -&gt; Vec&lt;MenuDefinition&gt;</code></th><th>Serialized to JSON</th></tr>
    <tr><th><code>perm</code></th><th><code>fn() -&gt; Vec&lt;PermissionDefinition&gt;</code></th><th>Serialized to JSON</th></tr>
    <tr><th><code>form_alter</code></th><th><code>fn(form: &amp;mut Form, form_id: &amp;str, ctx: &amp;TapContext)</code></th><th>Mutates in place</th></tr>
    <tr><th><code>form_validate</code></th><th><code>fn(form_id: &amp;str, values: &amp;FormValues, ctx: &amp;TapContext) -&gt; Vec&lt;FormError&gt;</code></th><th>Errors list</th></tr>
    <tr><th><code>form_submit</code></th><th><code>fn(form_id: &amp;str, values: &amp;FormValues, ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Error on failure</th></tr>
    <tr><th><code>cron</code></th><th><code>fn(ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Error on failure</th></tr>
    <tr><th><code>install</code></th><th><code>fn(ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Create tables, seed data</th></tr>
    <tr><th><code>enable</code></th><th><code>fn(ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Activation logic</th></tr>
    <tr><th><code>disable</code></th><th><code>fn(ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Deactivation logic</th></tr>
    <tr><th><code>theme</code></th><th><code>fn() -&gt; Vec&lt;ThemeDefinition&gt;</code></th><th>Template registrations</th></tr>
    <tr><th><code>preprocess_item</code></th><th><code>fn(variables: &amp;mut TemplateVars, item: &amp;ItemHandle, ctx: &amp;TapContext)</code></th><th>Adds template vars</th></tr>
    <tr><th><code>item_update_index</code></th><th><code>fn(item: &amp;ItemHandle, ctx: &amp;TapContext) -&gt; String</code></th><th>Searchable text</th></tr>
    <tr><th><code>queue_info</code></th><th><code>fn() -&gt; Vec&lt;QueueDefinition&gt;</code></th><th>Queue declarations</th></tr>
    <tr><th><code>queue_worker</code></th><th><code>fn(payload: &amp;str, ctx: &amp;TapContext) -&gt; Result&lt;(), String&gt;</code></th><th>Process one queue item</th></tr>
    </tbody></table>
    <hr />
    <h2>3. Core Types</h2>
    <h3>3.1 ItemHandle</h3>
    <p>An opaque reference to an Item held in the Kernel's <code>RequestState</code>. Each host function call crosses the WASM boundary but transfers only the requested data, not the entire item.</p>
