    <tr><th>Crypto primitives</th><th>Post-MVP</th><th>HMAC, hash, encrypt</th></tr>
    <tr><th>Queue enqueue</th><th>Phase 1</th><th><code>queue_enqueue(queue_name, payload)</code></th></tr>
    </tbody></table>
    <hr />
    <h2>7. Error Handling</h2>
    <h3>7.1 Return Types</h3>
    <table><thead><tr><th>Tap type</th><th>Return</th><th>On error</th></tr></thead><tbody>
    <tr><th>View taps</th><th><code>RenderElement</code></th><th>Return an error RenderElement (<code>render::markup("div", "Error: ...").class("error").build()</code>)</th></tr>
    <tr><th>Mutation taps</th><th><code>Result&lt;(), String&gt;</code></th><th>Return <code>Err("description")</code>. Kernel logs and may abort the operation.</th></tr>
    <tr><th>Info taps</th><th><code>Vec&lt;T&gt;</code> serialized to JSON</th><th>Return empty <code>"[]"</code>. Kernel logs the failure.</th></tr>
    <tr><th>Alter taps</th><th>Mutate in place</th><th>If the plugin panics, Kernel catches and continues with unaltered data.</th></tr>
    </tbody></table>
    <h3>7.2 Guest Panics</h3>
    <p>If a plugin panics during a tap invocation:</p>
    <ol>
    <li>Wasmtime traps the panic (WASM has no uncatchable exceptions)</li>
    <li>The Kernel logs the error: <code>"Plugin 'blog' panicked during tap_item_view: {message}"</code></li>
    <li>For view taps: the Kernel skips this plugin's contribution and continues</li>
    <li>For mutation taps: the Kernel aborts the operation and returns an error to the user</li>
    <li>The plugin's Store is dropped (it was per-request anyway)</li>
    </ol>
    <h3>7.3 Host Function Errors</h3>
    <p>Host functions return <code>result&lt;T, string&gt;</code> in WIT. The SDK wraps these as <code>Result&lt;T, PluginError&gt;</code> in Rust. Plugin authors should handle errors or propagate them:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">let</span> results <span class="tok-keyword tok-operator tok-rust">=</span> ctx.<span class="tok-support tok-function tok-rust">db_select</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>query</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-keyword tok-operator tok-rust">?</span><span class="tok-punctuation tok-terminator tok-rust">;</span>  <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> propagates error
    </span><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> or
    </span><span class="tok-storage tok-type tok-rust">let</span> results <span class="tok-keyword tok-operator tok-rust">=</span> ctx.<span class="tok-support tok-function tok-rust">db_select</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>query</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.<span class="tok-support tok-function tok-rust">unwrap_or_default</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>  <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> fallback
    </span></span></code></pre></figure><hr />
    <h2>8. Plugin Lifecycle</h2>
    <h3>8.1 Discovery &amp; Loading</h3>
    <ol>
    <li>Kernel reads <code>plugins/</code> directory at startup</li>
    <li>For each subdirectory, reads <code>{name}.info.toml</code></li>
    <li>Checks <code>system</code> table for enabled plugins</li>
    <li>Topological sort by dependencies</li>
    <li>Compiles each <code>.wasm</code> file to a Wasmtime <code>Module</code> (one-time cost)</li>
    <li>Builds <code>TapRegistry</code> from all enabled plugins' tap declarations</li>
    </ol>
    <h3>8.2 Per-Request Execution</h3>
    <ol>
    <li>Request arrives</li>
    <li>Kernel creates a <code>RequestState</code> (db pool, redis, user, stage)</li>
    <li>When a tap fires, Kernel lazily instantiates needed plugins (grabs Store from pool, ~5us)</li>
    <li>Tap function called via WASM export</li>
    <li>Plugin calls host functions as needed (each crosses boundary, ~1us each)</li>
    <li>Plugin returns result; Kernel processes it</li>
    <li>After all taps for this stage complete, Kernel proceeds to next stage</li>
    <li>Request ends; all Stores returned to pool</li>
    </ol>
    <h3>8.3 Install / Uninstall</h3>
    <p><code>tap_install</code> runs when a plugin is first enabled. Use it to create custom database tables:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
