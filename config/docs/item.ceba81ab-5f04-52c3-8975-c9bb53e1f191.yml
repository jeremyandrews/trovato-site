    </span></code></pre></figure><h3>4.3 Alter Semantics</h3>
    <p><code>tap_item_view_alter</code> receives a mutable reference to the RenderElement tree. Plugins can:</p>
    <ul>
    <li>Add new children: <code>render.set_child("sidebar", element)</code></li>
    <li>Remove children: <code>render.remove_child("tags")</code></li>
    <li>Modify attributes: <code>render.add_class("promoted")</code></li>
    <li>Change weight: <code>render.set_weight(100)</code></li>
    <li>Access children: <code>render.get_child("title")</code></li>
    </ul>
    <p>Plugins <strong>cannot</strong> replace the entire tree (the function signature takes <code>&amp;mut RenderElement</code>, not returning a new one). This prevents clobber bugs where one plugin overwrites another's changes.</p>
    <hr />
    <h2>5. Mutation Model</h2>
    <h3>5.1 Tap Invocation Order</h3>
    <p>Taps are invoked in <strong>weight order</strong> (ascending) as declared in each plugin's <code>.info.toml</code>. Default weight is 0. Plugins with equal weight are invoked in load order (topological sort of dependencies).</p>
    <h3>5.2 Mutation Accumulation</h3>
    <p>When multiple plugins implement the same tap, <strong>mutations accumulate</strong>. Plugin B sees changes made by Plugin A.</p>
    <p>For handle-based access, this is automatic: both plugins operate on the same <code>Item</code> in the Kernel's <code>RequestState</code>. When Plugin A calls <code>item.set_field("field_promoted", true)</code>, the field is written immediately in the Kernel. Plugin B's subsequent <code>item.get_field::&lt;bool&gt;("field_promoted")</code> returns <code>true</code>.</p>
    <p>For full-serialization access, the Kernel applies Plugin A's returned JSON before passing the (now modified) Item to Plugin B.</p>
    <h3>5.3 Alter Taps</h3>
    <p>Alter taps (<code>tap_item_view_alter</code>, <code>tap_form_alter</code>) follow the same accumulation model. Plugin A's modifications to the RenderElement or Form are visible to Plugin B.</p>
    <hr />
    <h2>6. Host Functions (WIT Interface)</h2>
    <p>The authoritative WIT interface with handle-based data access.</p>
    <figure class="code"><figcaption class="code__lang">wit</figcaption><pre class="code__body" tabindex="0" aria-label="wit code"><code class="language-wit">package trovato:kernel;

    // --- Item API (handle-based) ---
    interface item-api {
        // Read
        get-title: func(item-handle: s32) -&gt; string;
        get-field-string: func(item-handle: s32, field-name: string) -&gt; option&lt;string&gt;;
        get-field-int: func(item-handle: s32, field-name: string) -&gt; option&lt;s64&gt;;
        get-field-float: func(item-handle: s32, field-name: string) -&gt; option&lt;f64&gt;;
        get-field-json: func(item-handle: s32, field-name: string) -&gt; option&lt;string&gt;;
        get-type: func(item-handle: s32) -&gt; string;
        get-id: func(item-handle: s32) -&gt; string;           // was get-nid, returns UUID string
        get-revision-id: func(item-handle: s32) -&gt; string;  // was get-vid, returns UUID string
        get-author-id: func(item-handle: s32) -&gt; string;    // was get-uid, returns UUID string
        get-status: func(item-handle: s32) -&gt; s32;
        get-created: func(item-handle: s32) -&gt; s64;
        get-changed: func(item-handle: s32) -&gt; s64;

        // Write
        set-title: func(item-handle: s32, value: string);
        set-field-string: func(item-handle: s32, field-name: string, value: string);
        set-field-int: func(item-handle: s32, field-name: string, value: s64);
        set-field-float: func(item-handle: s32, field-name: string, value: f64);
        set-field-json: func(item-handle: s32, field-name: string, value-json: string);
        set-status: func(item-handle: s32, value: s32);
    }

    // --- Database API (structured) ---
    interface db {
        select: func(query-json: string) -&gt; result&lt;string, string&gt;;
        insert: func(table: string, data-json: string) -&gt; result&lt;string, string&gt;;  // returns UUID string (was s64)
        update: func(table: string, data-json: string, where-json: string) -&gt; result&lt;u64, string&gt;;
        delete: func(table: string, where-json: string) -&gt; result&lt;u64, string&gt;;

        // Permission-gated raw SQL (requires &quot;raw_sql&quot; in .info.toml permissions)
        query-raw: func(sql: string, params-json: string) -&gt; result&lt;string, string&gt;;
        execute-raw: func(sql: string, params-json: string) -&gt; result&lt;u64, string&gt;;
    }

    // --- Variables (persistent config) ---
    interface variables {
        get: func(name: string, default-value: string) -&gt; string;
        set: func(name: string, value: string) -&gt; result&lt;_, string&gt;;
    }

    // --- Request context (per-request shared state) ---
    interface request-context {
        get: func(key: string) -&gt; option&lt;string&gt;;
        set: func(key: string, value: string);
    }

    // --- User API ---
    interface user-api {
        current-user-has-permission: func(permission: string) -&gt; bool;
        current-user-id: func() -&gt; string;  // was current-user-uid, returns UUID string
    }

    // --- Cache API ---
    interface cache-api {
        get: func(bin: string, key: string) -&gt; option&lt;string&gt;;
        set: func(bin: string, key: string, value: string, tags-json: string);
        invalidate-tag: func(tag: string);
    }

    // --- Inter-plugin communication ---
    interface plugin-api {
        invoke: func(plugin-name: string, function-name: string, payload: string)
            -&gt; result&lt;string, string&gt;;
        plugin-exists: func(plugin-name: string) -&gt; bool;
    }

    // --- Logging ---
    interface logging {
        log: func(level: string, plugin: string, message: string);
    }

    // --- Plugin world ---
    world plugin {
        import item-api;
        import db;
        import variables;
        import request-context;
        import user-api;
        import cache-api;
        import plugin-api;
        import logging;

        // Lifecycle
        export tap-install: func() -&gt; result&lt;_, string&gt;;
        export tap-enable: func() -&gt; result&lt;_, string&gt;;
        export tap-disable: func() -&gt; result&lt;_, string&gt;;
        export tap-uninstall: func() -&gt; result&lt;_, string&gt;;

        // Content type registration
        export tap-item-info: func() -&gt; string;

        // Item CRUD (handle-based by default)
        export tap-item-view: func(item-handle: s32) -&gt; string;
        export tap-item-view-alter: func(render-json: string, item-handle: s32) -&gt; string;
        export tap-item-insert: func(item-handle: s32) -&gt; result&lt;_, string&gt;;
        export tap-item-update: func(item-handle: s32) -&gt; result&lt;_, string&gt;;
        export tap-item-delete: func(item-id: string) -&gt; result&lt;_, string&gt;;
        export tap-item-access: func(item-handle: s32, op: string) -&gt; string;

        // Full-serialization variants (opt-in via .info.toml)
        export tap-item-view-full: func(item-json: string) -&gt; string;
        export tap-item-insert-full: func(item-json: string) -&gt; result&lt;_, string&gt;;
        export tap-item-update-full: func(item-json: string) -&gt; result&lt;_, string&gt;;

        // Categories
        export tap-categories-term-insert: func(term-json: string) -&gt; result&lt;_, string&gt;;
        export tap-categories-term-update: func(term-json: string) -&gt; result&lt;_, string&gt;;
        export tap-categories-term-delete: func(term-id: string) -&gt; result&lt;_, string&gt;;

        // Forms
        export tap-form-alter: func(form-id: string, form-json: string) -&gt; string;
        export tap-form-validate: func(form-id: string, values-json: string) -&gt; string;
        export tap-form-submit: func(form-id: string, values-json: string) -&gt; result&lt;_, string&gt;;

        // Routing &amp; permissions
        export tap-menu: func() -&gt; string;
        export tap-perm: func() -&gt; string;

        // Theme
        export tap-theme: func() -&gt; string;
        export tap-preprocess-item: func(context-json: string, item-handle: s32) -&gt; string;

        // Search
        export tap-item-update-index: func(item-handle: s32) -&gt; string;

        // Cron &amp; queues
        export tap-cron: func() -&gt; result&lt;_, string&gt;;
        export tap-queue-info: func() -&gt; string;
        export tap-queue-worker: func(item-json: string) -&gt; result&lt;_, string&gt;;

        // User lifecycle
        export tap-user-login: func(user-json: string) -&gt; result&lt;_, string&gt;;
    }
    </code></pre></figure><figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>
    ### 6.1 Database Query JSON Schema

    The `select` host function accepts a structured JSON query, not raw SQL:

    ```json
    {
        &quot;table&quot;: &quot;item&quot;,
        &quot;fields&quot;: [&quot;nid&quot;, &quot;title&quot;, &quot;fields-&gt;&gt;&#39;field_rating&#39; as rating&quot;],
        &quot;conditions&quot;: [
            {&quot;field&quot;: &quot;type&quot;, &quot;op&quot;: &quot;=&quot;, &quot;value&quot;: &quot;blog&quot;},
            {&quot;field&quot;: &quot;status&quot;, &quot;op&quot;: &quot;=&quot;, &quot;value&quot;: 1}
        ],
        &quot;order_by&quot;: [{&quot;field&quot;: &quot;created&quot;, &quot;direction&quot;: &quot;DESC&quot;}],
        &quot;limit&quot;: 25,
        &quot;offset&quot;: 0,
        &quot;joins&quot;: [
            {
                &quot;table&quot;: &quot;category_term_item&quot;,
                &quot;on&quot;: &quot;item.nid = category_term_item.nid&quot;,
                &quot;type&quot;: &quot;INNER&quot;
            }
        ]
    }
    </code></pre></figure><p>The Kernel translates this to SeaQuery, preventing SQL injection. Plugins cannot inject arbitrary SQL through this interface.</p>
    <p><strong>Supported operators in <code>conditions[].op</code>:</strong></p>
    <table><thead><tr><th>Operator</th><th>Meaning</th><th>Value type</th></tr></thead><tbody>
    <tr><th><code>=</code></th><th>Equals</th><th>scalar</th></tr>
    <tr><th><code>!=</code></th><th>Not equals</th><th>scalar</th></tr>
    <tr><th><code>&gt;</code></th><th>Greater than</th><th>scalar (numeric for JSONB fields)</th></tr>
    <tr><th><code>&lt;</code></th><th>Less than</th><th>scalar</th></tr>
    <tr><th><code>&gt;=</code></th><th>Greater than or equal</th><th>scalar</th></tr>
    <tr><th><code>&lt;=</code></th><th>Less than or equal</th><th>scalar</th></tr>
    <tr><th><code>LIKE</code></th><th>SQL LIKE pattern</th><th>string (use <code>%</code> wildcards)</th></tr>
    <tr><th><code>IN</code></th><th>Value in list</th><th>array</th></tr>
    <tr><th><code>NOT IN</code></th><th>Value not in list</th><th>array</th></tr>
    <tr><th><code>IS NULL</code></th><th>Field is null</th><th>(no value needed)</th></tr>
    <tr><th><code>IS NOT NULL</code></th><th>Field is not null</th><th>(no value needed)</th></tr>
    <tr><th><code>BETWEEN</code></th><th>Between two values</th><th>array of <code>[min, max]</code></th></tr>
    </tbody></table>
    <p>For JSONB fields referenced via <code>fields-&gt;&gt;'field_name'</code>, the Kernel applies <code>::numeric</code> casts automatically when the operator is a numeric comparison and the value is a number.</p>
    <p><strong>For queries too complex for the structured API</strong>, plugins can request <code>raw_sql</code> permission in <code>.info.toml</code>:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[permissions]
    requires = [&quot;raw_sql&quot;]
    </code></pre></figure><p>Administrators must explicitly grant this permission. Plugins with <code>raw_sql</code> access are treated as trusted.</p>
    <h3>6.2 Host Functions Not Yet Specified (Deferred)</h3>
    <p>These are recognized gaps to be designed as phases progress:</p>
