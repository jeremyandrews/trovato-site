    <h3>8.4 Enable / Disable</h3>
    <p><code>tap_enable</code> runs each time a plugin is activated (including first install). <code>tap_disable</code> runs when deactivated. These are for runtime state (registering cron jobs, clearing caches), not schema changes.</p>
