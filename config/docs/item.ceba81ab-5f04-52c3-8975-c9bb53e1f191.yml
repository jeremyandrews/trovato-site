    <tr><th><code>#attributes</code></th><th>object</th><th>no</th><th>HTML attributes: <code>class</code> (array), <code>id</code>, <code>data-*</code>, etc.</th></tr>
    <tr><th><code>#value</code></th><th>string</th><th>depends</th><th>The content. Required for <code>markup</code>.</th></tr>
    <tr><th><code>#tag</code></th><th>string</th><th>no (default <code>div</code>)</th><th>HTML tag for <code>markup</code> type.</th></tr>
    <tr><th><code>#format</code></th><th>string</th><th>no</th><th>Text format for sanitization. If present, value runs through the filter pipeline. If absent, value is HTML-escaped.</th></tr>
    <tr><th>(children)</th><th>object</th><th>no</th><th>Named child RenderElements. Rendered in <code>#weight</code> order.</th></tr>
    </tbody></table>
    <p><strong>Element types:</strong></p>
    <table><thead><tr><th>Type</th><th>Renders as</th><th>Notes</th></tr></thead><tbody>
    <tr><th><code>container</code></th><th><code>&lt;div&gt;</code> (or tag from <code>#tag</code>) wrapping children</th><th>No <code>#value</code>. Only children + attributes.</th></tr>
    <tr><th><code>markup</code></th><th><code>&lt;#tag&gt;#value&lt;/#tag&gt;</code></th><th>If <code>#format</code> present, value is filtered. If absent, escaped.</th></tr>
    <tr><th><code>table</code></th><th><code>&lt;table&gt;</code></th><th>Children are rows. Special <code>#header</code> property for column headers.</th></tr>
    <tr><th><code>list</code></th><th><code>&lt;ul&gt;</code> or <code>&lt;ol&gt;</code></th><th>Children are <code>&lt;li&gt;</code> items. <code>#list_type</code> = "ul" or "ol".</th></tr>
    <tr><th><code>link</code></th><th><code>&lt;a href="#href"&gt;#value&lt;/a&gt;</code></th><th><code>#href</code> property required.</th></tr>
    </tbody></table>
