    </span></code></pre></figure><p>Behaviors:</p>
    <ul>
    <li><strong>fill_if_empty</strong> — Only generate if the target field is blank</li>
    <li><strong>always_update</strong> — Regenerate on every save</li>
    <li><strong>suggest</strong> — Store the suggestion without writing to the field</li>
    </ul>
    <hr />
    <h2>Step 7: Intelligent Search with Scolta</h2>
    <p>Trovato integrates <strong>Scolta</strong> for AI-powered search that works <strong>without any vector database</strong>. Pagefind handles client-side indexing, and AI enhances the search experience with query expansion and summaries.</p>
    <h3>How It Works</h3>
    <ol>
    <li><strong>Pagefind</strong> builds a static search index from published content (via cron)</li>
    <li><strong>scolta.js</strong> runs client-side scoring: recency decay, title/content match boost, deduplication</li>
    <li><strong>AI query expansion</strong> — "performance issues" also finds "site speed optimization"</li>
    <li><strong>AI summary</strong> — A streaming answer appears above results, citing sources</li>
    <li><strong>Follow-up conversation</strong> — Users can ask follow-up questions</li>
    </ol>
    <h3>Enable Search Indexing</h3>
    <p>The <code>trovato_search</code> plugin detects content changes and signals the kernel to rebuild the Pagefind index:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin enable trovato_search</span>
