      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>target_field<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_summary<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
