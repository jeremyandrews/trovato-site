    <h2>Step 5: Chat Configuration</h2>
    <p>Configure the chatbot at <strong>Admin &gt; AI Chat</strong> (<code>/admin/system/ai-chat</code>):</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-ai/ai-chat-settings.png"><img src="images/part-ai/ai-chat-settings.png" width="600" alt="AI Chat Configuration showing system prompt editor, RAG toggle, model settings, and rate limiting"></a></p>
    <p>Settings include:</p>
    <ul>
    <li><strong>System prompt</strong> — The chatbot's personality and instructions</li>
    <li><strong>RAG (Retrieval-Augmented Generation)</strong> — Whether search results are injected as context</li>
    <li><strong>Model</strong> — Which AI model to use and token limits</li>
    <li><strong>Conversation</strong> — How many turns of history to retain</li>
    <li><strong>Rate limiting</strong> — Requests per hour per user</li>
    </ul>
    <p>The chatbot is accessible at <code>POST /api/v1/chat</code> and renders as a Tile that can be placed in any Slot. Here it is in the sidebar of the conferences page, answering a question about Rust conferences:</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-ai/chatbot-conversation.png"><img src="images/part-ai/chatbot-conversation.png" width="600" alt="Conferences page with AI chatbot in the sidebar showing a conversation about Rust conferences in 2026"></a></p>
    <hr />
    <h2>Step 6: Field Rules (Automatic Content Enrichment)</h2>
    <p>Field rules automate content enrichment — when a conference description changes, AI auto-generates a summary. Rules are configured in site config under <code>trovato_ai.field_rules</code> and fire via <code>tap_item_presave</code>.</p>
    <p>Example rule:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>item_type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>conference<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
