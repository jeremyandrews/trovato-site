    <h1>Part 9: AI &amp; Intelligent Search</h1>
    <p>Your conference site has content, structure, editorial workflow, community features, internationalization, and production infrastructure. Now you teach it to think. This part covers Trovato's AI integration — provider configuration, content enrichment, intelligent search with Scolta, and the chatbot.</p>
    <p>The guiding principle: <strong>AI as infrastructure, not afterthought.</strong> The kernel manages API keys, budgets, and providers so plugins never touch credentials. And critically: <strong>no vector database required.</strong> Scolta provides AI-powered search using Pagefind for client-side indexing and AI for query expansion and summarization — no Elasticsearch, no Solr, no pgvector needed for the default path.</p>
    <hr />
    <h2>Step 1: Enable the AI Plugin</h2>
    <p>The <code>trovato_ai</code> plugin provides AI features: field rules, form assist buttons, chat actions, and permissions. It ships with Trovato but is disabled by default.</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Enable the plugin</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin enable trovato_ai</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Restart the server</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> (kill and restart your server process)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>After restart, verify the plugin is loaded:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> http://localhost:3000/health</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> {&quot;status&quot;:&quot;healthy&quot;,&quot;postgres&quot;:true,&quot;redis&quot;:true}</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>Check the admin plugins page — <code>trovato_ai</code> should show as "Enabled":</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-ai/plugins-ai-enabled.png"><img src="images/part-ai/plugins-ai-enabled.png" width="600" alt="Plugins admin page showing trovato_ai as enabled"></a></p>
    <hr />
    <h2>Step 2: Configure an AI Provider</h2>
    <p>Trovato supports OpenAI-compatible and Anthropic providers. API keys are stored as <strong>environment variable references</strong> — the database stores the variable name (e.g., <code>ANTHROPIC_API_KEY</code>), never the key itself. The kernel resolves the key from the environment at runtime. WASM plugins never see the key.</p>
    <h3>Set the API Key</h3>
    <p>Add your API key as an environment variable:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> In your .env file (gitignored):</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">ANTHROPIC_API_KEY</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">sk-ant-...</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Or export directly:</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-storage tok-modifier tok-shell">export</span> <span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">ANTHROPIC_API_KEY</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">sk-ant-...</span></span>
    </span></code></pre></figure><h3>Configure the Provider</h3>
    <p>Navigate to <strong>Admin &gt; AI Providers</strong> (<code>/admin/system/ai-providers</code>):</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-ai/ai-config-providers.png"><img src="images/part-ai/ai-config-providers.png" width="600" alt="AI Providers admin showing Anthropic configured with masked API key and Chat as the default operation"></a></p>
    <p>Add a provider:</p>
    <ul>
    <li><strong>Label:</strong> Anthropic</li>
    <li><strong>Protocol:</strong> Anthropic</li>
    <li><strong>Base URL:</strong> <code>https://api.anthropic.com/v1</code></li>
    <li><strong>API Key Env Var:</strong> <code>ANTHROPIC_API_KEY</code></li>
    <li><strong>Model for Chat:</strong> <code>claude-sonnet-4-20250514</code></li>
    <li><strong>Rate Limit:</strong> 30 requests/minute</li>
    </ul>
    <p>Set Anthropic as the default provider for Chat operations in the "Default Providers" section.</p>
    <h3>Test the Connection</h3>
    <p>Click "Test Connection" next to the provider. A green checkmark confirms the key is valid and the provider is reachable.</p>
    <hr />
    <h2>Step 3: Token Budgets &amp; Usage</h2>
    <p>Monitor AI costs and set per-role limits at <strong>Admin &gt; AI Budgets</strong> (<code>/admin/system/ai-budgets</code>):</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-ai/ai-budgets.png"><img src="images/part-ai/ai-budgets.png" width="600" alt="AI Token Budgets dashboard showing usage by provider, top users, and per-role budget configuration"></a></p>
    <p>The dashboard shows:</p>
    <ul>
    <li><strong>Usage this month</strong> — total tokens by provider and total requests</li>
    <li><strong>Top users</strong> — who's using the most AI tokens</li>
    <li><strong>Budget configuration</strong> — set maximum tokens per period for each role</li>
    </ul>
    <p>Budget enforcement modes:</p>
    <ul>
    <li><strong>Deny:</strong> Reject the request when budget is exceeded</li>
    <li><strong>Warn:</strong> Allow but log a warning</li>
    <li><strong>Unlimited:</strong> Leave blank for no limit</li>
    </ul>
    <hr />
    <h2>Step 4: AI Assist on Content Forms</h2>
    <p>With <code>trovato_ai</code> enabled, content editing forms gain <strong>AI Assist</strong> buttons next to text fields. These appear on the admin content forms at <code>/admin/content/add/{type}</code> and <code>/admin/content/{id}/edit</code>.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-ai/content-form-ai-assist.png"><img src="images/part-ai/content-form-ai-assist.png" width="600" alt="Content creation form showing AI Assist buttons next to text input fields"></a></p>
    <p>Click "AI Assist" to open a popover with five operations:</p>
    <table><thead><tr><th>Operation</th><th>What It Does</th></tr></thead><tbody>
    <tr><th><strong>Rewrite</strong></th><th>Improve clarity and flow while preserving meaning</th></tr>
    <tr><th><strong>Expand</strong></th><th>Add more detail and supporting information</th></tr>
    <tr><th><strong>Shorten</strong></th><th>Reduce to roughly half length, keeping key points</th></tr>
    <tr><th><strong>Translate</strong></th><th>Translate to a selected language (10 languages)</th></tr>
    <tr><th><strong>Adjust Tone</strong></th><th>Rewrite in a different tone (formal, casual, technical, etc.)</th></tr>
    </tbody></table>
    <p>The AI-transformed text appears as a preview. Click <strong>Accept</strong> to replace the field value or <strong>Reject</strong> to dismiss.</p>
    <p>All operations go through <code>POST /api/v1/ai/assist</code> — same provider, same budget, same rate limits.</p>
