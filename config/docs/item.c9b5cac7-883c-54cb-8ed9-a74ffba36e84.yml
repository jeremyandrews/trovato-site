    <p>To support multi-step forms and AJAX (e.g., "Add another item") without keeping state in the stateless WASM plugin, we store form state in Postgres.</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">TABLE</span> <span class="tok-entity tok-name tok-function tok-sql">form_state_cache</span></span> (
        form_build_id <span class="tok-storage tok-type tok-sql">VARCHAR</span>(<span class="tok-constant tok-numeric tok-sql">64</span>) <span class="tok-storage tok-modifier tok-sql">PRIMARY KEY</span>,
        state JSONB <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>,
        updated <span class="tok-storage tok-type tok-sql">BIGINT</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>
    );
    </span></code></pre></figure><h3>Form Processing Pipeline</h3>
    <blockquote>
    <p><strong>Note:</strong> The form processing pipeline passes forms as full JSON to plugins (<code>tap_form_alter</code>, <code>tap_form_validate</code>, <code>tap_form_submit</code>). This is an intentional use of <strong>Mode 2 (Full Serialization)</strong> — form structures are complex nested objects that plugins routinely need to restructure (add fields, reorder elements, inject validation). Handle-based access is not practical for form alter taps. This is acceptable because form builds are infrequent compared to item views.</p>
