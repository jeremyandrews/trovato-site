    <p>Plugins can implement <code>tap_preprocess_item</code>. This tap receives the context variables (title, content, etc.) and returns a JSON object of additional template variables. It cannot mutate the HTML directly, only the variables passed to the template.</p>
    <h3>Render Elements for Small Fragments</h3>
    <p>For small reusable output fragments (pagers, tables, status messages), we use Tera macros and a render element system. Each type has a default Tera macro. Themes override by providing their own macro with the same name.</p>
