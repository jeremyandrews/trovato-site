          page.html
          macros/
            elements.html
    </code></pre></figure><h3>What This Doesn't Cover</h3>
    <p>Deliberately simpler than Drupal 6's theme layer. Omitted: render arrays with <code>#weight</code> ordering (elements are sorted by <code>#weight</code> in the Render Tree, but the ordering algorithm is not specified), theme registry caching (Tera compiles at load time), theme inheritance chains (use Tera's <code>extends</code> directly), CSS/JS aggregation.</p>
    <hr />
    <h2>10. The Form API</h2>
    <p>In Drupal 6, you never write raw HTML forms. You define a form as a nested array, and the Form API handles rendering, validation, submission, CSRF protection, and multi-step state.</p>
