    </span></code></pre></figure><h3>The Render Pipeline</h3>
    <ol>
    <li><strong>Build:</strong> <code>tap_item_view</code> returns the JSON Render Element structure.</li>
    <li><strong>Alter:</strong> <code>tap_item_view_alter</code> allows other plugins to modify the JSON (e.g., add a class, remove a field, inject new elements). Plugins return additions/modifications, not a replacement of the entire tree — this prevents clobber bugs where one plugin overwrites another's changes.</li>
    <li><strong>Sanitize:</strong> The Kernel checks <code>#format</code>. If present (e.g., <code>filtered_html</code>), it runs the text through the security pipeline. The <code>TextFormat</code> system supports configurable filter chains: strip <code>&lt;script&gt;</code> tags, whitelist allowed HTML elements, convert URLs to links, etc. Text without a <code>#format</code> key is treated as plain text and HTML-escaped.</li>
    <li><strong>Render:</strong> The Kernel maps <code>#type</code> to a Tera template (e.g., <code>container</code> → <code>container.html</code>, <code>markup</code> → inline rendering) and produces final HTML.</li>
    </ol>
    <h3>Template Resolution</h3>
    <p>We use Tera (a Jinja2-style Rust template engine) with a layered resolution strategy:</p>
