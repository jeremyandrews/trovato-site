    </span></code></pre></figure><h3>Language-Aware Menus</h3>
    <p>When the active language is not the default, every config menu is rewritten
    before it reaches the template. A link whose target has a translation in that
    language gets:</p>
    <ul>
    <li>its path prefixed with <code>/{lang}</code>, so the click stays in the language; and</li>
    <li>its title replaced by the translated item's title <strong>when the link's title is the
    target's default-language title</strong> — the common case of a menu label mirroring a
    page title. A label somebody wrote by hand is theirs, and is left alone.</li>
    </ul>
    <p>A link whose target has no translation is untouched, address and label both. A
    translated label on an untranslated page is a promise the click breaks, and a
    prefixed address for a page that does not exist in that language is a 404 offered
    as navigation.</p>
    <h3>The Menu Cache (B62)</h3>
    <p>Menus render on every page, so they are cached. On a miss, one query reads every
    <code>menu_link</code> row of the stage, one resolves every link path's alias source, and
    for a non-default language one more reads the translated and default titles. The
    result is held in a <code>moka</code> cache with a five-minute TTL, keyed by stage and
    language. A warm render runs no <code>menu_link</code>, <code>url_alias</code> or <code>item_translation</code>
    query; the per-viewer filter and the active flag are computed in memory.</p>
    <p>Every in-process write that changes the answer clears it: menu link create,
    update and delete (the model functions, so the admin screens and anything else
    that calls them), URL alias create, update and delete, config storage saves and
    deletes of menu links, aliases, items and item translations, item translation
    save and delete, item update and delete (a label mirrors its target's title),
    and stage publish. <code>trovato config import</code> runs as its own process, so a running
    server sees an import when the TTL runs out.</p>
    <h3>What This Doesn't Cover</h3>
    <p>Deliberately simpler than Drupal 6's theme layer. Omitted: render arrays with <code>#weight</code> ordering (elements are sorted by <code>#weight</code> in the Render Tree, but the ordering algorithm is not specified), theme registry caching (Tera compiles at load time), theme inheritance chains (use Tera's <code>extends</code> directly), CSS/JS aggregation.</p>
    <hr />
    <h2>10. The Form API</h2>
    <p>In Drupal 6, you never write raw HTML forms. You define a form as a nested array, and the Form API handles rendering, validation, submission, CSRF protection, and multi-step state.</p>
