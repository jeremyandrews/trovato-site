    <h1>Trovato Design: Render Tree &amp; Forms</h1>
    <p><em>Sections 5, 10 of the v2.1 Design Document</em></p>
    <hr />
    <h2>5. The Render Tree (Theming Layer)</h2>
    <h3>Why No Opaque Strings</h3>
    <p>Drupal 6 had a long history of XSS vulnerabilities because plugins could return arbitrary HTML. Storing <code>field_body</code> with a <code>"format"</code> key but never filtering it means every item body is a stored XSS vector.</p>
    <p>The solution: plugins <strong>must</strong> return Render Elements (JSON), not HTML strings. The Kernel assembles these into a tree, runs <code>alter</code> taps, sanitizes based on text format, and then renders to HTML.</p>
