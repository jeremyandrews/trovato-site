    <ol>
    <li>User clicks "Add Item".</li>
    <li>JS sends POST to <code>/system/ajax</code>.</li>
    <li>Kernel loads form state from DB using <code>form_build_id</code>.</li>
    <li>Kernel invokes <code>tap_form_alter</code> (WASM) to modify the form structure.</li>
    <li>Kernel renders only the changed element via the Render Tree.</li>
    <li>Returns HTML fragment to client.</li>
    </ol>
