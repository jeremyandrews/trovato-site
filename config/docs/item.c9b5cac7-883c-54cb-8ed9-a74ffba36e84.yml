          page.html
          macros/
            elements.html
    </code></pre></figure><h3>Language in the Render Context</h3>
    <p>The kernel resolves a language per request and hands the render context enough to
    keep a reader inside it. Six variables, and one rule about who owns two of them.</p>
    <table><thead><tr><th>Variable</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>active_language</code></th><th>The language this response was negotiated in.</th></tr>
    <tr><th><code>text_direction</code></th><th><code>ltr</code> or <code>rtl</code>, for the same language.</th></tr>
    <tr><th><code>default_language</code></th><th>The site's default language code.</th></tr>
    <tr><th><code>available_languages</code></th><th>Every language the site is configured for.</th></tr>
    <tr><th><code>available_translations</code></th><th>On an item page or the front page: <code>{language, path}</code> for every language this page exists in, default included. What a language switcher is built from.</th></tr>
    <tr><th><code>hreflang_links</code></th><th>The same facts as <code>&lt;link rel="alternate"&gt;</code> data. Absent when the page exists in only one language.</th></tr>
    </tbody></table>
    <p><code>active_language</code> and <code>text_direction</code> belong to the <strong>route</strong>, which is the only
    thing that knows the language the response was actually negotiated in.
    <code>inject_site_context</code> supplies the site default only when the context does not
    already carry one. Inserting them unconditionally used to mean the order of two
    lines decided whether a translated page announced itself correctly.</p>
    <p><strong>A route sets them before calling <code>inject_site_context</code>.</strong> The fallback rule
    makes the <em>value</em> order-independent, which is not the same as making the <em>call</em>
    order-independent: the helper reads the language back out of the context and
    builds the localized menus from it. A language inserted afterwards still reaches
    <code>&lt;html lang&gt;</code> and reaches nothing derived from it, which is a page announcing one
    language over navigation built for another.</p>
    <p><code>available_translations</code> gives the default language's canonical alias verbatim and
    every other language that same address behind a <code>/{lang}</code> prefix, which is how the
    prefix negotiator reads it back. Only languages the page actually exists in are
    listed: an <code>hreflang</code> naming an address that 404s is worse than no tag at all,
    because a crawler acts on it.</p>
    <p>On the front page the addresses are the front page's own, <code>/</code> and <code>/{lang}/</code>, not
    the configured item's alias. The reader asked for the front page; a switcher that
    lands them on <code>/it/whatever-the-item-is-called</code> has moved them somewhere else.</p>
    <h3>Paths in the Render Context</h3>
    <p>Two paths, and they are not the same path.</p>
    <ul>
    <li><code>current_path</code> is what the request was rewritten <em>to</em>. On an item reached
    through an alias it is <code>/item/{uuid}</code>. Routes need it; it is the address the
    handler is serving.</li>
    <li><code>requested_path</code> is the address as asked for, before a language prefix was
    stripped and before an alias was resolved. <code>/it/why</code> stays <code>/it/why</code>.</li>
    </ul>
    <p>Match a menu link against <code>requested_path</code>. A menu links to <code>/why</code>, and by the
    time the page renders <code>current_path</code> is <code>/item/{uuid}</code>, so the two can never be
    equal and the active trail is dead on every aliased page. <code>requested_path</code> falls
    back to <code>current_path</code> where a route does not know better, so a template can read
    it unconditionally.</p>
    <h3>The Viewer in the Render Context</h3>
    <p>Every page template and every item template gets <code>viewer</code>, built by one function
    (<code>theme::Viewer::of</code>) from the request's <code>UserContext</code>:</p>
    <table><thead><tr><th>Key</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>viewer.id</code></th><th>The user's id as a string; <code>null</code> for an anonymous visitor.</th></tr>
    <tr><th><code>viewer.authenticated</code></th><th>Whether the viewer is signed in.</th></tr>
    <tr><th><code>viewer.roles</code></th><th>The names of the viewer's roles, sorted: <code>anonymous user</code> for a visitor; every assigned role plus <code>authenticated user</code> for a member.</th></tr>
    </tbody></table>
    <figure class="code"><figcaption class="code__lang">jinja</figcaption><pre class="code__body" tabindex="0" aria-label="jinja code"><code class="language-jinja">{% if viewer.authenticated %}
      &lt;a href=&quot;/user/{{ viewer.id }}/subscriptions&quot;&gt;My subscriptions&lt;/a&gt;
    {% endif %}
    </code></pre></figure><p>It is the only viewer data a template gets through <code>viewer</code>, on purpose. No email,
    no display name, no permission list, no session or token: what a template never
    receives it cannot print, and a theme is not where access is decided. A per-viewer
    control drawn from <code>viewer.roles</code> is a convenience; the page it leads to still
    checks for itself. The role names come from the permission service's cache,
    loaded with the permissions, so <code>viewer</code> costs no query on a warm cache. The item
    route builds it from the viewer it already loaded, so one request loads its
    viewer once.</p>
    <p><code>user_authenticated</code>, <code>user_can_access_admin</code> and <code>csrf_token</code> are still there,
    unchanged, beside one more page template key:</p>
    <table><thead><tr><th>Key</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>user_authenticated</code></th><th>Whether the viewer is signed in.</th></tr>
    <tr><th><code>user_name</code></th><th>The signed-in viewer's account name (<code>users.name</code>, the name <code>/user/profile</code> shows). Set only when the viewer is signed in; an anonymous visitor's context has no <code>user_name</code> key at all, so test it with <code>is defined</code>.</th></tr>
    <tr><th><code>user_can_access_admin</code></th><th>Whether the viewer may open <code>/admin</code>.</th></tr>
    <tr><th><code>csrf_token</code></th><th>The session's form token, for the logout form; signed-in only.</th></tr>
    </tbody></table>
    <figure class="code"><figcaption class="code__lang">jinja</figcaption><pre class="code__body" tabindex="0" aria-label="jinja code"><code class="language-jinja">{% if user_name is defined %}Logged in as {{ user_name }}{% endif %}
    </code></pre></figure><p><code>user_name</code> is a key of its own and stays one: it is not a field of <code>viewer</code>. It
    comes from the user record the viewer was built from, so it costs no query, and it
    is the account name and nothing else; no other account field reaches a template
    this way. It is user input, so print it with autoescape on, never with <code>| safe</code>.
    It is set wherever <code>user_authenticated</code> is, which is every page template rendered
    through <code>inject_site_context</code>; an item template gets neither.</p>
    <h3>The Author on the Item Template, and on a Gather Row</h3>
    <p>An item template gets <code>author</code>, resolved through <code>UserService::author_views</code>,
    which reads the same user cache <code>/api/item</code>'s <code>include=author</code> uses, so a theme
    prints who wrote the page without hardcoding a name or printing
    <code>item.author_id</code>. The shipped <code>elements/item.html</code> and <code>elements/item--blog.html</code>
    print it:</p>
    <table><thead><tr><th>Key</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>author.name</code></th><th>The author's display name (<code>users.name</code>). A deleted account's content is reattributed to the kernel's anonymous sentinel account, which has its own row and its own name; an id matching no user row at all gets the kernel's anonymous display name. Never empty.</th></tr>
    <tr><th><code>author.url</code></th><th><code>/user/{id}</code>, present only when this viewer holds <code>access user profiles</code>. Absent — not an empty string — otherwise, and always absent for the anonymous sentinel: there is no profile to send a visitor to.</th></tr>
    </tbody></table>
    <figure class="code"><figcaption class="code__lang">jinja</figcaption><pre class="code__body" tabindex="0" aria-label="jinja code"><code class="language-jinja">{% if author %}
      &lt;span class=&quot;item__author&quot;&gt;by
        {% if author.url %}&lt;a href=&quot;{{ author.url }}&quot;&gt;{{ author.name }}&lt;/a&gt;
        {% else %}{{ author.name }}{% endif %}
      &lt;/span&gt;
    {% endif %}
    </code></pre></figure><p>A gather row carries the same shape under <code>row.author</code>. Authors the user cache
    holds cost no query; the rest of the page's authors load in one query together
    (never one per row), the way <code>resolve_row_urls</code> already resolves <code>row.url</code>. See
    <code>gather/row.html</code> and <code>gather/query--blog_listing.html</code>. A gather that defines its own include named
    <code>author</code> keeps it: the byline never replaces a key the gather already set. Only the display name and this
    access-checked URL ever reach either template: no mail address, no other
    <code>User</code> field, and no distinction between a login name and a display name (the
    kernel has one name, not two).</p>
    <h3>Plugin Output on the Item Template</h3>
    <p>An item template gets two strings of rendered HTML:</p>
    <ul>
    <li><code>children</code>: the generic field dump, followed by every plugin's <code>tap_item_view</code>
    output. Unchanged; a template that prints only <code>children</code> prints what it always
    did.</li>
    <li><code>plugin_output</code>: the plugin output alone, the same string <code>children</code> ends with.</li>
    </ul>
    <p>A theme that lays out its own fields prints <code>plugin_output</code> and not <code>children</code>,
    and keeps every plugin's contribution (a series navigation, a CFP badge, JSON-LD)
    without printing each field twice. Both are kernel-rendered and already
    sanitized, so both are printed with <code>| safe</code> and a <code>{# SAFE: ... #}</code> comment.</p>
    <p>A text field's format, stored beside it as <code>&lt;name&gt;_format</code>, is part of that field
    and is not printed as a field of its own when the type declares <code>&lt;name&gt;</code> as text.</p>
    <h3>The Comment Thread in the Render Context</h3>
    <p><code>routes::comment::render_thread</code> builds <code>elements/comments.html</code>'s context; the
    reply, edit and delete pages (<code>comment-page.html</code>) build the same shape for one
    comment through <code>comment_for_page</code>. Each comment in <code>comments</code> (and the single
    <code>comment</code> the other pages carry) is:</p>
    <table><thead><tr><th>Key</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>comment.id</code></th><th>The comment's id.</th></tr>
    <tr><th><code>comment.depth</code></th><th>Thread depth, for indentation; absent on the single-comment pages.</th></tr>
    <tr><th><code>comment.created</code></th><th>Unix timestamp.</th></tr>
    <tr><th><code>comment.author_name</code></th><th>The author's account name, or absent for one the kernel could not look up.</th></tr>
    <tr><th><code>comment.subject</code></th><th>The comment's optional plain text subject, or absent when it has none. It is user input and is never passed through a text format, so it is printed with autoescape on (<code>{{ comment.subject }}</code>), never `</th></tr>
    <tr><th><code>comment.body_html</code></th><th>The body, already rendered and sanitized by its text format. Printed with `</th></tr>
    <tr><th><code>comment.can_edit</code> / <code>comment.can_delete</code></th><th>Whether an Edit/Delete link should be shown; absent on the single-comment pages.</th></tr>
    </tbody></table>
    <figure class="code"><figcaption class="code__lang">jinja</figcaption><pre class="code__body" tabindex="0" aria-label="jinja code"><code class="language-jinja">{% if comment.subject %}&lt;h3 class=&quot;comment__subject&quot;&gt;{{ comment.subject }}&lt;/h3&gt;{% endif %}
    </code></pre></figure><h3>Menus in the Render Context</h3>
    <p>Every config menu reaches templates, by name, as a tree:</p>
    <table><thead><tr><th>Variable</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>menus_by_name</code></th><th>Menu name to the menu's links as a tree. Each link is <code>{title, path, active, children}</code>, weight ordered, filtered for the viewer, localized. Every menu the stage has is present, empty when the viewer may follow none of its links.</th></tr>
    <tr><th><code>menus_by_parent</code></th><th>Parent path to the plugin entries registered under it that this viewer may see, as trees of the same shape. <code>menus_by_parent["/user"]</code> is the account menu.</th></tr>
    <tr><th><code>menus_tree</code></th><th>The plugin root entries as a tree of the same shape.</th></tr>
    <tr><th><code>main_menu</code>, <code>footer_menu</code>, <code>main_menu_owned</code>, <code>menus</code></th><th>Unchanged: the <code>main</code> and <code>footer</code> menus flat, whether a <code>main</code> menu exists, and the plugin root entries flat.</th></tr>
    </tbody></table>
    <p><strong>One active rule.</strong> <code>active</code> is computed in Rust (<code>menu::navigation::is_active</code>):
    the requested path is the link path, or starts with the link path followed by
    <code>/</code>; <code>/</code> matches only itself. A template prints it and never recomputes it.</p>
    <p><strong>Plugin entries.</strong> One rule decides whether a plugin entry is a link for a
    viewer (<code>menu::nav_entry_for</code>): it is visible, the viewer holds its permission
    (or it has none, or the viewer is an administrator), and its path can be
    followed. A <code>{uid}</code> segment becomes the signed-in viewer's id; <code>{uid}</code> for an
    anonymous viewer, or any other <code>{...}</code> segment, leaves the entry out. Root
    entries and children go through the same rule.</p>
    <p><strong>A menu tile</strong> (<code>tile_type: menu</code>) renders <code>menus_by_name[menu_name]</code> through
    <code>elements/tile--menu.html</code>, overridable per tile as
    <code>elements/tile--menu--{machine_name}.html</code>. Tile rendering takes one
    <code>TileRenderContext</code> (the viewer, the language, the role names tile visibility
    matches, and the menus already built), so a tile never reloads what the page
    has.</p>
    <p><strong>Tile visibility</strong> (<code>Tile::is_visible</code>) combines <code>paths</code>/<code>paths_exclude</code>,
    <code>roles</code> and <code>audience</code> rules in a tile's <code>visibility</code> JSON; a tile with none of
    these, or <code>{}</code>, is visible to everyone. <code>audience</code> (<code>"anonymous"</code> or
    <code>"authenticated"</code>) is the login-tile case — shown only to a signed-out visitor,
    or only to a signed-in one — decided from the viewer's actual signed-in state,
    not from <code>user_roles</code>: every viewer, signed in or not, can carry the
    <code>anonymous user</code> role there (<code>routes::helpers::inject_site_context</code> seeds it
    unconditionally, then adds <code>authenticated user</code> and <code>administrator</code> as they
    apply), so a role rule alone cannot mean "anonymous only". The tile admin form
    exposes <code>audience</code> as a "Show to" field, merged into the tile's stored
    <code>visibility</code> so an existing <code>paths</code> or <code>roles</code> rule (set through <code>config import</code>, which the form has no control for) survives an edit.</p>
    <h3>Gather Tiles</h3>
    <p><strong>A gather tile</strong> (<code>tile_type: gather_query</code>) lists the first rows of the
    gather its config names, rendered on the server through
    <code>elements/tile--gather_query.html</code> and overridable per tile as
    <code>elements/tile--gather_query--{machine_name}.html</code>. Its config is
    <code>query_id</code> and <code>items</code>, the number of rows, from 1 to 50 and 5 when absent.
    The tile form and <code>config import</code> both refuse any other count.</p>
    <p>The gather runs once per tile, through <code>routes::gather::execute_query_only</code>,
    the same path its JSON response and feed take: authorized for the viewer,
    filtered by item access, on the viewer's stages, in the page's language, with
    <code>current_user</code> meaning the viewer. Only the page size changes: the tile asks
    for page 1 with <code>items</code> rows. It is not the full gather page. A tile has no
    pager, no exposed filters and no URL arguments; a gather that needs them is
    better linked than placed.</p>
    <p>The template gets <code>tile</code>, <code>rows</code> (each item row has <code>title</code> and <code>url</code>, its
    alias when it has one), <code>empty_text</code> and <code>more_url</code>, the gather's own page
    (its canonical URL, else its first route without arguments, else
    <code>/gather/{query_id}</code>).</p>
    <p>A tile with nothing it may show is left off the page, not drawn empty: when
    the viewer may not run the gather, silently; when the gather does not exist,
    the config is invalid or the query fails, with a warning naming the tile.</p>
    <h3>Item Template Variables</h3>
    <p>An item page (<code>/item/{id}</code>, and every alias of one) renders its <code>item--{type}</code>
    template with the item and, beside it, the things its fields point at, already
    resolved. A template never needs a route of its own to turn a stored uuid into
    a link.</p>
    <table><thead><tr><th>Variable</th><th>Shape</th><th>Filled from</th></tr></thead><tbody>
    <tr><th><code>item</code></th><th>the item: <code>id</code>, <code>title</code>, <code>type</code>, <code>fields</code>, <code>status</code>, <code>created</code>, …</th><th>the row</th></tr>
    <tr><th><code>children</code></th><th>the rendered field HTML and plugin render output</th><th>the field pipeline</th></tr>
    <tr><th><code>referenced_items</code></th><th><code>{field_name: [{id, title, type}]}</code></th><th><code>RecordReference</code> fields: the items the viewer may view</th></tr>
    <tr><th><code>referenced_files</code></th><th><code>{field_name: [{id, url, filename, mime, alt}]}</code></th><th><code>File</code> fields: the files the viewer may be served. <code>url</code> is the file's <code>/files/{path}</code> address; there is no download route by id</th></tr>
    <tr><th><code>referenced_tags</code></th><th><code>{field_name: [{id, label, slug, url, ancestors: [{id, label, slug, url}]}]}</code></th><th><code>CategoryReference</code> fields: the tags, each with its ancestors root first</th></tr>
    <tr><th><code>reverse_references</code></th><th><code>{type_name: [{id, title}]}</code></th><th>items whose <code>RecordReference</code> fields point at this one</th></tr>
    </tbody></table>
    <p>Each list keeps the field's order and leaves out a value that names nothing (a
    deleted file, a deleted tag) or that the viewer may not see. A field with
    nothing to show has no key, so <code>{% if referenced_tags.field_topics %}</code> is the
    test.</p>
    <p>A tag's <code>url</code> is the path of the gather route that lists its category: the
    route in a query's <code>display.routes</code> whose one parameter maps its path segment
    through <code>tag_category</code>, with the tag's slug in place of the segment
    (<code>/topics/{slug}</code> gives <code>/topics/rust</code>). It is null for a tag without a slug,
    or in a category no route lists. A tag of an owned vocabulary the viewer may
    not read is left out, by the rule every category read applies
    (<code>content::owned_vocabulary::visible_terms</code>). The whole map costs two queries,
    one for the tags and one recursive query for all their ancestors, however many
    tags the item holds or how deep they sit, plus the vocabulary visibility
    decision.</p>
    <p>Topic pills, each with a breadcrumb of its ancestors, and the conference's
    programme PDF:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic">{% if referenced_tags.field_topics %}
    <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">ul</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">topics</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
      {% for topic in referenced_tags.field_topics %}
      <span class="tok-meta tok-tag tok-inline tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-any tok-html">li</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">topic</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
        <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">nav</span> <span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-entity tok-other tok-attribute-name tok-class tok-html">class</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span></span></span><span class="tok-meta tok-attribute-with-value tok-class tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-meta tok-class-name tok-html">topic__trail</span><span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">aria-label</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>{{ topic.label }}<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
          {% for parent in topic.ancestors %}
            {% if parent.url %}<span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>{{ parent.url }}<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>{{ parent.label }}<span class="tok-meta tok-tag tok-inline tok-a tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-inline tok-a tok-html">a</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>{% else %}{{ parent.label }}{% endif %} <span class="tok-constant tok-character tok-entity tok-html"><span class="tok-punctuation tok-definition tok-entity tok-html">&amp;</span>rsaquo<span class="tok-punctuation tok-definition tok-entity tok-html">;</span></span>
          {% endfor %}
        <span class="tok-meta tok-tag tok-block tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-block tok-any tok-html">nav</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
