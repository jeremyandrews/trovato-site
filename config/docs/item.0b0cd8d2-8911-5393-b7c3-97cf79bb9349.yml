    <h2>Linting</h2>
    <h3>Configuration</h3>
    <p>Workspace-level lint configuration lives in the root <code>Cargo.toml</code>:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[workspace.lints.clippy]
    all = &quot;warn&quot;
    manual_let_else = &quot;warn&quot;
    uninlined_format_args = &quot;warn&quot;
    semicolon_if_nothing_returned = &quot;warn&quot;
    </code></pre></figure><p>Each member crate inherits these via <code>[lints] workspace = true</code>.</p>
    <p>The <code>clippy.toml</code> file raises thresholds for complex kernel functions:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">too-many-arguments-threshold = 8
    type-complexity-threshold = 300
    </code></pre></figure><h3><code>#[allow]</code> Annotation Rules</h3>
    <ul>
    <li>Every <code>#[allow(clippy::...)]</code> annotation <strong>must</strong> have an explanatory comment on the preceding line.</li>
    <li>Crate-level <code>#![allow(...)]</code> attributes are reserved for legitimate cases where large sections of code trigger the warning by design (e.g., <code>dead_code</code> in lib.rs for items exposed to tests/plugins).</li>
    <li>Do not blanket-allow warnings. Prefer fixing the code.</li>
    </ul>
    <p><strong>Good:</strong></p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> False positive: the match arm binds to prevent accidental fallthrough.
    </span><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">allow</span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span></span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust">clippy::match_single_binding</span></span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">process</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">input</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-keyword tok-operator tok-rust">...</span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p><strong>Bad:</strong></p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">allow</span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span></span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust">clippy::all</span></span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>  <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Never do this
    </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">messy_function</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-keyword tok-operator tok-rust">...</span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Running Clippy</h3>
    <figure class="code"><figcaption class="code__lang">sh</figcaption><pre class="code__body" tabindex="0" aria-label="sh code"><code class="language-sh"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> clippy<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>workspace</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>all-targets                <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Development (warnings)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> clippy<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>workspace</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>all-targets</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> -D warnings <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> CI (deny all warnings)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span></code></pre></figure><hr />
    <h2>Naming Conventions</h2>
    <h3>Trovato Terminology</h3>
    <p>Trovato has its own domain language. Use these terms consistently in code, comments, documentation, UI strings, and URLs:</p>
    <table><thead><tr><th>Trovato Term</th><th>Do NOT Use</th><th>Notes</th></tr></thead><tbody>
    <tr><th><strong>category</strong></th><th>taxonomy, vocabulary</th><th>Hierarchical classification system</th></tr>
    <tr><th><strong>item</strong></th><th>node, entity</th><th>Core content record</th></tr>
    <tr><th><strong>tap</strong></th><th>hook</th><th>Plugin extension point</th></tr>
    <tr><th><strong>plugin</strong></th><th>module</th><th>WASM extension package</th></tr>
    <tr><th><strong>gather</strong></th><th>views, view</th><th>Saved query / listing configuration</th></tr>
    <tr><th><strong>tile</strong></th><th>block</th><th>Renderable UI region component</th></tr>
    </tbody></table>
    <h3>Rust Naming</h3>
    <p>Follow standard Rust conventions:</p>
    <ul>
    <li>Types: <code>PascalCase</code> (<code>ItemService</code>, <code>CategoryTree</code>)</li>
    <li>Functions/methods: <code>snake_case</code> (<code>render_error</code>, <code>require_admin</code>)</li>
    <li>Constants: <code>SCREAMING_SNAKE_CASE</code> (<code>SESSION_USER_ID</code>, <code>MAX_UPLOAD_SIZE</code>)</li>
    <li>Machine names (stored in DB): lowercase with underscores (<code>trovato_blog</code>, <code>trovato_audit_log</code>)</li>
    <li>URL paths: lowercase with hyphens (<code>/admin/content/items</code>, <code>/admin/structure/categories</code>)</li>
    </ul>
    <hr />
    <h2>Plugin Conventions</h2>
    <h3>Directory Layout</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>plugins/
      my_plugin/
        Cargo.toml              # crate-type = [&quot;cdylib&quot;], [lints] workspace = true
        my_plugin.info.toml     # Required metadata and tap declarations
        src/
          lib.rs                # All tap implementations + tests
        migrations/             # Optional SQL migration files
          001_create_table.sql
    </code></pre></figure><h3><code>.info.toml</code> Format</h3>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;my_plugin&quot;
    description = &quot;Short description of the plugin&quot;
    version = &quot;1.0.0&quot;
    dependencies = []           # Other plugin names this depends on

    [taps]
    implements = [
        &quot;tap_item_info&quot;,
        &quot;tap_menu&quot;,
        &quot;tap_perm&quot;,
    ]
    weight = 0                  # Execution order; lower = earlier

    [migrations]
    files = [
        &quot;migrations/001_create_table.sql&quot;,
    ]
    </code></pre></figure><h3>Tap Functions</h3>
    <p>Use the proc macro attributes from the SDK:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">prelude<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-keyword tok-operator tok-rust">*</span><span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>                   <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> For infallible taps
    </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_item_info</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>ItemTypeInfo<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-keyword tok-operator tok-rust">...</span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>

    <span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap_result</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>            <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> For taps that can fail
    </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_item_presave</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">item</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-modifier tok-rust">mut</span> Item</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Result<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span>, String<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-keyword tok-operator tok-rust">...</span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Build Targets</h3>
    <p>Plugins compile to WASM:</p>
    <figure class="code"><figcaption class="code__lang">sh</figcaption><pre class="code__body" tabindex="0" aria-label="sh code"><code class="language-sh"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> my_plugin</span>
    </span></code></pre></figure><h3>Testing with <code>__inner_*</code></h3>
    <p>The <code>#[plugin_tap]</code> macro generates a private <code>__inner_&lt;tap_name&gt;</code> function that can be tested without WASM export overhead:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">cfg</span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span></span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust">test</span></span><span class="tok-meta tok-annotation tok-parameters tok-rust"><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-module tok-rust"><span class="tok-storage tok-type tok-module tok-rust">mod</span> <span class="tok-entity tok-name tok-module tok-rust">tests</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust"><span class="tok-keyword tok-other tok-rust">super</span><span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-keyword tok-operator tok-rust">*</span><span class="tok-punctuation tok-terminator tok-rust">;</span>

        <span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">test</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
