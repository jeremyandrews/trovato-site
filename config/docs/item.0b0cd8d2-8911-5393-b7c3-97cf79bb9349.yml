    <h1>Trovato Coding Standards</h1>
    <h2>Quick Start</h2>
    <p>New to the codebase? Follow these five rules and you'll be fine:</p>
    <ol>
    <li><strong>Run the toolchain before committing:</strong> <code>cargo fmt --all &amp;&amp; cargo clippy --workspace --all-targets -- -D warnings &amp;&amp; cargo test --all</code></li>
    <li><strong>Use Trovato terminology:</strong> "category" not "taxonomy", "item" not "node", "tap" not "hook", "plugin" not "module", "gather" not "views", "tile" not "block"</li>
    <li><strong>Never <code>.unwrap()</code> in production code.</strong> Use <code>.expect("reason")</code> or propagate errors with <code>?</code>.</li>
    <li><strong>Reuse shared helpers.</strong> Check <code>crate::routes::helpers</code> before writing HTML escaping, CSRF verification, error rendering, or login checks.</li>
    <li><strong>New admin routes go in <code>admin_*.rs</code> domain modules</strong>, not <code>admin.rs</code>.</li>
    </ol>
    <hr />
    <h2>Formatting</h2>
    <h3>Configuration</h3>
    <p>The workspace uses <code>.rustfmt.toml</code> at the repository root:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">edition = &quot;2024&quot;
    use_field_init_shorthand = true   # Foo { x: x } → Foo { x }
    use_try_shorthand = true          # try!(expr) → expr?
    </code></pre></figure><p>Import grouping (<code>group_imports = "StdExternalCrate"</code>) and merging (<code>imports_granularity = "Crate"</code>) are configured but commented out — they require nightly rustfmt. When CI adopts nightly for formatting, these will be enabled.</p>
    <h3>Import Ordering Convention</h3>
    <p>Until automatic enforcement is available, follow this convention manually:</p>
