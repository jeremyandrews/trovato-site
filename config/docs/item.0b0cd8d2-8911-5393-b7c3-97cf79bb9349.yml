    <h2>Error Handling</h2>
    <h3>Response Helpers</h3>
    <p>Three functions in <code>crate::routes::helpers</code> cover all error responses:</p>
    <table><thead><tr><th>Function</th><th>Status</th><th>When to Use</th></tr></thead><tbody>
    <tr><th><code>render_error(msg)</code></th><th>400</th><th>Client validation failures, CSRF errors, bad input</th></tr>
    <tr><th><code>render_server_error(msg)</code></th><th>500</th><th>Database failures, service errors, unexpected panics</th></tr>
    <tr><th><code>render_not_found()</code></th><th>404</th><th>Missing resources, unknown routes</th></tr>
    </tbody></table>
    <p>All escape HTML internally to prevent XSS. Never build error HTML manually.</p>
    <h3>CSRF Verification</h3>
    <p>Always use the shared helper:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-keyword tok-other tok-rust">crate</span><span class="tok-meta tok-path tok-rust"><span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">routes<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">helpers<span class="tok-punctuation tok-accessor tok-rust">::</span></span>require_csrf<span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-keyword tok-control tok-rust">if</span> <span class="tok-storage tok-type tok-rust">let</span> <span class="tok-support tok-type tok-rust">Err</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>resp</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-support tok-function tok-rust">require_csrf</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-keyword tok-operator tok-rust">&amp;</span>session<span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>form.token</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.await <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-keyword tok-control tok-rust">return</span> resp<span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span></code></pre></figure><p>Never inline CSRF verification logic.</p>
    <h3><code>.unwrap()</code> Policy</h3>
    <ul>
    <li><strong>Production code:</strong> Forbidden. Use <code>.expect("descriptive reason")</code> or propagate with <code>?</code>.</li>
    <li><strong>Tests:</strong> <code>.unwrap()</code> is acceptable — test failures already produce stack traces.</li>
    <li><strong>Static guarantees:</strong> <code>.unwrap()</code> is acceptable when the value is provably <code>Some</code>/<code>Ok</code> (e.g., a regex literal). Add a comment explaining why.</li>
    </ul>
    <h3><code>.expect()</code> Policy</h3>
    <ul>
    <li>Permitted when the invariant is statically guaranteed (e.g., HKDF output size, built-in theme lookup, HashMap key inserted earlier).</li>
    <li>Must include a <code># Panics</code> doc section on the enclosing function (not struct/type).</li>
    <li>Prefer error propagation with <code>?</code> when the caller can handle the error.</li>
    </ul>
    <h3><code>let _ =</code> Policy</h3>
    <ul>
    <li>Acceptable for fire-and-forget operations where the caller cannot meaningfully handle the error.</li>
    <li><strong>Security operations</strong> (lockout recording, audit logging, token invalidation): log on failure with <code>tracing::warn!</code>.</li>
    <li>Use <code>if let Err(e) = ... { tracing::warn!(...) }</code> instead of <code>let _ =</code> for security-relevant calls.</li>
    </ul>
    <h3><code>write!</code> to <code>String</code></h3>
    <ul>
    <li><code>write!(string, ...).unwrap()</code> is safe — the <code>fmt::Write</code> impl for <code>String</code> is infallible.</li>
    <li>Add an inline <code>// Infallible: write!() to String is infallible</code> comment.</li>
    <li>Does <strong>not</strong> require a <code># Panics</code> doc section — the infallibility is a universal language guarantee, not a design-specific invariant. Use <code># Panics</code> only for <code>.expect()</code> calls where the invariant depends on surrounding code or domain logic.</li>
    <li>Reserve <code>// SAFETY:</code> comments exclusively for <code>unsafe</code> blocks.</li>
    </ul>
    <h3>WASM Host Function Error Codes</h3>
    <p>All WASM host functions follow a standard error code convention documented in
    <code>crates/plugin-sdk/src/host_errors.rs</code>. New host functions must use the constants
    (<code>ERR_MEMORY_MISSING</code>, <code>ERR_PARAM1_READ</code>, etc.) instead of raw integer literals.</p>
    <hr />
    <h2>Documentation</h2>
    <h3>Module-Level (<code>//!</code>)</h3>
    <p>Every <code>.rs</code> file should have a module-level doc comment explaining its purpose:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//!</span> Item model and CRUD operations.
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//!</span>
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//!</span> Items are the core content records in Trovato.
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//!</span> They support JSONB field storage and revision history.
    </span></span></code></pre></figure><h3>Public Items (<code>///</code>)</h3>
    <p>All public functions, structs, enums, and traits must have doc comments. Focus on <strong>why</strong> not <strong>what</strong> — the signature already tells readers what the function takes and returns.</p>
    <p><strong>Good:</strong></p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> Require an authenticated admin user, or redirect/reject.
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span>
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> Returns the admin [`User`] on success. Redirects to `/user/login` if the
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> session has no valid user id. Returns 403 if the user exists but is not
    </span><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> an admin.
    </span><span class="tok-storage tok-modifier tok-rust">pub</span> async <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">require_admin</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">state</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>AppState, <span class="tok-variable tok-parameter tok-rust">session</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>Session</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Result<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>User, Response<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
    </span></span></span></code></pre></figure><p><strong>Bad:</strong></p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> This function takes an AppState and Session and returns a Result.
    </span><span class="tok-storage tok-modifier tok-rust">pub</span> async <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">require_admin</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">state</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>AppState, <span class="tok-variable tok-parameter tok-rust">session</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>Session</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Result<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>User, Response<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
    </span></span></span></code></pre></figure><h3>Struct Fields</h3>
    <p>Document non-obvious fields:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-struct tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-struct tok-rust">struct</span> </span><span class="tok-meta tok-struct tok-rust"><span class="tok-entity tok-name tok-struct tok-rust">Item</span> </span><span class="tok-meta tok-struct tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> Unique identifier (UUIDv7).
    </span>    <span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-variable tok-other tok-member tok-rust">id</span><span class="tok-punctuation tok-separator tok-rust">:</span> Uuid,
        <span class="tok-comment tok-line tok-documentation tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">///</span> Publication status (0 = unpublished, 1 = published).
    </span>    <span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-variable tok-other tok-member tok-rust">status</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-storage tok-type tok-rust">i16</span>,
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><hr />
    <h2>Code Organization</h2>
    <h3>Admin Routes</h3>
    <p>Admin route handlers live in domain-specific files:</p>
    <table><thead><tr><th>File</th><th>Responsibility</th></tr></thead><tbody>
    <tr><th><code>admin.rs</code></th><th>Dashboard, stage management, file ops, comment moderation</th></tr>
    <tr><th><code>admin_content.rs</code></th><th>Item CRUD, revision management</th></tr>
    <tr><th><code>admin_content_type.rs</code></th><th>Content type add/edit/delete</th></tr>
    <tr><th><code>admin_taxonomy.rs</code></th><th>Category and tag management</th></tr>
    <tr><th><code>admin_alias.rs</code></th><th>URL alias management</th></tr>
    <tr><th><code>admin_user.rs</code></th><th>User administration</th></tr>
    <tr><th><code>gather_admin.rs</code></th><th>Gather query management</th></tr>
    <tr><th><code>tile_admin.rs</code></th><th>Tile layout management</th></tr>
    <tr><th><code>plugin_admin.rs</code></th><th>Plugin enable/disable</th></tr>
    </tbody></table>
    <p>New admin functionality goes in the appropriate <code>admin_*.rs</code> file, or a new one if no existing file fits. Never add route handlers to <code>admin.rs</code> unless they are core dashboard functionality.</p>
    <h3>Templates</h3>
    <p>Admin templates use shared macros from <code>templates/admin/macros/</code> for consistency. Use these macros for admin list pages, forms, and common UI patterns rather than duplicating HTML.</p>
    <h3>Shared Helpers</h3>
    <p>Common utilities live in <code>crate::routes::helpers</code>:</p>
    <ul>
    <li><code>html_escape()</code> — HTML entity escaping (never create local copies)</li>
    <li><code>require_login()</code> / <code>require_admin()</code> — authentication gates</li>
    <li><code>require_csrf()</code> — CSRF token verification</li>
    <li><code>render_error()</code> / <code>render_server_error()</code> / <code>render_not_found()</code> — error responses</li>
    <li><code>is_valid_machine_name()</code> — machine name validation</li>
    <li><code>render_admin_template()</code> — render an admin page with standard layout and context</li>
    <li><code>inject_site_context()</code> — common Tera template context</li>
    <li><code>CsrfOnlyForm</code> — generic form struct for action-only POST endpoints</li>
    </ul>
    <p>Session constants live in <code>crate::routes::auth</code>:</p>
    <ul>
    <li><code>SESSION_USER_ID</code> — session key for the authenticated user ID</li>
    </ul>
    <hr />
    <h2>Kernel Minimality</h2>
    <p>New code in the kernel must justify its placement. See <code>docs/kernel-minimality-audit.md</code> for the full audit.</p>
    <p><strong>Decision framework:</strong></p>
    <ol>
    <li><strong>Is this infrastructure or a feature?</strong> Infrastructure enables plugins. Features implement user-facing behavior.</li>
    <li><strong>Who calls this code?</strong> If only gated routes or plugin-specific cron tasks, it's a feature → plugin.</li>
    <li><strong>What breaks if it's disabled?</strong> If only that feature stops working → plugin. If other kernel subsystems break → kernel.</li>
    </ol>
    <p><strong>Patterns for plugin-optional kernel services:</strong></p>
    <ul>
    <li><code>Option&lt;Arc&lt;ServiceType&gt;&gt;</code> in <code>AppState</code> for conditional service instantiation</li>
    <li><code>plugin_gate!</code> macro + <code>GATED_ROUTE_PLUGINS</code> for conditional route gating</li>
    <li><code>set_plugin_services()</code> injection pattern for cron tasks</li>
    <li><code>if let Some(ref service) = self.service</code> guard in cron task implementations</li>
    </ul>
    <hr />
    <h2>Manual Review Checklist</h2>
    <p>Things CI can't catch — reviewers should verify:</p>
    <ol>
    <li><strong>Terminology compliance</strong> — no Drupal-isms in new code, comments, or UI strings</li>
    <li><strong>Helper reuse</strong> — shared helpers used instead of inline reimplementations</li>
    <li><strong>Error response correctness</strong> — 400 vs 500 vs 404 used appropriately</li>
    <li><strong>Admin route placement</strong> — handlers in the right <code>admin_*.rs</code> file</li>
    <li><strong>Template macro usage</strong> — admin UI uses shared macros, not bespoke HTML</li>
    <li><strong><code>.unwrap()</code> justification</strong> — any <code>.unwrap()</code> in non-test code has a clear reason</li>
    <li><strong>Documentation quality</strong> — public API docs explain "why", not just "what"</li>
    <li><strong>Security</strong> — user input escaped, CSRF verified on all state-changing POST routes, no SQL concatenation</li>
    <li><strong>Plugin testing</strong> — <code>__inner_*</code> functions tested, not just WASM exports</li>
    <li><strong>Machine names</strong> — lowercase with underscores, validated with <code>is_valid_machine_name()</code></li>
    <li><strong>Kernel minimality</strong> — new kernel services justified; feature services go in plugins</li>
    </ol>
