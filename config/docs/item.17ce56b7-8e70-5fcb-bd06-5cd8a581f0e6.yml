    <h2>Dead-letter queue (DLQ) observability</h2>
    <p>Dead-lettered jobs are inspectable and recoverable two ways.</p>
    <p><strong>Admin API (admin session + <code>X-CSRF-Token</code> header on mutations):</strong></p>
    <ul>
    <li><code>GET  /admin/queue/dlq</code> — list dead jobs with reason, attempts, and last error.</li>
    <li><code>POST /admin/queue/dlq/{id}/requeue</code> — reset a dead job to <code>ready</code> (attempts
    cleared) for another run.</li>
    <li><code>POST /admin/queue/dlq/{id}/delete</code> — discard a dead job.</li>
    </ul>
