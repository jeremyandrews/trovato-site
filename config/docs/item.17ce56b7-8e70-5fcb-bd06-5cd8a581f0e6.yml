    <p><strong>Concurrency (D-47).</strong> <code>concurrency</code> is now honored — for the first time; in v1
    it was only a codegen docstring and was never parsed. The kernel drains up to
    that many jobs <strong>in parallel</strong> per plugin, <strong>clamped to a kernel cap of 4</strong>. A
    plugin that declares nothing (or exports no <code>tap_queue_info</code>) drains at
    concurrency 1.</p>
    <h2>Delivery guarantee: at-least-once — workers MUST be idempotent</h2>
    <blockquote>
    <p><strong>The queue delivers each job <em>at least once</em>.</strong> A job whose worker is
    mid-flight when its claimer crashes keeps its incremented attempt count and is
    retried once its claim lease expires. <strong>Write idempotent workers.</strong></p>
    </blockquote>
    <p>This is exactly the duplicate-row class the reference importer hit and had to
    defend against — see <code>ritrovo_importer/migrations/002_dedup_conferences.sql</code>,
    which deduplicates conferences by <code>field_source_id</code> precisely because a job may
    be delivered more than once. Use upserts / natural keys / dedup guards; never
    assume a job body runs exactly once.</p>
    <h3>What counts as success vs. failure</h3>
    <ul>
    <li><strong>Success</strong>: <code>tap_queue_worker</code> returns (any value). The job is deleted.
    Returning an error-shaped body such as <code>{"status":"error"}</code> is still a
    <em>successful dispatch</em> — the job is consumed, not retried. (This matches how
    the reference importer's error returns behave.)</li>
    <li><strong>Failure</strong>: the worker <strong>traps</strong> (panics, exhausts its epoch/fuel budget, or
    returns an error-length result). The kernel records a failed attempt.</li>
    </ul>
    <p>To make a job retry, fail loudly (trap); to consume it, return.</p>
    <h2>Retry, backoff, and dead-lettering</h2>
    <p>On a failed attempt the job is rescheduled with <strong>exponential backoff</strong>
    (<code>60s * 2^(attempts-1)</code>, capped at 1 hour). Once <code>attempts</code> reaches
    <code>max_attempts</code> (default 5) the job is moved to the <strong>dead-letter</strong> tier
    (<code>status = 'dead'</code>) with its last error preserved. Consequences:</p>
    <ul>
    <li><strong>Nothing retries forever.</strong> A permanently failing ("poison") job dead-letters
    instead of blocking its queue — the head-of-line stall of v1 is gone.</li>
    <li><strong>Fairness.</strong> At most 100 jobs per plugin are processed per drain cycle, so one
    plugin flooding its queue cannot starve another.</li>
    </ul>
    <h2>Cadence: when does the queue drain?</h2>
    <p>Two execution modes (the ratified hybrid, D-46). The default is unchanged from
    v1.</p>
    <ul>
    <li><p><strong>External cron (default).</strong> The queue is drained inside the cron request when
    something hits <code>POST /cron/{key}</code>. <strong>The latency floor is whatever your
    external trigger's cadence is</strong> (e.g. a systemd timer or crond hitting the
    endpoint every minute). No in-process scheduler runs. This is the default and
    the minimal deployment's contract.</p>
    </li>
    <li><p><strong>Resident queue-runner (opt-in).</strong> For sub-cron latency, enable a
    kernel-owned background task that drains on its own cadence. When enabled, the
    cron-request drain <strong>steps aside</strong> (no double-draining); the runner owns
    draining. Claims use <code>FOR UPDATE SKIP LOCKED</code>, so even overlapping drainers
    never double-deliver beyond the at-least-once contract.</p>
    </li>
    </ul>
    <h3>Enabling the resident runner (operators)</h3>
    <p>Set the <code>queue_runner</code> key in <code>site_config</code> (default tenant):</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Enable with a 5-second poll interval:
    </span><span class="tok-keyword tok-other tok-DML tok-sql">INSERT INTO</span> site_config (key, value, updated)
    <span class="tok-keyword tok-other tok-DML tok-II tok-sql">VALUES</span> (<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>queue_runner<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>, <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>{&quot;enabled&quot;: true, &quot;poll_interval_secs&quot;: 5}<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>::jsonb, NOW<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>)
    <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> CONFLICT (key) DO <span class="tok-keyword tok-other tok-DML tok-sql">UPDATE</span> <span class="tok-keyword tok-other tok-DML tok-sql">SET</span> value <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">value</span>, updated <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> NOW<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>;
    </span></code></pre></figure><ul>
    <li><code>enabled</code> (bool, default <code>false</code>)</li>
    <li><code>poll_interval_secs</code> (u64, default 5; floored at 1)</li>
    </ul>
    <p><strong>Runtime behavior:</strong> the runner is <strong>spawned at boot only when <code>enabled</code> is true</strong>
    — the default deployment starts no scheduler. The runner and the cron drain both
    re-read this key each cycle, so a <strong>runtime disable</strong> takes effect without a
    restart (the runner idles, cron resumes draining). <strong>Enabling</strong> at runtime
    requires a restart to spawn the task.</p>
    <p><strong>Deployment note (ops runbook).</strong> The resident runner needs a long-lived server
    process; it participates in graceful shutdown (it drains-in-progress jobs finish,
    then the loop exits on the shutdown signal). No new unit is required:</p>
    <ul>
    <li><strong>systemd:</strong> the existing <code>trovato</code> service already runs the long-lived
    process; <code>SIGTERM</code> triggers graceful shutdown (bounded by <code>SHUTDOWN_TIMEOUT_SECS</code>).
    If the runner is enabled you can drop the external cron timer that pokes
    <code>/cron/{key}</code> (the runner owns draining), or keep it as a harmless fallback.</li>
    <li><strong>docker/compose:</strong> the app container is the runner host; ensure <code>stop_grace_period</code>
    is at least <code>SHUTDOWN_TIMEOUT_SECS</code> so in-flight jobs finish on shutdown.</li>
    </ul>
    <h2>Kernel-internal embed queue (P11f / D-51, D-52)</h2>
    <p>The kernel is itself a queue producer/consumer. Item save enqueues a <strong>kernel
    embed job</strong> — under the reserved <code>plugin_name</code> <code>__kernel_embed</code> (a leading
    underscore can never be a plugin machine name, so it never collides), queue name
    <code>embed</code> — instead of embedding inline on the save path. A <strong>native drain arm</strong>
    (<code>CronService::drain_embed_jobs</code>) claims and runs those rows: unlike a plugin
    job it dispatches no <code>tap_queue_worker</code>, it embeds the item natively. It shares
    the <strong>same</strong> <code>plugin_queue</code> table, the same <code>FOR UPDATE SKIP LOCKED</code> claim, the
    same per-cycle fairness cap, and the same retry/backoff/dead-letter bookkeeping
    as plugin jobs — embed jobs are first-class queue-v2 citizens. Its worker width
    is fixed at the kernel concurrency ceiling (4); it has no <code>tap_queue_info</code>.</p>
    <p>It drains on the <strong>same cadence</strong> as plugin queues (external cron by default;
    the resident runner when enabled, above) and follows the same runner hand-off.</p>
    <p>Enqueue is decoupled from live pgvector availability: the durable "this item
    needs embedding" intent is recorded at save time; the drain decides what to do
    with the backend it finds. If pgvector is unavailable when the job runs, the job
    is a graceful no-op (the item stays <code>pending</code>; backfill re-embeds once a backend
    exists) — it is never dead-lettered for a missing backend. (Note: wiring an
    embedding provider <em>without</em> pgvector is a misconfiguration — the job will call
    the provider and then discard the vector for lack of a store; install pgvector
    or leave the embedding provider unset.)</p>
    <h3>Embedding freshness contract (D-51)</h3>
    <p>Async embedding (D-51) deliberately reverses the old synchronous best-effort
    embed. The contract:</p>
    <ul>
    <li><strong>Findable-by-text is immediate.</strong> The <code>search_vector</code> <code>tsvector</code> is maintained
    by a DB trigger <em>inside the save transaction</em>, so full-text search sees an item
    the instant it is saved — never deferred.</li>
    <li><strong>Findable-by-similarity is eventual.</strong> The semantic (<code>SemanticSimilarity</code>)
    index is populated by the embed job, so its freshness is <strong>bounded by the drain
    cadence above</strong> — up to your external-cron interval by default, or the resident
    runner's <code>poll_interval_secs</code> for sub-cron latency. Deployments that care about
    embed staleness should enable the resident runner.</li>
    <li><strong>Not-yet-embedded items degrade cleanly.</strong> Semantic gather does not block on or
    error over an item whose embedding has not landed; it simply is not a
    similarity candidate until its job runs.</li>
    <li><strong>Coalescing.</strong> Each embed job captures a content hash; if a newer save
    supersedes it before it runs, the stale job is skipped and the newest job
    embeds the latest content exactly once. Delivery is at-least-once, and the
    model-keyed <code>(item_id, field_name, model)</code> upsert makes a duplicate run
    idempotent.</li>
    </ul>
    <h3>Observable per-item embedding state</h3>
    <p><code>item_embed_status</code> records each item's embedding lifecycle — <code>pending</code>
    (enqueued, not yet landed), <code>indexed</code> (embedding present for the current model),
    or <code>failed</code> (the embed job dead-lettered, with the error preserved). This
    replaces the old silently-swallowed embed failure. Admin surface:</p>
    <ul>
    <li><code>GET  /admin/embed/status</code> — counts by state.</li>
    <li><code>POST /admin/embed/backfill?limit=N</code> — enqueue embed jobs for up to <code>N</code> items
    missing an embedding for the active model (bounded batch). This is also the
    <strong>model-change re-embed</strong> trigger: after the embedding model changes, every
    item is a gap for the new model, so a backfill re-enqueues them. Old-model
    vectors are harmlessly retained (the similarity read path filters by the active
    model). Requires an admin session and <code>X-CSRF-Token</code>.</li>
    </ul>
    <h3>Policy: async-by-default with per-type opt-out (D-51)</h3>
    <p>Async is the default for every content type. A type listed in the <code>embed_policy</code>
    <code>site_config</code> key opts out and keeps the synchronous best-effort embed on the
    save path:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Make the `page` type embed synchronously on save; everything else stays async.
    </span><span class="tok-keyword tok-other tok-DML tok-sql">INSERT INTO</span> site_config (key, value, updated)
