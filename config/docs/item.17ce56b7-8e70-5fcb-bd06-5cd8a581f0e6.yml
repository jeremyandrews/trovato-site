    <h1>Plugin Queue (v2)</h1>
    <p>The plugin queue lets a plugin enqueue work — typically from <code>tap_cron</code> — for
    the kernel to process later by calling <code>tap_queue_worker</code> on the owning plugin.
    Version 2 (P11d / decisions D-45..D-48) makes it a real work queue: attempts,
    exponential backoff, priority, claim-locking, and a dead-letter tier.</p>
    <p>This document is the contract for plugin authors and operators.</p>
    <h2>Enqueuing work</h2>
    <p>Two host functions enqueue jobs. Both inject the calling plugin's name (a plugin
    cannot enqueue under another plugin's identity) and feed the same server-side v2
    semantics.</p>
    <ul>
    <li><p><strong><code>queue_push(queue_name, payload)</code></strong> — the minimal, byte-identical form.
    Priority 0, no delay. Its ABI is frozen; existing callers are unaffected.</p>
    </li>
    <li><p><strong><code>queue_enqueue(queue_name, payload, opts)</code></strong> — the additive form (D-48). <code>opts</code>
    is a <code>QueueOptions</code>:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-other tok-rust">use</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">host<span class="tok-punctuation tok-accessor tok-rust">::</span></span>queue_enqueue<span class="tok-punctuation tok-terminator tok-rust">;</span>
