    </span></code></pre></figure><ul>
    <li><code>priority</code> (i32, default 0): higher values are claimed first; ties break by
    insertion order (FIFO).</li>
    <li><code>delay</code> (seconds, default 0): defer the first attempt by this many seconds.</li>
    </ul>
    </li>
    </ul>
    <p><code>payload</code> must be well-formed JSON. Error codes are documented in
    <a href="/learn/plugin-error-codes#queue-api-errors"><code>plugin-error-codes.md</code></a>.</p>
    <h2>Declaring your worker and its concurrency</h2>
    <p>Implement two taps:</p>
    <ul>
    <li><p><code>tap_queue_info</code> — declare the queue(s) you own and their worker concurrency:</p>
