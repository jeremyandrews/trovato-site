    <h3>Stage Awareness</h3>
    <p>The API respects stage visibility:</p>
    <ul>
    <li>Anonymous requests see only Live content</li>
    <li>Authenticated requests with editor+ permissions can use <code>?stage=curated</code> to see internal content</li>
    <li>The same <code>stage_aware</code> Gather logic from Part 4 applies</li>
    </ul>
    <h3>Language Awareness</h3>
    <p>The <code>?lang=it</code> parameter returns Italian translations when available. If a translation is missing, the response falls back to the default language content. The <code>Content-Language</code> response header indicates which language was used.</p>
