    <h1>Part 7: Going Global</h1>
    <p>Part 6 gave Ritrovo a community: threaded comments, subscriptions, and notifications powered by three collaborating plugins. Part 7 breaks the language barrier and opens a programmatic API.</p>
    <p>Ritrovo goes <strong>bilingual</strong> (English + Italian), gets a <strong>translation workflow</strong> powered by the fifth and final Ritrovo plugin, and exposes a <strong>JSON REST API</strong> so external tools can consume conference data programmatically.</p>
    <p><strong>Start state:</strong> English-only, existing API at <code>/api/</code>, four plugin designs (<code>ritrovo_importer</code>, <code>ritrovo_cfp</code>, <code>ritrovo_access</code>, <code>ritrovo_notify</code>).
    <strong>End state:</strong> Bilingual site (English + Italian), translation editorial workflow, versioned REST API with authentication and rate limiting, five plugins.</p>
    <blockquote>
    <p><strong>Implementation note:</strong> The kernel has a language model (<code>models/language.rs</code>, 424 lines) with BCP 47 validation, a full language middleware (<code>middleware/language.rs</code>, 736 lines) with URL prefix and Accept-Language negotiation, and a locale service (<code>services/locale.rs</code>) for UI string translation. The <code>trovato_content_translation</code> plugin provides translation storage, and the <code>ritrovo_translate</code> plugin (238 lines) manages translation workflows for conferences. Italian seed data (15 conference translations) is in <code>docs/tutorial/config/seed-italian/</code>. The versioned REST API at <code>/api/v1/</code> with pagination, filters, and JSON responses is operational. API token authentication and per-endpoint rate limiting are implemented. All features described in this part are implemented.</p>
    </blockquote>
    <hr />
    <h2>Step 1: i18n Architecture</h2>
    <p>Trovato supports multilingual content through JSONB parallel field sets. Instead of separate translation tables, translatable fields store values for each language within the same JSONB structure.</p>
    <h3>Bilingual Configuration</h3>
    <p>Configure Trovato for two languages:</p>
    <ul>
    <li><strong>English</strong> (default) -- no URL prefix</li>
    <li><strong>Italian</strong> -- <code>/it/</code> URL prefix</li>
    </ul>
    <p>The language configuration lives in <code>docs/tutorial/config/language.en.yml</code> and <code>docs/tutorial/config/language.it.yml</code>:</p>
