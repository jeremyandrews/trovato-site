    </span></code></pre></figure><h3>Date Formatting</h3>
    <p>The <code>format_date</code> Tera filter is locale-aware. Without parameters, it uses the active language to pick the right format:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>{{ item.created | format_date }}                   {# uses active language #}
    {{ item.created | format_date(locale=&quot;de&quot;) }}      {# explicit: &quot;30. March 2026&quot; #}
    {{ item.created | format_date(locale=&quot;ja&quot;) }}      {# explicit: &quot;2026年3月30日&quot; #}
    {{ item.created | format_date(format=&quot;%Y-%m-%d&quot;) }} {# custom format overrides locale #}
    </code></pre></figure><p>Supported locales include English, German, French, Spanish, Italian, Portuguese, Dutch, Polish, Russian, Japanese, Chinese, Korean, Arabic, and Hebrew.</p>
