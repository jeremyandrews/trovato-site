    <summary>Under the Hood: API Token Architecture</summary>
    <p>API tokens are stored in the <code>api_tokens</code> table:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">TABLE</span> <span class="tok-entity tok-name tok-function tok-sql">api_tokens</span></span> (
        id UUID <span class="tok-storage tok-modifier tok-sql">PRIMARY KEY</span>,
        user_id UUID <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">REFERENCES</span> users(id) <span class="tok-storage tok-modifier tok-sql">ON DELETE CASCADE</span>,
        name <span class="tok-storage tok-type tok-sql">VARCHAR</span>(<span class="tok-constant tok-numeric tok-sql">255</span>) <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>,
        token_hash <span class="tok-storage tok-type tok-sql">VARCHAR</span>(<span class="tok-constant tok-numeric tok-sql">64</span>) <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> UNIQUE,
        created <span class="tok-storage tok-type tok-sql">TIMESTAMP</span><span class="tok-storage tok-type tok-sql">TZ</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">DEFAULT</span> NOW<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>,
        last_used <span class="tok-storage tok-type tok-sql">TIMESTAMP</span><span class="tok-storage tok-type tok-sql">TZ</span>,
        expires_at <span class="tok-storage tok-type tok-sql">TIMESTAMP</span><span class="tok-storage tok-type tok-sql">TZ</span>
    );
    </span></code></pre></figure><p>Tokens are hashed with SHA-256 before storage -- the raw token is shown only once at creation. The middleware (<code>middleware/api_token.rs</code>) extracts the Bearer token, hashes it, looks up the user, and injects the user context into the request.</p>
    <p>Token validation is cached to avoid per-request database lookups. The cache entry is keyed by the token hash and has a short TTL (60 seconds by default).</p>
    <p>Token CRUD is available at <code>/api/tokens</code> (authenticated via session) and as a self-service page in the user profile.</p>
    </details>
