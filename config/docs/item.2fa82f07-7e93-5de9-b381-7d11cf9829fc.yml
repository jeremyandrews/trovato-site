    <table><thead><tr><th>Translatable</th><th>Language-Neutral</th></tr></thead><tbody>
    <tr><th>Title, description, city</th><th>Dates, URLs, booleans</th></tr>
    <tr><th>Bio, body text</th><th>Coordinates, prices</th></tr>
    <tr><th>Country (localized name)</th><th>UUIDs, references</th></tr>
    </tbody></table>
    <p>The Item Type definition marks which fields are translatable. Language-neutral fields store a single value regardless of the active language.</p>
    <h3>Language Detection</h3>
    <p>The kernel determines the active language from (in order):</p>
    <ol>
    <li><strong>URL prefix</strong> -- <code>/it/conferenze/rustconf-2026</code> → Italian</li>
    <li><strong>User preference cookie</strong> -- <code>lang=it</code> cookie from previous visit</li>
    <li><strong><code>Accept-Language</code> header</strong> -- browser preference for first-time visitors</li>
    <li><strong>Default</strong> -- English (the <code>is_default</code> language)</li>
    </ol>
    <h3>Language Switcher</h3>
    <p>The site header includes a language switcher: "English / Italiano" links. Each link points to the equivalent page in the other language:</p>
