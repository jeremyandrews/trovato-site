    </span></span></code></pre></figure><hr />
    <h2>Step 5: REST API</h2>
    <p>The same Gather engine that powers HTML pages also powers a JSON API. The API is a thin serialization layer on top of existing queries.</p>
    <h3>API Endpoints</h3>
    <table><thead><tr><th>Method</th><th>Path</th><th>Description</th><th>Auth</th></tr></thead><tbody>
    <tr><th><code>GET</code></th><th><code>/api/v1/conferences</code></th><th>List upcoming conferences</th><th>Public</th></tr>
    <tr><th><code>GET</code></th><th><code>/api/v1/conferences/{id}</code></th><th>Single conference with all fields</th><th>Public</th></tr>
    <tr><th><code>GET</code></th><th><code>/api/v1/topics</code></th><th>Topic category hierarchy</th><th>Public</th></tr>
    <tr><th><code>GET</code></th><th><code>/api/v1/topics/{id}/conferences</code></th><th>Conferences for a topic</th><th>Public</th></tr>
    <tr><th><code>GET</code></th><th><code>/api/v1/search?q=</code></th><th>Full-text search</th><th>Public</th></tr>
    <tr><th><code>GET</code></th><th><code>/api/v1/speakers</code></th><th>List speakers</th><th>Public</th></tr>
    <tr><th><code>GET</code></th><th><code>/api/v1/speakers/{id}</code></th><th>Speaker with linked conferences</th><th>Public</th></tr>
    <tr><th><code>POST</code></th><th><code>/api/v1/conferences</code></th><th>Create conference</th><th>Editor+</th></tr>
    <tr><th><code>PATCH</code></th><th><code>/api/v1/conferences/{id}</code></th><th>Update conference</th><th>Editor+</th></tr>
    <tr><th><code>POST</code></th><th><code>/api/v1/conferences/{id}/subscribe</code></th><th>Subscribe</th><th>Authenticated</th></tr>
    <tr><th><code>DELETE</code></th><th><code>/api/v1/conferences/{id}/subscribe</code></th><th>Unsubscribe</th><th>Authenticated</th></tr>
    </tbody></table>
    <h3>Query Parameters</h3>
    <p>Read endpoints support:</p>
    <table><thead><tr><th>Parameter</th><th>Example</th><th>Effect</th></tr></thead><tbody>
    <tr><th><code>?topic=rust</code></th><th>Filter by topic slug</th><th>Topic + descendants</th></tr>
    <tr><th><code>?country=US</code></th><th>Filter by country</th><th>Exact match</th></tr>
    <tr><th><code>?online=true</code></th><th>Online events only</th><th>Boolean filter</th></tr>
    <tr><th><code>?lang=it</code></th><th>Italian content</th><th>Returns Italian translations</th></tr>
    <tr><th><code>?stage=curated</code></th><th>Stage filter</th><th>Editor+ only</th></tr>
    <tr><th><code>?page=2&amp;per_page=20</code></th><th>Pagination</th><th>Offset-based</th></tr>
    <tr><th><code>?q=rust</code></th><th>Search query</th><th>Full-text search</th></tr>
    </tbody></table>
    <h3>Authentication</h3>
    <p>API authentication uses Bearer tokens:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Authorization: Bearer trovato_api_sk_abc123def456
    </code></pre></figure><p>API keys are managed in the user profile. Each key is tied to a user -- requests inherit the user's roles and permissions.</p>
    <p>Anonymous API access is allowed for read-only endpoints (no <code>Authorization</code> header required).</p>
    <h3>Rate Limiting</h3>
    <table><thead><tr><th>Tier</th><th>Limit</th><th>Scope</th></tr></thead><tbody>
    <tr><th>Anonymous</th><th>60 requests/minute</th><th>Per IP</th></tr>
    <tr><th>Authenticated</th><th>300 requests/minute</th><th>Per API key</th></tr>
    </tbody></table>
    <p>Rate limit exceeded returns HTTP 429 with a <code>Retry-After</code> header. Rate limit state is stored in Redis, keyed by API key or IP address.</p>
