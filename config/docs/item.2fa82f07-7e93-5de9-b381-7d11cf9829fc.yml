    <summary>Under the Hood: Language Middleware</summary>
    <p>The language middleware (<code>middleware/language.rs</code>) runs early in the request pipeline. It:</p>
    <ol>
    <li>Extracts the language prefix from the URL path (<code>/it/...</code> → <code>it</code>)</li>
    <li>Falls back to the <code>lang</code> cookie, then <code>Accept-Language</code> header, then the default language</li>
    <li>Stores the active language in the request extensions</li>
    <li>Strips the language prefix from the path before route matching</li>
    </ol>
    <p>This means routes do not need language-aware path definitions. <code>/conferences</code> and <code>/it/conferences</code> both match the same route handler -- the middleware handles the prefix transparently.</p>
    <p>The language is available in Tera templates as <code>{{ active_language }}</code> and in request state for plugins via the request context.</p>
    </details>
    <hr />
    <h2>Step 2: Translated URL Aliases</h2>
    <p>Each language gets clean, localized URL aliases. English uses bare paths; Italian uses the <code>/it/</code> prefix with translated path segments.</p>
    <h3>Pathauto Patterns Per Language</h3>
    <table><thead><tr><th>Language</th><th>Pattern</th><th>Example</th></tr></thead><tbody>
    <tr><th>English</th><th><code>conferences/[title]</code></th><th><code>/conferences/rustconf-2026</code></th></tr>
    <tr><th>Italian</th><th><code>it/conferenze/[title]</code></th><th><code>/it/conferenze/rustconf-2026</code></th></tr>
    </tbody></table>
    <p>The <code>[title]</code> token uses the title in the respective language. If the Italian title is "RustConf 2026" (unchanged), the slug is the same; if it is "Conferenza Rust", the slug reflects that.</p>
    <h3><code>hreflang</code> Tags</h3>
    <p>For SEO, each page includes <code>&lt;link rel="alternate"&gt;</code> tags pointing to equivalent pages in other languages:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic"><span class="tok-meta tok-tag tok-structure tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-structure tok-any tok-html">head</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
      <span class="tok-meta tok-tag tok-inline tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-any tok-html">link</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">rel</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>alternate<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">hreflang</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>en<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>/conferences/rustconf-2026<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
      <span class="tok-meta tok-tag tok-inline tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-any tok-html">link</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">rel</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>alternate<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">hreflang</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>it<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>/it/conferenze/rustconf-2026<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
      <span class="tok-meta tok-tag tok-inline tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;</span><span class="tok-entity tok-name tok-tag tok-inline tok-any tok-html">link</span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">rel</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>alternate<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">hreflang</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>x-default<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span> <span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-entity tok-other tok-attribute-name tok-html">href</span><span class="tok-punctuation tok-separator tok-key-value tok-html">=</span></span><span class="tok-meta tok-attribute-with-value tok-html"><span class="tok-string tok-quoted tok-double tok-html"><span class="tok-punctuation tok-definition tok-string tok-begin tok-html">&quot;</span>/conferences/rustconf-2026<span class="tok-punctuation tok-definition tok-string tok-end tok-html">&quot;</span></span></span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
    <span class="tok-meta tok-tag tok-structure tok-any tok-html"><span class="tok-punctuation tok-definition tok-tag tok-begin tok-html">&lt;/</span><span class="tok-entity tok-name tok-tag tok-structure tok-any tok-html">head</span><span class="tok-punctuation tok-definition tok-tag tok-end tok-html">&gt;</span></span>
    </span></code></pre></figure><p>The <code>x-default</code> tag tells search engines which version to show when no language match exists.</p>
    <h3>URL Resolution with Language Prefix</h3>
    <p>The URL alias middleware handles language prefixes:</p>
    <ol>
    <li>Request for <code>/it/conferenze/rustconf-2026</code></li>
    <li>Language middleware extracts <code>it</code>, strips prefix → <code>/conferenze/rustconf-2026</code></li>
    <li>URL alias middleware resolves the alias to the item UUID</li>
    <li>Item handler loads the item and renders it in Italian</li>
    </ol>
    <p>The alias resolution system stores language-specific aliases with a <code>language</code> column (foreign key to the <code>language</code> table), so the same item can have different aliases in different languages.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Check for language-specific URL aliases</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>SELECT alias, language FROM url_alias WHERE language != &#39;en&#39; LIMIT 10;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    </span></code></pre></figure><hr />
    <h2>Step 3: The <code>ritrovo_translate</code> Plugin</h2>
    <p>The <code>ritrovo_translate</code> plugin is the fifth and final Ritrovo plugin. It provides a translation workflow: language detection, translation flagging, and an editorial queue for translators.</p>
    <blockquote>
    <p>The <code>ritrovo_translate</code> plugin lives at <code>plugins/ritrovo_translate/src/lib.rs</code> (238 lines). It implements <code>tap_item_insert</code> (language detection heuristic) and <code>tap_item_view</code> (language badge and switcher link rendering).</p>
    </blockquote>
    <h3>What It Does</h3>
    <table><thead><tr><th>Tap</th><th>Behavior</th></tr></thead><tbody>
    <tr><th><code>tap_item_insert</code></th><th>Detects language from text fields; sets <code>translation_status</code> metadata</th></tr>
    <tr><th><code>tap_item_view</code></th><th>Adds language indicator badge; shows "View in English / Vedi in italiano" switcher</th></tr>
    <tr><th><code>tap_cron</code></th><th>Processes translation queue; checks for items flagged as needing translation</th></tr>
    <tr><th><code>tap_form_alter</code></th><th>Adds language selector dropdown to conference edit form</th></tr>
    </tbody></table>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-07/conference-with-lang.png"><img src="images/part-07/conference-with-lang.png" width="600" alt="A conference detail page showing the language indicator badge and language switcher"></a></p>
    <h3>Translation Status</h3>
    <p>Each item tracks its translation state:</p>
    <table><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody>
    <tr><th><code>needs_translation</code></th><th>Item exists in one language but not the other</th></tr>
    <tr><th><code>in_progress</code></th><th>A translator is working on it</th></tr>
    <tr><th><code>translated</code></th><th>Both language versions are complete</th></tr>
    </tbody></table>
    <p>The status is stored in the item's metadata (JSONB <code>data</code> field on the item).</p>
    <h3>Translation Queue</h3>
    <p>The translation queue at <code>/admin/content/translations</code> shows items needing translation:</p>
    <table><thead><tr><th>Column</th><th>Content</th></tr></thead><tbody>
    <tr><th>Title</th><th>Item title in source language</th></tr>
    <tr><th>Type</th><th>Content type</th></tr>
    <tr><th>Source Language</th><th>Detected language of the original</th></tr>
    <tr><th>Status</th><th><code>needs_translation</code>, <code>in_progress</code>, <code>translated</code></th></tr>
    <tr><th>Actions</th><th>Translate, Mark Complete</th></tr>
    </tbody></table>
    <h3>Side-by-Side Translation Form</h3>
    <p>Clicking "Translate" opens a side-by-side form:</p>
    <ul>
    <li>Left column: source language fields (read-only)</li>
    <li>Right column: target language fields (editable)</li>
    <li>Save stores the translation in the JSONB parallel field structure</li>
    </ul>
    <h3>Language Detection</h3>
    <p>On <code>tap_item_insert</code>, the plugin examines text fields (title, description) to detect the primary language. For the tutorial, detection uses simple heuristics (common Italian words, character patterns). A production system might use a language detection library or the AI capabilities from Epic 3.</p>
    <h3>Building the Plugin</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-support tok-function tok-cd tok-shell">cd</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins/ritrovo_translate</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target/wasm32-wasip1/release/ritrovo_translate.wasm ../../plugin-dist/</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin install ritrovo_translate</span>
    </span></code></pre></figure><h3>SDK Features Used</h3>
    <ul>
    <li><code>tap_item_insert</code> -- Language detection and status flagging</li>
    <li><code>tap_item_view</code> -- Language badge and switcher injection</li>
    <li><code>tap_cron</code> -- Translation queue processing</li>
    <li><code>tap_form_alter</code> -- Language selector injection on edit forms</li>
    <li>i18n integration -- Reading the active language from request context</li>
    </ul>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Plugin installed</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>SELECT name, status FROM plugins WHERE name = &#39;ritrovo_translate&#39;;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Expect: ritrovo_translate, 1</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><hr />
    <h2>Step 4: Seeding Italian Content</h2>
    <p>To demonstrate the bilingual system, seed approximately 20 Italian tech conferences with hand-written English translations.</p>
    <h3>Seed Data</h3>
    <p>The seed data includes Italian conferences with:</p>
    <ul>
    <li>Italian names and descriptions (e.g., "Conferenza Italiana su Rust", "Incontro DevOps Milano")</li>
    <li>English translations for each</li>
    <li>A mix of translation statuses to populate the translation queue</li>
    </ul>
    <p>Import the seed data (the seed directory will be created as part of this tutorial step):</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Create seed-italian/ directory with conference YAML files first, then import:</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config/seed-italian</span>
    </span></code></pre></figure><blockquote>
    <p>The <code>docs/tutorial/config/seed-italian/</code> directory contains 15 Italian conference translation seed files. These are imported alongside the standard config to populate the Italian version of the site.</p>
    </blockquote>
    <h3>Translation Status Mix</h3>
    <table><thead><tr><th>Count</th><th>Status</th><th>Purpose</th></tr></thead><tbody>
    <tr><th>~12</th><th><code>translated</code></th><th>Both languages complete -- appear in both <code>/conferences</code> and <code>/it/conferenze</code></th></tr>
    <tr><th>~5</th><th><code>needs_translation</code></th><th>Italian only -- appear in the translation queue</th></tr>
    <tr><th>~3</th><th><code>in_progress</code></th><th>Partially translated -- demonstrate the workflow</th></tr>
    </tbody></table>
    <h3>Language-Aware Gathers</h3>
    <p>The existing Gather queries become language-aware:</p>
    <ul>
    <li><code>/conferences</code> shows conference titles and descriptions in English</li>
    <li><code>/it/conferenze</code> shows the same conferences with Italian titles and descriptions</li>
    <li>If a translation is missing, the default language (English) content is displayed as fallback</li>
    </ul>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-07/front-page-global.png"><img src="images/part-07/front-page-global.png" width="600" alt="The Ritrovo front page with internationalization enabled, showing the language switcher and localized content"></a></p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Italian conferences seeded</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
