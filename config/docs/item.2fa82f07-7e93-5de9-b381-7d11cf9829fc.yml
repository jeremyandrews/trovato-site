    <h2>What You've Built</h2>
    <p>By the end of Part 7, you have:</p>
    <ul>
    <li><strong>Bilingual site</strong> (English + Italian) with JSONB parallel field sets, language-prefixed URLs, a language switcher, and <code>hreflang</code> SEO tags.</li>
    <li><strong><code>ritrovo_translate</code> plugin</strong> with language detection, translation status tracking, side-by-side translation form, and <code>tap_form_alter</code> for language selector injection.</li>
    <li><strong>Italian seed data</strong> -- ~20 Italian conferences with English translations, demonstrating the translation queue with mixed statuses.</li>
    <li><strong>REST API</strong> -- 11 endpoints (7 read, 2 write, 2 subscription) powered by the same Gather engine and access control as the HTML pages.</li>
    <li><strong>API authentication</strong> via Bearer tokens with per-user permissions and Redis-backed rate limiting.</li>
    <li><strong>Language-aware API</strong> with <code>?lang=it</code> parameter and <code>Content-Language</code> response headers.</li>
    </ul>
    <p>You also now understand:</p>
    <ul>
    <li>How Trovato handles multilingual content with JSONB parallel field sets (no separate translation tables).</li>
    <li>How language-prefixed routing and pathauto generate localized URLs with <code>hreflang</code> SEO tags.</li>
    <li>How the <code>ritrovo_translate</code> plugin provides a translation editorial workflow.</li>
    <li>How the Gather engine's query layer naturally becomes a REST API through JSON serialization.</li>
    <li>How API authentication via Bearer tokens reuses the same role/permission model as the web UI.</li>
    <li>How rate limiting protects the API from abuse with per-tier configurable limits.</li>
    </ul>
    <p>Six plugins now collaborate across the Ritrovo ecosystem: <code>ritrovo_importer</code> (Part 2) feeds data, <code>trovato_block_editor</code> (Part 5) enables structured editing, <code>ritrovo_access</code> (Part 5) controls visibility, <code>ritrovo_cfp</code> (Part 6) tracks deadlines, <code>ritrovo_notify</code> (Part 6) delivers notifications, and <code>ritrovo_translate</code> (Part 7) bridges languages. Each is independent, each extends the kernel through taps, and together they deliver a feature set that rivals platforms built by teams of dozens.</p>
