    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Notice the shapes of <code>field_type</code>:</p>
    <ul>
    <li><strong>Unit variants</strong> like <code>Date</code>, <code>Boolean</code>, <code>File</code>, <code>TextLong</code> serialize as a plain JSON string: <code>"Date"</code>.</li>
    <li><strong>Struct variants</strong> like <code>Text { max_length: None }</code> serialize as <code>{"Text": {"max_length": null}}</code>.</li>
    <li><strong>Newtype variants</strong> like <code>RecordReference("category_term")</code> serialize as <code>{"RecordReference": "category_term"}</code> (used in later parts).</li>
    </ul>
    <p>This matches Rust's default serde externally-tagged enum serialization. When the kernel boots, it deserializes these definitions into <code>FieldDefinition</code> structs (defined in <code>crates/plugin-sdk/src/types.rs</code>) and registers them in the <code>ContentTypeRegistry</code>.</p>
    <p>Actual item data is stored in the <code>item.fields</code> JSONB column -- not in <code>item_type.settings</code>. The <code>item_type</code> defines the schema; <code>item.fields</code> holds the values. This separation means you can add or remove fields from a type without migrating existing item data.</p>
    <p>For production sites that need version-controlled configuration, Trovato provides <code>config export/import</code>:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Export all configuration (including item types) to YAML</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config export ./config/</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Import configuration from YAML</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import ./config/</span>
    </span></code></pre></figure></details>
    <hr />
    <h2>Step 3: Create Your First Conference</h2>
    <p>Now that the <code>conference</code> Item Type exists, let's create some conferences. This is deliberately manual -- you should feel the friction that motivates the importer plugin in Part 2.</p>
    <h3>Navigating to the Form</h3>
    <ol>
    <li>Open <code>/admin/content</code> in your browser. This is the content listing page.</li>
    <li>Click <strong>Add content</strong> (or go directly to <code>/admin/content/add</code>).</li>
    <li>You'll see a list of available Item Types. Click <strong>Conference</strong>.</li>
    </ol>
    <p>This opens the auto-generated form at <code>/admin/content/add/conference</code>. Trovato inspects the <code>conference</code> type's field definitions and renders the correct HTML input for each field type:</p>
    <ul>
    <li><strong>Date</strong> fields (<code>field_start_date</code>, <code>field_end_date</code>, <code>field_cfp_end_date</code>) render as <code>&lt;input type="date"&gt;</code> -- your browser shows a date picker.</li>
    <li><strong>Boolean</strong> fields (<code>field_online</code>) render as a checkbox.</li>
    <li><strong>Text</strong> fields (<code>field_city</code>, <code>field_country</code>, <code>field_url</code>) render as standard text inputs.</li>
    <li><strong>TextLong</strong> fields (<code>field_description</code>, <code>field_editor_notes</code>) render as multi-line textareas.</li>
    </ul>
    <p>The title field at the top uses the custom label "Conference Name" (from <code>title_label</code> in the Item Type definition).</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-01/content-add-form.png"><img src="images/part-01/content-add-form.png" width="600" alt="Content creation form for a conference showing date pickers, text inputs, and checkbox fields"></a></p>
    <h3>Conference 1: RustConf 2026</h3>
    <p>This first conference gets a detailed field-by-field walkthrough. Fill in the form with these values:</p>
    <table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
    <tr><th>Conference Name</th><th>RustConf 2026</th></tr>
    <tr><th>Website URL</th><th>https://rustconf.com</th></tr>
    <tr><th>Start Date</th><th>2026-09-09</th></tr>
    <tr><th>End Date</th><th>2026-09-11</th></tr>
    <tr><th>City</th><th>Portland</th></tr>
    <tr><th>Country</th><th>United States</th></tr>
    <tr><th>CFP URL</th><th>https://rustconf.com/cfp</th></tr>
    <tr><th>CFP End Date</th><th>2026-06-15</th></tr>
    <tr><th>Description</th><th>The official Rust conference, featuring talks on the latest Rust developments.</th></tr>
    <tr><th>Published</th><th>(checked)</th></tr>
    </tbody></table>
    <p>Leave the remaining fields blank (they're optional). Click <strong>Create content</strong>.</p>
    <p>You'll be redirected to <code>/admin/content</code> where "RustConf 2026" now appears in the list.</p>
    <h3>Conference 2: EuroRust 2026</h3>
    <p>Go back to <code>/admin/content/add/conference</code> and create a second conference:</p>
    <table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
    <tr><th>Conference Name</th><th>EuroRust 2026</th></tr>
    <tr><th>Website URL</th><th>https://eurorust.eu</th></tr>
    <tr><th>Start Date</th><th>2026-10-15</th></tr>
    <tr><th>End Date</th><th>2026-10-16</th></tr>
    <tr><th>City</th><th>Paris</th></tr>
    <tr><th>Country</th><th>France</th></tr>
    <tr><th>Description</th><th>Europe's premier Rust conference, bringing together Rustaceans from across the continent.</th></tr>
    <tr><th>Published</th><th>(checked)</th></tr>
    </tbody></table>
    <p>Click <strong>Create content</strong>.</p>
    <h3>Conference 3: WasmCon Online 2026</h3>
    <p>One more -- this time an online-only conference, which exercises the <code>field_online</code> boolean checkbox. Navigate to <code>/admin/content/add/conference</code>:</p>
    <table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
    <tr><th>Conference Name</th><th>WasmCon Online 2026</th></tr>
    <tr><th>Website URL</th><th>https://wasmcon.dev</th></tr>
    <tr><th>Start Date</th><th>2026-07-22</th></tr>
    <tr><th>End Date</th><th>2026-07-23</th></tr>
    <tr><th>Online</th><th>(checked)</th></tr>
    <tr><th>Description</th><th>A virtual conference dedicated to WebAssembly, covering toolchains, runtimes, and the component model.</th></tr>
    <tr><th>Published</th><th>(checked)</th></tr>
    </tbody></table>
    <p>Notice that <strong>City</strong> and <strong>Country</strong> are left blank -- this is an online event, so a physical location doesn't apply. Click <strong>Create content</strong>.</p>
    <blockquote>
    <p><strong>Checkpoint:</strong> You now have three conferences in your content listing at <code>/admin/content</code>.</p>
    </blockquote>
    <h3>What Happened on Submit</h3>
    <p>When you submitted each form, the kernel:</p>
    <ol>
    <li><strong>Validated</strong> -- checked that <code>field_start_date</code> and <code>field_end_date</code> (the two required fields) were present.</li>
    <li><strong>Extracted fields</strong> -- separated the dynamic field values (<code>field_url</code>, <code>field_start_date</code>, etc.) from system fields (<code>title</code>, <code>status</code>, CSRF token).</li>
    <li><strong>Stored the item</strong> -- inserted a row into the <code>item</code> table with the field values as a flat JSONB object in the <code>fields</code> column.</li>
    <li><strong>Created a revision</strong> -- inserted a snapshot into <code>item_revision</code> for the revision history.</li>
    <li><strong>Generated a URL alias</strong> -- every item gets a system path like <code>/item/{uuid}</code>. In Step 5 we will configure pathauto to generate human-friendly aliases like <code>/conferences/rustconf-2026</code> automatically.</li>
    </ol>
    <h3>Viewing the Item</h3>
    <p>Every item is viewable at <code>/item/{id}</code> (where <code>{id}</code> is the item's UUID). This is the public, non-admin view. Trovato resolves templates in priority order:</p>
    <ol>
    <li><code>templates/elements/item--conference--{id}.html</code> (item-specific override)</li>
    <li><code>templates/elements/item--conference.html</code> (type-specific template)</li>
    <li><code>templates/elements/item.html</code> (default fallback)</li>
    </ol>
    <p>The default template renders all fields with their labels. In Part 3 we will create a custom <code>item--conference.html</code> template with proper layout, but for now the default rendering shows that content creation works end to end.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-01/conference-detail.png"><img src="images/part-01/conference-detail.png" width="600" alt="Conference detail page showing the default field rendering for a conference item"></a></p>
    <p>There is also a JSON API at <code>/api/item/{id}</code> for programmatic access:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/api/item/YOUR-ITEM-UUID</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> .</span>
    </span></code></pre></figure><h3>Inspecting the Database Row</h3>
    <p>Connect to your database and query the item:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> id, title, fields, created, stage_id
    <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> item
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> type <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>conference<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
    <span class="tok-keyword tok-other tok-DML tok-sql">ORDER BY</span> created <span class="tok-keyword tok-other tok-order tok-sql">DESC</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">LIMIT</span> <span class="tok-constant tok-numeric tok-sql">1</span>;
    </span></code></pre></figure><p>The <code>fields</code> column contains a flat JSON object:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_url<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>https://rustconf.com<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_start_date<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>2026-09-09<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_end_date<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>2026-09-11<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_city<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Portland<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_country<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>United States<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_cfp_url<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>https://rustconf.com/cfp<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_cfp_end_date<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>2026-06-15<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_description<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>The official Rust conference, featuring talks on the latest Rust developments.<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Notice that <code>title</code> is a column on the <code>item</code> table itself, not inside <code>fields</code>. Boolean fields that are unchecked are simply absent from the JSON (the checkbox was not checked, so <code>field_online</code> is not submitted). For WasmCon Online 2026, you would see <code>"field_online": "1"</code> present in the JSON.</p>
    <h3>Item IDs and Timestamps</h3>
    <p>Every item gets a <strong>UUIDv7</strong> identifier. UUIDv7 encodes a millisecond timestamp in its most significant bits, which means IDs are naturally time-sorted -- you can ORDER BY <code>id</code> and get chronological order without an extra index on <code>created</code>.</p>
    <p>The <code>created</code> and <code>changed</code> columns store <strong>Unix timestamps</strong> (seconds since epoch), not SQL <code>TIMESTAMP</code> values. This keeps time handling consistent across time zones and avoids database-specific timestamp semantics.</p>
    <h3>Stages</h3>
    <p>Every item has a <code>stage_id</code> that defaults to the <strong>live</strong> stage (a deterministic UUID seeded during installation). The live stage is the production-visible stage -- items on it are visible to all visitors.</p>
    <p>In Part 4, we will explore how Stages let you prepare content changes on a draft or review stage before promoting them to live. For now, you can ignore stages entirely: every item you create goes directly to the live stage and is immediately visible.</p>
    <hr />
    <h2>Step 4: Build Your First Gather</h2>
    <p>You have conferences in the database, but no public page that lists them. That's where <strong>Gathers</strong> come in. A Gather is Trovato's declarative query engine -- you define <em>what</em> you want (which item type, which filters, which sort order) and Trovato generates the SQL, handles pagination, and renders the results.</p>
    <h3>Creating the Gather via Admin UI</h3>
    <p>Let's create a Gather that lists all published conferences sorted by start date.</p>
    <ol>
    <li>Navigate to <code>/admin/gather</code> in your browser.</li>
    <li>Click <strong>Create gather query</strong> (or go directly to <code>/admin/gather/create</code>).</li>
    <li>Fill in the form:</li>
    </ol>
    <table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
    <tr><th>Query ID</th><th>upcoming_conferences</th></tr>
    <tr><th>Label</th><th>Upcoming Conferences</th></tr>
    <tr><th>Description</th><th>Published conferences sorted by start date</th></tr>
    <tr><th>Base Table</th><th>item</th></tr>
    </tbody></table>
    <ol start="4">
    <li><p><strong>Add two filters</strong> -- click <strong>Add filter</strong> twice:</p>
    <p>Filter 1 (item type):</p>
    <ul>
    <li>Field: <code>type</code></li>
    <li>Operator: <code>equals</code></li>
    <li>Value: <code>conference</code></li>
    </ul>
    <p>Filter 2 (published only):</p>
    <ul>
    <li>Field: <code>status</code></li>
    <li>Operator: <code>equals</code></li>
    <li>Value: <code>1</code></li>
    </ul>
    </li>
    <li><p><strong>Add a sort</strong> -- this orders conferences by when they start:</p>
    <ul>
    <li>Field: <code>fields.field_start_date</code></li>
    <li>Direction: <code>asc</code></li>
    </ul>
    </li>
    <li><p><strong>Display settings:</strong></p>
    <ul>
    <li>Format: <code>list</code></li>
    <li>Items per page: <code>25</code></li>
    <li>Empty text: <code>No conferences found.</code></li>
    </ul>
    </li>
    <li><p>Click <strong>Save</strong>.</p>
    </li>
    </ol>
    <h3>Gather Definition</h3>
    <p>Here's what the form created in the database. The Gather definition is a JSONB document stored in the <code>gather_query</code> table:</p>
    <figure class="code"><pre class="code__body"><code>GatherDefinition {
      base_table: &quot;item&quot;,
      filters: [
        { field: &quot;type&quot;,   operator: &quot;equals&quot;, value: &quot;conference&quot; },
        { field: &quot;status&quot;, operator: &quot;equals&quot;, value: 1 }
      ],
      sorts: [
        { field: &quot;fields.field_start_date&quot;, direction: &quot;asc&quot; }
      ],
      pager: { items_per_page: 25 }
    }
    </code></pre></figure><p>This tells Trovato: "Select all published conference items, sort them by start date (soonest first), and show 25 per page."</p>
    <p>This is a simplified version of the full Upcoming Conferences Gather -- no exposed filters, no relationships, no topic joins yet. Those come in Part 2.</p>
    <h3>How It Works</h3>
    <p>When a visitor hits the Gather's URL, the kernel:</p>
    <ol>
    <li><strong>Loads the definition</strong> -- reads the <code>upcoming_conferences</code> row from <code>gather_query</code>.</li>
    <li><strong>Builds a parameterized SQL query</strong> -- the Gather engine translates the definition into a SQL query:</li>
    </ol>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> id, current_revision_id, type, title, author_id, status,
           created, changed, promote, sticky, fields, stage_id, language
    <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> item
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> <span class="tok-constant tok-other tok-database-name tok-sql">item</span>.<span class="tok-constant tok-other tok-table-name tok-sql">type</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>conference<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> <span class="tok-constant tok-other tok-database-name tok-sql">item</span>.<span class="tok-constant tok-other tok-table-name tok-sql">status</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-numeric tok-sql">1</span> <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> stage_id <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> $<span class="tok-constant tok-numeric tok-sql">1</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">ORDER BY</span> <span class="tok-constant tok-other tok-database-name tok-sql">item</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span><span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_start_date<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-order tok-sql">ASC</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">LIMIT</span> <span class="tok-constant tok-numeric tok-sql">25</span> OFFSET <span class="tok-constant tok-numeric tok-sql">0</span>
    </span></code></pre></figure><ol start="3">
    <li><strong>Renders the results</strong> -- using a query-specific Tera template (<code>templates/gather/query--upcoming_conferences.html</code>) that ships with the project. The template displays each conference as a card showing the title (linked to the detail page), date range, city and country, description, and action links to the detail page and the conference website.</li>
    </ol>
    <p>No admin UI configuration was needed for the template. Gather resolves templates by checking for a file named <code>query--{query_id}.html</code> first, then <code>query--{format}.html</code>, then the generic <code>query.html</code>. Because a file named <code>query--upcoming_conferences.html</code> exists in <code>templates/gather/</code>, it is used automatically. The template accesses item fields through the <code>row.fields</code> object -- the same JSONB blob stored in the database.</p>
    <h3>Creating the URL Alias</h3>
    <p>The Gather is accessible at <code>/gather/upcoming_conferences</code>, but that's not a user-friendly URL. Let's create a clean alias.</p>
    <ol>
    <li>Navigate to <code>/admin/structure/aliases/add</code>.</li>
    <li>Fill in the form:</li>
    </ol>
    <table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
    <tr><th>Source path</th><th>/gather/upcoming_conferences</th></tr>
    <tr><th>Alias</th><th>/conferences</th></tr>
    </tbody></table>
    <ol start="3">
    <li>Click <strong>Save</strong>.</li>
    </ol>
    <p>Now <code>/conferences</code> transparently resolves to <code>/gather/upcoming_conferences</code> -- visitors see the clean URL in their browser. The path alias fallback handler intercepts the unmatched request and forwards it to the Gather route after rewriting the URI.</p>
    <h3>Viewing the Listing</h3>
    <p>Visit <code>http://localhost:3000/conferences</code> in your browser. You should see three conference cards sorted by start date -- WasmCon Online first (July), then RustConf (September), then EuroRust (October). Each card shows:</p>
    <ul>
    <li>The conference title, linked to its detail page at <code>/item/{uuid}</code></li>
    <li>The date range (e.g. <code>2026-09-09 – 2026-09-11</code>) and location (city, country)</li>
    <li>The conference description</li>
    <li>A "View details" link and an external "Website" link</li>
    </ul>
    <p>Click a title through to confirm the detail page renders correctly before moving on to Step 5.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-01/conferences-listing.png"><img src="images/part-01/conferences-listing.png" width="600" alt="Conferences listing page showing three conference cards sorted by start date"></a></p>
    <p>The Gather is also available as JSON via the REST API:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/api/query/upcoming_conferences/execute</span>
    </span></code></pre></figure><p>This returns a JSON response with the query results, pagination info, and total count -- useful for building custom front ends or feeding data to other services.</p>
    <h3>URL Routing</h3>
    <p>Gathers are served at <code>/gather/{query_id}</code> by default. The URL alias you just created gives it a clean URL. The path alias fallback handler intercepts requests that don't match any registered route, looks up the alias, and forwards the request to the inner router with the rewritten URI. Query strings and pagination parameters pass through unchanged.</p>
    <p>Trailing slashes are normalised: a request for <code>/conferences/</code> issues a <strong>308 Permanent Redirect</strong> to <code>/conferences</code> before the alias lookup runs. This means both forms work in the browser, and search engines will consolidate link equity on the canonical (no-slash) URL.</p>
    <h3>Pagination</h3>
    <p>The Gather renders 25 items per page with next/previous controls. The pager shows the total result count so visitors know how many conferences exist. Pagination is handled via a <code>page</code> query parameter -- <code>/conferences?page=2</code> shows the second page.</p>
    <h3>Empty State</h3>
    <p>If no conferences match the filters (for example, if you delete all conferences), the Gather displays the configured empty text: "No conferences found." rather than a blank page.</p>
    <h3>Exposed Filters (Preview)</h3>
    <p>In the Gather definition, each filter has an "Exposed" option. If you enable it, the filter becomes a URL query parameter that visitors can use to narrow results. For example, you could expose a filter on <code>fields.field_country</code> so visitors can filter conferences by country. We'll revisit exposed filters in a later part of this tutorial when we build a more advanced search experience.</p>
    <blockquote>
    <p><strong>Checkpoint:</strong> Visitors can browse <code>/conferences</code> and see all three conferences. The listing works end to end.</p>
    </blockquote>
    <hr />
    <h2>Step 5: Human-Friendly URLs</h2>
    <p>Every item is accessible at <code>/item/{uuid}</code>, but UUIDs are terrible to share, bookmark, or read aloud. This step configures pathauto to generate aliases like <code>/conferences/rustconf-2026</code> automatically whenever a conference is saved.</p>
    <h3>How It Works</h3>
    <p>Trovato's pathauto system reads a pattern from site configuration (stored in <code>site_config</code> under the key <code>pathauto_patterns</code>), expands tokens using the item's data, slugifies the result, and creates an entry in the <code>url_alias</code> table automatically on save. The path alias fallback handler intercepts incoming requests that don't match any registered route and rewrites <code>/conferences/rustconf-2026</code> to <code>/item/{uuid}</code> before forwarding -- so the canonical URL remains <code>/item/{uuid}</code> internally, while visitors always see the clean alias.</p>
    <h3>Option A: Admin UI</h3>
    <p>Navigate to <code>/admin/config/pathauto</code>. You will see a table listing every registered content type with a text input for its URL pattern.</p>
    <p>For the <strong>Conference</strong> row, enter:</p>
    <figure class="code"><pre class="code__body"><code>conferences/[title]
    </code></pre></figure><p>Click <strong>Save configuration</strong>.</p>
    <p>Now click <strong>Regenerate aliases</strong> next to Conference. Trovato will iterate all existing conference items, generate the appropriate alias for each, and report how many were created. After this step, the three conferences you created in Step 3 will have aliases:</p>
    <table><thead><tr><th>Conference</th><th>Alias</th></tr></thead><tbody>
    <tr><th>RustConf 2026</th><th><code>/conferences/rustconf-2026</code></th></tr>
    <tr><th>EuroRust 2026</th><th><code>/conferences/eurorust-2026</code></th></tr>
    <tr><th>WasmCon Online 2026</th><th><code>/conferences/wasmcon-online-2026</code></th></tr>
    </tbody></table>
    <p>Any new conference saved after this point will have its alias generated automatically on save -- no manual step needed.</p>
    <h3>Option B: Config Import</h3>
    <p>If you are following the config-import workflow, the pattern is already waiting for you in <code>docs/tutorial/config/variable.pathauto_patterns.yml</code>. Import it and then regenerate via the admin UI:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Import the pathauto pattern</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><blockquote>
    <p><strong>Warning:</strong> <code>config import</code> replaces the <strong>entire</strong> <code>pathauto_patterns</code> value in <code>site_config</code>. If you have already configured patterns for other content types via the admin UI, those patterns will be overwritten. Import first, then add any additional patterns back through the UI.</p>
    </blockquote>
    <p>After importing, navigate to <code>/admin/config/pathauto</code> and click <strong>Regenerate aliases</strong> next to the Conference row. The regenerate step must be done through the UI — the regenerate endpoint is a CSRF-protected form POST that requires a live admin session, not a scriptable API call.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>I</span> http://localhost:3000/conferences/rustconf-2026</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> HTTP/1.1 200 OK</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>I</span> http://localhost:3000/conferences/eurorust-2026</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> HTTP/1.1 200 OK</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>I</span> http://localhost:3000/conferences/wasmcon-online-2026</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> HTTP/1.1 200 OK</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>The tutorial integration tests for Step 5 (<code>test_part01_step05_*</code> in <code>tutorial_test.rs</code>) verify these aliases at the model layer, confirming the correct rows exist in <code>url_alias</code> after regeneration.</p>
    <h3>How Slugification Works</h3>
    <p>The <code>[title]</code> token is run through <code>slugify()</code>, which:</p>
    <ol>
    <li>Converts to lowercase.</li>
    <li>Replaces any character that is not <code>a–z</code>, <code>0–9</code> with a hyphen.</li>
    <li>Collapses consecutive hyphens into one.</li>
    <li>Strips leading and trailing hyphens.</li>
    <li>Truncates at 128 characters, breaking at a word boundary.</li>
    </ol>
    <p>So "RustConf 2026" becomes <code>rustconf-2026</code>, "C++ Now" becomes <code>c-now</code>, and "  ⚡ Fast!" becomes <code>fast</code>. The full pattern <code>conferences/[title]</code> becomes <code>/conferences/rustconf-2026</code> -- the leading slash is added automatically.</p>
    <p>If two items produce the same base alias (e.g., two conferences both named "Rust Fest"), pathauto generates <code>/conferences/rust-fest</code> for the first and <code>/conferences/rust-fest-1</code> for the second. Up to 99 numeric suffixes are tried before falling back to a UUID fragment.</p>
    <h3>What About Title Changes?</h3>
    <p>When you edit a conference and save it through the admin form, <code>update_alias_item</code> runs automatically. If the title changed, the alias is regenerated to match the new title. The old alias is removed -- it does not redirect automatically. Redirect handling (for SEO continuity) is covered in a later part of the tutorial.</p>
    <p>If you clear the pattern in <code>/admin/config/pathauto</code> and regenerate, the service stops generating new aliases but does not delete existing ones.</p>
    <details>
    <summary>Under the Hood: How the Alias Resolver Works</summary>
    <p>When a request arrives for <code>/conferences/rustconf-2026</code>, the path alias fallback handler:</p>
    <ol>
    <li>Looks up the alias in the <code>url_alias</code> table: <code>SELECT source FROM url_alias WHERE alias = '/conferences/rustconf-2026'</code>.</li>
    <li>Finds the source <code>/item/{uuid}</code>.</li>
    <li>Rewrites the request URI to <code>/item/{uuid}</code> and forwards the request to the inner router.</li>
    </ol>
    <p>The router never sees the alias -- it only ever sees canonical <code>/item/{uuid}</code> paths. This is why the same middleware that resolves <code>/conferences/rustconf-2026</code> → <code>/item/{uuid}</code> also resolves <code>/conferences</code> → <code>/gather/upcoming_conferences</code>: both are just rows in <code>url_alias</code>.</p>
    <figure class="code"><figcaption class="code__lang">trovato-test:internal</figcaption><pre class="code__body"><code class="language-trovato-test:internal">-- Verify alias rows exist in the database after regeneration
    SELECT source, alias
    FROM url_alias
    WHERE alias LIKE &#39;/conferences/%&#39;
    ORDER BY alias;
    -- Expected: three rows, one per conference
    </code></pre></figure><p>The alias lookup hits the database on every request — the path alias middleware does not use a Redis cache or in-process cache. This means newly created aliases are immediately effective without any cache invalidation step. The trade-off is a database query per non-system request; this is acceptable for sites at tutorial scale and can be addressed with a read replica or connection pool tuning for high-traffic deployments.</p>
    </details>
    <hr />
    <h2>What You've Built</h2>
    <p>By the end of Part 1, you have:</p>
    <ul>
    <li>A running Trovato instance with PostgreSQL and Redis.</li>
    <li>A <code>conference</code> Item Type with 12 fields for dates, location, CFP details, and more.</li>
    <li>Three conferences (created by hand), each viewable at <code>/item/{uuid}</code>.</li>
    <li>A Gather listing at <code>/conferences</code> that displays all published conferences sorted by start date.</li>
    <li>Human-friendly URL aliases (<code>/conferences/rustconf-2026</code>, etc.) generated automatically by pathauto.</li>
    </ul>
    <p>You also now understand:</p>
    <ul>
