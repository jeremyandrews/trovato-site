    <h1>Part 1: Hello, Trovato</h1>
    <p>Welcome to the Ritrovo tutorial. Over the next eight parts you will build a fully functional tech conference aggregator using Trovato. By the end of Part 1 you will have a running Trovato instance with a <code>conference</code> content type, three hand-created conferences, a Gather listing that displays them at <code>/conferences</code>, and human-friendly URL aliases like <code>/conferences/rustconf-2026</code>.</p>
    <p><strong>In this part:</strong></p>
    <table><thead><tr><th>Step</th><th>What you'll do</th></tr></thead><tbody>
    <tr><th><a href="#step-1-install-trovato">Step 1: Install Trovato</a></th><th>Get a running instance with PostgreSQL, Redis, and the web installer</th></tr>
    <tr><th><a href="#step-2-create-the-conference-item-type">Step 2: Create the Conference Item Type</a></th><th>Define the content structure with 12 fields</th></tr>
    <tr><th><a href="#step-3-create-your-first-conference">Step 3: Create Your First Conference</a></th><th>Add three conferences by hand through the admin UI</th></tr>
    <tr><th><a href="#step-4-build-your-first-gather">Step 4: Build Your First Gather</a></th><th>Create a public listing page at <code>/conferences</code></th></tr>
    <tr><th><a href="#step-5-human-friendly-urls">Step 5: Human-Friendly URLs</a></th><th>Configure pathauto to generate clean aliases</th></tr>
    </tbody></table>
    <hr />
    <h2>Step 1: Install Trovato</h2>
    <p>Before anything else, you need a running Trovato instance. The full details are in <a href="/learn/install">INSTALL.md</a>; here is the short version.</p>
    <h3>Prerequisites</h3>
    <ul>
    <li><strong>Rust</strong> (stable toolchain, 1.85+) -- install from <a href="https://rustup.rs/">https://rustup.rs/</a></li>
    <li><strong>PostgreSQL 16+</strong> -- any standard installation works</li>
    <li><strong>Redis 7+</strong> -- used for caching and sessions</li>
    </ul>
    <p>Verify everything is available:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">rustc</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>version        <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 1.85 or newer</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>version         <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 16 or newer</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">redis-cli</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> ping         <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> should print PONG</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span></code></pre></figure><h3>Start the Services</h3>
    <p>The fastest path uses Docker Compose for the dependencies:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Start PostgreSQL and Redis</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose up<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>d</span></span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Build Trovato</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Configure environment (defaults work with docker-compose)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> .env.example .env</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Start the server (runs migrations automatically)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato</span>
    </span></code></pre></figure><p>The <code>.env</code> defaults work with Docker Compose out of the box:</p>
    <figure class="code"><figcaption class="code__lang">env</figcaption><pre class="code__body"><code class="language-env">PORT=3000
    DATABASE_URL=postgres://trovato:trovato@localhost:5432/trovato
    REDIS_URL=redis://127.0.0.1:6379
    DATABASE_MAX_CONNECTIONS=10
    RUST_LOG=info,tower_http=debug,sqlx=warn
    </code></pre></figure><p>If you prefer to manage PostgreSQL and Redis yourself, create the database manually:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>CREATE USER trovato WITH PASSWORD &#39;trovato&#39;;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>CREATE DATABASE trovato OWNER trovato;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    </span></code></pre></figure><h3>Troubleshooting Startup</h3>
    <p><strong>"role trovato does not exist"</strong> -- If you see this error after running <code>docker compose up -d</code>, you likely have a local PostgreSQL installation already listening on port 5432. The Docker container maps to the same port, but your local Postgres answers first. Fix: stop your local PostgreSQL (e.g. <code>brew services stop postgresql</code>) and retry, or use the manual setup above with your local instance instead of Docker.</p>
    <p><strong>Starting fresh</strong> -- If you need to reset the database (bad migration state, want a clean slate), destroy and recreate the Docker volumes:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose down<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>v</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose up<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>d</span></span>
    </span></code></pre></figure><p>This deletes all data and gives you a fresh PostgreSQL and Redis. On the next <code>cargo run</code>, all migrations run from scratch and the web installer will appear again.</p>
    <h3>What Happens on First Startup</h3>
    <p>On first startup, Trovato will:</p>
    <ol>
    <li>Connect to PostgreSQL and Redis.</li>
    <li>Run all database migrations.</li>
    <li>Discover and install plugins from <code>plugins/</code>.</li>
    <li>Start listening on <code>http://localhost:3000</code>.</li>
    </ol>
    <p>Subsequent server starts skip the installer and apply any new migrations automatically.</p>
    <h3>Run the Installer</h3>
    <p>Open <code>http://localhost:3000</code> in your browser. You will be redirected to the web installer, which walks you through four steps:</p>
    <ol>
    <li><strong>Welcome</strong> -- confirms PostgreSQL and Redis are connected.</li>
    <li><strong>Create Admin Account</strong> -- set username, email, and password (minimum 12 characters).</li>
    <li><strong>Site Configuration</strong> -- set site name, slogan, and contact email.</li>
    <li><strong>Complete</strong> -- links to the site and admin dashboard.</li>
    </ol>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-01/installer-welcome.png"><img src="images/part-01/installer-welcome.png" width="600" alt="Installer welcome screen showing PostgreSQL and Redis connection status"></a></p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-01/installer-admin.png"><img src="images/part-01/installer-admin.png" width="600" alt="Installer admin account creation form with username, email, and password fields"></a></p>
    <h3>Verify the Health Check</h3>
    <p>After the installer finishes, verify everything is healthy:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/health</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> {&quot;status&quot;:&quot;healthy&quot;,&quot;postgres&quot;:true,&quot;redis&quot;:true}</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><blockquote>
    <p><strong>Checkpoint:</strong> You now have a working Trovato instance with an admin account.</p>
    </blockquote>
    <hr />
    <h2>Step 2: Create the Conference Item Type</h2>
    <p>Every piece of content in Trovato is an <strong>Item</strong>. Items are typed -- a blog post, a page, and a conference are all Items, but each has its own set of fields. The blueprint that describes which fields an Item has is called an <strong>Item Type</strong>.</p>
    <p>Trovato ships with one built-in Item Type: <code>page</code> (a simple page with a body field). Ritrovo needs a <code>conference</code> type with fields for dates, location, CFP (Call for Papers -- the submission process conferences use to solicit talk proposals) info, and more.</p>
    <blockquote>
    <p><strong>Shortcut:</strong> To skip creating this content type by hand, import the pre-built config from the project root:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config --dry-run</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><p>This creates the <code>conference</code> type with all 12 fields. If a <code>conference</code> type already exists it will be overwritten. The running server will pick up the new type automatically within the cache TTL window (60 seconds by default, configurable via <code>CACHE_TTL</code>). Then continue at Step 3 below.</p>
    </blockquote>
    <h3>Creating the Type</h3>
    <ol>
    <li>Navigate to <code>/admin/structure/types</code> in your browser. You should see "Basic Page" listed.</li>
    <li>Click <strong>Add content type</strong> (or go directly to <code>/admin/structure/types/add</code>).</li>
    <li>Fill in the form:</li>
    </ol>
    <table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>
    <tr><th>Name</th><th>Conference</th></tr>
    <tr><th>Machine name</th><th>conference</th></tr>
    <tr><th>Description</th><th>A tech conference or meetup event</th></tr>
    <tr><th>Title field label</th><th>Conference Name</th></tr>
    </tbody></table>
    <ol start="4">
    <li>Click <strong>Save content type</strong>.</li>
    </ol>
    <p>You are redirected to the content types list. "Conference" now appears alongside "Basic Page".</p>
    <h3>Adding Fields</h3>
    <p>Click <strong>Manage fields</strong> next to "Conference" (or go to <code>/admin/structure/types/conference/fields</code>). You will see the built-in <strong>Title</strong> field and an "Add a new field" form at the bottom.</p>
    <p>Add each field below one at a time. For each row, fill in the <strong>Label</strong>, verify the auto-generated <strong>Machine name</strong>, select the <strong>Type</strong>, and click <strong>Add field</strong>:</p>
    <table><thead><tr><th>Label</th><th>Machine name</th><th>Type</th></tr></thead><tbody>
    <tr><th>Website URL</th><th><code>field_url</code></th><th>Text (plain)</th></tr>
    <tr><th>Start Date</th><th><code>field_start_date</code></th><th>Date</th></tr>
    <tr><th>End Date</th><th><code>field_end_date</code></th><th>Date</th></tr>
    <tr><th>City</th><th><code>field_city</code></th><th>Text (plain)</th></tr>
    <tr><th>Country</th><th><code>field_country</code></th><th>Text (plain)</th></tr>
    <tr><th>Online</th><th><code>field_online</code></th><th>Boolean</th></tr>
    <tr><th>CFP URL</th><th><code>field_cfp_url</code></th><th>Text (plain)</th></tr>
    <tr><th>CFP End Date</th><th><code>field_cfp_end_date</code></th><th>Date</th></tr>
    <tr><th>Description</th><th><code>field_description</code></th><th>Text (long)</th></tr>
    <tr><th>Language</th><th><code>field_language</code></th><th>Text (plain)</th></tr>
    <tr><th>Source ID</th><th><code>field_source_id</code></th><th>Text (plain)</th></tr>
    <tr><th>Editor Notes</th><th><code>field_editor_notes</code></th><th>Text (long)</th></tr>
    </tbody></table>
    <p>That is 12 fields. The machine name auto-generates from the label (prefixed with <code>field_</code>), but you can edit it before clicking <strong>Add field</strong>. Make sure the machine names match the table above -- they are the keys used in the JSON field storage and by the importer plugin in Part 2.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-01/field-management.png"><img src="images/part-01/field-management.png" width="600" alt="Field management screen showing the 12 conference fields with their labels, machine names, and types"></a></p>
    <blockquote>
    <p><strong>Important:</strong> For "Website URL", the auto-generated machine name will be <code>field_website_url</code>. Edit it to <code>field_url</code> before clicking <strong>Add field</strong> -- the importer plugin in Part 2 expects this shorter name.</p>
    </blockquote>
    <p>After adding all fields, make <strong>Start Date</strong> and <strong>End Date</strong> required: click the <strong>Edit</strong> link next to each one, check the <strong>Required</strong> checkbox, and save.</p>
    <h3>What About the Other Fields?</h3>
    <p>The importer plugin (installed in Part 2) will automatically add three more fields to this type when it starts up: <code>field_topics</code> (for tagging conference topics), <code>field_twitter</code> (Twitter/X handle), and <code>field_coc_url</code> (Code of Conduct URL). Trovato lets you add fields to a type at any time without migrating existing data -- new fields are simply absent from older items until edited.</p>
    <h3>Verify the Type</h3>
    <p>Confirm the type exists via the API:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/api/content-types</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.[] | select(. == &quot;conference&quot;)<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    </span></code></pre></figure><blockquote>
    <p><strong>Checkpoint:</strong> You should see <code>"conference"</code> in the output. The content type is ready.</p>
    </blockquote>
    <h3>Field Types Reference</h3>
    <p>Trovato supports these field types:</p>
    <table><thead><tr><th>FieldType</th><th>Description</th><th>Example</th></tr></thead><tbody>
    <tr><th><code>Text</code></th><th>Short text with optional max length</th><th>City name, URL, language code</th></tr>
    <tr><th><code>TextLong</code></th><th>Long text (rich text with a format like <code>filtered_html</code>)</th><th>Description, editor notes</th></tr>
    <tr><th><code>Date</code></th><th>A calendar date</th><th>Start date, CFP deadline</th></tr>
    <tr><th><code>Boolean</code></th><th>True/false</th><th>"Is this an online event?"</th></tr>
    <tr><th><code>File</code></th><th>A file upload (image, PDF, etc.)</th><th>Conference logo, schedule PDF</th></tr>
    <tr><th><code>RecordReference</code></th><th>A link to another record (item, category term, etc.)</th><th>Topics, speakers</th></tr>
    <tr><th><code>Integer</code></th><th>Whole number</th><th>Attendee count</th></tr>
    <tr><th><code>Float</code></th><th>Decimal number</th><th>Rating score</th></tr>
    <tr><th><code>Email</code></th><th>Email address</th><th>Contact email</th></tr>
    </tbody></table>
    <details>
    <summary>Under the Hood: JSONB Field Storage</summary>
    <p>The <code>item_type.settings</code> column stores field definitions as a JSONB object with a <code>fields</code> array. Each entry is a <code>FieldDefinition</code>:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
      <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>fields<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-array tok-json"><span class="tok-punctuation tok-section tok-array tok-begin tok-json">[</span>
        <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
          <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_name<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_start_date<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
          <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>field_type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Date<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
