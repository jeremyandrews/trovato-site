    <h1>Part 2: The Ritrovo Importer Plugin</h1>
    <p>In Part 1, you built a Trovato site and manually created three conferences. That works for demos, but Ritrovo needs hundreds of real conferences — pulled automatically from the open-source <a href="https://github.com/tech-conferences/conference-data">confs.tech</a> dataset.</p>
    <p>In this part you'll build the <code>ritrovo_importer</code> plugin: a WASM module that runs on a daily cron cycle, fetches conference JSON from GitHub, and keeps your database up to date. Along the way you'll learn how Trovato's plugin system works and when to reach for it.</p>
    <hr />
    <h2>2.1 The WASM Plugin Model</h2>
    <h3>What is a plugin?</h3>
    <p>A Trovato plugin is a WebAssembly module (<code>.wasm</code> file) that the kernel discovers at startup, loads into an isolated sandbox, and calls at specific lifecycle points called <strong>taps</strong>.</p>
    <p>Plugins live in <code>plugins/{name}/</code> as Rust <code>cdylib</code> crates. They compile to WASM and are discovered automatically — drop a <code>.wasm</code> next to an <code>.info.toml</code> manifest and the server picks it up.</p>
    <h3>Why WASM?</h3>
    <p>The WASM sandbox enforces hard limits:</p>
    <table><thead><tr><th>Resource</th><th>Limit</th></tr></thead><tbody>
    <tr><th>Database query timeout</th><th>5 s</th></tr>
    <tr><th>HTTP request timeout</th><th>30 s</th></tr>
    <tr><th>Clock ticks (epoch interruption)</th><th>10 ticks</th></tr>
    </tbody></table>
    <p>If a plugin hangs, the kernel kills it without affecting the rest of the site. This is the same reason browsers run untrusted JavaScript in a sandbox — isolation is the point.</p>
    <p>Plugins cannot access the filesystem, spawn threads, or open sockets directly. All I/O goes through <strong>host functions</strong>: <code>db_query</code>, <code>http_request</code>, <code>queue_push</code>, <code>log</code>, and a handful of others. The kernel controls what plugins can do.</p>
    <h3>Taps</h3>
    <p>A tap is a function your plugin exports that the kernel calls at a specific moment. Think of them like webhooks, but in-process and sandboxed.</p>
    <figure class="code"><pre class="code__body"><code>Kernel event → serialise inputs to JSON → call plugin tap → deserialise JSON result
    </code></pre></figure><p>You declare which taps you implement in <code>{name}.info.toml</code>:</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body"><code class="language-toml">[taps]
    implements = [&quot;tap_install&quot;, &quot;tap_cron&quot;, &quot;tap_perm&quot;, &quot;tap_menu&quot;]
    </code></pre></figure><p>In Rust, each tap is a regular function annotated with <code>#[plugin_tap]</code>. The macro generates the WASM export boilerplate — reading JSON from WASM memory, calling your function, writing the result back:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_cron</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">input</span><span class="tok-punctuation tok-separator tok-rust">:</span> CronInput</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> your logic here
    </span>    <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>json<span class="tok-keyword tok-operator tok-rust">!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>status<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>ok<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><h3>Scaffolding a new plugin</h3>
    <p>The <code>trovato plugin new</code> command generates the boilerplate for you:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin new my_plugin</span>
    </span></code></pre></figure><p>This creates:</p>
    <figure class="code"><pre class="code__body"><code>plugins/my_plugin/
      Cargo.toml               # cdylib crate, trovato-sdk dependency
      my_plugin.info.toml      # manifest: name, version, taps
      src/lib.rs               # stub implementations for 4 taps
      migrations/              # empty, ready for SQL migration files
    </code></pre></figure><p>It also adds <code>"plugins/my_plugin"</code> to the workspace <code>Cargo.toml</code> members list.</p>
    <blockquote>
    <p><strong>Note:</strong> The <code>ritrovo_importer</code> plugin already ships with Trovato as a complete example. You don't need to scaffold it — instead, read through its source to understand the patterns, then use <code>cargo run --release --bin trovato -- plugin install ritrovo_importer</code> to enable it.</p>
    </blockquote>
    <h3>Installing and enabling a plugin</h3>
    <p>After building the <code>.wasm</code>:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> ritrovo_importer<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin install ritrovo_importer</span>
    </span></code></pre></figure><p><code>plugin install</code>:</p>
    <ol>
    <li>Copies <code>target/wasm32-wasip1/release/{name}.wasm</code> into the plugin directory (where the server can find it).</li>
    <li>Runs any pending SQL migrations.</li>
    <li>Marks the plugin as enabled in <code>plugin_status</code>.</li>
    </ol>
    <blockquote>
    <p><strong>Note:</strong> Because <code>ritrovo_importer</code> has <code>default_enabled = true</code> in its <code>info.toml</code>, the server auto-installs it into <code>plugin_status</code> on first startup — so you may see the message <code>Plugin 'ritrovo_importer' is already installed</code> and that is expected. The command still ensures any pending migrations are applied.</p>
    </blockquote>
    <h3>Import Configuration Before Starting</h3>
    <p>Before starting the server, import the tutorial configuration files. These YAML files define the topic category, gather queries, and URL aliases that the importer plugin depends on:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><p>This imports:</p>
    <ul>
    <li><strong>1 category</strong> — "Conference Topics"</li>
    <li><strong>32 tags</strong> — hierarchical topic terms (Languages &gt; Systems &gt; Rust, etc.)</li>
    <li><strong>5 gather queries</strong> — the browse pages (upcoming conferences, open CFPs, by topic/country/city)</li>
    <li><strong>2 URL aliases</strong> — <code>/conferences</code> and <code>/cfps</code> pointing to their gather queries</li>
    </ul>
    <blockquote>
    <p><strong>Why config, not plugin?</strong> Categories, gather queries, and URL aliases are core Trovato concepts with first-class support in the config import/export system. The plugin only handles what the kernel can't: fetching external data from the confs.tech API and mapping it to conference items.</p>
    </blockquote>
    <h3>First Startup: tap_install</h3>
    <p>When the server next starts with the plugin enabled, it calls <code>tap_install</code> <strong>once</strong> for any plugin where it has not previously run. You'll see this in the server logs:</p>
    <figure class="code"><pre class="code__body"><code>INFO trovato::state: tap_install dispatched plugin=&quot;ritrovo_importer&quot;
    </code></pre></figure><p><code>tap_install</code> discovers the category tag UUIDs from the config-imported data (caching them in <code>ritrovo_state</code> for the import pipeline's queue worker — browse routes use <code>category_tag.slug</code> instead) and queues the full historical conference import. After a restart you can verify it ran:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>SELECT COUNT(*) FROM ritrovo_state;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Should return &gt; 0 (one row per discovered category tag, plus ETag entries)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><blockquote>
    <p><strong>Note:</strong> <code>tap_install</code> fires only once per server lifetime — subsequent restarts skip it for already-installed plugins. To re-run it (e.g. after resetting the database), delete the plugin's row from <code>plugin_status</code> and restart.</p>
    </blockquote>
    <h3>The four stubs: tap_install, tap_cron, tap_queue_info, tap_queue_worker</h3>
    <p>The generated scaffold includes stubs for the four taps the importer uses:</p>
    <table><thead><tr><th>Tap</th><th>When called</th><th>What it does</th></tr></thead><tbody>
    <tr><th><code>tap_install</code></th><th>Once, on first enable</th><th>Discovers category tag UUIDs, queues historical import</th></tr>
    <tr><th><code>tap_cron</code></th><th>Every cron cycle (~1 min)</th><th>Fetches conference data, pushes to queue</th></tr>
    <tr><th><code>tap_queue_info</code></th><th>At startup</th><th>Declares queue names and concurrency</th></tr>
    <tr><th><code>tap_queue_worker</code></th><th>Per queue job</th><th>Validates and inserts/updates conferences</th></tr>
    </tbody></table>
    <p>The next section covers how <code>tap_cron</code> and the queue work together.</p>
    <blockquote>
    <p><strong>Note:</strong> The <code>ritrovo_importer</code> exemplar plugin declares only <code>tap_install</code>, <code>tap_cron</code>, <code>tap_perm</code>, and <code>tap_menu</code> — not the queue taps. The queue infrastructure is introduced in section 2.2. The scaffold includes all four tap stubs upfront so you don't have to add them later.</p>
    </blockquote>
    <hr />
    <h2>2.2 Cron-Driven Conference Import</h2>
    <p>The importer follows a two-phase architecture: a <strong>cron phase</strong> that decides what to fetch and enqueues the work, and a <strong>worker phase</strong> that validates and persists each batch. The two phases are decoupled by a database-backed queue, which lets the kernel run up to four import batches in parallel without blocking the cron dispatcher.</p>
    <figure class="code"><pre class="code__body"><code>tap_cron (every 24 h)
      └── for each topic+year
            ├── GET /conferences/{year}/{topic}.json (If-None-Match: &lt;etag&gt;)
            │     ├── 304 Not Modified → skip
            │     └── 200 OK → store new ETag → queue_push(&quot;ritrovo_import&quot;, payload)
            │
    kernel queue drain
      └── tap_queue_worker (×N, concurrency 4)
            ├── parse payload
            ├── validate each entry
            └── INSERT or UPDATE conference item
    </code></pre></figure><h3>Conditional HTTP: ETags</h3>
    <p>Every JSON file served from the confs.tech GitHub repo carries an <code>ETag</code> response header. An ETag is an opaque string that identifies a specific version of the file — when the file changes, the ETag changes.</p>
    <p>After fetching a file successfully, the importer stores its ETag in the <code>ritrovo_state</code> table under a key like <code>etag.rust.2026</code>. On the next cron run, it sends that ETag back in the <code>If-None-Match</code> request header. If the file has not changed, GitHub responds with <code>304 Not Modified</code> (no body), and the importer skips that topic+year — no queue job, no DB write.</p>
    <p>This makes the daily import cheap: on a typical day, only a handful of files change.</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Build the request, attaching the stored ETag if we have one.
