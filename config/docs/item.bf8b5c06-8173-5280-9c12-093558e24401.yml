        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> ...
    </span></span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span></code></pre></figure><p>ETag state is namespaced: <code>etag.{topic}.{year}</code>. The importer tracks ETags per file independently, so a change to <code>2026/rust.json</code> does not force a re-import of <code>2026/javascript.json</code>.</p>
    <h3>Round-Robin Topic Scheduling</h3>
    <p>There are 25 topics in the confs.tech dataset. Fetching all of them every minute would be wasteful and risk hitting GitHub's rate limits. Instead, <code>tap_cron</code> processes five topics per cycle in a round-robin:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">TOPICS_PER_CYCLE</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-storage tok-type tok-rust">usize</span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">5</span><span class="tok-punctuation tok-terminator tok-rust">;</span>       <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> topics per cron run
    </span><span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">IMPORT_INTERVAL_SECS</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-storage tok-type tok-rust">i64</span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">86_400</span><span class="tok-punctuation tok-terminator tok-rust">;</span> <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> skip runs inside a 24-hour window
    </span>
    <span class="tok-storage tok-type tok-rust">let</span> topic_offset <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-support tok-function tok-rust">load_state_usize</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-other tok-rust">STATE_TOPIC_OFFSET</span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-constant tok-other tok-rust">TOPICS</span>.<span class="tok-support tok-function tok-rust">len</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-storage tok-type tok-rust">let</span> cycle_topics<span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span><span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-constant tok-other tok-rust">TOPICS</span>
        .<span class="tok-support tok-function tok-rust">iter</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">cycle</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">skip</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>topic_offset</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">take</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-other tok-rust">TOPICS_PER_CYCLE</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">copied</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
        .<span class="tok-support tok-function tok-rust">collect</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>

    <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Advance offset for next run.
    </span><span class="tok-storage tok-type tok-rust">let</span> next_offset <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>topic_offset <span class="tok-keyword tok-operator tok-rust">+</span> <span class="tok-constant tok-other tok-rust">TOPICS_PER_CYCLE</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">%</span> <span class="tok-constant tok-other tok-rust">TOPICS</span>.<span class="tok-support tok-function tok-rust">len</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-support tok-function tok-rust">save_state</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-constant tok-other tok-rust">STATE_TOPIC_OFFSET</span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span>next_offset.<span class="tok-support tok-function tok-rust">to_string</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>The offset persists across restarts in the <code>ritrovo_state</code> table. Each cron cycle also covers two years — <code>current_year</code> and <code>current_year + 1</code> — so a cycle pushes at most 10 queue jobs.</p>
    <p>The outer 24-hour gate (<code>should_import</code>) means the round-robin only advances once per day. The cron scheduler fires every minute, but <code>should_import</code> returns false until 24 hours have elapsed since <code>STATE_LAST_IMPORT</code>.</p>
    <h3>Declaring the Queue: tap_queue_info</h3>
    <p>Before the kernel can drain the queue, it needs to know which queues exist and how many workers to run in parallel. <code>tap_queue_info</code> declares this at startup:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_queue_info</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>json<span class="tok-keyword tok-operator tok-rust">!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span>
            <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>name<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>ritrovo_import<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>concurrency<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">4</span> </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        <span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>The kernel reads this once at startup (and whenever it reloads plugins). A <code>concurrency</code> of <code>4</code> means the kernel may dispatch up to four <code>tap_queue_worker</code> calls simultaneously for this queue. For a write-heavy importer this is a good balance: parallel enough to drain the queue quickly, conservative enough not to hammer the database.</p>
    <p>A plugin can declare multiple queues by returning an array with more than one entry. Each entry may have a different concurrency.</p>
    <h3>Processing a Batch: tap_queue_worker</h3>
    <p>The kernel calls <code>tap_queue_worker</code> once per item in the <code>ritrovo_import</code> queue. Each item's payload contains a topic name, a year, and the raw JSON body of the confs.tech file:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>topic<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>rust<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>year<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">2026</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>conferences<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>[{<span class="tok-constant tok-character tok-escape tok-json">\&quot;</span>name<span class="tok-constant tok-character tok-escape tok-json">\&quot;</span>:<span class="tok-constant tok-character tok-escape tok-json">\&quot;</span>RustConf<span class="tok-constant tok-character tok-escape tok-json">\&quot;</span>,...}, ...]<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>The worker:</p>
    <ol>
    <li>Validates the payload shape (topic, year, conferences are all present).</li>
    <li>Parses the <code>conferences</code> string as JSON into a <code>Vec&lt;ConfsTechEntry&gt;</code>.</li>
    <li>Validates each entry (see "Validation rules" below).</li>
    <li>For each valid entry, computes a <code>source_id</code>, checks whether a matching conference already exists, then inserts or updates.</li>
