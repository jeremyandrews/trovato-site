                discovered <span class="tok-keyword tok-operator tok-rust">+</span><span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-constant tok-numeric tok-integer tok-decimal tok-rust">1</span><span class="tok-punctuation tok-terminator tok-rust">;</span>
            </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
        discovered
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>The <code>SLUG_TO_TERM</code> constant maps confs.tech topic slugs to category tag slugs and labels. This is the only category-related data compiled into the plugin — the actual category and tag definitions live in config YAML.</p>
    <h3>Storing Tag UUIDs in field_topics</h3>
    <p>The queue worker now resolves each topic slug to its UUID before inserting or updating:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_queue_worker</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span><span class="tok-variable tok-parameter tok-rust">input</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-path tok-rust">serde_json<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Value</span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
