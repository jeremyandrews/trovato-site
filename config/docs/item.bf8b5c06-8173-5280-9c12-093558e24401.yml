    </span></code></pre></figure><h3>Filter Value Types</h3>
    <p>Gather filters support three kinds of values:</p>
    <table><thead><tr><th>Kind</th><th>JSON representation</th><th>When resolved</th></tr></thead><tbody>
    <tr><th><strong>Literal</strong></th><th><code>"Germany"</code>, <code>true</code>, <code>"2026-01-01"</code></th><th>Compiled into the SQL — fixed for all requests</th></tr>
    <tr><th><strong>Contextual</strong></th><th><code>"current_date"</code> or <code>{"url_arg": "country"}</code></th><th>Resolved at request time from context</th></tr>
    <tr><th><strong>Null</strong></th><th><code>null</code></th><th>Skipped (filter omitted from SQL) unless the user submits a value via an exposed filter form</th></tr>
    </tbody></table>
    <p><strong><code>current_date</code></strong> resolves to today's date string (<code>"YYYY-MM-DD"</code>) at the moment of each request. This makes it possible to write "conferences starting on or after today" without a literal date.</p>
    <p><strong><code>{"url_arg": "name"}</code></strong> reads the named key from the gather URL's query string. For example, <code>value: {"url_arg": "topic"}</code> takes its value from the <code>?topic=…</code> parameter. If the parameter is absent, the filter resolves to null and is skipped — the query returns unfiltered results.</p>
    <p><strong><code>null</code></strong> on an unexposed filter is meaningless (the filter would always be skipped). On an <strong>exposed</strong> filter it acts as "no default value" — the user can supply one through the rendered filter form, but the gather renders all results when the form is empty.</p>
    <h3>The Five Gather Queries</h3>
    <p>These five queries are defined as YAML configuration files in <code>docs/tutorial/config/</code> and imported via <code>config import</code>. Each file contains the query ID, label, definition (filters, sorts), and display configuration (format, pager, empty text). Re-importing updates existing queries via <code>ON CONFLICT DO UPDATE</code>, so changes propagate automatically.</p>
    <h4>ritrovo.upcoming_conferences</h4>
    <p>Upcoming conferences (start date ≥ today), filterable via an exposed filter form.</p>
    <figure class="code"><pre class="code__body"><code>Hard filters:    field_start_date ≥ current_date
    Exposed filters: field_topics   has_tag_or_descendants  widget: category_select (category: &quot;topics&quot;)
                     field_country  equals                  widget: dynamic_options (source: fields.field_country)
                     field_online   equals                  widget: boolean
                     field_language equals                  widget: dynamic_options (source: fields.field_language)
    Sort:            field_start_date ASC
    </code></pre></figure><p>This is the main public listing page, reachable at <code>/conferences</code>. The query's display config sets <code>"canonical_url": "/conferences"</code>, so all pager links and filter form actions stay on that path rather than the raw <code>/gather/ritrovo.upcoming_conferences</code> URL. When all exposed filters are empty (no user input), every filter resolves to null and is skipped — the query returns every upcoming conference. See "Exposed Filter Widgets" below for how each widget type works.</p>
    <p>The conference list is rendered as <strong>cards</strong> rather than a table. When the Trovato theme engine looks for a template to render a gather query, it first checks for a query-specific override at <code>templates/gather/query--{query_id}.html</code> before falling back to the generic <code>query.html</code>. The importer ships <code>templates/gather/query--ritrovo.upcoming_conferences.html</code>, which extends <code>query.html</code> and overrides the <code>query_content</code> block with a card grid:</p>
    <figure class="code"><pre class="code__body"><code>.card.card--conf
      ├── title (linked to /item/{id})
      ├── dates (field_start_date – field_end_date)
      ├── location (field_city, field_country)
      ├── description (field_description, if present)
      └── actions
            ├── View details → /item/{id}
            ├── Website ↗ (field_url, if present)
            └── CFP open until {date} — Submit a talk (if field_cfp_url + field_cfp_end_date)
    </code></pre></figure><h4>ritrovo.open_cfps</h4>
    <p>Conferences currently accepting talk proposals, sorted by deadline (soonest first).</p>
    <figure class="code"><pre class="code__body"><code>Hard filters:   field_cfp_end_date ≥ current_date
                    field_cfp_url is_not_null
    Sort:           field_cfp_end_date ASC (nulls last)
    </code></pre></figure><p>The <code>is_not_null</code> filter on <code>field_cfp_url</code> ensures only conferences with a submission link are shown — no CFP URL means there's nothing to link to.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-02/open-cfps.png"><img src="images/part-02/open-cfps.png" width="600" alt="Open CFPs listing showing conferences with active calls for papers sorted by deadline"></a></p>
    <h4>ritrovo.by_topic</h4>
    <p>Upcoming conferences filtered by a single topic UUID, including all descendant topics via recursive CTE.</p>
    <figure class="code"><pre class="code__body"><code>Hard filters:   field_start_date ≥ current_date
                    field_topics has_tag_or_descendants = url_arg(&quot;topic&quot;)
    Sort:           field_start_date ASC
    </code></pre></figure><p>This gather is driven by a <strong>gather route alias</strong> declared in the query's <code>display.routes</code> config. The <code>/topics/{slug}</code> route resolves the slug to a tag UUID via <code>category_tag.slug</code> and redirects to <code>/gather/ritrovo.by_topic?topic=&lt;uuid&gt;</code>. The <code>url_arg("topic")</code> value reads the <code>?topic=</code> query-string parameter at request time.</p>
    <h4>ritrovo.by_country and ritrovo.by_city</h4>
    <p>Location gathers driven by URL path segments.</p>
    <figure class="code"><pre class="code__body"><code>ritrovo.by_country:
      Hard filters:  field_start_date ≥ current_date
                     field_country equals url_arg(&quot;country&quot;)

    ritrovo.by_city:
      Hard filters:  field_start_date ≥ current_date
                     field_country equals url_arg(&quot;country&quot;)
                     field_city    equals url_arg(&quot;city&quot;)
    </code></pre></figure><p>Two separate gathers are used (rather than one gather with an optional city filter) to avoid the empty-string problem: if a single gather had an optional <code>url_arg("city")</code> filter, a request without <code>?city=</code> would resolve to an empty string, which would match no conferences — not the same as "all conferences in this country". The two-gather design sidesteps this entirely: the gather route aliases map <code>/location/{country}</code> to <code>by_country</code> and <code>/location/{country}/{city}</code> to <code>by_city</code>.</p>
    <h3>Exposed Filter Widgets</h3>
    <p>The <code>ritrovo.upcoming_conferences</code> gather has four exposed filters, each using a different widget type. Without explicit widget configuration, every exposed filter renders as a plain text input — acceptable for free-text searches but awkward for boolean fields and fields with a small set of known values.</p>
    <p>Each filter declares its widget in the <code>"widget"</code> key of its filter JSON:</p>
