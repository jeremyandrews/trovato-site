    <p><code>merge_topics(existing, new_uuid: Option&lt;&amp;str&gt;)</code> adds the UUID to the existing array only if it isn't already there, then sorts. When <code>new_uuid</code> is <code>None</code> (unmapped slug), the existing array is returned unchanged:</p>
