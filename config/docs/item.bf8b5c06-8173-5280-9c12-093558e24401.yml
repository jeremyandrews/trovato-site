    <h2>2.3 Hierarchical Topic Category</h2>
    <p>The importer stores each conference's topic as a <code>field_topics</code> array. In section 2.2, that array held raw confs.tech slug strings like <code>"rust"</code> and <code>"javascript"</code>. In this section, you'll replace those strings with <strong>category tag UUIDs</strong> from a proper category hierarchy — which unlocks hierarchical filtering ("show me all Languages conferences") via the <code>HasTagOrDescendants</code> gather operator.</p>
    <h3>The Category System</h3>
    <p>Trovato's category system organises tags into named groupings.</p>
    <table><thead><tr><th>Table</th><th>What it holds</th></tr></thead><tbody>
    <tr><th><code>category</code></th><th>A named grouping (e.g. "Conference Topics")</th></tr>
    <tr><th><code>category_tag</code></th><th>A single tag within a category (e.g. "Rust")</th></tr>
    <tr><th><code>category_tag_hierarchy</code></th><th>Parent→child edges (allows multi-level trees)</th></tr>
    </tbody></table>
    <p>A category tag is identified by a UUID generated at insert time. Items reference tags by UUID in their JSONB <code>fields</code>, typically as an array: <code>field_topics: ["&lt;uuid1&gt;", "&lt;uuid2&gt;"]</code>. The <code>HasTagOrDescendants</code> filter understands these UUIDs and their parent-child relationships.</p>
    <h3>Defining the Category in Configuration</h3>
    <p>The topic category is defined as YAML configuration files in <code>docs/tutorial/config/</code>. Each tag is a separate file (e.g. <code>tag.{uuid}.yml</code>) with its label, category, slug, weight, and parent references:</p>
    <figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-comment tok-line tok-number-sign tok-yaml"><span class="tok-punctuation tok-definition tok-comment tok-line tok-number-sign tok-yaml">#</span> tag.8835efe1-04a9-4dc4-bc4b-7d47ec387031.yml
    </span><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">id</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">8835efe1-04a9-4dc4-bc4b-7d47ec387031</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">category_id</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">topics</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">label</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">Ruby</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">slug</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">ruby</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">weight</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-constant tok-numeric tok-integer tok-yaml">4</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">parents</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
    <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">f95ddda0-58d4-4519-9965-91c86d74a459</span>  <span class="tok-comment tok-line tok-number-sign tok-yaml"><span class="tok-punctuation tok-definition tok-comment tok-line tok-number-sign tok-yaml">#</span> Web Languages
    </span></span></code></pre></figure><p>The <code>slug</code> field is a URL-safe identifier used by <strong>gather route aliases</strong> (see "Gather Route Aliases" below) to resolve friendly URLs like <code>/topics/ruby</code> to the tag's UUID. Slugs are unique within a category and stored in the <code>category_tag.slug</code> column.</p>
    <p>The category itself is also a YAML file:</p>
    <figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-comment tok-line tok-number-sign tok-yaml"><span class="tok-punctuation tok-definition tok-comment tok-line tok-number-sign tok-yaml">#</span> category.topics.yml
    </span><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">id</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">topics</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">label</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">Conference Topics</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">description</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">Hierarchical topic category for tech conferences</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">hierarchy</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-constant tok-numeric tok-integer tok-yaml">2</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">weight</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-constant tok-numeric tok-integer tok-yaml">0</span>
    </span></code></pre></figure><p>These files are imported via <code>cargo run --release --bin trovato -- config import docs/tutorial/config</code> before the plugin is installed. The config import system handles dependency ordering (categories before tags) and uses <code>ON CONFLICT DO UPDATE</code> for idempotency.</p>
    <p>Some confs.tech slugs (like <code>sre</code> and <code>scala</code>) are intentionally absent from the category. Conferences with those topics simply have an empty <code>field_topics</code> array — they are still imported, just not reachable via topic browse pages.</p>
    <h3>Discovering Tag UUIDs at Install Time</h3>
    <p>When <code>tap_install</code> runs, it calls <code>discover_category_uuids()</code>, which looks up each tag's UUID by label from the <code>category_tag</code> table and caches it in <code>ritrovo_state</code>. This cache is used by the <strong>import pipeline</strong> (queue worker) to map confs.tech topic slugs to tag UUIDs when inserting conferences — it is separate from the browse route slug resolution, which uses the <code>category_tag.slug</code> column directly:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">discover_category_uuids</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-storage tok-type tok-rust">u32</span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
