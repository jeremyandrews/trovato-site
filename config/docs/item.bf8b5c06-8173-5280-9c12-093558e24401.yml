        <span class="tok-keyword tok-control tok-rust">for</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>_confs_slug<span class="tok-punctuation tok-separator tok-rust">,</span> term_slug<span class="tok-punctuation tok-separator tok-rust">,</span> term_label</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">in</span> <span class="tok-constant tok-other tok-rust">SLUG_TO_TERM</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
