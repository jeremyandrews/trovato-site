        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>exposed<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-language tok-json">true</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>exposed_label<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>Online Only<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>widget<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>boolean<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span> </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>The <code>"widget"</code> key is optional — omitting it is equivalent to <code>{ "type": "text" }</code>. Existing query definitions without a <code>"widget"</code> key continue to work unchanged.</p>
    <h4>Boolean widget — <code>field_online</code></h4>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>widget<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>: <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>boolean<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span> </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Renders a <code>&lt;select&gt;</code> with three options: <strong>Any</strong> (empty, filter skipped), <strong>Yes</strong> (<code>true</code>), <strong>No</strong> (<code>false</code>). When the user chooses "Yes", the form submits <code>?fields.field_online=true</code>. The gather's <code>parse_filter_params</code> parses <code>"true"</code> as a JSON boolean, producing a <code>FilterValue::Boolean(true)</code> that the <code>equals</code> operator compares correctly.</p>
    <p>This is the right widget for any field that stores <code>true</code>/<code>false</code> — it's more usable than a text box asking users to type the word "true".</p>
    <h4>Category select widget — <code>field_topics</code></h4>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>widget<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>: <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>category_select<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>category<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>topics<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span> </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>Renders a <code>&lt;select&gt;</code> populated from the "topics" category. The kernel loads all tags with their hierarchy depth using <code>CategoryService::list_tags_with_depth()</code>, which returns them in DFS pre-order so that each parent immediately precedes its children. Child terms are indented with non-breaking spaces proportional to depth:</p>
    <figure class="code"><pre class="code__body"><code>Any
    Languages
      Systems
        Rust
        C++
        .NET
      JVM
        Java
      Scripting
        Python
        JavaScript
        ...
    Infrastructure
      Cloud &amp; DevOps
      ...
    </code></pre></figure><p>When the user selects "Systems", the form submits the UUID of the "Systems" tag. The <code>has_tag_or_descendants</code> operator then expands that UUID to include "Rust", "C++", ".NET", and any future child terms — the user selected a high-level concept and automatically gets all its concrete children.</p>
    <p>The category select is the right widget whenever a filter uses <code>has_tag</code> or <code>has_tag_or_descendants</code>: it shows meaningful human labels, not raw UUIDs.</p>
    <h4>Dynamic options widget — <code>field_country</code> and <code>field_language</code></h4>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>widget<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span>: <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>type<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>dynamic_options<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>source_field<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>fields.field_country<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span>
        <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>autocomplete_threshold<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">30</span>
    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>The kernel queries distinct non-null, non-empty values for <code>fields.field_country</code> across all published <code>conference</code> items (up to 200), caches the list for five minutes, and passes it to the renderer. The renderer then chooses:</p>
    <ul>
    <li><strong>≤ threshold (30)</strong> — a <code>&lt;select&gt;</code> dropdown listing every distinct value with an "Any" option at the top.</li>
    <li><strong>&gt; threshold (30)</strong> — a <code>&lt;input type="text"&gt;</code> with a <code>&lt;datalist&gt;</code> for browser-native autocomplete. The user can type freely and the browser offers matching suggestions.</li>
    </ul>
    <p>This dual-mode design handles two real situations: a small conference dataset early on (a handful of countries → clean dropdown) and a large dataset later (many countries → autocomplete).</p>
    <p>Both <code>field_country</code> and <code>field_language</code> use the <code>equals</code> operator, not <code>contains</code>. This is intentional: the dropdown and datalist surface exact values that are already in the database, so filtering by exact match is correct — there's no reason to do a partial <code>ILIKE</code> search when you're selecting from a known list. A text-input filter with <code>contains</code> was the old behaviour before widgets were introduced.</p>
    <h4>Widget rendering paths</h4>
    <p>The widget data is pre-fetched once per request in <code>preload_widget_data()</code> — category tags from the database, distinct values from the cache — and then passed to whichever rendering path is active:</p>
    <ul>
    <li><strong>Tera theme templates</strong> receive the widget type and option list as structured JSON in the <code>exposed_filters</code> context variable and branch on <code>filter.widget_type</code>.</li>
    <li><strong>Fallback HTML renderer</strong> (<code>render_exposed_filter_form</code>) generates the same HTML directly in Rust when no theme template exists.</li>
    </ul>
    <p>Both paths produce identical HTML, so switching between a custom template and the default fallback does not change the widget behaviour.</p>
    <h3>The /conferences, /cfps, and /location Routes</h3>
    <p>All browse routes are served through a combination of gather route aliases, URL aliases, and <code>canonical_url</code> — no plugin-specific kernel code required.</p>
    <p><strong>Location routes</strong> are declared as gather route aliases in the query YAML:</p>
    <figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-comment tok-line tok-number-sign tok-yaml"><span class="tok-punctuation tok-definition tok-comment tok-line tok-number-sign tok-yaml">#</span> gather_query.ritrovo.by_country.yml (display section)
    </span><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">display</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">routes</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">path</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">/location/{country}</span>
        <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">params</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
        <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">segment</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">country</span>
          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">param</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">country</span>
    </span></code></pre></figure><figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-comment tok-line tok-number-sign tok-yaml"><span class="tok-punctuation tok-definition tok-comment tok-line tok-number-sign tok-yaml">#</span> gather_query.ritrovo.by_city.yml (display section)
    </span><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">display</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">routes</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">path</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">/location/{country}/{city}</span>
        <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">params</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
        <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">segment</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">country</span>
          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">param</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">country</span>
        <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">segment</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">city</span>
          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">param</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">city</span>
    </span></code></pre></figure><p>These use <strong>pass-through</strong> parameter mapping — the path segment values are forwarded directly as gather query parameters and the query renders inline:</p>
    <figure class="code"><pre class="code__body"><code>GET /location/Germany        →  200  (renders ritrovo.by_country inline with country=Germany)
    GET /location/Germany/Berlin →  200  (renders ritrovo.by_city inline with country=Germany&amp;city=Berlin)
    </code></pre></figure><p><strong><code>/conferences</code> and <code>/cfps</code></strong> work differently. The <code>ritrovo.upcoming_conferences</code> and <code>ritrovo.open_cfps</code> gather queries set a <code>canonical_url</code> field in their display configuration:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>canonical_url<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/conferences<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span> </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>canonical_url<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/cfps<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span> </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><p>When the gather route handler serves a query that has <code>canonical_url</code> set, it uses that path as <code>base_path</code> for all generated URLs — form actions, pager links, and filter parameters all stay on the friendly path. Filtering by country and navigating to page 2 produces <code>GET /conferences?fields.field_country=Germany&amp;page=2</code>, not <code>GET /gather/ritrovo.upcoming_conferences?…</code>.</p>
    <p>The URL alias for <code>/conferences</code> → <code>/gather/ritrovo.upcoming_conferences</code> is defined in the tutorial config YAML and imported via <code>config import</code>. The config import uses <code>ON CONFLICT DO UPDATE</code>, so re-importing safely updates the alias if it already exists from Part 1.</p>
    <blockquote>
    <p><strong>Why not a dedicated route?</strong> The earlier design used a thin Rust handler at <code>GET /conferences</code> that called <code>execute_and_render("ritrovo.upcoming_conferences", …, "/conferences")</code>. This was a kernel minimality violation — feature plumbing with no logic beyond setting a path string. <code>canonical_url</code> and <code>display.routes</code> express the same intent in configuration, with no Rust required.</p>
    </blockquote>
    <h3>Sealing the Raw Gather URLs</h3>
    <p>Even with <code>canonical_url</code> set, <code>/gather/ritrovo.upcoming_conferences</code> is still a valid path — the gather engine serves it too. A user arriving there (via a bookmark, browser history, or an old link) would see the filter form submit back to the raw gather URL, breaking the stable-URL contract.</p>
    <p>The kernel handles this automatically: when the gather service loads queries from the database, its <code>sync_canonical_redirects()</code> method creates 301 redirects for any query that has a <code>canonical_url</code> in its display config:</p>
    <figure class="code"><pre class="code__body"><code>/gather/ritrovo.upcoming_conferences  →  301  /conferences
    /gather/ritrovo.open_cfps             →  301  /cfps
    </code></pre></figure><p>The kernel's redirects middleware intercepts these paths before routing and sends the browser to the canonical URL. Any subsequent filter submission or page navigation then stays on <code>/conferences</code> or <code>/cfps</code> as intended.</p>
    <p>No plugin code is needed for this — the redirects are created by the kernel whenever it detects a <code>canonical_url</code> on a gather query, whether that query was imported via config or created through the admin UI.</p>
    <p>Gather route aliases are <strong>kernel infrastructure</strong>, not plugin-gated. They are registered at startup from whatever gather queries exist in the database — if the queries are present (via config import), the routes work regardless of whether the plugin that populated the data is enabled. This is consistent with the principle that browse routes are configuration, not plugin features.</p>
    <blockquote>
    <p><strong>Note:</strong> Because gather route aliases are built at startup, changes to <code>display.routes</code> in the config YAML require a config reimport followed by a server restart to take effect.</p>
    </blockquote>
    <h3>Configuration vs Plugin: The Division of Labor</h3>
    <p>The Ritrovo tutorial demonstrates a clean separation of concerns:</p>
    <ul>
    <li><p><strong>Configuration</strong> (YAML files, imported via <code>config import</code>): categories, gather queries, URL aliases. These are core Trovato concepts with first-class config support — they can be exported from one site and imported to another, version-controlled in git, and edited without touching plugin code.</p>
    </li>
    <li><p><strong>Plugin</strong> (WASM module, runs in sandbox): discovering category tag UUIDs from the imported config, fetching external data from the confs.tech API, validating and deduplicating conferences, queue management. These are import-specific operations that the kernel doesn't provide.</p>
    </li>
    </ul>
    <p>This separation means you can modify the gather query definitions (add new filters, change sort orders, update display config) by editing the YAML files and re-importing — no plugin rebuild required. The plugin only needs to change when the <em>import logic</em> changes (e.g. a new field from the upstream API, a different dedup strategy).</p>
    <blockquote>
    <p><strong>Design principle:</strong> The core kernel enables. Plugins implement. If it's a feature definition (a gather query, a category, a URL alias), it belongs in configuration. If it's an integration with an external system, it belongs in a plugin.</p>
    </blockquote>
    <hr />
    <p>With the category, gather queries, browse routes, and filter widgets in place, Ritrovo visitors can:</p>
    <ul>
    <li>Browse all upcoming conferences at <code>/conferences</code>, filtering with purpose-built controls:<ul>
    <li>A hierarchical topic selector (Any → Languages → Rust)</li>
    <li>A country dropdown or autocomplete based on values actually in the database</li>
    <li>An Online Only selector (Any / Yes / No)</li>
    <li>A language dropdown or autocomplete</li>
    </ul>
    </li>
    <li>Drill into a topic tree at <code>/topics/rust</code> (or <code>/topics/languages</code> for everything under that branch)</li>
    <li>Find open CFPs at <code>/cfps</code></li>
    <li>Filter by country at <code>/location/Germany</code> and by city at <code>/location/Germany/Berlin</code></li>
    </ul>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-02/search-results.png"><img src="images/part-02/search-results.png" width="600" alt="Search results page showing conferences matching a search query with relevance ranking"></a></p>
    <p>The gather engine handles filtering, pagination, widget data loading, and rendering. The query definitions, category, and URL aliases are all managed as configuration — the plugin's only job is discovering category tag UUIDs and importing conference data from the external API.</p>
