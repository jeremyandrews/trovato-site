    </span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure><h3>Validation Rules</h3>
    <p>The importer rejects entries that would create unusable or nonsensical data. Invalid entries are logged with a human-readable reason and counted as <code>invalid</code> in the worker's summary — they are never silently dropped.</p>
    <table><thead><tr><th>Rule</th><th>Condition</th><th>Log message example</th></tr></thead><tbody>
    <tr><th>Name required</th><th><code>name</code> must be non-empty</th><th><code>missing required field: name</code></th></tr>
    <tr><th>Start date required</th><th><code>startDate</code> must be non-empty</th><th><code>missing required field: startDate</code></th></tr>
    <tr><th>End date required</th><th><code>endDate</code> must be non-empty</th><th><code>missing required field: endDate</code></th></tr>
    <tr><th>Date format</th><th>Must match <code>YYYY-MM-DD</code>, year 2010–2035</th><th><code>invalid startDate format: '01-09-2026'</code></th></tr>
    <tr><th>Date ordering</th><th><code>endDate</code> ≥ <code>startDate</code></th><th><code>endDate '2026-08-31' is before startDate '2026-09-01'</code></th></tr>
    <tr><th>CFP ordering</th><th><code>cfpEndDate</code> ≤ <code>startDate</code> (if present)</th><th><code>cfpEndDate '2026-10-01' is after startDate '2026-09-01'</code></th></tr>
    </tbody></table>
    <h3>Deduplication: Source ID</h3>
    <p>The same conference can appear in multiple topic files (e.g., <code>rust.json</code> and <code>systems.json</code> may both list RustConf). Without deduplication, each import cycle would create duplicates.</p>
    <p>The importer uses a stable <code>source_id</code> field to identify conferences across runs and topics:</p>
    <figure class="code"><pre class="code__body"><code>source_id = slugify(name) + &quot;-&quot; + start_date + &quot;-&quot; + slugify(city ?? &quot;online&quot;)
    </code></pre></figure><p>Examples:</p>
    <table><thead><tr><th>name</th><th>startDate</th><th>city</th><th>source_id</th></tr></thead><tbody>
    <tr><th>RustConf</th><th>2026-09-01</th><th>Portland</th><th><code>rustconf-2026-09-01-portland</code></th></tr>
    <tr><th>Vue.js Nation</th><th>2025-01-29</th><th><em>(none)</em></th><th><code>vue-js-nation-2025-01-29-online</code></th></tr>
    <tr><th>C++ Now!</th><th>2026-05-05</th><th>Aspen</th><th><code>c-now-2026-05-05-aspen</code></th></tr>
    </tbody></table>
    <p>Before inserting, the worker loads all existing conference items' <code>field_source_id</code> values into a <code>HashMap</code>. Lookup is O(1); the entire dedup check is a single DB query per batch rather than one per conference.</p>
    <p>When a conference is found by <code>source_id</code>, the worker <strong>updates</strong> it using JSONB merge (<code>fields = fields || $new::jsonb</code>). This overwrites source-derived fields (dates, URL, city, country) while preserving fields the Ritrovo editor may have added manually, like <code>field_description</code> and <code>field_editor_notes</code>.</p>
    <p>When a conference appears in a new topic file for the first time, the worker merges the topic into the existing <code>field_topics</code> array rather than replacing it. RustConf filed under both "rust" and "systems" will have <code>field_topics: ["rust", "systems"]</code>.</p>
    <h3>Concurrent Worker Safety</h3>
    <p>The HashMap dedup is sufficient for sequential processing, but the queue runs with <code>concurrency = 4</code>. This creates a race window: if four workers each process a different topic file that contains the same conference, they all load the HashMap <strong>before</strong> any insert commits, all see the conference as missing, and all INSERT — producing 3–4 copies with different <code>field_topics</code> arrays.</p>
    <p>The importer defends against this with two layers:</p>
    <p><strong>Database-level uniqueness.</strong> Migration <code>002_dedup_conferences.sql</code> creates a unique partial index:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">UNIQUE INDEX</span> <span class="tok-entity tok-name tok-function tok-sql">uniq_item_conference_source_id</span></span>
        <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> item ((fields<span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_source_id<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>))
        <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> type <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>conference<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
          <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> fields<span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_source_id<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">IS NOT NULL</span>
          <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> fields<span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_source_id<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-operator tok-comparison tok-sql">!=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span><span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>;
    </span></code></pre></figure><p>This makes it impossible for any two <code>conference</code> items to share a <code>field_source_id</code>, regardless of which code path inserted them.</p>
    <p><strong>Upsert on insert.</strong> <code>insert_conference</code> uses <code>INSERT … ON CONFLICT DO UPDATE</code> rather than a plain <code>INSERT</code>. When a concurrent worker races past the HashMap check, the conflicting insert becomes an update that merges <code>field_topics</code> at the SQL level:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> CONFLICT ((fields<span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_source_id<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>))
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> type <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>conference<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
      <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> fields<span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_source_id<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">IS NOT NULL</span>
      <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> fields<span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_source_id<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-operator tok-comparison tok-sql">!=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span><span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
    DO <span class="tok-keyword tok-other tok-DML tok-sql">UPDATE</span> <span class="tok-keyword tok-other tok-DML tok-sql">SET</span>
      title   <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">title</span>,
      changed <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">changed</span>,
      fields  <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">item</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span>
             <span class="tok-keyword tok-operator tok-concatenator tok-sql">||</span> (<span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span> <span class="tok-keyword tok-operator tok-math tok-sql">-</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_topics<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>)
             <span class="tok-keyword tok-operator tok-concatenator tok-sql">||</span> jsonb_build_object(
                  <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_topics<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>,
                  (<span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> COALESCE(jsonb_agg(t <span class="tok-keyword tok-other tok-DML tok-sql">ORDER BY</span> t), <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>[]<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>::jsonb)
                   <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> (
                     <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> jsonb_array_elements_text(<span class="tok-constant tok-other tok-database-name tok-sql">item</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span><span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_topics<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>)
                     <span class="tok-keyword tok-other tok-DML tok-sql">UNION</span>
                     <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> jsonb_array_elements_text(<span class="tok-constant tok-other tok-database-name tok-sql">EXCLUDED</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span><span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_topics<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>)
                   ) u(t))
                )
    </span></code></pre></figure><p>The <code>UNION</code> (not <code>UNION ALL</code>) deduplicates topic UUIDs before aggregating, so however many workers race to insert the same conference, the result is always a single row with all the correct topics merged in.</p>
    <blockquote>
    <p><strong>Design note:</strong> The HashMap path (<code>update_conference</code>) is still the primary hot path — it handles sequential imports and day-to-day cron runs cheaply. The upsert is the safety net that makes concurrent imports correct even when the application-level check races.</p>
    </blockquote>
    <h3>Field Mapping</h3>
    <p>The confs.tech JSON schema maps to <code>conference</code> item fields as follows:</p>
    <table><thead><tr><th>confs.tech field</th><th>item field</th><th>notes</th></tr></thead><tbody>
    <tr><th><code>name</code></th><th><code>title</code> (item column)</th><th>required</th></tr>
    <tr><th><code>url</code></th><th><code>field_url</code></th><th>omitted if empty</th></tr>
    <tr><th><code>startDate</code></th><th><code>field_start_date</code></th><th>required; YYYY-MM-DD</th></tr>
    <tr><th><code>endDate</code></th><th><code>field_end_date</code></th><th>required; YYYY-MM-DD</th></tr>
    <tr><th><code>city</code></th><th><code>field_city</code></th><th>optional</th></tr>
    <tr><th><code>country</code></th><th><code>field_country</code></th><th>optional</th></tr>
    <tr><th><code>online</code></th><th><code>field_online</code></th><th>defaults to <code>false</code></th></tr>
    <tr><th><code>cfpUrl</code></th><th><code>field_cfp_url</code></th><th>optional</th></tr>
    <tr><th><code>cfpEndDate</code></th><th><code>field_cfp_end_date</code></th><th>optional</th></tr>
    <tr><th><code>locales</code></th><th><code>field_language</code></th><th>optional</th></tr>
    <tr><th><code>twitter</code></th><th><code>field_twitter</code></th><th>optional</th></tr>
    <tr><th><code>cocUrl</code></th><th><code>field_coc_url</code></th><th>optional</th></tr>
    <tr><th><em>(computed)</em></th><th><code>field_source_id</code></th><th>see dedup section</th></tr>
    <tr><th><em>(from queue payload)</em></th><th><code>field_topics</code></th><th>accumulated across topic files</th></tr>
    </tbody></table>
    <p>Newly inserted conferences are created as <strong>published</strong> (<code>status = 1</code>) on the live stage, so they appear immediately in the public browse pages without requiring a manual publish step.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-02/conferences-imported.png"><img src="images/part-02/conferences-imported.png" width="600" alt="Conferences listing after import showing imported conference cards"></a></p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-02/admin-content-list.png"><img src="images/part-02/admin-content-list.png" width="600" alt="Admin content list showing imported conferences in the management interface"></a></p>
    <h3>Historical Import: tap_install</h3>
    <p>When the plugin is first enabled, <code>tap_install</code> first discovers category tag UUIDs from the config-imported <code>category_tag</code> rows (caching them in <code>ritrovo_state</code> for the queue worker), then runs a full historical backfill. It fetches every topic file for every year from 2015 to the current year, stores ETags, and pushes each successful response onto the queue:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-keyword tok-control tok-rust">for</span> year <span class="tok-keyword tok-operator tok-rust">in</span> <span class="tok-constant tok-other tok-rust">FIRST_IMPORT_YEAR</span><span class="tok-keyword tok-operator tok-rust">..</span><span class="tok-keyword tok-operator tok-rust">=</span>current_year <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>   <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> 2015..=now
    </span>    <span class="tok-keyword tok-control tok-rust">for</span> topic <span class="tok-keyword tok-operator tok-rust">in</span> <span class="tok-constant tok-other tok-rust">TOPICS</span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> GET https://raw.githubusercontent.com/…/{year}/{topic}.json
    </span>        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> On 200: store ETag, push payload onto queue
    </span>        <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> On 404: skip (not all topics exist for every year)
    </span>    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span></code></pre></figure><p>The <code>tap_install</code> function does not wait for the queue to drain. It exits quickly after pushing all the jobs, and the actual DB writes happen over subsequent cron cycles as the kernel drains the queue at the configured concurrency.</p>
    <blockquote>
    <p><strong>Note:</strong> <code>tap_install</code> uses <code>host::query_raw("SELECT EXTRACT(YEAR FROM NOW())::int AS y", &amp;[])</code> to get the current year. WASM plugins do not have access to the system clock directly — the DB is the authoritative time source.</p>
    </blockquote>
