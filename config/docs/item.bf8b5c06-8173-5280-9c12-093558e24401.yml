        topics
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>This means conferences tagged with both <code>rust</code> and <code>systems</code> by two separate confs.tech files accumulate both UUIDs — and a query for "Languages" (the grandparent of both) will still find them.</p>
    <h3>The HasTagOrDescendants Operator</h3>
    <p>Trovato's gather engine supports a <code>has_tag_or_descendants</code> filter operator. When the gather service encounters this operator, it first expands the given tag UUID into the full set of descendant UUIDs using a recursive CTE:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-keyword tok-other tok-DML tok-sql">WITH</span> RECURSIVE descendants <span class="tok-keyword tok-other tok-alias tok-sql">AS</span> (
        <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> tag_id <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> category_tag_hierarchy <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> parent_id <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> $<span class="tok-constant tok-numeric tok-sql">1</span>
        <span class="tok-keyword tok-other tok-DML tok-sql">UNION ALL</span>
        <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> <span class="tok-constant tok-other tok-database-name tok-sql">h</span>.<span class="tok-constant tok-other tok-table-name tok-sql">tag_id</span> <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> category_tag_hierarchy h
        <span class="tok-keyword tok-other tok-DML tok-sql">JOIN</span> descendants d <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> <span class="tok-constant tok-other tok-database-name tok-sql">h</span>.<span class="tok-constant tok-other tok-table-name tok-sql">parent_id</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">d</span>.<span class="tok-constant tok-other tok-table-name tok-sql">tag_id</span>
    )
    <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> tag_id <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> descendants
    <span class="tok-keyword tok-other tok-DML tok-sql">UNION ALL</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> $<span class="tok-constant tok-numeric tok-sql">1</span>::uuid  <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> include the tag itself
    </span></span></code></pre></figure><p>The filter is then rewritten to <code>HasAnyTag</code> with the full expanded list. A query for "Languages" (<code>uuid = xxxxxxxx-…</code>) automatically matches conferences tagged with "Systems", "Rust", "C++", ".NET", "JVM", "Java", "JavaScript", "Python", "Go", and any other term descending from "Languages".</p>
    <blockquote>
    <p><strong>Null handling:</strong> When a <code>has_tag_or_descendants</code> filter has a null value — as happens when an exposed filter has no user input — the gather service skips the filter entirely rather than erroring. This lets the same gather definition work both as an exposed filter form (no value → show all) and as a driven query (value provided → filter by topic).</p>
    </blockquote>
    <h3>Gather Route Aliases</h3>
    <p>The kernel's <code>gather_routes</code> module provides a generic mechanism for mapping friendly URLs to gather queries. Rather than hard-coding routes for each plugin, route aliases are declared in the gather query's <code>display.routes</code> YAML configuration and registered dynamically at startup.</p>
    <p>Each route alias defines a URL path pattern and a list of parameter mappings. Two mapping modes are supported:</p>
    <table><thead><tr><th>Mode</th><th>Config</th><th>Behaviour</th></tr></thead><tbody>
    <tr><th><strong>Pass-through</strong></th><th><code>segment</code> + <code>param</code></th><th>Path segment value is passed directly as a gather query parameter</th></tr>
    <tr><th><strong>Tag slug lookup</strong></th><th><code>segment</code> + <code>param</code> + <code>tag_category</code></th><th>Path segment is resolved to a tag UUID via <code>category_tag.slug</code>, then the UUID is passed</th></tr>
    </tbody></table>
    <p>For the <code>/topics/{slug}</code> route, the <code>ritrovo.by_topic</code> gather query declares:</p>
    <figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-comment tok-line tok-number-sign tok-yaml"><span class="tok-punctuation tok-definition tok-comment tok-line tok-number-sign tok-yaml">#</span> gather_query.ritrovo.by_topic.yml (display section)
    </span><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">display</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">routes</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">path</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">/topics/{slug}</span>
        <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">params</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
        <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">segment</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">slug</span>
          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">param</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">topic</span>
          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">tag_category</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">topics</span>
    </span></code></pre></figure><p>When a request arrives at <code>/topics/rust</code>, the handler:</p>
    <ol>
    <li>Validates the slug (non-empty, ≤ 128 chars, alphanumeric + <code>-</code>/<code>_</code> only).</li>
    <li>Looks up the tag by slug in the <code>category_tag</code> table: <code>SELECT ... WHERE category_id = 'topics' AND slug = 'rust'</code>.</li>
    <li>Returns 404 if the slug is unknown.</li>
    <li>Renders the gather query inline at <code>/topics/rust</code>, preserving any extra query parameters (e.g. <code>?page=2</code>).</li>
    </ol>
    <p>The tag slug column (<code>category_tag.slug</code>, added by the <code>20260307000001_add_category_tag_slug</code> kernel migration) is what makes this generic — any category's tags can have slugs, so any gather query can use slug-based route aliases without plugin-specific code. Slugs are unique per category via a partial unique index.</p>
    <p>The inline rendering approach means the pretty URL stays in the browser address bar while reusing the gather engine's full HTML rendering pipeline — no duplication of display logic and no ugly UUID-based redirect URLs.</p>
    <blockquote>
    <p><strong>URL design choice:</strong> <code>/topics/rust</code> renders the gather query inline. The raw gather URL (<code>/gather/ritrovo.by_topic?topic=&lt;uuid&gt;</code>) is also bookmarkable and works independently of the slug route, but the 301 canonical redirect (see §2.4) sends users back to the pretty URL.</p>
    </blockquote>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-02/topics-listing.png"><img src="images/part-02/topics-listing.png" width="600" alt="Topics listing page showing the hierarchical topic category with browsable tags"></a></p>
    <hr />
    <h2>2.4 Advanced Gathers</h2>
    <p>Trovato's gather system converts a declarative JSON query definition into a paginated, optionally-filtered SQL query. In this section you'll see how the importer seeds its five gather queries, and how two kinds of dynamic filter values — contextual values and exposed filters — allow a single query definition to serve both public browse pages and editor search forms.</p>
    <h3>What a Gather Query Looks Like</h3>
    <p>A gather query is stored in the <code>gather_query</code> table with two JSONB columns:</p>
    <ul>
    <li><strong><code>definition</code></strong> — the query: filters, sorts, joins, item type</li>
    <li><strong><code>display</code></strong> — rendering configuration: format (table/card/tile), items per page, pager style, empty text</li>
    </ul>
    <p>Here is a complete example:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span>
