    <h1>Known issues</h1>
    <p>What is outstanding in 0.101.0. This is the list that would otherwise be a
    surprise, so it is written down rather than discovered.</p>
    <p>Trovato was developed privately and is published as a pre-1.0 release for
    exactly the reasons on this page. Nothing here is a secret being managed; it is
    a backlog being worked in the open. <a href="/learn/roadmap">ROADMAP.md</a> says what happens
    to each item.</p>
    <h2>Security</h2>
    <h3>Security findings from private development are not independently verified</h3>
    <p>Several security audits were run during private development and their findings
    were addressed, but the fixes have not been re-verified by anyone other than the
    person who made them, and the audits themselves were not independent. Treat the
    security posture as "reviewed once, by the author" until that changes. Reviewing
    those findings on a public codebase is a 1.0 blocker.</p>
    <h3>Page-builder components accept arbitrary inline CSS</h3>
    <p><code>crates/kernel/src/content/page_builder.rs:91</code> carries a TODO to restrict
    allowed CSS properties to an allowlist. The Ammonia sanitizer currently permits
    the <code>style</code> attribute wholesale, so a component's markup can carry any
    declaration it likes. HTML tags and non-style attributes are constrained; CSS
    properties are not.</p>
    <p>This is related to the item below and the two should be fixed together.</p>
    <h3>Content-Security-Policy still allows inline styles</h3>
    <p><code>style-src</code> keeps <code>'unsafe-inline'</code>
    (<code>crates/kernel/src/middleware/security_headers.rs</code>) because the base template
    and the admin screens carry inline <code>style=</code> attributes. <code>script-src</code> no longer
    needs it, so this is the last inline exception. Extracting the styles allows the
    directive to be tightened, which is also what makes the page-builder allowlist
    above worth having.</p>
    <h3>Dependency advisories are suppressed with justifications</h3>
    <p><code>cargo audit</code> runs in CI and <code>.cargo/audit.toml</code> lists what is suppressed and
    why. Each entry has reasoning; none is suppressed silently. The open ones:</p>
    <p>Every wasmtime and cranelift advisory is <strong>fixed rather than suppressed</strong>:
    RUSTSEC-2026-0085 through -0096, -0114 and -0222 all cleared by upgrading the
    runtime to wasmtime 47.0.3. Nothing about the plugin sandbox is being carried on
    a justification.</p>
    <p>Five suppressions remain, none of them in the WASM runtime:</p>
    <ul>
    <li><strong>RUSTSEC-2026-0194 / RUSTSEC-2026-0195</strong> (quick-xml denial of service): the
    live one. Reachable only through <code>plist</code> and <code>syntect</code>, which parse the
    bundled syntax-highlighting theme files at startup rather than anything an
    attacker supplies. The fix is quick-xml 0.41, and <code>plist</code> pins <code>^0.38</code>, so it
    needs an upstream release before Trovato can take it.</li>
    <li><strong>RUSTSEC-2026-0189</strong> (rmcp DNS rebinding, CVSS 8.8): not compiled. The
    vulnerable code is rmcp's Streamable HTTP server transport, behind the
    <code>transport-streamable-http-server</code> feature. <code>trovato-mcp</code> enables only
    <code>transport-io</code> and serves over STDIO, so the MCP server has no HTTP listener
    to rebind against. The fix is rmcp 1.4, a major bump with breaking API
    changes; worth taking on its own merits, but not a live exposure.</li>
    <li><strong>RUSTSEC-2026-0141</strong> (lettre TLS hostname verification with the Boring
    backend): not applicable. Trovato builds lettre with <code>default-features = false</code> and the rustls backend, so the vulnerable code is never compiled.</li>
    <li><strong>RUSTSEC-2023-0071</strong> (rsa timing sidechannel): transitive through
    <code>sqlx-mysql</code>; Trovato uses PostgreSQL only.</li>
    </ul>
    <h2>Completeness</h2>
    <h3>There is no plugin registry, and no package format</h3>
    <p>A plugin is a directory containing a compiled <code>.wasm</code>, an <code>.info.toml</code> manifest
    and any migrations. <code>trovato plugin install &lt;name&gt;</code> takes a machine name and
    reads it from the plugin search path. There is no archive format, no install
    from a URL, and no index to discover plugins from. Distribution today means
    telling someone where the directory is.</p>
    <p><code>PLUGINS_DIR</code>, <code>TEMPLATES_DIR</code> and <code>STATIC_DIR</code> accept several directories, so
    an application can keep its plugins, templates and assets in its own repository
    rather than inside a Trovato checkout. That is the mechanism a package format
    would eventually build on. Each directory still has to be named in the search
    path by hand; a plugin's own <code>static/</code> and <code>templates/</code> subdirectories are not
    discovered automatically.</p>
    <h3>The committed reference plugin is a binary artifact</h3>
    <p><code>plugins/ritrovo_importer/ritrovo_importer.wasm</code> is a compiled binary in a source
    repository, which is something to resolve rather than keep. It is now at least
    <strong>reproducible from public sources</strong>, which it was not: the header of
    <code>crates/kernel/tests/ritrovo_paired_consumer_test.rs</code> records the sha256 (asserted by
    a test in that file), the Ritrovo commit it was built from, and the revision of <em>this</em>
    repository that commit pins its SDK at. The recipe there was run from a fresh clone
    and produced the artifact byte for byte.</p>
    <p>Two corrections to what this entry used to say. It claimed the artifact "is checked in
    so the tutorial works without a second repository", and that is not true in either
    half: the directory holds the <code>.wasm</code> and <strong>no <code>.info.toml</code> and no migrations</strong>, so the
    plugin loader skips it —</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>WARN trovato::plugin::runtime: no .info.toml file found, skipping
         dir=…/trovato/plugins/ritrovo_importer
    </code></pre></figure><p>— and <code>docs/tutorial/part-02-ritrovo-importer.md</code> has been stale since Ritrovo moved to
    its own repository. It tells the reader to read the plugin's source (not here), to run
    <code>cargo build -p ritrovo_importer</code> (not a workspace member), and that the manifest
    declares <code>default_enabled = true</code> (there is no manifest here, and the real one says
    false). Rewriting that tutorial part is its own piece of work.</p>
    <p>What the artifact is actually for is the paired-consumer test: a real external plugin,
    built from public sources against the published SDK, loading on this kernel and running
    through the plugin-queue drain. That is worth having. Whether it is worth having as a
    committed binary, rather than fetched from a Ritrovo release, is the open question.</p>
    <h3>Languages are configuration import only, on purpose</h3>
    <p>A site's language set is part of its definition rather than something an operator
    changes while running it: it is decided once, it belongs in the config set that a
    deployment applies, and <code>language.{code}.yml</code> is that. So there is no admin screen
    for it, and this is a decision rather than a gap.</p>
    <p>The other half of the reasoning is that a language screen on its own would not help
    much. Adding a language row is the small part of adding a language; the work is the
    interface strings, which <code>trovato_locale</code> handles at <code>/admin/config/locale</code> by
    importing <code>.po</code> files, and the content translations, which
    <code>trovato_content_translation</code> handles per item. A form that adds a row and leaves an
    operator to do both of those anyway would look like the feature without being it.</p>
    <p><code>crates/kernel/tests/config_admin_coverage_test.rs</code> holds this decision as a table:
    every config entity type there either names a screen that must serve or names the
    sentence above, and a new config entity type fails that test until somebody decides
    which it is.</p>
    <h3>What is configuration import only, in full</h3>
    <p><strong>Twelve of the thirteen config entity types have an admin screen</strong>, and the
    thirteenth (<code>language</code>) is import-only by the decision above. That leaves the
    <code>variable</code> type, which is a key/value store rather than one thing, and so is
    partly covered:</p>
    <table><thead><tr><th>Setting</th><th>Screen</th></tr></thead><tbody>
    <tr><th><code>site_name</code>, <code>site_slogan</code>, <code>site_mail</code>, <code>front_page</code>, <code>items_per_page</code>, registration mode, the SMTP settings, <code>notify_admin_on_register</code>, <code>update_check</code></th><th><code>/admin/config/site</code></th></tr>
    <tr><th><code>pathauto_patterns</code></th><th><code>/admin/config/pathauto</code></th></tr>
    <tr><th><code>robots_txt_custom</code></th><th><strong>none</strong></th></tr>
    <tr><th>Anything a plugin defines</th><th><strong>none</strong></th></tr>
    </tbody></table>
    <p>There is deliberately <strong>no generic variable editor</strong>, and there should not be one.
    A form that writes arbitrary JSON into arbitrary <code>site_config</code> keys is a form that
    can break a site in ways the kernel parses at startup, with no validation possible
    because the schema is per key. What a specific variable needs is a specific field on
    a specific screen, which is how the covered ones got there.</p>
    <p>This list is no longer only prose. <code>crates/kernel/tests/config_admin_coverage_test.rs</code>
    holds the audit as a table: every config entity type either names an admin path that
    must serve for an administrator, and must not serve for an anonymous visitor, or
    names the sentence in <code>KNOWN-ISSUES.md</code> that records it as a deliberate decision. A
    new config entity type fails that test until somebody chooses.</p>
    <p>The prose version of this list drifted before, which is why: menus were listed among
    the types <em>with</em> screens for a while and did not have one.</p>
    <p>Because import is the only path for what remains, it refuses to apply a set
    containing a file it cannot parse: the run names every offending file, exits
    non-zero, and writes nothing. It used to skip such a file with a warning and report
    success, which meant an entity that never arrived with nothing that said why.</p>
    <h3>A plugin's permissions cannot be granted by config import</h3>
    <p>A role config file declares a <code>permissions</code> list and <code>config import</code> grants
    exactly that set, so a role now arrives able to do something. What it cannot
    declare is a permission belonging to a plugin.</p>
    <p>A plugin declares its permissions through <code>tap_perm</code>, which is declared in the WIT
    and <strong>not dispatched</strong> by the kernel (<code>crates/wit/kernel.wit</code> says so). So the
    kernel has no list of a plugin's permissions to validate against, and it refuses a
    permission string it has no evidence exists rather than granting one that matches
    nothing a permission check will ever ask for. The evidence it does accept is a
    permission some role in the database already holds, which is what lets an export
    of a site that uses plugin permissions re-import.</p>
    <p>The practical consequence: grant a plugin's permissions once at
    <code>/admin/people/permissions</code> (or by SQL), after which they can go in the config file
    like any other. The permission grid has the same limitation from the other side —
    it renders the kernel's list, so a plugin's permissions do not appear there either.
    Dispatching <code>tap_perm</code> is what fixes both, and it is additive to the plugin
    contract rather than a break of it.</p>
    <h3>Semantic search has no approximate index</h3>
    <p>Vector similarity is computed exactly, comparing against every candidate row.
    This is correct and it is fine at small scale; it does not stay fine as the
    corpus grows. There is no ivfflat or hnsw index on the embeddings table yet.</p>
    <h3>Migrations only move forward</h3>
    <p>There is no down migration and no rollback. Recovering from a bad migration
    means restoring the database. Plan accordingly before upgrading a production
    site.</p>
    <h3>Template reloading on file change is for development only</h3>
    <p>The filesystem watch that reloads templates is a development convenience. In
    production, templates are read at startup and a change needs a restart.</p>
    <h3>A revision's authorship can change, and nothing else about it can</h3>
    <p><code>item_revision</code> rows are immutable by database trigger: a revision is a snapshot,
    and a snapshot that can be edited is not a history. That invariant is now narrowed
    by one case. When an account is deleted, its revisions' <code>author_id</code> is set to the
    anonymous author; every other column must be byte-identical or the trigger still
    refuses.</p>
    <p>The narrowing is not a convenience. <code>item_revision.author_id</code> is
    <code>NOT NULL REFERENCES users(id)</code> with no <code>ON DELETE</code> action, so the trigger and the
    foreign key together made an account that had ever saved an item <strong>undeletable</strong> —
    which is what self-service account deletion ran into, and which the admin delete
    screen had been quietly failing on all along. The alternatives were deleting other
    people's content history or refusing erasure to anyone who ever wrote anything.</p>
    <p>The enforcement compares whole rows (<code>to_jsonb(NEW) - 'author_id'</code> against the same
    of <code>OLD</code>) rather than listing columns, so a column added to that table in future is
    covered rather than silently exempted. See
    <code>crates/kernel/migrations/20260819000001_allow_revision_author_anonymization.sql</code>,
    which carries the reasoning.</p>
    <h3>The two theme taps are declared and not dispatched</h3>
    <p><code>tap_theme</code> and <code>tap_preprocess_item</code> are in the WIT and nothing dispatches them.
    Each needs a decision first, and neither is what a plugin-served page uses to reach
    the theme — that is the <code>theme</code> field on the <code>tap_api</code> response, added at 0.101 and
    used by <code>plugins/trovato_contact</code>.</p>
    <p><code>tap_theme</code> is <code>() -&gt; string</code> and nothing consumes what it would return. In Drupal
    the equivalent registers templates, which needs template discovery and override
    resolution the kernel does not have.</p>
    <p><code>tap_preprocess_item</code> would let a plugin alter an item's render context, and the
    open question is which keys it may overwrite. <code>csrf_token</code>, <code>user_is_admin</code> and
    <code>content</code> are in that context, so "anything" is wrong; <code>breadcrumbs</code> is exactly
    what a plugin would legitimately want to change, so a blanket deny-list is wrong
    too. <code>crates/kernel/tests/plugin_surfaces_test.rs</code> pins the current state, so this
    entry cannot drift out of date without a test failing.</p>
    <h3>A plugin's outgoing mail is not rate-limited</h3>
    <p>The <code>mail</code> host interface refuses to send anywhere except the site's own contact
    address, so it cannot be used to reach strangers. It does not bound how <em>often</em> a
    plugin sends.</p>
    <p>The web-facing case is covered: a plugin-served POST falls into the <code>forms</code>
    rate-limit bucket per client IP like any other form post, so a contact form cannot
    flood the site owner faster than that bucket allows. A plugin sending from a cron
    tap or a queue worker is bounded by nothing, and could fill the owner's mailbox. A
    plugin is code the site owner installed, and one that declared <code>http</code> can already
    post anywhere, so this is a trust boundary rather than a hole — but it is worth
    knowing which of the two it is.</p>
    <h2>Contract and versioning</h2>
    <h3>The frozen plugin contract is enforced by policy, not by tooling</h3>
    <p>The plugin boundary is frozen and does not change before 1.0. The <code>SDK Semver Gate</code> CI job runs <code>cargo-semver-checks</code> against it, but under SemVer's 0.x rules
    a breaking change is permitted by a minor bump, so the gate cannot fail one.
    Until 1.0.0 the freeze is held by review. See
    <a href="/learn/design-versioning">docs/design/Versioning.md</a>.</p>
    <h3>An old pre-freeze manifest passes the version check</h3>
    <p>The compatibility rule is <code>major ==</code> and <code>minor &lt;=</code>, so a manifest declaring an
    early <code>api_version</code> such as <code>"0.2"</code> is accepted by a kernel at <code>(0, 101)</code>.
    Nothing was ever released against the pre-freeze API, so no such plugin exists
    outside this repository's own history, but the check is a compatibility gate and
    not a provenance check, and it is worth knowing which of the two it is.</p>
    <h2>Testing</h2>
    <h3>One notification test is timing-sensitive under coverage</h3>
    <p><code>the_pipeline_turns_a_summarized_story_into_a_dispatched_notification</code> in
    <code>crates/kernel/tests/argus_notify_test.rs</code> drives the real Argus WASM plugin and
    asserts that the notification captured the story as it stood when it was
    founded, with one member rather than two. It depends on a fixed 1200ms sleep
    winning a race against a second report joining the story.</p>
    <p>Under <code>cargo llvm-cov</code>, instrumentation slows execution enough that the race can
    go the other way, and the CI Coverage job fails with <code>article_count</code> 2. It
    passes on re-run and passes in the ordinary test job. Observed once on
    2026-08-16. If Coverage fails on that assertion, re-run it; the fix is to make
    the test wait on the state it needs instead of on a duration.</p>
    <h3>The local test gate is stronger than CI</h3>
    <p>CI splits the integration tests across three shards with three separate
    databases. A local <code>cargo test --all</code> runs every target against one database, so
    it catches cross-file interference through shared fixtures that CI can miss. The
    local run is the stronger gate; see CONTRIBUTING.md.</p>
