    <h1>Part 8: Production Ready</h1>
    <p>Part 7 took Ritrovo global with bilingual content and a REST API. Part 8 hardens everything for production: caching that scales, batch operations for bulk work, S3 storage for files, observability through metrics, and a test suite that proves it all works.</p>
    <p>This is the capstone. By the end, Ritrovo is not a demo — it is a production-grade conference platform backed by infrastructure that can handle real traffic, real data, and real failures.</p>
    <p><strong>Start state:</strong> A fully featured bilingual conference site with 5,000+ conferences, five plugins, threaded comments, subscriptions, and a REST API.
    <strong>End state:</strong> Two-tier caching with tag-based invalidation, batch operations for bulk content management, S3-compatible file storage, Prometheus metrics, cron with distributed locking, comprehensive test coverage, and load testing.</p>
    <blockquote>
    <p><strong>Implementation note:</strong> All infrastructure described in this part is fully implemented. The two-tier cache (<code>cache/mod.rs</code>, 330 lines), batch service (<code>batch/</code>, 349 lines), S3 storage (<code>file/storage.rs</code>, 403 lines), cron system (<code>cron/</code>, 1,379 lines), metrics endpoint (<code>metrics/</code>, 300 lines), and rate limiting (<code>middleware/rate_limit.rs</code>, 247 lines) are operational. The test suite has 727 unit tests and 325 integration tests across 15 test files. A load testing tool (<code>benchmarks/load-test/</code>, 327 lines) exists alongside the <code>goose</code> plugin for runtime performance monitoring.</p>
    </blockquote>
    <hr />
    <h2>Step 1: Two-Tier Caching</h2>
    <p>Every database query Ritrovo makes costs time. With 5,000+ conferences and multiple Gather queries per page, uncached queries would make the site sluggish. Trovato uses a <strong>two-tier cache</strong> to keep response times low.</p>
    <h3>The Architecture</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Request → L1 (Moka, in-process) → L2 (Redis, shared) → Database
    </code></pre></figure><p><strong>L1 (Moka):</strong> An in-process Rust cache with a 60-second TTL and 10,000-entry capacity. Hits are sub-microsecond — no network round-trip, no serialization. Each server instance has its own L1 cache.</p>
    <p><strong>L2 (Redis):</strong> A shared cache with a 5-minute TTL. All server instances share the same Redis, so a cache fill from one instance benefits all others. Slightly slower than L1 (network round-trip) but still faster than a database query.</p>
    <p><strong>Tag-based invalidation:</strong> When content changes, the kernel invalidates cache entries by tag rather than by key. Publishing a conference invalidates the <code>item:{id}</code> tag, which clears all cache entries tagged with that item — the detail page, every Gather listing that includes it, and the search results. This is implemented via Redis Lua scripts for atomicity.</p>
    <h3>Cache Configuration</h3>
    <p>Cache TTLs are configurable per service via environment variables:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">60</span>                    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Global default (seconds)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL_CONTENT_TYPES</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">60</span>      <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Content type registry</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL_GATHER_QUERIES</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">60</span>     <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Gather query definitions</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL_PERMISSIONS</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">60</span>        <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Permission lookups</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL_USERS</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">300</span>             <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> User data</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL_ITEMS</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">300</span>             <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Item lookups</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">CACHE_TTL_CATEGORIES</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">300</span>        <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Category/tag data</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>Items, users, and categories use longer TTLs (5 minutes) because they change less frequently than configuration.</p>
    <h3>Stage-Scoped Keys</h3>
    <p>Cache keys include the stage context so preview content never leaks into the live cache:</p>
    <ul>
    <li><strong>Live stage:</strong> bare key (e.g., <code>gather:upcoming_conferences:page:1</code>)</li>
    <li><strong>Non-live stages:</strong> prefixed key (e.g., <code>st:{stage_id}:gather:upcoming_conferences:page:1</code>)</li>
    </ul>
    <p>This means editors previewing draft content on the "Incoming" stage see their changes without polluting the cache that serves public visitors.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Cache stats are visible in Prometheus metrics</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> http://localhost:3000/metrics</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">grep</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> cache</span>
    </span></code></pre></figure><hr />
    <h2>Step 2: Batch Operations</h2>
    <p>Some operations are too large for a single HTTP request: reindexing 5,000 conferences, bulk-publishing staged content, regenerating all URL aliases. The <strong>batch system</strong> breaks these into trackable units of work with progress reporting.</p>
    <h3>How It Works</h3>
    <p>A batch operation is created with a type and parameters, then processed in chunks. Each chunk updates the progress counter, and the caller can poll for status:</p>
    <ol>
    <li><strong>Create:</strong> <code>POST /admin/batch</code> with operation type and parameters</li>
    <li><strong>Process:</strong> The kernel processes items in configurable chunk sizes</li>
    <li><strong>Poll:</strong> <code>GET /admin/batch/{id}</code> returns progress percentage and status</li>
    <li><strong>Complete:</strong> Final status includes result summary or error details</li>
    </ol>
    <h3>Batch States</h3>
    <table><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody>
    <tr><th><code>pending</code></th><th>Created, not yet started</th></tr>
    <tr><th><code>processing</code></th><th>Currently running, progress updating</th></tr>
    <tr><th><code>completed</code></th><th>Finished successfully</th></tr>
    <tr><th><code>failed</code></th><th>Stopped due to error</th></tr>
    </tbody></table>
    <h3>Built-in Batch Operations</h3>
    <ul>
    <li><strong>Search reindex:</strong> Rebuilds the tsvector search index for all items of a type</li>
    <li><strong>Pathauto regenerate:</strong> Regenerates URL aliases based on current pathauto patterns</li>
    <li><strong>Stage publish:</strong> Atomically publishes all staged changes to live</li>
    <li><strong>Config import:</strong> Imports a directory of YAML configuration files</li>
    </ul>
    <hr />
    <h2>Step 3: File Storage &amp; S3</h2>
    <p>In development, Trovato stores uploaded files on the local filesystem. In production, you want S3-compatible object storage for durability, CDN integration, and horizontal scaling.</p>
    <h3>Storage Backends</h3>
    <p>Trovato's <code>FileStorage</code> trait abstracts the storage backend. Two implementations ship:</p>
    <p><strong>LocalFileStorage:</strong> Files stored in <code>./uploads/</code> with URIs like <code>local://2026/03/a1b2c3d4_photo.jpg</code>. The kernel serves them at <code>/files/2026/03/a1b2c3d4_photo.jpg</code>.</p>
    <p><strong>S3FileStorage:</strong> Files stored in an S3-compatible bucket with URIs like <code>s3://2026/03/a1b2c3d4_photo.jpg</code>. Configure via environment variables:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">FILE_STORAGE</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">s3</span>
    <span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">S3_BUCKET</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">ritrovo-files</span>
    <span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">S3_REGION</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">us-east-1</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> AWS credentials from environment or IAM role</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><h3>Security</h3>
    <p>Both backends enforce the same security rules:</p>
    <ul>
    <li><strong>10 MB max file size</strong> — configurable via <code>MAX_FILE_SIZE</code></li>
    <li><strong>MIME type allowlist</strong> — images (JPEG, PNG, GIF, WebP), documents (PDF, Office), archives (ZIP, GZIP). SVG is excluded (XML-based format enables stored XSS).</li>
    <li><strong>Magic byte validation</strong> — the kernel verifies file content matches the declared MIME type using <code>infer</code> crate magic byte detection. An ELF binary declared as <code>image/jpeg</code> is rejected.</li>
    <li><strong>Filename sanitization</strong> — path traversal sequences (<code>../</code>) are stripped, filenames are limited to alphanumeric characters plus <code>.</code>, <code>-</code>, <code>_</code>.</li>
    <li><strong>Directory traversal prevention</strong> — the file serve route rejects paths containing <code>..</code> or null bytes.</li>
    </ul>
    <h3>Image Styles</h3>
    <p>The <code>trovato_image_styles</code> plugin provides on-the-fly image processing:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>/files/styles/thumbnail/2026/03/a1b2c3d4_photo.jpg
    </code></pre></figure><p>Configured styles (thumbnail, medium, large) are generated on first request and cached. Styles are defined in the database and support resize, crop, and format conversion.</p>
    <hr />
    <h2>Step 4: Cron &amp; Queue Workers</h2>
    <p>Background work in Trovato runs through two cooperating systems: <strong>cron</strong> for scheduled tasks and <strong>queues</strong> for work items.</p>
    <h3>Cron Architecture</h3>
    <p>Cron is triggered externally (systemd timer, Kubernetes CronJob, or manual curl):</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>X</span> POST http://localhost:3000/cron/default-cron-key</span>
    </span></code></pre></figure><p>The cron key (<code>CRON_KEY</code> env var) prevents unauthorized triggering. Each cron run:</p>
    <ol>
    <li>Acquires a <strong>Redis distributed lock</strong> with heartbeat (prevents double-execution across instances)</li>
    <li>Dispatches <code>tap_cron</code> to all plugins (each plugin does its periodic work)</li>
    <li>Processes <strong>queue items</strong> — drains each declared queue by calling <code>tap_queue_worker</code></li>
    <li>Runs <strong>kernel maintenance</strong>: temp file cleanup, expired session pruning, cache garbage collection</li>
    </ol>
    <h3>Queue System</h3>
    <p>Plugins declare queues via <code>tap_queue_info</code> and push work items via <code>queue_push()</code>. The kernel processes queue items during cron runs with configurable concurrency:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>ritrovo_importer → queue_push(&quot;ritrovo_import&quot;, payload)
                             ↓
                  cron run → tap_queue_worker(&quot;ritrovo_import&quot;, payload)
                             ↓
                  ritrovo_importer validates, deduplicates, inserts conference
    </code></pre></figure><p>The <code>ritrovo_importer</code> plugin uses this pattern to import conferences in batches — <code>tap_cron</code> discovers new data and queues work items, <code>tap_queue_worker</code> processes each item.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Trigger cron</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>X</span> POST http://localhost:3000/cron/default-cron-key</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.status<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Expect: &quot;completed&quot;</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Check queue depth</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> exec trovato-redis-1 redis-cli LLEN queue:ritrovo_import</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Expect: 0 (drained)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><hr />
    <h2>Step 5: Observability</h2>
    <h3>Prometheus Metrics</h3>
    <p>Trovato exposes a <code>/metrics</code> endpoint in Prometheus exposition format:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/metrics</span>
    </span></code></pre></figure><p>Metrics include:</p>
    <ul>
    <li><strong>HTTP request duration</strong> — histogram by method and path</li>
    <li><strong>HTTP request count</strong> — counter by status code</li>
    <li><strong>Active connections</strong> — gauge</li>
    <li><strong>Cache hit/miss rates</strong> — per cache tier</li>
    <li><strong>Database query duration</strong> — histogram</li>
    </ul>
    <h3>Health Check</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/health</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> {&quot;status&quot;:&quot;healthy&quot;,&quot;postgres&quot;:true,&quot;redis&quot;:true}</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>The health endpoint verifies both Postgres and Redis connectivity. Use it for load balancer health probes and container orchestration liveness checks.</p>
    <h3>Rate Limiting</h3>
    <p>Per-endpoint rate limiting protects against abuse:</p>
    <table><thead><tr><th>Endpoint Category</th><th>Limit</th><th>Window</th></tr></thead><tbody>
    <tr><th>Login</th><th>5 requests</th><th>1 minute</th></tr>
    <tr><th>API</th><th>100 requests</th><th>1 minute</th></tr>
    <tr><th>Forms</th><th>30 requests</th><th>1 minute</th></tr>
    <tr><th>Search</th><th>20 requests</th><th>1 minute</th></tr>
    <tr><th>File uploads</th><th>10 requests</th><th>1 minute</th></tr>
    <tr><th>Registration</th><th>3 requests</th><th>1 hour</th></tr>
    </tbody></table>
    <p>Rate limits use Redis sliding window counters. When exceeded, the server returns <code>429 Too Many Requests</code>.</p>
    <h3>Security Headers</h3>
    <p>Every response includes security headers (added in the Inclusivity-First Foundation work):</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Content-Security-Policy: default-src &#39;self&#39;; script-src &#39;self&#39;; ...
    X-Frame-Options: DENY
    X-Content-Type-Options: nosniff
    Referrer-Policy: strict-origin-when-cross-origin
    Permissions-Policy: camera=(), microphone=(), geolocation=()
    Strict-Transport-Security: max-age=31536000; includeSubDomains  (HTTPS only)
    </code></pre></figure><hr />
    <h2>Step 6: Testing</h2>
    <p>Trovato's test suite is the safety net that lets you refactor with confidence.</p>
    <h3>Unit Tests (727 tests)</h3>
    <p>Every kernel module has unit tests that run without a database:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> test<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> trovato-kernel<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>lib</span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> test result: ok. 727 passed</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>Key areas covered:</p>
    <ul>
    <li>Block type validation and rendering (34 tests)</li>
    <li>Render tree sanitization and XSS prevention (12 tests)</li>
    <li>Form API element rendering (10 tests)</li>
    <li>Gather query building with parameterized SQL (24 tests)</li>
    <li>URL alias resolution and rewriting (12 tests)</li>
    <li>CSRF token generation and verification</li>
    <li>File upload security (magic bytes, MIME validation, filename sanitization)</li>
    <li>Config import/export YAML parsing</li>
    </ul>
    <h3>Integration Tests (325 tests)</h3>
    <p>Integration tests run against a live Postgres + Redis instance:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> test<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>all</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> --test-threads=1</span>
    </span></code></pre></figure><p>These verify full request-response cycles, database operations, plugin loading, and multi-service interactions. Key test files:</p>
    <table><thead><tr><th>File</th><th>Tests</th><th>Coverage</th></tr></thead><tbody>
    <tr><th><code>integration_test.rs</code></th><th>135</th><th>End-to-end HTTP requests, plugin lifecycle</th></tr>
    <tr><th><code>item_test.rs</code></th><th>47</th><th>Item CRUD, field validation, SDK types</th></tr>
    <tr><th><code>gather_test.rs</code></th><th>24</th><th>Query building, filtering, pagination</th></tr>
