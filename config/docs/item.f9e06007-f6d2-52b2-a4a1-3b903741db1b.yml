    the file. <code>docs/tutorial/config/README.md</code> indexes the tutorial's set by machine
    name if you need to find one by hand.</p>
    <h3>Import is all-or-nothing on validation</h3>
    <p>Import parses and schema checks every file, and resolves every reference it
    makes, before it writes anything. If any file in the set fails, the run prints
