    <hr />
    <h2>Step 4: Revision History</h2>
    <p>Every edit to an item creates a new row in the <code>item_revision</code> table. No data is ever overwritten -- you can always see what changed and when, and revert to any previous version.</p>
    <h3>How Revisions Work</h3>
    <p>When an item is saved:</p>
    <ol>
    <li>The kernel snapshots the current state (title, fields, status, stage) into a new <code>item_revision</code> row.</li>
    <li>The <code>item.current_revision_id</code> pointer is updated to the new revision.</li>
    <li>The previous revision remains in the database, untouched.</li>
    </ol>
    <p>Each revision records:</p>
    <ul>
    <li><strong>Timestamp</strong> -- When the edit was made</li>
    <li><strong>Author</strong> -- Who made the edit</li>
    <li><strong>Log message</strong> -- An optional description of the change (e.g., "Updated via admin UI", "Imported by ritrovo_importer")</li>
    <li><strong>Change summary</strong> -- A structured JSONB diff of what changed (which fields were added, removed, or modified). Auto-generated by the kernel when saving.</li>
    <li><strong>AI-generated flag</strong> -- Whether AI was involved in creating this revision (set automatically when <code>ai_request()</code> is called during the save process)</li>
    <li><strong>Full field snapshot</strong> -- The complete <code>fields</code> JSONB at that point in time</li>
    <li><strong>Retention days</strong> -- Optional data lifecycle period; when set, a retention plugin can clean up expired content</li>
    </ul>
    <p>Revisions are immutable at the database level -- a PostgreSQL trigger prevents UPDATE operations on the <code>item_revision</code> table. Restoring a previous version creates a <em>new</em> revision with the old content, preserving the full audit trail.</p>
    <h3>Viewing Revision History</h3>
    <p>The revision history page is available at <code>/item/{id}/revisions</code> (requires authentication). It shows a table with:</p>
    <ul>
    <li>Date and time of each revision</li>
    <li>Title at that revision</li>
    <li>Log message</li>
    <li>A "current" badge on the latest revision</li>
    <li>A <strong>Revert</strong> button on older revisions</li>
    </ul>
    <p>Navigate to any conference and click the <strong>Revisions</strong> link in the admin operations column on the content list page.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-04/revision-history.png"><img src="images/part-04/revision-history.png" width="600" alt="The revision history page showing a table of revisions with timestamps, titles, and revert buttons"></a></p>
    <h3>Revert</h3>
    <p>Reverting creates a <strong>new</strong> revision with the content from the selected historical revision. It never deletes old revisions. After a revert, the revision history shows:</p>
    <ol>
    <li>Original version</li>
    <li>Bad edit</li>
    <li>Revert (contains original version's data)</li>
    </ol>
    <p>This means the "bad edit" is still in the history for auditing purposes. The <code>current_revision_id</code> simply points to the revert revision.</p>
    <h3>Five Revision Scenarios</h3>
    <p>The Trovato design spec defines five key revision scenarios:</p>
    <ol>
    <li><p><strong>Basic revision</strong> -- Edit a Live conference (change the description). The revision table gets a new row, and <code>current_revision_id</code> updates.</p>
    </li>
    <li><p><strong>Revert</strong> -- Make a bad edit (change title to "WRONG"), then revert to the previous revision. The title is restored, and the history shows three entries.</p>
    </li>
    <li><p><strong>Draft-while-live</strong> -- A Live conference has a published version visible to the public. An editor creates a Curated draft with significant changes. The public still sees the Live version. Publishing the draft replaces the Live version.</p>
    </li>
    <li><p><strong>Cross-stage field updates</strong> -- The importer updates structured fields (dates, location) on a Live conference that also has a Curated draft. The kernel writes one revision, and the <code>tap_item_save</code> context includes <code>other_stage_revisions</code> so plugins are aware of the draft.</p>
    </li>
    <li><p><strong>Emergency unpublish</strong> -- Set <code>active = false</code> on a Live conference's revision. The item immediately disappears from public Gathers and search without going through a stage transition. This is a safety valve for urgent content removal.</p>
    </li>
    </ol>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Pick a conference that has revisions (plugin-imported items don&#39;t get revision rows —</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> only items created or edited via the kernel API have revision history)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">ID</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>tA</span> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
