    <h2>Step 3: Stages &amp; the Editorial Workflow</h2>
    <p>Every item in Trovato has a <code>stage_id</code> that determines its visibility. Until now, all content has been on the <strong>Live</strong> stage (the well-known UUID <code>0193a5a0-0000-7000-8000-000000000001</code>), which means everything is publicly visible. The editorial workflow introduces two additional stages.</p>
    <h3>Three Stages</h3>
    <table><thead><tr><th>Stage</th><th>Visibility</th><th>Purpose</th></tr></thead><tbody>
    <tr><th><strong>Incoming</strong></th><th>Internal</th><th>New imports land here, invisible to the public</th></tr>
    <tr><th><strong>Curated</strong></th><th>Internal</th><th>Editor-reviewed content, ready for publisher approval</th></tr>
    <tr><th><strong>Live</strong></th><th>Public</th><th>Published content, visible to all visitors</th></tr>
    </tbody></table>
    <p>"Internal" means only authenticated users with the right permissions can see items on that stage. The kernel denies anonymous users on internal stages before dispatching to any plugins. The <code>ritrovo_access</code> plugin (installed in Part 5) then checks whether authenticated users have the <code>view incoming conferences</code> or <code>view curated conferences</code> permissions.</p>
    <h3>How Stages Work</h3>
    <p>Stages are stored as the <code>stage_id</code> column on the <code>item</code> table -- a foreign key to a stage definition. The kernel's Gather engine wraps every query with a stage visibility filter:</p>
    <ul>
    <li><strong>Anonymous users</strong> see only items where <code>stage_id</code> points to a Public stage.</li>
    <li><strong>Viewers</strong> (with <code>view incoming conferences</code> + <code>view curated conferences</code>) see items on all three tutorial stages.</li>
    <li><strong>Editors</strong> and <strong>Publishers</strong> inherit viewer permissions and also see all three stages, plus have additional editing/publishing capabilities.</li>
    </ul>
    <p>This filtering happens transparently in the SQL -- the Gather definition doesn't need to specify stage logic explicitly. The <code>stage_aware: true</code> flag in the Gather's definition JSON enables this behavior.</p>
    <h3>The Workflow Transition Graph</h3>
    <p>Not all stage changes are valid. The editorial workflow defines which transitions are allowed:</p>
    <figure class="code"><pre class="code__body"><code>incoming → curated     (requires: &quot;edit any content&quot;)
    curated  → live        (requires: &quot;publish conferences&quot;)
    live     → curated     (requires: &quot;publish conferences&quot;)
    curated  → incoming    (requires: &quot;edit any content&quot;)
    </code></pre></figure><p>An editor (who has <code>edit any content</code>) can move content between Incoming and Curated. A publisher (who has <code>publish conferences</code>) can promote content to Live or unpublish it. Invalid transitions (like Incoming → Live) are rejected by the kernel.</p>
    <p>The workflow is configured in <code>docs/tutorial/config/variable.workflow.editorial.yml</code>:</p>
    <figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">key</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">workflow.editorial</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">value</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
      <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">transitions</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span>
        <span class="tok-punctuation tok-definition tok-block tok-sequence tok-item tok-yaml">-</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">from</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">incoming</span>
