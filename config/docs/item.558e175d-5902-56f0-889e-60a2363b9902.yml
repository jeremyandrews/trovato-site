    <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Assign viewer role to viewer_carol
    </span><span class="tok-keyword tok-other tok-DML tok-sql">INSERT INTO</span> user_roles (user_id, role_id)
