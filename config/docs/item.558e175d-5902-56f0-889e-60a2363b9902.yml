    <h3>User Profile</h3>
    <p>Logged-in users can manage their account at <code>/user/profile</code>. This page shows the profile edit form (name, email, timezone) and a password change form. It requires authentication -- unauthenticated requests redirect to <code>/user/login</code>.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Confirm users exist</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell"><span class="tok-meta tok-group tok-expansion tok-command tok-parens tok-shell"><span class="tok-punctuation tok-definition tok-variable tok-shell">$</span><span class="tok-punctuation tok-section tok-parens tok-begin tok-shell">(</span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">brew</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>prefix</span> libpq</span><span class="tok-punctuation tok-section tok-parens tok-end tok-shell">)</span></span>/bin/psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> postgres://trovato:trovato@localhost:5432/trovato <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>SELECT name, mail FROM users WHERE name IN (&#39;editor_alice&#39;, &#39;publisher_bob&#39;, &#39;viewer_carol&#39;);<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Expect: three rows</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><details>
    <summary>Under the Hood: Rate Limiting and Account Security</summary>
    <p>The login endpoint implements rate limiting to prevent brute-force password attacks. After too many failed attempts from the same IP or for the same account, the endpoint returns temporary lockout responses.</p>
    <p>The kernel also:</p>
    <ul>
    <li>Never reveals whether a username exists (login errors say "Invalid username or password" for both cases)</li>
    <li>Stores only the Argon2id hash, never the plaintext password</li>
    <li>Cycles the session ID after every authentication state change (login, logout, role change)</li>
    <li>Uses <code>HttpOnly</code> and <code>SameSite=Lax</code> cookie attributes to prevent XSS-based session theft</li>
    </ul>
    </details>
    <hr />
    <h2>Step 2: Roles &amp; Permissions</h2>
    <p>With users in place, the next step is controlling what each user can do. Trovato uses a role-based permission system where roles are assigned to users and permissions are assigned to roles.</p>
    <h3>Built-in Roles</h3>
    <p>Every Trovato installation has three implicit roles:</p>
    <table><thead><tr><th>Role</th><th>Assigned To</th><th>Key Permissions</th></tr></thead><tbody>
    <tr><th><strong>anonymous</strong></th><th>All unauthenticated visitors</th><th><code>access content</code> (view Live items)</th></tr>
    <tr><th><strong>authenticated</strong></th><th>All logged-in users</th><th><code>access content</code></th></tr>
    <tr><th><strong>administrator</strong></th><th>Users with the admin flag</th><th>All permissions (superuser)</th></tr>
    </tbody></table>
    <p>These roles exist automatically -- you don't need to create them.</p>
    <h3>Custom Roles</h3>
    <p>For the editorial workflow, Ritrovo needs three additional roles:</p>
    <table><thead><tr><th>Role</th><th>Purpose</th><th>Key Permissions</th></tr></thead><tbody>
    <tr><th><strong>viewer</strong></th><th>Can view content on all editorial stages</th><th><code>access content</code>, <code>view incoming conferences</code>, <code>view curated conferences</code></th></tr>
    <tr><th><strong>editor</strong></th><th>Reviews and curates content</th><th>Viewer permissions + <code>create content</code>, <code>edit own content</code>, <code>edit any content</code>, <code>access files</code>, <code>use filtered_html</code>, <code>edit conferences</code></th></tr>
    <tr><th><strong>publisher</strong></th><th>Publishes content to Live</th><th>Editor permissions + <code>delete any content</code>, <code>administer files</code>, <code>use full_html</code>, <code>publish conferences</code></th></tr>
    </tbody></table>
    <p>The role definitions live in <code>docs/tutorial/config/</code>, one <code>role.{uuid}.yml</code> file each; <code>docs/tutorial/config/README.md</code> maps the UUIDs to <code>viewer</code>, <code>editor</code> and <code>publisher</code>. <code>config import</code> creates the roles <strong>and grants their permissions</strong>: each file declares a <code>permissions</code> list, and the import applies exactly that set. The one exception is a permission a plugin declares, such as <code>ritrovo_access</code>'s <code>view incoming conferences</code> in Part 5: the kernel cannot enumerate a plugin's permissions, so those are granted at <code>/admin/people/permissions</code> once the plugin is enabled. Each role file names which of its permissions are in that position.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-04/roles-admin.png"><img src="images/part-04/roles-admin.png" width="600" alt="The roles administration page showing the list of defined roles"></a></p>
    <p>Note that the <code>view incoming conferences</code>, <code>view curated conferences</code>, <code>edit conferences</code>, and <code>publish conferences</code> permissions are declared by the <code>ritrovo_access</code> plugin (installed in Part 5). They must be added to role permissions after that plugin is installed. The role YAML files document the final intended state including these permissions.</p>
    <h3>Assigning Roles to Test Users</h3>
    <p>There is no admin UI for assigning roles to users — the <code>/admin/people</code> list does not have an Edit action with role checkboxes. Instead, assign roles directly via SQL:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Assign editor role to editor_alice
    </span><span class="tok-keyword tok-other tok-DML tok-sql">INSERT INTO</span> user_roles (user_id, role_id)
    <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> <span class="tok-constant tok-other tok-database-name tok-sql">u</span>.<span class="tok-constant tok-other tok-table-name tok-sql">id</span>, <span class="tok-constant tok-other tok-database-name tok-sql">r</span>.<span class="tok-constant tok-other tok-table-name tok-sql">id</span> <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> users u, roles r
