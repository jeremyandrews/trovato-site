    <h2>What You've Built</h2>
    <p>By the end of Part 4, you have:</p>
    <ul>
    <li><strong>Multi-user authentication</strong> with Argon2id password hashing, Redis sessions, and session fixation protection.</li>
    <li><strong>Six roles</strong> -- anonymous, authenticated, viewer, editor, publisher, and administrator -- with permission-based access control.</li>
    <li><strong>Three editorial stages</strong> -- Incoming (internal), Curated (internal), and Live (public) -- with enforced workflow transitions.</li>
    <li><strong>Revision history</strong> on items created or edited through the kernel API, with revert capability and audit trail.</li>
    <li><strong>Admin content management</strong> with type and status filters, bulk operations (publish/unpublish/delete), and per-item quick actions.</li>
    <li><strong>Stage-aware content visibility</strong> in Gathers and search -- anonymous users see only Live content.</li>
    </ul>
    <p>You also now understand:</p>
    <ul>
    <li>How Trovato's session system prevents fixation attacks and enforces CSRF protection.</li>
    <li>How the role → permission → access check chain controls what each user can do.</li>
    <li>How stages separate editorial workflows from public content delivery.</li>
    <li>How revisions create an append-only audit trail where no edit is ever lost.</li>
    <li>How the kernel aggregates Grant/Deny/Neutral access decisions from plugins.</li>
    </ul>
    <p>Ritrovo is now a full editorial CMS: conferences flow in from the importer, editors review and curate them, publishers promote them to Live, and visitors browse a polished, searchable directory. Every edit is tracked, every action is authorized, and the workflow is enforced by the kernel.</p>
