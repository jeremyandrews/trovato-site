    <h2>Step 5: Admin Content Management</h2>
    <p>With thousands of conferences and an editorial workflow, administrators need efficient tools for managing content. The admin content list at <code>/admin/content</code> provides filtering, bulk operations, and quick actions.</p>
    <h3>Content List with Filters</h3>
    <p>The content list supports filtering by:</p>
    <ul>
    <li><strong>Content type</strong> -- Conference, Speaker, or all types</li>
    <li><strong>Publishing status</strong> -- Published, Unpublished, or all</li>
    </ul>
    <p>Filter controls appear above the content table. Selecting a filter and clicking <strong>Filter</strong> reloads the list with the matching items.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-04/admin-content-list.png"><img src="images/part-04/admin-content-list.png" width="600" alt="The admin content list with type and status filter controls"></a></p>
    <h3>Content Table</h3>
    <p>Each row in the content table shows:</p>
    <table><thead><tr><th>Column</th><th>Content</th></tr></thead><tbody>
    <tr><th>Checkbox</th><th>For bulk selection</th></tr>
    <tr><th>Title</th><th>Item title (linked to edit form)</th></tr>
    <tr><th>Type</th><th>Content type label</th></tr>
    <tr><th>Author</th><th>Username of the item's creator</th></tr>
    <tr><th>Status</th><th>Published / Unpublished badge</th></tr>
    <tr><th>Updated</th><th>Last modification timestamp</th></tr>
    <tr><th>Operations</th><th>Edit, Revisions, Delete links</th></tr>
    </tbody></table>
    <h3>Bulk Operations</h3>
    <p>Select multiple items via checkboxes (or "Select all" to check the entire page), choose an action from the dropdown, and click <strong>Apply</strong>:</p>
    <table><thead><tr><th>Action</th><th>Effect</th></tr></thead><tbody>
    <tr><th><strong>Publish</strong></th><th>Sets <code>status = 1</code> on selected items</th></tr>
    <tr><th><strong>Unpublish</strong></th><th>Sets <code>status = 0</code> on selected items</th></tr>
    <tr><th><strong>Delete</strong></th><th>Permanently removes selected items (with confirmation)</th></tr>
    </tbody></table>
    <p>Bulk operations report results: "5 item(s) published." or "3 item(s) published. 2 item(s) failed." if some items couldn't be processed.</p>
    <p>The delete action prompts for JavaScript confirmation before submitting to prevent accidental data loss.</p>
    <h3>Bulk Operation Security</h3>
    <ul>
    <li><strong>Authentication required</strong> -- Only administrators can access <code>/admin/content</code>.</li>
    <li><strong>CSRF protection</strong> -- The bulk action form includes a CSRF token.</li>
    <li><strong>Action validation</strong> -- The server validates the action string against an allowlist (<code>publish</code>, <code>unpublish</code>, <code>delete</code>). Unknown actions are rejected.</li>
    <li><strong>Per-item error handling</strong> -- If an individual item update fails (e.g., permission denied), the error is logged and counted without aborting the entire batch.</li>
    </ul>
    <h3>Quick Actions</h3>
    <p>The operations column provides per-item quick actions:</p>
    <ul>
    <li><strong>Edit</strong> -- Opens the content edit form.</li>
    <li><strong>Revisions</strong> -- Opens the revision history page.</li>
    <li><strong>Delete</strong> -- Submits a CSRF-protected POST to delete the single item.</li>
    </ul>
    <h3>Flash Messages</h3>
    <p>After bulk operations or single-item actions, a flash message appears at the top of the content list confirming the result. Flash messages are stored in the session and cleared after display.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Content list loads with all items</span><span class="tok-comment tok-line tok-number-sign tok-shell">
