        <span class="tok-keyword tok-other tok-DML tok-sql">JOIN</span> stage_config sc <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> <span class="tok-constant tok-other tok-database-name tok-sql">ct</span>.<span class="tok-constant tok-other tok-table-name tok-sql">id</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">sc</span>.<span class="tok-constant tok-other tok-table-name tok-sql">tag_id</span>
        <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> <span class="tok-constant tok-other tok-database-name tok-sql">sc</span>.<span class="tok-constant tok-other tok-table-name tok-sql">visibility</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>public<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
        <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> For authenticated users with permissions, this also includes &#39;internal&#39; stages
    </span>)
    <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> i.<span class="tok-keyword tok-operator tok-star tok-sql">*</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> item i
    <span class="tok-keyword tok-other tok-DML tok-sql">JOIN</span> visible_stages vs <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> <span class="tok-constant tok-other tok-database-name tok-sql">i</span>.<span class="tok-constant tok-other tok-table-name tok-sql">stage_id</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">vs</span>.<span class="tok-constant tok-other tok-table-name tok-sql">id</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> <span class="tok-constant tok-other tok-database-name tok-sql">i</span>.<span class="tok-constant tok-other tok-table-name tok-sql">type</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>conference<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> <span class="tok-constant tok-other tok-database-name tok-sql">i</span>.<span class="tok-constant tok-other tok-table-name tok-sql">status</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-numeric tok-sql">1</span>
    <span class="tok-keyword tok-other tok-DML tok-sql">ORDER BY</span> <span class="tok-constant tok-other tok-database-name tok-sql">i</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span><span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>field_start_date<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-order tok-sql">ASC</span>
    </span></code></pre></figure><p>The <code>visible_stages</code> CTE adapts based on the requesting user's permissions. Anonymous users see only Public stages. Editors see Internal and Public. This is the same mechanism that powers <code>load_for_view()</code> in the item handler -- the permission check is centralized.</p>
