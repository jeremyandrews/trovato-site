    </span></span></code></pre></figure><h3>Stage-Aware Search</h3>
    <p>Search is also stage-aware. An anonymous search for "rust" returns only Live conferences. An authenticated editor's search returns matches from all stages they can access.</p>
    <h3>Extensibility Demo: Adding a New Stage</h3>
    <p>One of Trovato's strengths is that stages are configuration, not code. You can add a new stage without writing any Rust.</p>
    <p>To add a "Legal Review" stage between Curated and Live, you would:</p>
    <ol>
    <li>Create the stage. The tutorial's config set already contains one: the <code>legal_review</code> stage file listed in <code>docs/tutorial/config/README.md</code>, which <code>config import</code> applies as a <code>category_tag</code> row in the <code>stages</code> category plus a <code>stage_config</code> row with <code>visibility: internal</code>.</li>
    <li>Update <code>variable.workflow.editorial.yml</code> to replace the <code>curated → live</code> transition with <code>curated → legal_review</code> and <code>legal_review → live</code>, then re-import.</li>
    </ol>
    <p>No code changes, no plugin rebuild. The new workflow path works as soon as the config is imported and the stage exists in the database.</p>
    <p>Stages are imported via <code>config import</code> using <code>stage.{uuid}.yml</code> files, where the UUID is the stage's identity and the machine name lives in the file. The workflow variable is also importable.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Check stages exist</span><span class="tok-comment tok-line tok-number-sign tok-shell">
