    </span></code></pre></figure><h3>Import Pipeline and Stages</h3>
    <p>When the <code>ritrovo_importer</code> plugin imports conferences from confs.tech, it creates items on the configured default stage. In a production setup, you would configure it to target the <strong>Incoming</strong> stage so that imported conferences are not publicly visible until an editor reviews and promotes them.</p>
    <h3>Walking Through the Workflow</h3>
    <p>Here is the editorial lifecycle for a newly imported conference:</p>
    <ol>
    <li><p><strong>Importer creates conference</strong> on the Incoming stage. It appears in <code>/admin/content</code> filtered by Incoming but is invisible on <code>/conferences</code>.</p>
    </li>
    <li><p><strong>Editor reviews</strong> -- <code>editor_alice</code> logs in, filters the content list by Incoming, opens a conference, reviews the data (title, dates, location, description), and promotes it to Curated.</p>
    </li>
    <li><p><strong>Publisher approves</strong> -- <code>publisher_bob</code> filters by Curated, verifies the conference meets quality standards, and promotes it to Live.</p>
    </li>
    <li><p><strong>Public sees it</strong> -- The conference now appears on <code>/conferences</code>, in search results, and at its pathauto alias.</p>
    </li>
    </ol>
    <h3>Stage-Aware Gathers</h3>
    <p>The five Gather queries from Part 2 all have <code>stage_aware: true</code>. Demonstrate the effect:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Anonymous sees only Live conferences</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span> http://localhost:3000/api/query/ritrovo.upcoming_conferences/execute</span> <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.total<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>

