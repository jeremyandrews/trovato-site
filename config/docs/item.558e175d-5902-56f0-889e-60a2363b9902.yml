    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> <span class="tok-constant tok-other tok-database-name tok-sql">u</span>.<span class="tok-constant tok-other tok-table-name tok-sql">name</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>viewer_carol<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span> <span class="tok-keyword tok-other tok-DML tok-sql">AND</span> <span class="tok-constant tok-other tok-database-name tok-sql">r</span>.<span class="tok-constant tok-other tok-table-name tok-sql">name</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>viewer<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>;
    </span></code></pre></figure><blockquote>
    <p><strong>Note:</strong> At this point the viewer role only has <code>access content</code> — functionally identical to bare <code>authenticated</code>. The viewer role becomes meaningful in Part 5 when the <code>ritrovo_access</code> plugin is installed and <code>view incoming conferences</code> / <code>view curated conferences</code> are assigned. Creating the role now ensures viewer_carol has the right role binding before those permissions are added.</p>
    </blockquote>
    <h3>Permission Model</h3>
    <p>Permissions in Trovato are strings like <code>"access content"</code>, <code>"edit any content"</code>, <code>"use filtered_html"</code>. Plugins declare permissions via the <code>tap_perm</code> tap. The kernel aggregates permissions from all enabled plugins and maps them to roles.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-04/permissions-matrix.png"><img src="images/part-04/permissions-matrix.png" width="600" alt="The permissions matrix showing roles across columns and permissions down rows"></a></p>
    <p>When the kernel checks whether a user can perform an action:</p>
    <ol>
    <li>It loads the user's roles (implicit + assigned).</li>
    <li>For each role, it checks whether the role has the required permission.</li>
    <li>If any role grants the permission, the user can proceed.</li>
    </ol>
    <p>For items specifically, the access check is layered:</p>
    <ol>
    <li><strong>Admin bypass:</strong> <code>is_admin</code> users always have access.</li>
    <li><strong>Stage visibility:</strong> If the item is on an internal stage (Incoming or Curated), anonymous users are denied immediately. The "published view" shortcut (step 3) is skipped for internal stages.</li>
    <li><strong>Published view:</strong> For items on public stages, anyone with <code>"access content"</code> can view published items.</li>
    <li><strong>Plugin hook:</strong> <code>tap_item_access</code> lets plugins return <strong>Grant</strong>, <strong>Deny</strong>, or <strong>Neutral</strong>. The kernel passes the user's permissions, authentication status, and the item's stage info to plugins so they can make informed decisions. Any Deny = denied. Any Grant with no Deny = allowed.</li>
    <li><strong>Role-based fallback:</strong> The kernel checks both generic and type-specific permission patterns: <code>"edit any content"</code>, <code>"edit any conference"</code>, <code>"edit own content"</code> (for the item's author), and <code>"edit conference content"</code>. Any match grants access.</li>
    </ol>
    <blockquote>
    <p><strong>Note:</strong> Admin pages (<code>/admin/*</code>) require <code>is_admin</code> — they are not accessible through role permissions. Editors and publishers use the item routes (<code>/item/{id}/edit</code>, <code>/item/{id}/revisions</code>) directly, not the admin UI.</p>
    </blockquote>
