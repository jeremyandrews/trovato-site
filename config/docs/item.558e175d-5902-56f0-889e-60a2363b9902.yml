    <h1>Part 4: The Editorial Engine</h1>
    <p>Part 3 gave Ritrovo its visual identity. Part 4 gives it editorial discipline.</p>
    <p>With 5,000+ conferences flowing in from the importer, someone needs to review them before they go live. You need users who can log in, roles that control who can do what, stages that separate incoming content from published content, workflows that enforce review steps, and revision history so no edit is ever lost.</p>
    <p>By the end of this part, Ritrovo will have multi-user authentication, five roles from anonymous to admin, three editorial stages with enforced transitions, full revision tracking, and an admin interface with filters and bulk operations.</p>
    <p><strong>Start state:</strong> Single admin user, everything on Live stage, no access control.
    <strong>End state:</strong> Multiple users, role-based permissions, three-stage editorial workflow, revision history, and efficient admin content management.</p>
    <hr />
    <h2>Step 1: Users &amp; Authentication</h2>
    <p>Trovato already has a user system -- you created an admin account during the installer in Part 1. This step explores the full authentication architecture and creates test users for the editorial workflow.</p>
    <h3>The User Model</h3>
    <p>Users in Trovato are stored in the <code>users</code> table with:</p>
    <ul>
    <li><strong>UUID</strong> identifier (UUIDv7, time-sortable like items)</li>
    <li><strong>Name</strong> (<code>name</code> column) -- unique username, used for login</li>
    <li><strong>Email</strong> (<code>mail</code> column) -- unique, used for account recovery</li>
    <li><strong>Password hash</strong> (<code>pass</code> column) -- Argon2id with RFC 9106 parameters (m=65536 KiB, t=3 iterations, p=4 parallelism)</li>
    <li><strong>Admin flag</strong> (<code>is_admin</code>) -- superuser bypass for all permission checks</li>
    <li><strong>Status</strong> -- 1=active, 0=blocked</li>
    <li><strong>Roles</strong> -- assigned via <code>user_roles</code> join table (many-to-many with <code>roles</code>)</li>
    <li><strong>Consent tracking</strong> -- <code>consent_given</code>, <code>consent_date</code>, <code>consent_version</code>, <code>data_retention_days</code> for GDPR compliance (nullable -- consent collection is plugin territory; the kernel stores the result)</li>
    <li><strong>Data</strong> -- JSONB extension field for profile information</li>
    </ul>
    <h3>Session Architecture</h3>
    <p>When a user logs in:</p>
    <ol>
    <li>The kernel verifies the password against the Argon2id hash.</li>
    <li>A new session is created in Redis with an HttpOnly, Secure cookie.</li>
    <li>The session ID is <strong>cycled</strong> (regenerated) to prevent session fixation attacks -- if an attacker obtained a session cookie before login, it becomes invalid.</li>
    <li>The user's ID is stored in the session (<code>SESSION_USER_ID</code>).</li>
    </ol>
    <p>Sessions expire after inactivity (configurable via <code>SESSION_TTL</code>). Logout is always a POST request (never GET) with CSRF protection, preventing logout CSRF attacks.</p>
    <h3>Password Requirements</h3>
    <ul>
    <li>Minimum 12 characters (do not reduce this -- it is a security baseline)</li>
    <li>Argon2id with RFC 9106 recommended parameters</li>
    <li>No maximum length (within reason -- the hash function normalizes input)</li>
    </ul>
    <h3>Enabling Registration</h3>
    <p>By default, Trovato disables user registration. The tutorial config at <code>docs/tutorial/config/variable.allow_user_registration.yml</code> enables it:</p>
    <figure class="code"><figcaption class="code__lang">yaml</figcaption><pre class="code__body"><code class="language-yaml"><span class="tok-source tok-yaml"><span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">key</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">allow_user_registration</span>
    <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">value</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-constant tok-language tok-boolean tok-yaml">true</span>
    </span></code></pre></figure><p>Import it:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import docs/tutorial/config</span>
    </span></code></pre></figure><h3>Creating Test Users</h3>
