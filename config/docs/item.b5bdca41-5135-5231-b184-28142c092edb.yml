          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">field_type</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">Blocks</span>
          <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml"><span class="tok-entity tok-name tok-tag tok-yaml">label</span></span><span class="tok-punctuation tok-separator tok-key-value tok-mapping tok-yaml">:</span> <span class="tok-string tok-unquoted tok-plain tok-out tok-yaml">Description</span>
    </span></code></pre></figure><p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-05/fields-with-blocks.png"><img src="images/part-05/fields-with-blocks.png" width="600" alt="Field management showing the Blocks field type configured for the description field"></a></p>
    <h3>2.4: Enabling the <code>trovato_block_editor</code> Plugin</h3>
    <p>The block editor's client-side functionality is gated behind the <code>trovato_block_editor</code> plugin. The kernel provides all the infrastructure (block types, rendering, validation), but the plugin activates the Editor.js widget and its API routes.</p>
    <p>The plugin source is minimal -- it lives at <code>plugins/trovato_block_editor/src/lib.rs</code> and declares a single permission:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-meta tok-annotation tok-rust"><span class="tok-punctuation tok-definition tok-annotation tok-rust">#</span><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-variable tok-annotation tok-rust">plugin_tap</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> <span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">tap_perm</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">)</span></span></span></span><span class="tok-meta tok-function tok-rust"> <span class="tok-meta tok-function tok-return-type tok-rust"><span class="tok-punctuation tok-separator tok-rust">-&gt;</span> <span class="tok-meta tok-generic tok-rust">Vec<span class="tok-punctuation tok-definition tok-generic tok-begin tok-rust">&lt;</span>PermissionDefinition<span class="tok-punctuation tok-definition tok-generic tok-end tok-rust">&gt;</span></span></span> </span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-support tok-macro tok-rust">vec!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-meta tok-path tok-rust">PermissionDefinition<span class="tok-punctuation tok-accessor tok-rust">::</span></span>new<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>
            <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>use block editor<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
            <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>Use the block editor for content with Blocks fields<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
        </span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span>
    </span></code></pre></figure><p>Build and install:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> trovato_block_editor<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mkdir</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> plugin-dist</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target/wasm32-wasip1/release/trovato_block_editor.wasm plugin-dist/</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin install trovato_block_editor</span>
    </span></code></pre></figure><blockquote>
    <p><strong>Note:</strong> WASM output goes to the workspace <code>target/</code> directory, not <code>plugins/trovato_block_editor/target/</code>.</p>
    </blockquote>
    <p>After installation, the plugin gates two API routes via the <code>plugin_gate!</code> macro in <code>crates/kernel/src/plugin/gate.rs</code>:</p>
    <table><thead><tr><th>Route</th><th>Method</th><th>Purpose</th></tr></thead><tbody>
    <tr><th><code>/api/block-editor/upload</code></th><th>POST</th><th>Image upload for the editor</th></tr>
    <tr><th><code>/api/block-editor/preview</code></th><th>POST</th><th>Server-side block rendering preview</th></tr>
    </tbody></table>
    <p>These routes return 404 when the plugin is not installed. When it is installed, they require authentication and the <code>use block editor</code> permission.</p>
