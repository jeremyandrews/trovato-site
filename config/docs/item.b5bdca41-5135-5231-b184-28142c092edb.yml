    <summary>Under the Hood: Block Processing on Form Submission</summary>
    <p>When a content form with Blocks fields is submitted, the <code>process_blocks_fields()</code> function in <code>crates/kernel/src/content/compound.rs</code> handles the server-side processing:</p>
    <ol>
    <li><strong>Parse</strong> -- The hidden input value (a JSON string) is parsed into a <code>Vec&lt;Value&gt;</code>.</li>
    <li><strong>Size check</strong> -- The raw JSON must be under 512 KB (<code>MAX_BLOCKS_JSON_BYTES</code>).</li>
    <li><strong>Count check</strong> -- The array must have no more than 100 blocks (<code>MAX_BLOCKS_COUNT</code>).</li>
    <li><strong>Validate</strong> -- Each block is validated against <code>BlockTypeRegistry::validate_block()</code>, which checks required fields, data types, and sanitization.</li>
    <li><strong>Sanitize</strong> -- <code>BlockTypeRegistry::sanitize_blocks()</code> runs ammonia on all text-bearing fields in-place.</li>
    <li><strong>Store</strong> -- The validated, sanitized block array replaces the raw string in the item's fields JSON.</li>
    </ol>
    <p>If any block fails validation, the error messages are returned to the user and the item is not saved.</p>
    </details>
    <hr />
    <h2>Step 4: Text Formats &amp; Sanitization</h2>
    <p>Block-based editing handles structured content, but some text fields (like Editor Notes) still use traditional text formats. This step covers how text formats work alongside the block editor.</p>
    <h3>4.1: Text Formats in Context</h3>
    <p>Trovato supports three text formats for traditional text fields (TextValue, TextLong):</p>
    <table><thead><tr><th>Format</th><th>Sanitization</th><th>Who Can Use</th></tr></thead><tbody>
    <tr><th><code>plain_text</code></th><th>HTML-escaped (no formatting)</th><th>Everyone</th></tr>
    <tr><th><code>filtered_html</code></th><th>Ammonia-sanitized (safe subset of HTML)</th><th>Users with <code>use filtered_html</code> permission</th></tr>
    <tr><th><code>full_html</code></th><th>No sanitization (trusted HTML)</th><th>Users with <code>use full_html</code> permission</th></tr>
    </tbody></table>
    <p>Within Blocks fields, text sanitization is handled at the block level by ammonia -- each block type's text fields are sanitized individually during <code>process_blocks_fields()</code>. The block editor does not use text format selectors. Instead, all block text content is treated as <code>filtered_html</code> equivalent: ammonia strips dangerous tags while preserving safe formatting.</p>
    <p>Traditional text fields (like <code>field_editor_notes</code>, which is <code>TextLong</code>) still use the format selector dropdown, where the available formats depend on the user's permissions.</p>
    <h3>4.2: Format Permissions by Role</h3>
    <p>The editor and publisher roles from Part 4 have the appropriate permissions:</p>
    <table><thead><tr><th>Role</th><th>Available Formats</th></tr></thead><tbody>
    <tr><th>Anonymous / Authenticated (no format perms)</th><th><code>plain_text</code> only</th></tr>
    <tr><th>Editor (has <code>use filtered_html</code>)</th><th><code>plain_text</code>, <code>filtered_html</code></th></tr>
    <tr><th>Publisher (has <code>use filtered_html</code> + <code>use full_html</code>)</th><th>All three formats</th></tr>
    </tbody></table>
    <p>When the content edit form renders a traditional text field, the <code>FormBuilder</code> checks these permissions via <code>with_permitted_formats()</code> and shows only the formats the user is allowed to use.</p>
    <h3>4.3: FilterPipeline Safety</h3>
    <p>The kernel provides two filter pipeline constructors:</p>
    <ul>
    <li><p><strong><code>FilterPipeline::for_format_safe()</code></strong> -- Used for user and plugin content. Validates the format string against a known allowlist (<code>plain_text</code>, <code>filtered_html</code>, <code>full_html</code>) and applies the appropriate sanitization. If the format is unrecognized, it falls back to <code>plain_text</code> (maximum escaping).</p>
    </li>
    <li><p><strong><code>FilterPipeline::for_format()</code></strong> -- Used internally by the kernel for trusted content. Accepts any format string. <strong>Never use this with user-supplied or plugin-supplied format strings</strong> -- it would allow a plugin to bypass sanitization by claiming a made-up format name.</p>
    </li>
    </ul>
    <p>This is a critical security boundary. The coding standards explicitly prohibit using <code>for_format()</code> with untrusted format strings.</p>
    <h3>Verify</h3>
