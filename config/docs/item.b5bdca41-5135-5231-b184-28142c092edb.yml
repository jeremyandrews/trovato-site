    <h2>Step 7: Form Alter &amp; Validation Plugins</h2>
    <p>With the block editor in place, the editorial workflow needs access control to enforce who can see and edit content at each stage. The <code>ritrovo_access</code> plugin provides this through two taps: <code>tap_item_access</code> for stage-based access decisions and <code>tap_perm</code> for permission declaration.</p>
    <h3>What <code>ritrovo_access</code> Does</h3>
    <p>The plugin source lives at <code>plugins/ritrovo_access/src/lib.rs</code>. It implements three taps:</p>
    <table><thead><tr><th>Tap</th><th>Behavior</th></tr></thead><tbody>
    <tr><th><code>tap_perm</code></th><th>Declares seven permissions for the Ritrovo editorial workflow</th></tr>
    <tr><th><code>tap_item_access</code></th><th>Returns Grant/Deny/Neutral based on item type, operation, stage, and user permissions</th></tr>
    <tr><th><code>tap_item_view</code></th><th>Placeholder for future editor_notes stripping (currently returns empty)</th></tr>
    </tbody></table>
    <h3>Permission Declaration</h3>
    <p>The plugin declares these permissions via <code>tap_perm</code>:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>view incoming conferences
    view curated conferences
    edit conferences
    publish conferences
    post comments
    edit own comments
    edit any comments
    </code></pre></figure><p>These permissions appear in the admin permissions UI at <code>/admin/people/permissions</code> after the plugin is installed.</p>
    <h3>Stage-Based Access Decisions</h3>
    <p>The <code>tap_item_access</code> handler is operation-aware. For <strong>view</strong> operations on internal stages, it checks stage-specific permissions. For <strong>non-view</strong> operations (edit, delete, update), it requires <code>edit conferences</code> regardless of stage:</p>
    <table><thead><tr><th>Operation</th><th>Stage</th><th>Required Permission</th></tr></thead><tbody>
    <tr><th>View</th><th>Incoming</th><th><code>view incoming conferences</code> or <code>edit conferences</code></th></tr>
    <tr><th>View</th><th>Curated</th><th><code>view curated conferences</code> or <code>edit conferences</code></th></tr>
    <tr><th>View</th><th>Live</th><th>Neutral (kernel handles)</th></tr>
    <tr><th>Edit/Delete/Update</th><th>Any</th><th><code>edit conferences</code></th></tr>
    </tbody></table>
    <p>Non-conference items always return Neutral, deferring to the kernel's default access check. The kernel already denies anonymous users on internal stages before dispatching to plugins, so <code>ritrovo_access</code> only needs to handle authenticated users.</p>
    <h3>Grant/Deny/Neutral Aggregation</h3>
    <p>The kernel aggregates access decisions from all plugins:</p>
    <ol>
    <li>If <strong>any</strong> plugin returns Deny, access is denied.</li>
    <li>If <strong>any</strong> plugin returns Grant (and none Deny), access is granted.</li>
    <li>If all return Neutral, the kernel falls through to role-based permission check.</li>
    </ol>
    <p>A Deny is absolute -- a single plugin can block access regardless of what others say.</p>
    <h3>Building and Installing the Plugin</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> ritrovo_access<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mkdir</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> plugin-dist</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target/wasm32-wasip1/release/ritrovo_access.wasm plugin-dist/</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>bin</span> trovato<span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin install ritrovo_access</span>
    </span></code></pre></figure><h3>Assigning Plugin Permissions to Roles</h3>
    <p>After installing <code>ritrovo_access</code>, assign its permissions to the viewer, editor, and publisher roles:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Viewer: can see all editorial stages
