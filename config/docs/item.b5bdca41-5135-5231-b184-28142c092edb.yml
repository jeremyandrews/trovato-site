    <h2>Step 6: File &amp; Image Uploads</h2>
    <p>Files uploaded through the block editor or the file field widget go through the kernel's file security pipeline. This step covers the upload flow and the security measures that protect it.</p>
    <h3>Upload Flow</h3>
    <ol>
    <li><p><strong>Receive</strong> -- The file arrives as <code>multipart/form-data</code> via <code>POST /file/upload</code> (general) or <code>POST /api/block-editor/upload</code> (block editor images).</p>
    </li>
    <li><p><strong>Authenticate</strong> -- Both endpoints require a logged-in user. The block editor endpoint additionally requires the <code>use block editor</code> permission.</p>
    </li>
    <li><p><strong>Validate MIME type</strong> -- The declared Content-Type is checked against <code>ALLOWED_MIME_TYPES</code>. The block editor endpoint further restricts to image types only (JPEG, PNG, GIF, WebP).</p>
    </li>
    <li><p><strong>Validate magic bytes</strong> -- <code>validate_magic_bytes()</code> reads the first bytes of the file and compares them against known file format signatures. This catches disguised executables -- an ELF binary renamed to <code>.jpg</code> will be rejected even if the Content-Type header claims <code>image/jpeg</code>.</p>
    </li>
    <li><p><strong>Sanitize filename</strong> -- <code>sanitize_filename()</code> strips path traversal sequences (<code>../</code>), special characters, and ensures the filename is safe for the filesystem. Raw user-supplied filenames are never used in storage paths.</p>
    </li>
    <li><p><strong>Size check</strong> -- Files exceeding <code>MAX_FILE_SIZE</code> are rejected.</p>
    </li>
    <li><p><strong>Store</strong> -- The file is written to the configured upload directory and a <code>file_managed</code> row is created with <code>status = 0</code> (temporary). When the parent item is saved, the file is promoted to <code>status = 1</code> (permanent).</p>
    </li>
    </ol>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-05/files-admin.png"><img src="images/part-05/files-admin.png" width="600" alt="The file management admin page showing uploaded files with metadata"></a></p>
    <h3>File Cleanup</h3>
    <p>Orphaned temporary files (uploaded but never attached to an item) are cleaned up by a cron task. The task runs periodically and deletes <code>file_managed</code> rows with <code>status = 0</code> that are older than the configured TTL, along with their physical files.</p>
    <h3>Security Summary</h3>
    <table><thead><tr><th>Threat</th><th>Mitigation</th></tr></thead><tbody>
    <tr><th>Executable upload disguised as image</th><th>Magic byte validation (<code>validate_magic_bytes()</code>)</th></tr>
    <tr><th>Path traversal (<code>../../etc/passwd</code>)</th><th>Filename sanitization (<code>sanitize_filename()</code>)</th></tr>
    <tr><th>Oversized uploads (DoS)</th><th><code>MAX_FILE_SIZE</code> check</th></tr>
    <tr><th>Unauthorized upload</th><th>Authentication + permission check</th></tr>
    <tr><th>MIME type spoofing</th><th>Magic bytes compared against declared MIME</th></tr>
    </tbody></table>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Upload an image via the block editor endpoint (requires auth + block editor permission)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
