    <summary>Under the Hood: tap_form_alter</summary>
    <p>When <code>FormService::build()</code> runs, it serializes the <code>Form</code> struct to JSON and dispatches <code>tap_form_alter</code> to all enabled plugins. Each plugin receives the full form definition and can return a modified version.</p>
    <p>The dispatch flow:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>FormService::build(&quot;conference_edit_form&quot;)
      -&gt; Form::new() with CSRF token
      -&gt; serde_json::to_string(&amp;form)
      -&gt; TapDispatcher::dispatch(&quot;tap_form_alter&quot;, form_json)
          -&gt; plugin_a returns modified form JSON
          -&gt; plugin_b returns modified form JSON
      -&gt; Last valid response wins
      -&gt; Return final Form
    </code></pre></figure><p>This is intentionally simple. The "last writer wins" model means plugin order matters -- plugins with higher weight get the final say. The <code>plugins</code> table's <code>weight</code> column controls this order.</p>
    <p>Plugin authors should make additive changes (adding fields, wrapping existing elements) rather than destructive ones (removing fields that other plugins depend on).</p>
    </details>
    <hr />
    <h2>Step 2: Block-Based Content Editing</h2>
    <p>Until now, conference descriptions have been plain text or simple HTML in a textarea. Trovato replaces the traditional WYSIWYG approach with a <strong>block editor</strong> -- a structured content model where each piece of content is a typed block with a defined schema.</p>
    <h3>2.1: Why Blocks</h3>
    <p>Traditional WYSIWYG editors (TinyMCE, CKEditor) produce freeform HTML. The author has total control over the markup, which creates problems:</p>
    <ul>
    <li><strong>Inconsistent structure</strong> -- One editor wraps text in <code>&lt;div&gt;</code>, another in <code>&lt;p&gt;</code>, a third pastes from Word with inline styles.</li>
    <li><strong>Difficult to repurpose</strong> -- Extracting the "first image" or "summary paragraph" from arbitrary HTML requires fragile parsing.</li>
    <li><strong>Hard to validate</strong> -- The server cannot enforce that a description has a heading, or that code blocks specify a language, because everything is just one big HTML string.</li>
    </ul>
    <p>Block-based editing solves this by constraining content into typed, schema-validated units. Each block has a known structure that the server can validate, render, and transform independently.</p>
    <h3>2.2: The Eight Standard Block Types</h3>
    <p>Trovato ships eight block types, all defined in <code>crates/kernel/src/content/block_types.rs</code>:</p>
    <table><thead><tr><th>Block Type</th><th>Purpose</th><th>Required Data</th></tr></thead><tbody>
    <tr><th><code>paragraph</code></th><th>Body text with inline formatting</th><th><code>text</code> (string, sanitized HTML)</th></tr>
    <tr><th><code>heading</code></th><th>Section heading (h1-h6)</th><th><code>text</code> (string), <code>level</code> (integer 1-6)</th></tr>
    <tr><th><code>image</code></th><th>Image with caption</th><th><code>file.url</code> (string), <code>alt</code> (required string -- empty for decorative images), optional <code>caption</code></th></tr>
    <tr><th><code>list</code></th><th>Ordered or unordered list</th><th><code>style</code> ("ordered" or "unordered"), <code>items</code> (string array)</th></tr>
    <tr><th><code>quote</code></th><th>Blockquote with attribution</th><th><code>text</code> (string), optional <code>caption</code></th></tr>
    <tr><th><code>code</code></th><th>Code snippet with language</th><th><code>code</code> (string), optional <code>language</code></th></tr>
    <tr><th><code>delimiter</code></th><th>Horizontal rule separator</th><th>(none)</th></tr>
    <tr><th><code>embed</code></th><th>External media (YouTube, Vimeo)</th><th><code>service</code> (string), <code>source</code> (URL)</th></tr>
    </tbody></table>
    <p>Each block type has a JSON Schema that defines its expected data shape and an <code>allowed_formats</code> list that controls which text formats can be used for its text fields. The paragraph, heading, quote, and list types allow <code>filtered_html</code> and <code>plain_text</code>. Image, code, delimiter, and embed types have no text format (their content is either URLs or raw code, not rich text).</p>
    <p>Here is how a paragraph block renders:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Storage: {&quot;type&quot;: &quot;paragraph&quot;, &quot;weight&quot;: 0, &quot;data&quot;: {&quot;text&quot;: &quot;&lt;p&gt;A conference about &lt;b&gt;Rust&lt;/b&gt;.&lt;/p&gt;&quot;}}
    HTML:    &lt;p&gt;A conference about &lt;b&gt;Rust&lt;/b&gt;.&lt;/p&gt;
    </code></pre></figure><p>And a code block:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Storage: {&quot;type&quot;: &quot;code&quot;, &quot;weight&quot;: 3, &quot;data&quot;: {&quot;code&quot;: &quot;fn main() {}&quot;, &quot;language&quot;: &quot;rust&quot;}}
    HTML:    &lt;pre&gt;&lt;code class=&quot;language-rust&quot;&gt;...(syntax highlighted)...&lt;/code&gt;&lt;/pre&gt;
    </code></pre></figure><h3>2.3: Block Storage Format</h3>
