    <summary>Under the Hood: The Layered Access Model</summary>
    <p>The complete item access check in <code>check_access()</code>:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>1. Admin bypass
       -&gt; User has is_admin? GRANT (skip everything else)

    2. Stage visibility
       -&gt; Item is on an internal stage (Incoming/Curated)?
       -&gt; User is anonymous? DENY (kernel enforcement, before any plugin dispatch)
       -&gt; Skip the &quot;published view shortcut&quot; for internal stages

    3. Published view shortcut (public stages only)
       -&gt; Item is published (status=1) AND on a Public stage?
       -&gt; User has &quot;access content&quot; permission? GRANT

    4. Plugin hooks (tap_item_access)
       -&gt; Dispatch to all plugins with enriched context:
         user_authenticated, user_permissions, stage_id, stage_machine_name
       -&gt; Aggregate: any Deny wins, then any Grant, else Neutral
       -&gt; ritrovo_access checks stage + user permissions here

    5. Role-based fallback
       -&gt; Check five permission patterns:
         - &quot;{op} any content&quot;
         - &quot;{op} any {type}&quot;
         - &quot;{op} {type} content&quot;
         - &quot;{op} own content&quot; (author match)
         - &quot;{op} own {type}&quot; (author match)
       -&gt; Any match? GRANT. None? DENY.
    </code></pre></figure><p>The stage visibility check (step 2) ensures anonymous users never see internal-stage content, even without any plugins installed. The published view shortcut (step 3) handles the common case -- authenticated users viewing Live content -- without dispatching to plugins. Plugin hooks only fire when neither shortcut applies.</p>
    </details>
    <hr />
    <h2>Step 8: User Profile Form</h2>
    <p>Logged-in users can edit their profile at <code>/user/profile</code>. This form demonstrates the Form API in a non-content context: editing user data rather than items.</p>
    <h3>Profile Fields</h3>
    <table><thead><tr><th>Field</th><th>Type</th><th>Notes</th></tr></thead><tbody>
    <tr><th>Display name</th><th>Text</th><th>Shown in comment attribution and content authorship</th></tr>
    <tr><th>Email</th><th>Text</th><th>Used for account recovery and notifications</th></tr>
    <tr><th>Bio</th><th>Textarea</th><th>Rich text with <code>filtered_html</code> format (if the user has the permission)</th></tr>
    <tr><th>Timezone</th><th>Select</th><th>Dropdown of common timezones</th></tr>
    </tbody></table>
    <h3>Password Change</h3>
    <p>The profile page also includes a password change section:</p>
    <ul>
    <li>Current password (required to confirm identity)</li>
    <li>New password (minimum 12 characters)</li>
    <li>Confirm new password</li>
    </ul>
    <p>Password changes cycle the session ID (fixation protection) and re-hash with Argon2id.</p>
    <h3>Access Control</h3>
    <ul>
    <li><code>/user/profile</code> requires authentication -- unauthenticated requests redirect to <code>/user/login</code></li>
    <li>Users can only edit their own profile</li>
    <li>The form uses <code>require_csrf</code> for CSRF protection on submission</li>
    </ul>
