    </span></code></pre></figure><h3>How the Content Edit Form Works Today</h3>
    <p>The current admin content edit form at <code>/item/{id}/edit</code> uses the temporary <code>FormBuilder</code> in <code>content/form.rs</code>, which generates HTML strings directly from <code>ContentTypeDefinition</code> field definitions. This works but bypasses the Form API pipeline -- plugins cannot alter these forms via <code>tap_form_alter</code>.</p>
    <p>The Form API exists alongside this temporary system. As the Form API matures, content forms will migrate to it, enabling plugin-driven form customization. The conference submission form you will build in Step 4 uses the Form API directly.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-05/content-form-full.png"><img src="images/part-05/content-form-full.png" width="600" alt="The full content edit form showing all fields including title, dates, location, and description"></a></p>
