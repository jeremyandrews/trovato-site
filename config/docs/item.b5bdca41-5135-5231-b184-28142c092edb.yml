    <h2>What You've Built</h2>
    <p>By the end of Part 5, you have:</p>
    <ul>
    <li><strong>Form API pipeline</strong> -- Build &gt; Validate &gt; Submit with plugin extension points (<code>tap_form_alter</code>, <code>tap_form_validate</code>, <code>tap_form_submit</code>).</li>
    <li><strong>Block-based content editing</strong> with eight standard block types, Editor.js integration, and a hidden-input serialization pattern.</li>
    <li><strong>Block rendering pipeline</strong> -- Server-side rendering with ammonia sanitization, syntect syntax highlighting, and embed URL whitelisting.</li>
    <li><strong>Text format permissions</strong> -- <code>plain_text</code>, <code>filtered_html</code>, <code>full_html</code> for traditional text fields, with <code>FilterPipeline::for_format_safe()</code> as the security boundary.</li>
    <li><strong>Block validation</strong> via <code>BlockTypeRegistry</code> with JSON Schema definitions and extensibility for custom block types.</li>
    <li><strong>Secure file uploads</strong> with magic byte validation, filename sanitization, MIME type checking, and size limits.</li>
    <li><strong><code>trovato_block_editor</code> plugin</strong> -- Activates the Editor.js widget and gates the upload/preview API routes.</li>
    <li><strong><code>ritrovo_access</code> plugin</strong> -- Stage-based Grant/Deny access decisions via <code>tap_item_access</code>, permission declaration via <code>tap_perm</code>, and operation-aware access control.</li>
    <li><strong>User profile editing</strong> with password change and session fixation protection.</li>
    </ul>
    <p>You also now understand:</p>
    <ul>
    <li>How block-based editing provides structured, schema-validated content instead of freeform HTML.</li>
    <li>How <code>render_blocks()</code> converts block arrays into semantic HTML with type-specific renderers.</li>
    <li>How the block editor maps between Trovato's <code>{type, weight, data}</code> format and Editor.js's <code>{id, type, data}</code> format.</li>
    <li>How text format permissions control what HTML users can produce, with ammonia sanitization as the security backstop.</li>
    <li>How <code>BlockTypeRegistry</code> validates blocks and provides extensibility for custom block types.</li>
    <li>How <code>tap_item_access</code> with Grant/Deny/Neutral aggregation enables plugin-driven access decisions.</li>
    <li>How file upload security works at the boundary with magic bytes, filename sanitization, and MIME validation.</li>
    </ul>
    <p>Three plugins now collaborate: <code>ritrovo_importer</code> (Part 2) feeds data, <code>trovato_block_editor</code> (Part 5) enables structured editing, and <code>ritrovo_access</code> (Part 5) enforces visibility. Each extends the kernel through taps and host functions, and none depends on any other.</p>
    <hr />
    <h2>AI Assist Buttons</h2>
    <p>When the <code>trovato_ai</code> plugin is enabled, content editing forms gain <strong>AI Assist</strong> buttons next to text fields (textfield and textarea elements). These buttons appear for users with the <code>use ai chat</code> permission.</p>
    <h3>How It Works</h3>
    <p>The <code>trovato_ai</code> plugin uses <code>tap_form_alter</code> to inject an "AI Assist" button as a suffix on each text field. When clicked, the button opens a popover with five operations:</p>
    <table><thead><tr><th>Operation</th><th>What It Does</th></tr></thead><tbody>
    <tr><th><strong>Rewrite</strong></th><th>Improve clarity and flow while preserving meaning</th></tr>
    <tr><th><strong>Expand</strong></th><th>Add more detail and supporting information</th></tr>
    <tr><th><strong>Shorten</strong></th><th>Reduce to roughly half the length, keeping key points</th></tr>
    <tr><th><strong>Translate</strong></th><th>Translate to a selected language (10 languages available)</th></tr>
    <tr><th><strong>Adjust Tone</strong></th><th>Rewrite in a different tone (formal, casual, technical, etc.)</th></tr>
    </tbody></table>
    <p>Each operation sends the field content to <code>POST /api/v1/ai/assist</code>, which calls the configured AI provider. The result appears as a preview — the user can <strong>Accept</strong> (replace the field value) or <strong>Reject</strong> (dismiss with no change).</p>
    <h3>Requirements</h3>
    <ul>
    <li>The <code>trovato_ai</code> plugin must be enabled</li>
    <li>An AI provider must be configured at <code>/admin/config/ai</code></li>
    <li>The user needs <code>use ai</code> and <code>use ai chat</code> permissions</li>
    <li>The buttons only appear on item editing forms (form IDs starting with <code>item_</code>)</li>
    </ul>
    <h3>Field Rules</h3>
    <p>Beyond inline assist, the <code>trovato_ai</code> plugin also supports <strong>field rules</strong> — automatic content enrichment that runs on save. Field rules are configured in site config under <code>trovato_ai.field_rules</code> and fire via <code>tap_item_presave</code>. For example, a rule can auto-generate a summary field whenever the description field changes.</p>
