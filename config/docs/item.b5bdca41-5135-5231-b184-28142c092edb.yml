    <li><strong><code>type</code></strong> -- One of the eight standard types (or a custom type registered by a plugin).</li>
    <li><strong><code>weight</code></strong> -- Integer that controls display order. Blocks render in ascending weight order.</li>
    <li><strong><code>data</code></strong> -- Type-specific payload validated against the block type's JSON Schema.</li>
    </ul>
    <p>This is the <code>FieldType::Blocks</code> variant in the SDK's <code>FieldType</code> enum. It differs from <code>FieldType::Compound</code>, which stores <code>{"sections": [{type, weight, data}]}</code> -- a wrapper object with a <code>sections</code> key. Blocks fields store the array directly, without the wrapper.</p>
    <p>The conference content type config at <code>docs/tutorial/config/item_type.conference.yml</code> defines <code>field_description</code> as <code>Blocks</code>:</p>
