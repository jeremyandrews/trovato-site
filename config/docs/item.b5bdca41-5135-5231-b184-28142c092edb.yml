    <li><p><strong>Auto-initialization</strong> -- The <code>block-editor.js</code> script (<code>static/js/block-editor.js</code>) finds all <code>[data-block-editor]</code> containers on <code>DOMContentLoaded</code>, reads the associated hidden input, and initializes an Editor.js instance.</p>
    </li>
    </ol>
    <p>The script maps between Trovato's block format (<code>{type, weight, data}</code>) and Editor.js's format (<code>{id, type, data}</code>). On form submission, it intercepts the submit event, calls <code>editor.save()</code> on every active editor, converts the output back to Trovato format, serializes it into the hidden inputs, and then submits the form.</p>
    <p>If Editor.js fails to load (CDN unavailable, JavaScript disabled), the script falls back to a plain <code>&lt;textarea&gt;</code> where the user can edit the JSON directly.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-05/block-editor-form.png"><img src="images/part-05/block-editor-form.png" width="600" alt="The block editor interface in the admin content form with paragraph, heading, and image blocks"></a></p>
    <h3>2.6: Image Upload via Blocks</h3>
    <p>The image block tool uses the <code>/api/block-editor/upload</code> endpoint. When a user adds an image block and selects a file:</p>
    <ol>
    <li><p>Editor.js calls <code>POST /api/block-editor/upload</code> with <code>multipart/form-data</code>.</p>
    </li>
    <li><p>The server validates: authentication, file size, MIME type (JPEG, PNG, GIF, WebP only), and magic bytes.</p>
    </li>
    <li><p>On success, the server returns Editor.js's expected format:</p>
    <figure class="code"><figcaption class="code__lang">json</figcaption><pre class="code__body" tabindex="0" aria-label="json code"><code class="language-json"><span class="tok-source tok-json"><span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span><span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>success<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-constant tok-numeric tok-json">1</span><span class="tok-punctuation tok-separator tok-dictionary tok-pair tok-json">,</span></span> <span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>file<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-meta tok-structure tok-dictionary tok-json"><span class="tok-punctuation tok-section tok-dictionary tok-begin tok-json">{</span><span class="tok-meta tok-structure tok-dictionary tok-key tok-json"><span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>url<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-meta tok-structure tok-dictionary tok-value tok-json"><span class="tok-punctuation tok-separator tok-dictionary tok-key-value tok-json">:</span> <span class="tok-string tok-quoted tok-double tok-json"><span class="tok-punctuation tok-definition tok-string tok-begin tok-json">&quot;</span>/files/uploads/2026-03/rustconf-stage.jpg<span class="tok-punctuation tok-definition tok-string tok-end tok-json">&quot;</span></span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span></span><span class="tok-punctuation tok-section tok-dictionary tok-end tok-json">}</span></span>
    </span></code></pre></figure></li>
    <li><p>The URL is stored in the block's <code>data.file.url</code> field and rendered as an <code>&lt;img&gt;</code> tag.</p>
    </li>
    </ol>
    <p>The upload handler in <code>crates/kernel/src/routes/file.rs</code> reuses the kernel's file service (<code>FileService</code>) with an additional MIME type allowlist restricted to images:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">BLOCK_EDITOR_IMAGE_TYPES</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>image/jpeg<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>image/png<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>image/gif<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>image/webp<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><h3>2.7: Server-Side Preview</h3>
    <p>The <code>/api/block-editor/preview</code> endpoint accepts a JSON body with a <code>blocks</code> array and returns rendered HTML:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>b</span> /tmp/trovato-cookies.txt <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>X</span> POST http://localhost:3000/api/block-editor/preview <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>H</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>Content-Type: application/json<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span> <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell">  -</span>d</span> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>{&quot;blocks&quot;: [{&quot;type&quot;: &quot;paragraph&quot;, &quot;weight&quot;: 0, &quot;data&quot;: {&quot;text&quot;: &quot;Hello world&quot;}}]}<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span> <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
    </span></span>  <span class="tok-keyword tok-operator tok-logical tok-pipe tok-shell">|</span> <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">jq</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> <span class="tok-string tok-quoted tok-single tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&#39;</span>.html<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&#39;</span></span></span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> &quot;&lt;p&gt;Hello world&lt;/p&gt;&quot;</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>The preview uses the same <code>render_blocks()</code> function as the public item view, so the preview is an exact representation of how the content will appear to visitors. The client-side script renders the preview in a sandboxed iframe (<code>sandbox="allow-same-origin"</code>) for defense-in-depth.</p>
    <hr />
    <h2>Step 3: Block Rendering on Display</h2>
    <p>When a visitor views a conference at <code>/item/{id}</code> or its pathauto alias, the item handler detects Blocks fields and renders them with the server-side block renderer.</p>
    <p><a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/images/part-05/pathauto-config.png"><img src="images/part-05/pathauto-config.png" width="600" alt="The pathauto configuration page showing URL alias patterns for content types"></a></p>
    <h3>3.1: The <code>render_blocks()</code> Pipeline</h3>
    <p>The rendering pipeline in <code>crates/kernel/src/content/block_render.rs</code>:</p>
    <ol>
    <li>Iterates over the block array.</li>
    <li>Dispatches each block to a type-specific renderer based on the <code>type</code> field.</li>
    <li>Concatenates the rendered HTML fragments into a single string.</li>
    </ol>
    <p>Each block type produces semantic HTML:</p>
    <table><thead><tr><th>Block Type</th><th>Rendered HTML</th></tr></thead><tbody>
    <tr><th><code>paragraph</code></th><th><code>&lt;p&gt;sanitized text&lt;/p&gt;</code></th></tr>
    <tr><th><code>heading</code></th><th><code>&lt;h2&gt;text&lt;/h2&gt;</code> (level-aware, clamped 1-6)</th></tr>
    <tr><th><code>image</code></th><th><code>&lt;figure&gt;&lt;img src="..." alt="..."&gt;&lt;figcaption&gt;caption&lt;/figcaption&gt;&lt;/figure&gt;</code></th></tr>
    <tr><th><code>list</code></th><th><code>&lt;ol&gt;</code> or <code>&lt;ul&gt;</code> with <code>&lt;li&gt;</code> items</th></tr>
    <tr><th><code>quote</code></th><th><code>&lt;blockquote&gt;&lt;p&gt;text&lt;/p&gt;&lt;cite&gt;caption&lt;/cite&gt;&lt;/blockquote&gt;</code></th></tr>
    <tr><th><code>code</code></th><th><code>&lt;pre&gt;&lt;code class="language-..."&gt;highlighted&lt;/code&gt;&lt;/pre&gt;</code></th></tr>
    <tr><th><code>delimiter</code></th><th><code>&lt;hr&gt;</code></th></tr>
    <tr><th><code>embed</code></th><th><code>&lt;div class="embed-responsive"&gt;&lt;iframe ...&gt;&lt;/iframe&gt;&lt;/div&gt;</code> (whitelisted) or <code>&lt;a href="..."&gt;</code> (non-whitelisted)</th></tr>
    </tbody></table>
    <p>Text content in paragraph, heading, quote, and list blocks is sanitized via <code>ammonia::clean()</code>, which strips dangerous tags while preserving safe inline formatting (<code>&lt;b&gt;</code>, <code>&lt;i&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;br&gt;</code>, etc.).</p>
    <p>Image URLs and captions are HTML-escaped via <code>html_escape()</code> (not ammonia) because they are attribute values and plain text, not rich HTML.</p>
    <p>In the item view handler (<code>crates/kernel/src/routes/item.rs</code>), the detection works by checking each field against the content type's field definitions:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">let</span> is_blocks_field <span class="tok-keyword tok-operator tok-rust">=</span> content_type_fields.<span class="tok-support tok-function tok-rust">iter</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>.<span class="tok-support tok-function tok-rust">any</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">|</span></span></span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-variable tok-parameter tok-rust">f</span><span class="tok-punctuation tok-section tok-parameters tok-end tok-rust">|</span></span> </span><span class="tok-meta tok-function tok-closure tok-rust"><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        f.field_name <span class="tok-keyword tok-operator tok-rust">=</span><span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-keyword tok-operator tok-rust">*</span>name
            <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-keyword tok-operator tok-rust">&amp;</span> <span class="tok-support tok-macro tok-rust">matches!</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>f.field_type<span class="tok-punctuation tok-separator tok-rust">,</span> <span class="tok-meta tok-path tok-rust">trovato_sdk<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">types<span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">FieldType<span class="tok-punctuation tok-accessor tok-rust">::</span></span>Blocks</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span></span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    <span class="tok-keyword tok-control tok-rust">if</span> is_blocks_field <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
        <span class="tok-keyword tok-control tok-rust">if</span> <span class="tok-storage tok-type tok-rust">let</span> <span class="tok-support tok-type tok-rust">Some</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>blocks</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> value.<span class="tok-support tok-function tok-rust">as_array</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span></span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span> <span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-begin tok-rust">{</span>
            <span class="tok-storage tok-type tok-rust">let</span> rendered <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-keyword tok-other tok-rust">crate</span><span class="tok-meta tok-path tok-rust"><span class="tok-punctuation tok-accessor tok-rust">::</span></span><span class="tok-meta tok-path tok-rust">content<span class="tok-punctuation tok-accessor tok-rust">::</span></span>render_blocks<span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">(</span>blocks</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-end tok-rust">)</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
            <span class="tok-comment tok-line tok-double-slash tok-rust"><span class="tok-punctuation tok-definition tok-comment tok-rust">//</span> Wrap in a div with field-specific class
    </span>    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span><span class="tok-meta tok-block tok-rust"><span class="tok-punctuation tok-section tok-block tok-end tok-rust">}</span></span>
    </span></code></pre></figure><p>Unknown block types are silently skipped -- they produce no output. This is intentional: if a plugin registers a custom block type and is later disabled, the blocks remain in storage but do not render until the plugin is re-enabled with a custom renderer.</p>
    <h4>The <code>render_blocks</code> Tera Filter</h4>
    <p>For templates that access Blocks fields directly (such as Gather query templates), the kernel provides a <code>render_blocks</code> Tera filter:</p>
    <figure class="code"><figcaption class="code__lang">html</figcaption><pre class="code__body" tabindex="0" aria-label="html code"><code class="language-html"><span class="tok-text tok-html tok-basic">{{ row.fields.field_description | render_blocks | safe }}
    </span></code></pre></figure><p>The filter accepts either a JSON array of blocks (producing rendered HTML via the same pipeline described above) or a plain string (returned as-is for backward compatibility with TextLong fields). The <code>| safe</code> is required because the output is pre-sanitized HTML from ammonia. The conference card template (<code>templates/gather/includes/conf-card.html</code>) uses this pattern.</p>
    <h3>3.2: Syntax Highlighting for Code Blocks</h3>
    <p>Code blocks with a <code>language</code> field get server-side syntax highlighting via the <code>syntect</code> crate. The renderer:</p>
    <ol>
    <li>Loads the default syntax set and theme set (cached in <code>LazyLock</code> statics to avoid reloading per request).</li>
    <li>Looks up the syntax definition by language token or name.</li>
    <li>If found, produces highlighted HTML with <code>&lt;span&gt;</code> tags and inline styles via syntect's <code>highlighted_html_for_string()</code>.</li>
    <li>If the language is unknown or highlighting fails, falls back to plain HTML-escaped text in <code>&lt;pre&gt;&lt;code&gt;</code>.</li>
    </ol>
    <p>The default theme is "InspiredGitHub" with a fallback to "base16-ocean.dark". Both ship with syntect's default theme set.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Input:  {&quot;type&quot;: &quot;code&quot;, &quot;data&quot;: {&quot;code&quot;: &quot;fn main() {\n    println!(\&quot;hello\&quot;);\n}&quot;, &quot;language&quot;: &quot;rust&quot;}}
    Output: &lt;pre&gt;&lt;code class=&quot;language-rust&quot;&gt;&lt;span style=&quot;...&quot;&gt;fn&lt;/span&gt; &lt;span style=&quot;...&quot;&gt;main&lt;/span&gt;() ...&lt;/code&gt;&lt;/pre&gt;
    </code></pre></figure><h3>3.3: Embed Security</h3>
    <p>Embed blocks render external content. Without controls, an embed block could inject arbitrary iframes. Trovato uses a URL whitelist:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">EMBED_WHITELIST</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span><span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span><span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-meta tok-group tok-rust"><span class="tok-punctuation tok-section tok-group tok-begin tok-rust">[</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>youtube.com/watch<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>youtube.com/embed/<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>youtu.be/<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>vimeo.com/<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
        <span class="tok-string tok-quoted tok-double tok-rust"><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">&quot;</span>player.vimeo.com/<span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;</span></span><span class="tok-punctuation tok-separator tok-rust">,</span>
    <span class="tok-punctuation tok-section tok-group tok-end tok-rust">]</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>
    </span></code></pre></figure><p>The whitelist matching normalizes URLs by stripping the protocol prefix and <code>www.</code> before checking against the patterns.</p>
    <table><thead><tr><th>URL</th><th>Result</th></tr></thead><tbody>
    <tr><th><code>https://youtube.com/watch?v=abc123</code></th><th>Rendered as <code>&lt;iframe&gt;</code> with <code>allowfullscreen</code></th></tr>
    <tr><th><code>https://vimeo.com/123456</code></th><th>Rendered as <code>&lt;iframe&gt;</code></th></tr>
    <tr><th><code>https://evil.example.com/payload</code></th><th>Rendered as a safe <code>&lt;a href="..."&gt;</code> link (no iframe)</th></tr>
    <tr><th><code>javascript:alert('xss')</code></th><th>Rendered as <code>&lt;span&gt;</code> (plain text, no href)</th></tr>
    </tbody></table>
    <p>Non-whitelisted HTTP(S) URLs become clickable links. Non-HTTP URLs (like <code>javascript:</code>) are rendered as plain text in a <code>&lt;span&gt;</code> -- no <code>href</code> attribute at all. This is defense-in-depth: even if an attacker manages to insert an embed block with a malicious URL, it cannot execute code in the visitor's browser.</p>
    <h3>Verify</h3>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Render a test block array via the preview endpoint</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>s</span><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>b</span> /tmp/trovato-cookies.txt <span class="tok-punctuation tok-separator tok-continuation tok-line tok-shell">\
