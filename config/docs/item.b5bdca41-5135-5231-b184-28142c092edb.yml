    <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> roles r, (<span class="tok-keyword tok-other tok-DML tok-II tok-sql">VALUES</span>
      (<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>view incoming conferences<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>), (<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>view curated conferences<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>),
      (<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>edit conferences<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>)
    ) <span class="tok-keyword tok-other tok-alias tok-sql">AS</span> p(perm)
    <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> <span class="tok-constant tok-other tok-database-name tok-sql">r</span>.<span class="tok-constant tok-other tok-table-name tok-sql">name</span> <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>editor<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>
    <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> CONFLICT (role_id, permission) DO NOTHING;

