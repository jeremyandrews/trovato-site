    <blockquote>
    <p><strong>Implementation note:</strong> The registry infrastructure and <code>register()</code> method are complete. Plugins register custom block types by contributing to the registry during initialization. A dedicated <code>tap_block_types</code> tap for declarative registration is a future enhancement.</p>
    </blockquote>
    <h3>5.3: Client-Side Tool Registration in Editor.js</h3>
    <p>For a custom block type to appear in the block editor UI, it needs a corresponding Editor.js tool. The <code>block-editor.js</code> script builds the tool configuration in <code>buildToolConfig()</code>, which maps block type names to Editor.js tool classes:</p>
