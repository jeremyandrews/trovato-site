    <h1>Part 5: Forms &amp; User Input</h1>
    <p>Part 4 built the editorial engine: users, roles, stages, revisions, and admin content management. But content creation still relies on auto-generated admin forms and the importer plugin. Part 5 opens the front door to user input.</p>
    <p>You will tour the <strong>Form API</strong> -- the structured pipeline that builds, validates, and processes forms. You will learn how the <strong>block editor</strong> replaces freeform WYSIWYG with structured content editing, how text formats (<code>plain_text</code>, <code>filtered_html</code>, <code>full_html</code>) control what HTML users can produce, how the <code>trovato_block_editor</code> and <code>ritrovo_access</code> plugins extend the kernel through taps, and how file uploads are secured at the boundary.</p>
    <blockquote>
    <p><strong>Implementation note:</strong> The Form API core (types, service, AJAX, CSRF) is in <code>crates/kernel/src/form/</code>. The block editor infrastructure -- block types, rendering, validation, and the Editor.js integration -- is fully implemented. The <code>trovato_block_editor</code> plugin activates the client-side editor and its API routes. The <code>ritrovo_cfp</code> plugin provides CFP deadline badges and date validation. The <code>ritrovo_access</code> plugin provides stage-based access control. All features described in this part are implemented.</p>
    </blockquote>
    <p><strong>Start state:</strong> Auto-generated admin forms, three test users with roles, three editorial stages, revision tracking.
    <strong>End state:</strong> Form API pipeline, block-based content editing with Editor.js, text format permissions, block rendering with syntax highlighting, file upload security, two installed plugins (<code>trovato_block_editor</code> and <code>ritrovo_access</code>), user profile editing.</p>
    <hr />
    <h2>Step 1: The Form API</h2>
    <p>The admin content forms you used in Parts 3 and 4 are auto-generated by a temporary <code>FormBuilder</code> in <code>content/form.rs</code>. Trovato's real form system is the <strong>Form API</strong> -- a structured pipeline that plugins can extend.</p>
    <h3>The Three Phases</h3>
    <p>When a form renders and processes:</p>
    <ol>
    <li><p><strong>Build</strong> -- The kernel creates a <code>Form</code> struct from the form ID, populates it with <code>FormElement</code> definitions, generates a CSRF token, and dispatches <code>tap_form_alter</code> so plugins can add, remove, or reorder fields.</p>
    </li>
    <li><p><strong>Validate</strong> -- On submission, the kernel verifies the CSRF token, runs built-in validation (required fields, type checking), and dispatches <code>tap_form_validate</code> for plugin validation rules. Trovato forms are accessible by default -- when a field fails validation, its error message is programmatically linked via <code>aria-describedby</code> so screen readers announce the error when the field is focused. The <code>aria-invalid="true"</code> attribute signals which fields need attention.</p>
    </li>
    <li><p><strong>Submit</strong> -- If validation passes, the kernel dispatches <code>tap_form_submit</code> for side effects (e.g., saving data, sending notifications), then returns a success result or redirect.</p>
    </li>
    </ol>
    <h3>Form Elements</h3>
    <p>The Form API provides 13 element types, each constructed with a fluent builder:</p>
    <table><thead><tr><th>Element</th><th>Constructor</th><th>Purpose</th></tr></thead><tbody>
    <tr><th><code>Textfield</code></th><th><code>FormElement::textfield()</code></th><th>Single-line text input</th></tr>
    <tr><th><code>Textarea</code></th><th><code>FormElement::textarea(rows)</code></th><th>Multi-line text input</th></tr>
    <tr><th><code>Select</code></th><th><code>FormElement::select(options)</code></th><th>Dropdown select</th></tr>
    <tr><th><code>Checkbox</code></th><th><code>FormElement::checkbox()</code></th><th>Single checkbox</th></tr>
    <tr><th><code>Checkboxes</code></th><th><code>FormElement::checkboxes(options)</code></th><th>Multiple checkboxes</th></tr>
    <tr><th><code>Radio</code></th><th><code>FormElement::radio(options)</code></th><th>Radio button group</th></tr>
    <tr><th><code>Hidden</code></th><th><code>FormElement::hidden()</code></th><th>Hidden field</th></tr>
    <tr><th><code>Password</code></th><th><code>FormElement::password()</code></th><th>Password field</th></tr>
    <tr><th><code>File</code></th><th><code>FormElement::file()</code></th><th>File upload</th></tr>
    <tr><th><code>Submit</code></th><th><code>FormElement::submit(label)</code></th><th>Submit button</th></tr>
    <tr><th><code>Fieldset</code></th><th><code>FormElement::fieldset()</code></th><th>Grouping container</th></tr>
    <tr><th><code>Markup</code></th><th><code>FormElement::markup(html)</code></th><th>Display-only HTML</th></tr>
    <tr><th><code>Container</code></th><th><code>FormElement::container()</code></th><th>AJAX target wrapper</th></tr>
    </tbody></table>
    <p>Every element supports <code>.title()</code>, <code>.description()</code>, <code>.required()</code>, <code>.weight()</code>, <code>.placeholder()</code>, <code>.disabled()</code>, and <code>.ajax()</code> for AJAX callbacks. Elements are stored in a <code>BTreeMap</code> keyed by name and sorted by weight for rendering.</p>
