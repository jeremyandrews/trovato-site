    </span></span></code></pre></figure><h3>2.5: Using the Block Editor in the Admin Form</h3>
    <p>When a content type has a <code>Blocks</code> field, the admin content form at <code>templates/admin/content-form.html</code> detects it and loads the Editor.js integration.</p>
    <p>The template logic:</p>
    <ol>
    <li><p><strong>Detection</strong> -- The template iterates over <code>content_type.fields</code> and sets <code>has_blocks = true</code> if any field has <code>field_type == "Blocks"</code>.</p>
    </li>
    <li><p><strong>CSS</strong> -- When <code>has_blocks</code> is true, the template loads <code>/static/css/block-editor.css</code>.</p>
    </li>
    <li><p><strong>Hidden input</strong> -- Each Blocks field renders as a hidden <code>&lt;input&gt;</code> containing the current blocks as JSON, plus a <code>&lt;div data-block-editor&gt;</code> container:</p>
