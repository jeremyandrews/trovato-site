    <h2>Step 5: Block Validation &amp; Custom Block Types</h2>
    <p>The eight standard block types cover common content needs, but the system is designed for extensibility.</p>
    <h3>5.1: <code>BlockTypeRegistry</code> and JSON Schema Validation</h3>
    <p>The <code>BlockTypeRegistry</code> in <code>crates/kernel/src/content/block_types.rs</code> is the central authority for block type definitions. Each registered type has:</p>
    <ul>
    <li><strong><code>type_name</code></strong> -- Machine name (e.g., <code>"paragraph"</code>, <code>"code"</code>).</li>
    <li><strong><code>label</code></strong> -- Human-readable label (e.g., <code>"Paragraph"</code>, <code>"Code"</code>).</li>
    <li><strong><code>schema</code></strong> -- JSON Schema describing the expected data shape.</li>
    <li><strong><code>allowed_formats</code></strong> -- Which text formats this block can use.</li>
    <li><strong><code>plugin</code></strong> -- Which plugin provides this block type (<code>"core"</code> for the standard eight).</li>
    </ul>
    <p>At startup, <code>BlockTypeRegistry::with_standard_types()</code> registers all eight standard types. Validation happens in <code>validate_block()</code>, which dispatches to type-specific logic:</p>
    <ul>
    <li><strong>Text blocks</strong> (paragraph, heading, quote, list) -- Check that text fields exist and pass ammonia sanitization without changes (no disallowed HTML).</li>
    <li><strong>Image</strong> -- <code>file.url</code> must be present and non-empty.</li>
    <li><strong>Code</strong> -- <code>code</code> field must exist.</li>
    <li><strong>Embed</strong> -- Both <code>service</code> and <code>source</code> fields must exist.</li>
    <li><strong>Heading</strong> -- <code>level</code> must be an integer between 1 and 6.</li>
    <li><strong>Delimiter</strong> -- No validation needed (empty data object is valid).</li>
    </ul>
    <p>Unknown block types are rejected with an error: <code>"unknown block type 'carousel'"</code>.</p>
    <h3>5.2: Registering Custom Block Types</h3>
    <p>Plugins can register custom block types by adding entries to the registry. The pattern:</p>
