    <h1>Trovato Search Architecture</h1>
    <p><strong>Status:</strong> Design complete; Phase 1 index pipeline implemented
    <strong>Date:</strong> 2026-02-22
    <strong>Context:</strong> Progressive enhancement search architecture inspired by <a href="https://www.tag1.com/how-to/the-practical-path-to-ai-search/">The Practical Path to AI Search</a>. Adapted from Tag1's production implementation to Trovato's Rust/WASM plugin architecture.</p>
    <hr />
    <h2>The Problem</h2>
    <p>Trovato already has tsvector-based full-text search (PostgreSQL, server-side). It works, but:</p>
    <ol>
    <li><strong>Every search is a round-trip.</strong> User types, browser hits the server, PostgreSQL runs the query, results come back. Fast, but never instant.</li>
    <li><strong>Keyword-only.</strong> Searching "performance issues" won't find an article about "site speed optimization." Users don't think in keywords; they think in concepts.</li>
    <li><strong>No progressive enhancement.</strong> Results are all-or-nothing. The user waits for the server, sees results, done. No opportunity to enrich results after the initial display.</li>
    </ol>
    <p>The goal: instant client-side results with no server load for basic searches, AI-powered semantic understanding layered on top, and streaming AI summaries for a conversational search experience. All without requiring vector databases or embedding pipelines as a prerequisite.</p>
    <hr />
    <h2>Architecture: Four-Stage Progressive Enhancement</h2>
    <p>The core insight: show something instantly, then make it smarter. Each stage adds intelligence, and each stage is independently useful. A site can ship Stage 1 alone and add stages later.</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>User types query
        |
        +-&gt; Stage 1: Pagefind (client-side, ~50ms, no server)
        |        +-&gt; Instant keyword results displayed
        |
        +-&gt; Stage 2: AI Query Expansion (server-side, ~500ms)
        |        +-&gt; Expanded terms sent back to client
        |              +-&gt; Client re-queries Pagefind with expanded terms
        |                    +-&gt; Additional results merged into display
        |
        +-&gt; Stage 3: Result Merging &amp; Re-ranking (client-side)
        |        +-&gt; Deduplicate, apply ranking signals, reorder display
        |
        +-&gt; Stage 4: AI Summary (server-side, ~2s, streamed via SSE)
                 +-&gt; Synthesized answer streams above results
    </code></pre></figure><h3>Stage 1: Pagefind (Client-Side Instant Search)</h3>
    <p><a href="https://pagefind.app/">Pagefind</a> is a Rust/WASM-based static search library. The search index is pre-built, chunked, and served as static files. The browser downloads only the index fragments it needs (~300kB even for 50,000+ pages). Search runs entirely in the browser -- zero server load, zero latency beyond the local WASM execution.</p>
    <p><strong>How it works in Trovato:</strong></p>
    <ul>
    <li><strong>Change detection (kernel):</strong> Every write that changes what an item's search page holds queues that item in <code>search_index_queue</code>, with a reason. Writes to <code>item</code>, <code>comment</code> and <code>url_alias</code> rows are queued by triggers on those tables, in the write's own transaction, whoever makes them (the services, pathauto, a plugin's raw SQL). The other writers are the content type search switches and field weights (every item of the type), workspace publishing, and plugins changing something no trigger sees, such as data their <code>tap_field_access</code> reads, which call <code>host::search_index_enqueue</code> (<a href="/learn/plugin-development#the-static-search-index-queue-what-you-change">the rule</a>). Scheduled publishing writes through the item API. Nothing polls. The <code>pagefind_index_status</code> table remains the switch that says the site wants the index, and carries an operator's full rebuild request (<code>trovato search rebuild</code>).</li>
    <li><strong>Index generation (kernel):</strong> Each cron run drains the queue in batches of 200, rewriting only the queued items' fragments, the word chunks their words are in, the meta file and <code>pagefind-entry.json</code> (<code>cron/search_update.rs</code>; see <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/incremental-search-index.md">incremental-search-index.md</a>). A full build, which exports live-stage published items as HTML fragments (title, every text field, published comments, metadata; see <a href="#what-goes-in-the-index">What Goes in the Index</a>), builds the Pagefind 1.3.0 index natively (crate <code>trovato-search-index</code>; no <code>pagefind</code> binary), and publishes it into <code>PAGEFIND_OUTPUT_DIR</code>, entry file last (<code>./static/pagefind/</code> by default, served at <code>/static/pagefind/</code>), runs only when there is no index yet, when an operator asks, when tombstones pass the compaction threshold, or when a precondition of the update fails (logged at <code>warn</code> with the reason).</li>
    <li><strong>Why the kernel:</strong> WASM plugins run in sandboxed instances with no access to the filesystem. The kernel writes the index files; the <code>trovato_search</code> plugin switches the index on and reports the queue length from <code>tap_cron</code>.</li>
    <li><strong>Client-side search:</strong> The Pagefind JS library loads in the browser. When the user types, Pagefind searches its local index and returns results. No HTTP request, no database query, no server involvement.</li>
    <li><strong>Fallback:</strong> If JavaScript is disabled or Pagefind fails to load, the search form submits to the server-side tsvector endpoint. Progressive enhancement means the server-side search is always available.</li>
    </ul>
    <p><strong>Why Pagefind, not tsvector-first:</strong></p>
    <ul>
    <li><strong>Zero server load</strong> for the most common operation (basic search). The server only gets involved when AI enrichment is requested.</li>
    <li><strong>Scales with CDN.</strong> The index is static files. 10,000 concurrent searches cost nothing -- they're all local WASM execution.</li>
    <li><strong>Offline-capable.</strong> Once the index is cached, search works without a network connection (Service Worker territory, but the foundation is there).</li>
    <li><strong>Faster cold start.</strong> Even the very first search is ~50ms. tsvector requires a round-trip regardless.</li>
    </ul>
    <p><strong>tsvector's role:</strong> tsvector remains the server-side search backbone for programmatic use -- Gather queries in plugin code, API consumers, admin search, cron jobs, anything without a browser. Pagefind is the user-facing default; tsvector is the server-side workhorse.</p>
    <h3>Stage 2: AI Query Expansion</h3>
    <p>When the user searches, the query also goes to the server (async, non-blocking -- Stage 1 results are already visible). The server calls <code>ai_request(operation: Chat)</code> with a prompt like:</p>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>Given the search query &quot;{query}&quot;, generate 4-6 related search terms
    that cover synonyms, related concepts, and alternative phrasings.
    Return only the terms, comma-separated. Be specific to the domain;
    avoid generic terms like &quot;technology&quot; or &quot;solution.&quot;
    </code></pre></figure><p>The LLM returns expanded terms. These go back to the client, which runs them through Pagefind again. New results merge into the existing display.</p>
    <p><strong>Key design decisions:</strong></p>
    <ul>
    <li><strong>Expansion runs server-side</strong> because it needs <code>ai_request()</code> and the LLM API. But the expanded terms feed back into Pagefind on the client -- the actual search is still client-side.</li>
    <li><strong>Cache aggressively.</strong> The same query always produces similar expansions. Cache the expansion results (KV store, in-memory, or even a simple lookup table) to avoid redundant LLM calls. The article recommends this explicitly.</li>
    <li><strong>Filter aggressively.</strong> Early implementations found that generic expansions ("technology", "software") pollute results. The prompt constrains this, and a blocklist of overly-generic terms provides a safety net.</li>
    <li><strong>This is where tsvector could optionally supplement.</strong> If there are Items not in the Pagefind index (content on internal-visibility stages visible to editors, recently-created content before re-index), a parallel tsvector query with the expanded terms catches them. The results merge client-side.</li>
    </ul>
    <h3>Stage 3: Result Merging &amp; Re-ranking</h3>
    <p>With results from both the original query and expanded terms, the client deduplicates by URL/Item ID and applies ranking signals:</p>
    <p><strong>Ranking signals:</strong></p>
    <ul>
    <li><strong>Exact match boost:</strong> Results where search terms appear together rank higher than results where they're scattered. Title matches outweigh body matches.</li>
    <li><strong>Recency decay:</strong> Exponential decay with a configurable half-life (default: 1 year). New content gets a 50% boost, 1-year-old content 25%, 2-year-old 12.5%. Past a threshold (default: 5 years), an age penalty kicks in, capped at 30%. Authoritative older content can still surface.</li>
    <li><strong>Priority pages:</strong> Admin-configured mapping of keywords to authoritative pages. Searching "team" always shows the Team page first, regardless of keyword frequency elsewhere.</li>
    <li><strong>Content type boost:</strong> Configurable per content type. Documentation pages might rank higher than blog posts for technical queries.</li>
    </ul>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>final_score = base_relevance x exact_match_boost x recency_factor x priority_boost x type_boost
    </code></pre></figure><p>These signals are multiplicative. The formula runs entirely client-side -- it's just arithmetic on the result metadata Pagefind already provides (or that we inject into the index at build time).</p>
    <p><strong>UI elements (not AI, but part of the search UX):</strong></p>
    <ul>
    <li>Autocomplete with recent search history and title suggestions</li>
    <li>Content type filters (Blog, Documentation, Case Study, etc.)</li>
    <li>Date range filtering</li>
    <li>Result count announced for screen readers, proper ARIA labels on interactive elements</li>
    </ul>
    <h3>Stage 4: AI Summary Generation</h3>
    <p>The top N results (with excerpts) go to the server. An <code>ai_request(operation: Chat)</code> call synthesizes a summary answer. This streams back via SSE (Server-Sent Events) -- the same infrastructure the chatbot Tile uses (Story 31.7) -- appearing word-by-word above the result list.</p>
    <p><strong>Prompt engineering matters:</strong></p>
    <ul>
    <li>Keep responses concise (configurable max tokens)</li>
    <li>Cite sources with clickable links to the actual results</li>
    <li>Acknowledge when the results don't actually answer the question (don't hallucinate)</li>
    <li>Include the user's original query in the prompt for relevance</li>
    </ul>
    <p><strong>Conversational follow-up:</strong> After the initial summary, the user can ask follow-up questions. The system extracts keywords from the follow-up, runs additional Pagefind searches for newly relevant content, merges with original context, and generates a response that builds on the previous answer. This uses the same SSE streaming and conversation history as the chatbot Tile from Story 31.7.</p>
    <p><strong>Sentiment analysis:</strong> Each interaction carries a signal. Follow-up phrasing reveals satisfaction, confusion, or unmet needs. A fast, cheap model classifies sentiment asynchronously. The classifications feed into analytics -- high "unsatisfied" rates on a topic flag content gaps, "confused" responses flag clarity problems. This runs async; users never wait for it.</p>
    <hr />
    <h2>Search Settings (as built)</h2>
    <p>The ranking signals, the AI stage switches and the analytics switches are one
    typed model, <code>SearchSettings</code> (<code>crates/kernel/src/search/settings.rs</code>), stored as
    one JSON value under the <code>site_config</code> key <code>search</code> and edited at
    <code>/admin/config/search</code> (permission <code>administer site</code>). Config export carries it
    inside the <code>variable</code> entity like any other <code>site_config</code> row. Every reader goes
    through <code>SearchSettings::load</code>, which reads the kernel's two tier cache (key
    <code>search_settings</code>) and falls back to the database: a search request costs no
    database round trip for its settings. Saving through the screen drops the cached
    copy; a value written another way (config import, a hand edit) takes effect when
    the cached copy expires, within five minutes. A missing key is the defaults; a
    value that does not parse or is out of range is the defaults with a warning in
    the log.</p>
    <p>The defaults are the values <code>templates/search.html</code> carried as a literal JSON
    block before the model existed, so a site that never opens the screen ranks
    exactly as it did. The search page now renders that block from the model, with
    Tera's <code>json_encode</code> filter.</p>
    <table><thead><tr><th>Setting</th><th>Default</th><th>Range</th></tr></thead><tbody>
    <tr><th><code>recency_boost_max</code></th><th>0.5</th><th>0 to 10</th></tr>
    <tr><th><code>recency_half_life_days</code></th><th>365</th><th>1 to 36500</th></tr>
    <tr><th><code>recency_penalty_after_days</code></th><th>1825</th><th>1 to 36500</th></tr>
    <tr><th><code>recency_max_penalty</code></th><th>0.3</th><th>0 to 1</th></tr>
    <tr><th><code>title_match_boost</code></th><th>1.0</th><th>0 to 100</th></tr>
    <tr><th><code>title_all_terms_multiplier</code></th><th>1.5</th><th>0 to 100</th></tr>
    <tr><th><code>content_match_boost</code></th><th>0.4</th><th>0 to 100</th></tr>
    <tr><th><code>excerpt_length</code></th><th>300</th><th>50 to 2000</th></tr>
    <tr><th><code>results_per_page</code></th><th>10</th><th>1 to 100</th></tr>
    <tr><th><code>max_pagefind_results</code></th><th>50</th><th>1 to 500</th></tr>
    <tr><th><code>ai_summary_top_n</code></th><th>5</th><th>1 to 20</th></tr>
    <tr><th><code>ai_summary_max_chars</code></th><th>2000</th><th>100 to 20000</th></tr>
    <tr><th><code>type_boosts</code></th><th>none (every type 1.0)</th><th>each 0 to 100, keyed by item type machine name</th></tr>
    <tr><th><code>priority_pages</code></th><th>none</th><th>at most 50 keyword and path pairs; keyword 1 to 100 characters, path starting with <code>/</code></th></tr>
    <tr><th><code>priority_boost</code></th><th>10.0</th><th>1 to 100</th></tr>
    <tr><th><code>expand</code>, <code>summarize</code>, <code>followup</code></th><th>on</th><th></th></tr>
    <tr><th><code>max_followups</code></th><th>3</th><th>0 to 20</th></tr>
    <tr><th><code>analytics_enabled</code></th><th>on</th><th></th></tr>
    <tr><th><code>analytics_retention_days</code></th><th>90</th><th>1 to 365</th></tr>
    <tr><th><code>sentiment_enabled</code></th><th>off</th><th></th></tr>
    <tr><th><code>index_compaction_percent</code></th><th>5.0</th><th>0.5 to 50: the share of a language's Pagefind page slots that may be tombstones (left by deleted or unpublished items and not yet reused) before cron compacts the index with one full build that renumbers densely; see <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/incremental-search-index.md">incremental-search-index.md</a></th></tr>
    </tbody></table>
    <h3>Which backend applies which signal</h3>
    <table><thead><tr><th>Signal</th><th>Browser (Pagefind, <code>scolta.js</code> <code>scoreResults</code>)</th><th>Server (<code>SearchService::search</code>, tsvector)</th></tr></thead><tbody>
    <tr><th>Field weights (<code>search_field_config</code>, per type)</th><th>yes, as <code>data-pagefind-weight</code> in the index</th><th>yes, as <code>setweight</code> in the trigger</th></tr>
    <tr><th>Title as weight A</th><th>yes</th><th>yes</th></tr>
    <tr><th>Type boost</th><th>yes, multiplies the score by <code>TYPE_BOOSTS[meta.type]</code></th><th>yes, multiplies <code>ts_rank</code>; the boosts are bound as two arrays and joined with <code>unnest</code>, in the same query</th></tr>
    <tr><th>Priority pages</th><th>yes, multiplies by <code>priority_boost</code> when the normalized query holds the keyword as a whole word and the result URL is the path</th><th>no</th></tr>
    <tr><th>Recency boost and age penalty</th><th>yes</th><th>no</th></tr>
    <tr><th>Title and excerpt match boosts</th><th>yes</th><th>no</th></tr>
    </tbody></table>
    <p>Recency, the match boosts and priority pages stay browser signals by design: the
    brief puts them in the browser, where Pagefind's results already carry the date,
    title and excerpt they need, and server search is the fallback and the API, not
    the ranked experience. Type boosts are applied in both because a type boost is a
    statement about the content, not about the page it is shown on.</p>
    <h3>Field weights in the Pagefind index</h3>
    <p>Each text field is its own element inside <code>data-pagefind-body</code>, with a
    <code>data-pagefind-weight</code> from its letter, at the ratios of PostgreSQL's default
    <code>ts_rank</code> weights scaled so A is Pagefind's maximum:</p>
    <table><thead><tr><th>Letter</th><th><code>ts_rank</code> weight</th><th><code>data-pagefind-weight</code></th></tr></thead><tbody>
    <tr><th>A</th><th>1.0</th><th>10.0</th></tr>
    <tr><th>B</th><th>0.4</th><th>4.0</th></tr>
    <tr><th>C</th><th>0.2</th><th>2.0</th></tr>
    <tr><th>D</th><th>0.1</th><th>1.0</th></tr>
    </tbody></table>
    <p>The title is A, as in the trigger, and sits inside the indexed region with
    <code>data-pagefind-meta="title"</code>, so a title alone is findable. Fields are ordered by
    weight, then by name. A text field with no configured weight is indexed at D. A changed weight reaches the browser at the
    next index build.</p>
    <h3>AI stages are enforced on the server</h3>
    <p><code>/api/v1/search/expand</code>, <code>/summarize</code> and <code>/followup</code> read the settings first
    and answer 404 with a short JSON error when their stage is off, before any cache
    or provider work. <code>/followup</code> answers 400 to a conversation holding more user
    turns than <code>max_followups</code> plus one (the opening question), counted on <code>messages</code>
    or on <code>history</code> plus <code>query</code>, whichever it received.</p>
    <hr />
    <h2>Search Analytics (as built)</h2>
    <p>What visitors search for, counted per UTC day, without the kernel storing
    anything that identifies a person. On by default; switched off, and its
    retention set, on <code>/admin/config/search</code>. Read at <code>/admin/reports/search</code>.</p>
    <p><strong>What is stored, and only this.</strong> Two tables:</p>
    <table><thead><tr><th>Table</th><th>Key</th><th>Counters</th></tr></thead><tbody>
    <tr><th><code>search_query_daily</code></th><th>UTC <code>day</code>, normalized <code>query</code></th><th><code>searches</code>, <code>zero_results</code></th></tr>
    <tr><th><code>search_daily</code></th><th>UTC <code>day</code></th><th><code>expansion_hits</code>, <code>expansion_misses</code>, <code>satisfied</code>, <code>confused</code>, <code>unmet</code></th></tr>
    </tbody></table>
    <p>The query is stored as <code>search::analytics::normalize_for_analytics</code> leaves it:
    trimmed, whitespace collapsed, lowercased (the same <code>search::normalize_query</code>
    the expansion cache keys on), then every email shaped token replaced by
    <code>[email]</code> and every number of six or more digits by <code>[number]</code>, then cut to 100
    characters. A number is a token made only of digits and the punctuation numbers
    are written with (<code>+ - . , ( ) / #</code>): <code>12345678</code>, <code>+44(0)20-7946-0958</code>. Digits
    inside a word are left alone, so a product code such as <code>inv12345678</code> is stored
    as typed; five digits or fewer (a postcode, a year) are kept too. A query that
    normalizes to nothing is not recorded.</p>
    <p><strong>What is never stored</strong>, in a table or in a log line this work adds: an IP
    address, a user id, a session id, a user agent, a referrer, or any time finer
    than the UTC day. The one debug line that logged a raw query on an expansion
    cache hit was removed.</p>
    <p><strong>Where searches are counted.</strong> Server: <code>SearchService::search</code>, the path
    <code>/search</code>, <code>/api/search</code> and <code>/api/v1/search</code> all take, once per search on its
    first page, with the result total. <code>SearchService::search_unrecorded</code> is the same
    search uncounted, for callers that are not a visitor searching (the AI chat's
    retrieval, the MCP tool, tests). Browser: <code>scolta.js</code> sends
    <code>POST /api/search/log</code> with <code>{query, results}</code> through <code>navigator.sendBeacon</code>,
    once per search the visitor runs, after the primary results render; not for a
    filter toggle, not for the search the page runs from its own <code>?q=</code> (the server
    counted that one when it rendered the page), and only when the rendered config
    says <code>analytics: true</code>. The endpoint checks the query is at most 500 bytes and
    <code>results</code> is 0 to 100,000, answers 204, and touches no database. The rate
    limiter files it under the <code>search</code> bucket. The expansion endpoint counts a
    cache hit or miss for every expansion it is asked for.</p>
    <p><strong>Recording never slows a search.</strong> <code>SearchAnalytics::record</code> and
    <code>SearchAnalytics::count</code> take a short synchronous lock on an in memory map and
    return. A background task flushes every 30 seconds, and once more on shutdown,
    with one <code>INSERT ... SELECT FROM unnest(...) ON CONFLICT ... DO UPDATE SET n = n + EXCLUDED.n</code> per table, so several kernel processes add up correctly. At most
    10,000 distinct (day, query) keys wait between flushes; past that, new queries
    are dropped and the count dropped is logged at the next flush. A flush that fails
    is logged and its batch dropped rather than kept. A crash loses at most one flush
    window, 30 seconds of counts.</p>
    <p><strong>Retention.</strong> Cron deletes rows older than <code>analytics_retention_days</code> (default
    90, 1 to 365) from both tables, one <code>DELETE</code> each, at most once a day across all
    processes (a Redis claim, <code>cron:search_analytics_prune</code>).</p>
    <p><strong>The report.</strong> A 7, 30 or 90 day period (never longer than retention), the
    searches and zero result searches with their share, the top 25 queries, the top
    25 queries that found nothing, the expansion cache hit rate, and the follow-up
    sentiment counts (zero until sentiment classification exists and is switched on). Each is one aggregate query over the period (<code>GROUP BY</code>,
    <code>ORDER BY</code>, <code>LIMIT</code>), run concurrently.</p>
    <h3>Follow-up sentiment (as built)</h3>
    <p>The Ritrovo brief (30.6) asks that each follow-up be classified as satisfied,
    confused or unmet, asynchronously, so a high unmet rate can flag a content gap,
    without the visitor waiting. The follow-up endpoint and its client already
    existed; what the kernel lacked was the server side turn cap (Part 1), a
    classifier, and somewhere to count its labels (Part 2's <code>search_daily</code>). This is
    the small piece.</p>
    <p>When <code>sentiment_enabled</code> and <code>analytics_enabled</code> are both on (sentiment is off by
    default), <code>/api/v1/search/followup</code>, after it has built a successful answer,
    <code>try_send</code>s the visitor's newest message (without the search context
    <code>scolta.js</code> appends to it) and the assistant answer before it to a bounded
    channel (256 jobs) and returns. One background worker, owned by <code>AppState</code>
    (<code>search::sentiment::SentimentQueue</code>), drains it: it re-reads the settings,
    resolves the Chat provider the same way the endpoints do, sends the
    <code>CLASSIFY_SENTIMENT</code> prompt (<code>search/prompts.rs</code>, resolved through
    <code>prompts::resolve</code>) through <code>api_search::complete</code>, which sends it through
    <code>AiProviderService::chat_once</code>, the kernel's one send path, and adds the label to the day's counter
    through the analytics aggregator. A reply that is not exactly one of the three
    words counts nothing and logs one warning, without the reply text. A full channel
    drops the job; the number dropped is logged at the next analytics flush. Provider
    failures are logged through <code>log_provider_failure</code>, like the endpoints'. Like
    the three search endpoints, the classifier records no token usage against the
    AI budgets.</p>
    <p>The text goes to the provider and nowhere else: no table, no log line. It costs
    tokens on every follow-up, which is why the settings screen says so beside the
    switch. There is no separate "lightweight model" setting: the classifier uses the
    site's Chat provider and model, the same resolution the endpoints use.</p>
    <hr />
    <h2>The Vector Database Question</h2>
    <p>The standard AI search architecture generates embeddings for all content, stores them in a vector database, converts each query to an embedding at search time, and finds nearest neighbors. This works, but for most content sites it's unnecessary complexity.</p>
    <p><strong>Query expansion gets you semantic understanding without embeddings.</strong> The AI knows that "performance issues" and "site speed" refer to the same concept, so it expands the query. Multiple fast keyword searches across related terms, then AI synthesizes. Intelligence at read time rather than index time.</p>
    <p><strong>When you DO need embeddings/vectors:</strong></p>
    <ul>
    <li>Millions of documents (Pagefind index size becomes unwieldy)</li>
    <li>Content rarely uses the terms users search for (highly technical or domain-specific jargon mismatch)</li>
    <li>Recommendation systems ("show me similar items" based on content similarity, not keywords)</li>
    <li>Multi-modal search (images, audio alongside text)</li>
    </ul>
    <p><strong>Trovato's position:</strong> The <code>VectorStore</code> trait and <code>SemanticSimilarity</code> Gather operator exist in the AI Integration design (Story 31.11). They're the upgrade path. A site that outgrows query expansion can add pgvector + embeddings, and the summarization/conversation layers transfer over -- you're just swapping how results are found. But query expansion is the default, not embeddings.</p>
    <hr />
    <h2>Plugin Architecture</h2>
    <p>The architecture splits responsibility between the <code>trovato_search</code> WASM plugin and the kernel:</p>
    <ul>
    <li><strong>Plugin (WASM):</strong> Its <code>pagefind_index_status</code> table switches the index on and carries an operator's full rebuild request. Its <code>tap_cron</code> reports how many items are queued. Cannot access the filesystem due to WASM sandbox constraints.</li>
    <li><strong>Kernel (<code>cron/pagefind.rs</code>, <code>cron/search_update.rs</code>):</strong> Each cron run drains <code>search_index_queue</code> through the incremental updater, or takes a full build through the page ledger (<code>cron/search_index.rs</code>) when one is requested or needed, and publishes entry file last. Only runs when the <code>trovato_search</code> plugin is enabled (<code>pagefind_enabled</code> flag on <code>CronService</code>).</li>
    </ul>
    <h3><code>trovato_search</code> Plugin</h3>
    <table><thead><tr><th>Component</th><th>Implementation</th><th>Notes</th></tr></thead><tbody>
    <tr><th>Change detection</th><th>Table triggers and kernel writers</th><th>Item, comment and alias writes are queued by triggers in their own transaction; the type screens and workspace publishing queue their items; plugins call <code>host::search_index_enqueue</code> for changes no trigger sees</th></tr>
    <tr><th>Index generation</th><th>Kernel <code>cron/pagefind.rs</code></th><th>Drains the queue through <code>cron/search_update.rs</code> (only the queued items' files), or a full build in <code>cron/search_index.rs</code>; publishes entry file last</th></tr>
    <tr><th>Index serving</th><th>Static files in <code>./static/pagefind/</code></th><th>Served by web server/CDN, not Trovato app code</th></tr>
    <tr><th>Pagefind client JS</th><th>Frontend asset bundled with plugin</th><th>Loaded on search pages, optional preload on all pages</th></tr>
    <tr><th>Query expansion endpoint</th><th><code>tap_menu</code> -&gt; <code>/api/v1/search/expand</code></th><th>Calls <code>ai_request(operation: Chat)</code>, returns expanded terms as JSON</th></tr>
    <tr><th>Expansion cache</th><th>KV store or in-memory cache</th><th>Same query -&gt; same expansion. Configurable TTL.</th></tr>
    <tr><th>Re-ranking config</th><th><code>SearchSettings</code> in <code>site_config</code> (see "Search Settings (as built)")</th><th>Admin UI at <code>/admin/config/search</code></th></tr>
    <tr><th>AI summary endpoint</th><th><code>tap_menu</code> -&gt; <code>/api/v1/search/summarize</code></th><th>SSE streaming via <code>ai_request(operation: Chat)</code></th></tr>
    <tr><th>Conversational follow-up</th><th>Session-scoped history on summary endpoint</th><th>Reuses chatbot SSE infrastructure (Story 31.7)</th></tr>
    <tr><th>Sentiment classification</th><th>Async <code>ai_request()</code> post-response</th><th>Fast model, fire-and-forget to analytics</th></tr>
    <tr><th>tsvector fallback</th><th>Existing Gather search</th><th>Activated when Pagefind unavailable or for server-side consumers</th></tr>
    </tbody></table>
    <h3>Configuration</h3>
    <p>The design sketch below predates the build. What exists is the settings model in
    "Search Settings (as built)" above; there is no <code>engine</code> setting.</p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[search]
    engine = &quot;pagefind&quot;              # &quot;pagefind&quot; (default) or &quot;server&quot; (tsvector only)
    index_path = &quot;pagefind&quot;          # relative to static directory
    rebuild_on_save = true           # or false for cron-only rebuild

    [search.ai]
    enabled = true                   # enables Stages 2-4
    expansion_cache_ttl = 3600       # seconds; 0 = no cache
                                     # Implemented as the CACHE_TTL_SEARCH_EXPAND
                                     # environment variable, default 30 days: an
                                     # expansion costs provider tokens and does not
                                     # go stale the way content does. 0 still
                                     # disables the cache.
    expansion_max_terms = 6
    summary_max_tokens = 300
    summary_model = &quot;default&quot;        # or specific provider/model override
    sentiment_enabled = true
    sentiment_model = &quot;default&quot;      # fast/cheap model recommended
    conversation_max_turns = 3       # follow-up limit per session

    [search.ranking]
    recency_half_life_days = 365
    recency_penalty_after_days = 1825  # 5 years
    recency_penalty_max = 0.30
    exact_match_boost = 1.5
    title_match_boost = 2.0

    [[search.ranking.priority_pages]]
    keywords = [&quot;team&quot;, &quot;about us&quot;, &quot;who we are&quot;]
    path = &quot;/team&quot;
    boost = 10.0

    [[search.ranking.type_boosts]]
    item_type = &quot;documentation&quot;
    boost = 1.3

    [[search.ranking.type_boosts]]
    item_type = &quot;blog&quot;
    boost = 1.0
    </code></pre></figure><h3>Permissions</h3>
    <p>No new permissions needed. Search itself is public (same as today) -- Pagefind indexes live-stage content with public visibility only. The AI-enhanced stages (2-4) require <code>use ai</code> permission for authenticated users. Anonymous users can be configured to receive AI features or not (site-wide toggle).</p>
    <h3>Rate Limiting</h3>
    <p>AI search endpoints use the existing Tower rate-limiting middleware. Recommended defaults:</p>
    <ul>
    <li>Query expansion: 30 requests/minute per IP (fast, cached)</li>
    <li>AI summary: 10 requests/minute per IP (expensive, streamed)</li>
    <li>Follow-up: 5 requests/minute per IP (most expensive, context-heavy)</li>
    </ul>
    <p>Token budgets from Story 31.3 apply to all search-related AI operations.</p>
    <hr />
    <h2>Pagefind Integration Details</h2>
    <h3>Index Build Pipeline</h3>
    <figure class="code"><pre class="code__body" tabindex="0" aria-label="Example code"><code>A write (item, comment or alias row, by any writer: a trigger, in the same
    transaction; type switches or weights; workspace publish; a plugin&#39;s
    search_index_enqueue)
        |
        +-&gt; INSERT INTO search_index_queue (item_id, op, reason)
              one row per item, the last write wins

    Cron interval fires
        |
        +-&gt; Kernel cron/pagefind.rs (only when trovato_search is enabled):
              A full rebuild requested, no index yet, or no entry file?
                  -&gt; full build through the page ledger (cron/search_index.rs)
              Otherwise, per batch of 200 queued items (cron/search_update.rs):
                  |
                  +-&gt; Export just those items (the same access seam: Live,
                  |     published, viewable by anonymous)
                  |
                  +-&gt; Under pg_advisory_xact_lock(&#39;search_index&#39;): render,
                  |     tokenize (term cache by fragment hash), free or tombstone
                  |     their page slots, rewrite the word chunks their old and
                  |     new words are in (split past 40,000 locations, drop when
                  |     empty), a new meta file
                  |
                  +-&gt; Publish: new hashed files, then pagefind-entry.json
                  |     (files no longer referenced deleted after 24 hours)
                  |
                  +-&gt; Record ledger, terms, chunk plan, generation; delete the
                        queue rows applied; commit
              Tombstones above the compaction setting (5% of a language&#39;s
              slots by default) -&gt; one full build that renumbers densely
    </code></pre></figure><p>An edit or a comment is searchable at the next cron run, and only the files it
    touched are rewritten (see
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/incremental-search-index.md">incremental-search-index.md</a> for
    the measurements). A batch import of 50 items is one update of 50 pages at the
    next cron run. Past 1,000 queued items and a quarter of the index, a full build
    is cheaper and is taken instead.</p>
    <h3>What Goes in the Index</h3>
    <p><strong>By default, everything an anonymous visitor can see is searchable</strong>, in both
    backends (the Pagefind index and the Postgres vector behind <code>/search</code>):</p>
    <ul>
    <li>every published item on the <strong>live stage</strong> that the anonymous role may view;</li>
    <li>its <strong>title</strong> (weight A);</li>
    <li><strong>every text field</strong> its type declares (<code>Text</code> and <code>TextLong</code>, value and
    summary), each at its <code>search_field_config</code> weight, D when it has none. A
    weight says how much a field counts; it no longer decides whether the field is
    searched. Files, references, numbers, dates, booleans and structured fields are
    not text and are not indexed;</li>
    <li><strong>every published comment</strong> on it that the item page shows (published, under
    a published parent), at Pagefind's default weight and D in Postgres. A match in
    a comment is a result for the item and links to the item.</li>
    </ul>
    <p>Every value is indexed as plain text (<code>page_meta::plain_text</code>: tags stripped,
    entities decoded), never as markup.</p>
    <p><strong>Only content an anonymous visitor may see goes in the Pagefind index.</strong> The
    index is a set of static files any visitor downloads, so it is built as the
    anonymous role, through the same item and field access seam a page view uses: an
    unpublished item, an item on an internal stage, a field <code>tap_field_access</code>
    denies to anonymous visitors, and an unpublished or held comment are never in
    it. Server side search applies the searching user's own access instead.</p>
    <h4>The two switches</h4>
    <p>Each content type has two checkboxes at <code>/admin/structure/types/{type}/search</code>
    (permission <code>administer site</code>), both on by default, so a new install and every
    existing site search everything:</p>
    <ul>
    <li><strong>Include this content type in search.</strong> Off, no item of the type is found by
    either backend.</li>
    <li><strong>Include comments in search.</strong> Off, the type's items stay searchable by
    their title and fields, but no longer by words found only in their comments.</li>
    </ul>
    <p>They are stored in the type's <code>item_type.settings</code> under <code>search</code>
    (<code>{"include": …, "comments": …}</code>, only an explicit <code>false</code> turns one off), so
    <code>config export</code> and <code>config import</code> carry them with the type. Saving recomputes
    the type's Postgres vectors at once and queues every item of the type for the
    Pagefind index, which the next cron run updates.</p>
    <h4>When the index is updated</h4>
    <p>Every writer queues the items it changed (B218). Triggers on <code>item</code>, <code>comment</code>
    and <code>url_alias</code> queue the item a write changes, in the write's own
    transaction, whoever makes it. The type search switches and the field weights
    queue every item of the type, workspace publishing every item the publish
    moves or deletes, and plugins call <code>host::search_index_enqueue</code> for a change no
    trigger sees. Scheduled publishing changes the status through the item API. The
    next cron run applies the queue, so a new comment is findable one cron interval
    after it is posted. A queued item that is not searchable (a draft, an item
    anonymous may not see) is taken out of the index or left out.
    The Postgres vector needs no rebuild: triggers on <code>item</code> and <code>comment</code> keep it
    current inside the write's own transaction.</p>
    <p>Pagefind supports custom metadata per page, which is how we inject ranking signals into the client-side index.</p>
    <p>For editor search (items on internal-visibility stages + live stage), the tsvector fallback handles it server-side with stage-scoped queries -- same as the existing stage-aware kernel search. <strong>The Pagefind index is Live only:</strong> it is built from published Live items and served as static files to everyone, so it never contains a stage's content. Server-side search reads a stage only for a holder of <code>use stages</code> who switched to it (<code>routes::helpers::read_stages</code>; see <code>docs/design/stage-workflow.md</code> §8); everyone else, and every Pagefind query, reads Live.</p>
    <h3>Rust/WASM Synergy</h3>
    <p>Trovato is Rust. Pagefind is Rust. The Pagefind indexer can potentially be called as a library rather than shelled out to a binary -- same language, same toolchain. This isn't required for the initial implementation (CLI invocation via cron is fine), but it's a future optimization: embed the Pagefind indexer directly in the Trovato binary for zero-overhead index rebuilds.</p>
    <hr />
    <h2>What This Means for the Existing Design</h2>
    <h3>AI Integration Updates</h3>
    <p>The AI Integration design doc (<code>docs/design/ai-integration.md</code>) describes embeddings + <code>SemanticSimilarity</code> as an advanced search upgrade path. With this architecture:</p>
    <ul>
    <li><strong>Query expansion becomes the default AI search path.</strong> Simpler, no infrastructure, works with Pagefind.</li>
    <li><strong>Embeddings/pgvector become the advanced path.</strong> For sites that outgrow keyword + expansion.</li>
    <li><strong><code>SemanticSimilarity</code> Gather operator still exists</strong> -- it's the upgrade, not the default.</li>
    <li><strong>The <code>VectorStore</code> trait still exists</strong> -- it's the pluggable backend for sites that need it.</li>
    </ul>
    <h3>AI Core Integration</h3>
    <p>The <a href="/learn/design-ai">AI Core</a> provides what Stages 2-4 depend on:</p>
    <ul>
    <li>Provider registry and the <code>ai_request()</code> host function, required for query expansion and summary generation</li>
    <li>Token budgets, which apply to all search AI operations</li>
    <li>The chatbot tile with SSE streaming, which shares infrastructure with search summaries</li>
    <li>The <code>VectorStore</code> trait plus pgvector, the upgrade path beyond query expansion</li>
    </ul>
    <p>The tutorial teaches query expansion first because it's simpler and demonstrates the AI subsystem without introducing pgvector. Embeddings become an optional "going further" section.</p>
    <hr />
    <h2>Phasing</h2>
    <p><strong>Phase 1: Pagefind integration</strong> (no AI, just client-side search)</p>
    <ul>
    <li>Pagefind index generation on content change (tap_cron + kernel cron builder)</li>
    <li>Client-side search UI replacing or supplementing server-side search</li>
    <li>tsvector fallback for server-side consumers</li>
    <li>Basic ranking signals (recency, exact match, title boost)</li>
    </ul>
    <p><strong>Phase 2: AI query expansion</strong> (requires AI Core from Epic 3 Phase A)</p>
    <ul>
    <li><code>/api/v1/search/expand</code> endpoint</li>
    <li>Expansion cache</li>
    <li>Client-side merging of expanded results</li>
    <li>Priority pages configuration</li>
    </ul>
    <p><strong>Phase 3: AI summaries &amp; conversation</strong> (requires Phase 2)</p>
    <ul>
    <li>SSE streaming summaries</li>
    <li>Conversational follow-up</li>
    <li>Sentiment classification</li>
    <li>Analytics integration</li>
    </ul>
    <p><strong>Phase 4: Embeddings upgrade path</strong> (optional, requires Epic 3 Phase B)</p>
    <ul>
    <li>pgvector + <code>SemanticSimilarity</code> for sites that need it</li>
    <li>Hybrid: Pagefind for instant results + semantic similarity for precision</li>
    <li>Recommendation-driven "related content" features</li>
    </ul>
    <hr />
    <h2>Related</h2>
    <ul>
    <li><a href="https://www.tag1.com/how-to/the-practical-path-to-ai-search/">The Practical Path to AI Search</a> -- Source article. Tag1's production implementation.</li>
    <li><a href="https://pagefind.app/">Pagefind</a> -- Rust/WASM static search library</li>
    <li><a href="/learn/design-ai">AI Integration Design</a> -- Full AI design document</li>
    <li><a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/incremental-search-index.md">Incremental search index</a> -- Design for updating the Pagefind index per item instead of rebuilding it (B216)</li>
    </ul>
