    <h3>Upload Flow</h3>
    <ol>
    <li>Receive upload via multipart form data on <code>/file/upload</code>.</li>
    <li>Validate: file size limits, MIME type whitelist, filename sanitization.</li>
    <li>Write to temporary storage with <code>status=0</code>. Cleaned up by cron after 6 hours.</li>
    <li>On item save, mark referenced files as permanent (<code>status=1</code>).</li>
    <li>On item delete, check if any other item references the file. If not, delete it.</li>
    </ol>
    <p>Public files served directly by NGINX. Private files route through the Kernel for access control.</p>
    <hr />
    <h2>12. Cron, Queues, and Batch Operations</h2>
    <h3>Cron Architecture</h3>
    <p>In a multi-server deployment, cron must run on exactly one server at a time. Use Redis distributed locking with a heartbeat pattern to ensure locks are held only as long as the job runs, but don't expire prematurely if a job is slow:</p>
