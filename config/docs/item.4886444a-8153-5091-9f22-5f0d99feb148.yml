    <h3>Batch API</h3>
    <p>For long-running admin operations: split into chunks, store progress in Redis, poll <code>/batch/{id}/status</code> for progress. This is Phase 5-6 work but the Queue API should be designed in Phase 1.</p>
    <hr />
    <h2>13. Search</h2>
    <h3>PostgreSQL Full-Text Search</h3>
    <h4>Search Field Configuration</h4>
    <p>The search index is dynamically configurable per content type. A <code>search_field_config</code> table allows plugins and admins to register searchable fields with weight assignments:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">TABLE</span> <span class="tok-entity tok-name tok-function tok-sql">search_field_config</span></span> (
        id UUID <span class="tok-storage tok-modifier tok-sql">PRIMARY KEY</span>,
        bundle <span class="tok-storage tok-type tok-sql">VARCHAR</span>(<span class="tok-constant tok-numeric tok-sql">32</span>) <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">REFERENCES</span> item_type(type),
        field_name <span class="tok-storage tok-type tok-sql">VARCHAR</span>(<span class="tok-constant tok-numeric tok-sql">32</span>) <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span>,
        weight <span class="tok-storage tok-type tok-sql">CHAR</span>(<span class="tok-constant tok-numeric tok-sql">1</span>) <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">NOT NULL</span> <span class="tok-storage tok-modifier tok-sql">DEFAULT</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>C<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>,  <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> A, B, C, or D (tsvector weights)
    </span>    UNIQUE (bundle, field_name)
    );
    </span></code></pre></figure><h4>Dynamic Search Trigger</h4>
    <p>The <code>item_search_update()</code> trigger reads this configuration and indexes all configured fields. Title is always indexed as weight A:</p>
    <figure class="code"><figcaption class="code__lang">sql</figcaption><pre class="code__body" tabindex="0" aria-label="sql code"><code class="language-sql"><span class="tok-source tok-sql"><span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE OR REPLACE</span> <span class="tok-keyword tok-other tok-sql">FUNCTION</span> <span class="tok-entity tok-name tok-function tok-sql">item_search_update</span></span><span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span> RETURNS trigger <span class="tok-keyword tok-other tok-alias tok-sql">AS</span> $$
    DECLARE
        config RECORD;
        vector tsvector :<span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span><span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>::tsvector;
        field_value <span class="tok-storage tok-type tok-sql">TEXT</span>;
    <span class="tok-keyword tok-other tok-LUW tok-sql">BEGIN</span>
        <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Always index title as weight A
    </span>    vector :<span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> setweight(to_tsvector(<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>english<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>, COALESCE(<span class="tok-constant tok-other tok-database-name tok-sql">NEW</span>.<span class="tok-constant tok-other tok-table-name tok-sql">title</span>, <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span><span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>)), <span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>A<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>);

        <span class="tok-comment tok-line tok-double-dash tok-sql"><span class="tok-punctuation tok-definition tok-comment tok-sql">--</span> Index configured fields
    </span>    FOR config <span class="tok-keyword tok-other tok-data-integrity tok-sql">IN</span>
            <span class="tok-keyword tok-other tok-DML tok-sql">SELECT</span> field_name, weight <span class="tok-keyword tok-other tok-DML tok-sql">FROM</span> search_field_config
            <span class="tok-keyword tok-other tok-DML tok-sql">WHERE</span> bundle <span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">NEW</span>.<span class="tok-constant tok-other tok-table-name tok-sql">type</span>
        LOOP
            field_value :<span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> <span class="tok-constant tok-other tok-database-name tok-sql">NEW</span>.<span class="tok-constant tok-other tok-table-name tok-sql">fields</span><span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-constant tok-other tok-database-name tok-sql">config</span>.<span class="tok-constant tok-other tok-table-name tok-sql">field_name</span><span class="tok-keyword tok-operator tok-math tok-sql">-</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-keyword tok-operator tok-comparison tok-sql">&gt;</span><span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>value<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>;
            IF field_value <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">IS NOT NULL</span> <span class="tok-keyword tok-other tok-DML tok-sql">THEN</span>
                vector :<span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> vector <span class="tok-keyword tok-operator tok-concatenator tok-sql">||</span> setweight(
                    to_tsvector(<span class="tok-string tok-quoted tok-single tok-sql"><span class="tok-punctuation tok-definition tok-string tok-begin tok-sql">&#39;</span>english<span class="tok-punctuation tok-definition tok-string tok-end tok-sql">&#39;</span></span>, field_value),
                    <span class="tok-constant tok-other tok-database-name tok-sql">config</span>.<span class="tok-constant tok-other tok-table-name tok-sql">weight</span>::<span class="tok-storage tok-type tok-sql">char</span>
                );
            <span class="tok-keyword tok-other tok-DML tok-sql">END</span> IF;
        <span class="tok-keyword tok-other tok-DML tok-sql">END</span> LOOP;

        <span class="tok-constant tok-other tok-database-name tok-sql">NEW</span>.<span class="tok-constant tok-other tok-table-name tok-sql">search_vector</span> :<span class="tok-keyword tok-operator tok-comparison tok-sql">=</span> vector;
        RETURN NEW;
    <span class="tok-keyword tok-other tok-DML tok-sql">END</span>;
    $$ LANGUAGE plpgsql;

    <span class="tok-meta tok-create tok-sql"><span class="tok-keyword tok-other tok-create tok-sql">CREATE</span> <span class="tok-keyword tok-other tok-sql">TRIGGER</span> <span class="tok-entity tok-name tok-function tok-sql">trg_item_search</span></span>
        BEFORE <span class="tok-keyword tok-other tok-DML tok-sql">INSERT</span> <span class="tok-keyword tok-other tok-DML tok-sql">OR</span> <span class="tok-keyword tok-other tok-DML tok-sql">UPDATE</span> <span class="tok-keyword tok-other tok-DDL tok-create tok-II tok-sql">ON</span> item
        FOR EACH ROW EXECUTE FUNCTION item_search_update<span class="tok-meta tok-block tok-sql"><span class="tok-punctuation tok-section tok-scope tok-begin tok-sql">(</span><span class="tok-punctuation tok-section tok-scope tok-end tok-sql">)</span></span>;
    </span></code></pre></figure><p>Plugins can register searchable fields via the <code>tap_item_update_index</code> tap, or site admins can configure them through the search settings UI.</p>
    <h3>Search Query</h3>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-modifier tok-rust">pub</span> async <span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-rust"><span class="tok-storage tok-type tok-function tok-rust">fn</span> </span><span class="tok-entity tok-name tok-function tok-rust">search_items</span></span><span class="tok-meta tok-function tok-rust"><span class="tok-meta tok-function tok-parameters tok-rust"><span class="tok-punctuation tok-section tok-parameters tok-begin tok-rust">(</span>
