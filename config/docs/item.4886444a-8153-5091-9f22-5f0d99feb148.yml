    </span></code></pre></figure><h3>Tag-Based Invalidation</h3>
    <p>A cached Gather of articles might be tagged <code>["item_list", "item:42", "item:43"]</code>. When Item 42 is saved, we invalidate all cache keys associated with the <code>item:42</code> tag.</p>
    <p>We use a Lua script in Redis to do this atomically in one round-trip, preventing race conditions:</p>
    <figure class="code"><figcaption class="code__lang">rust</figcaption><pre class="code__body" tabindex="0" aria-label="rust code"><code class="language-rust"><span class="tok-source tok-rust"><span class="tok-storage tok-type tok-rust">const</span> <span class="tok-constant tok-other tok-rust">INVALIDATE_TAG_SCRIPT</span><span class="tok-punctuation tok-separator tok-rust">:</span> <span class="tok-keyword tok-operator tok-rust">&amp;</span><span class="tok-storage tok-type tok-rust">str</span> <span class="tok-keyword tok-operator tok-rust">=</span> <span class="tok-string tok-quoted tok-double tok-raw tok-rust"><span class="tok-storage tok-type tok-string tok-rust">r</span><span class="tok-punctuation tok-definition tok-string tok-begin tok-rust">#</span>&quot;
        local keys = redis.call(&quot;SMEMBERS&quot;, KEYS[1])
        if #keys &gt; 0 then redis.call(&quot;DEL&quot;, unpack(keys)) end
        redis.call(&quot;DEL&quot;, KEYS[1])
    <span class="tok-punctuation tok-definition tok-string tok-end tok-rust">&quot;#</span></span><span class="tok-punctuation tok-terminator tok-rust">;</span>

