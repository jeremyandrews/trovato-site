    </span></code></pre></figure><h3>MVP Strategy: Live-Only Search</h3>
    <p>Search only indexes the Live stage for the MVP. The <code>search_vector</code> column on the <code>item</code> table is updated by the trigger on INSERT/UPDATE, and items with <code>stage_id != 'live'</code> are excluded from search results by default.</p>
    <p>Supporting search within draft stages requires either a dedicated search engine (Meilisearch) per stage or a stage-aware tsvector approach (maintaining separate search vectors per stage revision). Both are significant engineering efforts deferred to post-MVP.</p>
    <p><strong>Stage preview search:</strong> As a lightweight compromise, stage previews can fall back to Live search results. Items modified in the stage will show stale search snippets until published. This is acceptable for editorial previews where the focus is on layout and content accuracy, not search ranking.</p>
    <h3>Search Backend Trait</h3>
    <p>Plugins contribute to the search index via <code>tap_item_update_index</code>. For sites that outgrow Postgres full-text search, define a <code>SearchBackend</code> trait and swap in Meilisearch or Typesense:</p>
