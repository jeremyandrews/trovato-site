    <p align="center">A content management system written in Rust.</p>
    <p>I have worked with Drupal since 2002. Drupal 6 got the mental model right: everything is a node, you add fields to any content type, you query it through Views without writing SQL, and you extend it by implementing a few named functions. It ran on PHP and MySQL, and loading a node with twenty fields meant twenty joins, because CCK gave every field its own table. Trovato keeps the model and replaces the implementation.</p>
    <p>Plugins are WebAssembly modules. Each one runs in its own sandbox for a single request, and it reaches nothing it has not declared: the manifest lists the host interfaces the plugin may import, and the kernel builds a linker that exposes those and no others. A plugin that declares nothing gets nothing. There is no filesystem at all: the runtime hand-writes five WASI stubs and opens no directories, so a plugin that asks to write a file gets <code>ENOSYS</code>. There is no path from one plugin's memory into another's.</p>
    <p>Content is stored in PostgreSQL as JSONB, so a content type with twenty fields is one row with one JSONB column rather than twenty tables. Queries are built with Gather, a type-safe query engine with a visual builder, filling the role Views did. Content staging and revisions belong to the migration that creates content rather than being added on top of it: every item carries a stage, and every save writes a revision.</p>
    <h2>Why "Trovato"</h2>
    <p>Trovato is Italian for "found." The mark is a lowercase t with a terracotta dot resting in the curve of its foot.</p>
    <h2>Status</h2>
    <p>Trovato is at 0.101.0, working toward 1.0. The plugin contract is frozen; the version number is pre-1.0 because the CMS around it is not finished yet.</p>
    <p>The remaining work before 1.0 is reviewing the security findings from private development, triaging dependency advisories, and finishing the admin interface. Some things are deliberately not done: there is no plugin registry and no package format, so a plugin is built and installed from a directory on disk; role, permission, stage and system-configuration screens are driven by config import rather than by forms; semantic search compares vectors exactly, with no approximate index; and migrations only move forward.</p>
    <p><a href="/learn/known-issues">KNOWN-ISSUES.md</a> is the full list, and <a href="/learn/roadmap">ROADMAP.md</a> says what happens to it.</p>
    <h2>Quick start</h2>
    <p>Docker starts the kernel, PostgreSQL and Redis together. No Rust toolchain needed.</p>
    <figure class="code"><pre class="code__body"><code>git clone https://github.com/jeremyandrews/trovato
    cd trovato
    cp .env.example .env
    docker compose --profile full up
    </code></pre></figure><p>Open http://localhost:3001 and follow the installer. The <code>full</code> profile is what starts the Trovato container; without it, <code>docker compose up</code> brings up PostgreSQL and Redis alone, which is what you want when running the server natively on port 3000.</p>
    <p>To build from source, see <a href="/learn/install">INSTALL.md</a>.</p>
    <h2>Documentation</h2>
    <p>Start with <a href="/learn/building-your-first-site">Building Your First Site</a>, then the <a href="/learn/plugin-development">Plugin Development Guide</a>. The <a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/docs/design/">docs/design</a> directory covers how each part works, and <a href="/learn/design-terminology">Terminology</a> maps the Drupal words onto the Trovato ones.</p>
    <h2>License</h2>
    <p>Dual licensed under <a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/LICENSE-MIT">MIT</a> or <a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/LICENSE-APACHE">Apache-2.0</a>, at your option.</p>
    <h2>How it's built</h2>
    <p>Trovato is written with substantial AI assistance, under my direction and review. Contributions are welcome on the same basis; see <a href="/learn/contributing">CONTRIBUTING.md</a>.</p>
