    <h1>Installing Trovato CMS</h1>
    <p>This guide walks through a fresh installation of Trovato CMS from source.</p>
    <h2>Docker Alternative</h2>
    <p>If you don't have Rust installed, you can use Docker for the full development environment:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>profile</span> dev up<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>d</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose exec dev bash</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Full Rust toolchain available inside the container</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>See <a href="/learn/docker-development">Docker Development Guide</a> for details.</p>
    <h2>Prerequisites</h2>
    <ul>
    <li><strong>Rust</strong> (stable toolchain, 2024 edition): install via <a href="https://rustup.rs/">rustup</a></li>
    <li><strong>PostgreSQL 15+</strong>: running and accessible</li>
    <li><strong>Redis 7+</strong>: running on default port (6379)</li>
    </ul>
    <p>Verify your toolchain:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">rustc</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>version   <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 1.85+ recommended</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>version    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 15+</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">redis-cli</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> ping    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> should print PONG</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span></code></pre></figure><h2>1. Create the Database</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>CREATE USER trovato WITH PASSWORD &#39;trovato&#39;;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>CREATE DATABASE trovato OWNER trovato;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    </span></code></pre></figure><p>Or, if your PostgreSQL is configured for peer/trust authentication:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">createdb</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> trovato</span>
    </span></code></pre></figure><h2>2. Configure Environment</h2>
    <p>Copy the example environment file and edit as needed:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> .env.example .env</span>
    </span></code></pre></figure><p>The defaults work for local development:</p>
    <figure class="code"><figcaption class="code__lang">env</figcaption><pre class="code__body"><code class="language-env">PORT=3000
    DATABASE_URL=postgres://trovato:trovato@localhost:5432/trovato
    REDIS_URL=redis://127.0.0.1:6379
    DATABASE_MAX_CONNECTIONS=10
    RUST_LOG=info,tower_http=debug,sqlx=warn
    </code></pre></figure><h3>Optional Settings</h3>
    <table><thead><tr><th>Variable</th><th>Default</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>PORT</code></th><th><code>3000</code></th><th>HTTP server port</th></tr>
    <tr><th><code>DATABASE_MAX_CONNECTIONS</code></th><th><code>10</code></th><th>PostgreSQL connection pool size</th></tr>
    <tr><th><code>RUST_LOG</code></th><th><code>info</code></th><th>Log filter, in <code>RUST_LOG</code> format</th></tr>
    <tr><th><code>PLUGINS_DIR</code></th><th><code>./plugins</code></th><th>Plugin search path. Several directories may be given, separated by <code>:</code>; later ones win a name collision.</th></tr>
    <tr><th><code>UPLOADS_DIR</code></th><th><code>./uploads</code></th><th>Path for file uploads</th></tr>
    <tr><th><code>FILES_URL</code></th><th><code>/files</code></th><th>Base URL that uploaded files are served under</th></tr>
    <tr><th><code>TEMPLATES_DIR</code></th><th><code>./templates</code></th><th>Tera template search path. Several directories may be given, separated by <code>:</code>; later ones override templates of the same name.</th></tr>
    <tr><th><code>STATIC_DIR</code></th><th><code>./static</code></th><th>Static asset search path, served under <code>/static</code>. Several directories may be given, separated by <code>:</code>; later ones override assets of the same path. The generated Pagefind index is written to the first directory.</th></tr>
    <tr><th><code>CORS_ALLOWED_ORIGINS</code></th><th><code>*</code></th><th>Comma-separated allowed origins</th></tr>
    <tr><th><code>COOKIE_SAME_SITE</code></th><th><code>strict</code></th><th>Cookie SameSite policy (<code>strict</code>, <code>lax</code>, <code>none</code>)</th></tr>
    <tr><th><code>CRON_KEY</code></th><th><em>(none)</em></th><th>Shared secret in the cron URL, <code>POST /cron/&lt;CRON_KEY&gt;</code>. Change it before exposing the server.</th></tr>
    <tr><th><code>JWT_SECRET</code></th><th><em>(none)</em></th><th>Required for OAuth2 plugin (min 32 bytes)</th></tr>
    <tr><th><code>WEBHOOK_ENCRYPTION_KEY</code></th><th><em>(none)</em></th><th>Encrypts webhook secrets (min 32 bytes, recommended)</th></tr>
    <tr><th><code>UPDATE_CHECK</code></th><th><code>1</code></th><th>Whether the kernel may check for Trovato releases. Set to <code>0</code> (or <code>false</code>/<code>off</code>/<code>no</code>) for a deployment that must make no outbound requests at all. See "Update checks" below.</th></tr>
    <tr><th><code>UPDATE_CHECK_INTERVAL_SECS</code></th><th><code>86400</code></th><th>Minimum seconds between update checks</th></tr>
    <tr><th><code>UPDATE_CHECK_ENDPOINT</code></th><th>GitHub's latest-release API</th><th>The endpoint the check asks. Configurable so a test can point it at a local server.</th></tr>
    </tbody></table>
    <p><code>.env.example</code> is the fuller reference, including the <code>POSTGRES_*</code> and
    <code>REDIS_PORT</code> settings that only <code>docker compose</code> reads.</p>
    <h2>3. Build</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    </span></code></pre></figure><p>This compiles the kernel binary. Plugin WASM modules ship pre-compiled in
    the <code>plugins/</code> directory and do not need to be built separately.</p>
    <h2>4. Plugin Selection</h2>
    <p>Trovato discovers plugins automatically from the <code>plugins/</code> directory at
    startup. Every plugin found on disk is auto-installed and enabled on first
    run.</p>
    <p><strong>To exclude a plugin</strong>, move its directory out of <code>plugins/</code> before the
    first run:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mkdir</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> plugins-disabled</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mv</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins/some_plugin plugins-disabled/</span>
    </span></code></pre></figure><p><strong>To re-enable a disabled plugin</strong>, move it back and restart:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mv</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins-disabled/some_plugin plugins/</span>
    </span></code></pre></figure><p>You can also manage plugins after installation via the CLI:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> List all plugins and their status</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin list</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Disable a plugin</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin disable some_plugin</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Enable a plugin</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin enable some_plugin</span>
    </span></code></pre></figure><h3>Included Plugins</h3>
    <h2>Update checks</h2>
    <p>Trovato asks GitHub, at most once a day from cron, whether a newer release exists.</p>
    <p><strong>Exactly what that is:</strong> one outbound HTTPS GET to
    <code>https://api.github.com/repos/jeremyandrews/trovato/releases/latest</code>, carrying no
    site data — no URL, no version, no site identifier, nothing but the request and a
    <code>Trovato/&lt;version&gt;</code> User-Agent. GitHub learns that an IP address asked about a
    public repository. Nothing is sent about the site, and no page render ever makes the
    request: the check runs in cron and stores its answer, and the dashboard reads what
    was stored.</p>
    <p>When the running version is behind, <strong>an administrator</strong> sees a banner on
    <code>/admin</code>, styled as an alarm when the release announces itself as a security
    release (see the release convention in CONTRIBUTING.md). Nobody else sees it: a
    visitor and a logged-in non-administrator are never told the site's version, which
    is a fingerprinting detail with no upside for them.</p>
    <p><strong>Turning it off.</strong> There are two switches and the environment wins:</p>
    <ul>
    <li><code>UPDATE_CHECK=0</code> in the environment, for a deployment where "no outbound
    requests" is an operational requirement. An air-gapped install should not depend
    on a database row being right.</li>
    <li>A <strong>Check for Trovato releases</strong> checkbox at <code>/admin/config/site</code>, for a site that
    simply does not want it.</li>
    </ul>
    <p>On by default, which is a deliberate choice rather than an oversight: a site with no
    way to learn that a security fix exists is a site that does not get it. Drupal core
    has shipped update status on by default for two decades. The data flow is small
    enough to write down in full, which is what the paragraph above is.</p>
    <table><thead><tr><th>Plugin</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>trovato_blog</code></th><th>Blog content type with tags</th></tr>
    <tr><th><code>trovato_categories</code></th><th>Hierarchical taxonomy with tags</th></tr>
    <tr><th><code>trovato_comments</code></th><th>Threaded comments on content</th></tr>
    <tr><th><code>trovato_media</code></th><th>Media library and file management</th></tr>
    <tr><th><code>trovato_redirects</code></th><th>URL redirect management</th></tr>
    <tr><th><code>trovato_audit_log</code></th><th>Administrative audit trail</th></tr>
    <tr><th><code>trovato_scheduled_publishing</code></th><th>Publish/unpublish content on a schedule</th></tr>
    <tr><th><code>trovato_content_locking</code></th><th>Pessimistic content editing locks</th></tr>
    <tr><th><code>trovato_webhooks</code></th><th>Outgoing webhook notifications</th></tr>
    <tr><th><code>trovato_image_styles</code></th><th>Server-side image derivative generation</th></tr>
    <tr><th><code>trovato_oauth2</code></th><th>OAuth2 authorization server (requires <code>JWT_SECRET</code>)</th></tr>
    <tr><th><code>trovato_locale</code></th><th>Interface translation</th></tr>
    <tr><th><code>trovato_content_translation</code></th><th>Translatable content fields</th></tr>
    <tr><th><code>trovato_config_translation</code></th><th>Translatable configuration</th></tr>
    <tr><th><code>trovato_book</code></th><th>Ordered page trees with previous/next/up navigation</th></tr>
    </tbody></table>
    <h3>Specialized Plugins (separate install)</h3>
    <p>The <code>plugins-disabled/</code> directory may contain plugins that require
    additional infrastructure (e.g., external APIs or dedicated databases).
    These are not loaded by default:</p>
    <ul>
    <li><code>argus</code> — Drupal 6 site monitoring</li>
    <li><code>goose</code> — Load testing integration</li>
    </ul>
    <h2>5. Start the Server</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    </span></code></pre></figure><p>On first startup, Trovato will:</p>
    <ol>
    <li>Connect to PostgreSQL and Redis</li>
    <li>Run database migrations automatically</li>
    <li>Discover and compile plugins from <code>plugins/</code></li>
    <li>Run plugin migrations in dependency order</li>
    <li>Start listening on <code>http://localhost:PORT</code></li>
    </ol>
    <h2>6. Web Installer</h2>
    <p>Open your browser to <code>http://localhost:3000</code>. You will be redirected to
    the installation wizard.</p>
    <p><strong>Step 1 — Welcome:</strong> Confirms PostgreSQL and Redis are connected and
    migrations have run.</p>
    <p><strong>Step 2 — Create Admin Account:</strong> Set your admin username, email
    address, and password (minimum 8 characters).</p>
    <p><strong>Step 3 — Site Configuration:</strong> Set your site name, slogan, and
    contact email.</p>
    <p><strong>Step 4 — Complete:</strong> Installation is finished. Follow the links to
    visit your site or the admin dashboard.</p>
    <h2>7. Verify</h2>
    <p>After installation, confirm everything is running:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Health check</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/health</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Admin dashboard (requires login)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">open</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/admin</span>
    </span></code></pre></figure><h2>Subsequent Starts</h2>
    <p>After the initial install, simply run:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    </span></code></pre></figure><p>The installer will not run again. Any new database or plugin migrations
    are applied automatically on startup.</p>
    <h2>Configuration Export/Import</h2>
    <p>Trovato supports exporting and importing site configuration as YAML files:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Export all config to ./config/</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config export</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Import config from ./config/</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Dry-run import (validate without writing)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import --dry-run</span>
    </span></code></pre></figure><h2>Troubleshooting</h2>
    <p><strong>Server fails to start with "failed to initialize application state":</strong>
    Check that PostgreSQL and Redis are running and your <code>DATABASE_URL</code> and
    <code>REDIS_URL</code> are correct. Look at the full error chain in the log output
    for specifics.</p>
    <p><strong>Plugin fails to load:</strong>
    Each plugin requires a <code>{name}.wasm</code> file matching the <code>name</code> field in
    its <code>{name}.info.toml</code>. Verify the WASM file exists and is named
    correctly:</p>
