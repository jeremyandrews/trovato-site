    <h1>Installing Trovato CMS</h1>
    <p>This guide walks through a fresh installation of Trovato CMS from source.</p>
    <h2>Docker Alternative</h2>
    <p>If you don't have Rust installed, you can use Docker for the full development environment:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>profile</span> dev up<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>d</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">docker</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> compose exec dev bash</span>
    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Full Rust toolchain available inside the container</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></code></pre></figure><p>See <a href="/learn/docker-development">Docker Development Guide</a> for details.</p>
    <h2>Prerequisites</h2>
    <ul>
    <li><strong>Rust</strong> (stable toolchain, 2024 edition): install via <a href="https://rustup.rs/">rustup</a></li>
    <li><strong>PostgreSQL 15+</strong>: running and accessible</li>
    <li><strong>Redis 7+</strong>: running on default port (6379)</li>
    </ul>
    <p>Verify your toolchain:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">rustc</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>version   <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 1.85+ recommended</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>version    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> 15+</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">redis-cli</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> ping    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> should print PONG</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span></code></pre></figure><h2>1. Create the Database</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>CREATE USER trovato WITH PASSWORD &#39;trovato&#39;;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">psql</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>c</span> <span class="tok-string tok-quoted tok-double tok-shell"><span class="tok-punctuation tok-definition tok-string tok-begin tok-shell">&quot;</span>CREATE DATABASE trovato OWNER trovato;<span class="tok-punctuation tok-definition tok-string tok-end tok-shell">&quot;</span></span></span>
    </span></code></pre></figure><p>Or, if your PostgreSQL is configured for peer/trust authentication:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">createdb</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> trovato</span>
    </span></code></pre></figure><h2>2. Configure Environment</h2>
    <p>Copy the example environment file and edit as needed:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> .env.example .env</span>
    </span></code></pre></figure><p>The defaults work for local development:</p>
    <figure class="code"><figcaption class="code__lang">env</figcaption><pre class="code__body" tabindex="0" aria-label="env code"><code class="language-env">PORT=3000
    DATABASE_URL=postgres://trovato:trovato@localhost:5432/trovato
    REDIS_URL=redis://127.0.0.1:6379
    DATABASE_MAX_CONNECTIONS=10
    RUST_LOG=info,tower_http=debug,sqlx=warn
    </code></pre></figure><h3>Optional Settings</h3>
    <table><thead><tr><th>Variable</th><th>Default</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>PORT</code></th><th><code>3000</code></th><th>HTTP server port</th></tr>
    <tr><th><code>SITE_URL</code></th><th><code>http://localhost:&lt;PORT&gt;</code></th><th>The site's public base URL. Every absolute address the kernel emits is built from it: <code>sitemap.xml</code>, the <code>Sitemap:</code> line in <code>robots.txt</code>, the RSS feeds, <code>&lt;link rel="canonical"&gt;</code>, the Open Graph tags and the links in outgoing mail. Set it to the scheme and host visitors actually use, or a crawler is handed addresses that resolve to a developer's laptop. A trailing slash is ignored.</th></tr>
    <tr><th><code>DATABASE_MAX_CONNECTIONS</code></th><th><code>10</code></th><th>PostgreSQL connection pool size</th></tr>
    <tr><th><code>RUST_LOG</code></th><th><code>info</code></th><th>Log filter, in <code>RUST_LOG</code> format</th></tr>
    <tr><th><code>PLUGINS_DIR</code></th><th><code>./plugins</code></th><th>Plugin search path. Several directories may be given, separated by <code>:</code>; later ones win a name collision.</th></tr>
    <tr><th><code>UPLOADS_DIR</code></th><th><code>./uploads</code></th><th>Path for file uploads. The server checks at startup that it can write, read and delete a file there, and refuses to start if it cannot.</th></tr>
    <tr><th><code>FILES_URL</code></th><th><code>/files</code></th><th>Base URL that uploaded files are served under</th></tr>
    <tr><th><code>TEMPLATES_DIR</code></th><th><code>./templates</code></th><th>Tera template search path. Several directories may be given, separated by <code>:</code>; later ones override templates of the same name.</th></tr>
    <tr><th><code>THEMES_DIR</code></th><th><code>./themes</code></th><th>Where themes are found, one directory per theme holding <code>theme.toml</code> (<code>name</code>, <code>description</code>, optional <code>screenshot</code>), <code>templates/</code> laid over the stock templates, and <code>static/</code> served at <code>/static/themes/&lt;name&gt;/</code>. Several directories may be given, separated by <code>:</code>; a later one's theme replaces an earlier one of the same name. Chosen at <code>/admin/appearance</code>.</th></tr>
    <tr><th><code>STATIC_DIR</code></th><th><code>./static</code></th><th>Static asset search path, served under <code>/static</code>. Several directories may be given, separated by <code>:</code>; later ones override assets of the same path. The generated Pagefind index is written to the first directory unless <code>PAGEFIND_OUTPUT_DIR</code> says otherwise.</th></tr>
    <tr><th><code>PAGEFIND_OUTPUT_DIR</code></th><th><code>pagefind</code> under the first <code>STATIC_DIR</code></th><th>Where the Pagefind index is built and served from; its URL stays <code>/static/pagefind/</code>. The kernel builds the index itself; no <code>pagefind</code> binary is needed. Each rebuild is made in a directory beside it and its files moved in, so its parent must be writable. On several servers, point it into the shared volume.</th></tr>
    <tr><th><code>CORS_ALLOWED_ORIGINS</code></th><th><code>*</code></th><th>Comma-separated allowed origins</th></tr>
    <tr><th><code>COOKIE_SAME_SITE</code></th><th><code>strict</code></th><th>Cookie SameSite policy (<code>strict</code>, <code>lax</code>, <code>none</code>)</th></tr>
    <tr><th><code>COOKIE_SECURE</code></th><th><code>always</code></th><th>Whether the session cookie is <code>Secure</code>: <code>always</code> or <code>never</code>. Leave it at <code>always</code> for any site reached over HTTPS. <code>never</code> is for a plain HTTP LAN or development site only. See "Serving over plain HTTP" below.</th></tr>
    <tr><th><code>TRUSTED_PROXIES</code></th><th><em>(empty: trust none)</em></th><th>Reverse proxies whose <code>X-Forwarded-For</code> and <code>X-Forwarded-Proto</code> are believed, as comma-separated addresses and CIDR ranges. See "Behind a reverse proxy" below.</th></tr>
    <tr><th><code>CLIENT_IP_STORAGE</code></th><th><code>full</code></th><th>How much of a client address is stored: <code>full</code>, <code>truncated</code> or <code>none</code>. See "Client addresses and privacy" below.</th></tr>
    <tr><th><code>CRON_KEY</code></th><th><em>(none)</em></th><th>Shared secret in the cron URL, <code>POST /cron/&lt;CRON_KEY&gt;</code>. Change it before exposing the server.</th></tr>
    <tr><th><code>JWT_SECRET</code></th><th><em>(none)</em></th><th>Required for OAuth2 plugin (min 32 bytes)</th></tr>
    <tr><th><code>WEBHOOK_ENCRYPTION_KEY</code></th><th><em>(none)</em></th><th>Encrypts webhook secrets (min 32 bytes, recommended)</th></tr>
    <tr><th><code>UPDATE_CHECK</code></th><th><code>1</code></th><th>Whether the kernel may check for Trovato releases. Set to <code>0</code> (or <code>false</code>/<code>off</code>/<code>no</code>) for a deployment that must make no outbound requests at all. See "Update checks" below.</th></tr>
    <tr><th><code>UPDATE_CHECK_INTERVAL_SECS</code></th><th><code>86400</code></th><th>Minimum seconds between update checks</th></tr>
    <tr><th><code>UPDATE_CHECK_ENDPOINT</code></th><th>GitHub's latest-release API</th><th>The endpoint the check asks. Configurable so a test can point it at a local server.</th></tr>
    </tbody></table>
    <p><code>.env.example</code> is the fuller reference, including the <code>POSTGRES_*</code> and
    <code>REDIS_PORT</code> settings that only <code>docker compose</code> reads.</p>
    <h3>Serving uploaded files</h3>
    <p>Never point a web server, reverse proxy static location or CDN origin at
    <code>UPLOADS_DIR</code>. It holds every upload in one tree, including files attached only
    to unpublished or restricted content, and the image style derivatives generated
    from them under <code>UPLOADS_DIR/styles/</code>. The kernel decides access for each file
    against the content that references it, so every file must be fetched through
    the kernel's <code>/files/</code> routes. A proxy in front of the kernel may cache what the
    kernel marks <code>public</code>; responses it marks <code>private, no-store</code> must not be kept.</p>
    <p>The kernel answers <code>/files/</code> with the type stored when the upload was validated
    and <code>X-Content-Type-Options: nosniff</code>; a proxy must pass <code>Content-Type</code> through
    unchanged. Uploads are limited to 10 MB, and the upload routes accept request
    bodies of up to 10 MB plus 64 KiB of multipart framing. A proxy with a smaller
    body limit (nginx defaults to 1 MB) must allow at least that on <code>/file/upload</code>
    and <code>/api/v1/block-editor/upload</code>, for example <code>client_max_body_size 11m;</code>, or
    editors get the proxy's error instead of the kernel's.</p>
    <h3>Behind a reverse proxy</h3>
    <p>Trovato takes the client address from the TCP connection. Behind a reverse
    proxy (nginx, Caddy, HAProxy, a Kubernetes ingress, a CDN) that connection comes
    from the proxy, so every visitor would share the proxy's address, its rate-limit
    budget and its sign-in lockout counter. Tell Trovato which peers are proxies:</p>
    <figure class="code"><figcaption class="code__lang">env</figcaption><pre class="code__body" tabindex="0" aria-label="env code"><code class="language-env">TRUSTED_PROXIES=127.0.0.1,::1
    </code></pre></figure><p>That is the whole change for nginx on the same host. List every hop in front of
    Trovato, as addresses or CIDR ranges: a load balancer behind a CDN is
    <code>TRUSTED_PROXIES=10.0.0.0/8,&lt;the CDN's published ranges&gt;</code>; a pod behind an
    ingress is the cluster's pod network, for example <code>TRUSTED_PROXIES=10.42.0.0/16</code>.</p>
    <p>When the connection comes from a listed proxy, Trovato reads <code>X-Forwarded-For</code>
    from the right, skips the entries that are themselves listed proxies, and takes
    the first address that is not one. A proxy that sends no <code>X-Forwarded-For</code> may
    send <code>X-Real-IP</code> instead. A connection from anywhere else is the client, and
    its forwarding headers are ignored, so a visitor who connects directly cannot
    choose their own address by sending one. The RFC 7239 <code>Forwarded</code> header is not
    read; every common proxy writes <code>X-Forwarded-For</code>.</p>
    <p><code>X-Forwarded-Proto</code> is believed only from the same listed proxies. It is how
    Trovato learns that the visitor connected over HTTPS, and only then does a
    response carry <code>Strict-Transport-Security</code>. A site behind a TLS-terminating
    proxy must list that proxy in <code>TRUSTED_PROXIES</code> to send HSTS at all; with
    <code>TRUSTED_PROXIES</code> unset, no response carries it, whatever the proxy sends. A
    visitor who connects directly cannot ask for HSTS by sending the header.
    <code>COOKIE_SECURE</code> does not depend on it: the session cookie is <code>Secure</code> by
    setting, not by header (see "Serving over plain HTTP" below).</p>
    <p>The proxy must append to <code>X-Forwarded-For</code>, not pass the client's value through
    unchanged. For nginx:</p>
    <figure class="code"><figcaption class="code__lang">nginx</figcaption><pre class="code__body" tabindex="0" aria-label="nginx code"><code class="language-nginx">proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    </code></pre></figure><p><code>TRUSTED_PROXIES</code> is empty by default, which trusts no proxy. An entry that is
    not an address or a CIDR range (<code>10.0.0.0/33</code>, a hostname, a typo) stops the
    server at startup with a message naming it, instead of being dropped and
    silently trusting one proxy fewer.</p>
    <h3>Serving over plain HTTP</h3>
    <p>The session cookie, the only cookie Trovato sets (CSRF tokens and "remember me"
    live inside the session), is <code>Secure</code> by default. A browser keeps a <code>Secure</code>
    cookie only from an HTTPS page, with one exception for <code>localhost</code>, so a site
    served over plain HTTP at a LAN address such as <code>http://192.168.1.20:3000</code> or
    <code>http://cms.lan</code> cannot be logged in to: the login answers, the browser drops
    the cookie, and the next page is anonymous again.</p>
    <p>For that site, and only that site, set:</p>
    <figure class="code"><figcaption class="code__lang">env</figcaption><pre class="code__body" tabindex="0" aria-label="env code"><code class="language-env">COOKIE_SECURE=never
    SITE_URL=http://192.168.1.20:3000
    </code></pre></figure><p>Use <code>never</code> only on a plain HTTP LAN or a development machine, never on a site
    reachable from the internet. Without <code>Secure</code> the browser sends the session
    cookie over any plain HTTP request to the host, so anyone on the network path
    (a shared Wi-Fi, a hostile router, an ISP) can read it and act as the signed-in
    user, an administrator included, without knowing the password. Behind HTTPS,
    either directly or through a TLS-terminating proxy, leave it at <code>always</code>, even
    when the proxy talks plain HTTP to Trovato: the browser sees HTTPS, and that
    is what <code>Secure</code> is about.</p>
    <p>Guard rails: with <code>never</code> the server logs a warning naming <code>COOKIE_SECURE</code> on
    every start, and the site settings page (<code>/admin/config/site</code>) shows it under
    "Session cookie". <code>never</code> is refused at startup when <code>SITE_URL</code> is <code>https://</code>,
    and when <code>COOKIE_SAME_SITE=none</code> (browsers reject a <code>SameSite=None</code> cookie that
    is not <code>Secure</code>). Any value other than <code>always</code> or <code>never</code> is refused too. There
    is no <code>auto</code>: the flag is fixed at startup, and a per-request guess from the
    request scheme is one forwarded header away from the wrong answer.</p>
    <h3>Client addresses and privacy</h3>
    <p><code>CLIENT_IP_STORAGE</code> decides how much of a client address Trovato keeps once the
    request is over:</p>
    <table><thead><tr><th>Value</th><th>What is stored</th></tr></thead><tbody>
    <tr><th><code>full</code> (default)</th><th>The whole address, as before this setting existed.</th></tr>
    <tr><th><code>truncated</code></th><th>The network only: IPv4 to its /24 (<code>203.0.113.77</code> is kept as <code>203.0.113.0</code>), IPv6 to its /48.</th></tr>
    <tr><th><code>none</code></th><th>Nothing.</th></tr>
    </tbody></table>
    <p>It applies everywhere an address outlives the request: the <code>ip_address</code> column
    of the security audit log (<code>security_audit_log</code>, NULL under <code>none</code>) and of the
    audit log plugin's <code>audit_log</code> (the empty string under <code>none</code>, since that column
    cannot be NULL), the client address on sign-in lockout warnings in the site log
    (<code>system_log</code>), the address shown on a user's device list (the session index in
    Redis, kept as long as the session), and the client address in password reset
    log lines. Comments, users and items store no client address under any value.</p>
    <p>Rate limiting and sign-in lockout always use the whole address, under every
    value, because telling clients apart is their whole job. They keep it in Redis
    only, as counter keys that expire with their window (a minute to an hour with
    the default limits; lockout keys within thirty minutes). Nothing is written to
    the database for them.</p>
    <p>A site that wants no address on record sets <code>CLIENT_IP_STORAGE=none</code> and keeps
    its proxy passing the real address in <code>X-Forwarded-For</code>; there is no need to
    rewrite the header to a constant at the proxy, which would also put every
    visitor in one rate-limit budget. An unknown value stops the server at startup.</p>
    <h3>Rate Limits</h3>
    <p>Every request is counted against one bucket, chosen by its path and method. A
    request that presents no credential is counted per client IP; a signed-in request
    (a session cookie or an API token) is counted per user, at the count of the user's
    role. Each bucket's default is the request count in the table below; the window is
    fixed per bucket, whoever is counted.</p>
    <p>A limit is overridden by the environment variable <code>TROVATO_RATE_LIMIT_&lt;BUCKET&gt;</code>
    or by the site configuration key <code>rate_limit.&lt;bucket&gt;</code>, both taking the count
    alone. <strong>The environment wins over the stored configuration</strong>, so a limit can
    always be changed without reaching into the database. Both are read once at
    startup, so a change to the stored value takes effect on the next restart. A
    value that is not an integer of at least 1 is ignored with a warning and the
    compiled default stands.</p>
    <table><thead><tr><th>Bucket</th><th>Default</th><th>Applies to</th></tr></thead><tbody>
    <tr><th><code>static</code></th><th>2000 / minute</th><th>Reads under <code>/static/</code> and <code>FILES_URL</code> (default <code>/files/</code>), and <code>/favicon.ico</code></th></tr>
    <tr><th><code>page</code></th><th>600 / minute</th><th>Page views: a <code>GET</code> or <code>HEAD</code> outside <code>/api/</code> that no bucket above claims</th></tr>
    <tr><th><code>api</code></th><th>100 / minute</th><th><code>/api/</code> endpoints, and any other request no bucket claims</th></tr>
    <tr><th><code>forms</code></th><th>30 / minute</th><th>Any other POST</th></tr>
    <tr><th><code>search</code></th><th>20 / minute</th><th><code>/search</code> and <code>/api/v1/search</code></th></tr>
    <tr><th><code>search_expand</code></th><th>30 / minute</th><th><code>POST /api/v1/search/expand</code></th></tr>
    <tr><th><code>search_summarize</code></th><th>10 / minute</th><th><code>POST /api/v1/search/summarize</code></th></tr>
    <tr><th><code>search_followup</code></th><th>5 / minute</th><th><code>POST /api/v1/search/followup</code></th></tr>
    <tr><th><code>ai_assist</code></th><th>10 / minute</th><th><code>POST /api/v1/ai/assist</code>, the writing assistant</th></tr>
    <tr><th><code>login</code></th><th>5 / minute</th><th><code>POST /user/login</code></th></tr>
    <tr><th><code>register</code></th><th>3 / hour</th><th><code>POST /user/register</code></th></tr>
    <tr><th><code>uploads</code></th><th>10 / minute</th><th><code>/file/upload</code> and <code>POST /api/v1/block-editor/upload</code></th></tr>
    <tr><th><code>verify_email</code></th><th>10 / minute</th><th>Email verification token attempts</th></tr>
    <tr><th><code>profile</code></th><th>10 / minute</th><th>Profile update submissions</th></tr>
    <tr><th><code>password</code></th><th>5 / minute</th><th>Password change submissions</th></tr>
    <tr><th><code>recovery</code></th><th>5 / 15 minutes</th><th>Account recovery, per IP and per account</th></tr>
    <tr><th><code>comment</code></th><th>4 / minute</th><th>Comment writes</th></tr>
    <tr><th><code>data_export</code></th><th>1 / hour</th><th>Personal-data export downloads</th></tr>
    <tr><th><code>mail</code></th><th>100 / hour</th><th>Mail a plugin sends through the <code>mail</code> host interface. Keyed <strong>per plugin</strong>, not per client, and checked on every path — a request, <code>tap_cron</code>, <code>tap_queue_worker</code>, <code>tap_install</code> — because the mailbox being protected is the site's own. Also bounds <code>POST /admin/config/site/test-email</code> per client, which mails the same address.</th></tr>
    </tbody></table>
    <p>Every kernel route that writes a file, sends mail or calls an AI provider has
    a named bucket, listed with it in the <code>SENSITIVE_ROUTES</code> test in
    <code>crates/kernel/src/middleware/rate_limit.rs</code>. Some are checked by the route
    itself rather than by path: password reset (<code>recovery</code> per client and
    <code>reset_mail</code> per address), account recovery, profile updates, the data export,
    and the AI chat and assistant, whose hourly limits are set on their admin
    pages. Every AI call is also held to the AI token budget (<code>/admin/system/ai-budgets</code>),
    where the <code>anonymous user</code> role's limit is one site-level cap shared by every
    anonymous visitor.</p>
    <p>For example, to serve a site whose pages carry an unusual number of assets:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">TROVATO_RATE_LIMIT_STATIC</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">5000</span>
    </span></code></pre></figure><h4>Counts by role</h4>
    <p>A bucket can give the holders of a role their own count, set by the environment
    variable <code>TROVATO_RATE_LIMIT_&lt;BUCKET&gt;__&lt;ROLE&gt;</code> (two underscores) or the site
    configuration key <code>rate_limit.&lt;bucket&gt;.&lt;role&gt;</code>, with the same precedence and the
    same handling of a bad value as the bucket default. <code>&lt;role&gt;</code> is the role's name,
    lower-cased, with each run of characters other than a letter or a digit written
    as one underscore: <code>anonymous user</code> is <code>anonymous_user</code>, <code>Site Editor</code> is
    <code>site_editor</code> (upper-cased in the environment variable). A key naming a role
    nobody holds has no effect.</p>
    <p>Which count a request gets:</p>
    <ul>
    <li><strong>No credential</strong> (no session, no <code>Authorization: Bearer</code>): the
    <code>anonymous_user</code> count, or the bucket default, per client IP.</li>
    <li><strong>Signed in</strong>, by cookie or by token: the most generous count among the user's
    roles, every signed-in user holding <code>authenticated_user</code> as well as their own,
    or the bucket default if none of them has one, per user. No role is exempt,
    administrators included.</li>
    </ul>
    <p>Before authentication has run, a request that presents a credential is also
    counted per client IP at the most generous count the bucket gives anyone, in a
    budget of its own. That bounds an address sending tokens that authenticate
    nobody without refusing a signed-in user their own count.</p>
    <p>For example, 60 API requests a minute for anonymous clients and 300 for any
    signed-in user:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">TROVATO_RATE_LIMIT_API__ANONYMOUS_USER</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">60</span>
    <span class="tok-variable tok-other tok-readwrite tok-assignment tok-shell">TROVATO_RATE_LIMIT_API__AUTHENTICATED_USER</span><span class="tok-keyword tok-operator tok-assignment tok-shell">=</span><span class="tok-string tok-unquoted tok-shell">300</span>
    </span></code></pre></figure><p>or, stored in the site configuration:</p>
    <figure class="code"><figcaption class="code__lang">text</figcaption><pre class="code__body" tabindex="0" aria-label="text code"><code class="language-text">rate_limit.api.anonymous_user = 60
    rate_limit.api.authenticated_user = 300
    </code></pre></figure><p><code>login</code> and <code>register</code> are counted once per request, by the per-IP check, so
    <code>login</code> admits five attempts a minute from an address and <code>register</code> three an
    hour.</p>
    <h2>3. Build</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    </span></code></pre></figure><p>This compiles the kernel binary. Plugin WASM modules ship pre-compiled in
    the <code>plugins/</code> directory and do not need to be built separately.</p>
    <h2>4. Plugin Selection</h2>
    <p>Trovato discovers plugins automatically from the <code>plugins/</code> directory at
    startup. Every plugin found on disk is auto-installed and enabled on first
    run.</p>
    <p><strong>To exclude a plugin</strong>, move its directory out of <code>plugins/</code> before the
    first run:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mkdir</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> plugins-disabled</span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mv</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins/some_plugin plugins-disabled/</span>
    </span></code></pre></figure><p><strong>To re-enable a disabled plugin</strong>, move it back and restart:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">mv</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins-disabled/some_plugin plugins/</span>
    </span></code></pre></figure><p>You can also manage plugins after installation via the CLI:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> List all plugins and their status</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin list</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Disable a plugin</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin disable some_plugin</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Enable a plugin</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugin enable some_plugin</span>
    </span></code></pre></figure><h3>Included Plugins</h3>
    <h2>Update checks</h2>
    <p>Trovato asks GitHub, at most once a day from cron, whether a newer release exists.</p>
    <p><strong>Exactly what that is:</strong> one outbound HTTPS GET to
    <code>https://api.github.com/repos/jeremyandrews/trovato/releases/latest</code>, carrying no
    site data — no URL, no version, no site identifier, nothing but the request and a
    <code>Trovato/&lt;version&gt;</code> User-Agent. GitHub learns that an IP address asked about a
    public repository. Nothing is sent about the site, and no page render ever makes the
    request: the check runs in cron and stores its answer, and the dashboard reads what
    was stored.</p>
    <p>When the running version is behind, <strong>an administrator</strong> sees a banner on
    <code>/admin</code>, styled as an alarm when the release announces itself as a security
    release (see the release convention in CONTRIBUTING.md). Nobody else sees it: a
    visitor and a logged-in non-administrator are never told the site's version, which
    is a fingerprinting detail with no upside for them.</p>
    <p><strong>Turning it off.</strong> There are two switches and the environment wins:</p>
    <ul>
    <li><code>UPDATE_CHECK=0</code> in the environment, for a deployment where "no outbound
    requests" is an operational requirement. An air-gapped install should not depend
    on a database row being right.</li>
    <li>A <strong>Check for Trovato releases</strong> checkbox at <code>/admin/config/site</code>, for a site that
    simply does not want it.</li>
    </ul>
    <p>On by default, which is a deliberate choice rather than an oversight: a site with no
    way to learn that a security fix exists is a site that does not get it. Drupal core
    has shipped update status on by default for two decades. The data flow is small
    enough to write down in full, which is what the paragraph above is.</p>
    <table><thead><tr><th>Plugin</th><th>Description</th></tr></thead><tbody>
    <tr><th><code>trovato_blog</code></th><th>Blog content type with tags</th></tr>
    <tr><th><code>trovato_categories</code></th><th>Hierarchical taxonomy with tags</th></tr>
    <tr><th><code>trovato_comments</code></th><th>Threaded comments on content</th></tr>
    <tr><th><code>trovato_media</code></th><th>Media library and file management</th></tr>
    <tr><th><code>trovato_redirects</code></th><th>URL redirect management</th></tr>
    <tr><th><code>trovato_audit_log</code></th><th>Administrative audit trail</th></tr>
    <tr><th><code>trovato_scheduled_publishing</code></th><th>Publish/unpublish content on a schedule</th></tr>
    <tr><th><code>trovato_content_locking</code></th><th>Pessimistic content editing locks</th></tr>
    <tr><th><code>trovato_webhooks</code></th><th>Outgoing webhook notifications</th></tr>
    <tr><th><code>trovato_image_styles</code></th><th>Server-side image derivative generation</th></tr>
    <tr><th><code>trovato_oauth2</code></th><th>OAuth2 authorization server (requires <code>JWT_SECRET</code>)</th></tr>
    <tr><th><code>trovato_locale</code></th><th>Interface translation</th></tr>
    <tr><th><code>trovato_content_translation</code></th><th>Translatable content fields</th></tr>
    <tr><th><code>trovato_config_translation</code></th><th>Translatable configuration</th></tr>
    <tr><th><code>trovato_book</code></th><th>Ordered page trees with previous/next/up navigation</th></tr>
    </tbody></table>
    <h3>Specialized Plugins (separate install)</h3>
    <p>The <code>plugins-disabled/</code> directory may contain plugins that require
    additional infrastructure (e.g., external APIs or dedicated databases).
    These are not loaded by default:</p>
    <ul>
    <li><code>goose</code> — Load testing integration</li>
    </ul>
    <p>Argus, the news-intelligence plugin (RSS and Atom ingest, relevance scoring,
    story clustering), is not in this tree: it builds and installs from its own
    repository, <code>jeremyandrews/argus</code>, as an overlay on a released kernel.</p>
    <h2>5. Start the Server</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    </span></code></pre></figure><p>On first startup, Trovato will:</p>
    <ol>
    <li>Connect to PostgreSQL and Redis</li>
    <li>Run database migrations automatically</li>
    <li>Discover and compile plugins from <code>plugins/</code></li>
    <li>Run plugin migrations in dependency order</li>
    <li>Start listening on <code>http://localhost:PORT</code></li>
    </ol>
    <h2>6. Web Installer</h2>
    <p>Open your browser to <code>http://localhost:3000</code>. You will be redirected to
    the installation wizard.</p>
    <p><strong>Step 1 — Welcome:</strong> Confirms PostgreSQL and Redis are connected and
    migrations have run.</p>
    <p><strong>Step 2 — Create Admin Account:</strong> Set your admin username, email
    address, and password (minimum 8 characters).</p>
    <p><strong>Step 3 — Site Configuration:</strong> Set your site name, slogan, and
    contact email.</p>
    <p><strong>Step 4 — Complete:</strong> Installation is finished. Follow the links to
    visit your site or the admin dashboard.</p>
    <h2>7. Verify</h2>
    <p>After installation, confirm everything is running:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Health check (`/health/live` and `/health/ready` are the probes)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">curl</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/health</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Admin dashboard (requires login)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">open</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> http://localhost:3000/admin</span>
    </span></code></pre></figure><h2>Subsequent Starts</h2>
    <p>After the initial install, simply run:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    </span></code></pre></figure><p>The installer will not run again. Any new database or plugin migrations
    are applied automatically on startup. To see them first, run
    <code>trovato migrate --dry-run</code>; to roll a release back, start the previous binary
    (see <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/docs/deployment/upgrades.md">docs/deployment/upgrades.md</a> and the
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/docs/cli-reference.md">command line reference</a>).</p>
    <h2>More Than One Server</h2>
    <p>Several servers can run one site behind a load balancer, with no sticky
    sessions and no extra setting, if they share one Postgres, one Redis and one
    read-write volume for <code>UPLOADS_DIR</code> and <code>PAGEFIND_OUTPUT_DIR</code>. See
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/docs/deployment/multi-server.md">docs/deployment/multi-server.md</a>. On
    Kubernetes, migrations run as their own step; see
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.105.0/docs/deployment/upgrades.md">docs/deployment/upgrades.md</a>.</p>
    <h2>Configuration Export/Import</h2>
    <p>Trovato supports exporting and importing site configuration as YAML files:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Export all config to ./config/</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config export</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Import config from ./config/</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Dry-run import (validate without writing)</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> run<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span><span class="tok-keyword tok-operator tok-end-of-options tok-shell"> --</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> config import --dry-run</span>
    </span></code></pre></figure><h2>Troubleshooting</h2>
    <p><strong>Server fails to start with "failed to initialize application state":</strong>
    Check that PostgreSQL and Redis are running and your <code>DATABASE_URL</code> and
    <code>REDIS_URL</code> are correct. Look at the full error chain in the log output
    for specifics.</p>
    <p><strong>Plugin fails to load:</strong>
    Each plugin requires a <code>{name}.wasm</code> file matching the <code>name</code> field in
    its <code>{name}.info.toml</code>. Verify the WASM file exists and is named
    correctly:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">ls</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins/trovato_blog/blog.wasm          <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> should exist</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">ls</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> plugins/trovato_blog/blog.info.toml     <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> should exist</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span></code></pre></figure><p><strong>OAuth2 not working:</strong>
    The OAuth2 plugin requires <code>JWT_SECRET</code> to be set in your <code>.env</code> with a
    value of at least 32 bytes. Without it, the plugin silently skips
    initialization.</p>
    <p><strong>Template rendering errors:</strong>
    Ensure <code>TEMPLATES_DIR</code> points to the <code>templates/</code> directory at the
    project root. If running from a different working directory, set the
    absolute path.</p>
