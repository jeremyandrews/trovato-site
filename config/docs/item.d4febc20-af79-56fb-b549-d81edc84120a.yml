    <h1>Contributing to Trovato</h1>
    <p>Trovato is at 0.101.0 and the work between here and 1.0 is happening in public.
    <a href="/learn/roadmap">ROADMAP.md</a> says what that work is, and the admin screens listed
    there are the most approachable place to start.</p>
    <h2>Before you write much</h2>
    <p>Open an issue first for anything beyond a bug fix. That is not process for its
    own sake: the kernel has a deliberate boundary (see "Kernel minimality" below)
    and it is better to find out that something belongs in a plugin before it is
    written rather than after.</p>
    <h2>AI-assisted contributions</h2>
    <p>Trovato is written with substantial AI assistance. Contributions made the same
    way are welcome, on the same terms the rest of this file describes. There is no
    disclosure requirement and no separate review track.</p>
    <p>What is asked of you is the same thing that is asked of any contributor, which
    AI assistance makes easier to get wrong:</p>
    <ul>
    <li><strong>Understand the change you are submitting.</strong> You should be able to explain
    why it works, what it touches, and what happens when it fails. If you cannot,
    it is not ready, however green the tests are.</li>
    <li><strong>Verify it yourself before submitting.</strong> Run the checks below on your own
    machine. A patch that has only been reasoned about is not a patch that has
    been tested.</li>
    <li><strong>Check the claims in the description against the code.</strong> Descriptions that
    confidently assert things the diff does not do are the characteristic failure
    here, and they cost a reviewer more time than the change saves.</li>
    <li><strong>Keep it scoped.</strong> Unrequested refactoring of surrounding code, speculative
    abstraction and drive-by reformatting all make a change harder to review.</li>
    </ul>
    <p>Please do not name the tool you used in commit messages, code comments, the
    changelog or the pull request. This is a house style about noise, not a position
    on AI: attribution trailers and tool mentions accumulate in the history and tell
    a future reader nothing they need. The same rule applies to <code>Co-Authored-By</code>
    trailers of any kind.</p>
    <h2>Before submitting</h2>
    <p>Run the local check script, which mirrors CI:</p>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">./scripts/pre-commit-check.sh          <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> fmt + clippy + unit tests</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">./scripts/pre-commit-check.sh</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"><span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>quick  <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> fmt + clippy only</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span></span></span></span></code></pre></figure><p>Or the steps by hand:</p>
    <ol>
    <li><code>cargo fmt --all -- --check</code></li>
    <li><code>cargo clippy --workspace --all-targets -- -D warnings</code></li>
    <li><code>cargo test --all --lib</code> (unit tests; no database or Redis needed)</li>
    </ol>
    <h3>The local gate is stronger than CI</h3>
    <p>CI splits the integration tests across three shards with three separate
    databases, to keep any one runner from exhausting its disk. A local
    <code>cargo test --all</code> runs every target against <strong>one</strong> database, so interference
    between test files through shared fixtures is visible locally and can be
    invisible in CI when two files land in different shards.</p>
    <p><strong>CI passing does not imply <code>cargo test --all</code> passes.</strong> If you touch anything in
    <code>crates/kernel/tests/common/mod.rs</code>, the shared <code>TestApp</code>, or any other shared
    fixture, run the full suite locally against a single database before opening the
    pull request.</p>
    <p>Shared seeders must stay concurrency-safe. Tests within a binary run in
    parallel and every binary shares one database, so a plain <code>EXISTS</code> check before
    an insert is a race that silently duplicates fixtures. Use a Postgres advisory
    lock, as the existing seeders do.</p>
    <p>Integration tests need PostgreSQL and Redis. <code>docker compose up</code> starts both.</p>
    <p>Run them against a <strong>fresh</strong> database, and drop and recreate it between full
    runs. A few tests use fixed fixture names and assert exact row counts without
    cleaning up, so they pass the first time and fail the second. See
    KNOWN-ISSUES.md.</p>
    <h2>Coding standards</h2>
    <p>The full reference is <a href="/learn/coding-standards">docs/coding-standards.md</a>. The
    rules that come up most:</p>
    <ul>
    <li>All new public items need <code>///</code> doc comments; all new <code>.rs</code> files need <code>//!</code>
    module documentation.</li>
    <li><code>.unwrap()</code> is not allowed in production code. Use <code>.expect("reason")</code> with a
    <code># Panics</code> section on the enclosing function, or propagate the error.</li>
    <li>A new <code>#[allow(clippy::...)]</code> needs a comment explaining why.</li>
    <li>Use Trovato's vocabulary, not Drupal's: category (not taxonomy or vocabulary),
    item (not node), tap (not hook), plugin (not module), gather (not views), tile
    (not block). <a href="/learn/design-terminology">docs/design/Terminology.md</a> has the
    full map.</li>
    <li>Never build SQL with <code>format!()</code>. Use SeaQuery's parameterized queries.</li>
    <li>All state-changing endpoints use <code>require_csrf</code>.</li>
    <li>Every <code>| safe</code> in a Tera template needs a <code>{# SAFE: reason #}</code> comment saying
    what already sanitized the value.</li>
    </ul>
    <h2>Kernel minimality</h2>
    <p>The kernel enables; plugins implement. If it is a feature, it is a plugin. If it
    is infrastructure that plugins depend on, it is kernel.</p>
    <p>A new service in <code>crates/kernel/src/services/</code> has to answer one question: does
    another kernel subsystem depend on this, or only feature routes? If only feature
    routes, it belongs in a plugin. The pull request template asks this, and
    <a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/docs/kernel-minimality-audit.md">docs/kernel-minimality-audit.md</a> has the full
    reasoning and the current inventory.</p>
    <h2>The plugin contract is frozen</h2>
    <p>The plugin boundary (the WIT surface, the <code>trovato-sdk</code> crate, the manifest
    semantics, the error vocabularies) does not change before 1.0. Additive changes
    are possible; breaking ones are not.</p>
    <p>Note that the tooling cannot enforce this on its own right now. Under SemVer's
    0.x rules a breaking change is permitted by a minor bump, so the <code>SDK Semver Gate</code> job will not fail one until the project reaches 1.0.0. Until then it is
    held by review. If your change touches the SDK's public surface, say so in the
    pull request.</p>
    <h2>Versioning</h2>
    <p>Trovato has one version number, and everything carries it: the kernel, the SDK,
    every plugin, every manifest, and the plugin API tuple. Do not bump one of them
    on its own. <a href="https://github.com/jeremyandrews/trovato/blob/v0.101.0/docs/design/version-map.md">docs/design/version-map.md</a> lists every
    place that moves together.</p>
    <h2>Releases</h2>
    <p>Every tag gets a GitHub Release, with that version's <code>CHANGELOG.md</code> section pasted
    into the notes. This is not decoration: it is the update channel. GitHub serves
    <code>https://api.github.com/repos/jeremyandrews/trovato/releases/latest</code> and
    <code>https://github.com/jeremyandrews/trovato/releases.atom</code> for free, and the kernel's
    update check reads the first of them. A tag with no Release is a release no site
    learns about.</p>
    <p><strong>A security release's title starts with <code>[security]</code>.</strong> For example:</p>
    <figure class="code"><pre class="code__body"><code>[security] 0.99.2 — session fixation in the recovery flow
    </code></pre></figure><p>That single convention is the whole difference between "a newer version exists" and
    "act now": the latest-release JSON says what the newest version is and has no field
    for urgency, so the signal lives in the one field a human writes deliberately. The
    kernel reads it (<code>crates/kernel/src/update_status.rs</code>, <code>is_security_title</code>) and the
    admin dashboard styles the banner as an alarm rather than a notice.</p>
    <p>The prefix has to lead. A title merely <em>mentioning</em> security is not a security
    release, or every release note that says the word becomes an emergency.</p>
    <h2>Licensing your contribution</h2>
    <p>Trovato is dual licensed under MIT and Apache-2.0.</p>
    <p>Unless you explicitly state otherwise, any contribution intentionally submitted
    for inclusion in the work by you, as defined in the Apache-2.0 license, shall be
    dual licensed as above, without any additional terms or conditions.</p>
