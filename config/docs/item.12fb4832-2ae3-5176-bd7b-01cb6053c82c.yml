    <p>Writes to items, comments and URL aliases, raw SQL included, are queued for the
    static search index by the database. After changing anything else that decides
    what an item's search page holds (data your <code>tap_field_access</code> reads), queue
    the items yourself, or search never sees the change
    (<a href="/learn/plugin-development#the-static-search-index-queue-what-you-change">the rule</a>):</p>
