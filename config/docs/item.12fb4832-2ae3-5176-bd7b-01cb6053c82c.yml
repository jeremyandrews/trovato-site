    <h1>Trovato Plugin Quick Reference</h1>
    <p>A condensed reference for Trovato plugin development.</p>
    <hr />
    <h2>Project Setup</h2>
    <figure class="code"><figcaption class="code__lang">bash</figcaption><pre class="code__body" tabindex="0" aria-label="bash code"><code class="language-bash"><span class="tok-source tok-shell tok-bash"><span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Install WASM target</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">rustup</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target add wasm32-wasip1</span>

    <span class="tok-comment tok-line tok-number-sign tok-shell"><span class="tok-punctuation tok-definition tok-comment tok-begin tok-shell">#</span></span><span class="tok-comment tok-line tok-number-sign tok-shell"> Build plugin</span><span class="tok-comment tok-line tok-number-sign tok-shell">
    </span><span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cargo</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> build<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> -</span>p</span> my_plugin<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>target</span> wasm32-wasip1<span class="tok-variable tok-parameter tok-option tok-shell"><span class="tok-punctuation tok-definition tok-parameter tok-shell"> --</span>release</span></span>
    <span class="tok-meta tok-function-call tok-shell"><span class="tok-variable tok-function tok-shell">cp</span></span><span class="tok-meta tok-function-call tok-arguments tok-shell"> target/wasm32-wasip1/release/my_plugin.wasm plugins/my_plugin/</span>
    </span></code></pre></figure><p><strong>Cargo.toml:</strong></p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">[lib]
    crate-type = [&quot;cdylib&quot;]

    [dependencies]
    trovato-sdk = { path = &quot;../../crates/plugin-sdk&quot; }
    serde = { version = &quot;1.0&quot;, features = [&quot;derive&quot;] }
    serde_json = &quot;1.0&quot;
    </code></pre></figure><p><strong>my_plugin.info.toml:</strong></p>
    <figure class="code"><figcaption class="code__lang">toml</figcaption><pre class="code__body" tabindex="0" aria-label="toml code"><code class="language-toml">name = &quot;my_plugin&quot;
    description = &quot;Plugin description&quot;
    version = &quot;1.0.0&quot;
    dependencies = []

    [taps]
    implements = [&quot;tap_item_info&quot;, &quot;tap_item_view&quot;]
    weight = 0

    # Optional (API 0.105): tables of your own holding site configuration,
    # carried by `trovato config export` / `config import`.
    [config]
    tables = [&quot;my_plugin_setting&quot;]
    # Optional (API 0.105): columns holding a secret, password, token, key or a
    # hash of one. Exported as env:TROVATO_SECRET_&lt;TABLE&gt;_&lt;PK&gt;_&lt;COLUMN&gt;, never as
    # the value; import reads that variable.
    secret_columns = { my_plugin_setting = [&quot;api_key&quot;] }
    </code></pre></figure><hr />
