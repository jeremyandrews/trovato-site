    <h2>Available Taps</h2>
    <table><thead><tr><th>Category</th><th>Tap</th><th>Input</th><th>Output</th></tr></thead><tbody>
    <tr><th><strong>Content Types</strong></th><th><code>tap_item_info</code></th><th>-</th><th><code>Vec&lt;ContentTypeDefinition&gt;</code></th></tr>
    <tr><th><strong>View</strong></th><th><code>tap_item_view</code></th><th><code>ItemViewInput</code></th><th><code>RenderElement</code></th></tr>
    <tr><th><strong>View</strong></th><th><code>tap_item_view_alter</code></th><th><code>ItemViewAlterInput</code></th><th><code>RenderElement</code></th></tr>
    <tr><th><strong>CRUD</strong></th><th><code>tap_item_presave</code></th><th><code>{item_type, title, fields, status}</code></th><th><code>{"fields": {...}}</code>, merged into the write</th></tr>
    <tr><th><strong>CRUD</strong></th><th><code>tap_item_insert</code></th><th>the created item</th><th>ignored (notification)</th></tr>
    <tr><th><strong>CRUD</strong></th><th><code>tap_item_update</code></th><th>the updated item</th><th>ignored (notification)</th></tr>
    <tr><th><strong>CRUD</strong></th><th><code>tap_item_update_index</code></th><th>the saved item</th><th>ignored (notification)</th></tr>
    <tr><th><strong>CRUD</strong></th><th><code>tap_item_delete</code></th><th>the item being deleted</th><th>ignored (notification; cannot abort)</th></tr>
    <tr><th><strong>Access</strong></th><th><code>tap_item_access</code></th><th><code>ItemAccessInput</code></th><th><code>AccessResult</code></th></tr>
    <tr><th><strong>Access</strong></th><th><code>tap_vocabulary_owner_access</code></th><th><code>VocabularyOwnerAccessRequest</code></th><th><code>VocabularyOwnerAccess</code> (grant, deny, neutral, not_found)</th></tr>
    <tr><th><strong>Forms</strong></th><th><code>tap_form_alter</code></th><th>the form as JSON (<code>form_id</code>, <code>elements</code>, <code>libraries</code>)</th><th>the form, altered; plugins chain in weight order</th></tr>
    <tr><th><strong>Forms</strong></th><th><code>tap_form_validate</code></th><th><code>{form_id, values}</code> (rendered inputs only, no passwords)</th><th><code>{}</code> or <code>{"errors": ["msg" or {"field", "message"}]}</code></th></tr>
    <tr><th><strong>Forms</strong></th><th><code>tap_form_submit</code></th><th><code>{form_id, values, item_id}</code></th><th>ignored; fires once after a successful save</th></tr>
    <tr><th><strong>Forms</strong></th><th><code>tap_form_ajax</code></th><th><code>{trigger, form_id, values}</code> (CSRF, form access checked; full host API)</th><th><code>{"commands": [...]}</code> or <code>{}</code></th></tr>
    <tr><th><strong>System</strong></th><th><code>tap_menu</code></th><th>-</th><th><code>Vec&lt;MenuDefinition&gt;</code></th></tr>
    <tr><th><strong>System</strong></th><th><code>tap_perm</code></th><th>-</th><th><code>Vec&lt;PermissionDefinition&gt;</code></th></tr>
    <tr><th><strong>System</strong></th><th><code>tap_admin_nav</code></th><th>-</th><th><code>Vec&lt;AdminNavDefinition&gt;</code></th></tr>
    <tr><th><strong>System</strong></th><th><code>tap_cron</code></th><th>-</th><th><code>Result&lt;(), String&gt;</code></th></tr>
    <tr><th><strong>Lifecycle</strong></th><th><code>tap_install</code></th><th>-</th><th><code>Result&lt;(), String&gt;</code></th></tr>
    <tr><th><strong>Lifecycle</strong></th><th><code>tap_enable</code></th><th>-</th><th><code>Result&lt;(), String&gt;</code></th></tr>
    <tr><th><strong>Lifecycle</strong></th><th><code>tap_disable</code></th><th>-</th><th><code>Result&lt;(), String&gt;</code></th></tr>
    </tbody></table>
