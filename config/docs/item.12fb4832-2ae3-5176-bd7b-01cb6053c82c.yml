    </span></code></pre></figure><hr />
    <h2>Don't</h2>
    <ul>
    <li>Panic (return errors instead)</li>
    <li>Use global mutable state</li>
    <li>Access filesystem</li>
    <li>Make HTTP calls directly</li>
    <li>Concatenate SQL strings</li>
    <li>Expose secrets in errors</li>
    <li>Return HTML a user wrote without <code>host::filter_text</code></li>
    <li>Change what <code>tap_field_access</code> lets an anonymous visitor see and forget
    <code>host::search_index_enqueue</code></li>
    </ul>
    <h2>Do</h2>
    <ul>
    <li>Use <code>trovato_sdk::prelude::*</code></li>
    <li>Return descriptive errors</li>
    <li>Use structured queries</li>
    <li>Cache expensive operations</li>
    <li>Check permissions</li>
    <li>Handle missing data with <code>Option</code></li>
    </ul>
