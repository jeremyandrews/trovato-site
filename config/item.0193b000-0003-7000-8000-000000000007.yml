      <p>Trovato is one person's project with the door open. Here is what that means in practice.</p>
      
      <h2>Contributing</h2>
      
      <p><a href="/learn/contributing">CONTRIBUTING.md</a> is the real document and this is the summary of it. Issues and pull requests go to <a href="https://github.com/jeremyandrews/trovato">the repository</a>. A pull request is expected to come with tests, to keep <code>cargo fmt</code> and <code>cargo clippy</code> clean, and to have a green CI run against the commit that is actually being merged.</p>
      
      <p>If you are changing behaviour, the regression test goes at the layer where the defect was, and the changelog entry describes the root cause rather than the symptom. That is the standard the project holds itself to and it is the standard a contribution is held to.</p>
      
      <h2>How this is built</h2>
      
      <p>Trovato is written with substantial AI assistance, under my direction and review. I am saying so here for the same reason the README says it: you are entitled to know how the code you are being asked to run was produced, and finding out later is worse than being told.</p>
      
      <p>What that means concretely. I decide what gets built and why. I review what is written. The tests, the CI gates and the security work exist because a system written this way needs them more, not less, and the honest way to make the practice defensible is to make the verification stricter than it would otherwise be. Contributions are welcome on the same basis, disclosed the same way.</p>
      
      <p>What it does not mean. It is not a claim that the code is better for it, and it is not an excuse for anything that turns out to be wrong. A defect is a defect regardless of who or what typed it.</p>
      
      <h2>Code of conduct</h2>
      
      <p>The project has one, and it is <a href="/learn/code-of-conduct">enforced by me</a>, because there is nobody else. Reports go to the address in that document. I would rather hear about a problem early and get it wrong than hear about it late.</p>
      
      <h2>Reporting a security problem</h2>
      
      <p>Do not open a public issue for a vulnerability. Report it privately through <a href="https://github.com/jeremyandrews/trovato/security/advisories/new">GitHub's security advisory form</a>, which reaches me and nobody else until it is fixed.</p>
      
      <p>I will acknowledge that I received it. I will tell you what I think it is and whether I agree. When there is a fix, you get credit unless you would rather not have it. What I cannot promise is a response time: this is one person's project and I will not pretend it has a rota.</p>
      
      <h2>Comments on this site</h2>
      
      <p>You need an account to comment, and a new comment is held until it is reviewed. <a href="/comment-policy">The comment policy</a> says what is published, what is held, and who decides.</p>
