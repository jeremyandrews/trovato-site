      <p>Trovato, a content management system written in Rust, is open source, and you&#8217;re welcome to help build it.</p>

      <h2>Contributing</h2>

      <p><a href="/learn/contributing">CONTRIBUTING.md</a> has the details; this is the short version. Issues and pull requests go to <a href="https://github.com/jeremyandrews/trovato">the repository</a>. Open an issue before starting anything larger than a bug fix. Run <code>./scripts/pre-commit-check.sh</code> before you submit. If you touch a shared test fixture, also run the full <code>cargo test --all</code> against one database, which catches test interference that CI&#8217;s three shards can miss.</p>

      <h2>How Trovato is built</h2>

      <p>Trovato is written with substantial AI assistance. The maintainer decides what gets built and why, and reviews what&#8217;s written.</p>

      <p>Because so much of the code is written this way, the tests and CI checks are stricter than they would otherwise be. The security audits so far were done in-house, and there hasn&#8217;t been an outside audit yet; <a href="/learn/known-issues">Known issues</a> has the details. Contributions written with AI help are welcome and held to the same standard as any other, and CONTRIBUTING.md covers what&#8217;s asked of them.</p>

      <p>Using AI makes no claim about the code&#8217;s quality, and a bug counts the same whoever or whatever wrote it.</p>

      <h2>Code of conduct</h2>

      <p>Trovato has a <a href="/learn/code-of-conduct">code of conduct</a>, and the maintainer enforces it. Reports go to the address in that document. If you&#8217;re not sure something is worth reporting, report it.</p>

      <h2>Reporting a security problem</h2>

      <p>Please do not open a public issue for a vulnerability. Report it privately through <a href="https://github.com/jeremyandrews/trovato/security/advisories/new">GitHub&#8217;s security advisory form</a>, which stays private between you and the maintainer until the advisory is published.</p>

      <p>You&#8217;ll get an acknowledgement and an assessment of the report, and when there&#8217;s a fix, you&#8217;ll get credit unless you&#8217;d rather not. There&#8217;s no security team and no guaranteed response time.</p>

      <h2>Comments on this site</h2>

      <p>You need an account to comment, and comments from new accounts are held for review. <a href="/comment-policy">The comment policy</a> explains how comments are moderated. For anything else, use <a href="/contact">the contact form</a>.</p>
