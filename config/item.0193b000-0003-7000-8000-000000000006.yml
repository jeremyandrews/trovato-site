      <p>Trovato is written in Rust. This page is the stack by name, the rules the project holds itself to, and enough of the plugin contract to see whether you want to write one.</p>
      
      <h2>The stack</h2>
      
      <table>
      <thead><tr><th>What</th><th>Which</th><th>Doing what</th></tr></thead>
      <tbody>
      <tr><td>HTTP</td><td>axum 0.8, on tower 0.5</td><td>Routing, middleware, extractors</td></tr>
      <tr><td>Runtime</td><td>tokio 1</td><td>Everything asynchronous</td></tr>
      <tr><td>Database</td><td>sqlx 0.8, PostgreSQL</td><td>Queries checked against a real schema</td></tr>
      <tr><td>Templates</td><td>tera 1</td><td>The theme layer, with template suggestions</td></tr>
      <tr><td>Cache</td><td>moka 0.12 in process, redis 0.27 shared</td><td>Two tiers, deliberately</td></tr>
      <tr><td>Plugins</td><td>wasmtime 47</td><td>One sandbox per plugin per request</td></tr>
      <tr><td>Passwords</td><td>argon2 0.5</td><td>Hashing</td></tr>
      <tr><td>Sanitising</td><td>ammonia 4</td><td>The filtered HTML text format</td></tr>
      </tbody>
      </table>
      
      <h2>The toolchain, and how it moves</h2>
      
      <p>The toolchain is pinned to one version in <code>rust-toolchain.toml</code>, and CI carries the same version in its own configuration because the toolchain action does not read that file. Both pins move together or neither does. There is no separately declared minimum supported Rust version: the pin is the answer to that question.</p>
      
      <p>The reason the protocol exists is that CI once floated to a newer stable that added clippy lints while local development stayed on the old one, so every local gate passed green while CI failed. Bumping the channel now means editing both pins in one commit, running the full local gate on the new toolchain, fixing whatever lints it surfaces, and running <code>cargo audit</code> again because a toolchain bump can change the resolved dependency set. The person who bumps it absorbs the lints instead of ambushing the next unrelated change.</p>
      
      <p>Plugins compile to <code>wasm32-wasip1</code>, and the target is listed in the same pin, so anyone who picks up the toolchain gets it.</p>
      
      <h2>What CI enforces</h2>
      
      <ul>
      <li><code>cargo fmt --check</code> and <code>cargo clippy</code> with warnings denied.</li>
      <li>The test suite, sharded three ways, against a real PostgreSQL and Redis.</li>
      <li>Coverage, reported rather than gated.</li>
      <li><code>cargo audit</code>, against the advisory database.</li>
      <li><code>cargo semver-checks</code> on the plugin SDK, which fails when the SDK's public surface breaks without a version bump. The plugin contract being frozen is a claim, and this is the thing that keeps it true.</li>
      <li>A guard against new raw SQL expressions added without justification.</li>
      </ul>
      
      <h2>Licence</h2>
      
      <p>Dual licensed under <a href="https://github.com/jeremyandrews/trovato/blob/main/LICENSE-MIT">MIT</a> or <a href="https://github.com/jeremyandrews/trovato/blob/main/LICENSE-APACHE">Apache-2.0</a>, at your option. That is the ordinary Rust convention and it is deliberate: Apache-2.0 carries a patent grant, MIT is short enough to read, and taking either means nobody has to argue about it.</p>
      
      <h2>Writing a plugin</h2>
      
      <p>A plugin implements named functions and declares what it may reach. Here is a whole tap, from the blog plugin that ships with the kernel:</p>
      
      <pre><code>#[plugin_tap]
      pub fn tap_item_info() -&gt; Vec&lt;ContentTypeDefinition&gt; {
          vec![ContentTypeDefinition {
              machine_name: "blog".into(),
              label: "Blog Post".into(),
              description: "A blog entry with body and tags".into(),
              title_label: None,
              fields: vec![
                  FieldDefinition::new("field_body", FieldType::TextLong)
                      .required()
                      .label("Body"),
                  FieldDefinition::new(
                      "field_tags",
                      FieldType::RecordReference("category_term".into()),
                  )
                  .cardinality(-1)
                  .label("Tags"),
              ],
          }]
      }</code></pre>
      
      <p>That is the whole of defining a content type. No schema migration, no table, no form definition.</p>
      
      <p>What the plugin may reach is a separate declaration, in its manifest. This one is the AI comment moderation plugin, and it is worth reading closely because every line of it is a restriction:</p>
      
      <pre><code>[capabilities]
      host_interfaces = ["logging", "queue", "ai-api", "db"]
      ai_background = true
      db_tables = ["comment"]</code></pre>
      
      <p>It may log, use the job queue, call the configured AI provider, and touch the database. It owns no migrations, so <code>db_tables</code> is its entire database reach: the <code>comment</code> table, and nothing else. It does not declare <code>raw_sql</code>, so it cannot write a query the kernel has not parsed, and the table guarantee holds. <code>ai_background</code> says the provider call happens under the background principal rather than inside a web request.</p>
      
      <p>Nothing in that manifest is advisory. The kernel builds the linker from it.</p>
      
      <p><a href="/learn/plugin-development">The plugin development guide</a> is the long version, <a href="/learn/plugin-quick-reference">the quick reference</a> is the short one, and <a href="/learn/design-plugin-system">the plugin system design document</a> says why it is shaped this way.</p>
