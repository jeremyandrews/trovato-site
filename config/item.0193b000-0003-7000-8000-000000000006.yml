      <p>Trovato is a content management system written in Rust, on top of the projects in the table below.</p>

      <h2>The stack</h2>

      <table>
      <thead><tr><th>What</th><th>Which</th><th>Doing what</th></tr></thead>
      <tbody>
      <tr><td>HTTP</td><td><a href="https://github.com/tokio-rs/axum">axum</a> 0.8, on <a href="https://github.com/tower-rs/tower">tower</a> 0.5</td><td>Routing, middleware, extractors</td></tr>
      <tr><td>Runtime</td><td><a href="https://tokio.rs/">tokio</a> 1</td><td>Everything asynchronous</td></tr>
      <tr><td>Database</td><td><a href="https://github.com/launchbadge/sqlx">sqlx</a> 0.9, <a href="https://www.postgresql.org/">PostgreSQL</a></td><td>Async PostgreSQL access, parameterised queries</td></tr>
      <tr><td>Templates</td><td><a href="https://keats.github.io/tera/">tera</a> 1</td><td>The theme layer, which uses the most specific template file that exists for a page</td></tr>
      <tr><td>Cache</td><td><a href="https://github.com/moka-rs/moka">moka</a> 0.12 in process, <a href="https://github.com/redis-rs/redis-rs">redis</a> 0.27 shared</td><td>Two tiers, deliberately</td></tr>
      <tr><td>Plugins</td><td><a href="https://wasmtime.dev/">wasmtime</a> 49</td><td>One sandbox per plugin per call</td></tr>
      <tr><td>Passwords</td><td><a href="https://github.com/RustCrypto/password-hashes/tree/master/argon2">argon2</a> 0.5</td><td>Hashing</td></tr>
      <tr><td>Sanitising</td><td><a href="https://github.com/rust-ammonia/ammonia">ammonia</a> 4</td><td>Cleaning the HTML that users submit before it is shown</td></tr>
      </tbody>
      </table>

      <p>This site adds a few projects of its own: <a href="https://rsms.me/inter/">Inter</a> and <a href="https://www.jetbrains.com/lp/mono/">JetBrains Mono</a>, self-hosted, are the fonts you&#8217;re reading; <a href="https://github.com/trishume/syntect">syntect</a> highlights code in the documentation copied in from Trovato&#8217;s repository and <a href="https://github.com/pulldown-cmark/pulldown-cmark">pulldown-cmark</a> renders its Markdown; the browser checks on <a href="/accessibility">the accessibility page</a> run on <a href="https://github.com/dequelabs/axe-core">axe-core</a> and <a href="https://playwright.dev/">Playwright</a>.</p>

      <h2>The toolchain</h2>

      <p>The toolchain is pinned to one version in <code>rust-toolchain.toml</code>. CI pins the same version in its own configuration, because the toolchain action doesn&#8217;t read that file. No <code>rust-version</code> is declared: the pinned toolchain is the only stable release the project builds and tests on.</p>

      <p>The two pins move together because CI once floated to a newer stable release with new clippy lints, and every local check passed while CI failed. Moving the pin means editing both in one commit, running the full local check suite on the new toolchain, fixing any new lints, and running <code>cargo audit</code> again in case the dependency set changed.</p>

      <p>Plugins compile to <code>wasm32-wasip1</code>, and that target is part of the same pin.</p>

      <h2>What CI enforces</h2>

      <ul>
      <li><code>cargo fmt --check</code>, and <code>cargo clippy</code> with warnings denied.</li>
      <li>The test suite, split three ways, against a real PostgreSQL and Redis.</li>
      <li>Coverage, reported but not gated.</li>
      <li><code>cargo audit</code> against the advisory database.</li>
      <li><code>cargo semver-checks</code> on the plugin SDK, which fails a breaking change that ships without the version bump semver requires. Before 1.0 a minor bump is enough to pass it, so until then the maintainer keeps the plugin contract (what plugins and Trovato&#8217;s core agree on) frozen by reviewing every change to it. From 1.0 a breaking change needs a major version bump, and the check enforces that.</li>
      <li>A check that counts the places under <code>crates/</code> where custom SQL is spliced into a built query without bound parameters, and fails if the count rises, unless the pull request raises the baseline and says why.</li>
      </ul>

      <h2>Licence</h2>

      <p>Trovato is dual licensed under <a href="https://github.com/jeremyandrews/trovato/blob/main/LICENSE-MIT">MIT</a> or <a href="https://github.com/jeremyandrews/trovato/blob/main/LICENSE-APACHE">Apache-2.0</a>, at your option, which is the usual choice for Rust projects. Apache-2.0 includes a patent grant, and MIT is short enough to read in a minute.</p>

      <h2>Writing a plugin</h2>

      <p>Plugins are how you extend Trovato. A plugin implements named functions, called taps, and the kernel (Trovato&#8217;s core) calls them at set points, such as when it needs to know your content types (the kinds of content your site holds, such as articles or events) or when a piece of content is saved. Here&#8217;s a complete tap from the blog plugin that ships with Trovato:</p>

      <pre><code>#[plugin_tap]
      pub fn tap_item_info() -&gt; Vec&lt;ContentTypeDefinition&gt; {
          vec![ContentTypeDefinition {
              machine_name: "blog".into(),
              label: "Blog Post".into(),
              description: "A blog entry with body and tags".into(),
              title_label: None,
              fields: vec![
                  FieldDefinition::new("field_body", FieldType::TextLong)
                      .required()
                      .label("Body"),
                  FieldDefinition::new(
                      "field_tags",
                      FieldType::RecordReference("category_term".into()),
                  )
                  .cardinality(-1)
                  .label("Tags"),
              ],
          }]
      }</code></pre>

      <p>That defines a content type. You don&#8217;t write a schema migration or a form for it.</p>

      <p>What a plugin may reach is declared separately, in its manifest, a short TOML file that ships with the plugin. These are the capabilities of this site&#8217;s own plugin:</p>

      <pre><code>[capabilities]
      host_interfaces = ["logging", "variables", "query", "item-api"]
      item_background = true</code></pre>

      <p>The plugin can log and read its own settings. It runs its queries through Gather, the query engine behind every listing on this site, the front page&#8217;s recent posts included. It reads and writes content through the kernel&#8217;s item functions. The plugin asks for no database access of its own, so the kernel decides what each read may see. <code>item_background</code> lets it use the item functions from a scheduled task, where there&#8217;s no logged-in user whose permissions would cover the call.</p>

      <p>The kernel connects the plugin only to the interfaces in <code>host_interfaces</code>. A plugin that does use the database also lists the tables it needs in <code>db_tables</code>, and the kernel checks every structured database call against that list.</p>

      <p><a href="/learn/plugin-development">The plugin development guide</a> is the long version, <a href="/learn/plugin-quick-reference">the quick reference</a> is the short one, and <a href="/learn/design-plugin-system">the plugin system design</a> explains why it works this way.</p>
