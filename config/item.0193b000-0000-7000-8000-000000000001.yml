    <section class="proof proof-split" aria-labelledby="proof-sandbox">
      <h2 class="proof__title" id="proof-sandbox">A plugin reaches only what it declares</h2>
      <div class="proof__copy">
        <p>The blog, the contact form and the list of recent posts at the bottom of this page all come from plugins. A plugin can be code you didn&#8217;t write, so Trovato limits what each one can touch.</p>
        <p>A plugin is a WebAssembly module with a manifest. When the kernel loads a plugin, it connects the module to the host interfaces its manifest names (groups of kernel functions, such as database access or logging). Every plugin also gets five minimal stubs of WASI, WebAssembly&#8217;s standard system interface. Nothing else is connected. A module that imports any other kernel interface is refused when it loads, so whether a plugin may use an interface is settled once, before it runs.</p>
        <p>Here are the capabilities of the plugin that renders the listing at the bottom of this page:</p>
        <figure class="code">
          <figcaption class="code__lang">toml</figcaption>
          <pre class="code__body"><code>[capabilities]
    host_interfaces = ["db", "logging", "variables"]
    db_tables = ["item", "url_alias", "item_translation"]
    raw_sql = true</code></pre>
        </figure>
        <p><code>host_interfaces</code> comes from a fixed list of thirteen. A manifest that names anything else is rejected when it&#8217;s parsed, and only a kernel release can add to the list. <code>db_tables</code> lists any tables the plugin needs beyond its own, and the kernel checks each of the plugin&#8217;s structured database calls (its calls to select, insert, update or delete rows) against that list. The tables its migrations create are available to it without being listed.</p>
        <p><code>raw_sql</code> is the escape hatch. It lets a plugin run SQL that the kernel doesn&#8217;t check against that table list. This plugin uses it for the listing below, which mixes two content types in one sorted list and joins each post to its URL alias, the readable path it is served at. Each of the kernel&#8217;s structured database calls touches only one table, so none of them can build that list. In fact every query this plugin runs is raw SQL, so its <code>db_tables</code> line only records the tables it means to touch, and the kernel checks none of those tables. The flag is one line in a reviewed file, so it&#8217;s easy to find every plugin that uses it.</p>
        <p>The sandbox has a few more limits. There&#8217;s no filesystem. The runtime provides five WASI stubs, and the only one that touches a file descriptor is <code>fd_write</code>, which returns <code>ENOSYS</code> for every descriptor, standard output included. A module that imports any other file function, such as <code>path_open</code> or <code>fd_read</code>, can&#8217;t be instantiated. One plugin can&#8217;t reach another&#8217;s memory. A plugin that names no interfaces gets nothing from the kernel but those stubs, and it can still do arithmetic. <a href="/blog/what-a-plugin-may-reach">What a plugin may reach</a> goes through all thirteen interfaces.</p>
      </div>
      <div class="proof__art">
        <img src="/static/art/diagram-sandbox.svg" alt="" aria-hidden="true" width="720" height="400">
      </div>
    </section>

    <section class="proof proof-split proof-flip" aria-labelledby="proof-storage">
      <h2 class="proof__title" id="proof-storage">Content is one row</h2>
      <div class="proof__copy">
        <p>You add fields to a content type from the admin, and the database schema doesn&#8217;t change. That works because an item is one row, and its fields live in one JSONB column on that row. A content type with twenty fields is twenty keys in that column; the schema never describes fields. Loading an item is one read:</p>
        <figure class="code">
          <figcaption class="code__lang">sql</figcaption>
          <pre class="code__body"><code>SELECT title, fields FROM item WHERE id = $1;</code></pre>
        </figure>
        <p>Trovato keeps earlier versions of content. Every save through the editor or the item API (the kernel&#8217;s functions for reading and writing content) writes a revision, a saved version you can go back to, so the history is there whether or not anyone thought to turn it on. A plugin that saves through the item API gets revisions from the kernel without having to support them itself. Two kinds of write skip the history: config import, which loads content from configuration files, and a plugin&#8217;s write to the item table through the database interface instead of the item API. Every item also has a stage, the basis for preparing changes out of sight before they go live. An item&#8217;s stage is either the one called live or one the site defines, such as a draft or a campaign in preparation. Nothing moves an item from one stage to another yet, so content saved through the editor lands on the live stage. Trovato takes its content model from Drupal, a content management system written in PHP, and <a href="/learn/design-terminology">the terminology page</a> maps Drupal&#8217;s terms to Trovato&#8217;s, including item and stage.</p>
      </div>
      <div class="proof__art">
        <img src="/static/art/diagram-onerow.svg" alt="" aria-hidden="true" width="720" height="400">
      </div>
    </section>

    <section class="proof proof-split" aria-labelledby="proof-gather">
      <h2 class="proof__title" id="proof-gather">Listings are configuration</h2>
      <div class="proof__copy">
        <p>Many pages on a site are lists of content, and in Trovato those lists come from Gather. A query is a base table with its filters, sorts, relationships and display, and Trovato stores the whole thing as configuration, which exports to YAML. So a listing can live in git next to your code, and a change to it is reviewed and moved between environments like any other configuration change. Build it in Gather&#8217;s visual query builder in the admin, or edit the YAML by hand.</p>
        <p>The news, blog and documentation listings on this site are Gather queries. The recent posts at the bottom of this page aren&#8217;t: they come from the plugin whose manifest is shown above.</p>
      </div>
      <div class="proof__art">
        <img src="/static/art/diagram-gather.svg" alt="" aria-hidden="true" width="720" height="400">
      </div>
    </section>
