fields:
  body: |
    <p class="front-hero__lede">A content management system written in Rust.</p>
    <p class="front-hero__sub">I have worked with Drupal since 2002, and Drupal 6 got the mental model right: everything is an item, any type takes fields, queries are built rather than written. Trovato keeps the model and replaces the implementation. Content is one JSONB row instead of a join per field. Plugins are WebAssembly modules in their own sandbox. Gather stands where Views used to. <a href="/why">The whole argument is on the Why page.</a></p>
