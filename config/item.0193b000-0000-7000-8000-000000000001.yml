fields:
  body: |
    <p class="front-hero__lede">A content management system written in Rust.</p>
    <p>I have worked with Drupal since 2002. Drupal 6 got the mental model right: everything is a node, you add fields to any content type, you query it without writing SQL, and you extend it by implementing a few named functions. Trovato keeps the model and replaces the implementation. Content is one JSONB row instead of a join per field. Plugins are WebAssembly modules that run in their own sandbox and reach nothing they have not declared. Queries are built with Gather, a type-safe query engine filling the role Views did.</p>
  proof: |
    <section class="proof" aria-labelledby="proof-sandbox">
      <h2 class="proof__title" id="proof-sandbox">A plugin that declares nothing gets nothing</h2>
      <p>Every plugin is a WebAssembly module with a manifest, and the manifest is the whole of what it may reach. The kernel builds that plugin&#8217;s linker from the list and exposes those host interfaces and no others. This is the manifest of the plugin that renders the listing further down this page:</p>
      <figure class="code">
        <figcaption class="code__lang">toml</figcaption>
        <pre class="code__body"><code>[capabilities]
    host_interfaces = ["db", "logging", "variables"]
    db_tables = ["item", "url_alias"]
    raw_sql = true</code></pre>
      </figure>
      <p>It reads two tables and it says which two. There is no filesystem at all: the runtime hand-writes five WASI stubs and opens no directories, so a plugin that asks to write a file gets <code>ENOSYS</code>. There is no path from one plugin&#8217;s memory into another&#8217;s. A plugin that names no interfaces is handed an empty linker and can do arithmetic.</p>
    </section>

    <section class="proof" aria-labelledby="proof-storage">
      <h2 class="proof__title" id="proof-storage">Twenty fields, one row</h2>
      <p>In Drupal 6, CCK gave every field its own table, so a content type with twenty fields was twenty tables and loading one node was twenty joins. Trovato keeps the model and stores an item as one row with one JSONB column. Twenty fields is twenty keys, and loading the item is one read.</p>
      <figure class="code">
        <figcaption class="code__lang">sql</figcaption>
        <pre class="code__body"><code>SELECT title, fields FROM item WHERE id = $1;</code></pre>
      </figure>
      <p>Revisions and staging belong to the migration that creates content rather than being added on top of it. Every save writes a revision, and every item carries a stage, so an editorial workflow is a property of the write path and not a plugin bolted onto it.</p>
    </section>
