# The front page.
#
# `body` and `proof` are bare strings, not `{value, format}` field objects, and
# that is deliberate. The front-page handler renders a field only when it carries
# a `value` key, so a bare string is passed through to the template untouched and
# the template places it where it belongs. That is what lets the page read hero,
# calls to action, features, gallery, proofs, listing — the tap that renders the
# listing appends after everything else and could not sit in the middle of that.
#
# The consequence: this HTML is not filtered. It is site copy, written here and
# reviewed in a pull request, and it is treated the same way the mirrored
# documentation is. Nothing a visitor writes reaches either.
#
# The illustrations are referenced as <img> rather than inlined, and not only
# for tidiness: an inline variant paints with `var(--art-…)`, and a custom
# property's double hyphen inside served prose is exactly what the dash test in
# checks/tests/content.rs exists to catch. The standalone files carry their own
# prefers-color-scheme block, so they follow the reader's scheme anyway. The
# one inline illustration, the hero, lives in the element template, which the
# test does not scan and the stylesheet animates.
