  body: |
    <p class="front-hero__lede">A content management system written in Rust.</p>
    <p class="front-hero__sub">An item, which is what Trovato calls one piece of content, is a single database row with its fields in one JSONB column, so adding a field to a content type changes no schema. Plugins are WebAssembly modules that reach only what they declare. Every listing on a site is a query you build and keep as configuration, not a string in a template. It is for a site whose content has to outlive a few redesigns, run by people who would rather review a change than find it in production.</p>
