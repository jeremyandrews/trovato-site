    <section class="proof proof-split" aria-labelledby="proof-sandbox">
      <h2 class="proof__title" id="proof-sandbox">A plugin that declares nothing gets nothing</h2>
      <div class="proof__copy">
        <p>A plugin is a WebAssembly module, and it arrives with a manifest. The kernel reads the manifest and builds that plugin a linker of its own, holding the host interfaces it named and nothing else. So a module that imports an interface it did not declare does not get as far as being refused: it fails to instantiate, because there is nothing on the other side of the import. The check is not made when the call happens. The call cannot be built.</p>
        <p>This is the manifest of the plugin that renders the listing at the bottom of this page:</p>
        <figure class="code">
          <figcaption class="code__lang">toml</figcaption>
          <pre class="code__body"><code>[capabilities]
    host_interfaces = ["db", "logging", "variables"]
    db_tables = ["item", "url_alias", "item_translation"]
    raw_sql = true</code></pre>
        </figure>
        <p>It reads two tables, writes a third, and names all three. <code>host_interfaces</code> is drawn from a closed list of thirteen, fixed by the kernel: a manifest naming anything else is rejected when it is parsed, and no plugin can add a fourteenth, only a kernel release can. <code>db_tables</code> is open, and it is half of the allowlist: the other half is every table the plugin&#8217;s own migrations create, which it gets without asking. What it lists here is what it wants to reach that it did not create itself.</p>
        <p>The last line is the awkward one, and it is on the page because leaving it off would be the dishonest version. <code>raw_sql</code> lets a plugin run SQL the kernel does not check against that table list, and the kernel gates the flag rather than parsing the query. This plugin takes it because its listing is one <code>ORDER BY</code> across two content types joined to their aliases with a <code>LIMIT</code>, which the structured item API cannot say in one call. The guarantee is not that no plugin ever takes the escape hatch. It is that taking it is a line in a file somebody reviews, and you can see who took it.</p>
        <p>The rest of the sandbox is the same shape. There is no filesystem: the runtime hand-writes five WASI stubs and opens no directories, so a plugin that asks to write a file gets <code>ENOSYS</code>. There is no path from one plugin&#8217;s memory into another&#8217;s. A plugin that names no interfaces at all is handed an empty linker, and can do arithmetic. <a href="/blog/what-a-plugin-may-reach">What a plugin may reach</a> goes through all thirteen interfaces one by one.</p>
      </div>
      <div class="proof__art">
        <img src="/static/art/diagram-sandbox.svg" alt="" aria-hidden="true" width="720" height="400">
      </div>
    </section>

    <section class="proof proof-split proof-flip" aria-labelledby="proof-storage">
      <h2 class="proof__title" id="proof-storage">Twenty fields, one row</h2>
      <div class="proof__copy">
        <p>An item is one row, and its fields are one JSONB column on that row. A content type with twenty fields is twenty keys in that column, not twenty tables and not twenty joins. Adding a field to a type changes no schema, because the schema does not describe the fields. Loading an item with twenty fields on it is one read:</p>
        <figure class="code">
          <figcaption class="code__lang">sql</figcaption>
          <pre class="code__body"><code>SELECT title, fields FROM item WHERE id = $1;</code></pre>
        </figure>
        <p>Two more things are on that row rather than added beside it. Every save writes a revision, which is a stored earlier version of the item, so the history is a consequence of writing rather than a feature somebody switched on. And every item carries a stage, the content environment it belongs to, such as live or draft or one campaign. Because both live in the storage every write goes through, an editorial workflow does not have to be told about each code path that writes. The words Trovato uses for all of this are laid out in <a href="/learn/design-terminology">the terminology page</a>.</p>
      </div>
      <div class="proof__art">
        <img src="/static/art/diagram-onerow.svg" alt="" aria-hidden="true" width="720" height="400">
      </div>
    </section>

    <section class="proof proof-split" aria-labelledby="proof-gather">
      <h2 class="proof__title" id="proof-gather">A query is a definition, not a string</h2>
      <div class="proof__copy">
        <p>Gather is the query engine. A query is a definition rather than a sentence of SQL: a base table, filters, sorts, relationships and a display. It is stored as configuration, so it exports to a file, is reviewed in a pull request, and imports into the next environment unchanged. It has a visual builder for the people who want one and a YAML file for the people who do not.</p>
        <p>The listing of recent posts at the bottom of this page is one, and so is every listing on this site. None of them is a SQL string in a template.</p>
      </div>
      <div class="proof__art">
        <img src="/static/art/diagram-gather.svg" alt="" aria-hidden="true" width="720" height="400">
      </div>
    </section>
