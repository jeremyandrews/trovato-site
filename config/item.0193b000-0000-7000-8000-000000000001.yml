  body: |
    <p class="front-hero__lede">A content management system written in Rust.</p>
    <p class="front-hero__sub">You define content types, the kinds of content your site holds, such as articles, events or products, and in the admin you add the fields each one needs, without touching the database schema. You publish that content as pages and gather it into listings, such as the latest news or upcoming events, shown as a list, a grid, a table or through your own template. Plugins add features without changing Trovato&#8217;s core, and each plugin declares what it can touch. Listings, like most other settings, are stored as configuration you can export to files and review the way you review code. Trovato is for sites that have to outlive a few redesigns, run by people who want to review every change to the site&#8217;s setup before it reaches production.</p>
  proof: |
    <section class="front-features" aria-label="The three claims">
      <a class="feature-card" href="/why">
        <img src="/static/art/icon-onerow.svg" alt="" aria-hidden="true" width="120" height="120">
        <h2 class="feature-card__title">Add a field, keep the schema</h2>
        <p class="feature-card__text">Each piece of content, which Trovato calls an item, is one row with all its fields in one JSONB column (PostgreSQL&#8217;s JSON type), so a new field changes no table and loading an item is one read.</p>
        <span class="feature-card__more">Why one row</span>
      </a>
      <a class="feature-card" href="/rust">
        <img src="/static/art/icon-sandbox.svg" alt="" aria-hidden="true" width="120" height="120">
        <h2 class="feature-card__title">Plugins in a sandbox</h2>
        <p class="feature-card__text">Each plugin is a WebAssembly module that can call only the parts of the kernel (Trovato&#8217;s core) named in its manifest, a short file shipped with the plugin.</p>
        <span class="feature-card__more">Rust and the plugin contract</span>
