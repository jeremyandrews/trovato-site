# The site's translations.
#
# The `plugin.trovato_site.` prefix is required: `variables_get` namespaces every
# key by the calling plugin's name, so a file without it is a file the plugin
# cannot see, and the call quietly returns the default instead.
#
# A map of item id, then language code, then the title and the fields that
# replace the default ones. `trovato_site`'s tap_cron copies it into the kernel's
# `item_translation` table on every tick, writing only what changed.
#
# It lives here rather than in the item because the kernel has no way to put a
# translation anywhere from configuration. `config import` stores a per-language
# field map verbatim in the item's own `fields`, where the item renderer looks for
# a `value` key, finds a language code instead, and renders nothing at all in
# every language. The two admin routes are registered GET-only and their
# templates are not in the image. There is no API endpoint. All three verified on
# v0.101.0, and all three are in docs/LEDGER.md.
#
# The shape of `fields` has to match the shape the item stores: `{value, format}`.
# A mismatch renders nothing rather than failing, which is why there is a test.
#
# The front page is not here, and cannot be. `routes/front.rs` renders the
# configured front-page item without ever calling `apply_translation_overlay`,
# which `routes/item.rs` does call — so a front page is always in the default
# language however the reader asked. Verified on v0.101.0. Carrying an Italian
# front page here would be configuration nothing reads.
key: plugin.trovato_site.site_translations
value: {
    "0193b000-0003-7000-8000-000000000001": {
      "it": {
        "title": "Perché Trovato",
        "fields": {
          "body": {
            "value": "<p>Drupal 6 aveva il modello concettuale giusto. Tutto è un nodo. Si aggiungono campi a qualsiasi tipo di contenuto senza scrivere uno schema. Si interrogano i contenuti con un costruttore invece che con SQL. Si estende il sistema implementando poche funzioni dal nome preciso, e il sistema le chiama. Lavoro con Drupal dal 2002, e quel modello ha retto meglio di tutto ciò che lo ha sostituito.</p>\n\n<p>A non reggere è stata l'implementazione. Girava su PHP e MySQL, e CCK dava a ogni campo la propria tabella: caricare un nodo con venti campi significava venti join. L'astrazione era buona e il suo prezzo si pagava a ogni visualizzazione, per sempre.</p>\n\n<p>Trovato tiene il modello e ne sostituisce l'implementazione.</p>\n\n<h2>Un contenuto è una riga</h2>\n\n<p>Un contenuto è una singola riga in una sola tabella, con i suoi campi in una sola colonna JSONB. Un tipo con venti campi sono venti chiavi in quella colonna, e caricarlo è una lettura. Aggiungere un campo a un tipo non cambia lo schema, perché lo schema non descrive i campi.</p>\n\n<p>Revisioni e stati editoriali stanno nel percorso di scrittura, non sopra di esso. Ogni salvataggio scrive una revisione. Ogni contenuto porta con sé il proprio stato. Un flusso editoriale è quindi una proprietà di come i contenuti sono conservati, non un plugin a cui va raccontato ogni punto del codice che scrive.</p>\n\n<h2>I plugin girano in una sandbox e raggiungono ciò che hanno dichiarato</h2>\n\n<p>Un plugin è un modulo WebAssembly con un manifesto, e il manifesto è tutto ciò che gli è concesso raggiungere. Il kernel legge l'elenco delle interfacce host e costruisce il linker a partire da quello: il plugin riceve quelle importazioni e nessun'altra. A un plugin che non dichiara nulla viene consegnato un linker vuoto.</p>\n\n<p>Non esiste alcun filesystem. Il runtime scrive a mano cinque stub WASI e non apre nessuna directory, quindi un plugin che chiede di scrivere un file riceve <code>ENOSYS</code>. Non esiste alcuna strada dalla memoria di un plugin a quella di un altro. Un plugin che vuole il database dichiara anche quali tabelle tocca, e il kernel fa rispettare quell'elenco a ogni chiamata strutturata.</p>\n\n<p>Questa è la parte del progetto di cui sono più sicuro, ed è la parte più difficile da aggiungere in un secondo momento. È una proprietà di come i plugin vengono caricati, non una politica applicata loro.</p>\n\n<h2>Le query si costruiscono, non si scrivono</h2>\n\n<p>Gather occupa il posto che era di Views. Una query è una definizione: una tabella di partenza, filtri, ordinamenti, relazioni e una presentazione. Si conserva come configurazione, quindi si esporta in un file, si rivede in una pull request e si importa in un altro ambiente. Ha un costruttore visuale per chi lo vuole e un file YAML per chi non lo vuole.</p>\n\n<h2>Cosa non è fatto</h2>\n\n<p>Trovato è alla versione 0.101.0 e lavora verso la 1.0. Il contratto dei plugin è congelato. Il numero di versione sta sotto la 1.0 perché il CMS attorno a quel contratto non è finito, e l'elenco onesto di ciò che manca vale più dell'elenco di ciò che funziona.</p>\n\n<ul>\n<li><strong>Non esiste un registro dei plugin né un formato di pacchetto.</strong> Un plugin si compila da una directory sul disco e da lì si installa. Non c'è modo di pubblicarne uno, né di installare quello di qualcun altro chiamandolo per nome.</li>\n<li><strong>Parte dell'amministrazione passa dall'importazione della configurazione invece che da un modulo.</strong> Ruoli, permessi, stati editoriali e configurazione di sistema si scrivono in YAML e si importano. È un flusso di lavoro vero, e non sostituisce le schermate che mancano.</li>\n<li><strong>Le migrazioni vanno solo avanti.</strong> Non c'è rollback. Un aggiornamento andato male si recupera da un backup, ed è per questo che la documentazione di installazione mette la prova di ripristino prima della procedura di aggiornamento.</li>\n<li><strong>La ricerca semantica confronta i vettori uno a uno.</strong> Non c'è un indice approssimato, quindi il costo di una query semantica cresce con la dimensione del corpus.</li>\n</ul>\n\n<p>L'elenco completo è in <a href=\"/learn/known-issues\">Known issues</a>, e <a href=\"/learn/roadmap\">la roadmap</a> dice che fine faranno.</p>\n\n<h2>Cos'è questo sito</h2>\n\n<p>Questo sito gira su una release pubblicata di Trovato. È un'applicazione esterna: un plugin, qualche template, un insieme di configurazione e i propri file statici, sovrapposti attraverso i percorsi di ricerca che il kernel già legge. Non applica alcuna patch al kernel. Dove serviva qualcosa che il kernel non ha, quel qualcosa è scritto nero su bianco invece che aggirato, e sta nel repository del sito stesso.</p>\n\n<hr>\n\n<p><strong>In italiano:</strong> <a href=\"/it/get-started\">Come iniziare</a> &middot; <a href=\"/it/community\">Comunità</a> &middot; <a href=\"/it/accessibility\">Accessibilità</a> &middot; <a href=\"/\" hreflang=\"en\" lang=\"en\">English</a></p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0003-7000-8000-000000000004": {
      "it": {
        "title": "Come iniziare",
        "fields": {
          "body": {
            "value": "<p>Due strade. Docker non richiede una toolchain Rust e vi consegna un sito che gira. Compilare dai sorgenti richiede la toolchain e vi consegna qualcosa che potete cambiare.</p>\n\n<h2>Con Docker</h2>\n\n<p>PostgreSQL, Redis e il kernel si avviano insieme.</p>\n\n<pre><code>git clone https://github.com/jeremyandrews/trovato\ncd trovato\ncp .env.example .env\ndocker compose --profile full up</code></pre>\n\n<p>Aprite <code>http://localhost:3001</code> e seguite l'installazione. Chiede un account amministratore e il nome del sito, e da lì in poi il sito è vostro.</p>\n\n<p>Il profilo <code>full</code> è quello che avvia il contenitore di Trovato. Senza, <code>docker compose up</code> avvia solo PostgreSQL e Redis, che è quello che serve quando il server gira in locale sulla porta 3000.</p>\n\n<h2>Dai sorgenti</h2>\n\n<p>Servono Rust, PostgreSQL 16 o successivo e Redis 7 o successivo. La versione della toolchain è fissata in <code>rust-toolchain.toml</code>, quindi rustup scarica quella giusta da solo.</p>\n\n<pre><code>docker compose up -d          # PostgreSQL e Redis\ncargo build --release\ncp .env.example .env\ncargo run --release --bin trovato</code></pre>\n\n<p>Le migrazioni girano all'avvio. <a href=\"/learn/install\">Installing Trovato</a> ha i dettagli, compreso come gestire i database senza contenitori.</p>\n\n<h2>E poi</h2>\n\n<p><a href=\"/learn/building-your-first-site\">Building your first site</a> percorre pagine, blog e navigazione su un'installazione nuova. <a href=\"/learn/tutorial-01-hello-trovato\">Il tutorial</a> è più lungo: nove parti che costruiscono un sito vero partendo da un database vuoto, fino a traduzioni, ricerca e messa in produzione.</p>\n\n<h2>Prima di metterlo dove conta</h2>\n\n<p>Trovato è alla versione 0.101.0. Il contratto dei plugin è congelato, quindi un plugin scritto oggi continuerà a funzionare. Il resto non è finito: non esiste un registro dei plugin, parte dell'amministrazione si fa importando YAML invece che compilando un modulo, e le migrazioni vanno solo avanti, quindi un aggiornamento andato male si recupera da un backup.</p>\n\n<p><a href=\"/learn/known-issues\">Known issues</a> è l'elenco, tenuto onestamente. <a href=\"/it/why\">Perché Trovato</a> è l'argomento a favore del progetto. Nessuno dei due è pubblicità, e se uno dei due vi convince a lasciar perdere, tanto meglio.</p>\n\n<hr>\n\n<p><strong>In italiano:</strong> <a href=\"/it/why\">Perché Trovato</a> &middot; <a href=\"/it/community\">Comunità</a> &middot; <a href=\"/it/accessibility\">Accessibilità</a> &middot; <a href=\"/\" hreflang=\"en\" lang=\"en\">English</a></p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0003-7000-8000-000000000007": {
      "it": {
        "title": "Comunità",
        "fields": {
          "body": {
            "value": "<p>Trovato è il progetto di una persona sola, con la porta aperta. Ecco cosa vuol dire in pratica.</p>\n\n<h2>Contribuire</h2>\n\n<p><a href=\"/learn/contributing\">CONTRIBUTING.md</a> è il documento vero e questo ne è il riassunto. Issue e pull request vanno al <a href=\"https://github.com/jeremyandrews/trovato\">repository</a>. Ci si aspetta che una pull request arrivi con dei test, che tenga puliti <code>cargo fmt</code> e <code>cargo clippy</code>, e che abbia una CI verde sul commit che viene effettivamente unito.</p>\n\n<p>Se state cambiando un comportamento, il test di regressione va allo strato dove stava il difetto, e la voce di changelog descrive la causa e non il sintomo. È lo standard che il progetto applica a sé stesso ed è lo standard a cui viene tenuto un contributo.</p>\n\n<h2>Come è costruito</h2>\n\n<p>Trovato è scritto con un aiuto sostanziale dell'intelligenza artificiale, sotto la mia direzione e la mia revisione. Lo dico qui per la stessa ragione per cui lo dice il README: avete diritto di sapere come è stato prodotto il codice che vi si chiede di eseguire, e scoprirlo dopo è peggio che sentirselo dire.</p>\n\n<p>Cosa vuol dire in concreto. Decido io cosa si costruisce e perché. Rivedo io quello che viene scritto. I test, i controlli in CI e il lavoro sulla sicurezza esistono perché un sistema scritto così ne ha più bisogno, non meno, e il modo onesto di rendere difendibile questa pratica è rendere le verifiche più severe di quanto sarebbero altrimenti. I contributi sono benvenuti sulla stessa base, dichiarati allo stesso modo.</p>\n\n<p>Cosa non vuol dire. Non è la pretesa che il codice sia migliore per questo, e non è una scusa per nulla che si riveli sbagliato. Un difetto è un difetto, chiunque o qualunque cosa lo abbia scritto.</p>\n\n<h2>Codice di condotta</h2>\n\n<p>Il progetto ne ha uno, e <a href=\"/learn/code-of-conduct\">lo faccio rispettare io</a>, perché non c'è nessun altro. Le segnalazioni vanno all'indirizzo indicato in quel documento. Preferisco sentire di un problema presto e sbagliarmi, che sentirne parlare tardi.</p>\n\n<h2>Segnalare un problema di sicurezza</h2>\n\n<p>Non aprite una issue pubblica per una vulnerabilità. Segnalatela in privato con <a href=\"https://github.com/jeremyandrews/trovato/security/advisories/new\">il modulo per gli advisory di GitHub</a>, che arriva a me e a nessun altro finché non è risolta.</p>\n\n<p>Confermerò di averla ricevuta. Vi dirò cosa penso che sia e se sono d'accordo. Quando c'è una correzione, il credito è vostro, a meno che preferiate di no. Quello che non posso promettere è un tempo di risposta: questo è il progetto di una persona sola e non fingerò che abbia un turno di reperibilità.</p>\n\n<h2>I commenti su questo sito</h2>\n\n<p>Per commentare serve un account, e un commento nuovo resta in attesa finché non viene letto. <a href=\"/comment-policy\">La politica sui commenti</a> dice cosa viene pubblicato, cosa viene trattenuto e chi decide.</p>\n\n<hr>\n\n<p><strong>In italiano:</strong> <a href=\"/it/why\">Perché Trovato</a> &middot; <a href=\"/it/get-started\">Come iniziare</a> &middot; <a href=\"/it/accessibility\">Accessibilità</a> &middot; <a href=\"/\" hreflang=\"en\" lang=\"en\">English</a></p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0003-7000-8000-000000000008": {
      "it": {
        "title": "Accessibilità",
        "fields": {
          "body": {
            "value": "<p>L'obiettivo è WCAG 2.2 AA. Questa pagina dice cosa viene effettivamente verificato, come, e cosa si sa che manca. È scritta come dovrebbe essere scritta una pagina di ingegneria, perché una dichiarazione che dice soltanto \"teniamo all'accessibilità\" non vi dà nulla su cui agire.</p>\n\n<h2>Cosa viene verificato automaticamente, a ogni build</h2>\n\n<ul>\n<li><strong>axe-core, su una pagina per famiglia di template, in entrambi gli schemi di colore.</strong> Diciotto rendering, verificati contro le regole WCAG 2.0, 2.1 e 2.2 di livello A e AA più le regole di buona pratica di axe. Niente è in lista d'eccezione: una violazione fa fallire la build, perché una violazione accettata è una violazione che nessuno riguarda più.</li>\n<li><strong>Il contrasto dei colori, separatamente.</strong> Ogni accostamento di colore usato dal sito è dichiarato nel foglio di stile e verificato dai test: testo, testo attenuato, collegamenti, bordi dei controlli e anelli di focus, su entrambe le superfici, in entrambi gli schemi, più sette colori di evidenziazione del codice.</li>\n<li><strong>Lo scorrimento orizzontale.</strong> Ogni pagina viene disegnata a 360 e a 1280 pixel di larghezza, in entrambi gli schemi, e la build fallisce se il documento scorre di lato.</li>\n<li><strong>Gli elementi non tematizzati.</strong> Lo stesso passaggio misura ogni elemento visibile e fallisce se qualcuno porta uno sfondo dello schema sbagliato.</li>\n<li><strong>Le richieste verso altri domini.</strong> Lo stesso passaggio registra ogni richiesta di ogni pagina e fallisce se una di esse esce da questo sito. Qui non si carica alcun font, script o immagine da altrove.</li>\n<li><strong>La struttura.</strong> Una scansione di ogni pagina raggiungibile dalla home verifica che ciascuna abbia un landmark principale, un collegamento per saltare al contenuto e una navigazione principale etichettata.</li>\n</ul>\n\n<h2>Cosa fa il sito di proposito</h2>\n\n<ul>\n<li>Ogni navigazione è etichettata, così uno screen reader le distingue invece di leggere quattro nav senza nome.</li>\n<li>La pagina corrente porta <code>aria-current=\"page\"</code>, non soltanto una classe: una classe è invisibile alle tecnologie assistive.</li>\n<li>Il menu per schermi stretti è un elemento di apertura, non un pulsante gestito da uno script. Si apre col clic o con la tastiera, annuncia da solo il proprio stato e funziona con JavaScript disattivato.</li>\n<li>La ricerca è un modulo che invia al server. La ricerca istantanea sovrapposta è un miglioramento; senza JavaScript il modulo restituisce comunque dei risultati.</li>\n<li>Il nome del sito è testo dentro il suo collegamento, non il testo alternativo di un'immagine.</li>\n<li>Un blocco di codice che scorre di lato può ricevere il focus da tastiera e ha un nome.</li>\n<li>Il focus è visibile ovunque, con un contorno che raggiunge la soglia di contrasto richiesta a un componente di interfaccia in entrambi gli schemi.</li>\n<li>Il movimento si riduce a una rotazione e a un passaggio del mouse, e si fermano entrambi sotto <code>prefers-reduced-motion</code>.</li>\n</ul>\n\n<h2>Cosa non è verificato, e cosa si sa che è sbagliato</h2>\n\n<ul>\n<li><strong>Su questo sito non è mai stato usato uno screen reader.</strong> Né VoiceOver, né NVDA, né JAWS. Il controllo automatico trova le etichette mancanti e il contrasto sbagliato; non dice se una pagina si capisce quando viene letta ad alta voce. Finché qualcuno non ci si siede, questa pagina lo dirà.</li>\n<li><strong>Il modulo di contatto non associa i suoi errori ai campi.</strong> Un invio fallito restituisce un elenco di cosa è andato storto sopra il modulo, e i campi non portano <code>aria-invalid</code> né <code>aria-describedby</code>. Quel modulo appartiene a un plugin del kernel di Trovato e non a questo sito, e questo sito non applica patch al kernel. È segnalato là.</li>\n<li><strong>Il controllo automatico vede un modulo a riposo, non un modulo appena fallito.</strong> Il problema qui sopra è stato trovato a mano, e potrebbero essercene altri dello stesso tipo.</li>\n<li><strong>La navigazione da tastiera è stata verificata in due punti, non ovunque.</strong></li>\n</ul>\n\n<h2>Segnalare un problema</h2>\n\n<p>Se qui qualcosa non funziona per voi, <a href=\"/contact\">il modulo di contatto</a> arriva a me. Ditemi cosa stavate usando e cosa è successo. Una segnalazione su una pagina inutilizzabile serve più di una segnalazione su una regola violata, e sono benvenute entrambe.</p>\n\n<p>Questa pagina è tenuta al passo con quello che la build verifica davvero. Ogni affermazione qui sopra sta o nella suite di test o nell'elenco di quello che non è verificato.</p>\n\n<hr>\n\n<p><strong>In italiano:</strong> <a href=\"/it/why\">Perché Trovato</a> &middot; <a href=\"/it/get-started\">Come iniziare</a> &middot; <a href=\"/it/community\">Comunità</a> &middot; <a href=\"/\" hreflang=\"en\" lang=\"en\">English</a></p>",
            "format": "filtered_html"
          }
        }
      }
    }
  }
