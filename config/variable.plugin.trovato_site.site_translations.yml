# The site's translations.
#
# The `plugin.trovato_site.` prefix is required: `variables_get` namespaces every
# key by the calling plugin's name, so a file without it is a file the plugin
# cannot see, and the call quietly returns the default instead.
#
# A map of item id, then language code, then the title and the fields that
# replace the default ones. `trovato_site`'s tap_cron copies it into the kernel's
# `item_translation` table on every tick, writing only what changed.
#
# It lives here rather than in the item because the kernel has no way to put a
# translation anywhere from configuration. `config import` stores a per-language
# field map verbatim in the item's own `fields`, where the item renderer looks for
# a `value` key, finds a language code instead, and renders nothing at all in
# every language. The two admin routes are registered GET-only and their
# templates are not in the image. There is no API endpoint. All three verified on
# v0.101.0 and re-verified on v0.102.0, and all three are in docs/LEDGER.md.
#
# The shape of `fields` has to match the shape the item stores: `{value, format}`.
# A mismatch renders nothing rather than failing, which is why there is a test.
#
# The front page is here, and on v0.101.0 it could not be. `routes/front.rs`
# rendered the configured front-page item without ever calling
# `apply_translation_overlay`, so a front page was always in the default language
# however the reader asked, and an Italian front page carried here would have
# been configuration nothing read. On v0.102.0 the front route applies the
# overlay, with the same field-access re-filter the item route does, and serves
# it at `/it/`.
#
# Its two fields are bare strings rather than `{value, format}` objects, because
# that is the shape the front-page item itself carries and the shape
# `elements/item--front_page.html` places: the front-page handler renders a field
# only when it carries a `value` key, and these two are meant to arrive
# untouched. A translation has to match the item it overlays, not the convention
# the other four entries here follow.
key: plugin.trovato_site.site_translations
value: {
    "0193b000-0003-7000-8000-000000000001": {
      "it": {
        "title": "Perché Trovato",
        "fields": {
          "body": {
            "value": "<p>Trovato è un sistema di gestione dei contenuti scritto in Rust. Prende il suo modello di contenuti da Drupal, che è scritto in PHP e quel modello lo ha azzeccato. In Drupal si aggiungono campi a un tipo di contenuto (un genere di contenuto, come un articolo) senza scrivere uno schema, si costruiscono elenchi con Views, il costruttore visuale di query di Drupal, invece che in SQL, e si estende il sistema con hook che il sistema chiama per voi. Il prezzo si paga nella memorizzazione. Drupal tiene ogni campo nella propria tabella, quindi un contenuto con venti campi è sparso su venti tabelle, e caricarlo dal database significa leggerle tutte.</p>\n\n<p>Trovato tiene il modello e cambia l&#8217;implementazione.</p>\n\n<h2>Un contenuto è una riga</h2>\n\n<p>Trovato chiama item un singolo contenuto e conserva ogni item come una riga, con i suoi campi in una sola colonna JSONB (il tipo JSON di PostgreSQL). Caricare un item con venti campi è una sola lettura, e i campi si aggiungono comunque dall&#8217;amministrazione senza cambiare lo schema.</p>\n\n<p>Trovato conserva anche ogni versione salvata di un item come revisione a cui potete tornare, e nessun codice aggiuntivo deve attivarla: ogni salvataggio dall&#8217;editor o dall&#8217;API degli item (le funzioni di Trovato per leggere e scrivere contenuti) ne scrive una. Ogni item porta anche uno stage (live, oppure uno definito dal sito, come una bozza), la base per preparare i contenuti prima che vadano online. Per ora nulla sposta un item da uno stage all&#8217;altro, quindi l&#8217;editor salva su live.</p>\n\n<h2>I plugin raggiungono solo ciò che dichiarano</h2>\n\n<p>I plugin aggiungono funzionalità a Trovato senza modificarne il nucleo, il kernel. Un plugin implementa funzioni con un nome preciso che il kernel chiama, come un modulo Drupal implementa gli hook. La differenza sta in ciò che può toccare. Un plugin è un modulo WebAssembly con un manifesto, un breve file che elenca ogni interfaccia host (un gruppo di funzioni del kernel, come l&#8217;accesso al database o il logging) che il plugin può usare. Il kernel collega ogni plugin a quelle interfacce e a cinque stub di sistema minimi che ogni plugin riceve, e a nient&#8217;altro. Un plugin che vuole il database elenca anche le tabelle di cui ha bisogno oltre alle proprie, e il kernel fa rispettare quell&#8217;elenco a ogni chiamata strutturata al database.</p>\n\n<figure>\n<img src=\"/static/art/diagram-sandbox.svg\" width=\"720\" height=\"400\" alt=\"Le due interfacce dichiarate di un plugin passano attraverso varchi nel muro del kernel; una non dichiarata si ferma al muro.\">\n<figcaption>Il manifesto, disegnato: le interfacce dichiarate passano il muro, e una non dichiarata non ha modo di attraversarlo.</figcaption>\n</figure>\n\n<p>Il kernel applica il manifesto ogni volta che carica un plugin. Una sandbox così è molto più difficile da aggiungere a un CMS in un secondo momento che da costruire fin dall&#8217;inizio. <a href=\"/it/\">La prima pagina</a> esamina un manifesto reale riga per riga, compreso l&#8217;unico flag che permette a un plugin di saltare il controllo delle tabelle.</p>\n\n<h2>Gli elenchi vengono da Gather</h2>\n\n<p>Gather costruisce gli elenchi di contenuti che un sito mostra, e fa il lavoro che in Drupal fa Views; se avete costruito una View, gran parte vi sembrerà familiare. Ogni elenco è una query di Gather: una definizione (tabella di partenza, filtri, ordinamenti, relazioni, presentazione) conservata come configurazione, quindi si sposta tra gli ambienti come un file rivisto.</p>\n\n<figure>\n<img src=\"/static/docs/images/part-03/gather-queries-admin.png\" width=\"1280\" height=\"2046\" alt=\"L&#8217;amministrazione delle query di Gather sul sito del tutorial: una tabella di query con etichette, tabelle di partenza, plugin proprietari e operazioni.\">\n<figcaption>Le query di Gather del sito del tutorial, in una sola tabella dell&#8217;amministrazione. Ogni riga è una definizione che potete aprire, esportare e rivedere.</figcaption>\n</figure>\n\n<h2>Cosa non è ancora fatto</h2>\n\n<p>Trovato lavora verso la 1.0. Il contratto dei plugin, ciò su cui un plugin e il kernel si accordano, è congelato, quindi un plugin scritto oggi continua a funzionare su ogni release prima della 1.0. Il CMS attorno a quel contratto non è finito:</p>\n\n<ul>\n<li><strong>Non esiste un registro dei plugin né un formato di pacchetto.</strong> Un plugin si compila da una directory e da lì si installa. Non c&#8217;è un posto dove pubblicarne uno, né un modo per installare quello di qualcun altro da un URL o da un indice.</li>\n<li><strong>Alcune impostazioni non hanno una schermata di amministrazione.</strong> Le impostazioni definite dai plugin, e il robots.txt personalizzato, si possono cambiare solo modificando i file di configurazione del sito e importandoli.</li>\n<li><strong>Le migrazioni vanno solo avanti.</strong> Non c&#8217;è rollback, quindi un aggiornamento fallito si ripristina da un backup. Fate un backup prima di ogni aggiornamento.</li>\n<li><strong>I contenuti non possono ancora passare da uno stage all&#8217;altro.</strong> Ogni item porta uno stage, ma nulla sposta i contenuti da uno stage a un altro.</li>\n<li><strong>La ricerca semantica confronta ogni vettore.</strong> La ricerca per significato, che ordina i contenuti confrontando vettori di embedding, non ha ancora un indice approssimato, quindi ogni query si confronta con ogni vettore conservato e rallenta man mano che il sito cresce.</li>\n</ul>\n\n<p><a href=\"/learn/known-issues\">Known issues</a> ne elenca altri, e <a href=\"/learn/roadmap\">la roadmap</a> dice cosa viene dopo.</p>\n\n<h2>Cos&#8217;è questo sito</h2>\n\n<p>Questo sito gira su una release pubblicata di Trovato, costruito come qualsiasi sito Trovato: un plugin, qualche template, un insieme di configurazione e i propri file statici, sovrapposti al kernel senza modificarlo. Dove al sito serviva qualcosa che il kernel non ha ancora, la lacuna e l&#8217;eventuale soluzione provvisoria sono scritte nel <a href=\"https://github.com/jeremyandrews/trovato-site\">repository del sito</a>.</p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0003-7000-8000-000000000004": {
      "it": {
        "title": "Come iniziare",
        "fields": {
          "body": {
            "value": "<p>Trovato è un sistema di gestione dei contenuti scritto in Rust, e ci sono due modi per cominciare: Docker vi dà un sito funzionante senza installare Rust, e compilare dai sorgenti è la strada giusta se intendete modificare Trovato stesso.</p>\n\n<h2>Con Docker</h2>\n\n<p>Questo avvia insieme PostgreSQL, Redis e Trovato:</p>\n\n<pre><code>git clone https://github.com/jeremyandrews/trovato\ncd trovato\ncp .env.example .env\ndocker compose --profile full up</code></pre>\n\n<p>Aprite <code>http://localhost:3001</code> e seguite l&#8217;installazione. Chiede un account amministratore e il nome del sito, e poi il sito è vostro.</p>\n\n<figure>\n<img src=\"/static/docs/images/part-01/installer-welcome.png\" width=\"1200\" height=\"800\" alt=\"Il primo passo dell&#8217;installazione, che conferma che PostgreSQL e Redis sono collegati e che le migrazioni sono state eseguite, con un pulsante per continuare.\">\n<figcaption>La prima schermata dell&#8217;installazione, dal <a href=\"/learn/tutorial-01-hello-trovato\">tutorial</a>: i vostri database, controllati, prima che vi chieda qualsiasi cosa.</figcaption>\n</figure>\n\n<p>Il profilo <code>full</code> è quello che avvia il contenitore di Trovato. Senza, <code>docker compose up</code> avvia solo PostgreSQL e Redis, che è quello che serve quando fate girare il server direttamente sulla porta 3000.</p>\n\n<h2>Dai sorgenti</h2>\n\n<p>Servono Rust, PostgreSQL 15 o successivo e Redis 7 o successivo; la CI esegue i test su PostgreSQL 16. La toolchain è fissata in <code>rust-toolchain.toml</code>, quindi rustup scarica la versione giusta per voi. Clonate il repository come nei passi per Docker, poi eseguite:</p>\n\n<pre><code>docker compose up -d          # PostgreSQL e Redis\ncargo build --release\ncp .env.example .env\ncargo run --release --bin trovato</code></pre>\n\n<p>Le migrazioni girano all&#8217;avvio. Aprite <code>http://localhost:3000</code> e seguite l&#8217;installazione. <a href=\"/learn/install\">Installing Trovato</a> ha i dettagli, compreso come far girare i database senza contenitori.</p>\n\n<h2>E poi</h2>\n\n<p><a href=\"/learn/building-your-first-site\">Building your first site</a> percorre pagine, blog e navigazione su un&#8217;installazione nuova. <a href=\"/learn/tutorial-01-hello-trovato\">Il tutorial</a> va oltre, con nove parti che costruiscono un sito vero partendo da un database vuoto. Le ultime tre trattano traduzioni e un&#8217;API REST, la preparazione alla produzione (cache, archiviazione dei file, metriche e test), e AI e ricerca. La parte 2 non è aggiornata perché Ritrovo, il sito che il tutorial costruisce, si è spostato in un repository proprio; <a href=\"/learn/known-issues\">Known issues</a> spiega.</p>\n\n<h2>Prima di farci affidamento</h2>\n\n<p>Trovato non è ancora alla 1.0. Il contratto dei plugin, ciò su cui i plugin e il nucleo di Trovato si accordano, è congelato, quindi un plugin che scrivete ora continua a funzionare su ogni release prima della 1.0. Il resto è ancora in movimento. Non esiste un registro dei plugin, alcune impostazioni si possono cambiare solo importando YAML, e le migrazioni vanno solo avanti, quindi un aggiornamento fallito si recupera da un backup.</p>\n\n<p><a href=\"/learn/known-issues\">Known issues</a> elenca ciò che manca, e <a href=\"/it/why\">Perché Trovato</a> spiega il progetto. Leggeteli entrambi prima di metterci sopra un sito a cui tenete.</p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0003-7000-8000-000000000007": {
      "it": {
        "title": "Comunità",
        "fields": {
          "body": {
            "value": "<p>Trovato, un sistema di gestione dei contenuti scritto in Rust, è open source, e siete benvenuti se volete aiutare a costruirlo.</p>\n\n<h2>Contribuire</h2>\n\n<p><a href=\"/learn/contributing\">CONTRIBUTING.md</a> ha i dettagli; questa è la versione breve. Issue e pull request vanno al <a href=\"https://github.com/jeremyandrews/trovato\">repository</a>. Aprite una issue prima di cominciare qualsiasi cosa più grande della correzione di un bug. Eseguite <code>./scripts/pre-commit-check.sh</code> prima di inviare. Se toccate una fixture di test condivisa, eseguite anche l&#8217;intero <code>cargo test --all</code> su un solo database, che scopre interferenze tra i test che i tre shard della CI possono non vedere.</p>\n\n<h2>Come è costruito Trovato</h2>\n\n<p>Trovato è scritto con un aiuto sostanziale dell&#8217;AI. Il maintainer decide che cosa si costruisce e perché, e rivede ciò che viene scritto.</p>\n\n<p>Poiché tanta parte del codice è scritta così, i test e i controlli della CI sono più severi di quanto sarebbero altrimenti. Gli audit di sicurezza finora sono stati fatti internamente, e un audit esterno non c&#8217;è ancora stato; <a href=\"/learn/known-issues\">Known issues</a> ha i dettagli. I contributi scritti con l&#8217;aiuto dell&#8217;AI sono benvenuti e valutati con lo stesso metro di tutti gli altri, e CONTRIBUTING.md spiega che cosa si chiede loro.</p>\n\n<p>Essere scritto con l&#8217;AI non significa che il codice sia migliore per questo, e non giustifica un bug: un bug è un bug, chiunque o qualunque cosa lo abbia scritto.</p>\n\n<h2>Codice di condotta</h2>\n\n<p>Trovato ha un <a href=\"/learn/code-of-conduct\">codice di condotta</a>, e il maintainer lo fa rispettare. Le segnalazioni vanno all&#8217;indirizzo indicato in quel documento. Se non siete sicuri che qualcosa valga la pena di essere segnalato, segnalatelo.</p>\n\n<h2>Segnalare un problema di sicurezza</h2>\n\n<p>Per favore non aprite una issue pubblica per una vulnerabilità. Segnalatela in privato attraverso il <a href=\"https://github.com/jeremyandrews/trovato/security/advisories/new\">modulo per gli avvisi di sicurezza di GitHub</a>, che resta privato tra voi e il maintainer finché l&#8217;avviso non viene pubblicato.</p>\n\n<p>Riceverete una conferma e una valutazione della segnalazione, e quando ci sarà una correzione riceverete il merito, a meno che preferiate di no. Non c&#8217;è un team di sicurezza né un tempo di risposta garantito.</p>\n\n<h2>Commenti su questo sito</h2>\n\n<p>Per commentare serve un account, e i commenti dei nuovi account vengono trattenuti per la revisione. <a href=\"/comment-policy\">La politica sui commenti</a> spiega come vengono moderati. Per tutto il resto, usate il <a href=\"/contact\">modulo di contatto</a>.</p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0003-7000-8000-000000000008": {
      "it": {
        "title": "Accessibilità",
        "fields": {
          "body": {
            "value": "<p>Questo sito punta al livello AA delle WCAG 2.2.</p>\n\n<h2>Controllato automaticamente a ogni build</h2>\n\n<ul>\n<li><strong>axe-core su una pagina di ogni tipo, in entrambi gli schemi di colore.</strong> La prima pagina, una pagina di contenuto, entrambi gli elenchi, l&#8217;indice della documentazione, una pagina di documentazione, il modulo di contatto, la pagina di ricerca, la pagina di accesso e la prima pagina in italiano: venti rendering, controllati con le regole A e AA delle WCAG 2.0 e 2.1, le regole AA delle WCAG 2.2 e le regole di buona pratica di axe. Non c&#8217;è una lista di eccezioni, e qualsiasi violazione fa fallire la build.</li>\n<li><strong>Contrasto dei colori.</strong> La suite di test controlla gli abbinamenti di colore che il sito dichiara nel suo foglio di stile, in entrambi gli schemi: testo, testo attenuato, link, bordi dei controlli e anelli di focus contro lo sfondo della pagina e contro lo sfondo incassato, e il testo dei pulsanti contro il loro riempimento. Controlla anche sette colori dell&#8217;evidenziazione della sintassi contro lo sfondo dei blocchi di codice. Gira senza browser, quindi un problema di contrasto emerge in <code>cargo test</code>.</li>\n<li><strong>Scorrimento orizzontale.</strong> Ogni pagina dell&#8217;insieme controllato viene resa a 360 e a 1280 pixel di larghezza, in entrambi gli schemi, e la build fallisce se una pagina scorre di lato a una delle due larghezze.</li>\n<li><strong>Elementi senza tema.</strong> Lo stesso passaggio fallisce se un elemento visibile ha uno sfondo dello schema di colore sbagliato, il che scopre i controlli lasciati con l&#8217;aspetto predefinito del browser.</li>\n<li><strong>Richieste verso altri siti.</strong> Lo stesso passaggio registra ogni richiesta fatta da ciascuna pagina e fallisce se una esce da questo sito, quindi ogni font, script e immagine di quelle pagine viene da qui.</li>\n<li><strong>Struttura.</strong> Un crawl di ogni pagina raggiungibile dalla prima pagina controlla che ognuna abbia un landmark principale, un link per saltare al contenuto e una navigazione principale con un&#8217;etichetta, e che nessuna pagina sia tornata come la pagina grezza di ripiego che Trovato (il sistema di gestione dei contenuti su cui gira questo sito) serve quando un template fallisce.</li>\n</ul>\n\n<h2>Integrato di proposito</h2>\n\n<ul>\n<li>Ogni area di navigazione ha la propria etichetta, ed è così che uno screen reader le distingue. I due moduli di ricerca della pagina di ricerca hanno etichette separate per lo stesso motivo.</li>\n<li>La pagina corrente è indicata con <code>aria-current=\"page\"</code>, così uno screen reader annuncia in quale pagina vi trovate.</li>\n<li>Il menu per gli schermi stretti è un elemento di apertura nativo. Si apre con un clic o con la tastiera, annuncia se è aperto e funziona senza JavaScript.</li>\n<li>La ricerca è un modulo che viene inviato al server. I risultati istantanei si aggiungono sopra, e senza JavaScript il modulo funziona comunque.</li>\n<li>Il nome del sito nell&#8217;intestazione è testo dentro il link, non il testo alternativo di un&#8217;immagine, quindi il link mantiene il suo nome in entrambi gli schemi di colore.</li>\n<li>Un blocco di codice nella documentazione copiata dal repository di Trovato riceve il focus da tastiera e ha un nome, quindi potete scorrerlo senza mouse. I blocchi di codice non sono landmark, perché alcune pagine di documentazione ne hanno decine.</li>\n<li>Il focus è sempre visibile, con un contorno che rispetta il requisito di contrasto per i componenti dell&#8217;interfaccia in entrambi gli schemi di colore.</li>\n<li>Il movimento è poco, e niente si ripete in ciclo. La prima pagina riproduce un&#8217;animazione d&#8217;ingresso, le schede si sollevano al passaggio del mouse, e il cambio di pagina sfuma dove il browser lo supporta. Con il movimento ridotto attivo, l&#8217;ingresso e la dissolvenza sono spenti, e una scheda si sposta ancora leggermente al passaggio del mouse ma senza animazione.</li>\n<li>Le immagini sono o disegni SVG del sito stesso, che seguono il vostro schema di colore, o schermate reali del tutorial. Ogni schermata ha un testo alternativo che descrive ciò che mostra, e un disegno che decora soltanto una pagina è nascosto agli screen reader. Tutte sono servite da questo sito.</li>\n<li>Le parole lunghe e gli URL vanno a capo, e la pagina non si allarga mai. I blocchi di codice non vanno a capo; una riga lunga scorre dentro il riquadro del blocco.</li>\n</ul>\n\n<h2>Non ancora controllato, e problemi noti</h2>\n\n<ul>\n<li><strong>Nessuno ha ancora provato questo sito con uno screen reader</strong>, che sia VoiceOver, NVDA o JAWS. I controlli automatici trovano un&#8217;etichetta mancante o un contrasto scarso, ma non possono dire se una pagina ha senso letta ad alta voce.</li>\n<li><strong>Il modulo di contatto non collega i suoi errori ai suoi campi.</strong> Dopo un invio fallito, sopra il modulo compare un elenco di errori, ma i campi non hanno <code>aria-invalid</code> né <code>aria-describedby</code>, quindi uno screen reader annuncia un problema senza dire quale campo lo ha. Il modulo viene da un plugin distribuito con Trovato, quindi la correzione spetta a Trovato stesso.</li>\n<li><strong>I controlli automatici vedono i moduli prima dell&#8217;invio, non dopo.</strong> Il passaggio di accessibilità carica ogni pagina; non invia moduli. Il problema qui sopra è stato trovato a mano, e potrebbero essercene altri simili.</li>\n<li><strong>La navigazione da tastiera è controllata solo in parte.</strong> I blocchi di codice nelle pagine di documentazione sono generati in modo da ricevere il focus da tastiera, e un test unitario lo verifica; i blocchi di codice nelle pagine proprie di questo sito non ricevono ancora il focus. Nessun controllo automatico apre il menu da tastiera, e il sito non è ancora stato percorso interamente da tastiera.</li>\n</ul>\n\n<h2>Segnalare un problema</h2>\n\n<p>Se qualcosa qui non funziona per voi, usate il <a href=\"/contact\">modulo di contatto</a>. Dite che cosa stavate usando e che cosa è successo. Una segnalazione che una pagina è difficile da usare è più utile di una segnalazione che una regola è violata, ed entrambe sono benvenute.</p>",
            "format": "filtered_html"
          }
        }
      }
    },
    "0193b000-0000-7000-8000-000000000001": {
      "it": {
        "title": "trovato",
        "fields": {
          "body": "<p class=\"front-hero__lede\">Un sistema di gestione dei contenuti scritto in Rust.</p>\n<p class=\"front-hero__sub\">Definite i tipi di contenuto, cioè i generi di contenuto che il vostro sito ospita, come articoli, eventi o prodotti, e nell&#8217;amministrazione aggiungete i campi che servono a ciascuno, senza toccare lo schema del database. Pubblicate quei contenuti come pagine e li raccogliete in elenchi, come le ultime notizie o i prossimi eventi, mostrati come lista, griglia, tabella o con un vostro template. I plugin aggiungono funzionalità senza modificare il nucleo di Trovato, e ogni plugin dichiara che cosa può toccare. Gli elenchi, come la maggior parte delle altre impostazioni, sono conservati come configurazione che potete esportare in file e rivedere come si rivede il codice. Trovato è pensato per siti che devono sopravvivere a qualche restyling, gestiti da persone che vogliono rivedere ogni modifica alla configurazione del sito prima che arrivi in produzione.</p>\n",
          "proof": "<section class=\"front-features\" aria-label=\"Le tre caratteristiche\">\n  <a class=\"feature-card\" href=\"/it/why\">\n    <img src=\"/static/art/icon-onerow.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Un campo in più, lo schema resta</h2>\n    <p class=\"feature-card__text\">Ogni contenuto, che Trovato chiama item, è una riga con tutti i suoi campi in una sola colonna JSONB (il tipo JSON di PostgreSQL), quindi un campo nuovo non cambia nessuna tabella e caricare un item è una sola lettura.</p>\n    <span class=\"feature-card__more\">Perché una riga</span>\n  </a>\n  <a class=\"feature-card\" href=\"/rust\">\n    <img src=\"/static/art/icon-sandbox.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Plugin in una sandbox</h2>\n    <p class=\"feature-card__text\">Ogni plugin è un modulo WebAssembly che può chiamare solo le parti del kernel (il nucleo di Trovato) nominate nel suo manifesto, un breve file distribuito con il plugin.</p>\n    <span class=\"feature-card__more\">Rust e il contratto dei plugin</span>\n  </a>\n  <a class=\"feature-card\" href=\"/learn/design-query-engine\">\n    <img src=\"/static/art/icon-gather.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Elenchi che si possono rivedere</h2>\n    <p class=\"feature-card__text\">Gather, il motore di query di Trovato, costruisce gli elenchi di contenuti del sito e conserva ogni query come configurazione che potete esportare, rivedere e importare nell&#8217;ambiente successivo senza modifiche.</p>\n    <span class=\"feature-card__more\">Come funziona Gather</span>\n  </a>\n</section>\n\n<section class=\"front-gallery\" aria-labelledby=\"front-gallery-heading\">\n  <h2 id=\"front-gallery-heading\">Com&#8217;è fatto</h2>\n  <p class=\"front-gallery__blurb\">Sono schermate reali di Ritrovo, l&#8217;elenco di conferenze che <a href=\"/learn/tutorial-01-hello-trovato\">il tutorial</a> costruisce in nove parti, partendo da un database vuoto.</p>\n  <div class=\"front-gallery__grid\">\n    <figure>\n      <a href=\"/static/docs/images/part-04/admin-content-list.png\">\n      <img src=\"/static/docs/images/part-04/admin-content-list.png\" width=\"1280\" height=\"10569\"\n           alt=\"L&#8217;elenco dei contenuti nell&#8217;amministrazione di Trovato: una barra laterale scura, i filtri e una tabella di item con le colonne tipo, autore, stato e aggiornamento.\">\n      </a>\n      <figcaption>L&#8217;elenco dei contenuti: ogni item, il suo stato, la sua data.</figcaption>\n    </figure>\n    <figure>\n      <a href=\"/static/docs/images/part-03/gather-queries-admin.png\">\n      <img src=\"/static/docs/images/part-03/gather-queries-admin.png\" width=\"1280\" height=\"2046\"\n           alt=\"L&#8217;amministrazione delle query di Gather: una tabella di query con etichette, tabelle di partenza, plugin proprietari e operazioni.\">\n      </a>\n      <figcaption>Gather: ogni query definita sul sito di Ritrovo, che venga dal kernel e dai suoi plugin o da Ritrovo stesso. Ognuna è una definizione che potete aprire.</figcaption>\n    </figure>\n    <figure>\n      <a href=\"/static/docs/images/part-03/front-page.png\">\n      <img src=\"/static/docs/images/part-03/front-page.png\" width=\"1280\" height=\"1586\"\n           alt=\"La prima pagina di Ritrovo con il suo tema: un&#8217;intestazione che dice Discover Tech Conferences Worldwide, con riquadri di statistiche sotto.\">\n      </a>\n      <figcaption>Ritrovo stesso, con il suo tema, alla terza parte.</figcaption>\n    </figure>\n  </div>\n</section>\n\n<section class=\"proof proof-split\" aria-labelledby=\"proof-sandbox\">\n  <h2 class=\"proof__title\" id=\"proof-sandbox\">Un plugin raggiunge solo ciò che dichiara</h2>\n  <div class=\"proof__copy\">\n    <p>Il blog, il modulo di contatto e l&#8217;elenco degli articoli recenti in fondo a questa pagina vengono tutti da plugin. Un plugin può essere codice che non avete scritto voi, quindi Trovato limita ciò che ciascuno può toccare.</p>\n    <p>Un plugin è un modulo WebAssembly con un manifesto. Quando il kernel carica un plugin, collega il modulo alle interfacce host che il suo manifesto nomina (gruppi di funzioni del kernel, come l&#8217;accesso al database o il logging). Ogni plugin riceve anche cinque stub minimi di WASI, l&#8217;interfaccia di sistema standard di WebAssembly. Nient&#8217;altro viene collegato. Un modulo che importa qualsiasi altra interfaccia del kernel viene rifiutato al caricamento, quindi se un plugin possa usare un&#8217;interfaccia si decide una volta sola, prima che giri.</p>\n    <p>Queste sono le capacità del plugin che genera l&#8217;elenco in fondo a questa pagina:</p>\n    <figure class=\"code\">\n      <figcaption class=\"code__lang\">toml</figcaption>\n      <pre class=\"code__body\"><code>[capabilities]\nhost_interfaces = [\"db\", \"logging\", \"variables\"]\ndb_tables = [\"item\", \"url_alias\", \"item_translation\"]\nraw_sql = true</code></pre>\n    </figure>\n    <p><code>host_interfaces</code> si sceglie da un elenco fisso di tredici. Un manifesto che nomina qualsiasi altra cosa viene rifiutato quando viene letto, e solo una release del kernel può allungare l&#8217;elenco. <code>db_tables</code> elenca le tabelle di cui il plugin ha bisogno oltre alle proprie; le tabelle create dalle sue migrazioni gli sono disponibili senza elencarle.</p>\n    <p><code>raw_sql</code> è la via di fuga. Permette a un plugin di eseguire SQL che il kernel non confronta con quell&#8217;elenco di tabelle. Questo plugin la usa per l&#8217;elenco qui sotto, che mescola due tipi di contenuto in un unico elenco ordinato e collega ogni articolo al suo alias URL, il percorso leggibile a cui viene servito. Ognuna delle chiamate strutturate al database del kernel tocca una sola tabella, quindi nessuna di esse può costruire quell&#8217;elenco. Di fatto ogni query di questo plugin è SQL diretto, quindi la sua riga <code>db_tables</code> registra solo le tabelle che intende toccare, e il kernel non controlla nessuna di quelle tabelle. Il flag è una riga in un file rivisto, quindi è facile trovare ogni plugin che lo usa.</p>\n    <p>La sandbox ha qualche altro limite. Non c&#8217;è filesystem. Il runtime fornisce cinque stub WASI, e l&#8217;unico che tocca un descrittore di file è <code>fd_write</code>, che restituisce <code>ENOSYS</code> per ogni descrittore, compreso lo standard output. Un modulo che importa qualsiasi altra funzione sui file, come <code>path_open</code> o <code>fd_read</code>, non può essere istanziato. Un plugin non può raggiungere la memoria di un altro. Un plugin che non nomina interfacce non riceve dal kernel nulla oltre a quegli stub, e può comunque fare aritmetica. <a href=\"/blog/what-a-plugin-may-reach\">What a plugin may reach</a> passa in rassegna tutte e tredici le interfacce.</p>\n  </div>\n  <div class=\"proof__art\">\n    <img src=\"/static/art/diagram-sandbox.svg\" alt=\"\" aria-hidden=\"true\" width=\"720\" height=\"400\">\n  </div>\n</section>\n\n<section class=\"proof proof-split proof-flip\" aria-labelledby=\"proof-storage\">\n  <h2 class=\"proof__title\" id=\"proof-storage\">Un contenuto è una riga</h2>\n  <div class=\"proof__copy\">\n    <p>Aggiungete campi a un tipo di contenuto dall&#8217;amministrazione, e lo schema del database non cambia. Funziona perché un item è una riga, e i suoi campi stanno in una sola colonna JSONB su quella riga. Un tipo di contenuto con venti campi sono venti chiavi in quella colonna; lo schema non descrive mai i campi. Caricare un item è una sola lettura:</p>\n    <figure class=\"code\">\n      <figcaption class=\"code__lang\">sql</figcaption>\n      <pre class=\"code__body\"><code>SELECT title, fields FROM item WHERE id = $1;</code></pre>\n    </figure>\n    <p>Trovato conserva le versioni precedenti dei contenuti, e dà a ogni item uno stage, la base per preparare le modifiche lontano dagli occhi dei lettori prima che vadano online. Ogni salvataggio dall&#8217;editor o dall&#8217;API degli item (le funzioni del kernel per leggere e scrivere contenuti) scrive una revisione, una versione salvata a cui potete tornare. La cronologia c&#8217;è, che qualcuno abbia pensato di attivarla o no. Due tipi di scrittura la saltano: l&#8217;importazione della configurazione, che carica contenuti da file di configurazione, e la scrittura di un plugin nella tabella degli item attraverso l&#8217;interfaccia del database invece che attraverso l&#8217;API degli item. Uno stage è live, oppure uno definito dal sito, come una bozza o una campagna in preparazione. Per ora nulla sposta un item da uno stage all&#8217;altro, quindi i contenuti salvati dall&#8217;editor finiscono su live. Un plugin che salva attraverso l&#8217;API degli item riceve le revisioni dal kernel senza doverle gestire da sé. Trovato prende il suo modello di contenuti da Drupal, un sistema di gestione dei contenuti scritto in PHP, e <a href=\"/learn/design-terminology\">la pagina della terminologia</a> fa corrispondere i termini di Drupal a quelli di Trovato, compresi item e stage.</p>\n  </div>\n  <div class=\"proof__art\">\n    <img src=\"/static/art/diagram-onerow.svg\" alt=\"\" aria-hidden=\"true\" width=\"720\" height=\"400\">\n  </div>\n</section>\n\n<section class=\"proof proof-split\" aria-labelledby=\"proof-gather\">\n  <h2 class=\"proof__title\" id=\"proof-gather\">Gli elenchi sono configurazione</h2>\n  <div class=\"proof__copy\">\n    <p>Molte pagine di un sito sono elenchi di contenuti, e in Trovato quegli elenchi vengono da Gather. Una query è una tabella di partenza con i suoi filtri, ordinamenti, relazioni e presentazione, e Trovato conserva il tutto come configurazione, che si esporta in YAML. Così un elenco può stare in git accanto al vostro codice, e una sua modifica si rivede e si sposta tra gli ambienti come qualsiasi altra modifica di configurazione. Lo costruite con il costruttore visuale di query di Gather, nell&#8217;amministrazione, oppure modificate lo YAML a mano.</p>\n    <p>Gli elenchi delle notizie, del blog e della documentazione di questo sito sono query di Gather. Gli articoli recenti in fondo a questa pagina no: vengono dal plugin il cui manifesto è mostrato sopra.</p>\n  </div>\n  <div class=\"proof__art\">\n    <img src=\"/static/art/diagram-gather.svg\" alt=\"\" aria-hidden=\"true\" width=\"720\" height=\"400\">\n  </div>\n</section>\n"
        }
      }
    }
  }
