# The site's translations.
#
# The `plugin.trovato_site.` prefix is required: `variables_get` namespaces every
# key by the calling plugin's name, so a file without it is a file the plugin
# cannot see, and the call quietly returns the default instead.
#
# A map of item id, then language code, then the title and the fields that
# replace the default ones. `trovato_site`'s tap_cron copies it into the kernel
# through `item-api` on every tick, writing only what changed and removing what
# is no longer declared.
#
# It lives here because, through v0.102.0, the kernel had no way to put a
# translation anywhere from configuration: `config import` stored a per-language
# field map verbatim in the item's own `fields`, the two admin routes were
# registered GET-only, and there was no API endpoint (docs/LEDGER.md). v0.105.0
# adds an `item_translation` config entity, so these could move into
# `item_translation.<item>.<language>.yml` files; that move is not made here.
#
# The shape of `fields` has to match the shape the item stores: `{value, format}`.
# A mismatch renders nothing rather than failing, which is why there is a test.
#
# The front page is here, and on v0.101.0 it could not be. `routes/front.rs`
# rendered the configured front-page item without ever calling
# `apply_translation_overlay`, so a front page was always in the default language
# however the reader asked, and an Italian front page carried here would have
# been configuration nothing read. On v0.102.0 the front route applies the
# overlay, with the same field-access re-filter the item route does, and serves
# it at `/it/`.
#
# Its two fields are bare strings rather than `{value, format}` objects, because
# that is the shape the front-page item itself carries and the shape
# `elements/item--front_page.html` places: the front-page handler renders a field
# only when it carries a `value` key, and these two are meant to arrive
# untouched. A translation has to match the item it overlays, not the convention
# the other nine entries here follow.
key: plugin.trovato_site.site_translations
value: {
    "0193b000-0003-7000-8000-000000000001": {
        "it": {
            "title": "Perché Trovato",
            "fields": {
                "body": {
                    "value": "<p>Trovato è un sistema di gestione dei contenuti scritto in Rust. Usa un modello di contenuti ispirato a Drupal. Invece di creare una nuova tabella nel database per ogni nuovo campo, Trovato sceglie un modello di memorizzazione diverso.</p>\n\n<h2>Un contenuto è una riga</h2>\n\n<p>In Trovato un singolo contenuto si chiama <code>item</code>. L&#8217;intero item è conservato in una sola riga del database. I campi aggiuntivi sono conservati in una colonna JSONB (il tipo JSON di PostgreSQL). Per questo Trovato può caricare dal database anche gli item più complessi con una sola query su indice. E aggiungere o cambiare campi non richiede di cambiare lo schema.</p>\n\n<p>Ogni salvataggio conserva una revisione, quindi potete tornare a una versione precedente di un item. Sui tipi di contenuto scelti dal sito, un editor può anche salvare una bozza. I visitatori continuano a vedere la versione pubblicata finché la bozza non viene pubblicata.</p>\n\n<h2>I plugin raggiungono solo ciò che dichiarano</h2>\n\n<p>I plugin aggiungono funzionalità a Trovato senza modificarne il nucleo, il kernel. Un plugin implementa funzioni con un nome preciso che il kernel chiama in momenti stabiliti, per esempio quando mostra un item. Un plugin può toccare solo ciò che dichiara. Ogni plugin è un modulo WebAssembly con un manifesto: un breve file che elenca ogni interfaccia host (un gruppo di funzioni del kernel, come l&#8217;accesso al database o il logging) che il plugin può usare. Il kernel collega ogni plugin a quelle interfacce e a sei piccole funzioni di sistema che ogni plugin riceve, e a nient&#8217;altro. Un plugin che vuole il database elenca anche le tabelle di cui ha bisogno oltre alle proprie. Il kernel controlla quell&#8217;elenco a ogni chiamata strutturata al database.</p>\n\n<figure>\n<img src=\"/static/art/diagram-sandbox.svg\" width=\"720\" height=\"400\" alt=\"Le due interfacce dichiarate di un plugin passano attraverso varchi nel muro del kernel; una non dichiarata si ferma al muro.\">\n<figcaption>Il manifesto, disegnato: le interfacce dichiarate passano il muro, e una non dichiarata non ha modo di attraversarlo.</figcaption>\n</figure>\n\n<p>Il kernel applica il manifesto ogni volta che carica un plugin. Una sandbox così è molto più difficile da aggiungere a un CMS in un secondo momento che da costruire fin dall&#8217;inizio. <a href=\"/rust\">La pagina su Rust</a> mostra il manifesto di questo sito e cosa permette ogni riga.</p>\n\n<h2>Gli elenchi vengono da Gather</h2>\n\n<p>Gather costruisce gli elenchi di contenuti che un sito mostra. Fa il lavoro che in Drupal fa Views, quindi se avete costruito una View, gran parte vi sembrerà familiare. Ogni elenco è una query di Gather. La sua definizione (tabella di partenza, filtri, ordinamenti, relazioni, presentazione) è conservata come configurazione, quindi si sposta tra gli ambienti come un file che qualcuno ha rivisto.</p>\n\n<figure>\n<img src=\"/static/docs/images/part-03/gather-queries-admin.png\" width=\"1280\" height=\"2046\" alt=\"L&#8217;amministrazione delle query di Gather sul sito del tutorial: una tabella di query con etichette, tabelle di partenza, plugin proprietari e operazioni.\">\n<figcaption>Le query di Gather del sito del tutorial, in una sola tabella dell&#8217;amministrazione. Ogni riga è una definizione che potete aprire, esportare e rivedere.</figcaption>\n</figure>\n\n<h2>Cosa non è ancora fatto</h2>\n\n<p>Trovato lavora verso la 1.0. Il contratto dei plugin è ciò su cui un plugin e il kernel si accordano. È congelato, quindi un plugin scritto oggi continua a funzionare su ogni release prima della 1.0. Il CMS attorno a quel contratto non è finito:</p>\n\n<ul>\n<li><strong>Non esiste un registro dei plugin né un formato di pacchetto.</strong> Un plugin si compila da una directory e da lì si installa. Non c&#8217;è un posto dove pubblicarne uno, né un modo per installare quello di qualcun altro da un URL o da un indice.</li>\n<li><strong>Alcune impostazioni non hanno una schermata di amministrazione.</strong> Le impostazioni definite dai plugin, e il robots.txt personalizzato, si possono cambiare solo modificando i file di configurazione del sito e importandoli.</li>\n<li><strong>Le migrazioni vanno solo avanti.</strong> Non esistono migrazioni all&#8217;indietro, quindi tornare indietro significa far girare la release precedente sullo schema più recente. Una release precedente alla 0.105.0 non può farlo, quindi tornare a una di queste significa ripristinare un backup. Fate un backup prima di ogni aggiornamento.</li>\n<li><strong>La ricerca semantica confronta ogni vettore.</strong> La ricerca per significato, che ordina i contenuti confrontando vettori di embedding, non ha ancora un indice approssimato, quindi ogni query si confronta con ogni vettore conservato e rallenta man mano che il sito cresce.</li>\n</ul>\n\n<p><a href=\"/learn/known-issues\">Known issues</a> ne elenca altri, e <a href=\"/learn/roadmap\">la roadmap</a> dice cosa viene dopo.</p>\n\n<h2>Cos&#8217;è questo sito</h2>\n\n<p>Questo sito gira su una release pubblicata di Trovato ed è costruito come qualsiasi sito Trovato: un plugin, qualche template, un insieme di configurazione e i propri file statici, sovrapposti al kernel senza modificarlo. Dove al sito serviva qualcosa che il kernel non ha ancora, la lacuna e l&#8217;eventuale soluzione provvisoria sono scritte nel <a href=\"https://github.com/jeremyandrews/trovato-site\">repository del sito</a>.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000004": {
        "it": {
            "title": "Come iniziare",
            "fields": {
                "body": {
                    "value": "<p>Trovato è un sistema di gestione dei contenuti scritto in Rust, e ci sono due modi per cominciare: Docker vi dà un sito funzionante senza installare Rust, e compilare dai sorgenti è la strada giusta se intendete modificare Trovato stesso.</p>\n\n<h2>Con Docker</h2>\n\n<p>Questi quattro comandi avviano insieme PostgreSQL, Redis e Trovato:</p>\n\n<pre><code>git clone https://github.com/jeremyandrews/trovato\ncd trovato\ncp .env.example .env\ndocker compose --profile full up</code></pre>\n\n<p>Aprite <code>http://localhost:3001</code> e seguite l&#8217;installazione. Chiede un account amministratore e il nome del sito, e poi il sito è vostro.</p>\n\n<figure>\n<img src=\"/static/docs/images/part-01/installer-welcome.png\" width=\"1200\" height=\"800\" alt=\"Il primo passo dell&#8217;installazione, che conferma che PostgreSQL e Redis sono collegati e che le migrazioni sono state eseguite, con un pulsante per continuare.\">\n<figcaption>La prima schermata dell&#8217;installazione, dal <a href=\"/learn/tutorial-01-hello-trovato\">tutorial</a>: i vostri database, controllati, prima che vi chieda qualsiasi cosa.</figcaption>\n</figure>\n\n<p>Il profilo <code>full</code> è quello che avvia il contenitore di Trovato. Senza, <code>docker compose up</code> avvia solo PostgreSQL e Redis, che è quello che serve quando fate girare il server direttamente sulla porta 3000.</p>\n\n<h2>Dai sorgenti</h2>\n\n<p>Servono Rust, PostgreSQL 15 o successivo e Redis 7 o successivo; la CI esegue i test su PostgreSQL 16. La toolchain è fissata in <code>rust-toolchain.toml</code>, quindi rustup scarica la versione giusta per voi. Clonate il repository come nei passi per Docker, poi eseguite:</p>\n\n<pre><code>docker compose up -d          # PostgreSQL e Redis\ncargo build --release\ncp .env.example .env\ncargo run --release --bin trovato</code></pre>\n\n<p>Le migrazioni girano all&#8217;avvio. Aprite <code>http://localhost:3000</code> e seguite l&#8217;installazione. <a href=\"/learn/install\">Installing Trovato</a> ha i dettagli, compreso come far girare i database senza contenitori.</p>\n\n<h2>E poi</h2>\n\n<p><a href=\"/learn/building-your-first-site\">Building your first site</a> percorre pagine, blog e navigazione su un&#8217;installazione nuova. <a href=\"/learn/tutorial-01-hello-trovato\">Il tutorial</a> va oltre, con nove parti che costruiscono un sito vero partendo da un database vuoto. Le ultime tre trattano traduzioni e un&#8217;API REST, la preparazione alla produzione (cache, archiviazione dei file, metriche e test), e AI e ricerca. La parte 2 non è aggiornata perché Ritrovo, il sito che il tutorial costruisce, si è spostato in un repository proprio; <a href=\"/learn/known-issues\">Known issues</a> spiega.</p>\n\n<h2>Prima di farci affidamento</h2>\n\n<p>Trovato non è ancora alla 1.0. Il contratto dei plugin, ciò su cui i plugin e il nucleo di Trovato si accordano, è congelato, quindi un plugin che scrivete ora continua a funzionare su ogni release prima della 1.0. Il resto è ancora in movimento. Non esiste un registro dei plugin, alcune impostazioni si possono cambiare solo modificando i file di configurazione del sito e importandoli, e le migrazioni vanno solo avanti, quindi tornare indietro significa far girare la release precedente sullo schema più recente.</p>\n\n<p><a href=\"/learn/known-issues\">Known issues</a> elenca ciò che manca, e <a href=\"/it/why\">Perché Trovato</a> spiega il progetto. Leggeteli entrambi prima di metterci sopra un sito a cui tenete.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000007": {
        "it": {
            "title": "Comunità",
            "fields": {
                "body": {
                    "value": "<p>Trovato, un sistema di gestione dei contenuti scritto in Rust, è open source, e siete benvenuti se volete aiutare a costruirlo.</p>\n\n<h2>Contribuire</h2>\n\n<p><a href=\"/learn/contributing\">CONTRIBUTING.md</a> ha i dettagli; questa è la versione breve. Issue e pull request vanno al <a href=\"https://github.com/jeremyandrews/trovato\">repository</a>. Aprite una issue prima di cominciare qualsiasi cosa più grande della correzione di un bug. Eseguite <code>./scripts/pre-commit-check.sh</code> prima di inviare. Se toccate una fixture di test condivisa, eseguite anche l&#8217;intero <code>cargo test --all</code> su un solo database, che scopre interferenze tra i test che i tre shard della CI possono non vedere.</p>\n\n<h2>Come è costruito Trovato</h2>\n\n<p>Trovato è scritto con un aiuto sostanziale dell&#8217;AI. Il maintainer decide che cosa si costruisce e perché, e rivede ciò che viene scritto.</p>\n\n<p>Poiché tanta parte del codice è scritta così, i test e i controlli della CI sono più severi di quanto sarebbero altrimenti. Gli audit di sicurezza finora sono stati fatti internamente, e un audit esterno non c&#8217;è ancora stato; <a href=\"/learn/known-issues\">Known issues</a> ha i dettagli. I contributi scritti con l&#8217;aiuto dell&#8217;AI sono benvenuti e valutati con lo stesso metro di tutti gli altri, e CONTRIBUTING.md spiega che cosa si chiede loro.</p>\n\n<p>L&#8217;uso dell&#8217;AI non dice nulla sulla qualità del codice, e un bug conta allo stesso modo chiunque o qualunque cosa lo abbia scritto.</p>\n\n<h2>Codice di condotta</h2>\n\n<p>Trovato ha un <a href=\"/learn/code-of-conduct\">codice di condotta</a>, e il maintainer lo fa rispettare. Le segnalazioni vanno all&#8217;indirizzo indicato in quel documento. Se non siete sicuri che qualcosa valga la pena di essere segnalato, segnalatelo.</p>\n\n<h2>Segnalare un problema di sicurezza</h2>\n\n<p>Per favore non aprite una issue pubblica per una vulnerabilità. Segnalatela in privato tramite <a href=\"https://github.com/jeremyandrews/trovato/security/advisories/new\">la segnalazione privata di vulnerabilità di GitHub</a> sul repository di Trovato.</p>\n\n<p>Riceverete una conferma e una valutazione della segnalazione, e quando ci sarà una correzione verrete citati nei ringraziamenti, a meno che non preferiate di no. Non c&#8217;è un team di sicurezza né un tempo di risposta garantito.</p>\n\n<h2>Commenti su questo sito</h2>\n\n<p>Per commentare serve un account, e i commenti dei nuovi account vengono trattenuti per la revisione. <a href=\"/comment-policy\">La politica sui commenti</a> spiega come vengono moderati. Per tutto il resto, usate il <a href=\"/contact\">modulo di contatto</a>.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000008": {
        "it": {
            "title": "Accessibilità",
            "fields": {
                "body": {
                    "value": "<p>Questo sito punta al livello AA delle WCAG 2.2.</p>\n\n<h2>Controllato automaticamente a ogni build</h2>\n\n<ul>\n<li><strong>axe-core, uno strumento automatico di verifica dell&#8217;accessibilità, su una pagina di ogni tipo, in entrambi gli schemi di colore.</strong> La prima pagina, una pagina di contenuto, gli elenchi delle notizie e del blog, l&#8217;indice della documentazione, una pagina di documentazione, il modulo di contatto, la pagina di ricerca, la pagina di accesso e la prima pagina in italiano: venti rendering, controllati con le regole A e AA delle WCAG 2.0 e 2.1, le regole AA delle WCAG 2.2 e le regole di buona pratica di axe. Non c&#8217;è una lista di eccezioni, e qualsiasi violazione fa fallire la build.</li>\n<li><strong>Contrasto dei colori.</strong> La suite di test controlla gli abbinamenti di colore che il sito dichiara nel suo foglio di stile, in entrambi gli schemi: testo, testo attenuato, link, bordi dei controlli e anelli di focus contro lo sfondo della pagina e contro lo sfondo incassato, e il testo dei pulsanti contro il loro riempimento. Controlla anche sette colori dell&#8217;evidenziazione della sintassi contro lo sfondo dei blocchi di codice. Il test del contrasto gira senza browser, quindi un problema emerge in <code>cargo test</code>.</li>\n<li><strong>Scorrimento orizzontale.</strong> Ogni pagina dell&#8217;insieme controllato viene resa a 360 e a 1280 pixel di larghezza, in entrambi gli schemi, e la build fallisce se una pagina scorre di lato a una delle due larghezze.</li>\n<li><strong>Elementi senza tema.</strong> Lo stesso passaggio fallisce se un elemento visibile ha uno sfondo dello schema di colore sbagliato, il che scopre i controlli lasciati con l&#8217;aspetto predefinito del browser.</li>\n<li><strong>Richieste verso altri siti.</strong> Lo stesso passaggio registra ogni richiesta fatta da ciascuna pagina, compresi font, script e immagini, e fallisce se una di queste esce da questo sito.</li>\n<li><strong>Struttura.</strong> Un crawl di ogni pagina raggiungibile dalla prima pagina controlla che ognuna abbia un landmark principale, un link per saltare al contenuto e una navigazione principale con un&#8217;etichetta, e che nessuna pagina sia tornata come la pagina grezza di ripiego che Trovato (il sistema di gestione dei contenuti su cui gira questo sito) serve quando un template fallisce.</li>\n</ul>\n\n<h2>Integrato di proposito</h2>\n\n<ul>\n<li>Ogni area di navigazione ha la propria etichetta, ed è così che uno screen reader le distingue. I due moduli di ricerca della pagina di ricerca hanno etichette separate per lo stesso motivo. Con JavaScript attivo, la ricerca nel browser prende il posto del secondo modulo, e la sua casella di ricerca ha come nome solo il testo segnaposto.</li>\n<li>La pagina corrente è indicata con <code>aria-current=\"page\"</code>, così uno screen reader annuncia in quale pagina vi trovate.</li>\n<li>Il menu per gli schermi stretti è un elemento HTML nativo a scomparsa. Si apre con un clic o con la tastiera, annuncia se è aperto e funziona senza JavaScript.</li>\n<li>La ricerca funziona con JavaScript attivo o disattivato. Con JavaScript disattivato, il modulo di ricerca invia la vostra ricerca al server, che restituisce una pagina di risultati.</li>\n<li>Il nome del sito nell&#8217;intestazione è testo dentro il link, non il testo alternativo di un&#8217;immagine, quindi il link mantiene il suo nome in entrambi gli schemi di colore.</li>\n<li>Un blocco di codice nella documentazione copiata dal repository di Trovato riceve il focus da tastiera e ha un nome, quindi potete scorrerlo senza mouse. I blocchi di codice non sono landmark, perché alcune pagine di documentazione ne hanno decine.</li>\n<li>Il focus è sempre visibile, con un contorno che rispetta il requisito di contrasto per i componenti dell&#8217;interfaccia in entrambi gli schemi di colore.</li>\n<li>Il movimento è poco, e niente si ripete in ciclo. La prima pagina riproduce un&#8217;animazione d&#8217;ingresso, le schede si sollevano al passaggio del mouse, e il cambio di pagina sfuma dove il browser lo supporta. Con il movimento ridotto attivo, l&#8217;ingresso e la dissolvenza sono spenti, e una scheda si sposta ancora leggermente al passaggio del mouse ma senza animazione.</li>\n<li>Le immagini sono o disegni SVG del sito stesso, che seguono il vostro schema di colore, o schermate reali del tutorial di Trovato. Ogni schermata ha un testo alternativo che descrive ciò che mostra, e un disegno che decora soltanto una pagina è nascosto agli screen reader. Tutte sono servite da questo sito.</li>\n<li>Le parole lunghe e gli URL vanno a capo, e la pagina non si allarga mai. I blocchi di codice non vanno a capo; una riga lunga scorre dentro il riquadro del blocco.</li>\n</ul>\n\n<h2>Non ancora controllato, e problemi noti</h2>\n\n<ul>\n<li><strong>Nessuno ha ancora provato questo sito con uno screen reader</strong>, che sia VoiceOver, NVDA o JAWS. I controlli automatici trovano un&#8217;etichetta mancante o un contrasto scarso, ma non possono dire se una pagina ha senso letta ad alta voce.</li>\n<li><strong>Il modulo di contatto non collega i suoi errori ai suoi campi.</strong> Dopo un invio fallito, sopra il modulo compare un elenco di errori, ma i campi non hanno <code>aria-invalid</code> né <code>aria-describedby</code>, quindi uno screen reader annuncia un problema senza dire quale campo lo ha. Il modulo viene da un plugin distribuito con Trovato, quindi la correzione spetta a Trovato stesso.</li>\n<li><strong>Nessun controllo automatico di accessibilità invia un modulo.</strong> Il passaggio di accessibilità carica ogni pagina e si ferma lì, quindi gli errori che compaiono solo dopo un invio non vengono controllati. Il problema qui sopra è stato trovato a mano, e potrebbero essercene altri simili.</li>\n<li><strong>La navigazione da tastiera è controllata solo in parte.</strong> I blocchi di codice nelle pagine di documentazione sono generati in modo da ricevere il focus da tastiera, e un test unitario lo verifica; i blocchi di codice nelle pagine proprie di questo sito non ricevono ancora il focus. Nessun controllo automatico apre il menu da tastiera, e il sito non è ancora stato percorso interamente da tastiera.</li>\n</ul>\n\n<h2>Segnalare un problema</h2>\n\n<p>Se qualcosa qui non funziona per voi, usate il <a href=\"/contact\">modulo di contatto</a>. Dite che cosa stavate usando e che cosa è successo. Una segnalazione che una pagina è difficile da usare è più utile di una segnalazione che una regola è violata, ed entrambe sono benvenute.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000011": {
        "it": {
            "title": "Veloce a ogni scala",
            "fields": {
                "body": {
                    "value": "<p>Trovato è scritto in Rust dall&#8217;inizio alla fine: il kernel, i plugin e Gather, il motore di query che costruisce i vostri elenchi, sono tutti Rust.</p>\n\n<p>Ogni contenuto, chiamato item, è una riga in PostgreSQL, con tutti i campi in un&#8217;unica colonna JSONB. Caricare un item per una pagina è una sola lettura, quali che siano i suoi campi:</p>\n\n<pre><code>SELECT title, fields FROM item WHERE id = $1;</code></pre>\n\n<p>Aggiungere un campo non cambia nulla nel modo in cui funziona quella lettura.</p>\n\n<p>I plugin girano compilati in WebAssembly dentro il kernel invece che come servizi separati, quindi una pagina costruita da più plugin si genera comunque in un solo processo, con una sola richiesta. Il progetto regge a dieci pagine, e regge a dieci milioni.</p>\n\n<p><a href=\"/learn/design-architecture\">L&#8217;architettura</a> approfondisce il resto.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000012": {
        "it": {
            "title": "I vostri dati, decidete voi",
            "fields": {
                "body": {
                    "value": "<p>Chiunque abbia un account può scaricare una copia di tutto ciò che Trovato conserva su di lui: profilo, ruoli, ogni item e commento scritto, e quali dispositivi hanno una sessione aperta, in un unico file JSON, disponibile una volta all&#8217;ora. Il file dice anche che cosa non contiene: nessuna traccia di ciò che avete solo letto, e nessun token di sessione che permetterebbe a qualcun altro di riusarla.</p>\n\n<p>Cancellare un account è altrettanto diretto. Confermate chi siete, leggete esattamente che cosa accadrà, e l&#8217;account sparisce: ogni sessione chiusa ovunque, ogni passkey e token API rimosso, un&#8217;email di commiato inviata finché c&#8217;è ancora un indirizzo a cui mandarla. Ciò che avete scritto resta, attribuito a nessuno, così che una conversazione di cui avete fatto parte non resti con dei buchi. L&#8217;ultimo amministratore di un sito non può cancellare il proprio account e lasciare il sito senza nessuno al comando.</p>\n\n<p><a href=\"/it/get-started\">Come iniziare</a> con un sito tutto vostro.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000013": {
        "it": {
            "title": "Ogni lingua",
            "fields": {
                "body": {
                    "value": "<p>Trovato serve ogni pagina, menu ed elenco nelle lingue che il vostro sito pubblica. Una traduzione è una sovrapposizione per lingua: il titolo e i campi che scrivete per una pagina in una seconda lingua stanno accanto all&#8217;originale, e chi legge riceve la versione nella lingua richiesta, con l&#8217;originale come ripiego per tutto ciò che non è ancora tradotto.</p>\n\n<p>I menu seguono la stessa regola: un link nella navigazione principale o nel footer porta alla pagina tradotta quando esiste, e all&#8217;originale altrimenti, così chi legge non finisce mai sulla pagina giusta nella lingua sbagliata. Gli elenchi costruiti con Gather, il motore di query dietro pagine come le notizie e il blog di questo sito, portano la stessa sovrapposizione, quindi anche un elenco filtrato e ordinato si legge nella lingua di chi lo guarda.</p>\n\n<p>Questa pagina e l&#8217;intera prima pagina sono disponibili in inglese e in italiano. <a href=\"/learn/tutorial-07-going-global\">Il tutorial sulle traduzioni</a> mostra come aggiungerne una terza.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000014": {
        "it": {
            "title": "Un&#8217;IA che aspetta il vostro sì",
            "fields": {
                "body": {
                    "value": "<p>Le funzioni di IA di Trovato girano su un fornitore che scegliete voi: OpenAI, Anthropic o un altro servizio, configurato da un amministratore con una chiave API letta dall&#8217;ambiente del server stesso, mai conservata nel database né mostrata a schermo. Impostate un budget mensile di token per ciascun fornitore, e il kernel lo fa rispettare.</p>\n\n<p>L&#8217;assistente IA è l&#8217;esempio più chiaro di che cosa questo garantisce. Legge i contenuti del vostro sito per rispondere a una domanda o preparare una modifica, e propone ciò che vuole fare come una scheda che potete leggere prima che accada qualunque cosa. Nulla di ciò che l&#8217;assistente propone ha effetto finché non lo approvate; scartate una proposta e nulla cambia. Una conversazione appartiene a chi l&#8217;ha avviata, e a nessun altro, nemmeno a un amministratore.</p>\n\n<p><a href=\"/learn/design-ai\">L&#8217;integrazione dell&#8217;IA</a> copre fornitori, budget e assistente per intero.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0003-7000-8000-000000000015": {
        "it": {
            "title": "Una ricerca che capisce",
            "fields": {
                "body": {
                    "value": "<p>Digitate nel campo di ricerca e i risultati compaiono nel browser all&#8217;istante, costruiti da un indice delle pagine pubblicate del sito; quella prima lista non fa mai un giro di andata e ritorno verso il server.</p>\n\n<p>Sopra a questo: il kernel può ampliare la vostra ricerca con termini collegati e trasmettere in streaming una breve sintesi scritta di ciò che ha trovato, entrambe le cose affidate al fornitore di IA che configurate. La ricerca funziona anche con JavaScript disattivato: la stessa richiesta viene inviata al server e torna come una normale pagina di risultati.</p>\n\n<p><a href=\"/learn/design-search\">L&#8217;architettura della ricerca</a> ha il progetto completo in quattro fasi.</p>",
                    "format": "filtered_html"
                }
            }
        }
    },
    "0193b000-0000-7000-8000-000000000001": {
        "it": {
            "title": "trovato",
            "fields": {
                "body": "<p class=\"front-hero__lede\">Un sistema di gestione dei contenuti scritto in Rust.</p>\n<p class=\"front-hero__sub\">Pensato per siti destinati a durare, con team che rivedono ogni modifica.</p>\n",
                "proof": "<section class=\"front-features\" aria-label=\"Le otto caratteristiche\">\n  <a class=\"feature-card\" href=\"/it/performance\">\n    <img src=\"/static/art/icon-performance.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Veloce a ogni scala</h2>\n    <p class=\"feature-card__text\">Rust fa funzionare sia il database sia la pagina, pensato per restare veloce da dieci pagine a dieci milioni.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/blog/what-a-plugin-may-reach\">\n    <img src=\"/static/art/icon-sandbox.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Sicuro fin dalla progettazione</h2>\n    <p class=\"feature-card__text\">Ogni plugin gira in una sandbox e raggiunge solo ciò che il suo manifesto dichiara.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/it/privacy\">\n    <img src=\"/static/art/icon-privacy.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">I vostri dati, decidete voi</h2>\n    <p class=\"feature-card__text\">Chiunque abbia un account può vedere tutto ciò che il sito conserva su di sé, esportarlo o cancellarlo.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/it/languages\">\n    <img src=\"/static/art/icon-languages.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Ogni lingua</h2>\n    <p class=\"feature-card__text\">Pagine, menu ed elenchi si leggono in tutte le lingue che decidete di pubblicare.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/it/ai\">\n    <img src=\"/static/art/icon-ai.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Un&#8217;IA che aspetta il vostro sì</h2>\n    <p class=\"feature-card__text\">Portate il vostro fornitore di IA e il vostro budget: nulla di ciò che scrive raggiunge il sito finché non lo approvate.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/it/ai-search\">\n    <img src=\"/static/art/icon-search.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Una ricerca che capisce</h2>\n    <p class=\"feature-card__text\">I risultati compaiono all&#8217;istante nel browser, con in più una sintesi scritta dall&#8217;IA.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/it/community\">\n    <img src=\"/static/art/banner-community.svg\" alt=\"\" aria-hidden=\"true\" width=\"640\" height=\"420\">\n    <h2 class=\"feature-card__title\">Aperto fino in fondo</h2>\n    <p class=\"feature-card__text\">Trovato è open source, la sua configurazione vive in file che si rivedono come il codice, e ogni funzione ha un&#8217;API JSON.</p>\n  </a>\n  <a class=\"feature-card\" href=\"/it/get-started\">\n    <img src=\"/static/art/icon-gather.svg\" alt=\"\" aria-hidden=\"true\" width=\"120\" height=\"120\">\n    <h2 class=\"feature-card__title\">Pensato per i redattori</h2>\n    <p class=\"feature-card__text\">Si installa in pochi minuti, si compongono pagine con blocchi riutilizzabili, e si creano elenchi senza scrivere codice.</p>\n  </a>\n</section>\n\n<section class=\"front-gallery\" aria-labelledby=\"front-gallery-heading\">\n  <h2 id=\"front-gallery-heading\">Che aspetto ha</h2>\n  <div class=\"front-gallery__grid\">\n    <figure>\n      <a href=\"/static/art/shot-installer.svg\">\n      <img src=\"/static/art/shot-installer.svg\" width=\"800\" height=\"520\"\n           alt=\"L&#8217;installazione: due campi, un pulsante, e poi è avviato.\">\n      </a>\n      <figcaption>Pronto e funzionante in pochi minuti.</figcaption>\n    </figure>\n    <figure>\n      <a href=\"/static/art/shot-terminal.svg\">\n      <img src=\"/static/art/shot-terminal.svg\" width=\"800\" height=\"440\"\n           alt=\"Un terminale: quattro righe, poi il sito è online.\">\n      </a>\n      <figcaption>Quattro comandi, ed è online.</figcaption>\n    </figure>\n    <figure>\n      <a href=\"/static/art/shot-admin-content.svg\">\n      <img src=\"/static/art/shot-admin-content.svg\" width=\"800\" height=\"520\"\n           alt=\"L&#8217;elenco dei contenuti nell&#8217;amministrazione: titoli, stage e date.\">\n      </a>\n      <figcaption>Ogni item, il suo stage, a colpo d&#8217;occhio.</figcaption>\n    </figure>\n    <figure>\n      <a href=\"/static/art/shot-gather-builder.svg\">\n      <img src=\"/static/art/shot-gather-builder.svg\" width=\"800\" height=\"520\"\n           alt=\"Il costruttore di query di Gather: filtri accanto a un&#8217;anteprima dal vivo.\">\n      </a>\n      <figcaption>Create elenchi senza scrivere SQL.</figcaption>\n    </figure>\n  </div>\n</section>\n"
            }
        }
    }
}
