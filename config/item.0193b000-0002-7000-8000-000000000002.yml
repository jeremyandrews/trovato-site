# A blog post: the capabilities reference the site needs and `/learn` cannot
# carry.
#
# `field_body`, not `body`: the blog content type is the kernel's trovato_blog
# plugin and that is the field name it declares.
#
# This lives here rather than under `/learn` on purpose. Everything at `/learn`
# is mirrored from the kernel repository at the tag in `docs_import.rs`, so a
# page that is not in a released and tagged kernel cannot appear there, and
# hand-adding one would put two provenances under a path prefix where every
# page currently has exactly one. The reference belongs in the kernel repository
# eventually, so that it versions with the contract it describes and arrives
# here through the mirror. Until then the front page needs something to link,
# and site-authored content ships without waiting for a release.
#
# Every fact here was read out of the kernel at v0.102.0: the interface list
# from `KNOWN_HOST_INTERFACES` in `crates/kernel/src/plugin/info_parser.rs`
# against the imports of `world plugin` in `crates/wit/kernel.wit`, the
# allowlist rule and the raw-SQL disposition from
# `crates/kernel/src/plugin/db_policy.rs`, and the linker behaviour from
# `register_declared` in `crates/kernel/src/host/mod.rs` with its test
# `register_declared_grants_only_named_subset` in
# `crates/kernel/tests/plugin_test.rs`.
