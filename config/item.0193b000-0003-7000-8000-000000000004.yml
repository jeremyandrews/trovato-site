    value: |
      <p>Trovato is a content management system written in Rust, and there are two ways in: Docker gets you a running site without installing Rust, and building from source is the way to go if you plan to change Trovato itself.</p>

      <h2>With Docker</h2>

      <p>This brings up PostgreSQL, Redis and Trovato together:</p>

      <pre><code>git clone https://github.com/jeremyandrews/trovato
      cd trovato
      cp .env.example .env
      docker compose --profile full up</code></pre>

      <p>Open <code>http://localhost:3001</code> and follow the installer. It asks for an administrator account and a site name, and then the site&#8217;s yours.</p>

      <figure>
      <img src="/static/docs/images/part-01/installer-welcome.png" width="1200" height="800" alt="The installer's welcome step, confirming PostgreSQL and Redis are connected and migrations have run, with a continue button.">
      <figcaption>The installer&#8217;s first screen, from <a href="/learn/tutorial-01-hello-trovato">the tutorial</a>: your databases, checked, before it asks you for anything.</figcaption>
      </figure>

      <p>The <code>full</code> profile is what starts the Trovato container. Without it, <code>docker compose up</code> starts only PostgreSQL and Redis, which is what you want when you run the server natively on port 3000.</p>

      <h2>From source</h2>

      <p>You need Rust, PostgreSQL 15 or newer, and Redis 7 or newer; CI tests on PostgreSQL 16. The toolchain is pinned in <code>rust-toolchain.toml</code>, so rustup fetches the right version for you. Clone the repository as in the Docker steps, then run:</p>

      <pre><code>docker compose up -d          # PostgreSQL and Redis
      cargo build --release
      cp .env.example .env
      cargo run --release --bin trovato</code></pre>

      <p>Migrations run on startup. Open <code>http://localhost:3000</code> and follow the installer. <a href="/learn/install">Installing Trovato</a> has the details, including running the databases without containers.</p>

      <h2>Then what</h2>

      <p><a href="/learn/building-your-first-site">Building your first site</a> walks through pages, a blog and navigation on a fresh install. <a href="/learn/tutorial-01-hello-trovato">The tutorial</a> goes further, with nine parts that build one real site from an empty database. Its last three cover translations and a REST API, production hardening (caching, file storage, metrics and tests), and AI and search. Part 2 is out of date because Ritrovo, the site the tutorial builds, moved to its own repository; <a href="/learn/known-issues">Known issues</a> explains.</p>

      <h2>Before you rely on it</h2>

      <p>Trovato isn&#8217;t at 1.0 yet. The plugin contract, what plugins and Trovato&#8217;s core agree on, is frozen, so a plugin you write now keeps working on every release before 1.0. The rest is still moving. There&#8217;s no plugin registry, some settings can only be changed by importing YAML, and migrations only move forward, so a failed upgrade is recovered from a backup.</p>

      <p><a href="/learn/known-issues">Known issues</a> lists what&#8217;s missing, and <a href="/why">Why Trovato</a> explains the design. Read both before you put a site you care about on it.</p>
