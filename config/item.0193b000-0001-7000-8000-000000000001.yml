fields:
  body:
    value: |
      <p>Trovato 0.101.0 (Trovato is a content management system written in Rust) adds a contact form, so a visitor can write to the site owner. It is a plugin, the first one that sends mail, and it can send only to the address the site has configured. Two smaller changes made it possible: a plugin can now serve its own pages inside the site&#8217;s theme, and it can serve a plain HTML form that works without JavaScript, with its security token in a hidden <code>_token</code> field. 0.100.0, released the same day, added <code>trovato_book</code>, which gives a set of pages an ordered hierarchy with previous, next and up links.</p>
      <p>0.101.0 adds to the plugin contract, what a plugin and the kernel (Trovato&#8217;s core) agree on, without changing anything already in it. A plugin built against 0.99 or 0.100 loads on 0.101 without rebuilding: the kernel accepts a plugin whose major version matches and whose minor version is no higher than its own.</p>
    format: filtered_html
  summary:
    value: The contact form, and nothing that breaks an existing plugin.
