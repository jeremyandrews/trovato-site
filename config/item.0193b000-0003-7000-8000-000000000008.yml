      <p>This site targets WCAG 2.2 AA.</p>

      <h2>Checked automatically on every build</h2>

      <ul>
      <li><strong>axe-core, an automated accessibility checker, on one page of each kind, in both colour schemes.</strong> The front page, a content page, the news and blog listings, the documentation index, a documentation page, the contact form, the search page, the log-in page and the Italian front page: twenty renders, checked against the WCAG 2.0 and 2.1 A and AA rules, the WCAG 2.2 AA rules, and axe&#8217;s best-practice rules. There&#8217;s no allowlist, and any violation fails the build.</li>
      <li><strong>Colour contrast.</strong> The test suite checks the colour pairings the site declares in its stylesheet, in both schemes: body text, muted text, links, control borders and focus rings against the page background and against the inset background, and button text against its fill. It also checks seven syntax highlighting colours against the code block background. The contrast test runs without a browser, so a failure shows up in <code>cargo test</code>.</li>
      <li><strong>Horizontal overflow.</strong> Every page in the check set is rendered at 360 and 1280 pixels wide, in both schemes, and the build fails if a page scrolls sideways at either width.</li>
      <li><strong>Unthemed elements.</strong> The same pass fails if any visible element has a background from the wrong colour scheme, which catches controls left at the browser default.</li>
      <li><strong>Off-site requests.</strong> The same pass records every request each page makes, including fonts, scripts and images, and fails if any of them leaves this site.</li>
      <li><strong>Structure.</strong> A crawl of every page reachable from the front page checks that each has a main landmark, a skip link and a labelled main navigation, and that no page came back as the raw fallback page that Trovato (the content management system this site runs on) serves when a template fails.</li>
      </ul>

      <h2>Built in on purpose</h2>

      <ul>
      <li>Every navigation region has its own label, which is how a screen reader tells them apart. The two search forms on the search page are labelled separately for the same reason.</li>
      <li>The current page is marked with <code>aria-current="page"</code>, so a screen reader announces which page you&#8217;re on.</li>
      <li>The narrow-screen menu is a native disclosure element. It opens by click or keyboard, announces whether it&#8217;s open, and works without JavaScript.</li>
      <li>Search works with JavaScript on or off. With it off, the search form sends your search to the server, which returns a page of results.</li>
      <li>The site name in the header is text inside the link, not an image&#8217;s alt text, so the link keeps its name in both colour schemes.</li>
      <li>A code block in the documentation copied in from Trovato&#8217;s repository takes keyboard focus and has a name, so you can scroll it without a mouse. Code blocks aren&#8217;t landmarks, because some documentation pages have dozens of them.</li>
      <li>Focus is always visible, with an outline that meets the contrast requirement for interface components in both colour schemes.</li>
      <li>Motion is small, and none of it loops. The front page plays one entrance animation, cards lift on hover, and page changes crossfade where the browser supports it. With reduced motion on, the entrance and the crossfade are off, and a card still shifts slightly on hover but no longer animates.</li>
      <li>Images are either the site&#8217;s own SVG drawings, which follow your colour scheme, or real screenshots from Trovato&#8217;s tutorial. Every screenshot has alt text that describes what it shows, and a drawing that only decorates a page is hidden from screen readers. All are served from this site.</li>
      <li>Long words and URLs wrap, and the page never widens. Code blocks don&#8217;t wrap; a long line scrolls inside the block&#8217;s own box.</li>
      </ul>

      <h2>Not checked yet, and known problems</h2>

      <ul>
      <li><strong>No one has tested this site with a screen reader yet</strong>, whether VoiceOver, NVDA or JAWS. Automated checks can find a missing label or poor contrast, but they can&#8217;t tell whether a page makes sense read aloud.</li>
      <li><strong>The contact form doesn&#8217;t tie its errors to its fields.</strong> After a failed submission, a list of errors appears above the form, but the fields carry no <code>aria-invalid</code> or <code>aria-describedby</code>, so a screen reader announces a problem without saying which field has it. The form comes from a plugin that ships with Trovato, so the fix belongs in Trovato itself.</li>
      <li><strong>No automated accessibility check submits a form.</strong> The accessibility pass loads each page and stops there, so errors that appear only after a submission go unchecked. The problem above was found by hand, and there may be others like it.</li>
      <li><strong>Keyboard navigation is only partly checked.</strong> Code blocks in the documentation pages are generated so they take keyboard focus, and a unit test checks that; the code blocks on this site&#8217;s own pages don&#8217;t take focus yet. No automated check opens the menu by keyboard, and the site hasn&#8217;t had a full keyboard walk-through.</li>
      </ul>

      <h2>Reporting a problem</h2>

      <p>If something here doesn&#8217;t work for you, use <a href="/contact">the contact form</a>. Say what you were using and what happened. A report that a page is hard to use is more useful than a report that a rule is broken, and both are welcome.</p>
