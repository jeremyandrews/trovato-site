      <p>Anyone with an account can comment.</p>

      <h2>What gets held</h2>

      <p>A comment from a new account is held and reviewed, and then published or not. Once an account has three approved comments, its new comments publish immediately.</p>

      <p>Once an AI provider is configured, review will be automated first and human second. A classifier will read each comment and return one of three verdicts: publish, hold for a person, or spam. It will run on every comment, including those from accounts that publish immediately, so a published comment could still be taken down later. No AI provider is configured today, so for now every held comment waits for a person to read it.</p>

      <h2>When the classifier can&#8217;t answer</h2>

      <p>If the classifier can&#8217;t return a verdict (no provider is configured, the provider is down, or the background job that runs the classifier fails on every retry), a held comment stays held until a person reviews it. No classifier failure publishes a comment. The site&#8217;s build checks this. Today, with no AI provider configured, classification jobs still run and every one of them fails, and the build relies on that: it posts a comment from an account with no approved comments yet and fails if that comment is published.</p>

      <h2>What gets removed</h2>

      <p>The maintainer removes spam, abuse aimed at a person, and comments that argue about moderation instead of the post they&#8217;re on. Questions about moderation belong in <a href="/contact">the contact form</a>.</p>

      <p>Disagreement is welcome. A comment can say that the design is wrong, that the project made a mistake, or that another CMS does this better, as long as it deals with what the post actually says.</p>

      <h2>Who decides</h2>

      <p>The maintainer makes the final call. There&#8217;s no appeals process, but if you think a decision was wrong, the contact form is the place to say so.</p>

      <h2>Where your comment goes</h2>

      <p>Today no comment leaves this server. When an AI provider is configured, each comment&#8217;s text, the ID of the page it&#8217;s on and the ID of the account that wrote it will be sent to that provider for classification. That will be the only place a comment goes outside this site. Every verdict the classifier returns will be logged with the comment&#8217;s ID. When a provider is added, this page will name it.</p>
