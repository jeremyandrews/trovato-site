# Every post, newest first, unpaged.
#
# The template groups by year. Gather has no grouping of its own — no GROUP BY,
# no aggregate — so grouping is a presentation decision made where presentation
# decisions belong, and the query stays one ordered list.
#
# `items_per_page: 200` with the pager off rather than a page size of zero: an
# archive is meant to be one document, and a cap that no plausible archive
# reaches is safer than no cap at all.
query_id: trovato_site.blog_archive
label: Archive
description: Every post on this site, by year.
definition:
  base_table: item
  item_type: blog
  fields: []
  filters: []
  includes: {}
  relationships: []
  sorts:
  - direction: desc
    field: created
    nulls: null
  stage_aware: true
display:
  canonical_url: /blog/archive
  empty_text: Nothing archived yet.
  footer: null
  format: list
  header: null
  items_per_page: 200
  pager:
    enabled: false
    show_count: false
    style: full
plugin: trovato_site
