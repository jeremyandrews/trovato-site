# Production.
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml \
#       --env-file .env.production up -d
#
# An override of docker-compose.yml rather than a second copy of it, so the thing
# that runs in production is the thing that was tested locally, plus these
# differences and no others.
#
# docs/DEPLOY.md is the procedure. This file is what it configures.
services:
  postgres:
    # Never published. Nothing outside this network has any business reaching it,
    # and the backup drill in DEPLOY.md runs inside the container.
    ports: !reset []
    # A restart is not a data-loss event: the volume is named in the base file and
    # is not removed by `docker compose down` without `-v`.
    restart: always

  redis:
    ports: !reset []
    restart: always

  site:
    restart: always
    # The kernel is not published, and this is load-bearing rather than tidiness.
    # The kernel believes X-Forwarded-For from an address in TRUSTED_PROXIES, and
    # the proxy is in that list. Anything else that could reach the kernel
    # directly could claim to be any client it liked and mint rate-limit buckets
    # without limit. Only the proxy listens.
    ports: !reset []
    environment:
      RUST_LOG: ${RUST_LOG:-info,tower_http=info,sqlx=warn}
      TRUSTED_PROXIES: ${PROXY_IP:-172.31.71.10}

  cron:
    restart: always

  proxy:
    image: caddy:2.10-alpine
    restart: always
    # 80 as well as 443: the certificate challenge needs it, and it is what
    # redirects a reader who typed the hostname without a scheme.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST must be set, for example trovato.rs}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set; it is where the certificate authority writes about expiry}
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - ./deploy/shared.caddy:/etc/caddy/shared.caddy:ro
      - ./static:/srv/public/static:ro
      # The certificates live here. Losing this volume means asking the
      # certificate authority for a new certificate on the next start, which is
      # fine until it is rate-limited.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: ${PROXY_IP:-172.31.71.10}
    depends_on:
      site:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
