name = "trovato_site"
description = "The trovato.rs website: the news content type and the front-page listing"
version = "0.1.0"
api_version = "0.105"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_item_info",
    "tap_item_access",
    "tap_item_view",
    "tap_perm",
    "tap_menu",
    "tap_api",
    "tap_cron",
]
weight = 0

# `query` runs Gather definitions for every read: the front page listing, the
# sitemap, /llms.txt and each documentation page's markdown. The kernel applies
# the viewer, the stage and the language, and gives each row its `url`.
# `item-api` lists items and reads, saves and deletes their translations, for
# the cron task that copies translations from configuration. `item_background`
# lets those calls run from cron, which has no user. `variables` reads the base URL and the translations.
# `logging` because the #[plugin_tap] macro uses it on its error paths, and a
# failed read should say so.
#
# The plugin declares no database access of its own.
[capabilities]
host_interfaces = ["logging", "variables", "query", "item-api"]
item_background = true
