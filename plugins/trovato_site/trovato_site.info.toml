name = "trovato_site"
description = "The trovato.rs website: the news content type and the front-page listing"
version = "0.1.0"
api_version = "0.101"
default_enabled = false
dependencies = []

[taps]
implements = [
    "tap_item_info",
    "tap_item_access",
    "tap_item_view",
    "tap_perm",
    "tap_menu",
    "tap_api",
    "tap_cron",
]
weight = 0

# `db` because the front page's listing of recent posts and the sitemap are both
# real queries against published content. `logging` because the #[plugin_tap]
# macro reaches for the logging import on its error paths, and because a query
# that fails should say so rather than render an empty page in silence.
# `variables` for one value: the site's base URL, which every absolute URL in the
# sitemap is built from and which a plugin cannot read from the environment.
#
# `db_tables` is this plugin's entire database reach. It owns no migrations, so
# the effective allowlist is exactly this list. `item` for the posts and the
# sitemap and `url_alias` for their friendly paths, both read-only;
# `item_translation` is the one table this plugin writes, and it writes nothing
# else anywhere. The kernel reads translations from that table and has no way to
# put a row in it on 0.101.0, so the site's translations are carried in config and
# brought across by tap_cron.
#
# `raw_sql` is declared because the listing is one ORDER BY over two content
# types joined to their aliases, with a LIMIT — not something the structured item
# API can express in one call.
[capabilities]
host_interfaces = ["db", "logging", "variables"]
db_tables = ["item", "url_alias", "item_translation"]
raw_sql = true
